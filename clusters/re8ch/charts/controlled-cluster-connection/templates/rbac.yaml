{{- range $grant := .Values.accessGrants }}
{{- if $grant.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $grant.roleRef.name }}
  labels:
    {{- include "controlled-cluster-connection.labels" $ | nindent 4 }}
rules:
  {{- toYaml $grant.rules | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $.Release.Name $grant.name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "controlled-cluster-connection.labels" $ | nindent 4 }}
  annotations:
    access.re8ch.com/identity-source: dex-oidc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $grant.roleRef.name }}
subjects:
  {{- range $subject := $grant.subjects }}
  - apiGroup: rbac.authorization.k8s.io
    kind: {{ $subject.kind }}
    name: {{ $subject.name | quote }}
  {{- end }}
{{- end }}
