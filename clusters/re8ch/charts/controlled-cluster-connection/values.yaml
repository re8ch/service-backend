cluster:
  name: ""
  owner: ""
  organizationBoundary: external
  apiEndpoint: ""

consumer:
  name: re8ch-headlamp
  oidcIssuer: https://dex.service.re8ch.com
  usernamePrefix: "oidc:"
  scopes: [openid, profile, email, groups]

contract:
  relationship: api-access-only
  dataPlaneSharing: prohibited
  credentialPolicy: oidc-no-static-credentials
  ownerRevocationAuthoritative: true

# No access is granted by default. Each grant is an owner-reviewed decision.
accessGrants: []

# Reviewable service publication metadata. This is displayed by AmongClusters;
# it does not create a Service, tunnel, credential, or data-plane connection.
sharedServices: []
