image:
  repository: docker.io/metacubex/mihomo
  tag: v1.19.29
  digest: sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
  pullPolicy: IfNotPresent

dataplane:
  enabled: true

nodeProxy:
  port: 17891
  controllerPort: 19090
  geoLabel: networking.re8ch.com/geo

exits:
  globalLabel: networking.re8ch.com/mihomo-exit
  cnLabel: networking.re8ch.com/mihomo-exit-cn
  port: 1080
  controllerPort: 19091
  # Keep every overseas exit as an independently health-checked Mihomo member.
  # Ordering is failover priority: prefer Los Angeles and retain Falkenstein as
  # the third candidate instead of excluding it with a region selector.
  globalCandidates:
    - {name: OVERSEAS-LA, node: overseas-la}
    - {name: OVERSEAS-LA-2, node: overseas-la-2}
    - {name: OVERSEAS-FLK, node: overseas-flk}

telemetry:
  enabled: true
  intervalSeconds: 900
  image: docker.1ms.run/library/python:3.12-alpine
  ipLookupUrl: https://ipinfo.io/json
  probes:
    cn:
      - {name: miui-204, url: "https://connect.rom.miui.com/generate_204", expectedStatus: 204}
      - {name: baidu, url: "https://www.baidu.com/"}
    global:
      - {name: google-204, url: "https://www.gstatic.com/generate_204", expectedStatus: 204}
      - {name: ghcr, url: "https://ghcr.io/v2/", expectedStatus: 401}

statusReaders:
  - {namespace: headlamp, serviceAccount: headlamp}
