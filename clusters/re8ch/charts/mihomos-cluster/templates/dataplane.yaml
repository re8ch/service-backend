apiVersion: v1
kind: ConfigMap
metadata: {name: mihomos-node-configs, namespace: {{ .Release.Namespace }}}
data:
  cn.yaml: |
    mixed-port: {{ .Values.nodeProxy.port }}
    external-controller: 0.0.0.0:{{ .Values.nodeProxy.controllerPort }}
    allow-lan: true
    mode: rule
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    proxies:
{{- range .Values.exits.globalCandidates }}
      - {name: {{ .name | quote }}, type: socks5, server: {{ .address | quote }}, port: {{ $.Values.exits.port }}}
{{- end }}
    proxy-groups:
      - name: GLOBAL
        type: fallback
        proxies: [{{ range $index, $candidate := .Values.exits.globalCandidates }}{{ if $index }}, {{ end }}{{ $candidate.name | quote }}{{ end }}]
        url: "https://www.gstatic.com/generate_204"
        interval: 30
        lazy: false
      # OAuth code exchange is a release-critical path. Probe the real GitHub
      # endpoint instead of assuming that a generic Google probe proves it.
      - name: GITHUB
        type: fallback
        proxies: [{{ range $index, $candidate := .Values.exits.globalCandidates }}{{ if $index }}, {{ end }}{{ $candidate.name | quote }}{{ end }}]
        url: "https://github.com/login/oauth/access_token"
        interval: 30
        lazy: false
    rules: ["IP-CIDR,192.0.2.203/8,DIRECT,no-resolve", "IP-CIDR,192.0.2.225/10,DIRECT,no-resolve", "IP-CIDR,192.0.2.179/12,DIRECT,no-resolve", "IP-CIDR,192.0.2.148/16,DIRECT,no-resolve", "DOMAIN,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,github.com,GITHUB", "DOMAIN-SUFFIX,githubusercontent.com,GITHUB", "DOMAIN-SUFFIX,cn,DIRECT", "RULE-SET,cn-ip,DIRECT", "MATCH,GLOBAL"]
  global.yaml: |
    mixed-port: {{ .Values.nodeProxy.port }}
    external-controller: 0.0.0.0:{{ .Values.nodeProxy.controllerPort }}
    allow-lan: true
    mode: rule
    ipv6: false
    dns:
      enable: true
      ipv6: false
      enhanced-mode: redir-host
      default-nameserver: [1.1.1.1, 8.8.8.8]
      nameserver:
        - https://1.1.1.1/dns-query#DIRECT
        - https://dns.google/dns-query#DIRECT
      nameserver-policy:
        "+.cn": [https://dns.alidns.com/dns-query#DIRECT, https://doh.pub/dns-query#DIRECT]
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    proxies:
{{- range .Values.exits.cnCandidates }}
      - {name: {{ .name | quote }}, type: socks5, server: {{ .address | quote }}, port: {{ $.Values.exits.port }}}
{{- end }}
    proxy-groups:
      - name: CN
        type: fallback
        proxies: [{{ range $index, $candidate := .Values.exits.cnCandidates }}{{ if $index }}, {{ end }}{{ $candidate.name | quote }}{{ end }}]
        url: "https://connectivitycheck.gstatic.com/generate_204"
        interval: 30
        lazy: false
    rules: ["IP-CIDR,192.0.2.203/8,DIRECT,no-resolve", "IP-CIDR,192.0.2.225/10,DIRECT,no-resolve", "IP-CIDR,192.0.2.179/12,DIRECT,no-resolve", "IP-CIDR,192.0.2.148/16,DIRECT,no-resolve", "DOMAIN,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,ipinfo.io,DIRECT", "DOMAIN-SUFFIX,cn,CN", "RULE-SET,cn-ip,CN", "MATCH,DIRECT"]
  exit.yaml: |
    mixed-port: {{ .Values.exits.port }}
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: direct
    rules: ["MATCH,DIRECT"]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: mihomos-cn-ip-rules, namespace: {{ .Release.Namespace }}}
data:
  cn-ip-rules.yaml: |
{{ .Files.Get "files/cn-ip-rules.yaml" | indent 4 }}
---
{{- if .Values.dataplane.enabled }}
{{- range $geo := list "cn" "global" }}
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: mihomos-node-{{ $geo }}, namespace: {{ $.Release.Namespace }}}
spec:
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: mihomos-node-{{ $geo }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mihomos-node-{{ $geo }}, app.kubernetes.io/component: node-proxy}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {networking.re8ch.com/geo: {{ $geo }}}
      tolerations: [{operator: Exists}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mihomo
          image: {{ include "mihomos-cluster.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [-d, /etc/mihomo]
          ports: [{name: mixed, containerPort: {{ $.Values.nodeProxy.port }}}, {name: controller, containerPort: {{ $.Values.nodeProxy.controllerPort }}}]
          readinessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/mihomo/config.yaml, subPath: {{ $geo }}.yaml, readOnly: true}
            - {name: cn-rules, mountPath: /etc/mihomo/rules, readOnly: true}
      volumes:
        - {name: config, configMap: {name: mihomos-node-configs}}
        - {name: cn-rules, configMap: {name: mihomos-cn-ip-rules}}
---
{{- end }}
{{- range $geo := list "cn" "global" }}
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: mihomos-{{ $geo }}-exit, namespace: {{ $.Release.Namespace }}}
spec:
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: mihomos-{{ $geo }}-exit}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mihomos-{{ $geo }}-exit}}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      nodeSelector:
        {{- if eq $geo "cn" }}
        networking.re8ch.com/mihomo-exit-cn: enabled
        {{- else }}
        networking.re8ch.com/mihomo-exit: enabled
        {{- end }}
      tolerations: [{operator: Exists}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: bind-private-node-address
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args: ['sed "s|0.0.0.0|${HOST_IP}|" /base/exit.yaml > /work/config.yaml']
          env: [{name: HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: config, mountPath: /base, readOnly: true}, {name: work, mountPath: /work}]
      containers:
        - name: mihomo
          image: {{ include "mihomos-cluster.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [-d, /etc/mihomo]
          ports: [{name: socks, containerPort: {{ $.Values.exits.port }}}]
          readinessProbe: {tcpSocket: {port: socks}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: work, mountPath: /etc/mihomo}]
      volumes: [{name: config, configMap: {name: mihomos-node-configs}}, {name: work, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mihomos-{{ $geo }}-exit, namespace: {{ $.Release.Namespace }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mihomos-{{ $geo }}-exit}
  ports: [{name: socks, port: {{ $.Values.exits.port }}, targetPort: socks}]
---
{{- end }}
{{- end }}
