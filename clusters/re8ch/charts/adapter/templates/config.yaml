apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adapter.fullname" . }}
  labels: {{ include "adapter.labels" . | nindent 4 }}
data:
  gateway.py: |
{{ .Files.Get "files/gateway.py" | indent 4 }}
  provider.py: |
{{ .Files.Get "files/provider.py" | indent 4 }}
  providers.json: {{ .Values.providers | toJson | quote }}

