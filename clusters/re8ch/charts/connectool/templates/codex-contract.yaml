apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-codex-plugins" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
  annotations:
    ai.re8ch.com/contract: codex-marketplace
data:
  marketplace.json: |
    {
      "name": {{ .Values.codex.marketplace.name | quote }},
      "interface": {"displayName": {{ .Values.codex.marketplace.displayName | quote }}},
      "plugins": [
      {{- range $index, $plugin := .Values.codex.plugins }}
        {{- if $index }},{{ end }}
        {"name": {{ $plugin.name | quote }}, "source": {"source": "local", "path": {{ printf "./plugins/%s" $plugin.name | quote }}}, "policy": {"installation": "AVAILABLE", "authentication": "ON_INSTALL"}, "category": {{ default "Productivity" $plugin.category | quote }}}
      {{- end }}
      ]
    }
  plugins.yaml: |
    apiVersion: ai.re8ch.com/v1alpha1
    kind: CodexPluginRegistrationList
    marketplace:
      name: {{ .Values.codex.marketplace.name | quote }}
      source: {{ .Values.codex.marketplace.source | quote }}
    plugins:
    {{- range $plugin := .Values.codex.plugins }}
      - name: {{ $plugin.name | quote }}
        publication: {{ $plugin.publication | quote }}
        mcpOwner: {{ $plugin.mcpOwner }}
        skills: {{ $plugin.skills | toJson }}
    {{- end }}
  {{- range $plugin := .Values.codex.plugins }}
  {{- if $plugin.mcpOwner }}
  {{ $publication := dict }}
  {{- range $.Values.toolhive.publications }}{{ if eq .name $plugin.publication }}{{ $publication = . }}{{ end }}{{ end }}
  {{ printf "%s.mcp.json" $plugin.name }}: |
    {{ dict "mcpServers" (dict $plugin.name (dict "type" "http" "url" $publication.resourceUrl "oauth" (dict "clientId" $publication.clientId) "scopes" $.Values.global.scopes)) | toJson }}
  {{- end }}
  {{- end }}
