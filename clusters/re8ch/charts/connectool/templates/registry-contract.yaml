{{- if .Values.toolhive.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-toolhive-registry" .Release.Name }}
  namespace: {{ .Values.toolhive.namespace }}
  labels:
    {{- include "connectool.labels" . | nindent 4 }}
  annotations:
    ai.re8ch.com/contract: toolhive-registry-values
data:
  values.yaml: |
    config:
      sources:
        {{- toYaml .Values.toolhive.registry.sources | nindent 8 }}
      registries:
        - name: {{ .Values.toolhive.registry.name | quote }}
          sources:
          {{- range .Values.toolhive.registry.sources }}
            - {{ .name | quote }}
          {{- end }}
{{- end }}
