apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: runtimeanalyses.anatomy.re8ch.com}
spec:
  group: anatomy.re8ch.com
  scope: Namespaced
  names:
    kind: RuntimeAnalysis
    listKind: RuntimeAnalysisList
    plural: runtimeanalyses
    singular: runtimeanalysis
    shortNames: [ra]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Pod, type: string, jsonPath: .spec.target.podName}
        - {name: Confidence, type: string, jsonPath: .status.correlation.confidence}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [target]
              properties:
                target:
                  type: object
                  required: [podName, containerName]
                  properties:
                    podName: {type: string, minLength: 1}
                    containerName: {type: string, minLength: 1}
                traceId:
                  type: string
                  pattern: '^[0-9a-f]{32}$'
                durationSeconds:
                  type: integer
                  minimum: 1
                  maximum: 900
                  default: 60
                volumes:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [mountPath]
                    properties:
                      mountPath: {type: string, pattern: '^/'}
                      claimName: {type: string}
                objectScopes:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [bucket]
                    properties:
                      endpoint: {type: string}
                      bucket: {type: string, minLength: 1}
                      prefix: {type: string, default: ''}
                      auditProvider: {type: string}
                evidencePolicy:
                  type: object
                  properties:
                    captureTextSnippets: {type: boolean, default: true}
                    maxSnippetBytes: {type: integer, minimum: 0, maximum: 4096, default: 4096}
                    maxSnippetCount: {type: integer, minimum: 0, maximum: 100, default: 100}
                    maxTotalSnippetBytes: {type: integer, minimum: 0, maximum: 1048576, default: 1048576}
                    retentionSeconds: {type: integer, minimum: 300, maximum: 604800, default: 86400}
                stop: {type: boolean, default: false}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
