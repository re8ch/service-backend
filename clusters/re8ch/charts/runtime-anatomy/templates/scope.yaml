{{- $spec := dict "lifecycle" .Values.scope.lifecycle "consistencyDefault" .Values.scope.consistencyDefault "maxCaptureSkew" .Values.scope.maxCaptureSkew "manifestStore" .Values.scope.manifestStore "storageBackends" .Values.storage.backends "stateClasses" .Values.stateClasses "images" .Values.images "integrations" .Values.integrations "credentials" .Values.credentials "observation" .Values.observation "retention" .Values.retention }}
{{- $scope := dict "apiVersion" "anatomy.re8ch.com/v1alpha1" "kind" "RuntimeScope" "metadata" (dict "name" .Values.scope.name) "spec" $spec }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runtime-anatomy.fullname" . }}-scope
  labels:
    {{- include "runtime-anatomy.labels" . | nindent 4 }}
    anatomy.re8ch.com/config-role: final-scope
  annotations:
    anatomy.re8ch.com/schema: anatomy.re8ch.com/runtime-scope-v1alpha1
    anatomy.re8ch.com/ownership-boundary: consumer-only
data:
  scope.yaml: |
{{ toYaml $scope | indent 4 }}
  scope.json: |
{{ toPrettyJson $scope | indent 4 }}
