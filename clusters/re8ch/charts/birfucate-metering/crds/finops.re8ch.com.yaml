apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consumptionbindings.finops.re8ch.com
spec:
  group: finops.re8ch.com
  scope: Namespaced
  names:
    plural: consumptionbindings
    singular: consumptionbinding
    kind: ConsumptionBinding
    shortNames:
    - cbind
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    selectableFields:
    - jsonPath: .spec.tenantRef
    - jsonPath: .spec.serviceInstanceRef
    - jsonPath: .spec.consumableRef
    additionalPrinterColumns:
    - name: Tenant
      type: string
      jsonPath: .spec.tenantRef
    - name: Instance
      type: string
      jsonPath: .spec.serviceInstanceRef
    - name: Consumable
      type: string
      jsonPath: .spec.consumableRef
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - tenantRef
            - serviceInstanceRef
            - consumableRef
            - shardRefs
            - planRef
            - quota
            - access
            - startsAt
            properties:
              tenantRef:
                type: string
                minLength: 1
              serviceInstanceRef:
                type: string
                minLength: 1
              consumableRef:
                type: string
                minLength: 1
              shardRefs:
                type: array
                minItems: 1
                items:
                  type: string
              planRef:
                type: string
                minLength: 1
              quota:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              access:
                type: object
                required:
                - type
                properties:
                  type:
                    type: string
                    enum:
                    - Workload
                    - Grafana
                    - Harbor
                    - Ceph
                    - Cilium
                    - PostgreSQL
                    - ModelGateway
                    - Sandbox
                  grafana:
                    type: object
                    properties:
                      organizationRef:
                        type: string
                      role:
                        type: string
                        enum:
                        - Viewer
                        - Editor
                      folderRefs:
                        type: array
                        items:
                          type: string
                      datasourceRefs:
                        type: array
                        minItems: 1
                        items:
                          type: string
                  harbor:
                    type: object
                    properties:
                      project:
                        type: string
                      permission:
                        type: string
                        enum:
                        - pull
                        - build-push
                        - project-admin
                      quotaGiB:
                        type: integer
                        minimum: 1
                      robotDurationDays:
                        type: integer
                        minimum: 1
                        maximum: 365
                  ceph:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                        - RBD
                        - CephFS
                        - S3
                      storageClassName:
                        type: string
                      capacityGiB:
                        type: integer
                        minimum: 1
                      accessModes:
                        type: array
                        items:
                          type: string
                          enum:
                          - ReadWriteOnce
                          - ReadOnlyMany
                          - ReadWriteMany
                      bucketClass:
                        type: string
                  cilium:
                    type: object
                    properties:
                      namespaceRef:
                        type: string
                      connectivity:
                        type: string
                        enum:
                        - ClusterLocal
                        - CrossCluster
                        - PublicEdge
                      destinationClusters:
                        type: array
                        items:
                          type: string
                      bandwidthMbps:
                        type: integer
                        minimum: 1
                      gatewayClassRef:
                        type: string
                  parameters:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              startsAt:
                type: string
                format: date-time
              endsAt:
                type: string
                format: date-time
              sourceClusterRef:
                type: string
              destinationClusterRef:
                type: string
              clusterConnectionRef:
                type: string
                minLength: 1
            x-kubernetes-validations:
            - rule: '!has(self.endsAt) || timestamp(self.endsAt) > timestamp(self.startsAt)'
              message: endsAt must be later than startsAt
            - rule: self.access.type != 'Grafana' || has(self.access.grafana)
              message: Grafana access requires grafana parameters
            - rule: self.access.type != 'Harbor' || has(self.access.harbor)
              message: Harbor access requires harbor parameters
            - rule: self.access.type != 'Ceph' || has(self.access.ceph)
              message: Ceph access requires ceph parameters
            - rule: self.access.type != 'Cilium' || has(self.access.cilium)
              message: Cilium access requires cilium parameters
            - rule: self.access.type != 'Cilium' || self.access.cilium.connectivity
                != 'CrossCluster' || has(self.clusterConnectionRef)
              message: CrossCluster Cilium access requires a Ready same-tenant ClusterConnection
                reference
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
