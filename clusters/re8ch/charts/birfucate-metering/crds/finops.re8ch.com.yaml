apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consumables.finops.re8ch.com
spec:
  group: finops.re8ch.com
  scope: Cluster
  names:
    plural: consumables
    singular: consumable
    kind: Consumable
    shortNames:
    - con
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    selectableFields:
    - jsonPath: .spec.lifecycle
    - jsonPath: .spec.serviceClass
    additionalPrinterColumns:
    - name: Class
      type: string
      jsonPath: .spec.serviceClass
    - name: Lifecycle
      type: string
      jsonPath: .spec.lifecycle
    - name: Owner
      type: string
      jsonPath: .spec.owner
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - serviceClass
            - owner
            - lifecycle
            - supportBoundary
            - accessContract
            - allowedWorkloadKinds
            - meters
            properties:
              serviceClass:
                type: string
                minLength: 1
                maxLength: 128
              owner:
                type: string
                minLength: 1
                maxLength: 128
              lifecycle:
                type: string
                enum:
                - Draft
                - Approved
                - Suspended
              supportBoundary:
                type: string
                minLength: 1
                maxLength: 1024
              sloRef:
                type: string
                maxLength: 253
              endpointClass:
                type: string
                enum:
                - TenantSafe
                - InternalAdmin
                - None
                default: None
              authenticationProxyRef:
                type: string
                minLength: 1
                default: tenant
              accessContract:
                type: object
                required:
                - type
                - isolationUnit
                - provisioner
                properties:
                  type:
                    type: string
                    enum:
                    - Workload
                    - Grafana
                    - Harbor
                    - Ceph
                    - Cilium
                    - PostgreSQL
                    - ModelGateway
                    - Sandbox
                  isolationUnit:
                    type: string
                    minLength: 1
                  isolationBoundary:
                    type: string
                    minLength: 1
                  isolationMechanism:
                    type: string
                    minLength: 1
                  provisioner:
                    type: string
                    minLength: 1
                  tenantEndpoint:
                    type: string
                  credentialDelivery:
                    type: string
                    enum:
                    - None
                    - OIDC
                    - BrokerReference
                    - KubernetesSecretReference
                  requestFields:
                    type: array
                    items:
                      type: string
                  grantedResources:
                    type: array
                    items:
                      type: string
                  revocation:
                    type: string
                    minLength: 1
              allowedWorkloadKinds:
                type: array
                minItems: 1
                items:
                  type: string
                  enum:
                  - Deployment
                  - StatefulSet
                  - DaemonSet
                  - Job
                  - CronJob
                  - NuclioFunction
                  - PersistentVolumeClaim
                  - CubeSandbox
              meters:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - name
                  - unit
                  - source
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z][a-z0-9_]*$
                    unit:
                      type: string
                      minLength: 1
                    source:
                      type: string
                      minLength: 1
            x-kubernetes-validations:
            - rule: self.lifecycle != 'Approved' || (self.owner.size() > 0 && self.meters.size()
                > 0 && self.endpointClass != 'InternalAdmin')
              message: Approved consumables require an owner, meters, and a non-admin
                endpoint
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
