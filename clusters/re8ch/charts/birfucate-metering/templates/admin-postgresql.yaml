{{- if and .Values.tenantPlatform.enabled .Values.tenantPlatform.provider.enabled }}
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantServiceInstance
metadata:
  name: postgresql-shared
  namespace: tenant-infrastructure
  labels:
    app.kubernetes.io/part-of: birfucate-metering
    tenancy.re8ch.com/tenant: admin
  annotations:
    tenancy.re8ch.com/idempotency-key: admin-postgresql-adoption-v1
spec:
  tenantRef: admin
  serviceClass: database.postgresql.shared.v1
  plan: standard
  lifecycle: Requested
  parameters: {}
{{- end }}
