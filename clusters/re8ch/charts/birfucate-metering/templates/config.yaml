apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "birfucate-metering.fullname" . }}
  labels: {{- include "birfucate-metering.labels" . | nindent 4 }}
data:
  config.json: |
    {{- dict "collectionIntervalSeconds" .Values.collectionIntervalSeconds "lookbackSeconds" .Values.lookbackSeconds "browserAPI" .Values.browserAPI "prometheus" .Values.prometheus "opencost" .Values.opencost "pricing" .Values.pricing "usageSink" (omit .Values.usageSink "existingSecret" "tokenKey") "outbox" .Values.outbox "tenantLabels" .Values.tenantLabels "meters" .Values.meters | toJson | nindent 4 }}
  collector.py: |
{{ .Files.Get "files/collector.py" | indent 4 }}
  discovery.json: |
    {{- dict "intervalSeconds" .Values.discovery.intervalSeconds "clusterRef" .Values.discovery.clusterRef "regionRef" .Values.discovery.regionRef "classifications" .Values.discovery.classifications | toJson | nindent 4 }}
  controller.py: |
{{ .Files.Get "files/controller.py" | indent 4 }}
