apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "birfucate-metering.fullname" . }}
  labels: {{- include "birfucate-metering.labels" . | nindent 4 }}
data:
  config.json: |
    {{- dict "collectionIntervalSeconds" .Values.collectionIntervalSeconds "lookbackSeconds" .Values.lookbackSeconds "prometheus" .Values.prometheus "opencost" .Values.opencost "usageSink" (omit .Values.usageSink "existingSecret" "tokenKey") "outbox" .Values.outbox "tenantLabels" .Values.tenantLabels "meters" .Values.meters | toJson | nindent 4 }}
  collector.py: |
{{ .Files.Get "files/collector.py" | indent 4 }}
