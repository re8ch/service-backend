{{- if .Values.vmServiceScrape.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "birfucate-metering.fullname" . }}
  labels: {{- include "birfucate-metering.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "birfucate-metering.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints: [{port: metrics, path: /metrics, interval: {{ .Values.vmServiceScrape.interval }}}]
{{- end }}
{{- if and .Values.vmServiceScrape.enabled .Values.serviceMonitor.enabled }}
---
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "birfucate-metering.fullname" . }}
  labels: {{- include "birfucate-metering.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "birfucate-metering.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints: [{port: metrics, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}]
{{- end }}
