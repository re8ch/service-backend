{{- if .Values.discovery.enabled }}
apiVersion: finops.re8ch.com/v1alpha1
kind: Tenant
metadata:
  name: admin
  labels: {finops.re8ch.com/protected: "true"}
spec:
  role: Admin
  identityRef: tenant-admin
  subjectSelectors:
    - {claim: group, value: re8ch:tenant-admins}
  allowedConsumables: ["*"]
{{- end }}
