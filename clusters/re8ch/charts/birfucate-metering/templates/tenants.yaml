{{- if .Values.discovery.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.finops.re8ch.com
  labels: {{- include "birfucate-metering.labels" . | nindent 4 }}
spec:
  group: finops.re8ch.com
  scope: Cluster
  names: {plural: tenants, singular: tenant, kind: Tenant, shortNames: [tnt]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      selectableFields:
        - {jsonPath: .spec.role}
        - {jsonPath: .spec.identityRef}
      additionalPrinterColumns:
        - {name: Role, type: string, jsonPath: .spec.role}
        - {name: Identity, type: string, jsonPath: .spec.identityRef}
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [role, identityRef]
              properties:
                role: {type: string, enum: [Admin, Tenant]}
                identityRef: {type: string, minLength: 1}
                subjectSelectors:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [claim, value]
                    properties:
                      claim: {type: string, enum: [sub, email, group]}
                      value: {type: string, minLength: 1}
                allowedConsumables:
                  type: array
                  items: {type: string}
              x-kubernetes-validations:
                - rule: "self.role != 'Admin' || self.identityRef == 'tenant-admin'"
                  message: The Admin tenant must use the protected tenant-admin identity
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: finops.re8ch.com/v1alpha1
kind: Tenant
metadata:
  name: admin
  labels: {finops.re8ch.com/protected: "true"}
spec:
  role: Admin
  identityRef: tenant-admin
  subjectSelectors:
    - {claim: group, value: re8ch:tenant-admins}
  allowedConsumables: ["*"]
{{- end }}
