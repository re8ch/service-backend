{{- if .Values.tenantPlatform.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tenant-control-controller}
rules:
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenants, tenantnamespaces, tenantidentitybindings, tenantgrants, tenantserviceinstances]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenants/status, tenantnamespaces/status, tenantidentitybindings/status, tenantgrants/status, tenantserviceinstances/status]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # Kubernetes prevents delegated RBAC creation unless the reconciler may
  # escalate/bind the exact roles it owns. Keep both exceptions name-scoped.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles]
    resourceNames: [tenant-native-owner]
    verbs: [escalate, bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [tenant-resource-provisioner]
    verbs: [bind]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [peering.re8ch.com]
    resources: [peers, authenticatedlinks, peerpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: tenant-control-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-control-controller}
subjects: [{kind: ServiceAccount, name: tenant-control-controller, namespace: tenant-infrastructure}]
---
# Bound as a RoleBinding only inside declared tenant runtime namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tenant-resource-provisioner}
rules:
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenantresourceclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenantresourceclaims/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector: {matchLabels: {app: tenant-control-controller}}
  template:
    metadata: {labels: {app: tenant-control-controller, saas.re8ch.com/tenant: platform}}
    spec:
      serviceAccountName: tenant-control-controller
      tolerations: {{- toYaml .Values.tenantPlatform.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: {{ .Values.tenantPlatform.placement.nodeNames | toJson }}}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: tenant-control-controller}}
              topologyKey: kubernetes.io/hostname
      imagePullSecrets: [{name: harbor-registry-pull}]
      containers:
        - name: controller
          image: {{ .Values.tenantPlatform.image | quote }}
          command: [python, /app/tenant_control_controller.py]
          envFrom:
            - {secretRef: {name: tenant-registry-supply-chain, optional: true}}
            - {secretRef: {name: tenant-claim-internal-auth, optional: true}}
          env:
            - {name: LISTEN_PORT, value: "19447"}
            - {name: IMAGE_POLICY_URL, value: "http://harbor-supply-chain.tenant-infrastructure.svc"}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          ports: [{name: http, containerPort: 19447}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 3, periodSeconds: 15, timeoutSeconds: 3}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec: {trafficDistribution: PreferSameNode, selector: {app: tenant-control-controller}, ports: [{name: http, port: 80, targetPort: http}]}
---
{{- if .Values.tenantPlatform.provider.enabled }}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.tenantPlatform.provider.image) }}
{{- fail "tenantPlatform.provider.image must be pinned to a verified sha256 digest" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-provider-reconciler, namespace: tenant-infrastructure}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tenant-provider-reconciler}
rules:
  - {apiGroups: [tenancy.re8ch.com], resources: [tenantserviceinstances, tenants, tenantgrants], verbs: [get, list]}
  - {apiGroups: [tenancy.re8ch.com], resources: [tenantserviceinstances/status], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: tenant-provider-reconciler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-provider-reconciler}
subjects: [{kind: ServiceAccount, name: tenant-provider-reconciler, namespace: tenant-infrastructure}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-provider-harbor-read, namespace: ai-operations}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [cluster-infra-harbor], verbs: [get]}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [harbor-tenant-catalog], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-provider-harbor-read, namespace: ai-operations}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-provider-harbor-read}
subjects: [{kind: ServiceAccount, name: tenant-provider-reconciler, namespace: tenant-infrastructure}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-provider-grafana-read, namespace: observability-system}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [re8ch-grafana-admin], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-provider-grafana-read, namespace: observability-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-provider-grafana-read}
subjects: [{kind: ServiceAccount, name: tenant-provider-reconciler, namespace: tenant-infrastructure}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-provider-credential-write, namespace: credential-broker}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get, create]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-provider-credential-write, namespace: credential-broker}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-provider-credential-write}
subjects: [{kind: ServiceAccount, name: tenant-provider-reconciler, namespace: tenant-infrastructure}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-provider-reconciler, namespace: tenant-infrastructure}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tenant-provider-reconciler}}
  template:
    metadata: {labels: {app: tenant-provider-reconciler, saas.re8ch.com/tenant: platform}}
    spec:
      serviceAccountName: tenant-provider-reconciler
      imagePullSecrets: [{name: harbor-registry-pull}]
      tolerations: {{- toYaml .Values.tenantPlatform.tolerations | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: {{ .Values.tenantPlatform.placement.nodeNames | toJson }}}
      containers:
        - name: reconciler
          image: {{ .Values.tenantPlatform.provider.image | quote }}
          command: [python, /app/tenant_provider_reconciler.py]
          env:
            - {name: IDENTITY_REST_URL, value: "http://supabase-identity-rest.supabase-identity.svc:3000"}
            - {name: IDENTITY_SERVICE_KEY, valueFrom: {secretKeyRef: {name: tenant-provider-identity, key: service-role-key}}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec: {minAvailable: 1, selector: {matchLabels: {app: tenant-control-controller}}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: tenant-runtime-image-cache, namespace: tenant-infrastructure}
spec:
  selector: {matchLabels: {app: tenant-runtime-image-cache}}
  template:
    metadata: {labels: {app: tenant-runtime-image-cache}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: {{ .Values.tenantPlatform.placement.nodeNames | toJson }}}
      imagePullSecrets: [{name: harbor-registry-pull}]
      automountServiceAccountToken: false
      initContainers:
        - name: pull
          image: {{ .Values.tenantPlatform.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "true"]
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10.1
          resources: {requests: {cpu: 1m, memory: 2Mi}, limits: {cpu: 5m, memory: 8Mi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-control-controller}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {tenant-runtime: "true"}}}]
      ports: [{protocol: TCP, port: 19447}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: toolhive-system}}
          podSelector: {matchLabels: {tenant-runtime: "true"}}
      ports: [{protocol: TCP, port: 19447}]
{{- end }}
