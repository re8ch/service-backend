{{- if and .Values.tenantPlatform.enabled .Values.tenantPlatform.invocationCredentials.enabled }}
apiVersion: v1
kind: Secret
metadata: {name: tenant-invocation-signing, namespace: tenant-infrastructure}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata: {name: tenant-invocation-authority, namespace: tenant-infrastructure}
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-invocation-credential-rotator, namespace: supabase-billing}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-invocation-credential-rotator, namespace: tenant-infrastructure}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tenant-invocation-signing, tenant-invocation-authority]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-invocation-credential-rotator, namespace: tenant-infrastructure}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-invocation-credential-rotator}
subjects: [{kind: ServiceAccount, name: tenant-invocation-credential-rotator, namespace: supabase-billing}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tenant-invocation-credential-rotator, namespace: supabase-billing}
data:
  rotate.py: |
    import base64, hashlib, hmac, json, os, ssl, time, urllib.request, uuid
    from cryptography.hazmat.primitives import serialization
    from cryptography.hazmat.primitives.asymmetric import rsa

    def b64(value): return base64.urlsafe_b64encode(value).rstrip(b"=").decode()
    token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    context = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
    api = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')
    headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}

    def get(name):
      request = urllib.request.Request(api + '/api/v1/namespaces/tenant-infrastructure/secrets/' + name, headers=headers)
      with urllib.request.urlopen(request, context=context, timeout=10) as response: return json.load(response)
    def patch(name, data, annotations):
      body = json.dumps({'metadata': {'annotations': annotations}, 'data': data}).encode()
      request = urllib.request.Request(api + '/api/v1/namespaces/tenant-infrastructure/secrets/' + name,
        data=body, method='PATCH', headers={**headers, 'Content-Type': 'application/merge-patch+json'})
      with urllib.request.urlopen(request, context=context, timeout=10): pass

    now = int(time.time())
    secret = get('tenant-invocation-signing')
    ring = None
    try: ring = json.loads(base64.b64decode(secret.get('data', {}).get('key-ring.json', '')).decode())
    except Exception: pass
    current = next((k for k in (ring or {}).get('keys', []) if k.get('kid') == (ring or {}).get('currentKid')), None)
    rotate = not current or now - int(current.get('createdAt', 0)) >= 23 * 86400
    if rotate:
      previous = []
      if current:
        private = serialization.load_pem_private_key(current['privateKeyPem'].encode(), password=None)
        previous.append({'kid': current['kid'], 'createdAt': current['createdAt'],
          'retireAfter': now + 7 * 86400,
          'publicKeyPem': private.public_key().public_bytes(serialization.Encoding.PEM,
            serialization.PublicFormat.SubjectPublicKeyInfo).decode()})
      previous += [k for k in (ring or {}).get('keys', []) if k.get('publicKeyPem') and int(k.get('retireAfter', 0)) > now]
      key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
      kid = time.strftime('inv-%Y%m%d-', time.gmtime(now)) + uuid.uuid4().hex[:12]
      current = {'kid': kid, 'createdAt': now, 'privateKeyPem': key.private_bytes(
        serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()).decode()}
      ring = {'currentKid': kid, 'keys': [current] + previous[:1]}
      patch('tenant-invocation-signing', {'key-ring.json': base64.b64encode(json.dumps(ring, separators=(',', ':')).encode()).decode()},
        {'re8ch.com/current-kid': kid, 're8ch.com/rotated-at': str(now), 're8ch.com/rotation-overlap': '7d'})

    root = os.environ['BILLING_JWT_SECRET'].encode()
    header = b64(b'{"alg":"HS256","typ":"JWT"}')
    payload = b64(json.dumps({'role': 'billing_commerce_runtime', 'iat': now, 'exp': now + 36 * 3600,
      'jti': str(uuid.uuid4()), 'iss': 'tenant-invocation-credential-rotator'}, separators=(',', ':')).encode())
    signature = b64(hmac.new(root, (header + '.' + payload).encode(), hashlib.sha256).digest())
    patch('tenant-invocation-authority', {'BINDING_AUTHORITY_TOKEN': base64.b64encode((header + '.' + payload + '.' + signature).encode()).decode()},
      {'re8ch.com/rotated-at': str(now), 're8ch.com/expires-at': str(now + 36 * 3600), 're8ch.com/role': 'billing_commerce_runtime'})
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: tenant-invocation-credential-rotator, namespace: supabase-billing}
spec:
  schedule: {{ .Values.tenantPlatform.invocationCredentials.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: tenant-invocation-credential-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotate
              image: {{ .Values.tenantPlatform.image | quote }}
              command: [python3, /app/rotate.py]
              env:
                - name: BILLING_JWT_SECRET
                  valueFrom: {secretKeyRef: {name: supabase-billing-secrets, key: JWT_SECRET}}
              volumeMounts: [{name: script, mountPath: /app/rotate.py, subPath: rotate.py, readOnly: true}]
              resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumes: [{name: script, configMap: {name: tenant-invocation-credential-rotator, defaultMode: 292}}]
{{- end }}
