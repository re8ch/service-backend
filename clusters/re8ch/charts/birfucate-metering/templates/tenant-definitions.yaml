{{- if .Values.tenantPlatform.enabled }}
{{- range $tenant := .Values.tenantPlatform.tenants }}
apiVersion: tenancy.re8ch.com/v1alpha1
kind: Tenant
metadata:
  name: {{ $tenant.name }}
  labels: {app.kubernetes.io/part-of: birfucate-metering}
spec:
  displayName: {{ $tenant.displayName | quote }}
  lifecycle: {{ $tenant.lifecycle }}
  deletionPolicy: {{ $tenant.deletionPolicy }}
  runtimeNamespaceRef: {{ $tenant.runtimeNamespaceRef }}
  imagePullSecretRef: {{ $tenant.imagePullSecretRef }}
  harborProjectRef: {{ $tenant.harborProjectRef }}
  visibility: {{ default "Private" $tenant.visibility }}
  hostingMode: {{ default "platform-managed" $tenant.hostingMode }}
  byocAllowed: {{ default false $tenant.byocAllowed }}
  businessNamespaces:
{{- range $namespace := (default (list $tenant.runtimeNamespaceRef) $tenant.businessNamespaces) }}
    - {{ $namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-resource-provisioner
  namespace: {{ $tenant.runtimeNamespaceRef }}
  labels:
    app.kubernetes.io/part-of: birfucate-metering
    tenancy.re8ch.com/tenant: {{ $tenant.name }}
subjects:
  - kind: ServiceAccount
    name: tenant-control-controller
    namespace: tenant-infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-resource-provisioner
{{- if $tenant.nativeAccess }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-native-operator
  namespace: {{ $tenant.runtimeNamespaceRef }}
  labels: {tenancy.re8ch.com/tenant: {{ $tenant.name }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-native-owner
  namespace: {{ $tenant.runtimeNamespaceRef }}
  labels: {tenancy.re8ch.com/tenant: {{ $tenant.name }}}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, services, endpoints, persistentvolumeclaims, configmaps, secrets, serviceaccounts, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-native-owner
  namespace: {{ $tenant.runtimeNamespaceRef }}
  labels: {tenancy.re8ch.com/tenant: {{ $tenant.name }}}
subjects:
{{- range $binding := $tenant.identityBindings }}
{{- if or (eq $binding.role "admin") (eq $binding.role "operator") }}
  - {apiGroup: rbac.authorization.k8s.io, kind: Group, name: {{ $binding.group | quote }}}
{{- end }}
{{- end }}
  - {kind: ServiceAccount, name: tenant-native-operator, namespace: {{ $tenant.runtimeNamespaceRef }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-native-owner}
{{- end }}
{{- range $binding := $tenant.identityBindings }}
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantIdentityBinding
metadata: {name: {{ $binding.name }}}
spec:
  tenantRef: {{ $tenant.name }}
  issuer: {{ $binding.issuer }}
  group: {{ $binding.group | quote }}
  role: {{ $binding.role }}
  revoked: false
{{- end }}
---
{{- range $grant := $tenant.grants }}
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantGrant
metadata: {name: {{ $grant.name }}}
spec:
  tenantRef: {{ $tenant.name }}
  consumableRef: {{ $grant.consumableRef }}
  roleRef: {{ $grant.roleRef }}
  lifecycle: {{ $grant.lifecycle }}
---
{{- end }}
---
{{- end }}
{{- end }}
