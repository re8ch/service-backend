apiVersion: v1
kind: ServiceAccount
metadata: {name: admin-api, namespace: tenant-infrastructure}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin-api, namespace: tenant-infrastructure, labels: {re8ch.com/publication-stage: release-gated, ai.connectool.io/mcp-backend: "true"}}
spec:
  replicas: 1
  # Both runtimes share one RWO SQLite state volume. Recreate prevents a surge
  # pod from racing the existing writer while the pair moves between nodes.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: admin-api}}
  template:
    metadata: {labels: {app: admin-api, tenant-runtime: "true", saas.re8ch.com/tenant: platform, ai.connectool.io/mcp-backend: "true"}}
    spec:
      serviceAccountName: admin-api
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: {{ .Values.tenantPlatform.placement.nodeNames | toJson }}}
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: tenant-api}}
                topologyKey: kubernetes.io/hostname
      tolerations: {{- toYaml .Values.tenantPlatform.tolerations | nindent 8 }}
      imagePullSecrets: [{name: harbor-registry-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runtime
          image: {{ .Values.tenantPlatform.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: RE8CH_TOOL_PROFILE, value: admin}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-platform-admin}
            - {name: SERVICE_API_TOKEN, valueFrom: {secretKeyRef: {name: admin-vmcp-backend-auth, key: token}}}
            - {name: LISTEN_PORT, value: "19449"}
            - {name: PUBLIC_MCP_URL, value: "https://admin.re8ch.com:8443/mcp"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://admin.re8ch.com:8443/.well-known/oauth-protected-resource/mcp"}
            - {name: TENANT_CONTROL_URL, value: "http://tenant-control-controller.tenant-infrastructure.svc"}
            - {name: AUTH_DISCOVERY_URL, value: "https://api.re8ch.com/auth/.well-known/openid-configuration"}
            - {name: DEX_USERINFO_URL, value: "https://api.re8ch.com/auth/userinfo"}
            - {name: TENANT_SERVICE_DB, value: /var/lib/tenant-platform/tenant-services.db}
            - {name: DEVICE_REGISTRY_PATH, value: /var/lib/tenant-platform/admin-devices.db}
            {{- if .Values.tenantPlatform.tenantAPI.enabled }}
            - {name: DYNAMIC_SKILL_ADMIN_URL, value: "http://tenant-api.tenant-infrastructure.svc:19450/internal/dynamic-skills"}
            {{- end }}
          envFrom:
            - {secretRef: {name: tenant-claim-internal-auth, optional: false}}
          ports: [{name: http, containerPort: 19449}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 3}
          # readiness() checks Dex and the tenant authorizer serially with
          # three-second client budgets, so the probe must not impose the
          # Kubernetes one-second default on the aggregate operation.
          readinessProbe: {httpGet: {path: /readyz, port: http}, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 3, periodSeconds: 15, timeoutSeconds: 3}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: runtime-state, mountPath: /var/lib/tenant-platform}]
      volumes: [{name: runtime-state, persistentVolumeClaim: {claimName: tenant-platform-state}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-api, namespace: tenant-infrastructure, labels: {re8ch.com/publication-stage: release-gated, ai.connectool.io/mcp-backend: "true"}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tenant-api}}
  template:
    metadata: {labels: {app: tenant-api, tenant-runtime: "true", saas.re8ch.com/tenant: platform, ai.connectool.io/mcp-backend: "true"}}
    spec:
      terminationGracePeriodSeconds: 75
      serviceAccountName: tenant-api
      automountServiceAccountToken: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: {{ .Values.tenantPlatform.placement.nodeNames | toJson }}}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: admin-api}}
              topologyKey: kubernetes.io/hostname
      tolerations: {{- toYaml .Values.tenantPlatform.tolerations | nindent 8 }}
      imagePullSecrets: [{name: harbor-registry-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runtime
          image: {{ ternary .Values.tenantPlatform.tenantAPI.image .Values.tenantPlatform.image .Values.tenantPlatform.tenantAPI.enabled | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - {secretRef: {name: tenant-claim-internal-auth, optional: false}}
            - {secretRef: {name: tenant-registry-supply-chain, optional: true}}
            - {secretRef: {name: tenant-grafana-credentials, optional: true}}
          env:
            - {name: RE8CH_TOOL_PROFILE, value: tenant}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-tenant}
            - {name: SERVICE_API_TOKEN, valueFrom: {secretKeyRef: {name: admin-vmcp-backend-auth, key: token}}}
            - {name: ALLOW_AUTHENTICATED_DEX, value: "true"}
            - {name: LISTEN_PORT, value: "19448"}
            - {name: PUBLIC_MCP_URL, value: "https://tools.service.re8ch.com/tenant-native/mcp"}
            - {name: OPENAI_APPS_CHALLENGE_TOKEN, value: {{ .Values.tenantPlatform.tenantAPI.openAIAppsChallengeToken | default "" | quote }}}
            - {name: PUBLIC_ORIGIN, value: "https://tools.service.re8ch.com"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://tools.service.re8ch.com/.well-known/oauth-protected-resource/tenant-native/mcp"}
            - {name: TENANT_CONTROL_URL, value: "http://tenant-control-controller.tenant-infrastructure.svc"}
            - {name: AUTH_DISCOVERY_URL, value: "http://supabase-identity-auth.supabase-identity.svc:9999/.well-known/oauth-authorization-server"}
            - {name: DEX_USERINFO_URL, value: "https://api.re8ch.com/auth/userinfo"}
            - {name: SUPABASE_USER_URL, value: "http://supabase-identity-auth.supabase-identity.svc:9999/user"}
            - {name: HARBOR_SUPPLY_CHAIN_URL, value: "http://harbor-supply-chain.tenant-infrastructure.svc"}
            - {name: HARBOR_SUPPLY_CHAIN_REQUIRED, value: {{ .Values.tenantPlatform.supplyChain.required | quote }}}
            - {name: TENANT_SERVICE_DB, value: /var/lib/tenant-platform/tenant-services.db}
            - {name: TENANT_USAGE_CLIENT, value: 'system:serviceaccount:{{ .Release.Namespace }}:{{ include "birfucate-metering.fullname" . }}'}
            - {name: DEVICE_REGISTRY_PATH, value: /var/lib/tenant-platform/tenant-devices.db}
            {{- if .Values.tenantPlatform.tenantAPI.enabled }}
            {{- if .Values.tenantPlatform.tenantAPI.platformSessionURL }}
            - {name: PLATFORM_SESSION_URL, value: {{ .Values.tenantPlatform.tenantAPI.platformSessionURL | quote }}}
            {{- end }}
            {{- if .Values.tenantPlatform.tenantAPI.usersURL }}
            - {name: PLATFORM_USERS_URL, value: {{ .Values.tenantPlatform.tenantAPI.usersURL | quote }}}
            {{- end }}
            {{- if .Values.tenantPlatform.tenantAPI.organizationsURL }}
            - {name: PLATFORM_ORGANIZATIONS_URL, value: {{ .Values.tenantPlatform.tenantAPI.organizationsURL | quote }}}
            {{- end }}
            - {name: PLATFORM_MODULE_REGISTRY, value: /etc/re8ch/modules/modules.json}
            - {name: DYNAMIC_SKILL_DB, value: /var/lib/tenant-platform/dynamic-skills.db}
            - {name: DYNAMIC_SKILL_ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: admin-vmcp-backend-auth, key: token}}}
            - {name: ADMIN_LISTEN_PORT, value: "19450"}
            {{- end }}
          ports:
            - {name: http, containerPort: 19448}
            {{- if .Values.tenantPlatform.tenantAPI.enabled }}
            - {name: skill-admin, containerPort: 19450}
            {{- end }}
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2, timeoutSeconds: 3}
          readinessProbe: {httpGet: {path: {{ .Values.tenantPlatform.tenantReadinessPath }}, port: http}, failureThreshold: 3, periodSeconds: 5, timeoutSeconds: 10}
          livenessProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 3, periodSeconds: 15, timeoutSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: runtime-state, mountPath: /var/lib/tenant-platform}
            {{- if .Values.tenantPlatform.tenantAPI.enabled }}
            # Directory projection keeps kubelet's atomic ConfigMap updates visible.
            - {name: platform-modules, mountPath: /etc/re8ch/modules, readOnly: true}
            {{- end }}
      volumes:
        - {name: runtime-state, persistentVolumeClaim: {claimName: tenant-platform-state}}
        {{- if .Values.tenantPlatform.tenantAPI.enabled }}
        - {name: platform-modules, configMap: {name: tenant-platform-modules}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: admin-api, namespace: tenant-infrastructure}
spec: {selector: {app: admin-api}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-api
  namespace: tenant-infrastructure
  labels: {app: tenant-api, re8ch.com/metrics-surface: tenant-mcp}
spec:
  selector: {app: tenant-api}
  ports:
    - {name: http, port: 80, targetPort: http}
    {{- if .Values.tenantPlatform.tenantAPI.enabled }}
    - {name: skill-admin, port: 19450, targetPort: skill-admin}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-credential-redemption, namespace: tenant-infrastructure}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}]
  hostnames: [tools.service.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /credentials/redeem}}]
      backendRefs: [{name: tenant-api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-native-mcp, namespace: tenant-infrastructure}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}]
  hostnames: [tools.service.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /.well-known/openai-apps-challenge}}]
      backendRefs: [{name: tenant-api, port: 80}]
    - matches: [{path: {type: Exact, value: /tenant-native/mcp}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /mcp}}
      backendRefs: [{name: tenant-api, port: 80}]
    - matches: [{path: {type: Exact, value: /.well-known/oauth-protected-resource/tenant-native/mcp}}]
      backendRefs: [{name: tenant-api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-self-service-capabilities, namespace: tenant-infrastructure}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-https}]
  hostnames: [api.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /tenant-native/self-service/capabilities}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /self-service/capabilities}}
      backendRefs: [{name: tenant-api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-billing-read, namespace: tenant-infrastructure}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}]
  hostnames: [tools.service.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /tenant-native/billing/usage}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /billing/usage}}
      backendRefs: [{name: tenant-api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-billing-auth-center, namespace: tenant-infrastructure}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: api-https}
  hostnames: [api.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /tenant-native/billing/usage}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /billing/usage}}
      backendRefs: [{name: tenant-api, port: 80}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-api-credential-read, namespace: credential-broker}
rules:
  - {apiGroups: [""], resources: [secrets], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-api-credential-read, namespace: credential-broker}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-api-credential-read}
subjects: [{kind: ServiceAccount, name: tenant-api, namespace: tenant-infrastructure}]
---
apiVersion: v1
kind: Service
metadata: {name: tenant-infrastructure, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-api}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: admin-api, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: admin-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: toolhive-system}}
          podSelector: {matchLabels: {app: virtualmcpserver, toolhive-name: re8ch-admin-vmcp}}
        - podSelector: {matchLabels: {app: tenant-api}}
      ports: [{protocol: TCP, port: 19449}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-api, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-api}}
  policyTypes: [Ingress]
  ingress:
    - {from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: toolhive-system}}}], ports: [{protocol: TCP, port: 19448}]}
    - {from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}], ports: [{protocol: TCP, port: 19448}]}
    - {from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability-system}}}], ports: [{protocol: TCP, port: 19448}]}
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}}
          podSelector: {matchLabels: {app.kubernetes.io/name: {{ include "birfucate-metering.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}}}
      ports: [{protocol: TCP, port: 19448}]
    {{- if .Values.tenantPlatform.tenantAPI.enabled }}
    - from:
        - podSelector: {matchLabels: {app: admin-api}}
      ports: [{protocol: TCP, port: 19450}]
    {{- end }}
{{- if .Values.tenantPlatform.tenantAPI.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata: {name: tenant-mcp-tool-usage, namespace: tenant-infrastructure}
spec:
  selector: {matchLabels: {re8ch.com/metrics-surface: tenant-mcp}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: tenant-api-gateway, namespace: tenant-infrastructure}
spec:
  endpointSelector: {matchLabels: {app: tenant-api}}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: "19448", protocol: TCP}]
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata: {name: admin-vmcp-backend-auth, namespace: toolhive-system}
spec:
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef: {name: admin-vmcp-backend-auth, key: authorizationHeader}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata: {name: admin-api-backend, namespace: toolhive-system}
spec:
  groupRef: {name: platform-admin-public}
  remoteUrl: http://admin-api.tenant-infrastructure.svc/mcp
  transport: streamable-http
  externalAuthConfigRef: {name: admin-vmcp-backend-auth}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata: {name: tenant-vmcp-backend-auth, namespace: toolhive-system}
spec:
  type: tokenExchange
  tokenExchange:
    tokenUrl: http://tenant-api.tenant-infrastructure.svc/oauth/token
    audience: re8ch-tenant
    subjectTokenType: access_token
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata: {name: tenant-api-backend, namespace: toolhive-system}
spec:
  groupRef: {name: tenant-public}
  remoteUrl: http://tenant-api.tenant-infrastructure.svc/mcp
  transport: streamable-http
  externalAuthConfigRef: {name: tenant-vmcp-backend-auth}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-mcp, namespace: toolhive-system}
spec:
  hostnames: [tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-https}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /tenant}}]
      # ConnecTool authenticates the caller and exchanges the inbound OIDC token
      # for a short-lived, audience-bound backend identity token.
      # This publication has one VMCP replica, so session ownership does not
      # require an additional router hop.
      backendRefs: [{name: vmcp-tenant-vmcp, port: 4483}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant}}]
      # Resource discovery does not carry an MCP session and must not depend on
      # session-router affinity or replica health.
      backendRefs: [{name: vmcp-tenant-vmcp, port: 4483}]
{{- end }}
