nameOverride: ""
fullnameOverride: ""

image:
  repository: python
  tag: "3.13-alpine@sha256:IMAGE_REQUIRES_VERIFIED_DIGEST"
  pullPolicy: IfNotPresent

replicaCount: 1
collectionIntervalSeconds: 60
lookbackSeconds: 300

# The Headlamp browser talks only to this Chart-owned, read-only endpoint.
# Metric names are allowlisted in the collector; arbitrary PromQL is rejected.
browserAPI:
  enabled: true
  lookbackSeconds: 600

# The autonomous admin/tenant control plane is packaged with Birfucate so its
# CRDs, runtime and metering contract advance as one release. Keep disabled in
# the reusable chart; production enables it with a verified image digest.
tenantPlatform:
  enabled: false
  image: registry.re8ch.com/image/re8ch-ai-operations@sha256:IMAGE_REQUIRES_VERIFIED_DIGEST
  tenantReadinessPath: /readyz
  placement:
    nodeNames: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
  state:
    storageClassName: rbd-r640
    size: 1Gi
  supplyChain:
    required: false
  tenants:
    - name: admin
      displayName: RE8CH Platform Administration
      lifecycle: Active
      deletionPolicy: Retain
      namespacePolicy:
        defaultNamespace: tenant-infrastructure
        allowedPrefixes: [admin-]
        maxNamespaces: 1
        allowCreate: false
        allowDelete: false
        bootstrapNamespaces: []
      runtimeNamespaceRef: tenant-infrastructure
      imagePullSecretRef: harbor-functions-shared-pull
      harborProjectRef: re8ch
      identityBindings:
        - {name: admin-github-k8s-admins, issuer: https://dex.service.re8ch.com, group: "re8ch:k8s-admins", role: admin}
        - {name: admin-vmcp-service, issuer: https://dex.service.re8ch.com, group: "re8ch:tenant-admins", role: admin}
      grants: []
      nativeAccess: false
    - name: artchais
      displayName: Artchais
      lifecycle: Active
      deletionPolicy: Retain
      namespacePolicy:
        defaultNamespace: artchais-default
        allowedPrefixes: [artchais-]
        maxNamespaces: 20
        allowCreate: true
        allowDelete: true
        bootstrapNamespaces: [artchais-default]
      runtimeNamespaceRef: artchais
      imagePullSecretRef: harbor-functions-shared-pull
      harborProjectRef: artchais
      identityBindings:
        - {name: artchais-github-admins, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-admins", role: admin}
        - {name: artchais-github-operators, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-operators", role: operator}
        - {name: artchais-github-viewers, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-viewers", role: viewer}
      grants:
        - {name: artchais-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
        - {name: artchais-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
      nativeAccess: true
    - name: tenant-ci
      displayName: Tenant Conformance Canary
      lifecycle: Active
      deletionPolicy: RevokeThenDelete
      namespacePolicy:
        defaultNamespace: tenant-ci-default
        allowedPrefixes: [tenant-ci-]
        maxNamespaces: 10
        allowCreate: true
        allowDelete: true
        bootstrapNamespaces: [tenant-ci-default]
      imagePullSecretRef: harbor-functions-shared-pull
      harborProjectRef: tenant-ci
      identityBindings:
        - {name: tenant-ci-github-actions, issuer: https://dex.service.re8ch.com, group: "re8ch:tenant-ci", role: operator}
      grants:
        - {name: tenant-ci-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
        - {name: tenant-ci-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
      nativeAccess: true

prometheus:
  baseURL: http://vmsingle-opencost.observability-system.svc.cluster.local:8428
  writePath: /api/v1/import/prometheus
  timeoutSeconds: 15

# OpenCost remains the authoritative static K8s CPU/RAM allocation source.
# Birfucate links to it and measures non-K8s occupancy plus behavior.
opencost:
  enabled: true
  baseURL: http://opencost.opencost.svc.cluster.local:9003
  allocationPath: /allocation/compute?window=1h&aggregate=namespace

usageSink:
  enabled: false
  url: http://tenant-infrastructure.tenant-infrastructure.svc.cluster.local/internal/usage-events
  timeoutSeconds: 10
  # Authentication is injected only by an out-of-band Secret.
  existingSecret: ""
  tokenKey: token

outbox:
  enabled: true
  storageClassName: rbd-r640
  size: 1Gi
  retentionDays: 30

tenantLabels:
  tenant: tenant
  resource: resource_ref

# Showback only: enabling this applies the explicit rate card below to usage
# events and metrics. It never posts accounting entries.
pricing:
  enabled: false
  currency: CNY
  rateCardRef: re8ch-showback-2026-09

# Queries must return tenant and resource_ref labels. Each meter declares the
# resource type and purpose used by the Headlamp flow diagram.
meters:
  usage:
    - name: ai-gateway-provider-spend
      domain: ai-gateway
      serviceClass: ai.model-gateway.v1
      resourceType: model-spend
      purpose: model-inference
      unit: USD
      costFromQuantity: true
      currency: USD
      tenantLabel: team_alias
      resourceLabel: requested_model
      query: sum by (team_alias, requested_model) (increase(litellm_spend_metric_total{team_alias!=""}[5m]))
    - name: ai-gateway-input-tokens
      domain: ai-gateway
      serviceClass: ai.model-gateway.v1
      resourceType: model-token
      purpose: model-inference
      unit: token
      tenantLabel: team_alias
      resourceLabel: requested_model
      query: sum by (team_alias, requested_model) (increase(litellm_input_tokens_metric_total{team_alias!=""}[5m]))
    - name: ai-gateway-output-tokens
      domain: ai-gateway
      serviceClass: ai.model-gateway.v1
      resourceType: model-token
      purpose: model-inference
      unit: token
      tenantLabel: team_alias
      resourceLabel: requested_model
      query: sum by (team_alias, requested_model) (increase(litellm_output_tokens_metric_total{team_alias!=""}[5m]))
    - name: ai-gateway-tool-spend
      domain: ai-gateway
      serviceClass: ai.model-gateway.v1
      resourceType: tool-spend
      purpose: tenant-tool-call
      unit: USD
      costFromQuantity: true
      currency: USD
      tenantLabel: team_alias
      resourceLabel: mcp_server_name
      query: sum by (team_alias, mcp_server_name) (increase(litellm_mcp_tool_call_spend_metric_total{team_alias!=""}[5m]))
    - name: ai-gateway-tool-calls
      domain: ai-gateway
      serviceClass: ai.model-gateway.v1
      resourceType: tool-call
      purpose: tenant-tool-call
      unit: call
      tenantLabel: team_alias
      resourceLabel: mcp_server_name
      query: sum by (team_alias, mcp_server_name) (increase(litellm_mcp_tool_calls_total{team_alias!=""}[5m]))
  occupancy:
    - name: sandbox-cpu-request
      domain: sandbox
      serviceClass: sandbox.runtime.v1
      resourceType: sandbox-cpu
      purpose: agent-execution
      pricePerBillingUnit: 0.08
      billingUnitSize: 3600
      unit: core-second
      valueKind: gauge
      tenantLabel: label_re8ch_com_tenant
      resourceLabel: label_birfucate_re8ch_com_resource
      query: sum by (label_re8ch_com_tenant, label_birfucate_re8ch_com_resource) (kube_pod_container_resource_requests{resource="cpu"} * on (namespace, pod) group_left(label_re8ch_com_tenant, label_birfucate_re8ch_com_resource) kube_pod_labels{label_opensandbox_re8ch_com_workload="true",label_re8ch_com_tenant!=""})
    - name: sandbox-memory-request
      domain: sandbox
      serviceClass: sandbox.runtime.v1
      resourceType: sandbox-memory
      purpose: agent-execution
      pricePerBillingUnit: 0.03
      billingUnitSize: 3600
      unit: GiB-second
      valueKind: gauge
      tenantLabel: label_re8ch_com_tenant
      resourceLabel: label_birfucate_re8ch_com_resource
      query: sum by (label_re8ch_com_tenant, label_birfucate_re8ch_com_resource) (kube_pod_container_resource_requests{resource="memory"} * on (namespace, pod) group_left(label_re8ch_com_tenant, label_birfucate_re8ch_com_resource) kube_pod_labels{label_opensandbox_re8ch_com_workload="true",label_re8ch_com_tenant!=""}) / 1073741824
    - name: tenant-claim-cpu-request
      domain: compute
      resourceType: cpu
      purpose: workload-runtime
      pricePerBillingUnit: 0.20
      billingUnitSize: 3600
      unit: core-second
      valueKind: gauge
      tenantLabel: label_tenant
      resourceLabel: label_resource_ref
      query: sum by (label_tenant, label_resource_ref) (kube_pod_container_resource_requests{resource="cpu"} * on (namespace, pod) group_left(label_tenant, label_resource_ref) kube_pod_labels{label_birfucate_re8ch_com_metered="true"})
    - name: tenant-claim-memory-request
      domain: compute
      resourceType: memory
      purpose: workload-runtime
      pricePerBillingUnit: 0.03
      billingUnitSize: 3600
      unit: GiB-second
      valueKind: gauge
      tenantLabel: label_tenant
      resourceLabel: label_resource_ref
      query: sum by (label_tenant, label_resource_ref) (kube_pod_container_resource_requests{resource="memory"} * on (namespace, pod) group_left(label_tenant, label_resource_ref) kube_pod_labels{label_birfucate_re8ch_com_metered="true"}) / 1073741824
    - name: tenant-claim-ephemeral-storage-request
      domain: compute
      resourceType: ephemeral-storage
      purpose: workload-scratch
      pricePerBillingUnit: 0.005
      billingUnitSize: 3600
      unit: GiB-second
      valueKind: gauge
      tenantLabel: label_tenant
      resourceLabel: label_resource_ref
      query: sum by (label_tenant, label_resource_ref) (kube_pod_container_resource_requests{resource="ephemeral_storage"} * on (namespace, pod) group_left(label_tenant, label_resource_ref) kube_pod_labels{label_birfucate_re8ch_com_metered="true"}) / 1073741824
    - name: ceph-volume-capacity
      domain: ceph
      resourceType: block-storage
      purpose: persistent-data
      pricePerBillingUnit: 0.002
      billingUnitSize: 3600
      unit: GiB-second
      valueKind: gauge
      tenantLabel: label_tenant
      resourceLabel: label_resource_ref
      query: sum by (label_tenant, label_resource_ref) (kube_persistentvolumeclaim_resource_requests_storage_bytes * on (namespace, persistentvolumeclaim) group_left(label_tenant, label_resource_ref) kube_persistentvolumeclaim_labels{label_birfucate_re8ch_com_metered="true"}) / 1073741824
    - name: pigsty-database-storage
      domain: pigsty
      resourceType: database-storage
      purpose: transactional-data
      pricePerBillingUnit: 0.003
      billingUnitSize: 3600
      unit: GiB-second
      valueKind: gauge
      query: sum by (tenant, resource_ref) (pg_database_size_bytes{tenant!=""}) / 1073741824
    - name: network-public-ip
      domain: networks
      resourceType: public-ip
      purpose: public-ingress
      pricePerBillingUnit: 0.01
      billingUnitSize: 3600
      unit: IP-second
      valueKind: gauge
      query: sum by (tenant, resource_ref) (public_edge_service_info{tenant!=""})
  bifurcation:
    - name: ceph-client-io
      domain: ceph
      resourceType: storage-io
      purpose: data-access
      pricePerBillingUnit: 0.01
      billingUnitSize: 1000000
      occurrenceUnit: operation
      intensityUnit: byte-per-operation
      referenceIntensity: 4096
      countQuery: sum by (tenant, resource_ref) (rate(ceph_pool_rd{tenant!=""}[5m]) + rate(ceph_pool_wr{tenant!=""}[5m]))
      intensityQuery: sum by (tenant, resource_ref) (rate(ceph_pool_rd_bytes{tenant!=""}[5m]) + rate(ceph_pool_wr_bytes{tenant!=""}[5m])) / clamp_min(sum by (tenant, resource_ref) (rate(ceph_pool_rd{tenant!=""}[5m]) + rate(ceph_pool_wr{tenant!=""}[5m])), 0.000001)
      fanoutQuery: count by (tenant, resource_ref) (ceph_client_metadata{tenant!=""})
    - name: pigsty-transactions
      domain: pigsty
      resourceType: database-transaction
      purpose: transactional-workload
      pricePerBillingUnit: 0.02
      billingUnitSize: 1000000
      occurrenceUnit: transaction
      intensityUnit: tuple-per-transaction
      referenceIntensity: 1
      countQuery: sum by (tenant, resource_ref) (rate(pg_stat_database_xact_commit{tenant!=""}[5m]) + rate(pg_stat_database_xact_rollback{tenant!=""}[5m]))
      intensityQuery: sum by (tenant, resource_ref) (rate(pg_stat_database_tup_fetched{tenant!=""}[5m]) + rate(pg_stat_database_tup_inserted{tenant!=""}[5m]) + rate(pg_stat_database_tup_updated{tenant!=""}[5m]) + rate(pg_stat_database_tup_deleted{tenant!=""}[5m])) / clamp_min(sum by (tenant, resource_ref) (rate(pg_stat_database_xact_commit{tenant!=""}[5m]) + rate(pg_stat_database_xact_rollback{tenant!=""}[5m])), 0.000001)
      fanoutQuery: count by (tenant, resource_ref) (pg_stat_activity_count{tenant!="",state="active"})
    - name: hubble-network-flows
      domain: networks
      resourceType: network-flow
      purpose: service-connectivity
      pricePerBillingUnit: 0.005
      billingUnitSize: 1000000
      occurrenceUnit: flow
      intensityUnit: byte-per-flow
      referenceIntensity: 1500
      countQuery: sum by (tenant, resource_ref) (rate(hubble_flows_processed_total{tenant!=""}[5m]))
      intensityQuery: sum by (tenant, resource_ref) (rate(hubble_flow_bytes_total{tenant!=""}[5m])) / clamp_min(sum by (tenant, resource_ref) (rate(hubble_flows_processed_total{tenant!=""}[5m])), 0.000001)
      fanoutQuery: count by (tenant, resource_ref) (hubble_flows_processed_total{tenant!="",destination!=""})
    - name: hyperglass-route-branches
      domain: networks
      resourceType: route-branch
      purpose: public-routing
      pricePerBillingUnit: 0.005
      billingUnitSize: 1000000
      occurrenceUnit: route-change
      intensityUnit: path-per-change
      referenceIntensity: 1
      countQuery: sum by (tenant, resource_ref) (rate(hyperglass_route_change_total{tenant!=""}[5m]))
      intensityQuery: avg by (tenant, resource_ref) (hyperglass_route_path_count{tenant!=""})
      fanoutQuery: count by (tenant, resource_ref) (hyperglass_route_path_info{tenant!=""})

serviceMonitor:
  enabled: false
  interval: 60s

vmServiceScrape:
  enabled: false
  interval: 60s

podAnnotations: {}
podLabels: {}
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
nodeSelector: {}
tolerations: []
affinity: {}

discovery:
  enabled: true
  intervalSeconds: 120
  clusterRef: re8ch
  regionRef: multi-region
  classifications:
    internal-control-plane: [ai-operations, auth, cert-manager, dex, edge-devices, flux-system, function-routing, headlamp, image, kube-system, mcp-registry, opentelemetry-operator, ops, synthetic-monitoring, toolhive-system]
    shared-infrastructure-product: [among-clusters, egress-fabric, harbor, llm-gateway, netbird-access, observable, observability-ai, opencost, opensandbox-system, pigsty-external, qianwen-ops, regional-routing, rook-ceph, storage-fabric, supabase-pg-re8ch]
    tenant-facing-product: [agent-collab, ai-gateway, anycam, anysite, codex-app-server, codex-platform, comfy-agent, compocv, cosyvoice, dataspace, default, fleet, ledger, neo4j, nuclio, qwen, voice-observability]
    evaluation-only: [cube-trial, mitos-trial, symphony-trial]
