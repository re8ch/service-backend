apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 5m
  url: https://gitlab.com/reachievellc/service-backend.git
  ref: {branch: main}
  secretRef: {name: service-backend-flux-auth}
  verify:
    mode: HEAD
    secretRef: {name: service-backend-verification-keys}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 10m
  path: ./clusters/re8ch
  prune: false
  # The root owns intentionally suspended and condition-reporting resources;
  # waiting on every descendant makes later signed revisions impossible to apply.
  wait: false
  timeout: 3m
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  sourceRef: {kind: GitRepository, name: service-backend}
