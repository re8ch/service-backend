apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 30s
  timeout: 15m
  provider: github
  url: https://github.com/re8ch/service-backend.git
  ref: {branch: main}
  secretRef: {name: service-backend-github-app-auth}
  proxySecretRef: {name: service-backend-github-proxy}
  verify:
    mode: HEAD
    secretRef: {name: service-backend-verification-keys}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 1m
  path: ./clusters/re8ch
  prune: false
  # The root owns intentionally suspended and condition-reporting resources;
  # waiting on every descendant makes later signed revisions impossible to apply.
  wait: false
  timeout: 3m
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  sourceRef: {kind: GitRepository, name: service-backend}
