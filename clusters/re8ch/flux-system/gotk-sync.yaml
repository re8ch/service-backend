apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 5m
  url: https://gitlab.com/reachievellc/service-backend.git
  ref: {branch: main}
  secretRef: {name: service-backend-flux-auth}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: service-backend, namespace: flux-system}
spec:
  interval: 10m
  path: ./clusters/re8ch
  prune: false
  wait: true
  timeout: 3m
  sourceRef: {kind: GitRepository, name: service-backend}
