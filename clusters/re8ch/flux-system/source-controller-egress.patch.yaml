apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Follow the node's declared clusterDNS instead of pinning a historical
      # Service IP. This keeps restricted-node-6dc3f140f9, A1 and B1 on the same DNS path.
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        networking.re8ch.com/egress-policy: auto
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # Source delivery is a singleton and depends on the local
                    # identity-egress control-plane proxy path. restricted-node-6dc3f140f9 has both a
                    # healthy proxy endpoint and registry-blob DNS; A1 cannot
                    # reach that Service VIP and B1 cannot pull the image.
                    values: [restricted-node-6dc3f140f9]
      tolerations:
        - operator: Exists
