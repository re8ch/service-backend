apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    spec:
      # Run public source delivery on the KL/restricted-node-6dc3f140f9 active-standby pair while
      # GitHub remains the desired-state source.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: manager
          env:
            # Flux's SSH transport reads ALL_PROXY; HTTP requests keep their
            # existing routing and the SSH host/commit checks remain enabled.
            - name: ALL_PROXY
              valueFrom:
                secretKeyRef:
                  name: service-backend-github-socks
                  key: address
            # restricted-node-6dc3f140f9 HAProxy health-checks A1, B1 and MUBAO and removes an
            # unhealthy API server without pinning Flux to one member.
            - {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.205"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [overseas-kl, restricted-node-6dc3f140f9]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [overseas-kl]}
            - weight: 50
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: source-controller}
              topologyKey: kubernetes.io/hostname
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
