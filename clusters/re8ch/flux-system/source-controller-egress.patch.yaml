apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  # source-controller serves artifacts from pod-local storage. A non-leader
  # replica does not become ready, so use scheduler failover instead of a
  # second permanently unready replica.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Use the pod network on the KL/restricted-node-6dc3f140f9 pair. Git transport still uses the
      # declared SOCKS endpoint, while pod networking avoids collisions with
      # node-local listeners such as KL's existing TCP/9090 process.
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: manager
          env:
            # Flux's SSH transport reads ALL_PROXY; HTTP requests keep their
            # existing routing and the SSH host/commit checks remain enabled.
            - name: ALL_PROXY
              valueFrom:
                secretKeyRef:
                  name: service-backend-github-socks
                  key: address
            # restricted-node-6dc3f140f9 HAProxy health-checks A1, B1 and MUBAO and removes an
            # unhealthy API server without pinning Flux to one member.
            - {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.179"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [overseas-kl, restricted-node-6dc3f140f9]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [overseas-kl]}
            - weight: 50
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
