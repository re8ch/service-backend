apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  # source-controller serves artifacts from pod-local storage. A non-leader
  # replica does not become ready, so use scheduler failover instead of a
  # second permanently unready replica.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Use nodes with a verified route to a control-plane endpoint. Prefer the
      # control-plane node itself and retain R640 as scheduler failover.
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: manager
          env:
            # The service VIP is not routed consistently from all workers.
            # Bootstrap against the stable a1-wsl-zt control-plane endpoint.
            - {name: KUBERNETES_SERVICE_HOST, value: "10.250.0.147"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [a1-wsl-zt, r640]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt]}
            - weight: 80
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [r640]}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
