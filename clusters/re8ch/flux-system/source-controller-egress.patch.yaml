apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  # source-controller serves artifacts from pod-local storage. A non-leader
  # replica does not become ready, so use scheduler failover instead of a
  # second permanently unready replica.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Use the pod network on the KL/restricted-node-6dc3f140f9 pair. restricted-node-6dc3f140f9 is preferred because the
      # source controller must reach the Kubernetes API service VIP while it
      # serves artifacts. KL remains a fallback after its API route recovers.
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: manager
          env:
            # Use the health-checked API service VIP instead of restricted-node-6dc3f140f9's local
            # k3s supervisor, whose backend reconnects cause correlated EOFs.
            - {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.116"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
            - {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [overseas-kl, restricted-node-6dc3f140f9]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
            - weight: 50
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [overseas-kl]}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
