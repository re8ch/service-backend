apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # The MUBAO -> RouterOS -> A1 -> LA2 SOCKS path is host-routed. Keep
      # source delivery on that path rather than Cilium's Pod egress table.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: manager
          env:
            # Flux's SSH transport reads ALL_PROXY; HTTP requests keep their
            # existing routing and the SSH host/commit checks remain enabled.
            - name: ALL_PROXY
              valueFrom:
                secretKeyRef:
                  name: service-backend-github-socks
                  key: address
      nodeSelector:
        kubernetes.io/os: linux
        networking.re8ch.com/egress-policy: auto
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # MUBAO owns the primary RouterOS path; A1 has a direct
                    # WireGuard path to the same verified LA2 SOCKS endpoint.
                    values: [restricted-node-abb3f27a69, restricted-node-1eb0570f74]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-abb3f27a69]}
      tolerations:
        - operator: Exists
