apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Run public source delivery beside the FLK SOCKS endpoint. This removes
      # the China-to-FLK proxy hop while GitHub remains the desired-state source.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: manager
          env:
            # Flux's SSH transport reads ALL_PROXY; HTTP requests keep their
            # existing routing and the SSH host/commit checks remain enabled.
            - name: ALL_PROXY
              valueFrom:
                secretKeyRef:
                  name: service-backend-github-socks
                  key: address
      nodeSelector:
        kubernetes.io/os: linux
        networking.re8ch.com/egress-policy: direct
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # Source fetches are intentionally colocated with the
                    # verified public egress endpoint on the German worker.
                    values: [overseas-flk]
      tolerations:
        - operator: Exists
