apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      # Follow the node's declared clusterDNS instead of pinning a historical
      # Service IP. This keeps restricted-node-6dc3f140f9, A1 and B1 on the same DNS path.
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
        networking.re8ch.com/egress-policy: auto
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74, restricted-node-296f36f2fb]
      tolerations:
        - operator: Exists
