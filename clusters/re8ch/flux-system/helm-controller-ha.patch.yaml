apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # Keep one eligible control-plane anchor with the image
                    # cache and pair it with a separate stable worker. HA must
                    # not depend entirely on intermittently connected workers.
                    values: [r640, domain-ex, vm-20-12-ubuntu]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: helm-controller}
              topologyKey: kubernetes.io/hostname
