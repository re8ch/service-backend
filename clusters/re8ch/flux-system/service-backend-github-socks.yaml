apiVersion: v1
kind: Secret
metadata:
  name: service-backend-github-socks
  namespace: flux-system
type: Opaque
stringData:
  # Use the dedicated GitOps egress Service. Its Ready endpoints prove external
  # HTTPS reachability and avoid coupling signed source fetches to a node-local
  # Mihomo process whose local health check does not cover GitHub SSH handshakes.
  address: socks5://identity-egress-gitops.egress-fabric.svc.cluster.local:17893
