apiVersion: v1
kind: Secret
metadata:
  name: service-backend-github-socks
  namespace: flux-system
type: Opaque
stringData:
  # Use the node-local Mihomos consumer rather than pinning a provider node.
  # On CN nodes it sends GitHub traffic through the GLOBAL fabric, whose
  # Ready provider set is maintained by Mihomos Cluster.
  address: socks5://mihomos-node-cn-local.egress-fabric.svc.cluster.local:17891
