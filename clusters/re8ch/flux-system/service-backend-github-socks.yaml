apiVersion: v1
kind: Secret
metadata:
  name: service-backend-github-socks
  namespace: flux-system
type: Opaque
stringData:
  # Credential-free SOCKS5 endpoint for SSH Git transport. identity-egress uses
  # host networking, so this is the stable internal address of overseas-la.
  # The shared Service currently selects overseas-kl, which is unreachable from
  # restricted-node-6dc3f140f9 even though its application-level readiness probe succeeds.
  address: socks5://192.0.2.147:17893
