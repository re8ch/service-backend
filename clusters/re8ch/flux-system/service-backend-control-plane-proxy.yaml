apiVersion: v1
kind: Secret
metadata:
  name: service-backend-control-plane-proxy
  namespace: flux-system
type: Opaque
stringData:
  # This contains only the non-secret in-cluster proxy endpoint. Provider and
  # GitHub credentials remain in their SOPS-managed Secrets.
  # Use the control-plane-local Service so Flux follows service discovery and
  # never depends on a reserved ClusterIP or a cross-node proxy endpoint.
  address: http://identity-egress-control-plane.egress-fabric.svc.cluster.local:17893
