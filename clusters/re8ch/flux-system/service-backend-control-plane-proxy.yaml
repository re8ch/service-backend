apiVersion: v1
kind: Secret
metadata:
  name: service-backend-control-plane-proxy
  namespace: flux-system
type: Opaque
stringData:
  # This contains only the non-secret in-cluster proxy endpoint. Provider and
  # GitHub credentials remain in their SOPS-managed Secrets.
  # Source delivery runs on R640. Use the proxy's R640 host port so the
  # source-controller does not need cluster DNS or a cross-node Service path.
  address: http://10.250.0.128:17891
