apiVersion: v1
kind: Secret
metadata:
  name: service-backend-control-plane-proxy
  namespace: flux-system
type: Opaque
stringData:
  # This contains only the non-secret in-cluster proxy endpoint. Provider and
  # GitHub credentials remain in their SOPS-managed Secrets.
  # Source delivery is pinned to restricted-node-6dc3f140f9. Use its stable host-network proxy
  # endpoint so GitOps recovery does not depend on the degraded
  # PodCIDR-to-ClusterIP dataplane it is responsible for repairing.
  address: http://192.0.2.179:17893
