apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: service-backend-github
  namespace: flux-system
  labels:
    collaboration.re8ch.com/control-plane: github
spec:
  suspend: false
  type: github
  events: [ping, push]
  secretRef:
    name: service-backend-github-webhook
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      name: service-backend
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: service-backend-github-status
  namespace: flux-system
  labels:
    collaboration.re8ch.com/control-plane: github
spec:
  suspend: false
  type: github
  address: https://github.com/re8ch/service-backend
  secretRef:
    name: service-backend-github-reaction-auth
  commitStatusExpr: "('flux/' + event.involvedObject.kind + '/' + event.involvedObject.name).lowerAscii()"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: service-backend-github-status
  namespace: flux-system
  labels:
    collaboration.re8ch.com/control-plane: github
spec:
  suspend: false
  providerRef:
    name: service-backend-github-status
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: service-backend
    - kind: Kustomization
      name: service-backend
