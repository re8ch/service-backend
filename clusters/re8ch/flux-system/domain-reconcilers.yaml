# Business domains reconcile directly from the verified service-backend source.
# They intentionally do not depend on Kustomization/service-backend readiness:
# the root grants ownership, while each domain owns its own failure and rollout.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: reconcile-identity-access, namespace: flux-system}
spec:
  suspend: true
  interval: 1m
  retryInterval: 1m
  timeout: 15m
  path: ./clusters/re8ch/domains/identity-access
  prune: true
  wait: false
  sourceRef: {kind: GitRepository, name: service-backend}
  decryption: {provider: sops, secretRef: {name: sops-age}}
---
