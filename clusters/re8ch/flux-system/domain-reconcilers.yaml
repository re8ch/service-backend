---
# Temporary residual shards for objects that cannot yet be safely handed to
# namespaced SSA: encrypted Secrets, cluster-scoped resources, Flux lifecycle
# objects, and Helm releases. Each shard stays suspended until its matching
# signed bundle cohort is ready for an independently reversible cutover.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: reconcile-main-legacy-data-storage, namespace: flux-system}
spec:
  suspend: true
  interval: 1m
  retryInterval: 1m
  timeout: 15m
  path: ./clusters/re8ch/domains/main-legacy/data-storage
  prune: false
  wait: false
  sourceRef: {kind: GitRepository, name: service-backend}
  decryption: {provider: sops, secretRef: {name: sops-age}}
---
