apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-birfucate-metering
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/birfucate-metering
    delivery.re8ch.com/codename: eddy-opal
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-birfucate-metering
  ref:
    digest: sha256:13f956ef83d08e4fdce47f50ac37176ef136091643ced89a566b9839f073ea53
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-birfucate-metering
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/birfucate-metering
    delivery.re8ch.com/codename: eddy-opal
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-birfucate-metering
  decryption:
    provider: sops
    secretRef:
      name: sops-age
