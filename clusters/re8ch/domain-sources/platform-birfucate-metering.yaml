apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-birfucate-metering
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/birfucate-metering
    delivery.re8ch.com/codename: confluence-copper
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-birfucate-metering
  ref:
    digest: sha256:431cf3285cf3d3288158b2e46ad5ae2a530e07c924fdb4340fd3033400b31a02
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-birfucate-metering
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/birfucate-metering
    delivery.re8ch.com/codename: confluence-copper
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-birfucate-metering
  decryption:
    provider: sops
    secretRef:
      name: sops-age
