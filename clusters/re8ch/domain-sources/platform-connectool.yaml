apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: anchor-amber
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-connectool
  ref:
    digest: sha256:710cda1d081b879d2b36bd11bb564e00b2f63a085dbc3c25bd5097bd32fc8cb5
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: anchor-amber
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-connectool
  decryption:
    provider: sops
    secretRef:
      name: sops-age
