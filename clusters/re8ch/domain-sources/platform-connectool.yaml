apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: harbor-copper
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-connectool
  ref:
    digest: sha256:420f22083c5950b9695b05a7b51b82727ddc709d0504d22d024b1999fddfd4c0
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: harbor-copper
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-connectool
  decryption:
    provider: sops
    secretRef:
      name: sops-age
