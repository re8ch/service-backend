apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: beacon-pearl
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-connectool
  ref:
    digest: sha256:57f9015fd30c6e643217d987b13a3286600f8c020ddee083ccf98c68e59169f3
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-connectool
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/connectool
    delivery.re8ch.com/codename: beacon-pearl
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-connectool
  decryption:
    provider: sops
    secretRef:
      name: sops-age
