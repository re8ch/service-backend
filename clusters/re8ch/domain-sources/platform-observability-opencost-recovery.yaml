apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-opencost-recovery
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/opencost-recovery
    delivery.re8ch.com/codename: zenith
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-opencost-recovery
  ref:
    digest: sha256:a7cd29ec0c2a0f2e1c0d9454d16b434e28dad08082023e720092f1842967eb1e
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
