apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: tramontane-copper
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-advanced-fabric
  ref:
    digest: sha256:47f0341e9dcd262123ce88ff60e67b8fb4f1c37b124416dc3e7f05a1681c46d9
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: tramontane-copper
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-advanced-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
