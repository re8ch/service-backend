apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: sirocco-amber
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-advanced-fabric
  ref:
    digest: sha256:5317a449bf96d73d20e3a0ba99fd2bd50b678dbc48d166e419d3268ca8084d3b
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: sirocco-amber
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-advanced-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
