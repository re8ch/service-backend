apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: chinook-silver
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-advanced-fabric
  ref:
    digest: sha256:c3a1fb3ddb843d94163d68f9ae58e31d1f1b103c0c0befbdfccf0797ef44d826
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: chinook-silver
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-advanced-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
