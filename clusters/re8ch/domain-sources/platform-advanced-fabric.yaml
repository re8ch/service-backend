apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: bora-silver
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-advanced-fabric
  ref:
    digest: sha256:824c73b78522e343ca8e5722f78132daf2ce75e3b67aca1e79708ea8432c5ddd
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: bora-silver
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-advanced-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
