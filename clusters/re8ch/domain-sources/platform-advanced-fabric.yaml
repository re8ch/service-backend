apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: bora-copper
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-advanced-fabric
  ref:
    digest: sha256:8bf4ba0a5f9a0919ecef9468bf3ed13f7b5731b83f4442b0fc0bca07e3e642e3
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-advanced-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/advanced-fabric
    delivery.re8ch.com/codename: bora-copper
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-advanced-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
