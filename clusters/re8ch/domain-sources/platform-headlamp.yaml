apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: signal-amber
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-headlamp
  ref:
    digest: sha256:66bfb38d78e530b00a618d9a381b36676d358c1a2fa8f4d1751410903ce35ea6
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: signal-amber
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-headlamp
  decryption:
    provider: sops
    secretRef:
      name: sops-age
