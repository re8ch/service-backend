apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: flare-bronze
    delivery.re8ch.com/source-mode: git-fallback
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-headlamp
  ref:
    digest: sha256:41d8eb71e242f5c8f58aed30188eda94f868a83de7cb153283f4511554d7ad9e
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: flare-bronze
    delivery.re8ch.com/source-mode: git-fallback
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./platform/headlamp
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: service-backend
  decryption:
    provider: sops
    secretRef:
      name: sops-age
