apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: aurora-bronze
    delivery.re8ch.com/source-mode: git-fallback
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-headlamp
  ref:
    digest: sha256:9d420cc05f2567a7f96321379b4c9df18ca77dbee32bf01f51ec61a7589ec7ab
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-headlamp
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/headlamp
    delivery.re8ch.com/codename: aurora-bronze
    delivery.re8ch.com/source-mode: git-fallback
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./platform/headlamp
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: service-backend
  decryption:
    provider: sops
    secretRef:
      name: sops-age
