apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-re8ch-business-namespaces
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/re8ch-business-namespaces
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-re8ch-business-namespaces
  ref:
    digest: sha256:16e4a40b21a1c59d28575b3f79de4dc7ae889fb0bb39c8c2738e131a5bfc915a
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-re8ch-business-namespaces
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/re8ch-business-namespaces
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-re8ch-business-namespaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
