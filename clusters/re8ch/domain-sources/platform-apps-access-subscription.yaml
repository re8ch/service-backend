  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-apps-access-subscription
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/apps/access-subscription
    delivery.re8ch.com/codename: watchtower-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
