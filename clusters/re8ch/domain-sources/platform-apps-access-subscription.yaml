apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-apps-access-subscription
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/apps/access-subscription
    delivery.re8ch.com/codename: citadel
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-apps-access-subscription
  ref:
    digest: sha256:08fd3743845e436225f403020a16872d5f480a9a4f8c969c1d48ad7b219242af
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-apps-access-subscription
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/apps/access-subscription
    delivery.re8ch.com/codename: citadel
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-apps-access-subscription
  decryption:
    provider: sops
    secretRef:
      name: sops-age
