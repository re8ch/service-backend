apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-apps-access-subscription
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/apps/access-subscription
    delivery.re8ch.com/codename: ward-amber
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-apps-access-subscription
