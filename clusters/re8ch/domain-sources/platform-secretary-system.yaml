apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: sentinel
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-secretary-system
  ref:
    digest: sha256:9e2ac83db8670177f855789387f6917eb9c03da58b0a4d41c0addb69d97bd6b0
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: sentinel
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-secretary-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
