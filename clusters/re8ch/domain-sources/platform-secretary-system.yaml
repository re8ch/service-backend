apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: shield
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-secretary-system
  ref:
    digest: sha256:e7cf7b2cb5b77084603a3e637dfef0c6f21956736dd594766d460743c06b984c
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: shield
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-secretary-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
