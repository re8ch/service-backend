apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-secretary-system
  ref:
    digest: sha256:12c32278b5b5e94930d17acf8d6b6c6c910f254ba849f6039fd46d83ff8c9926
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-secretary-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
