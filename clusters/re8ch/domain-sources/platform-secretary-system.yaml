apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-secretary-system
  ref:
    digest: sha256:59607d05fbd418c2e6ea3c7bb7ed34607fd86fda60e99492b26c9c49840ac1f5
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-secretary-system
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/secretary-system
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-secretary-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
