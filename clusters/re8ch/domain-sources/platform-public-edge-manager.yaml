apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: zephyr-garnet
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-public-edge-manager
  ref:
    digest: sha256:537952bc04e58d1cd852312cb97ca8f91d5dc5cdb4ee00cb1e309cd0cff1b565
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: zephyr-garnet
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-public-edge-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
