apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: sirocco-garnet
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-public-edge-manager
  ref:
    digest: sha256:29b5158624ee711106fd8437bb376048f3d3f00d7f31307e4315dcdf12bef328
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: sirocco-garnet
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-public-edge-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
