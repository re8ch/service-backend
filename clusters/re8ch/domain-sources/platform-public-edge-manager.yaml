apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: chinook-copper
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-public-edge-manager
  ref:
    digest: sha256:052cc14d42bd98209cd712a582f2215af42693a112c9cd5c0fa96c8c89c5a205
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-public-edge-manager
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/public-edge-manager
    delivery.re8ch.com/codename: chinook-copper
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-public-edge-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
