apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-runtime-anatomy
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/runtime-anatomy
    delivery.re8ch.com/codename: grove
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-runtime-anatomy
  ref:
    digest: sha256:bfdf7734057b7df29c7b32bfaab6063e35ef077df88753fae28f8665b3acdef9
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-runtime-anatomy
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/runtime-anatomy
    delivery.re8ch.com/codename: grove
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-runtime-anatomy
  decryption:
    provider: sops
    secretRef:
      name: sops-age
