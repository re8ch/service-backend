apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-workspace-controller
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/workspace-controller
    delivery.re8ch.com/codename: andromeda
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-workspace-controller
  ref:
    digest: sha256:84ba4d3168b92f864acf0a5978f13b4893b5fdeae0817b1a5571c86e2c9e1190
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-workspace-controller
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/workspace-controller
    delivery.re8ch.com/codename: andromeda
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-workspace-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
