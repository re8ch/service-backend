apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-workspace-controller
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/workspace-controller
    delivery.re8ch.com/codename: aquila
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-workspace-controller
  ref:
    digest: sha256:5fff79ec2be629c486d8d67f9b4e0c8a295d4ed4818d3cc0948d156fd612a672
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-workspace-controller
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/workspace-controller
    delivery.re8ch.com/codename: aquila
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-workspace-controller
  decryption:
    provider: sops
    secretRef:
      name: sops-age
