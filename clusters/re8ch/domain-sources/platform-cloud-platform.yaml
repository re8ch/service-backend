apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: tundra-indigo
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-cloud-platform
  ref:
    digest: sha256:bbd697ac3ea78757e9c0defc53f927dd1be1299fa5ca24f751a4f967e3a10cbd
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: tundra-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-cloud-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
