apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: atoll-pearl
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-cloud-platform
  ref:
    digest: sha256:458f85a4e46b1b992fca64e831c9bdb2b17af75db6bf944e63039fe802d9f779
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: atoll-pearl
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-cloud-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
