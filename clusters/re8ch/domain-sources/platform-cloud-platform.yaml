apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: wetland-indigo
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-cloud-platform
  ref:
    digest: sha256:ab8168636a4c1ae7b0b826c498a259b285ad57137a85b74e9d6627ca2d43659e
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: wetland-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-cloud-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
