apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: atoll-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-cloud-platform
  ref:
    digest: sha256:4dfc1b2ba987383ed3b89daa39b4742b2505af0cdf6acb9ed80a6e9584c39be5
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: atoll-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-cloud-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
