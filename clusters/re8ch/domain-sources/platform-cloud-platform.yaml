apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: grove-jade
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-cloud-platform
  ref:
    digest: sha256:684bbd62b202009b9a98b8ab780501189279866a9153a6f07fa76ec37a6dbf1a
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-cloud-platform
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/cloud-platform
    delivery.re8ch.com/codename: grove-jade
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-cloud-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age
