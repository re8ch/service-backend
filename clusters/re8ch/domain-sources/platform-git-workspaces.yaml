apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-git-workspaces
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/git-workspaces
    delivery.re8ch.com/codename: carina
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-git-workspaces
  ref:
    digest: sha256:8a86009ad794d66f6722f928b9e2e1864747ad51de1406fb9cf7c3e49978b4ae
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-git-workspaces
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/git-workspaces
    delivery.re8ch.com/codename: carina
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-git-workspaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
