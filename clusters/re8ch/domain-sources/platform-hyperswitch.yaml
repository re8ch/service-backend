apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: beacon-indigo
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-hyperswitch
  ref:
    digest: sha256:4ecd588ade8e95d1ea2bc4d232aef6d427923bae1f63ea0a448c31be5414f0c7
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: beacon-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-hyperswitch
  decryption:
    provider: sops
    secretRef:
      name: sops-age
