apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-copper
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-hyperswitch
  ref:
    digest: sha256:39c17d395377cf3e8499d322627b5296cab616da4ea2c798782864c4e240bdb1
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-copper
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-hyperswitch
  decryption:
    provider: sops
    secretRef:
      name: sops-age
