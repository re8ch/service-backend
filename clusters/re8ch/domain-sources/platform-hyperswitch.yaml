apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: compass-indigo
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-hyperswitch
  ref:
    digest: sha256:16757abd0a07c2b8dfdb91e3bc698a9e888b739434abf2bdc27ae8dd3d1198c4
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: compass-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-hyperswitch
  decryption:
    provider: sops
    secretRef:
      name: sops-age
