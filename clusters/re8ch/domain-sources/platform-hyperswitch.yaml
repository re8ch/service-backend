apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-indigo
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-hyperswitch
  ref:
    digest: sha256:ae9946bf0b7e945284d3a1d39f67fb809ca4916f72c9162497ff5e994dcfaea2
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-hyperswitch
  decryption:
    provider: sops
    secretRef:
      name: sops-age
