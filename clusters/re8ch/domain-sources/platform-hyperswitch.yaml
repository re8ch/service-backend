apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-hyperswitch
  ref:
    digest: sha256:5ac51760a46f4281fceb4cf346b5392ec1b6541fb6acd26ebf792146b9b9f1f7
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-hyperswitch
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/hyperswitch
    delivery.re8ch.com/codename: anchor-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-hyperswitch
  decryption:
    provider: sops
    secretRef:
      name: sops-age
