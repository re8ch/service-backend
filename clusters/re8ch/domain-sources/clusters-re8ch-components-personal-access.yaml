apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: watchtower-amber
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-personal-access
  ref:
    digest: sha256:0487c5dd02a7d45e836c081a2ac8b9212ebb1c99314945f80bca181f99e75720
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: watchtower-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-personal-access
  decryption:
    provider: sops
    secretRef:
      name: sops-age
