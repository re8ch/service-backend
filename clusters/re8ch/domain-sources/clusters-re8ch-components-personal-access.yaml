apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: aegis-copper
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-personal-access
  ref:
    digest: sha256:28c90f54c1c2f4ca6c43d9a11205902d4b4d56f059cadf958ba12d25338025bb
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: aegis-copper
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-personal-access
  decryption:
    provider: sops
    secretRef:
      name: sops-age
