apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-personal-access
  ref:
    digest: sha256:011e8f5fed5ec380fc101cf0563b376286b147c3be5371e8dddb4d4a98676d02
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-personal-access
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/personal-access
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-personal-access
  decryption:
    provider: sops
    secretRef:
      name: sops-age
