apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-network-podcidr-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/network/podcidr-fabric
    delivery.re8ch.com/codename: etesian-jade
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-network-podcidr-fabric
  ref:
    digest: sha256:e256c908185f77064beeb3a0c51858466ff95230911f80a3443b8594a4347c51
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-network-podcidr-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/network/podcidr-fabric
    delivery.re8ch.com/codename: etesian-jade
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-network-podcidr-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
