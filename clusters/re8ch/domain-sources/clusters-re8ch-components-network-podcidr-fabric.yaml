apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-clusters-re8ch-components-network-podcidr-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/network/podcidr-fabric
    delivery.re8ch.com/codename: bora-indigo
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/clusters-re8ch-components-network-podcidr-fabric
  ref:
    digest: sha256:27b78cfab74891334a00cc7fc6bace3929aa685093812d9509ca5d6b4b7a1c1f
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-clusters-re8ch-components-network-podcidr-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: clusters/re8ch/components/network/podcidr-fabric
    delivery.re8ch.com/codename: bora-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-clusters-re8ch-components-network-podcidr-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
