apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-external-projects
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/external-projects
    delivery.re8ch.com/codename: meridian
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-external-projects
  ref:
    digest: sha256:92b5ae6de10c0e9c992fb1077a3f230d2187872b444ca8c85e6ea464ffeba67b
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-external-projects
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/external-projects
    delivery.re8ch.com/codename: meridian
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-external-projects
  decryption:
    provider: sops
    secretRef:
      name: sops-age
