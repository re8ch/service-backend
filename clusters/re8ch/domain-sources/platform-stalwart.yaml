apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: flare-silver
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-stalwart
  ref:
    digest: sha256:d6447c0af07ac9fab73d0dc9517b999a9c9ce3ffbb059ae53d6d8efa8d430812
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: flare-silver
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-stalwart
  decryption:
    provider: sops
    secretRef:
      name: sops-age
