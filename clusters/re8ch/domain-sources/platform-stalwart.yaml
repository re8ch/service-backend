apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: starfire-indigo
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-stalwart
  ref:
    digest: sha256:696ec798a2a9dee130dd08f469031f616840460a8a94849a16dd75763b279f15
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: starfire-indigo
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-stalwart
  decryption:
    provider: sops
    secretRef:
      name: sops-age
