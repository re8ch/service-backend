apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: aurora-pearl
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-stalwart
  ref:
    digest: sha256:304636ba3aac5356a71324f7ba16a1b8d82f2754bb53eb977595a93d22c626c5
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: aurora-pearl
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-stalwart
  decryption:
    provider: sops
    secretRef:
      name: sops-age
