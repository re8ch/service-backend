apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: torch-pearl
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-stalwart
  ref:
    digest: sha256:50ccb31f29d892d489cba62feb3afdac4c29a75f2b1961305c4ac80196bb6d96
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: torch-pearl
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-stalwart
  decryption:
    provider: sops
    secretRef:
      name: sops-age
