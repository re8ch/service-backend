apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: aurora-jade
    delivery.re8ch.com/attestation: github-native
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-stalwart
  ref:
    digest: sha256:2a6b8bfe4a2772d166cca7a7a978114994ce8a7a69ed0d91a74f8c04ff95d137
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-stalwart
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/stalwart
    delivery.re8ch.com/codename: aurora-jade
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-stalwart
  decryption:
    provider: sops
    secretRef:
      name: sops-age
