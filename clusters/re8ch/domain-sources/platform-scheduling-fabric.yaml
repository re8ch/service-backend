apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: grove-umber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-scheduling-fabric
  ref:
    digest: sha256:a621e69e40b41d6750a557d6b79c323ae4b075e516e6a3a28fa7d2abdb751d43
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: grove-umber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-scheduling-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
