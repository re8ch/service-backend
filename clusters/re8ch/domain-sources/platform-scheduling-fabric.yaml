apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: delta
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-scheduling-fabric
  ref:
    digest: sha256:a2ba3d30d43597c35c9719915c77c8ddda0f884873c5bc391c8ebb7d0e98c562
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: delta
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-scheduling-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
