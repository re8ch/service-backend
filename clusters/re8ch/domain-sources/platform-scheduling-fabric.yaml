apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: delta-umber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-scheduling-fabric
  ref:
    digest: sha256:9e2354aff206951e34eccd3e3d04ee357db6beb141db0f9ddfb0eb2e02773e31
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-scheduling-fabric
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/scheduling-fabric
    delivery.re8ch.com/codename: delta-umber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-scheduling-fabric
  decryption:
    provider: sops
    secretRef:
      name: sops-age
