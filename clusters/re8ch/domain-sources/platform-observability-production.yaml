apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-production
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/production
    delivery.re8ch.com/codename: aperture-copper
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-production
  ref:
    digest: sha256:17b25d81c0c0537116122edb1bc2a49a43817204ae42f76795c18dd526f96342
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
