apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-agent-onboarding-runtime
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/agent-onboarding-runtime
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-agent-onboarding-runtime
  ref:
    digest: sha256:49c58ae6c88d4c6040e2b58002b7da9f659f4aa3763341df990d54c3aabb3d6f
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-agent-onboarding-runtime
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/agent-onboarding-runtime
    delivery.re8ch.com/codename: aegis
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-agent-onboarding-runtime
  decryption:
    provider: sops
    secretRef:
      name: sops-age
