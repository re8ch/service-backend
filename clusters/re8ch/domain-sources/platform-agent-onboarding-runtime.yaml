apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-agent-onboarding-runtime
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/agent-onboarding-runtime
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-agent-onboarding-runtime
  ref:
    digest: sha256:fdd0bf0fa80402aff1b055e0715e9cc1f7ce03ac037728db75b8613302999847
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-agent-onboarding-runtime
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/agent-onboarding-runtime
    delivery.re8ch.com/codename: bastion
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-agent-onboarding-runtime
  decryption:
    provider: sops
    secretRef:
      name: sops-age
