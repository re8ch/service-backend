apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-bootstrap
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/bootstrap
    delivery.re8ch.com/codename: prism
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-bootstrap
  ref:
    digest: sha256:7683ffce81add75449c8ebf787ae6176be060e610c619802ad3b686da053ce09
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
