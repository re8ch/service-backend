apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-bootstrap
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/bootstrap
    delivery.re8ch.com/codename: telescope
spec:
  interval: 10m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-bootstrap
  ref:
    digest: sha256:8f531d9fd7e28c04cbfee91b5c0bcc8865fb1ce53cb9964e79deed5ea657a225
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
