apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-bootstrap
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/bootstrap
    delivery.re8ch.com/codename: prism-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-bootstrap
  ref:
    digest: sha256:9b575a00c4d44c65fbdaaab3081ce5191358bfb5234dc51428c4810a67be4efb
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
