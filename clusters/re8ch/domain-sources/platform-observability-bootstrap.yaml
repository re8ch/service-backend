apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-bootstrap
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/bootstrap
    delivery.re8ch.com/codename: aperture-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-bootstrap
  ref:
    digest: sha256:088ea7adbcb327190f9f8d997320fe5856ef5b8b8356abcd326a18ef3ad98195
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
