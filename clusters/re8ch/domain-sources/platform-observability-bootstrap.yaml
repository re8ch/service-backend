apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-observability-bootstrap
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/observability/bootstrap
    delivery.re8ch.com/codename: focus-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-observability-bootstrap
  ref:
    digest: sha256:c5ba5d7ea31c9ea9f0fa3d7c2b0acab20c8100e29722c79b16a0b8e1110a7fd6
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
