apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-among-clusters
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/among-clusters
    delivery.re8ch.com/codename: chinook-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-among-clusters
  ref:
    digest: sha256:64f1c21d74d54db62847ede5d6392e174c9f4547deaa61597d946bddac42b960
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-among-clusters
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/among-clusters
    delivery.re8ch.com/codename: chinook-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-among-clusters
  decryption:
    provider: sops
    secretRef:
      name: sops-age
