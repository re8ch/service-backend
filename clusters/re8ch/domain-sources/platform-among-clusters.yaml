apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: domain-platform-among-clusters
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/among-clusters
    delivery.re8ch.com/codename: bora-amber
spec:
  interval: 1m
  url: oci://registry.re8ch.com/gitops-controlplane/platform-among-clusters
  ref:
    digest: sha256:caaabb5650fd4e1de16d63ef75393e3e20370e6353b37a0d2553e51718fb68bf
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token\.actions\.githubusercontent\.com$
      subject: ^https://github\.com/re8ch/service\-backend/\.github/workflows/domain\-oci\-release\.yml@refs/heads/main$
  secretRef:
    name: gitops-oci-reader
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: domain-platform-among-clusters
  namespace: flux-system
  annotations:
    delivery.re8ch.com/module: platform/among-clusters
    delivery.re8ch.com/codename: bora-amber
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./
  prune: false
  wait: false
  sourceRef:
    kind: OCIRepository
    name: domain-platform-among-clusters
  decryption:
    provider: sops
    secretRef:
      name: sops-age
