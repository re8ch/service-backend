apiVersion: apps/v1
kind: Deployment
metadata: {name: gitlab-agent, namespace: gitlab-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app: gitlab-agent}}
  template:
    metadata: {labels: {app: gitlab-agent}}
    spec:
      serviceAccountName: gitlab-agent
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
                  - {key: kubernetes.io/hostname, operator: NotIn, values: [restricted-node-6dc3f140f9]}
      containers:
        - name: agentk
          image: registry.re8ch.com/functions-shared/gitlab-agentk@sha256:a951ecb82430cea62dff4d2e0468ed027ed6dfd995d537c315b686e867d76756
          args: [--kas-address=wss://kas.gitlab.com]
          env:
            - name: AGENTK_TOKEN
              valueFrom: {secretKeyRef: {name: gitlab-agent-token, key: token}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gitlab-agent, namespace: gitlab-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: gitlab-agent-observer}
rules:
  - apiGroups: ["", apps, batch, networking.k8s.io]
    resources: [nodes, namespaces, pods, services, endpoints, events, deployments, statefulsets, daemonsets, jobs, cronjobs, ingresses]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [receivers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: gitlab-agent-observer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gitlab-agent-observer}
subjects: [{kind: ServiceAccount, name: gitlab-agent, namespace: gitlab-agent}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitlab-agent-flux-receiver, namespace: flux-system}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [receivers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitlab-agent-flux-receiver, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitlab-agent-flux-receiver}
subjects: [{kind: ServiceAccount, name: gitlab-agent, namespace: gitlab-agent}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitlab-agent-leader-election, namespace: gitlab-agent}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitlab-agent-leader-election, namespace: gitlab-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitlab-agent-leader-election}
subjects: [{kind: ServiceAccount, name: gitlab-agent, namespace: gitlab-agent}]
