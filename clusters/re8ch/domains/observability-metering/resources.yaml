apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: icp-guangzhou
    app.kubernetes.io/name: globalping-probe
    app.kubernetes.io/part-of: public-edge-observability
  name: globalping-probe-icp
  namespace: globalping-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: icp-guangzhou
      app.kubernetes.io/name: globalping-probe
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: icp-guangzhou
        app.kubernetes.io/name: globalping-probe
        app.kubernetes.io/part-of: public-edge-observability
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GP_ADOPTION_TOKEN
          valueFrom:
            secretKeyRef:
              key: GP_ADOPTION_TOKEN
              name: globalping-adoption
        image: docker.io/globalping/globalping-probe:latest
        imagePullPolicy: IfNotPresent
        name: probe
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_RAW
            drop:
            - ALL
        volumeMounts:
        - mountPath: /app/.cache
          name: state
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: vm-20-12-ubuntu
      tolerations:
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: globalping-probe-icp-data
