ed objects","type":"table","gridPos":{"h":12,"w":8,"x":16,"y":13},"datasource":{"type":"victoriametrics-logs-datasource","uid":"re8ch-vlogs"},"targets":[{"refId":"A","expr":"signal.type:kubernetes.event | stats by (regarding.kind,regarding.name,reason) count()"}]}],"refresh":"30s","schemaVersion":41,"tags":["re8ch","events","kubernetes","otel"],"templating":{"list":[]},"time":{"from":"now-6h","to":"now"},"title":"RE8CH Event Stream","uid":"re8ch-events","version":1}
  re8ch-fleet.json: |
