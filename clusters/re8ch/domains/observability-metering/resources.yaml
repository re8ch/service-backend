apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-alertmanager-base
  namespace: observability-system
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: incidentrelay-warning
      group_by: [cluster, namespace, service, alertname]
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 4h
      routes:
        - receiver: incidentrelay-critical
          matchers: ['severity=~"critical|high"']
          group_wait: 15s
          group_interval: 5m
          repeat_interval: 30m
        - receiver: incidentrelay-info
          matchers: ['severity="info"']
          repeat_interval: 24h
    receivers:
      - name: incidentrelay-critical
        webhook_configs:
          - url: http://secretary-alertmanager-intake.re8ch-secretary.svc.cluster.local/v1/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
          - url: http://incidentrelay.incidentrelay.svc.cluster.local:8080/api/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/vm/secrets/incidentrelay-alertmanager-tokens/critical
      - name: incidentrelay-warning
        webhook_configs:
          - url: http://secretary-alertmanager-intake.re8ch-secretary.svc.cluster.local/v1/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
          - url: http://incidentrelay.incidentrelay.svc.cluster.local:8080/api/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/vm/secrets/incidentrelay-alertmanager-tokens/warning
      - name: incidentrelay-info
        webhook_configs:
          - url: http://secretary-alertmanager-intake.re8ch-secretary.svc.cluster.local/v1/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
          - url: http://incidentrelay.incidentrelay.svc.cluster.local:8080/api/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/vm/secrets/incidentrelay-alertmanager-tokens/info
type: Opaque
