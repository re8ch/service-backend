apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: bootstrap-admin
    app.kubernetes.io/name: incidentrelay
  name: incidentrelay-bootstrap-admin-v3
  namespace: incidentrelay
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bootstrap-admin
        app.kubernetes.io/name: incidentrelay
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - restricted-node-6dc3f140f9
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          until python manage.py migration-status >/dev/null 2>&1; do
            sleep 5
          done
          python manage.py create-admin \
            --username "$ADMIN_USERNAME" \
            --display-name "$ADMIN_DISPLAY_NAME" \
            --email "$ADMIN_EMAIL" \
            --password "$ADMIN_PASSWORD"
        command:
        - /bin/sh
        - -ec
        env:
        - name: INCIDENTRELAY_CONFIG_FILE
          value: /etc/incidentrelay/incidentrelay.conf
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_DISPLAY_NAME
          valueFrom:
            secretKeyRef:
              key: display-name
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              key: email
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: incidentrelay-bootstrap-admin
        image: ghcr.io/roxy-wi/incidentrelay@sha256:5d3af4a530dbe38970caf1124133b01d422860893621a7ac8439551afef21b4a
        imagePullPolicy: IfNotPresent
        name: create-admin
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/incidentrelay
          name: config
          readOnly: true
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        secret:
          secretName: incidentrelay-config
