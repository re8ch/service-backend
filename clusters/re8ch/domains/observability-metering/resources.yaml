---
apiVersion: v1
data:
  contracts.json: |
    {
      "version": 2,
      "cadences": {
        "fast": {
          "periodSeconds": 300,
          "externalCron": "2/5 * * * *",
          "internalCron": "4/5 * * * *"
        },
        "standard": {
          "periodSeconds": 1800,
          "externalCron": "18,48 * * * *",
          "internalCron": "20,50 * * * *"
        }
      },
      "probes": [
        {
          "id": "auth-discovery",
          "owner": "platform/identity-access",
          "vantage": "external",
          "cadence": "standard",
          "url": "https://auth.re8ch.com/.well-known/openid-configuration",
          "status": 200,
          "jsonField": "issuer",
          "equals": "https://auth.re8ch.com"
        },
        {
          "id": "cloud-mcp-auth-challenge",
          "owner": "platform/cloud-platform",
          "vantage": "external",
          "cadence": "fast",
          "url": "https://tools.service.re8ch.com/cloud/mcp",
          "accept": "application/json, text/event-stream",
          "status": 401,
          "header": "Www-Authenticate",
          "contains": "Bearer"
        },
        {
          "id": "id-discovery",
          "owner": "platform/identity-access",
          "vantage": "external",
          "cadence": "standard",
          "url": "https://id.re8ch.com/.well-known/openid-configuration",
          "status": 200,
          "jsonField": "issuer",
          "equals": "https://id.re8ch.com"
        },
        {
          "id": "registry-auth-challenge",
          "owner": "platform/registry",
          "vantage": "external",
          "cadence": "fast",
          "url": "https://registry.re8ch.com/v2/",
          "status": 401,
          "header": "Www-Authenticate",
          "contains": "Bearer"
        },
        {
          "id": "grafana-health",
          "owner": "platform/observability",
          "vantage": "external",
          "cadence": "standard",
          "url": "https://grafana.service.re8ch.com/grafana/api/health",
          "status": 200,
          "jsonField": "database",
          "equals": "ok"
        },
        {
          "id": "cloud-platform-internal-health",
          "owner": "platform/cloud-platform",
          "vantage": "internal",
          "cadence": "fast",
          "url": "http://re8ch-cloud-platform.ai-operations.svc.cluster.local:19443/healthz",
          "status": 200
        },
        {
          "id": "auth-gateway-internal-health",
          "owner": "platform/identity-access",
          "vantage": "internal",
          "cadence": "standard",
          "url": "http://re8ch-auth-gateway.auth.svc.cluster.local:8080/auth/healthz",
          "status": 200
        }
      ]
    }
  smoke.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import { Rate } from 'k6/metrics';
    import exec from 'k6/execution';

    const catalog = JSON.parse(open('./contracts.json'));
    const contractFailures = new Rate('contract_failures');
    const vantage = __ENV.PROBE_VANTAGE || 'external';
    const cadence = __ENV.PROBE_CADENCE || 'all';
    const probes = catalog.probes.filter((probe) =>
      probe.vantage === vantage && (cadence === 'all' || probe.cadence === cadence));
    const expectedStatuses = Object.fromEntries(
      [...new Set(probes.map((probe) => probe.status))].map((status) => [status, http.expectedStatuses(status)]));
    if (probes.length === 0) {
      throw new Error(`No probes for ${vantage}/${cadence}`);
    }

    export const options = {
      scenarios: {
        smoke: { executor: 'shared-iterations', vus: 1, iterations: 3, maxDuration: '2m' },
      },
      thresholds: {
        contract_failures: ['rate==0'],
        http_req_duration: ['p(95)<15000'],
      },
    };

    export default function () {
      for (const probe of probes) {
        const runID = `${Date.now()}-${exec.scenario.iterationInTest}`;
        const response = http.get(probe.url, {
          headers: {
            ...(probe.accept ? { Accept: probe.accept } : {}),
            'X-Observable-Synthetic': 'true',
            'X-Observable-Run-ID': runID,
            'X-Observable-Journey': probe.id,
            'X-Observable-Agent': 'robot',
            'X-Observable-Load-Class': 'probe',
            baggage: `synthetic_request=true,observable.journey=${probe.id},observable.agent=robot,observable.load_class=probe`,
          },
          redirects: 0,
          timeout: '15s',
          responseCallback: expectedStatuses[probe.status],
          tags: { probe: probe.id, owner: probe.owner, vantage, cadence: probe.cadence, load_class: 'probe' },
        });
        let valid = response.status === probe.status;
        if (valid && probe.jsonField) {
          try {
            valid = response.json(probe.jsonField) === probe.equals;
          } catch (_) {
            valid = false;
          }
        }
        if (valid && probe.header) {
          valid = String(response.headers[probe.header] || '').includes(probe.contains);
        }
        contractFailures.add(!valid, { probe: probe.id });
        check(response, { [`${probe.id} contract`]: () => valid }, { probe: probe.id });
      }
    }
