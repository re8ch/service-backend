apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  labels:
    observability.re8ch.com/managed: "true"
  name: application-critical
  namespace: observability-system
spec:
  discoveryRole: endpointslice
  endpoints:
  - honorLabels: false
    interval: 15s
    path: /metrics
    port: metrics
    relabelConfigs:
    - sourceLabels:
      - __meta_kubernetes_namespace
      targetLabel: namespace
    - sourceLabels:
      - __meta_kubernetes_service_name
      targetLabel: service
    - sourceLabels:
      - __meta_kubernetes_endpointslice_endpoint_node_name
      targetLabel: node
    - sourceLabels:
      - __meta_kubernetes_service_label_app_kubernetes_io_name
      targetLabel: app
    - sourceLabels:
      - __meta_kubernetes_service_label_app_kubernetes_io_component
      targetLabel: component
    - sourceLabels:
      - __meta_kubernetes_service_annotation_observability_re8ch_com_owner
      targetLabel: owner
    - sourceLabels:
      - __meta_kubernetes_service_annotation_observability_re8ch_com_runbook
      targetLabel: runbook
    - sourceLabels:
      - __meta_kubernetes_service_annotation_observability_re8ch_com_metrics_doc
      targetLabel: metrics_doc
    - sourceLabels:
      - __meta_kubernetes_service_label_observability_re8ch_com_tier
      targetLabel: tier
    scrapeTimeout: 10s
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      observability.re8ch.com/scrape: "true"
      observability.re8ch.com/tier: critical
