        image: moby/buildkit@sha256:995077ff90af1afff56ff23018699d7511d122b2b111041f2011bd12afd5c0fe
        name: buildkit
        resources:
          limits:
            cpu: "4"
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          appArmorProfile:
            type: Unconfined
          runAsGroup: 1000
          runAsUser: 1000
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - mountPath: /run/user/1000/buildkit
          name: socket
        - mountPath: /home/user/.local/share/buildkit
          name: cache
        - mountPath: /etc/buildkit
          name: buildkit-config
          readOnly: true
      imagePullSecrets:
      - name: harbor-registry-pull
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      serviceAccountName: harbor-supply-chain
      volumes:
      - configMap:
          name: harbor-supply-chain-buildkit
        name: buildkit-config
      - name: state
        persistentVolumeClaim:
          claimName: harbor-supply-chain-state
      - emptyDir:
          sizeLimit: 4Gi
        name: tmp
      - emptyDir: {}
        name: socket
      - emptyDir:
          sizeLimit: 20Gi
        name: cache
      - name: signing
        secret:
          defaultMode: 288
          secretName: harbor-supply-chain-signing
      - name: api-access
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
