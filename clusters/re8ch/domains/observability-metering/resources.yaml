        - name: GF_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              key: name
              name: re8ch-grafana-database
        - name: GF_DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-database
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
