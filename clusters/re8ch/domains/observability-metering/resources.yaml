    {
      "incidentrelay-critical": {
        "owner": "platform-observability",
        "kind": "secretary_and_incidentrelay_webhook",
        "failure_domain": "multi-path",
        "facts": ["attempted"],
        "notes": "Receiver invocation is not provider acceptance, device delivery, human attention, or ACK."
      },
      "incidentrelay-warning": {
        "owner": "platform-observability",
        "kind": "secretary_and_incidentrelay_webhook",
        "failure_domain": "multi-path",
        "facts": ["attempted"],
        "notes": "Secretary manages the delivery state and leaves unavailable evidence unknown."
      },
      "incidentrelay-info": {
        "owner": "platform-observability",
        "kind": "secretary_and_incidentrelay_webhook",
        "failure_domain": "multi-path",
        "facts": ["attempted"],
        "notes": "Informational events are delivered by IncidentRelay; Secretary receives only a side-channel routing observation."
      }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-notification-receiver-catalog
  namespace: observability-system
---
apiVersion: v1
data:
  re8ch-costs.json: |
    {
      "annotations": {
        "list": []
      },
      "datasource": {
        "type": "prometheus",
        "uid": "re8ch-costs"
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Dynamic valuation feed",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(re8ch_fair_value_refresh_success)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DEGRADED",
                      "color": "red"
                    },
                    "1": {
                      "text": "CURRENT",
                      "color": "green"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Usable fair values",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(re8ch_fair_value_usable)"
            }
          ]
        },
        {
          "id": 3,
          "title": "Unknown fair values",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(re8ch_fair_value_usable == 0)"
            }
          ]
        },
        {
          "id": 4,
          "title": "Independent sources (minimum)",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(re8ch_fair_value_source_count{status=\"usable\"})"
            }
          ]
        },
        {
          "id": 5,
          "title": "Book vs fair monthly value",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "re8ch_book_value_monthly_cny{node=~\"$node\"}",
              "legendFormat": "book {{node}}"
            },
            {
              "refId": "B",
              "expr": "re8ch_fair_value_monthly_cny{node=~\"$node\"}",
              "legendFormat": "fair {{node}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Fair/book variance ratio",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "re8ch_fair_value_variance_ratio{node=~\"$node\"}",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Current node reconciliation",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 10,
            "w": 16,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "re8ch_book_value_monthly_cny{node=~\"$node\"}",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "re8ch_fair_value_monthly_cny{node=~\"$node\"}",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "re8ch_fair_value_source_count{node=~\"$node\"}",
              "format": "table",
              "instant": true
            }
          ]
        },
        {
          "id": 8,
          "title": "Unknown reason",
          "type": "table",
          "datasource": {"type": "prometheus", "uid": "re8ch-costs"},
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 16,
            "y": 13
          },
          "targets": [
            {
              "refId": "A",
              "expr": "re8ch_fair_value_usable{status=\"unknown\",node=~\"$node\"} == 0",
              "format": "table",
              "instant": true
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": [
        "re8ch",
        "finops",
        "opencost",
        "fair-value"
      ],
      "templating": {
        "list": [
          {
            "name": "node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "re8ch-costs"
            },
            "query": {
              "query": "label_values(re8ch_fair_value_usable,node)"
            },
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "title": "RE8CH Cost: book and dynamic fair value",
      "uid": "re8ch-costs",
      "version": 1
    }
  re8ch-events.json: |
