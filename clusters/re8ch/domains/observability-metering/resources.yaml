            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsUser: 100
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /livez
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/re8ch-supply-chain
          name: state
        - mountPath: /tmp
          name: tmp
        - mountPath: /run/buildkit
          name: socket
        - mountPath: /etc/cosign
