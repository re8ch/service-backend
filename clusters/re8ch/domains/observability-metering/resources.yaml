apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    observability.re8ch.com/managed: "true"
  name: re8ch-observability
  namespace: observability-system
spec:
  groups:
  - interval: 30s
    name: re8ch.inventory.recording
    rules:
    - expr: label_replace(sum by (node) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
        / clamp_min(sum by (node) (kube_node_status_allocatable{resource="cpu",unit="core"}),
        0.001), "instance", "$1", "node", "(.*)")
      record: instance:node_cpu_utilisation:rate:sum
    - expr: instance:node_cpu_utilisation:rate:sum
      record: instance:node_cpu:ratio
    - expr: label_replace(sum by (node) (container_memory_working_set_bytes{container!="",image!=""})
        / clamp_min(sum by (node) (kube_node_status_allocatable{resource="memory",unit="byte"}),
        1), "instance", "$1", "node", "(.*)")
      record: instance:node_memory_utilisation:ratio
    - expr: sum by (cluster, node, namespace, pod) (rate(container_cpu_usage_seconds_total{container!="",image!=""}[5m]))
      record: re8ch:node:pod:cpu_cores:rate5m
    - expr: sum by (cluster, node, namespace, pod) (container_memory_working_set_bytes{container!="",image!=""})
      record: re8ch:node:pod:memory_working_set_bytes
    - expr: sum by (cluster, node) (rate(container_network_receive_bytes_total[5m]))
      record: re8ch:node:network:receive_bytes:rate5m
    - expr: sum by (cluster, node) (rate(container_network_transmit_bytes_total[5m]))
      record: re8ch:node:network:transmit_bytes:rate5m
    - expr: sum by (namespace, deployment) (kube_deployment_spec_replicas) or sum
        by (namespace, statefulset) (kube_statefulset_replicas)
      record: re8ch:workload:desired_replicas
    - expr: sum by (namespace, deployment) (kube_deployment_status_replicas_ready)
        or sum by (namespace, statefulset) (kube_statefulset_status_replicas_ready)
      record: re8ch:workload:ready_replicas
    - expr: sum by (namespace, service) (kube_endpointslice_endpoints{ready="true"})
      record: re8ch:service:ready_endpoints
    - expr: kubelet_volume_stats_used_bytes / clamp_min(kubelet_volume_stats_capacity_bytes,
        1)
      record: re8ch:pvc:used_ratio
  - interval: 30s
    name: re8ch.application.recording
    rules:
    - expr: avg by (cluster, namespace, service, app, owner, tier, runbook, metrics_doc)
        (up{namespace!=""})
      record: re8ch:service:target_up:ratio
    - expr: sum by (cluster, namespace, service, app, owner, tier, method, route,
        status_class) (rate(re8ch_http_server_requests_total[5m]))
      record: re8ch:service:http_requests:rate5m
    - expr: sum by (cluster, namespace, service, app, owner, tier) (rate(re8ch_http_server_requests_total{status_class="5xx"}[5m]))
        / clamp_min(sum by (cluster, namespace, service, app, owner, tier) (rate(re8ch_http_server_requests_total[5m])),
        0.001)
      record: re8ch:service:http_errors:ratio5m
    - expr: histogram_quantile(0.95, sum by (cluster, namespace, service, app, owner,
        tier, le) (rate(re8ch_http_server_request_duration_seconds_bucket[5m])))
      record: re8ch:service:http_latency:p95_5m
    - expr: max by (cluster, namespace, service, app, owner, tier, resource) (max_over_time(re8ch_service_saturation_ratio[5m]))
      record: re8ch:service:saturation:max5m
    - expr: histogram_quantile(0.95, sum by (service_name, service_namespace, span_name,
        le) (rate(traces_span_metrics_duration_milliseconds_bucket[5m])))
      record: re8ch:trace:service_latency:p95_5m
  - interval: 1m
    name: re8ch.coverage.alerts
    rules:
    - alert: Re8chObservabilityContractMissing
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} must publish owner,
          tier, metrics documentation, SLO and runbook metadata.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md
        summary: Scraped target is missing its observability contract
      expr: up{namespace!="",service!="",owner=""} == 1 or up{namespace!="",service!="",tier=""}
        == 1 or up{namespace!="",service!="",metrics_doc=""} == 1
      for: 30m
      labels:
        alert_layer: prometheus
        owner: platform-observability
        policy_id: platform-default
        service: observability-governance
        severity: info
        tier: standard
    - alert: Re8chCriticalMetricsTargetDown
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} on {{ $labels.node
          }} has not been scrapeable for five minutes.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: Critical service metrics target is unreachable
      expr: up{tier="critical"} == 0
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-observability
        policy_id: platform-default
        service: metrics-ingestion
        severity: critical
        tier: critical
    - alert: Re8chNodeInventoryNotReady
      annotations:
        description: Node {{ $labels.node }} is not Ready and every workload mapped
          to it must be checked.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/inventory/platform/generated/PLATFORM-INVENTORY.md
        summary: Inventory node is not Ready
      expr: kube_node_status_condition{condition="Ready",status="true"} != 1
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-infra
        policy_id: platform-default
        service: kubernetes-node
        severity: critical
        tier: critical
  - interval: 1m
    name: re8ch.storage.alerts
    rules:
    - alert: Re8chReadyNodeStorageTelemetryMissing
      annotations:
        description: Node {{ $labels.node }} is Ready but its filesystem and swap
          exporter has not reported for 15 minutes. Capacity is unknown, not zero.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ready-node-storage.md
        summary: Ready node has no storage capacity telemetry
      expr: (kube_node_status_condition{condition="Ready",status="true"} == 1) unless
        on (node) node_memory_SwapTotal_bytes{job="re8ch-node-storage-exporter"}
      for: 15m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: node-storage-exporter
        severity: warning
        signal_domain: storage
        tier: high
    - alert: Re8chReadyNodeFilesystemLow
      annotations:
        description: '{{ $labels.node }} {{ $labels.mountpoint }} has low available
          space. Inspect the filesystem and approved reclaim candidates before deleting
          anything.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ready-node-storage.md
        summary: Ready node filesystem has less than 15 percent available
      expr: (node_filesystem_avail_bytes{job="re8ch-node-storage-exporter"} / node_filesystem_size_bytes{job="re8ch-node-storage-exporter"}
        < 0.15) and on (node, device, mountpoint, fstype) (node_filesystem_readonly{job="re8ch-node-storage-exporter"}
        == 0) and on (node) (kube_node_status_condition{condition="Ready",status="true"}
        == 1)
      for: 30m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: node-filesystem
        severity: warning
        signal_domain: storage
        tier: high
    - alert: Re8chReadyNodeFilesystemCritical
      annotations:
        description: '{{ $labels.node }} {{ $labels.mountpoint }} is close to full.
          Do not delete PVC or Ceph data as an automated cleanup.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ready-node-storage.md
        summary: Ready node filesystem has less than 5 percent available
      expr: (node_filesystem_avail_bytes{job="re8ch-node-storage-exporter"} / node_filesystem_size_bytes{job="re8ch-node-storage-exporter"}
        < 0.05) and on (node, device, mountpoint, fstype) (node_filesystem_readonly{job="re8ch-node-storage-exporter"}
        == 0) and on (node) (kube_node_status_condition{condition="Ready",status="true"}
        == 1)
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: node-filesystem
        severity: critical
        signal_domain: storage
        tier: critical
    - alert: Re8chReadyNodeSwapHigh
      annotations:
        description: Node {{ $labels.node }} swap pressure is sustained. Review workload
          memory and host swap before changing storage.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ready-node-storage.md
        summary: Ready node swap use exceeds 80 percent
      expr: (1 - node_memory_SwapFree_bytes{job="re8ch-node-storage-exporter"} / clamp_min(node_memory_SwapTotal_bytes{job="re8ch-node-storage-exporter"},
        1) > 0.8) and on (node) (node_memory_SwapTotal_bytes{job="re8ch-node-storage-exporter"}
        > 0) and on (node) (kube_node_status_condition{condition="Ready",status="true"}
        == 1)
      for: 30m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: node-swap
        severity: warning
        signal_domain: storage
        tier: high
    - alert: Re8chCephHealthError
      annotations:
        description: Ceph has a health error; do not provision or migrate observability
          storage until unfound and damaged PG conditions are resolved.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ceph-storage-gate-2026-08-25.md
        summary: Ceph reports HEALTH_ERR
      expr: ceph_health_status > 1
      for: 2m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: ceph
        severity: critical
        signal_domain: storage
        tier: critical
    - alert: Re8chCephOSDDown
      annotations:
        description: OSD {{ $labels.ceph_daemon }} is down or out.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ceph-storage-gate-2026-08-25.md
        summary: Ceph OSD is down or out
      expr: ceph_osd_up == 0 or ceph_osd_in == 0
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: ceph-osd
        severity: critical
        signal_domain: storage
        tier: critical
    - alert: Re8chCephPoolNearFull
      annotations:
        description: Pool {{ $labels.name }} usage is {{ $value }} percent.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/ceph-storage-gate-2026-08-25.md
        summary: Ceph pool usage exceeds 80 percent
      expr: ceph_pool_percent_used > 80
      for: 15m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: ceph-pool
        severity: warning
        signal_domain: storage
        tier: critical
    - alert: Re8chPVCNearlyFull
      annotations:
        description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim
          }} on {{ $labels.node }} is nearly full.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: Persistent volume is more than 85 percent full
      expr: re8ch:pvc:used_ratio > 0.85
      for: 15m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: kubernetes-pvc
        severity: warning
        signal_domain: storage
        tier: high
    - alert: Re8chPVCPending
      annotations:
        description: PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim
          }} has not bound.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: PersistentVolumeClaim remains Pending
      expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-storage
        policy_id: platform-default
        service: kubernetes-pvc
        severity: warning
        signal_domain: storage
        tier: high
  - interval: 30s
    name: re8ch.network.alerts
    rules:
    - alert: Re8chCiliumAgentMissing
      annotations:
        description: Cilium metrics are unavailable for {{ $labels.node }}.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/platform-history/k3s-cilium-gateway-operations-runbook-2026-08-16.md
        summary: Cilium agent metrics are missing on a node
      expr: count by (node) (up{service="cilium-agent"} == 1) < 1
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-network
        policy_id: platform-default
        service: cilium
        severity: critical
        signal_domain: network
        tier: critical
    - alert: Re8chHubbleDropBurst
      annotations:
        description: Drop reason {{ $labels.reason }} exceeds five packets per second
          between namespaces.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/platform-history/network-routing-cost-observability-2026-08-02.md
        summary: Hubble observes sustained dropped traffic
      expr: sum by (source_namespace, destination_namespace, reason) (rate(hubble_drop_total[5m]))
        > 5
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-network
        policy_id: platform-default
        service: hubble
        severity: warning
        signal_domain: network
        tier: high
    - alert: Re8chAdvancedFabricDNSFailureRatio
      annotations:
        description: DNS failures have remained elevated for ten minutes.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/platform-history/k3s-cilium-gateway-operations-runbook-2026-08-16.md
        summary: Advanced Fabric DNS failure ratio exceeds two percent
      expr: sum(rate(advanced_fabric_dns_failures_total[5m])) / clamp_min(sum(rate(advanced_fabric_dns_queries_total[5m])),
        0.001) > 0.02
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-network
        policy_id: platform-default
        service: advanced-fabric-dns
        severity: warning
        signal_domain: network
        tier: critical
    - alert: Re8chNodeNetworkErrors
      annotations:
        description: '{{ $labels.node }}/{{ $labels.device }} exceeds one error per
          second.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/platform-history/network-routing-cost-observability-2026-08-02.md
        summary: Node interface reports sustained errors
      expr: sum by (node, device) (rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]))
        > 1
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-network
        policy_id: platform-default
        service: node-network
        severity: warning
        signal_domain: network
        tier: high
  - interval: 60s
    name: re8ch.stateful.alerts
    rules:
    - alert: Re8chPostgreSQLExporterDown
      annotations:
        description: PostgreSQL instance {{ $labels.ins }} on {{ $labels.ip }} is
          not reporting healthy metrics.
        runbook_url: https://github.com/Vonng/pigsty
        summary: Pigsty PostgreSQL instance or exporter is unhealthy
      expr: pg_up == 0 or pg_exporter_last_scrape_error != 0
      for: 5m
      labels:
        alert_layer: prometheus
        owner: platform-data
        policy_id: platform-default
        service: pigsty-postgresql
        severity: critical
        signal_domain: stateful
        tier: critical
    - alert: Re8chPostgreSQLReplicationLag
      annotations:
        description: Instance {{ $labels.ins }} replication lag is {{ $value }} seconds.
        runbook_url: https://github.com/Vonng/pigsty
        summary: PostgreSQL replication lag exceeds five minutes
      expr: pg_replication_lag > 300
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-data
        policy_id: platform-default
        service: pigsty-postgresql
        severity: warning
        signal_domain: stateful
        tier: critical
    - alert: Re8chStatefulSetUnavailable
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.statefulset }} is missing
          ready replicas.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: StatefulSet has unavailable replicas
      expr: kube_statefulset_replicas - kube_statefulset_status_replicas_ready > 0
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-data
        policy_id: platform-default
        service: kubernetes-statefulset
        severity: warning
        signal_domain: stateful
        tier: high
  - interval: 30s
    name: re8ch.stateless.alerts
    rules:
    - alert: Re8chApplicationHealthFailed
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} reports {{ $labels.dependency
          }} unhealthy.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md
        summary: Application reports a failed dependency
      expr: min by (namespace, service, owner, tier, dependency) (re8ch_service_health)
        < 1
      for: 3m
      labels:
        alert_layer: prometheus
        owner: platform-products
        policy_id: platform-default
        service: application-health
        severity: critical
        signal_domain: stateless
        tier: high
    - alert: Re8chApplicationHighErrorRatio
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} has sustained
          elevated errors.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md
        summary: Application HTTP 5xx ratio exceeds five percent
      expr: re8ch:service:http_errors:ratio5m > 0.05 and on (cluster, namespace, service,
        app, owner, tier) re8ch:service:http_requests:rate5m > 0.1
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-products
        policy_id: platform-default
        service: application-http
        severity: warning
        signal_domain: stateless
        tier: high
    - alert: Re8chApplicationHighLatency
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} p95 latency is
          {{ $value }} seconds.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md
        summary: Application p95 latency exceeds one second
      expr: re8ch:service:http_latency:p95_5m > 1
      for: 10m
      labels:
        alert_layer: prometheus
        owner: platform-products
        policy_id: platform-default
        service: application-http
        severity: warning
        signal_domain: stateless
        tier: high
    - alert: Re8chApplicationSaturated
      annotations:
        description: '{{ $labels.namespace }}/{{ $labels.service }} resource {{ $labels.resource
          }} is saturated.'
        runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md
        summary: Application reports saturation above 90 percent
      expr: re8ch:service:saturation:max5m > 0.90
      for: 15m
      labels:
        alert_layer: prometheus
        owner: platform-products
        policy_id: platform-default
        service: application-capacity
        severity: warning
        signal_domain: stateless
        tier: high
  - interval: 30s
    name: re8ch.alerting.delivery-management
    rules:
    - alert: Re8chAlertingWatchdog
      annotations:
        description: This continuously firing alert proves the rule-to-Alertmanager-to-Secretary
          observation path when its periodic delivery attempt appears in the Secretary
          ledger.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: RE8CH alerting delivery-management watchdog
      expr: vector(1)
      labels:
        alert_layer: prometheus
        namespace: observability-system
        owner: platform-observability
        policy_id: platform-default
        service: alerting-watchdog
        severity: warning
        signal_domain: observability
        tier: critical
    - alert: Re8chAlertmanagerNotificationFailures
      annotations:
        description: Alertmanager integration {{ $labels.integration }} has failed
          one or more notification attempts in the last ten minutes.
        runbook_url: https://github.com/re8ch/service-backend/blob/main/platform/observability/README.md
        summary: Alertmanager receiver requests are failing
      expr: sum by (integration) (increase(alertmanager_notifications_failed_total[10m]))
        > 0
      for: 2m
      labels:
        alert_layer: prometheus
        namespace: observability-system
        owner: platform-observability
        policy_id: platform-default
        service: alertmanager
        severity: high
        signal_domain: observability
        tier: critical
---
apiVersion: operator.victoriametrics.com/v1beta1
