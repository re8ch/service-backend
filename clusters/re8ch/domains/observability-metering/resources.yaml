        - mountPath: /var/lib/grafana/dashboards
          name: dashboard-files
          readOnly: true
        - mountPath: /etc/grafana/provisioning/alerting/re8ch-composite-alerts.yaml
          name: alerts
          readOnly: true
          subPath: composite-alerts.yaml
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 472
      serviceAccountName: re8ch-grafana
      volumes:
      - emptyDir:
