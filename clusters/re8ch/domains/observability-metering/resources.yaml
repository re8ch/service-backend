  endpoints:
  - interval: 30s
    port: web
    relabelConfigs:
    - replacement: observability
      targetLabel: signal_domain
    - replacement: platform-observability
      targetLabel: owner
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - observability-system
  selector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - vmalert
      - vmalertmanager
