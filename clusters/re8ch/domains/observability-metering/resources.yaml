apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: qianwen-observability
  name: kube-state-metrics
  namespace: kube-system
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: qianwen-observability
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: kube-state-metrics
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - --host=0.0.0.0
        - --port=8080
        - --telemetry-host=0.0.0.0
        - --telemetry-port=8081
        - --resources=pods,nodes,namespaces,deployments,replicasets,statefulsets,daemonsets,jobs,cronjobs,services,persistentvolumeclaims
        - --metric-labels-allowlist=pods=[app.kubernetes.io/name,nuclio.io/function-name,qianwen.env],deployments=[app.kubernetes.io/name,nuclio.io/function-name,qianwen.env]
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          initialDelaySeconds: 10
          periodSeconds: 20
          tcpSocket:
            port: http-metrics
          timeoutSeconds: 3
        name: kube-state-metrics
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8081
          name: telemetry
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 384Mi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
      imagePullSecrets:
      - name: registry-re8ch
      nodeSelector:
        kubernetes.io/os: linux
        scheduling.re8ch.com/service-plane: core
      serviceAccountName: kube-state-metrics
      tolerations:
      - effect: NoSchedule
