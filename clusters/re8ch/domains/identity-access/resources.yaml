data:
  auth-owner.sql: |
    -- Apply as supabase_auth_admin before 046_identity_platform_sessions.sql.
    -- GoTrue owns session tables with RLS enabled. Expose a boolean for the verified
    -- request only; SELECT grants alone do not cross this ownership boundary.
    begin;
    grant usage on schema auth to supabase_admin;
    grant references(id) on auth.sessions, auth.users to supabase_admin;
    create or replace function auth.platform_session_active()
    returns boolean language sql stable security definer
    set search_path = pg_catalog, pg_temp as $$
      select exists (
        select 1 from auth.sessions s
        where s.id = nullif(nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'session_id', '')::uuid
          and s.user_id = nullif(nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub', '')::uuid
          and (s.not_after is null or s.not_after > now())
          -- GoTrue v2.196 supports both legacy token rows and HMAC refresh tokens.
          -- HMAC sessions carry the rotation counter on the session itself.
          and ((s.refresh_token_counter is not null and s.refresh_token_hmac_key is not null)
            or exists (select 1 from auth.refresh_tokens r where r.session_id = s.id and not r.revoked))
      )
    $$;
    alter function auth.platform_session_active() owner to supabase_auth_admin;
    revoke all on function auth.platform_session_active() from public, anon, authenticated;
    grant execute on function auth.platform_session_active() to supabase_admin;
    commit;
    -- Apply as the GoTrue table owner. Existing SELECT grants do not bypass RLS.
    -- Only the trusted identity RPC owner can read users; API roles receive no access.
    begin;
    drop policy if exists identity_rpc_user_read on auth.users;
    create policy identity_rpc_user_read on auth.users for select to supabase_admin using (true);
    commit;
  migration.sql: |
    -- Reviewed Cloud Functions 43eb7f2

    -- Persist one platform entitlement decision per verified GoTrue login session.
    -- Token refresh preserves session_id; a new login is evaluated independently.
    begin;
    create table if not exists core.platform_session_entitlements (
      session_id uuid primary key references auth.sessions(id) on delete cascade,
      user_id uuid not null references auth.users(id) on delete cascade,
      allowed boolean not null,
      decided_at timestamptz not null default now()
    );
    alter table core.platform_session_entitlements owner to supabase_admin;
    alter table core.platform_session_entitlements enable row level security;
    revoke all on core.platform_session_entitlements from public, anon, authenticated;

    create or replace function api.platform_session_entitlement()
    returns jsonb language plpgsql volatile security definer
    set search_path = pg_catalog, pg_temp as $$
    declare v_user uuid := api.current_user_id(); v_session uuid; v_allowed boolean;
    begin
      v_session := nullif(nullif(current_setting('request.jwt.claims', true), '')::jsonb
        ->> 'session_id', '')::uuid;
      if v_user is null or v_session is null then
        raise exception 'authenticated login session required' using errcode = '28000';
      end if;
      -- No cached grant outlives logout, revocation, expiry, or its actual owner.
      if not auth.platform_session_active() then
        raise exception 'session is no longer active' using errcode = '28000';
      end if;
      select allowed into v_allowed from core.platform_session_entitlements
        where session_id = v_session and user_id = v_user;
      if not found then
        -- Concurrent replicas must not evaluate and overwrite different decisions.
        perform pg_advisory_xact_lock(hashtextextended('platform-session:' || v_session::text, 0));
        select allowed into v_allowed from core.platform_session_entitlements
          where session_id = v_session and user_id = v_user;
        if not found then
          v_allowed := core.is_platform_admin(v_user);
          insert into core.platform_session_entitlements(session_id, user_id, allowed)
            values(v_session, v_user, v_allowed);
        end if;
      end if;
      return jsonb_build_object('sessionId', v_session, 'subject', v_user, 'platformAdmin', v_allowed);
    end $$;
    alter function api.platform_session_entitlement() owner to supabase_admin;
    revoke all on function api.platform_session_entitlement() from public, anon;
    grant execute on function api.platform_session_entitlement() to authenticated;
    commit;
    notify pgrst, 'reload schema';

    -- Platform sessions reuse the established organization functions and invariants.
    -- A session grant is not an organization membership: only this authenticated
    -- login can use it, and it disappears with the actual GoTrue session.
    begin;
    create or replace function core.has_platform_session(p_user_id uuid)
    returns boolean language sql stable security definer
    set search_path=pg_catalog,pg_temp as $$
     select p_user_id=api.current_user_id() and auth.platform_session_active() and exists(
      select 1 from core.platform_session_entitlements g
      where g.user_id=p_user_id and g.allowed
       and g.session_id::text=coalesce(nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'session_id',''))
    $$;
    alter function core.has_platform_session(uuid) owner to supabase_admin;
    revoke all on function core.has_platform_session(uuid) from public,anon,authenticated;

    -- Keep the existing UI's step-up rule for sessions without a platform grant.
    create or replace function core.require_admin_step_up()
    returns void language plpgsql stable security definer
    set search_path=pg_catalog,pg_temp as $$
    begin
     if core.has_platform_session(api.current_user_id()) then return;end if;
     if coalesce(nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'aal','')<>'aal2' then
      raise exception 'verify your authenticator before this admin action' using errcode='42501';
     end if;
    end $$;
    alter function core.require_admin_step_up() owner to supabase_admin;
    revoke all on function core.require_admin_step_up() from public,anon,authenticated;

    create or replace function core.can_manage_org(p_user_id uuid,p_tenant_ref text,p_owner_only boolean default false)
    returns boolean language sql stable security definer
    set search_path=pg_catalog,pg_temp as $$
     with recursive ancestors(tenant_ref,parent_ref,depth) as (
      select tenant_ref,parent_ref,0 from core.organizations where tenant_ref=p_tenant_ref and status='active'
      union all
      select p.tenant_ref,p.parent_ref,a.depth+1 from core.organizations p join ancestors a on p.tenant_ref=a.parent_ref
       where p.status='active' and a.depth<50)
     select (core.has_platform_session(p_user_id) and exists(select 1 from ancestors)) or exists(
      select 1 from ancestors a join core.organization_members m on m.tenant_ref=a.tenant_ref
      where m.user_id=p_user_id and m.status='active' and (m.role='owner' or (not p_owner_only and m.role='admin')))
    $$;
    alter function core.can_manage_org(uuid,text,boolean) owner to supabase_admin;
    revoke all on function core.can_manage_org(uuid,text,boolean) from public,anon,authenticated;

    create or replace function api.platform_organization_get(p_tenant_ref text)
    returns jsonb language plpgsql stable security definer
    set search_path=pg_catalog,pg_temp as $$
    declare v_org core.organizations;
    begin
     if not core.has_platform_session(api.current_user_id()) then raise exception 'platform session required' using errcode='42501';end if;
     select * into v_org from core.organizations where tenant_ref=p_tenant_ref;
     if not found then raise exception 'organization not found' using errcode='P0002';end if;
     return jsonb_build_object('tenantRef',v_org.tenant_ref,'displayName',v_org.display_name,'parentRef',v_org.parent_ref,'kind',v_org.kind,'status',v_org.status);
    end $$;
    alter function api.platform_organization_get(text) owner to supabase_admin;
    revoke all on function api.platform_organization_get(text) from public,anon;
    grant execute on function api.platform_organization_get(text) to authenticated;

    create or replace function api.platform_organization_members(p_tenant_ref text,p_limit integer default 100,p_offset integer default 0)
    returns jsonb language plpgsql stable security definer
    set search_path=pg_catalog,pg_temp as $$
    declare v_result jsonb;
    begin
     perform api.platform_organization_get(p_tenant_ref);
     if p_limit is null or p_limit<1 or p_limit>250 or p_offset is null or p_offset<0 then raise exception 'invalid pagination';end if;
     select coalesce(jsonb_agg(to_jsonb(m)),'[]'::jsonb) into v_result from (
      select user_id as "userId",role,status,created_at as "createdAt",updated_at as "updatedAt"
      from core.organization_members where tenant_ref=p_tenant_ref order by created_at,user_id limit p_limit offset p_offset) m;
     return jsonb_build_object('tenantRef',p_tenant_ref,'members',v_result);
    end $$;
    alter function api.platform_organization_members(text,integer,integer) owner to supabase_admin;
    revoke all on function api.platform_organization_members(text,integer,integer) from public,anon;
    grant execute on function api.platform_organization_members(text,integer,integer) to authenticated;
    commit;
    notify pgrst,'reload schema';

    -- User CRUD source: re8ch/cloud-functions PR #107
    -- Credential lifecycle belongs to GoTrue, never direct writes to auth.users.
    begin;
    create or replace function api.platform_user_delete_guard(p_user_id uuid)
    returns jsonb language plpgsql volatile security definer
    set search_path=pg_catalog,pg_temp as $$
    begin
     if not core.has_platform_session(api.current_user_id()) then raise exception 'platform session required' using errcode='42501';end if;
     if p_user_id=api.current_user_id() or exists(select 1 from core.organization_members where user_id=p_user_id and tenant_ref='admin' and status='active') then
      raise exception 'protected user' using errcode='23505';
     end if;
     if not exists(select 1 from auth.users where id=p_user_id and deleted_at is null) then raise exception 'user not found' using errcode='P0002';end if;
     if exists(select 1 from core.organization_members m join core.organizations o on o.tenant_ref=m.tenant_ref where m.user_id=p_user_id and m.status='active' and o.kind<>'personal' and o.status='active') then
      raise exception 'remove organization memberships before deleting user' using errcode='23505';
     end if;
     if exists(select 1 from core.organizations parent join core.organizations child on child.parent_ref=parent.tenant_ref where parent.personal_owner_id=p_user_id and child.status='active') then
      raise exception 'move child organizations before deleting user' using errcode='23505';
     end if;
     return jsonb_build_object('personalOrganizations',coalesce((select jsonb_agg(tenant_ref) from core.organizations where personal_owner_id=p_user_id and kind='personal'),'[]'::jsonb));
    end $$;
    alter function api.platform_user_delete_guard(uuid) owner to supabase_admin;
    revoke all on function api.platform_user_delete_guard(uuid) from public,anon;
    grant execute on function api.platform_user_delete_guard(uuid) to authenticated;
    -- Read and update the same profile authority used by User Hub.
    create or replace function api.platform_users(p_user_id uuid default null, p_page integer default 1, p_per_page integer default 50)
    returns jsonb language plpgsql stable security definer set search_path=pg_catalog,pg_temp as $$
    declare result jsonb;
    begin
     if not core.has_platform_session(api.current_user_id()) then raise exception 'platform session required' using errcode='42501';end if;
     if p_page is null or p_page<1 or p_page>10000 or p_per_page is null or p_per_page<1 or p_per_page>100 then raise exception 'invalid pagination' using errcode='22023';end if;
     select coalesce(jsonb_agg(row), '[]'::jsonb) into result from (
      select u.id,coalesce(u.email,'') as email,coalesce(p.display_name,'') as "displayName",u.created_at as "createdAt",
       u.email_confirmed_at is not null as "emailConfirmed",false as deleted
      from auth.users u left join core.user_profiles p on p.user_id=u.id
      where u.deleted_at is null and (p_user_id is null or u.id=p_user_id)
      order by u.created_at,u.id limit p_per_page offset ((p_page-1)*p_per_page)
     ) row;
     if p_user_id is not null then
      if jsonb_array_length(result)=0 then raise exception 'user not found' using errcode='P0002';end if;
      return result->0;
     end if;
     return jsonb_build_object('users',result);
    end $$;
    alter function api.platform_users(uuid,integer,integer) owner to supabase_admin;
    revoke all on function api.platform_users(uuid,integer,integer) from public,anon;
    grant execute on function api.platform_users(uuid,integer,integer) to authenticated;

    create or replace function api.platform_user_update(p_user_id uuid,p_display_name text)
    returns jsonb language plpgsql volatile security definer set search_path=pg_catalog,pg_temp as $$
    begin
     perform api.platform_users(p_user_id);
     if p_display_name is null or length(btrim(p_display_name)) not between 1 and 80 then raise exception 'invalid display name' using errcode='22023';end if;
     perform core.ensure_user_profile(p_user_id);
     update core.user_profiles set display_name=btrim(p_display_name),updated_at=now() where user_id=p_user_id;
     return api.platform_users(p_user_id);
    end $$;
    alter function api.platform_user_update(uuid,text) owner to supabase_admin;
    revoke all on function api.platform_user_update(uuid,text) from public,anon;
    grant execute on function api.platform_user_update(uuid,text) to authenticated;
    notify pgrst,'reload schema';
    commit;
kind: ConfigMap
metadata:
  name: supabase-platform-admin-api-v5
  namespace: supabase-identity
---
apiVersion: v1
data:
  migration.sql: |
    begin;
    update core.organizations set display_name = 'Re8CH Admin', updated_at = now() where tenant_ref = 'admin';
    update core.organizations set display_name = 'Re8ch', parent_ref = 'admin', updated_at = now() where tenant_ref = 're8ch';

    create table if not exists core.organization_context_audit (
      id bigint generated always as identity primary key,
      actor_user_id uuid references auth.users(id) on delete set null,
      source_tenant_ref text,
      target_tenant_ref text,
      action text not null,
      before_state jsonb not null default '{}'::jsonb,
      after_state jsonb not null default '{}'::jsonb,
      request_id text,
      created_at timestamptz not null default now()
    );
    alter table core.organization_context_audit owner to supabase_admin;
    alter table core.organization_context_audit enable row level security;
    revoke all on core.organization_context_audit from public, anon, authenticated, service_role;

    -- Membership is an entitlement, not the current request context. A user may
    -- belong to multiple organizations; user_active_organizations below selects
    -- the single organization whose resources are active for the session.

    create table if not exists core.user_active_organizations (
      user_id uuid primary key references auth.users(id) on delete cascade,
      tenant_ref text not null references core.organizations(tenant_ref),
      updated_at timestamptz not null default now()
    );
    alter table core.user_active_organizations owner to supabase_admin;
    alter table core.user_active_organizations enable row level security;
    revoke all on core.user_active_organizations from public, anon, authenticated, service_role;

    insert into core.user_active_organizations(user_id, tenant_ref)
    select u.id, choice.tenant_ref from auth.users u
    cross join lateral (
      select m.tenant_ref from core.organization_members m
      join core.organizations o on o.tenant_ref = m.tenant_ref
      where m.user_id = u.id and m.status = 'active' and o.status = 'active'
      order by case when o.kind <> 'personal' then 0 else 1 end,
        case m.tenant_ref when 'admin' then 0 when 're8ch' then 1 else 2 end, m.tenant_ref
      limit 1
    ) choice
    where u.deleted_at is null on conflict (user_id) do nothing;

    create or replace function core.can_access_tenant_resources(p_user_id uuid, p_tenant_ref text)
    returns boolean language sql stable security definer set search_path = pg_catalog, pg_temp as $$
      select p_user_id = api.current_user_id() and exists (
        select 1 from core.organization_members m
        join core.organizations o on o.tenant_ref = m.tenant_ref
        join core.user_active_organizations a on a.user_id = m.user_id and a.tenant_ref = m.tenant_ref
        where m.user_id = p_user_id and m.tenant_ref = p_tenant_ref
          and m.status = 'active' and o.status = 'active')
    $$;
    alter function core.can_access_tenant_resources(uuid, text) owner to supabase_admin;
    revoke all on function core.can_access_tenant_resources(uuid, text) from public, anon, authenticated, service_role;

    drop function if exists api.my_tenant_runtime_contexts();
    create function api.my_tenant_runtime_contexts()
    returns table(tenant_ref text, tenant_role text, tenant_kind text, display_name text, parent_ref text, is_active boolean)
    language plpgsql volatile security definer set search_path = pg_catalog, pg_temp as $$
    declare v_user uuid := api.current_user_id(); v_personal text; v_active text;
    begin
      if v_user is null then raise exception 'authenticated user required' using errcode = '28000'; end if;
      perform core.ensure_personal_organization(v_user);
      update core.organization_members m set status = 'active', role = 'owner', updated_at = now()
      from core.organizations o
      where m.user_id = v_user and m.tenant_ref = o.tenant_ref
        and o.kind = 'personal' and o.personal_owner_id = v_user and o.status = 'active'
        and (m.status <> 'active' or m.role <> 'owner');
      select o.tenant_ref into v_personal from core.organizations o
      join core.organization_members m on m.tenant_ref = o.tenant_ref and m.user_id = v_user
      where o.kind = 'personal' and o.personal_owner_id = v_user
        and o.status = 'active' and m.status = 'active' order by o.created_at limit 1;
      select a.tenant_ref into v_active from core.user_active_organizations a
      join core.organization_members m on m.user_id = a.user_id and m.tenant_ref = a.tenant_ref
      join core.organizations o on o.tenant_ref = a.tenant_ref
      where a.user_id = v_user and m.status = 'active' and o.status = 'active';
      if v_active is null and v_personal is not null then
        insert into core.user_active_organizations(user_id, tenant_ref, updated_at)
        values(v_user, v_personal, now()) on conflict (user_id) do update
          set tenant_ref = excluded.tenant_ref, updated_at = excluded.updated_at;
        v_active := v_personal;
      end if;
      return query select m.tenant_ref,
        case m.role when 'owner' then 'admin' when 'admin' then 'admin'
          when 'member' then 'operator' when 'viewer' then 'viewer' end,
        o.kind, o.display_name, o.parent_ref, m.tenant_ref = v_active
      from core.organization_members m join core.organizations o on o.tenant_ref = m.tenant_ref
      join auth.users u on u.id = m.user_id
      where m.user_id = v_user and m.status = 'active' and o.status = 'active'
        and u.deleted_at is null and m.role in ('owner', 'admin', 'member', 'viewer')
      order by (m.tenant_ref = v_active) desc, (o.kind = 'personal') desc, m.tenant_ref;
    end $$;
    alter function api.my_tenant_runtime_contexts() owner to supabase_admin;
    revoke all on function api.my_tenant_runtime_contexts() from public, anon, service_role;
    grant usage on schema api to authenticated;
    grant execute on function api.my_tenant_runtime_contexts() to authenticated;

    create or replace function api.select_active_organization(p_tenant_ref text)
    returns jsonb language plpgsql volatile security definer set search_path = pg_catalog, pg_temp as $$
    declare v_user uuid := api.current_user_id(); v_before text; v_request_id text;
    begin
      if v_user is null then raise exception 'authenticated user required' using errcode = '28000'; end if;
      if not exists (select 1 from core.organization_members m
        join core.organizations o on o.tenant_ref = m.tenant_ref
        where m.user_id = v_user and m.tenant_ref = p_tenant_ref
          and m.status = 'active' and o.status = 'active') then
        raise exception 'active organization membership required' using errcode = '42501';
      end if;
      perform pg_advisory_xact_lock(hashtextextended('active-organization:' || v_user::text, 0));
      select tenant_ref into v_before from core.user_active_organizations where user_id = v_user;
      insert into core.user_active_organizations(user_id, tenant_ref, updated_at)
      values(v_user, p_tenant_ref, now()) on conflict (user_id) do update
        set tenant_ref = excluded.tenant_ref, updated_at = excluded.updated_at;
      v_request_id := coalesce(nullif(current_setting('request.headers', true), '')::jsonb ->> 'x-request-id', gen_random_uuid()::text);
      insert into core.organization_context_audit(
        actor_user_id, source_tenant_ref, target_tenant_ref, action, before_state, after_state, request_id)
      values(v_user, v_before, p_tenant_ref, 'active_organization_selected',
        jsonb_build_object('tenantRef', v_before), jsonb_build_object('tenantRef', p_tenant_ref), v_request_id);
      return jsonb_build_object('tenantRef', p_tenant_ref, 'active', true, 'requestId', v_request_id);
    end $$;
    alter function api.select_active_organization(text) owner to supabase_admin;
    revoke all on function api.select_active_organization(text) from public, anon, service_role;
    grant execute on function api.select_active_organization(text) to authenticated;
    notify pgrst, 'reload schema';
    commit;
