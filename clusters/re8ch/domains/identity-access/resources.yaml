    import base64
    import datetime
    import json
    import os
    import secrets
    import ssl
    import subprocess
    import urllib.error
    import urllib.request

    API = "https://kubernetes.default.svc"
    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8").read().strip()
    CONTEXT = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
    CLI = "/cli/usr/local/bin/stalwart-cli"
    ACCOUNTS_PATH = "/apis/governance.re8ch.com/v1alpha1/namespaces/git-workspaces/gitaccounts"
    STALWART_ADMIN_MANAGED = {
        "re8ch-image-admin", "re8ch-cloud-admin", "re8ch-observability-admin",
        "re8ch-ai-admin", "re8ch-business-admin",
    }
    recovery_user, separator, recovery_password = os.environ.pop("STALWART_RECOVERY_ADMIN").partition(":")
    if separator != ":" or not recovery_user or not recovery_password:
        raise RuntimeError("invalid recovery credential reference")
    os.environ["STALWART_USER"] = recovery_user
    os.environ["STALWART_PASSWORD"] = recovery_password

    def kube(method, path, body=None, content_type="application/json"):
        payload = None if body is None else json.dumps(body, separators=(",", ":")).encode()
        request = urllib.request.Request(
            API + path,
            data=payload,
            method=method,
            headers={"Authorization": "Bearer " + TOKEN, "Content-Type": content_type},
        )
        try:
            with urllib.request.urlopen(request, context=CONTEXT, timeout=20) as response:
                return json.load(response) if response.length != 0 else {}
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return None
            raise

    def cli(*arguments, stdin=None, env=None):
        result = subprocess.run(
            [CLI, *arguments], input=stdin, text=True, capture_output=True,
            env=env or os.environ, timeout=180, check=False,
        )
        if result.returncode:
            raise RuntimeError("stalwart-cli failed without exposing credential output")
        return result.stdout

    def secret_name(account):
        reference = (((account.get("spec") or {}).get("collaboration") or {}).get("credentialSecretRef") or {})
        if reference.get("namespace") not in (None, "mail-system"):
            raise RuntimeError("credential Secret must remain in mail-system")
        return reference.get("name") or account["metadata"]["name"] + "-stalwart-credentials"

    def load_or_create_password(account, email):
        name = secret_name(account)
        path = "/api/v1/namespaces/mail-system/secrets/" + name
        current = kube("GET", path)
        if current:
            encoded = (current.get("data") or {}).get("password")
            if not encoded:
                raise RuntimeError("credential Secret exists without password")
            return base64.b64decode(encoded).decode()
        password = secrets.token_urlsafe(32)
        values = {"email": email, "username": email, "password": password}
        kube("POST", "/api/v1/namespaces/mail-system/secrets", {
            "apiVersion": "v1", "kind": "Secret",
            "metadata": {
                "name": name, "namespace": "mail-system",
                "labels": {"app.kubernetes.io/managed-by": "stalwart-mailbox-provisioner"},
                "annotations": {"governance.re8ch.com/git-account": account["metadata"]["name"]},
            },
            "type": "Opaque",
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        })
        return password

    def retire_managed_password_copy(account):
        name = secret_name(account)
        path = "/api/v1/namespaces/mail-system/secrets/" + name
        current = kube("GET", path)
        if not current:
            return
        metadata = current.get("metadata") or {}
        if (metadata.get("labels") or {}).get("app.kubernetes.io/managed-by") != "stalwart-mailbox-provisioner" or (metadata.get("annotations") or {}).get("governance.re8ch.com/git-account") != account["metadata"]["name"]:
            raise RuntimeError("refusing to delete an unmanaged mailbox Secret")
        kube("DELETE", path)

    def patch_status(account, phase, reason):
        name = account["metadata"]["name"]
        now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
        kube("PATCH", ACCOUNTS_PATH + "/" + name + "/status", {
            "status": {"mailbox": {"phase": phase, "provider": "stalwart", "observedAt": now, "reason": reason}}
        }, "application/merge-patch+json")

    accounts = [
        item for item in kube("GET", ACCOUNTS_PATH)["items"]
        if (item.get("spec") or {}).get("mailbox") == "stalwart"
    ]
    group_projects = {
        "platform-shared": {
            "advanced-fabric", "among-clusters", "brand-assets", "cloud-functions", "cluster-website",
            "codex-admin-plugins", "connectool", "farseer", "headlamp-advanced-fabric",
            "headlamp-birfucate", "image-website", "mihomos-cluster", "observable-website",
            "product-public-data", "re8ch-core", "registry-product-site", "service-backend",
            "tool-distribution",
        },
        "anycam-shared": {"anycam", "anycam-backend", "anycam-ios", "anycam-website"},
        "anysiteonearth-shared": {"anysiteonearth", "anysiteonearth-website"},
        "baozou-ppt-studio-shared": {"baozou-ppt-studio", "director-engines"},
        "garageband-shared": {"garageband-mcp", "garageband-mcp-site"},
        "ledger-shared": {"ledger", "ledger-dashboard", "ledger-site"},
        "phonaid-shared": {"phonaid-android", "phonaid-service", "phonaid-website"},
        "re8ch-image-admins": {"re8ch-image"},
        "re8ch-cloud-admins": {"re8ch-cloud"},
        "re8ch-observability-admins": {"re8ch-observability"},
        "re8ch-ai-admins": {"re8ch-ai"},
        "re8ch-business-admins": {"re8ch-business"},
    }
    domain_rows = [json.loads(line) for line in cli("query", "Domain", "--fields", "id,name", "--json").splitlines()]
    domain = next((row for row in domain_rows if row.get("name") == "phonaid.com"), None)
    if not domain:
        raise RuntimeError("phonaid.com domain is not provisioned")

    group_plan = []
    for index, name in enumerate(group_projects):
        group_plan.append({
            "@type": "upsert", "object": "Account", "matchOn": ["name", "domainId"],
            "value": {"group-" + str(index): {
                "@type": "Group", "name": name, "domainId": domain["id"],
                "description": name.removesuffix("-shared").replace("-", " ").title() + " shared workspace",
                "roles": {"@type": "Default"}, "permissions": {"@type": "Inherit"},
                "quotas": {}, "aliases": {},
            }},
        })
    cli("apply", "--stdin", "--json", stdin="\n".join(json.dumps(item) for item in group_plan) + "\n")
    group_rows = [json.loads(line) for line in cli("query", "Account", "--fields", "id,name", "--json").splitlines()]
    group_ids = {row["name"]: row["id"] for row in group_rows if row.get("name") in group_projects}
    if set(group_ids) != set(group_projects):
        raise RuntimeError("Stalwart group reconciliation is incomplete")
    account_rows = [json.loads(line) for line in cli("query", "Account", "--fields", "id,name", "--json").splitlines()]
    existing_names = {row["name"] for row in account_rows}

    # Harry is the SSO-backed mailbox owner and the canonical administrator.
    # Match both name and domain so a legacy homonym cannot gain Admin rights.
    re8ch_domain = next((row for row in domain_rows if row.get("name") == "re8ch.com"), None)
    if not re8ch_domain:
        raise RuntimeError("re8ch.com domain is not provisioned")
    harry_rows = [json.loads(line) for line in cli(
        "query", "Account", "--fields", "id,name,domainId,roles,aliases", "--json"
    ).splitlines() if line.strip()]
    harry = [row for row in harry_rows if row.get("name") == "harry" and row.get("domainId") == re8ch_domain["id"]]
    if len(harry) != 1 or not any(
        alias.get("name") == "admin" and alias.get("domainId") == re8ch_domain["id"] and alias.get("enabled")
        for alias in (harry[0].get("aliases") or {}).values()
    ):
        raise RuntimeError("canonical Harry account or admin@re8ch.com alias is missing")
    if harry[0].get("roles") != {"@type": "Admin"}:
        cli("update", "Account", harry[0]["id"], "--json", '{"roles":{"@type":"Admin"}}')

    # The operator is harry@re8ch.com. admin@re8ch.com is its Stalwart alias.
    # Do not recreate the retired phonaid administrator on hourly runs.
    plan = []
    pending = []
    migrated = []
    for index, account in enumerate(accounts):
        try:
            email = account["spec"]["email"]
            local, separator, domain_name = email.partition("@")
            if separator != "@" or domain_name != "phonaid.com" or not local:
                raise RuntimeError("invalid canonical mailbox address")
            if account["metadata"]["name"] in STALWART_ADMIN_MANAGED:
                previous = (account.get("status") or {}).get("mailbox") or {}
                legacy_copy = kube("GET", "/api/v1/namespaces/mail-system/secrets/" + secret_name(account))
                if local not in existing_names or (legacy_copy and (previous.get("phase") != "Ready" or previous.get("provider") != "stalwart")):
                    patch_status(account, "Failed", "StalwartAdminCredentialReviewRequired")
                    continue
                # Leave the Stalwart account and its password untouched. Only
                # the mail administrator may rotate its credential from now on.
                migrated.append(account)
                continue
            password = load_or_create_password(account, email)
            project = account["spec"].get("project")
            memberships = {
                group_ids[name]: True for name, projects in group_projects.items() if project in projects
            }
            plan.append({
                "@type": "upsert", "object": "Account", "matchOn": ["name", "domainId"],
                "value": {"account-" + str(index): {
                    "@type": "User", "name": local, "domainId": domain["id"],
                    "description": account["spec"].get("displayName") or account["metadata"]["name"],
                    "credentials": {"0": {"@type": "Password", "secret": password}},
                    "roles": {"@type": "User"}, "permissions": {"@type": "Inherit"},
                    "memberGroupIds": memberships, "quotas": {}, "aliases": {},
                    "encryptionAtRest": {"@type": "Disabled"},
                }},
            })
            pending.append(account)
        except Exception:
            patch_status(account, "Failed", "CredentialProvisioningFailed")

    list_plan = []
    for index, (group_name, projects) in enumerate(group_projects.items()):
        list_name = group_name.removesuffix("-shared") if group_name.endswith("-shared") else group_name + "-mailing-list"
        recipients = {
            account["spec"]["email"]: True for account in accounts
            if account["spec"].get("project") in projects
        }
        list_plan.append({
            "@type": "upsert", "object": "MailingList", "matchOn": ["name", "domainId"],
            "value": {"list-" + str(index): {
                "name": list_name, "domainId": domain["id"],
                "description": list_name.replace("-", " ").title() + " maintainers",
                "recipients": recipients, "aliases": {},
            }},
        })
    list_plan.append({
        "@type": "upsert", "object": "MailingList", "matchOn": ["name", "domainId"],
        "value": {"list-all": {
            "name": "maintainers", "domainId": domain["id"],
            "description": "All repository maintainers",
            "recipients": {account["spec"]["email"]: True for account in accounts}, "aliases": {},
        }},
    })
    plan.extend(list_plan)
    if plan:
        try:
            cli("apply", "--stdin", "--json", stdin="\n".join(json.dumps(item) for item in plan) + "\n")
            cli("create", "Action", "--json", '{"@type":"InvalidateCaches"}')
        except Exception:
            for account in pending:
                patch_status(account, "Failed", "StalwartApplyFailed")
            raise
        for account in pending:
            patch_status(account, "Ready", "PrincipalAndPasswordReady")
    for account in migrated:
        try:
            retire_managed_password_copy(account)
            patch_status(account, "Ready", "StalwartAdminManaged")
        except Exception:
            patch_status(account, "Failed", "CredentialCopyRetirementFailed")
            raise
    print(json.dumps({"accounts": len(accounts), "ready": len(pending) + len(migrated), "stalwartManaged": len(migrated)}))
