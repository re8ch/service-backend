apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-adguard
  namespace: egress-fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: access-adguard
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        access.re8ch.com/config-revision: 20260827-1
      labels:
        app.kubernetes.io/name: access-adguard
        app.kubernetes.io/part-of: access-dns
        scheduling.re8ch.com/control-plane-allowed: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --no-check-update
        - -c
        - /opt/adguardhome/conf/AdGuardHome.yaml
        - -w
        - /opt/adguardhome/work
        image: docker.io/adguard/adguardhome:v0.107.76@sha256:904e081ea2d67fc6440696960eac009c0f649a5eabf44da409dfc36c8b3304c9
        livenessProbe:
          periodSeconds: 15
          tcpSocket:
            port: dns-tcp
        name: adguard
        ports:
        - containerPort: 5353
          name: dns-udp
          protocol: UDP
        - containerPort: 5353
          name: dns-tcp
          protocol: TCP
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: dns-tcp
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: data
          subPath: work
        - mountPath: /opt/adguardhome/conf
          name: data
          subPath: conf
      initContainers:
      - args:
        - |
          import socket, time
          target = ("mosdns.egress-fabric.svc.cluster.local", 5353)
          for attempt in range(60):
              try:
                  socket.create_connection(target, 2).close()
                  break
              except OSError:
                  if attempt == 59:
                      raise
                  time.sleep(2)
        command:
        - python
        - -c
        image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        name: wait-mosdns
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      - args:
        - from pathlib import Path; (Path('/data/work')).mkdir(parents=True,exist_ok=True);
          (Path('/data/conf')).mkdir(parents=True,exist_ok=True); Path('/data/conf/AdGuardHome.yaml').write_bytes(Path('/template/AdGuardHome.yaml').read_bytes())
        command:
        - python
        - -c
        image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
        name: initialize
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /template
          name: config
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: access-adguard-data
      - configMap:
          name: access-dns-config
        name: config
