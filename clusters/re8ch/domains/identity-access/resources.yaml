    api = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT_HTTPS"])
    context = ssl.create_default_context(cafile=root + "/ca.crt")
    headers = {"Authorization": "Bearer " + bearer, "Content-Type": "application/json"}

    def request(method, path, body=None):
        payload = None if body is None else json.dumps(body, separators=(",", ":")).encode()
        req = urllib.request.Request(api + path, data=payload, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, context=context, timeout=15) as response:
                return json.load(response) if response.length else {}
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return None
            raise

    source = request("GET", "/api/v1/namespaces/qianwen-ops/secrets/cloudflare-pg-dns-controller-secret")
    encoded = (source.get("data") or {}).get("CF_API_TOKEN") if source else None
    if not encoded:
        raise RuntimeError("Cloudflare credential source is unavailable")

    target_path = "/api/v1/namespaces/mail-system/secrets/stalwart-cloudflare-dns-token"
    current = request("GET", target_path)
