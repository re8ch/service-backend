        env:
        - name: STALWART_PUBLIC_URL
          value: https://id.re8ch.com
        envFrom:
        - secretRef:
            name: stalwart-recovery-admin
        image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz/live
            port: management
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
        name: stalwart
        ports:
        - containerPort: 25
          name: smtp
        - containerPort: 465
          name: smtps
        - containerPort: 587
          name: submission
        - containerPort: 143
          name: imap
        - containerPort: 993
          name: imaps
        - containerPort: 110
          name: pop3
        - containerPort: 995
          name: pop3s
        - containerPort: 4190
          name: sieve
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        - containerPort: 8080
          name: management
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: management
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/live
            port: management
          periodSeconds: 10
          timeoutSeconds: 10
        volumeMounts:
        - mountPath: /etc/stalwart
          name: config
          readOnly: true
        - mountPath: /var/lib/stalwart
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/stalwart-secrets/cloudflare
          name: cloudflare-token
          readOnly: true
        - mountPath: /var/run/stalwart-secrets/cloudflare-re8ch
          name: cloudflare-re8ch-token
          readOnly: true
        - mountPath: /var/run/stalwart-idp
          name: oidc-keys
          readOnly: true
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 192.0.2.109
        options:
        - name: ndots
          value: "1"
      dnsPolicy: None
      initContainers:
      - args:
        - |
          until [ -f /var/lib/stalwart/.r640-migration-v2-complete ]; do sleep 5; done
          test -f /var/lib/stalwart/CURRENT
        command:
        - /bin/sh
        - -ceu
        image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
        name: wait-for-migration
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/lib/stalwart
          name: data
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: overseas-flk
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: overseas-edge
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - configMap:
          name: stalwart-config
        name: config
      - emptyDir: {}
        name: tmp
      - name: data
        persistentVolumeClaim:
          claimName: stalwart-flk-local-data
      - name: cloudflare-token
        secret:
          items:
          - key: CF_API_TOKEN
            path: token
          optional: true
          secretName: stalwart-cloudflare-phonaid-token
      - name: cloudflare-re8ch-token
        secret:
          items:
          - key: CF_API_TOKEN
            path: token
          optional: true
          secretName: stalwart-cloudflare-dns-token
      - name: oidc-keys
        secret:
          secretName: stalwart-idp-oidc-keys
  updateStrategy:
    type: RollingUpdate
