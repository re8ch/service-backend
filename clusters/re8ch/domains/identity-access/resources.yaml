apiVersion: v1
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:3000
      session_ttl: 720h
    users: []
    auth_attempts: 5
    block_auth_min: 15
    dns:
      bind_hosts: [0.0.0.0]
      port: 5353
      ratelimit: 200
      refuse_any: true
      # AdGuard's upstream bootstrap resolver cannot resolve cluster.local.
      # This Service IP is explicitly reserved below and verified by GitOps.
      upstream_dns: [192.0.2.146:5353]
      bootstrap_dns: [192.0.2.131, 192.0.2.148]
      cache_size: 4194304
      cache_ttl_min: 60
      cache_ttl_max: 86400
    filtering:
      filtering_enabled: true
      filters_update_interval: 24
    filters:
      - enabled: true
        url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
        name: AdGuard DNS filter
        id: 1
    querylog:
      enabled: true
      file_enabled: true
      interval: 24h
      size_memory: 1000
      anonymize_client_ip: false
    statistics: {enabled: true, interval: 24h}
    schema_version: 30
  mosdns.yaml: |
    log: {level: info, production: true}
    plugins:
      - tag: cache
        type: cache
        args: {size: 65536, lazy_cache_ttl: 86400}
      - tag: private_domains
        type: domain_set
        args: {files: [/rules/current/private-domains.txt]}
      - tag: cn_domains
        type: domain_set
        args: {files: [/rules/current/cn-domains.txt]}
      - tag: forward_cn
        type: forward
        args:
          concurrent: 2
          upstreams:
            - {addr: https://dns.alidns.com/dns-query, dial_addr: 192.0.2.131}
            - {addr: https://doh.pub/dns-query, dial_addr: 192.0.2.148}
      - tag: forward_global
        type: forward
        args:
          concurrent: 2
          upstreams:
            - {addr: https://1.1.1.1/dns-query, socks5: mihomos-node-cn-local:17891}
            - {addr: https://dns.google/dns-query, dial_addr: 8.8.8.8, socks5: mihomos-node-cn-local:17891}
      - tag: main_sequence
        type: sequence
        args:
          - exec: $cache
          - matches: has_resp
            exec: accept
          - matches: qname $private_domains $cn_domains
            exec: $forward_cn
          - matches: has_resp
            exec: accept
          - exec: $forward_global
          - exec: $cache
      - tag: udp_server
        type: udp_server
        args: {entry: main_sequence, listen: 0.0.0.0:5353}
      - tag: tcp_server
        type: tcp_server
        args: {entry: main_sequence, listen: 0.0.0.0:5353}
kind: ConfigMap
metadata:
  name: access-dns-config
  namespace: egress-fabric
