kind: ConfigMap
metadata:
  name: stalwart-unified-identity-bootstrap-plan-v2
  namespace: mail-system
---
apiVersion: v1
data:
  proxy.py: |
    import http.server
    import json
    import os
    import urllib.error
    import urllib.request

    UPSTREAM = "http://opensandbox-server.opensandbox-system.svc.cluster.local:8080"
    API_KEY = os.environ["OPEN_SANDBOX_API_KEY"]
    METADATA_KEY = os.environ["TEABLE_INFRA_API_KEY"]
    METADATA_URL = "http://teable-infra.opensandbox-system.svc.cluster.local:8080"
    TENANT_TOOL_URL = "https://tools.re8ch.com/tenant/mcp"

    class Handler(http.server.BaseHTTPRequestHandler):
        def forward(self):
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length) if length else None
            if self.command == "POST" and self.path.rstrip("/") == "/v1/sandboxes" and body:
                create = json.loads(body)
                metadata = create.setdefault("metadata", {})
                environment = create.setdefault("env", {})
                context = {
                    "tenantRef": self.headers.get("X-RE8CH-Tenant"),
                    "resourceRef": self.headers.get("X-RE8CH-Resource"),
                    "toolResourceRef": self.headers.get("X-RE8CH-Tool-Resource"),
                    "taskId": self.headers.get("X-RE8CH-Task"),
                    "traceId": self.headers.get("X-RE8CH-Trace"),
                }
                metadata.update({key: value for key, value in context.items() if value})
                environment.update({
                    "RE8CH_TENANT_REF": context["tenantRef"] or "",
                    "RE8CH_RESOURCE_REF": context["resourceRef"] or "",
                    "RE8CH_TOOL_RESOURCE_REF": context["toolResourceRef"] or "",
                    "RE8CH_TENANT_TOOL_URL": TENANT_TOOL_URL,
                    "RE8CH_TASK_ID": context["taskId"] or "",
                    "RE8CH_TRACE_ID": context["traceId"] or "",
                })
                body = json.dumps(create, separators=(",", ":")).encode()
            headers = {"Accept": "application/json", "OPEN-SANDBOX-API-KEY": API_KEY}
            if self.headers.get("Content-Type"):
                headers["Content-Type"] = self.headers["Content-Type"]
            request = urllib.request.Request(UPSTREAM + self.path, data=body, method=self.command, headers=headers)
            try:
                response = urllib.request.urlopen(request, timeout=60)
            except urllib.error.HTTPError as error:
                response = error
            payload = response.read()
            if self.command == "POST" and self.path.rstrip("/") == "/v1/sandboxes" and 200 <= response.status < 300:
                try:
                    result = json.loads(payload)
                    sandbox_id = result.get("id") or (result.get("data") or {}).get("id")
                    metadata = {
                        "tenantRef": self.headers.get("X-RE8CH-Tenant"),
                        "resourceRef": self.headers.get("X-RE8CH-Resource"),
                        "toolResourceRef": self.headers.get("X-RE8CH-Tool-Resource"),
                        "taskId": self.headers.get("X-RE8CH-Task"),
                        "traceId": self.headers.get("X-RE8CH-Trace"),
                    }
                    metadata = {key: value for key, value in metadata.items() if value}
                    if sandbox_id and metadata:
                        request = urllib.request.Request(
                            f"{METADATA_URL}/api/internal/sandboxes/{sandbox_id}/metadata",
                            data=json.dumps(metadata).encode(), method="PUT",
                            headers={"Authorization": f"Bearer {METADATA_KEY}", "Content-Type": "application/json"},
                        )
                        urllib.request.urlopen(request, timeout=10).read()
                except (KeyError, TypeError, ValueError, urllib.error.URLError):
                    pass
            self.send_response(response.status)
            self.send_header("Content-Type", response.headers.get("Content-Type", "application/json"))
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/health":
                payload = b'{"status":"ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(payload)))
                self.end_headers()
                self.wfile.write(payload)
                return
            self.forward()

        do_POST = do_PUT = do_PATCH = do_DELETE = forward
        def log_message(self, *_): pass

    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
