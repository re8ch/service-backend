apiVersion: v1
data:
  app.py: "#!/usr/bin/env python3\n\"\"\"Auth Gateway-fronted Store, admin API and
    device-scoped subscription service.\"\"\"\n\nfrom __future__ import annotations\n\nimport
    hashlib\nimport hmac\nimport ipaddress\nimport json\nimport mimetypes\nimport
    os\nimport secrets\nimport ssl\nimport time\nimport urllib.error\nimport urllib.request\nfrom
    http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib import
    Path\nfrom urllib.parse import parse_qs, quote, urlencode, urlparse\n\nfrom core
    import (DEFAULT_NODES, Node, Publication, RuntimeTarget, authorization, canonical_subject,
    clash_meta_import_url, issue_token, mihomo_config, proxy_password,\n                  public_node,
    shadowrocket_config, shadowrocket_import_url, SHADOWROCKET_PROFILE_REVISION, subscription_body,\n
    \                 subscription_headers, v2box_subscription_body, v2box_subscription_import_url,
    verify_token)\n\nNAMESPACE = os.getenv(\"POD_NAMESPACE\", \"egress-fabric\")\nSTATE_NAME
    = os.getenv(\"STATE_CONFIGMAP\", \"access-subscription-devices\")\nAUTH_NAME =
    os.getenv(\"AUTH_CONFIGMAP\", \"access-members-cache\")\nUSAGE_NAME = os.getenv(\"USAGE_CONFIGMAP\",
    \"access-device-usage\")\nRULES_ROOT = Path(os.getenv(\"RULES_ROOT\", \"/rules\"))\nBASE_URL
    = os.getenv(\"PUBLIC_BASE_URL\", \"https://sub.access.re8ch.com\").rstrip(\"/\")\nHMAC_SECRET
    = Path(os.getenv(\"HMAC_SECRET_PATH\", \"/secrets/hmac-key\")).read_bytes().strip()\nIDENTITY_ALIASES
    = json.loads(os.getenv(\"IDENTITY_ALIASES_JSON\", \"{}\"))\nOAUTH_ISSUER = \"https://db-rw.re8ch.com/auth/v1\"\nOAUTH_AUTHORIZE_URL
    = \"https://auth.re8ch.com/auth/v1/oauth/authorize\"\nOAUTH_CLIENT_ID = \"e93247af-5bc0-4f3d-829b-8a70e0a69d31\"\nOAUTH_REDIRECT
    = BASE_URL + \"/oauth/callback\"\nSESSION_COOKIE = \"__Host-access_oauth\"\nFLOW_COOKIE
    = \"__Host-access_oauth_flow\"\n\nPORTAL = \"\"\"<!doctype html><html lang=zh-CN><meta
    charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>\n<title>access
    re8ch com</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px
    system-ui;margin:0;background:#101114;color:#eee}main{max-width:920px;margin:auto;padding:32px
    20px}button,input,a.cta{font:inherit;padding:11px 16px;border-radius:9px;border:1px
    solid #3b414b}button{cursor:pointer}input{min-width:280px}a{color:#9ee6a8}.cta{display:inline-block;text-decoration:none;font-weight:650}.primary{background:#83dfa0;color:#102016;border-color:#83dfa0}.secondary{background:#292d35;color:#eee}.danger{color:#ff9c9c}article{background:#1d1f24;padding:20px;margin:14px
    0;border-radius:14px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.choice{background:#17191e;border:1px
    solid #353a44;border-radius:12px;padding:18px}.recommended{border-color:#72d993}.badge{display:inline-block;background:#244a31;color:#a8f0bd;padding:3px
    8px;border-radius:99px;font-size:13px;font-weight:700}.muted{color:#aaa}.warning{color:#ffd28a}.row{display:flex;gap:8px;flex-wrap:wrap}.steps{padding-left:22px;line-height:1.65}code.url{display:block;margin-top:10px;padding:10px;background:#0f1114;border-radius:8px;overflow-wrap:anywhere;color:#9ee6a8}@media(max-width:700px){.choice-grid{grid-template-columns:1fr}main{padding:20px
    12px}}</style>\n<main><h1>access re8ch com</h1><p>Mihomo/Shadowrocket 完整配置：洛杉矶双节点优先、德国节点可用时备用、节点全不可用时直连
    · 每月 300 GB 软提醒</p><p id=a></p><form id=f><input id=n maxlength=64 placeholder='设备名称，例如
    iPhone'><button>创建设备</button></form><div id=new></div><div id=o></div><p class=muted>设备地址只显示一次；支持
    V2Box 节点订阅以及 Shadowrocket 完整配置。</p></main>\n<script>const o=document.querySelector('#o'),a=document.querySelector('#a'),nn=document.querySelector('#new');function
    esc(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML}function
    size(n){return (n/1073741824).toFixed(2)+' GB'}function when(n){return n?new Date(n*1000).toLocaleString():'尚无'}async
    function load(){let r=await fetch('/api/me'),j=await r.json();if(!r.ok){a.textContent=j.error||'未授权';return}a.textContent='账号：'+j.account+(j.admin?'
    · 管理员':'');o.innerHTML=(j.devices||[]).map(x=>`<article><b>${esc(x.name)}</b>
    · ${x.enabled?'启用':'已撤销'}<br><span class=muted>${x.activeConnections||0} 个连接 ·
    本月 ${size((x.upload||0)+(x.download||0))} · 最后在线 ${when(x.lastSeenAt)}</span><div
    class=row><button onclick=\"rotate('${x.id}')\">轮换并生成新配置</button><button class=secondary
    onclick=\"revoke('${x.id}')\">撤销设备</button></div></article>`).join('')||'<article>还没有设备。输入设备名称并创建，页面会生成一次性导入地址。</article>'}async
    function revoke(id){await fetch('/api/devices/'+id,{method:'DELETE'});load()}async
    function rotate(id){let r=await fetch('/api/devices/'+id+'/rotate',{method:'POST'}),j=await
    r.json();show(j)}function show(j){if(!j.subscriptionURL)return alert(j.error||'创建失败');nn.innerHTML=`<article><h2>选择导入方式</h2><div
    class=choice-grid><section class=\"choice recommended\"><span class=badge>V2Box</span><h3>V2Box
    节点订阅</h3><p>直接创建可自动更新的设备专属订阅，包含当前已验证的节点；流量信息和到期时间会随订阅返回。</p><div class=row><a
    class=\"cta primary\" href=\"${esc(j.v2boxImportURL)}\">一键导入 V2Box</a><a class=\"cta
    secondary\" href=\"${esc(j.v2boxURL)}\">打开订阅配置</a></div><h4>手动导入</h4><ol class=steps><li>进入
    V2Box → <b>Configs</b> → <b>+</b> → <b>Add Subscription</b>。</li><li>名称填写 <code>access
    re8ch com</code>，URL 粘贴下方地址并保存。</li></ol><code class=url>${esc(j.v2boxURL)}</code></section><section
    class=choice><h3>Shadowrocket 完整配置</h3><p>包含节点、策略组、OpenAI/Google 分流规则和安全 DNS。</p><div
    class=row><a class=\"cta secondary\" href=\"${esc(j.shadowrocketImportURL)}\">一键安装</a><a
    class=\"cta secondary\" href=\"${esc(j.shadowrocketURL)}\" download=\"re8ch-shadowrocket.conf\">下载
    .conf</a></div><hr><h3>Mihomo 完整配置</h3><p>供 Clash Meta、Mihomo 和兼容客户端使用。</p><div
    class=row><a class=\"cta secondary\" href=\"${esc(j.clashMetaImportURL)}\">一键导入
    ClashX Meta</a><a class=\"cta secondary\" href=\"${esc(j.mihomoURL)}\">打开 Mihomo
    YAML</a></div></section></div></article>`}f.onsubmit=async e=>{e.preventDefault();let
    r=await fetch('/api/devices',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n.value||'device'})}),j=await
    r.json();show(j);load()};load()</script></html>\"\"\"\n\nPORTAL = PORTAL.replace(\n
    \   '<p>包含节点、策略组、OpenAI/Google 分流规则和安全 DNS。</p><div class=row><a class=\"cta secondary\"
    href=\"${esc(j.shadowrocketImportURL)}\">一键安装</a>',\n    '<p>包含节点、策略组、OpenAI/Google
    分流规则和安全 DNS。iPhone/iPad 可一键安装；macOS 请添加为远程配置，不要添加到首页的节点订阅。</p><div class=row><a
    class=\"cta secondary\" href=\"${esc(j.shadowrocketImportURL)}\">iPhone/iPad 一键安装</a>',\n).replace(\n
    \   '<a class=\"cta secondary\" href=\"${esc(j.shadowrocketURL)}\" download=\"re8ch-shadowrocket.conf\">下载
    .conf</a></div><hr><h3>Mihomo 完整配置</h3>',\n    '<a class=\"cta secondary\" href=\"${esc(j.shadowrocketURL)}\"
    download=\"re8ch-shadowrocket.conf\">下载 .conf</a></div><h4>macOS 稳定导入</h4><ol
