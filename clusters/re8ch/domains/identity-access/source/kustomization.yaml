apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../components/ops/github-actions-identity-executor-rbac.yaml
- ../../../secrets/stalwart-recovery-admin.sops.yaml
- ../../../secrets/stalwart-idp-recovery.sops.yaml
- ../../../secrets/stalwart-idp-oidc-keys.sops.yaml
- ../../../secrets/re8ch-auth-broker-client-auth.sops.yaml
- ../../../secrets/ghcr-re8ch-auth.sops.yaml
- ../../../components/tenancy/re8ch-managed-business-namespaces.yaml
- ../../../components/auth/deployments/auth-postgrest.yaml
- ../../../components/auth/deployments/re8ch-auth-gateway.yaml
- ../../../components/auth/deployments/re8ch-auth-gateway-pdb.yaml
- ../../../components/auth/dependency-policy.yaml
- ../../../components/auth/services/re8ch-auth-gateway.yaml
- ../../../components/auth/user-center.yaml
- ../../../../../operations/supabase-identity
- ../../../../../operations/supabase-billing
- ../../../components/re8ch-business-namespaces
- ../../../components/personal-access
- ../../../../../platform/agent-onboarding-runtime
- ../../../../../platform/apps/access-subscription
- ../../../../../platform/secretary-system
- ../../../../../platform/stalwart
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: re8ch-auth-gateway, namespace: auth}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: re8ch-auth-gateway, namespace: auth}
      $patch: delete
  - target: {group: policy, version: v1, kind: PodDisruptionBudget, name: re8ch-auth-gateway, namespace: auth}
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata: {name: re8ch-auth-gateway, namespace: auth}
      $patch: delete
  - target: {group: apps, version: v1, kind: Deployment, name: re8ch-user-center, namespace: auth}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: re8ch-user-center, namespace: auth}
      $patch: delete

