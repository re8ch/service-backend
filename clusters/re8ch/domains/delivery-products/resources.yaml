apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-neuronpedia-postgres
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-neuronpedia-postgres
  serviceName: ontology-neuronpedia-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-neuronpedia-postgres
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
