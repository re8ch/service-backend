          periodSeconds: 15
        name: auth-proxy
        ports:
        - containerPort: 8080
          name: authenticated
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: authenticated
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsUser: 101
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx
          readOnly: true
          subPath: default.conf
        - mountPath: /etc/nginx/auth
          name: basic-auth
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run
          name: nginx-run
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      - configMap:
          name: ontology-microscope-auth-proxy
        name: nginx
      - name: basic-auth
        secret:
          items:
          - key: auth
            path: auth
          secretName: ontology-microscope-basic-auth
      - emptyDir:
          sizeLimit: 8Mi
        name: nginx-run
