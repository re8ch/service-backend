        - name: ONTOLOGY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: POSTGRES_URL_NON_POOLING
              name: ontology-microscope-db
        - name: EVALUATION_OPENAI_BASE_URL
          value: http://litellm.llm-gateway.svc.cluster.local:4000/v1
        - name: EVALUATION_OPENAI_MODEL
          value: deepseek-v4-flash
        - name: EVALUATION_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: ontology-microscope-analysis
        - name: EVALUATION_NEO4J_URI
          value: neo4j://ontology-microscope-neo4j:7687
        - name: EVALUATION_NEO4J_USER
          valueFrom:
            secretKeyRef:
              key: neo4j-user
              name: ontology-microscope-evaluation
        - name: EVALUATION_NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              key: neo4j-password
              name: ontology-microscope-evaluation
        image: ghcr.io/re8ch/ontology-microscope-adapter@sha256:79597e2df5b9553150dc39fca896c09094770135e6e067e0a77ce04256fe00d0
        imagePullPolicy: IfNotPresent
        name: worker
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        scheduling.re8ch.com/network-serving: "true"
        scheduling.re8ch.com/placement-batch-opportunistic: "true"
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: ontology-microscope-evaluation-worker
        maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: scheduling.re8ch.com/failure-domain
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 128Mi
        name: tmp
