    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-microscope-neo4j
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neo4j
  serviceName: ontology-microscope-neo4j
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: service-core-r640
      labels:
        app.kubernetes.io/name: ontology-microscope-neo4j
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              key: neo4j-auth
              name: ontology-microscope-evaluation
        - name: NEO4J_server_memory_heap_initial__size
          value: 512m
        - name: NEO4J_server_memory_heap_max__size
          value: 2g
        - name: NEO4J_server_memory_pagecache_size
          value: 1g
        - name: NEO4J_server_directories_logs
          value: /logs
        image: neo4j@sha256:a5cf6a1de3e7d94ee2311d9777118fadf5e2b0f231bbc6d73e4d0d8f2e0e02e2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 15
          tcpSocket:
            port: bolt
          timeoutSeconds: 5
        name: neo4j
        ports:
        - containerPort: 7687
          name: bolt
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 5
          tcpSocket:
            port: bolt
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 7474
          runAsNonRoot: true
          runAsUser: 7474
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /logs
          name: logs
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        scheduling.re8ch.com/network-serving: "true"
        scheduling.re8ch.com/pool-service-core-r640: "true"
      securityContext:
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: logs
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
  volumeClaimTemplates:
  - metadata:
      labels:
        saas.re8ch.com/tenant: re8ch
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: rbd-r640
