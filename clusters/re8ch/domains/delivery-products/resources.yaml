        image: ghcr.io/woomou/anycam-market-demo@sha256:fedbb358d50a59582c1cb847e189f473073a486d02bb218087e4bc2bfce83045
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8099
          name: http
        readinessProbe:
          httpGet:
            path: /market/registry
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /data/anycam-market
          name: model-store
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 10001
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: anycam-r640-model-store
