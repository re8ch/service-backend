      containers:
      - command:
        - python
        - -m
        - anycam_backend.market_worker
        - loop
        env:
        - name: ANYCAM_MARKET_DATA_DIR
          value: /data/anycam-market
        - name: ANYCAM_REGISTRY_API_BASE
          value: http://anycam-model-registry:8099
        - name: ANYCAM_MARKET_OBJECT_DIR
          value: /data/anycam-market/objects
        image: ghcr.io/woomou/anycam-market-demo@sha256:fedbb358d50a59582c1cb847e189f473073a486d02bb218087e4bc2bfce83045
        imagePullPolicy: IfNotPresent
        name: worker
        volumeMounts:
        - mountPath: /data/anycam-market
          name: model-store
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 10001
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: anycam-r640-model-store
