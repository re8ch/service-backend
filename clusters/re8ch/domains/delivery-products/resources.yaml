    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: batch-opportunistic
      labels:
        app.kubernetes.io/name: ontology-microscope-evaluation-worker
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - --import
        - tsx
        - server/evaluation-worker.ts
        env:
        - name: NODE_ENV
