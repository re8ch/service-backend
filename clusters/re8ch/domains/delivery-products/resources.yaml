apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
    scheduling.re8ch.com/placement-managed: "true"
  name: ontology-microscope-adapter
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-adapter
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: online-reliable
      labels:
        app.kubernetes.io/name: ontology-microscope-adapter
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: "4318"
        - name: GRAPH_REPOSITORY
          value: memory
        - name: REASONING_ADAPTER
          value: mock
        - name: NEURONPEDIA_SYNC_ON_START
          value: "true"
        - name: ANALYSIS_OPENAI_BASE_URL
          value: http://litellm.llm-gateway.svc.cluster.local:4000/v1
        - name: ANALYSIS_OPENAI_MODEL
          value: deepseek-v4-flash
        - name: ANALYSIS_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: ontology-microscope-analysis
              optional: true
        - name: NEURONPEDIA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: POSTGRES_URL_NON_POOLING
              name: ontology-microscope-db
        - name: ONTOLOGY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: POSTGRES_URL_NON_POOLING
              name: ontology-microscope-db
        - name: ONTOLOGY_API_TOKENS_JSON
          valueFrom:
            secretKeyRef:
              key: api-tokens-json
              name: ontology-microscope-evaluation
        image: ghcr.io/re8ch/ontology-microscope-adapter@sha256:79597e2df5b9553150dc39fca896c09094770135e6e067e0a77ce04256fe00d0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        name: adapter
        ports:
        - containerPort: 4318
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 750m
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        scheduling.re8ch.com/network-serving: "true"
        scheduling.re8ch.com/placement-general-reliable: "true"
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: ontology-microscope-adapter
        maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: scheduling.re8ch.com/failure-domain
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
