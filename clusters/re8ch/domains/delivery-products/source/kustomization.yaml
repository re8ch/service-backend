apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../secrets/ontology-microscope-db.sops.yaml
- ../../../secrets/ontology-microscope-evaluation.sops.yaml
- ../../../components/aesthete/native-api-route.yaml
- ../../../components/farseer/public-web.yaml
- ../../../components/farseer/tenant-web.yaml
- ../../../components/anycam/market-demo.yaml
- ../../../../../platform/adapter
- ../../../../../platform/external-projects
patches:
- target:
    kind: Secret
    name: ontology-microscope-db|ontology-microscope-evaluation
    namespace: re8ch-ontology-microscope
  patch: |-
    - op: add
      path: /metadata/labels
      value:
        delivery.re8ch.com/retention: retained-data
        delivery.re8ch.com/retired-product: ontology-microscope

