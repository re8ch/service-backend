  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: re8ch-dynamic-scheduler
      resourceNamespace: scheduler-system
    clientConnection:
      kubeconfig: /etc/scheduler/kubeconfig
    profiles:
    - schedulerName: re8ch-dynamic-scheduler
      plugins:
        score:
          enabled:
          - {name: LoadVariationRiskBalancing, weight: 5}
          - {name: NodeResourcesAllocatable, weight: 2}
      pluginConfig:
      - name: LoadVariationRiskBalancing
        args:
          safeVarianceMargin: 1
          safeVarianceSensitivity: 2
          metricProvider: {type: Prometheus, address: 'http://vmselect-re8ch-metrics.observability-system.svc.cluster.local:8481/select/0/prometheus'}
      - name: NodeResourcesAllocatable
        args:
          mode: Most
          resources: [{name: cpu, weight: 1}, {name: memory, weight: 4}]
