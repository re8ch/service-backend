apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cloud-disk
  name: cloud-disk
  namespace: cloud-disk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-disk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-disk
        app.kubernetes.io/part-of: cloud-disk
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - exec rclone gui --no-open-browser --addr 0.0.0.0:5580 --api-addr 0.0.0.0:5581
          --log-level ERROR
        command:
        - /bin/sh
        - -ec
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: HTTP_PROXY
          value: http://$(NODE_IP):17891
        - name: HTTPS_PROXY
          value: http://$(NODE_IP):17891
        - name: NO_PROXY
          value: 127.0.0.1,localhost,.svc,.cluster.local,10.0.0.0/8,100.64.0.0/10
        - name: RCLONE_CONFIG
          value: /etc/rclone/rclone.conf
