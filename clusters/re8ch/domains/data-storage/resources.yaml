apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cloudbeaver
  name: cloudbeaver
  namespace: ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbeaver
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: stateful-ceph
      labels:
        app: cloudbeaver
    spec:
      containers:
      - env:
        - name: CLOUDBEAVER_WEB_SERVER_PORT
          value: "8978"
        - name: JAVA_OPTS
          value: -Xms128m -Xmx768m
        image: docker.io/dbeaver/cloudbeaver@sha256:28f7abeeae9835c797246a4bcbb756b9eaf7275a6691d583b4a40a736fa420c1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: 8978
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
        name: cloudbeaver
        ports:
        - containerPort: 8978
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8978
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 384Mi
        volumeMounts:
        - mountPath: /opt/cloudbeaver/workspace
          name: workspace
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - /bin/sh
        - -ec
        - |
          mkdir -p /workspace/GlobalConfiguration/.dbeaver
          cp /seed/data-sources.json /workspace/GlobalConfiguration/.dbeaver/data-sources.json
          chown -R 8978:8978 /workspace || true
        image: docker.io/dbeaver/cloudbeaver@sha256:28f7abeeae9835c797246a4bcbb756b9eaf7275a6691d583b4a40a736fa420c1
        imagePullPolicy: IfNotPresent
        name: seed-config
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        - mountPath: /seed
          name: datasource-config
          readOnly: true
      nodeSelector:
        scheduling.re8ch.com/ceph-serving: "true"
        scheduling.re8ch.com/placement-general-reliable: "true"
      securityContext:
        fsGroup: 8978
      serviceAccountName: default
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: cloudbeaver
        maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: scheduling.re8ch.com/failure-domain
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: cloudbeaver-workspace-rbd
      - configMap:
          name: cloudbeaver-datasources
        name: datasource-config
---
