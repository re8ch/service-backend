          cp /seed/data-sources.json /workspace/GlobalConfiguration/.dbeaver/data-sources.json

          chown -R 8978:8978 /workspace || true

          '
        image: dbeaver/cloudbeaver:24.3.5
        imagePullPolicy: IfNotPresent
        name: seed-config
        volumeMounts:
        - mountPath: /workspace
          name: workspace
        - mountPath: /seed
          name: datasource-config
          readOnly: true
      nodeSelector:
        scheduling.re8ch.com/ceph-serving: 'true'
        scheduling.re8ch.com/placement-general-reliable: 'true'
      securityContext:
        fsGroup: 8978
      serviceAccountName: default
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: cloudbeaver
        maxSkew: 1
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        topologyKey: scheduling.re8ch.com/failure-domain
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: workspace
