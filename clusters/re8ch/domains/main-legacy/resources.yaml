apiVersion: v1
data:
  values.yaml: "# Rook v1.20.3 requires the separate ceph-csi-drivers chart. These\
    \ values are\n# based on Rook's v1.20.3 recommended values and enable the CephFS\
    \ and RBD\n# drivers used by the storage fabric.\noperatorConfig:\n  namespace:\
    \ rook-ceph\n  driverSpecDefaults:\n    imageSet:\n      name: rook-csi-operator-image-set-configmap\n\
    \    nodePlugin:\n      priorityClassName: system-node-critical\n    controllerPlugin:\n\
    \      priorityClassName: system-cluster-critical\n      replicas: 1\n\ndrivers:\n\
    \  rbd:\n    enabled: true\n    name: rook-ceph.rbd.csi.ceph.com\n    nodePlugin:\n\
    \      tolerations:\n        - key: scheduling.re8ch.com/capacity-window\n   \
    \       operator: Equal\n          value: closed\n          effect: NoSchedule\n\
    \        - key: dedicated\n          operator: Equal\n          value: overseas-edge\n\
    \          effect: NoSchedule\n        - key: storage.re8ch.com/coordinator\n\
    \          operator: Equal\n          value: \"true\"\n          effect: NoSchedule\n\
    \      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \            nodeSelectorTerms:\n              - matchExpressions:\n         \
    \         - key: scheduling.re8ch.com/capability-storage-ceph-client\n       \
    \             operator: In\n                    values: [\"true\"]\n    controllerPlugin:\n\
    \      replicas: 1\n      tolerations:\n        - key: scheduling.re8ch.com/capacity-window\n\
    \          operator: Equal\n          value: closed\n          effect: NoSchedule\n\
    \        - key: storage.re8ch.com/coordinator\n          operator: Equal\n   \
    \       value: \"true\"\n          effect: NoSchedule\n      affinity:\n     \
    \   nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \            nodeSelectorTerms:\n              - matchExpressions:\n         \
    \         - key: storage.re8ch.com/coordinator\n                    operator:\
    \ In\n                    values: [\"true\"]\n  cephfs:\n    enabled: true\n \
    \   name: rook-ceph.cephfs.csi.ceph.com\n    # Production uses native Ceph Messenger\
    \ v2 secure mode. Without an\n    # explicit v2 mode, the kernel client may attempt\
    \ a V1 banner on port 3300.\n    kernelMountOptions:\n      ms_mode: secure\n\
    \    nodePlugin:\n      tolerations:\n        - key: scheduling.re8ch.com/capacity-window\n\
    \          operator: Equal\n          value: closed\n          effect: NoSchedule\n\
    \        - key: storage.re8ch.com/coordinator\n          operator: Equal\n   \
    \       value: \"true\"\n          effect: NoSchedule\n        - key: dedicated\n\
    \          operator: Equal\n          value: panel\n          effect: NoSchedule\n\
    \        - key: dedicated\n          operator: Equal\n          value: observability\n\
    \          effect: NoSchedule\n      affinity:\n        nodeAffinity:\n      \
    \    requiredDuringSchedulingIgnoredDuringExecution:\n            nodeSelectorTerms:\n\
    \              - matchExpressions:\n                  - key: scheduling.re8ch.com/capability-storage-ceph-client\n\
    \                    operator: In\n                    values: [\"true\"]\n  \
    \  controllerPlugin:\n      replicas: 1\n      # A1/B1 currently cannot reliably\
    \ reach the Kubernetes Service VIP from\n      # PodCIDR. Keep the CSI control\
    \ plane independent of that service path.\n      hostNetwork: true\n      tolerations:\n\
    \        - key: scheduling.re8ch.com/capacity-window\n          operator: Equal\n\
    \          value: closed\n          effect: NoSchedule\n        - key: storage.re8ch.com/coordinator\n\
    \          operator: Equal\n          value: \"true\"\n          effect: NoSchedule\n\
    \      affinity:\n        nodeAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
    \            nodeSelectorTerms:\n              - matchExpressions:\n         \
    \         - key: storage.re8ch.com/coordinator\n                    operator:\
    \ In\n                    values: [\"true\"]\n  nfs:\n    enabled: false\n   \
    \ name: rook-ceph.nfs.csi.ceph.com\n  nvmeof:\n    enabled: false\n    name: rook-ceph.nvmeof.csi.ceph.com\n"
