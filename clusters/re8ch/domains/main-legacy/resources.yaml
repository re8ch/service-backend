apiVersion: v1
data:
  values.yaml: "operatorNamespace: rook-ceph\nclusterName: rook-ceph\n\ncephImage:\n\
    \  repository: quay.io/ceph/ceph\n  tag: v20.2.2\n  allowUnsupported: false\n\n\
    toolbox:\n  enabled: true\n\nmonitoring:\n  enabled: false\n  metricsDisabled:\
    \ false\n\ncephClusterSpec:\n  dataDirHostPath: /var/lib/rook-ceph-pilot\n  skipUpgradeChecks:\
    \ false\n  continueUpgradeAfterChecksEvenIfNotHealthy: false\n  mon:\n    # Deliberate\
    \ fault-isolation topology: B1 is the sole Ceph coordinator.\n    # Data durability\
    \ is provided by explicit backups, not MON quorum.\n    count: 1\n    allowMultiplePerNode:\
    \ false\n  mgr:\n    count: 1\n    allowMultiplePerNode: false\n  dashboard:\n\
    \    enabled: false\n  network:\n    provider: host\n    addressRanges:\n    \
    \  # Stable daemon/client identity. Node InternalIP authority remains here.\n\
    \      public:\n        - 192.0.2.253/24\n      # OSD replication, recovery, backfill,\
    \ and heartbeat data plane.\n      cluster:\n        - 192.0.2.106/24\n    connections:\n\
    \      encryption:\n        enabled: false\n      compression:\n        enabled:\
    \ false\n      requireMsgr2: true\n  crashCollector:\n    disable: false\n  logCollector:\n\
    \    enabled: true\n    periodicity: daily\n    maxLogSize: 100M\n  cleanupPolicy:\n\
    \    confirmation: \"\"\n    sanitizeDisks:\n      method: quick\n      dataSource:\
    \ zero\n      iteration: 1\n    allowUninstallWithVolumes: false\n  placement:\n\
    \    all:\n      tolerations:\n        - key: node-role.kubernetes.io/control-plane\n\
    \          operator: Exists\n        - key: scheduling.re8ch.com/capacity-window\n\
    \          operator: Equal\n          value: closed\n          effect: NoSchedule\n\
    \        - key: storage.re8ch.com/coordinator\n          operator: Equal\n   \
    \       value: \"true\"\n          effect: NoSchedule\n      nodeAffinity:\n \
    \       requiredDuringSchedulingIgnoredDuringExecution:\n          nodeSelectorTerms:\n\
    \            - matchExpressions:\n                - key: scheduling.re8ch.com/capability-storage-ceph-osd\n\
    \                  operator: In\n                  values: [\"true\"]\n    # Rook\
    \ does not reliably inherit placement.all tolerations into an OSD\n    # Deployment\
    \ during a safety-gated rolling update. Declare them directly\n    # so an OSD\
    \ can always restart on its existing, tainted storage host.\n    osd:\n      tolerations:\n\
    \        - key: node-role.kubernetes.io/control-plane\n          operator: Exists\n\
    \        - key: scheduling.re8ch.com/capacity-window\n          operator: Equal\n\
    \          value: closed\n          effect: NoSchedule\n        - key: storage.re8ch.com/coordinator\n\
    \          operator: Equal\n          value: \"true\"\n          effect: NoSchedule\n\
    \      nodeAffinity:\n        requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          nodeSelectorTerms:\n            - matchExpressions:\n             \
    \   - key: scheduling.re8ch.com/capability-storage-ceph-osd\n                \
    \  operator: In\n                  values: [\"true\"]\n    mon:\n      nodeAffinity:\
    \ &b1CoordinatorAffinity\n        requiredDuringSchedulingIgnoredDuringExecution:\n\
    \          nodeSelectorTerms:\n            - matchExpressions:\n             \
    \   - key: storage.re8ch.com/coordinator\n                  operator: In\n   \
    \               values: [\"true\"]\n    mgr:\n      nodeAffinity: *b1CoordinatorAffinity\n\
    \  resources:\n    mon:\n      limits:\n        memory: 1Gi\n      requests:\n\
    \        cpu: 100m\n        memory: 512Mi\n    mgr:\n      limits:\n        memory:\
    \ 1Gi\n      requests:\n        cpu: 100m\n        memory: 512Mi\n    osd:\n \
    \     limits:\n        memory: 2300Mi\n      requests:\n        cpu: 250m\n  \
    \      memory: 2Gi\n    prepareosd:\n      requests:\n        cpu: 100m\n    \
    \    memory: 50Mi\n    mgr-sidecar:\n      limits:\n        memory: 100Mi\n  \
    \    requests:\n        cpu: 50m\n        memory: 40Mi\n    crashcollector:\n\
    \      limits:\n        memory: 60Mi\n      requests:\n        cpu: 20m\n    \
    \    memory: 60Mi\n    logcollector:\n      limits:\n        memory: 256Mi\n \
    \     requests:\n        cpu: 20m\n        memory: 50Mi\n    exporter:\n     \
    \ limits:\n        memory: 128Mi\n      requests:\n        cpu: 20m\n        memory:\
    \ 50Mi\n  removeOSDsIfOutAndSafeToRemove: false\n  priorityClassNames:\n    mon:\
    \ system-node-critical\n    osd: system-node-critical\n    mgr: system-cluster-critical\n\
    \  storage:\n    useAllNodes: false\n    useAllDevices: false\n    config:\n \
    \     osdsPerDevice: \"1\"\n    nodes:\n      - name: restricted-node-6dc3f140f9\n        devices:\n\
    \          - name: /dev/ubuntu-vg/ceph_pilot_osd\n  disruptionManagement:\n  \
    \  managePodBudgets: true\n    osdMaintenanceTimeout: 30\n  healthCheck:\n   \
    \ daemonHealth:\n      mon:\n        disabled: false\n        interval: 45s\n\
    \      osd:\n        disabled: false\n        interval: 60s\n      status:\n \
    \       disabled: false\n        interval: 60s\n\ncephBlockPools:\n  - name: r640-rbd\n\
    \    spec:\n      failureDomain: host\n      deviceClass: r640-hdd\n      replicated:\n\
    \        size: 1\n        requireSafeReplicaSize: false\n    storageClass:\n \
    \     enabled: true\n      name: rbd-r640\n      # rook-ceph-cluster v1.20.3 renders\
    \ block-pool StorageClass labels with\n      # nindent directly, so this field\
    \ must be a YAML fragment string.\n      labels: |\n        storage.re8ch.com/availability-class:\
    \ single-node\n        storage.re8ch.com/failure-domain: restricted-node-6dc3f140f9\n        storage.re8ch.com/replication:\
    \ \"1\"\n      annotations:\n        storage.re8ch.com/ha: \"false\"\n       \
    \ storage.re8ch.com/usage-policy: >-\n          R640-local non-HA storage; use\
    \ only for workloads that intentionally\n          accept the restricted-node-6dc3f140f9 failure domain.\n\
    \      isDefault: false\n      reclaimPolicy: Retain\n      allowVolumeExpansion:\
    \ true\n      volumeBindingMode: WaitForFirstConsumer\n      parameters:\n   \
    \     imageFormat: \"2\"\n        imageFeatures: layering\n        csi.storage.k8s.io/fstype:\
    \ xfs\n        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner\n\
    \        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph\n        csi.storage.k8s.io/controller-expand-secret-name:\
    \ rook-csi-rbd-provisioner\n        csi.storage.k8s.io/controller-expand-secret-namespace:\
    \ rook-ceph\n        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node\n\
    \        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph\n\ncephFileSystems:\n\
    \  - name: re8ch-files\n    spec:\n      metadataPool:\n        failureDomain:\
    \ host\n        deviceClass: r640-hdd\n        replicated:\n          size: 1\n\
    \          requireSafeReplicaSize: false\n      dataPools:\n        # Retained\
    \ until every legacy PVC is migrated and the seven-day\n        # rollback window\
    \ has elapsed. A later reviewed cleanup removes it.\n        - name: data0\n \
    \         failureDomain: host\n          deviceClass: r640-hdd\n          replicated:\n\
    \            size: 1\n            requireSafeReplicaSize: false\n        - name:\
    \ restricted-node-6dc3f140f9\n          failureDomain: host\n          deviceClass: r640-hdd\n     \
    \     replicated:\n            size: 1\n            requireSafeReplicaSize: false\n\
    \      metadataServer:\n        activeCount: 1\n        activeStandby: false\n\
    \        placement:\n          tolerations:\n            - key: storage.re8ch.com/coordinator\n\
    \              operator: Equal\n              value: \"true\"\n              effect:\
    \ NoSchedule\n          nodeAffinity:\n            requiredDuringSchedulingIgnoredDuringExecution:\n\
    \              nodeSelectorTerms:\n                - matchExpressions:\n     \
    \               - key: storage.re8ch.com/coordinator\n                      operator:\
    \ In\n                      values: [\"true\"]\n        resources:\n         \
    \ limits:\n            memory: 1Gi\n          requests:\n            cpu: 100m\n\
    \            memory: 512Mi\n        priorityClassName: system-cluster-critical\n\
    \    storageClass:\n      enabled: true\n      isDefault: false\n      name: cephfs-pilot\n\
    \      pool: data0\n      labels:\n        storage.re8ch.com/availability-class:\
    \ retired\n        storage.re8ch.com/replication: \"1\"\n      annotations:\n\
    \        storage.re8ch.com/deprecated: \"true\"\n        storage.re8ch.com/usage-policy:\
    \ >-\n          Retired replicated CephFS class. Existing claims remain readable;\n\
    \          admission rejects new claims while owners migrate to cephfs-r640.\n\
    \      reclaimPolicy: Retain\n      allowVolumeExpansion: true\n      volumeBindingMode:\
    \ Immediate\n      mountOptions:\n        - noatime\n      parameters:\n     \
    \   csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner\n\
    \        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph\n        csi.storage.k8s.io/controller-expand-secret-name:\
    \ rook-csi-cephfs-provisioner\n        csi.storage.k8s.io/controller-expand-secret-namespace:\
    \ rook-ceph\n        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node\n\
    \        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph\n\ncephObjectStores:\
    \ []\ncephFileSystemVolumeSnapshotClass:\n  enabled: false\ncephBlockPoolsVolumeSnapshotClass:\n\
    \  enabled: false\n"
