          value: -Xms128m -Xmx768m
        image: dbeaver/cloudbeaver:24.3.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: 8978
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
        name: cloudbeaver
        ports:
        - containerPort: 8978
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8978
          initialDelaySeconds: 40
          periodSeconds: 15
          timeoutSeconds: 5
