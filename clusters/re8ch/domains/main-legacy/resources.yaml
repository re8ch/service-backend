          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 384Mi
        volumeMounts:
        - mountPath: /opt/cloudbeaver/workspace
          name: workspace
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - /bin/sh
        - -ec
