apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: superposition-schema
    app.kubernetes.io/name: hyperswitch
  name: hyperswitch-superposition-schema-v0-112-0-v5
  namespace: payments
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: superposition-schema
        app.kubernetes.io/name: hyperswitch
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - restricted-node-6dc3f140f9
      containers:
      - args:
        - "until pg_isready -h pg-re8ch-primary.pigsty-external.svc.cluster.local\
          \ -p 5432 -U hyperswitch_migrator; do\n  sleep 5\ndone\nexport PGPASSWORD=\"\
          $POSTGRES_PASSWORD\"\npsql -v ON_ERROR_STOP=1 \\\n  -h pg-re8ch-primary.pigsty-external.svc.cluster.local\
          \ -p 5432 \\\n  -U hyperswitch_migrator -d hyperswitch \\\n  -f /schema/superposition.sql\n"
        command:
        - /bin/bash
        - -ec
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: primaryPassword
              name: hyperswitch-pigsty-credentials
        image: docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r18
        imagePullPolicy: IfNotPresent
        name: apply-schema
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /schema
          name: schema
          readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: hyperswitch-superposition-schema
        name: schema
