apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hyperswitch
  namespace: flux-system
spec:
  chart:
    spec:
      chart: hyperswitch-stack
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: hyperswitch
        namespace: flux-system
      version: 0.2.26
  install:
    createNamespace: false
    disableHooks: true
    remediation:
      retries: 3
  interval: 1m
  postRenderers:
  - kustomize:
      patches:
      - patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: hyperswitch-hyperswitch-server\n\
          spec:\n  strategy:\n    type: RollingUpdate\n    rollingUpdate: {maxSurge:\
          \ 0, maxUnavailable: 1}\n  template:\n    spec:\n      imagePullSecrets:\n\
          \        - name: harbor-hyperswitch-admin\n      containers:\n        -\
          \ name: hyperswitch-router\n          image: registry.re8ch.com/hyperswitch/hyperswitch-router@sha256:10a106c6a144633613529959a6a2f5edcd54fd5786e1ca3e722e27d87c958eb6\n\
          \          env:\n            - name: ROUTER__ANALYTICS__CLICKHOUSE__PASSWORD\n\
          \              $patch: delete"
        target:
          group: apps
          kind: Deployment
          name: hyperswitch-hyperswitch-server
          version: v1
      - patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: hyperswitch-superposition\n\
          spec:\n  strategy:\n    type: RollingUpdate\n    rollingUpdate: {maxSurge:\
          \ 0, maxUnavailable: 1}\n  template:\n    spec:\n      imagePullSecrets:\n\
          \        - name: harbor-hyperswitch-admin\n      containers:\n        -\
          \ name: superposition\n          # restricted-node-6dc3f140f9 has this verified Harbor manifest\
          \ preloaded into\n          # containerd; its pod cannot use the slow external\
          \ blob\n          # redirect path during a live rollout.\n          image:\
          \ registry.re8ch.com/hyperswitch/superposition:re8ch-45fa7d15222dce436f7851e1bb32a30f550966db\n\
          \          imagePullPolicy: Never\n          env:\n            - name: DB_PASSWORD\n\
          \              valueFrom:\n                secretKeyRef:\n             \
          \     name: hyperswitch-superposition-prod-secrets\n                  key:\
          \ DB_PASSWORD\n            - name: SUPERPOSITION_TOKEN\n              valueFrom:\n\
          \                secretKeyRef:\n                  name: hyperswitch-superposition-prod-secrets\n\
          \                  key: SUPERPOSITION_TOKEN"
        target:
          group: apps
          kind: Deployment
          name: hyperswitch-superposition
          version: v1
      - patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: hyperswitch-control-center\n\
          spec:\n  strategy:\n    type: RollingUpdate\n    rollingUpdate: {maxSurge:\
          \ 0, maxUnavailable: 1}\n  template:\n    spec:\n      nodeSelector:\n \
          \       kubernetes.io/hostname: restricted-node-6dc3f140f9"
        target:
          group: apps
          kind: Deployment
          name: hyperswitch-control-center
          version: v1
      - patch: "apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: hyperswitch-redis-master\n\
          \  labels:\n    scheduling.re8ch.com/placement-managed: \"true\""
        target:
          group: apps
          kind: StatefulSet
          name: hyperswitch-redis-master
          version: v1
  releaseName: hyperswitch
  rollback:
    cleanupOnFail: true
  storageNamespace: payments
  suspend: false
  targetNamespace: payments
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableHooks: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    global:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - restricted-node-6dc3f140f9
    hyperswitch-app:
      clickhouse:
        enabled: false
      externalPostgresql:
        enabled: true
        primary:
          auth:
            database: hyperswitch
            password:
              _secretRef:
                key: primaryPassword
                name: hyperswitch-pigsty-credentials
            plainpassword:
              _secretRef:
                key: primaryPlainPassword
                name: hyperswitch-pigsty-credentials
            username: hyperswitch_migrator
          host: pg-re8ch-primary.pigsty-external.svc.cluster.local
        readOnly:
          auth:
            database: hyperswitch
            password:
              _secretRef:
                key: primaryPassword
                name: hyperswitch-pigsty-credentials
            username: hyperswitch_migrator
          enabled: true
          host: pg-re8ch-primary.pigsty-external.svc.cluster.local
      hyperswitch-card-vault:
        enabled: false
      hyperswitch-ucs:
        enabled: false
      kafka:
        enabled: false
      mailhog:
        enabled: false
      postgresql:
        enabled: false
      redis:
        master:
          persistence:
            storageClass: rbd-r640
      server:
        configs:
          analytics:
            forex_enabled: false
            source: sqlx
          connectors:
            alipaycn:
              base_url: https://openapi.alipay.com/gateway.do
            wechatpaycn:
              base_url: https://api.mch.weixin.qq.com
          cors:
            origins: https://pay.service.re8ch.com,https://pay-api.service.re8ch.com,https://api.re8ch.com
            wildcard_origin: false
          multitenancy:
            tenants:
              public:
                base_url: https://pay-api.service.re8ch.com
          payment_link:
            sdk_url: https://pay-api.service.re8ch.com/web/0.134.0/v1/HyperLoader.js
          superposition:
            backup_file_path: /local/config/superposition/superposition_seed.toml
        ingress:
          enabled: false
        run_env: production
      services:
        consumer:
          enabled: false
        drainer:
          enabled: false
        producer:
          enabled: false
      superposition:
        configs:
          app_env: PROD
          auth_provider: DISABLED
          auth_z_provider: DISABLED
          db_host: pg-re8ch-primary.pigsty-external.svc.cluster.local:5432
          db_name: hyperswitch
          db_user: hyperswitch_migrator
          local_kms_key_file: /run/re8ch-local-kms/key
          rust_log: info
        enabled: true
        replicaCount: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        secrets:
          db_password: ''
          oidc_client_secret: ''
          superposition_token: ''
        volumeMounts:
        - mountPath: /run/re8ch-local-kms
          name: local-kms-key
          readOnly: true
        volumes:
        - name: local-kms-key
          persistentVolumeClaim:
            claimName: hyperswitch-superposition-local-key
      superpositionDB:
        aliasService: superposition-db
        enable: true
        migration:
          enable: false
      superpositionFallback:
        configMap: hyperswitch-superposition-seed
        enabled: true
        key: superposition_seed.toml
        source: configMap
      vector:
        enabled: false
    hyperswitch-control-center:
      config:
        default:
          features:
            email: 'false'
            is_live_mode: 'true'
            sample_data: 'false'
            test_processors: 'false'
            totp: 'true'
      dependencies:
        clickhouse:
          enabled: false
        router:
          host: https://pay-api.service.re8ch.com
      enabled: true
      ingress:
        enabled: false
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
    hyperswitch-monitoring:
      enabled: false
    hyperswitch-ucs:
      enabled: false
    hyperswitch-web:
      autoBuild:
        enable: false
        forceBuild: false
      enabled: false
      ingress:
        enabled: false
  valuesFrom:
  - kind: Secret
    name: hyperswitch-runtime-values
    valuesKey: values.yaml
