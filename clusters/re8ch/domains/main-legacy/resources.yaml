apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runtime-anatomy
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./clusters/re8ch/charts/runtime-anatomy
      interval: 10m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: service-backend
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 1m
  releaseName: runtime-anatomy
  rollback:
    cleanupOnFail: true
  storageNamespace: runtime-anatomy
  targetNamespace: runtime-anatomy
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
  values:
    canary:
      enabled: true
    observer:
      enabled: true
    provisioning:
      enabled: false
    retention:
      gcMode: DryRun
    scope:
      lifecycle: Canary
