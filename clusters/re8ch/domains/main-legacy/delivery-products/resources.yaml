---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adapter
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: adapter
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 1m
  releaseName: adapter
  rollback:
    cleanupOnFail: true
  storageNamespace: adapter
  targetNamespace: adapter
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    fullnameOverride: adapter
    publicEdge:
      enabled: false
      gatewayName: re8ch-public
      gatewayNamespace: kube-system
      hostname: ''
      sectionName: https
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: adapter
  namespace: flux-system
spec:
  interval: 3m
  provider: generic
  ref:
    digest: sha256:feb775e9995f8ba8f6d36b5bd0b095b8598346085b4536e8b8c2130246ec0870
  url: oci://registry.re8ch.com/helm/adapter
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantNamespace
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
    tenancy.re8ch.com/tenant: re8ch
  name: re8ch-ontology-microscope
spec:
  namespaceName: re8ch-ontology-microscope
  operation: EnsurePresent
  tenantRef: re8ch
