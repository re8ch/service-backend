    to:
    - ipBlock:
        cidr: 192.0.2.154/32
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: headlamp
    ports:
    - port: 16443
      protocol: TCP
    - port: 26443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: controlled-cluster-relay
  policyTypes:
  - Ingress
  - Egress
