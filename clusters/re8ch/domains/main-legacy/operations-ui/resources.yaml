  namespace: headlamp
---
apiVersion: v1
data:
  default.conf: "server {\n  listen 8080;\n  server_name _;\n\n  location = /healthz\
    \ {\n    access_log off;\n    return 200 \"ok\\n\";\n  }\n\n  location = /auth\
    \ {\n    default_type text/html;\n    add_header Cache-Control \"no-store\" always;\n\
    \    return 200 '<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"\
    viewport\" content=\"width=device-width\"><title>Headlamp login</title></head><body><p>\u767B\
    \u5F55\u6210\u529F\uFF0C\u6B63\u5728\u8FD4\u56DE Headlamp\u2026</p><script>(function(){var\
    \ target=\"/c/re8ch-k3s/\";try{localStorage.setItem(\"auth_status\",\"success\"\
    );if(window.opener&&!window.opener.closed){window.opener.location.replace(target);setTimeout(function(){window.close()},100);return}}catch(e){}window.location.replace(target)})()</script></body></html>';\n\
    \  }\n\n  location / {\n    return 404;\n  }\n}\n"
