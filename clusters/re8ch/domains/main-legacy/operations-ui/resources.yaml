kind: ConfigMap
metadata:
  annotations:
    delivery.re8ch.com/reconciler: native-flux
  name: headlamp-birfucate-browser-v048-dhtf86f4bh
  namespace: headlamp
---
apiVersion: v1
data:
  default.conf: "map $http_upgrade $connection_upgrade {\n  default upgrade;\n  ''\
    \ close;\n}\n\nserver {\n  listen 8080;\n  server_name _;\n\n  location = /livez\
    \ {\n    access_log off;\n    return 200 \"ok\\n\";\n  }\n\n  location = /readyz\
    \ {\n    access_log off;\n    proxy_pass http://headlamp-origin/;\n    proxy_http_version\
    \ 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n  }\n\n  location = /auth {\n    proxy_pass http://headlamp-oidc-origin;\n\
    \    proxy_http_version 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header\
    \ X-Forwarded-Proto $scheme;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \  }\n\n  location / {\n    proxy_pass http://headlamp-origin;\n    proxy_http_version\
    \ 1.1;\n    proxy_set_header Host $host;\n    proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \    proxy_set_header Upgrade $http_upgrade;\n    proxy_set_header Connection\
    \ $connection_upgrade;\n    proxy_buffering off;\n  }\n}\n"
  nginx.conf: "worker_processes 2;\npid /var/run/nginx.pid;\n\nevents {\n  worker_connections\
    \ 1024;\n}\n\nhttp {\n  access_log /var/log/nginx/access.log;\n  error_log /var/log/nginx/error.log\
    \ notice;\n  sendfile on;\n  keepalive_timeout 65;\n  include /etc/nginx/conf.d/*.conf;\n\
    }\n"
