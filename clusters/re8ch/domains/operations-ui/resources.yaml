apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  namespace: studio-toolkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studio-api
  template:
    metadata:
      labels:
        app: studio-api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: STUDIO_MODE
          value: production
        - name: STUDIO_ROOT_PATH
          value: /studio
        - name: STUDIO_BLOB_ROOT
          value: /data
        - name: STUDIO_AUTH_FILE
          value: /config/auth.json
        - name: STUDIO_POSTGREST_RO
          value: https://db-ro.re8ch.com/studio
        - name: STUDIO_POSTGREST_RW
          value: https://db-rw.re8ch.com/studio
        - name: STUDIO_POSTGREST_JWT_KEY
          valueFrom:
            secretKeyRef:
              key: STUDIO_POSTGREST_JWT_KEY
              name: studio-config
        image: registry.re8ch.com/studio-toolkit/api@sha256:464849d200f577041cf55c3d67c5ea12a04c718601b88513a2db9d944c52c03a
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        name: studio-api
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: blobs
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: studio-registry-reader
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: blobs
        persistentVolumeClaim:
          claimName: studio-blobs
      - name: config
