          archive=/tmp/plugin.tar.gz
          stage=/headlamp/plugins/.advanced-fabric-0.26.0.new
          base64 -d /plugin/plugin.tar.gz.b64 > "$archive"
          echo 'e6c9f7620330252913a21b3c9b5c3f1cb782694fdf709411ba028972779bb3d2  /tmp/plugin.tar.gz' | sha256sum -c -
          rm -rf "$stage"
