metadata:
  labels:
    app.kubernetes.io/name: headlamp-gateway-proxy
  name: headlamp-gateway-proxy
  namespace: headlamp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-gateway-proxy
  template:
    metadata:
      annotations:
        operations.re8ch.com/config-revision: 2026-10-19-upstream-resilience
      labels:
        app.kubernetes.io/name: headlamp-gateway-proxy
    spec:
      containers:
      - image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: proxy
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 16Mi
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: config
          readOnly: true
          subPath: nginx.conf
        - mountPath: /etc/nginx/conf.d/default.conf
          name: config
          readOnly: true
          subPath: conf.d/default.conf
      volumes:
      - configMap:
