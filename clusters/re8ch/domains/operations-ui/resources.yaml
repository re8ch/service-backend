apiVersion: batch/v1
kind: Job
metadata:
  name: studio-database-bootstrap-v2
  namespace: supabase-pg-re8ch
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 6
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"
          export PGHOST=pg-re8ch-primary.pigsty-external.svc.cluster.local PGPORT=5432 PGUSER="$POSTGRES_ADMIN_USER"
          until pg_isready; do sleep 5; done
          psql -d postgres -v ON_ERROR_STOP=1 -v password="$STUDIO_DATABASE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE studio_authenticator LOGIN NOINHERIT PASSWORD %L', :'password') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='studio_authenticator')\gexec
          SELECT format('ALTER ROLE studio_authenticator LOGIN NOINHERIT PASSWORD %L', :'password')\gexec
          SELECT 'CREATE DATABASE studio_toolkit TEMPLATE template0 ENCODING ''UTF8''' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='studio_toolkit')\gexec
          REVOKE ALL ON DATABASE studio_toolkit FROM PUBLIC;
          GRANT CONNECT ON DATABASE studio_toolkit TO studio_authenticator;
          SQL
          psql -d studio_toolkit -v ON_ERROR_STOP=1 -f /migrations/001_studio.sql
          psql -d studio_toolkit -v ON_ERROR_STOP=1 <<'SQL'
          GRANT studio_app_ro,studio_app_rw,studio_identity_ro TO studio_authenticator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          NOTIFY pgrst, 'reload schema';
          SQL
        command:
        - /bin/sh
        - -ec
        env:
        - name: POSTGRES_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER_READ_WRITE
              name: supabase-pg-re8ch-secrets
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: supabase-pg-re8ch-secrets
        - name: STUDIO_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: STUDIO_DATABASE_PASSWORD
              name: studio-db-bootstrap
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        name: migrate
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /migrations
          name: migrations
          readOnly: true
      imagePullSecrets:
      - name: studio-registry-reader
      initContainers:
      - command:
        - python
        - -c
        - import shutil; shutil.copyfile("/app/toolkit/sql/001_studio.sql", "/migrations/001_studio.sql")
        image: registry.re8ch.com/studio-toolkit/api@sha256:8eb7d0c6a7702f3739bb729ddf284ca193f25dd2edfbc11ff8e6e587d4514e0e
        name: source-migration
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /migrations
          name: migrations
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: migrations
