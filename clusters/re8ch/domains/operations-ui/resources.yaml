apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlled-cluster-relay
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlled-cluster-relay
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/pinned-reason: controlled subcluster API routes are reachable
          only from A1
        scheduling.re8ch.com/placement-class: control-plane-critical
      labels:
        app.kubernetes.io/name: controlled-cluster-relay
        scheduling.re8ch.com/control-plane-allowed: "true"
    spec:
      containers:
      - command:
        - python3
        - /runtime/relay.py
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: relay
        ports:
        - containerPort: 16443
          name: artc-api
        - containerPort: 26443
          name: qwen-api
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /runtime
          name: runtime
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: restricted-node-1eb0570f74
      priorityClassName: system-cluster-critical
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
      - effect: PreferNoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - configMap:
          name: controlled-cluster-relay
        name: runtime
