metadata:
  name: studio-db-rw
  namespace: studio-toolkit
spec:
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  selector:
    app: studio-db-rw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studio-blobs
  namespace: studio-toolkit
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: cephfs-r640
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlled-cluster-relay
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlled-cluster-relay
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/pinned-reason: controlled subcluster API routes are reachable
          only from A1
        scheduling.re8ch.com/placement-class: control-plane-critical
      labels:
        app.kubernetes.io/name: controlled-cluster-relay
        scheduling.re8ch.com/control-plane-allowed: "true"
    spec:
      containers:
      - command:
        - python3
        - /runtime/relay.py
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        name: relay
        ports:
        - containerPort: 16443
          name: artc-api
        - containerPort: 26443
          name: qwen-api
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /runtime
          name: runtime
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: restricted-node-1eb0570f74
      priorityClassName: system-cluster-critical
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
      - effect: PreferNoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
      - effect: NoSchedule
        key: scheduling.re8ch.com/capacity-window
        operator: Equal
        value: closed
      volumes:
      - configMap:
          name: controlled-cluster-relay
        name: runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: headlamp
  name: headlamp
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: control-plane-critical
      labels:
        app.kubernetes.io/name: headlamp
        scheduling.re8ch.com/control-plane-allowed: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: headlamp
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - -in-cluster
        - -in-cluster-context-name=re8ch-k3s
        - -enable-dynamic-clusters
        - -kubeconfig=/etc/headlamp/qwen/qwen.kubeconfig:/etc/headlamp/artc/artc.kubeconfig
        - -oidc-client-id=ed4e0331-7522-59f8-8a72-2d558844dc24
        - -oidc-idp-issuer-url=https://db-rw.re8ch.com/auth/v1
        - -oidc-ca-file=/etc/ssl/certs/ca-certificates.crt
        - -oidc-callback-url=https://headlamp.service.re8ch.com/oidc-callback
        - -oidc-scopes=profile,email,offline_access
        - -oidc-use-pkce
        - -oidc-use-access-token
        - -oidc-use-cookie
        - -plugins-dir=/headlamp/plugins
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: 127.0.0.1
        - name: KUBERNETES_SERVICE_PORT
          value: "6443"
        - name: KUBERNETES_SERVICE_PORT_HTTPS
          value: "6443"
        image: registry.re8ch.com/functions-shared/headlamp@sha256:db3f0e0fc58d358d41daa3fe7fc852437552c7ee873c3645470f7b86a8e0db49
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        name: headlamp
        ports:
        - containerPort: 4466
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /headlamp/plugins
          name: plugins
        - mountPath: /etc/headlamp/qwen
          name: qwen-kubeconfig
          readOnly: true
        - mountPath: /etc/headlamp/artc
          name: artc-kubeconfig
          readOnly: true
      - image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        name: oidc-landing
        ports:
        - containerPort: 8080
          name: oidc-landing
        readinessProbe:
          httpGet:
            path: /healthz
            port: oidc-landing
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 16Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: oidc-landing
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases:
      - hostnames:
        - db-rw.re8ch.com
        ip: 192.0.2.209
      hostNetwork: true
      initContainers:
      - args:
        - |
          target=/headlamp/plugins/runtime-anatomy-0.2.0
          archive=/tmp/plugin.tar.gz
          cp /plugin/plugin.tar.gz "$archive"
          echo '6684c8e3e1fad425931e9fc130363f9eb414b5fddc3a06b6c7ec731297352e99  /tmp/plugin.tar.gz' | sha256sum -c -
          rm -rf "$target.new"
          mkdir -p "$target.new"
          tar -xzf "$archive" -C "$target.new" --strip-components=1
          rm -rf "$target"
          mv "$target.new" "$target"
        command:
        - /bin/sh
        - -ec
        image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
        name: install-runtime-anatomy-plugin
        volumeMounts:
        - mountPath: /headlamp/plugins
          name: plugins
        - mountPath: /plugin
          name: runtime-anatomy-plugin
          readOnly: true
      - args:
        - |
          target=/headlamp/plugins/birfucate-browser-0.4.6
          lock=/headlamp/plugins/.birfucate-browser-install.lock
          if [ -f "$target/package.json" ]; then exit 0; fi
          rmdir "$lock" 2>/dev/null || true
          until mkdir "$lock" 2>/dev/null; do
            if [ -f "$target/package.json" ]; then exit 0; fi
