apiVersion: v1
data:
  relay.py: |
    import socket
    import threading

    RELAYS = ((16443, "192.0.2.125", 6443), (26443, "192.0.2.154", 6443))

    def copy(source, target):
        try:
            while data := source.recv(65536):
                target.sendall(data)
        except OSError:
            pass
        finally:
            try:
                target.shutdown(socket.SHUT_WR)
            except OSError:
                pass

    def handle(client, target_host, target_port):
        try:
            upstream = socket.create_connection((target_host, target_port), timeout=10)
        except OSError:
            client.close()
            return
        threading.Thread(target=copy, args=(client, upstream), daemon=True).start()
        copy(upstream, client)
        client.close()
        upstream.close()

    def serve(listen_port, target_host, target_port):
        listener = socket.create_server(("0.0.0.0", listen_port), reuse_port=True)
        while True:
            client, _ = listener.accept()
            threading.Thread(target=handle, args=(client, target_host, target_port), daemon=True).start()

    for relay in RELAYS:
        threading.Thread(target=serve, args=relay, daemon=True).start()
    threading.Event().wait()
