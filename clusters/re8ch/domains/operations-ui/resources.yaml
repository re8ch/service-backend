  name: studio-retention
  namespace: studio-toolkit
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - python
            - -c
            - import os,httpx; r=httpx.post("http://studio-api:8080/v1/retention/collect",headers={"Authorization":"Bearer
              "+os.environ["STUDIO_TOKEN"]},timeout=60); r.raise_for_status(); print(r.text)
            env:
            - name: STUDIO_TOKEN
              valueFrom:
                secretKeyRef:
                  key: STUDIO_TOKEN
                  name: studio-retention
            image: registry.re8ch.com/studio-toolkit/api@sha256:464849d200f577041cf55c3d67c5ea12a04c718601b88513a2db9d944c52c03a
            name: collect
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          imagePullSecrets:
          - name: studio-registry-reader
          nodeSelector:
            kubernetes.io/hostname: restricted-node-6dc3f140f9
          restartPolicy: Never
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
  schedule: 17 3 * * *
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
