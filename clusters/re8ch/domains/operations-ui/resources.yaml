apiVersion: batch/v1
kind: Job
metadata:
  name: paralus-helmrelease-retirement
  namespace: flux-system
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - args:
        - |
          api=https://kubernetes.default.svc/apis/helm.toolkit.fluxcd.io/v2/namespaces/flux-system/helmreleases/paralus
          token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          code=$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}' \
            --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --header "Authorization: Bearer $token" \
            --request DELETE "$api")
          case "$code" in
            200|202|404) exit 0 ;;
            *) cat /tmp/response >&2; exit 1 ;;
          esac
        command:
        - /bin/sh
        - -ec
        image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
        name: delete-retired-release
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: paralus-helmrelease-retirement
      volumes:
      - emptyDir: {}
        name: tmp
