apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-api
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-api
  template:
    metadata:
      labels:
        app: commerce-api
    spec:
      containers:
      - env:
        - name: WX_PAY_MCH_ID
          valueFrom:
            secretKeyRef:
              key: WX_PAY_MCH_ID
              name: commerce-ruiqi-merchant-certificate
        - name: WX_PAY_SERIAL_NO
          valueFrom:
            secretKeyRef:
              key: WX_PAY_SERIAL_NO
              name: commerce-ruiqi-merchant-certificate
        - name: WX_PAY_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              key: WX_PAY_PRIVATE_KEY
              name: commerce-ruiqi-merchant-certificate
        - name: WX_PAY_API_V3_KEY
          valueFrom:
            secretKeyRef:
              key: WX_PAY_API_V3_KEY
              name: commerce-ruiqi-api-v3
        - name: WX_PAY_PLATFORM_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: WX_PAY_PLATFORM_PUBLIC_KEY
              name: commerce-ruiqi-platform-certificate
        - name: WX_PAY_PLATFORM_SERIAL_NO
          valueFrom:
            secretKeyRef:
              key: WX_PAY_PLATFORM_SERIAL_NO
              name: commerce-ruiqi-platform-certificate
        - name: WX_PAY_APP_ID
          valueFrom:
            secretKeyRef:
              key: WX_PAY_APP_ID
              name: commerce-wechat-app-identities
        - name: WECHAT_MINI_APP_ID
          valueFrom:
            secretKeyRef:
              key: WECHAT_MINI_APP_ID
              name: commerce-wechat-app-identities
        - name: RE8CH_AUTH_BASE_URL
          value: http://re8ch-auth-gateway.auth.svc.cluster.local:8080/auth
        - name: COMMERCE_RW_URL
          value: http://commerce-postgrest-rw.payments.svc.cluster.local:3000
        - name: COMMERCE_RO_URL
          value: http://commerce-postgrest-ro.payments.svc.cluster.local:3000
        - name: WX_PAY_NOTIFY_URL
          value: https://api.re8ch.com/commerce/v1/webhooks/wechat
        - name: COMMERCE_CHECKOUT_ENABLED
          value: "true"
        - name: COMMERCE_MINI_CHECKOUT_ENABLED
          value: "false"
        envFrom:
