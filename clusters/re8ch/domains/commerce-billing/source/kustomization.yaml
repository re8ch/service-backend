apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../secrets/ghcr-re8ch-payments.sops.yaml
- ../../../secrets/hyperswitch-runtime-values.sops.yaml
- ../../../secrets/hyperswitch-bootstrap-admin.sops.yaml
- ../../../secrets/commerce-wechat-app-identities.sops.yaml
- ../../../secrets/commerce-ruiqi-merchant-certificate.sops.yaml
- ../../../secrets/commerce-ruiqi-api-v3.sops.yaml
- ../../../secrets/commerce-ruiqi-platform-certificate.sops.yaml
- ../../../secrets/ledger-wechat-app-identities.sops.yaml
- ../../../components/payments/credits-runtime.yaml
- ../../../components/payments/commerce-runtime.yaml
- ../../../components/payments/catalog-runtime.yaml
- ../../../../../platform/hyperswitch
patches:
  - target: {group: batch, version: v1, kind: CronJob, name: commerce-wechat-reconcile, namespace: payments}
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: commerce-wechat-reconcile, namespace: payments}
      $patch: delete
  - target: {version: v1, kind: ConfigMap, name: nuclio-payment-registry-api, namespace: payments}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: nuclio-payment-registry-api, namespace: payments}
      $patch: delete

