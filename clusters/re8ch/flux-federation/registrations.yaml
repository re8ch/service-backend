apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: domain, namespace: flux-agent-system}
spec:
  interval: 30s
  timeout: 2m
  suspend: false
  url: ssh://git@ssh.github.com:443/re8ch-ai/agent-gitops.git
  ref: {branch: main}
  secretRef: {name: agent-github-ssh}
  verify: {mode: HEAD, secretRef: {name: git-verification-keys}}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: domain, namespace: flux-agent-system}
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 15m
  suspend: true
  path: ./clusters/re8ch
  prune: false
  wait: false
  sourceRef: {kind: GitRepository, name: domain}
  decryption: {provider: sops, secretRef: {name: sops-age}}
---
