apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: re8ch-toolhive-child-tolerations
spec:
  admission: true
  background: true
  generateExisting: true
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          namespaces:
          - toolhive-system
          selector:
            matchLabels:
              toolhive: 'true'
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Exists
              - effect: NoSchedule
                key: scheduling.re8ch.com/capacity-window
                operator: Equal
                value: closed
    name: add-r640-capacity-tolerations
  - generate:
      apiVersion: v1
      clone:
        name: harbor-functions-shared-pull
        namespace: anycam
      kind: Secret
      name: harbor-functions-shared-pull
      namespace: toolhive-system
      synchronize: true
    match:
      any:
      - resources:
          kinds:
          - Namespace
          names:
          - toolhive-system
    name: project-functions-shared-pull-secret
  - match:
      any:
      - resources:
          kinds:
          - Deployment
          namespaces:
          - toolhive-system
          selector:
            matchLabels:
              app.kubernetes.io/component: session-router
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              imagePullSecrets:
              - name: harbor-functions-shared-pull
    name: add-session-router-image-pull-secret
  validationFailureAction: Audit
---
# Cluster-scoped policy boundaries remain main-Flux authority. The autonomous
# Agent domain owns only the namespaced runner implementation.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: api-conformance-runner-secret-boundary}
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: only-reviewed-registry-pull-secret
    match:
      any:
      - resources: {kinds: [Secret], namespaces: [api-conformance-runners]}
    validate:
      message: Runner namespace accepts only the reviewed registry pull Secret; service and App credentials belong outside it.
      pattern:
        metadata: {name: harbor-functions-shared-pull}
        type: kubernetes.io/dockerconfigjson
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: api-conformance-runner-pull}
spec:
  admission: true
  background: true
  generateExisting: true
  validationFailureAction: Audit
  rules:
  - name: project-shared-runtime-pull
    match:
      any:
      - resources: {kinds: [Namespace], names: [api-conformance-runners]}
    generate:
      apiVersion: v1
      kind: Secret
      name: harbor-functions-shared-pull
      namespace: api-conformance-runners
      synchronize: true
      clone: {namespace: toolhive-system, name: harbor-functions-shared-pull}
