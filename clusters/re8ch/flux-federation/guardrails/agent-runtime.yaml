apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apiconformanceruns.conformance.re8ch.com
spec:
  group: conformance.re8ch.com
  names:
    kind: APIConformanceRun
    plural: apiconformanceruns
    shortNames:
    - acr
    singular: apiconformancerun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef
      name: Target
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              commit:
                maxLength: 40
                pattern: ^[a-f0-9]{40}$
                type: string
              imageDigest:
                maxLength: 71
                pattern: ^$|^sha256:[a-f0-9]{64}$
                type: string
              mode:
                enum:
                - read
                - mutation
                maxLength: 8
                type: string
              publication:
                properties:
                  branch:
                    maxLength: 200
                    pattern: ^[A-Za-z0-9_./-]+$
                    type: string
                  commit:
                    maxLength: 40
                    pattern: ^[a-f0-9]{40}$
                    type: string
                  imageDigest:
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  installationId:
                    maxLength: 30
                    pattern: ^[0-9]+$
                    type: string
                  repository:
                    maxLength: 200
                    pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                    type: string
                  schemaSha256:
                    maxLength: 64
                    pattern: ^[a-f0-9]{64}$
                    type: string
                required:
                - repository
                - commit
                - branch
                - imageDigest
                - schemaSha256
                - installationId
                type: object
              targetRef:
                maxLength: 253
                minLength: 1
                type: string
              trigger:
                enum:
                - schedule
                - deployment
                - manual
                maxLength: 10
                type: string
            required:
            - targetRef
            - mode
            - trigger
            - commit
            type: object
            x-kubernetes-validations:
            - message: Run specifications are immutable; create a new run.
              rule: self == oldSelf
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apiconformancetargets.conformance.re8ch.com
spec:
  group: conformance.re8ch.com
  names:
    kind: APIConformanceTarget
    plural: apiconformancetargets
    shortNames:
    - act
    singular: apiconformancetarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.lastResult
      name: Result
      type: string
    - jsonPath: .status.lastRunRef
      name: Run
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              authSecretRef:
                properties:
                  key:
                    default: authorization
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              baseUrl:
                pattern: ^https://
                type: string
              branch:
                minLength: 1
                type: string
              canary:
                properties:
                  resourceRef:
                    type: string
                  tenantRef:
                    pattern: ^schemathesis-canary[A-Za-z0-9_.-]*$
                    type: string
                type: object
              checks:
                properties:
                  exclude:
                    items:
                      enum:
                      - unsupported_method
                      type: string
                    maxItems: 1
                    type: array
                  rationale:
                    minLength: 40
                    type: string
                type: object
              commit:
                pattern: ^[a-f0-9]{40}$
                type: string
              github:
                properties:
                  installationId:
                    pattern: ^[0-9]+$
                    type: string
                required:
                - installationId
                type: object
              imageDigest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lifecycle:
                properties:
                  cleanup:
                    items:
                      properties:
                        body:
                          x-kubernetes-preserve-unknown-fields: true
                        capture:
                          additionalProperties:
                            pattern: ^\\$\\.
                            type: string
                          type: object
                        expectedStatuses:
                          items:
                            maximum: 599
                            minimum: 100
                            type: integer
                          minItems: 1
                          type: array
                        method:
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          type: string
                        operationId:
                          minLength: 1
                          type: string
                        path:
                          pattern: ^/
                          type: string
                      required:
                      - operationId
                      - method
                      - path
                      - expectedStatuses
                      type: object
                    minItems: 1
                    type: array
                  reversal:
                    items:
                      properties:
                        body:
                          x-kubernetes-preserve-unknown-fields: true
                        capture:
                          additionalProperties:
                            pattern: ^\\$\\.
                            type: string
                          type: object
                        expectedStatuses:
                          items:
                            maximum: 599
                            minimum: 100
                            type: integer
                          minItems: 1
                          type: array
                        method:
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          type: string
                        operationId:
                          minLength: 1
                          type: string
                        path:
                          pattern: ^/
                          type: string
                      required:
                      - operationId
                      - method
                      - path
                      - expectedStatuses
                      type: object
                    type: array
                  setup:
                    items:
                      properties:
                        body:
                          x-kubernetes-preserve-unknown-fields: true
                        capture:
                          additionalProperties:
                            pattern: ^\\$\\.
                            type: string
                          type: object
                        expectedStatuses:
                          items:
                            maximum: 599
                            minimum: 100
                            type: integer
                          minItems: 1
                          type: array
                        method:
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          type: string
                        operationId:
                          minLength: 1
                          type: string
                        path:
                          pattern: ^/
                          type: string
                      required:
                      - operationId
                      - method
                      - path
                      - expectedStatuses
                      type: object
                    type: array
                type: object
              limits:
                properties:
                  maxExamples:
                    maximum: 100
                    minimum: 1
                    type: integer
                  maxRequests:
                    maximum: 2000
                    minimum: 1
                    type: integer
                  ratePerSecond:
                    maximum: 5
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    maximum: 900
                    minimum: 60
                    type: integer
                required:
                - maxExamples
                - maxRequests
                - ratePerSecond
                - timeoutSeconds
                type: object
              network:
                properties:
                  allowedHosts:
                    items:
                      pattern: ^[A-Za-z0-9.-]+$
                      type: string
                    minItems: 1
                    type: array
                  pinnedEgressEntity:
                    enum:
                    - host
                    type: string
                  pinnedEgressIPs:
                    additionalProperties:
                      format: ipv4
                      type: string
                    maxProperties: 4
                    type: object
                required:
                - allowedHosts
                type: object
              operations:
                properties:
                  allowGeneratedMutations:
                    default: false
                    type: boolean
                  mutationOperationIds:
                    items:
                      minLength: 1
                      type: string
                    type: array
                  readOperationIds:
                    items:
                      minLength: 1
                      type: string
                    type: array
                required:
                - readOperationIds
                - mutationOperationIds
                type: object
              repository:
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
              schedule:
                properties:
                  mutationSeconds:
                    default: 86400
                    minimum: 3600
                    type: integer
                  readSeconds:
                    default: 21600
                    minimum: 900
                    type: integer
                type: object
              schema:
                properties:
                  sha256:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  url:
                    pattern: ^https://
                    type: string
                required:
                - url
                - sha256
                type: object
              serviceRef:
                minLength: 1
                type: string
              suspend:
                default: false
                type: boolean
            required:
            - serviceRef
            - repository
            - commit
            - branch
            - baseUrl
            - schema
            - network
            - operations
            - limits
            type: object
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
