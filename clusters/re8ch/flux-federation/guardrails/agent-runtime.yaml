  validations:
  - expression: request.userInfo.username == 'system:serviceaccount:' + request.namespace
      + ':git-workspace-controller'
    message: ProjectCapability is controller-owned and cannot be granted manually.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: work-evidence-producer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - governance.re8ch.com
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      resources:
      - workevidences
  validations:
  - expression: object.spec.producerServiceAccount == object.spec.plane + '-evidence'
    message: The evidence plane must match its dedicated producer service account.
  - expression: request.userInfo.username == 'system:serviceaccount:' + request.namespace
      + ':' + object.spec.producerServiceAccount
    message: WorkEvidence may only be created by its declared Kubernetes service account.
