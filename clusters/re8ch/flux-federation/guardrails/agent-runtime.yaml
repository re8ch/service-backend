apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: git-account-status-writers
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - governance.re8ch.com
      apiVersions:
      - v1alpha1
      operations:
      - UPDATE
      resources:
      - gitaccounts/status
  validations:
  - expression: ((!has(object.status) || !has(object.status.mailbox)) == (!has(oldObject.status)
      || !has(oldObject.status.mailbox)) && ((!has(object.status) || !has(object.status.mailbox))
      || object.status.mailbox == oldObject.status.mailbox)) || request.userInfo.username
      == 'system:serviceaccount:mail-system:stalwart-mailbox-provisioner'
    message: Only mailbox-provisioner may change mailbox readiness.
  - expression: ((!has(object.status) || !has(object.status.ownership)) == (!has(oldObject.status)
      || !has(oldObject.status.ownership)) && ((!has(object.status) || !has(object.status.ownership))
      || object.status.ownership == oldObject.status.ownership)) || request.userInfo.username
      == 'system:serviceaccount:' + request.namespace + ':git-workspace-controller'
    message: Only git-workspace-controller may reconcile ownership readiness.
  - expression: ((!has(object.status) || !has(object.status.providerIdentity)) ==
      (!has(oldObject.status) || !has(oldObject.status.providerIdentity)) && ((!has(object.status)
      || !has(object.status.providerIdentity)) || object.status.providerIdentity ==
      oldObject.status.providerIdentity)) || request.userInfo.username == 'system:serviceaccount:'
      + request.namespace + ':git-workspace-controller'
    message: Only git-workspace-controller may verify provider identity.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: owner-approval-producer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - governance.re8ch.com
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      resources:
      - ownerapprovals
  validations:
  - expression: request.userInfo.username == 'system:serviceaccount:' + request.namespace
      + ':owner-review-verifier'
    message: OwnerApproval may only be published by the Git provider review verifier.
  - expression: object.spec.pullRequest.merged == true
    message: OwnerApproval requires a merged identity pull request.
  - expression: object.spec.reviewedBy != object.spec.codeOwner.providerUsername
    message: The bot identity being added cannot approve itself.
---
apiVersion: admissionregistration.k8s.io/v1
