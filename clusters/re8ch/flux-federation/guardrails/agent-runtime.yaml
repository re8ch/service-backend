apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitaccounts.governance.re8ch.com
spec:
  group: governance.re8ch.com
  names:
    kind: GitAccount
    plural: gitaccounts
    shortNames:
    - gacct
    singular: gitaccount
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              collaboration:
                properties:
                  credentialSecretRef:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - namespace
                    - name
                    type: object
                  endpoint:
                    pattern: ^https://
                    type: string
                  protocols:
                    items:
                      enum:
                      - email
                      - calendar
                      - contacts
                      - webdav
                      type: string
                    minItems: 4
                    type: array
                    x-kubernetes-list-type: set
                required:
                - endpoint
                - protocols
                - credentialSecretRef
                type: object
              displayName:
                minLength: 1
                type: string
              email:
                pattern: ^[^@]+@phonaid\.com$
                type: string
              employeeType:
                enum:
                - human
                - bot
                type: string
              googleWorkspace:
                enum:
                - eligible
                - requested
                - disabled
                type: string
              mailbox:
                enum:
                - stalwart
                type: string
              project:
                type: string
              provider:
                enum:
                - github
                - gitlab
                type: string
              providerIdentity:
                properties:
                  installationRef:
                    type: string
                  username:
                    pattern: ^[A-Za-z0-9_.-]+$
                    type: string
                required:
                - username
                type: object
            required:
            - email
            - provider
            - project
            - mailbox
            type: object
            x-kubernetes-validations:
            - message: Bot employees require displayName, providerIdentity and collaboration
                access.
              rule: '!has(self.employeeType) || self.employeeType != ''bot'' || (has(self.displayName)
                && has(self.providerIdentity) && has(self.collaboration))'
          status:
            properties:
              mailbox:
                properties:
                  observedAt:
                    format: date-time
                    type: string
                  phase:
                    enum:
                    - Pending
                    - Provisioned
                    - Ready
                    - Failed
                    type: string
                  provider:
                    enum:
                    - stalwart
                    type: string
                  reason:
                    type: string
                required:
                - phase
                type: object
              ownership:
                properties:
                  approvalRef:
                    type: string
                  identityCommit:
                    type: string
                  phase:
                    enum:
                    - AwaitingMailbox
                    - AwaitingOwnerReview
                    - Ready
                    type: string
                type: object
              providerIdentity:
                properties:
                  phase:
                    enum:
                    - Pending
                    - Verified
                    - Rejected
                    type: string
                  verifiedAt:
                    format: date-time
                    type: string
                  verifiedUsername:
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
