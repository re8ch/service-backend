apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - controllers.yaml
  - github-web-flow-key.yaml
  - registrations.yaml
  - guardrails/observability-metering.yaml
  - guardrails/agent-runtime.yaml
  - guardrails/identity-access.yaml
  - guardrails/networking.yaml
  - secrets/agent-github-ssh.sops.yaml
  - secrets/identity-github-ssh.sops.yaml
  - secrets/observability-github-ssh.sops.yaml
  - secrets/network-github-ssh.sops.yaml
replacements:
  - source:
      kind: ConfigMap
      name: github-web-flow-verification-key
      fieldPath: data.github-web-flow\.asc
    targets:
      - select:
          kind: Secret
          name: git-verification-keys
        fieldPaths:
          - stringData.github-web-flow\.asc

patches:

# Permanently omit retired controller workloads while retaining CRDs and history.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller|image-reflector-controller|image-automation-controller|release-compat-controller|re8ch-release-dispatcher)
    namespace: (flux-system|flux-agent-system|flux-identity-system|flux-observability-system|flux-network-system)
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: retired-local-gitops-controller
