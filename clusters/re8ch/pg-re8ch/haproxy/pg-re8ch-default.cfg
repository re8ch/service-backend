# service: pg-re8ch-default @ 10.181.22.186:5436
# service instances 10.181.22.128, 10.181.22.186, 10.181.22.16
listen pg-re8ch-default
    bind *:5436
    mode tcp
    maxconn 5000
    balance first
    default-server inter 2s fastinter 1s downinter 2s rise 3 fall 3 on-marked-down shutdown-sessions slowstart 30s maxconn 3000 maxqueue 128 weight 100

    # R640 is the designated pg-re8ch primary. Replica promotion is a
    # controlled Patroni operation; enable a replica here only after promotion.
    server pg-re8ch-1 10.181.22.128:5432 check port 5432 weight 100
    server pg-re8ch-2 10.181.22.186:5432 disabled
    server pg-re8ch-3 10.181.22.16:5432 disabled
