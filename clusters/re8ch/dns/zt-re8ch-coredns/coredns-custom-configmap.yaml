apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  ynzs.server: |
    ynzs.com:53 {
        errors
        cache 30
        forward . 192.0.2.58 192.0.2.216 {
            policy sequential
        }
    }
  zt-re8ch.server: |
    zt.re8ch.com:53 {
        errors
        cache 30
        forward . 192.0.2.192 192.0.2.138 192.0.2.74 {
            policy sequential
        }
    }
