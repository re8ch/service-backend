---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anycam-r640-model-store
  namespace: anycam
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anycam-model-registry
  namespace: anycam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anycam-model-registry
  template:
    metadata:
      labels:
        app: anycam-model-registry
    spec:
      nodeSelector:
        kubernetes.io/hostname: r640
      containers:
      - name: api
        image: ghcr.io/woomou/anycam-market-demo@sha256:fedbb358d50a59582c1cb847e189f473073a486d02bb218087e4bc2bfce83045
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - anycam_backend.local_server
        args:
        - --serve
        - --host
        - 0.0.0.0
        - --port
        - '8099'
        env:
        - name: ANYCAM_MARKET_DATA_DIR
          value: /data/anycam-market
        - name: ANYCAM_R640_WORKER_AVAILABLE
          value: '1'
        - name: ANYCAM_R640_WORKER_ID
          value: r640-anycam-model-downloader
        - name: ANYCAM_MARKET_OBJECT_DIR
          value: /data/anycam-market/objects
        ports:
        - name: http
          containerPort: 8099
        volumeMounts:
        - name: model-store
          mountPath: /data/anycam-market
        readinessProbe:
          httpGet:
            path: /market/registry
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: anycam-r640-model-store
      securityContext:
        fsGroup: 10001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anycam-model-downloader
  namespace: anycam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anycam-model-downloader
  template:
    metadata:
      labels:
        app: anycam-model-downloader
    spec:
      nodeSelector:
        kubernetes.io/hostname: r640
      containers:
      - name: worker
        image: ghcr.io/woomou/anycam-market-demo@sha256:fedbb358d50a59582c1cb847e189f473073a486d02bb218087e4bc2bfce83045
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - anycam_backend.market_worker
        - loop
        env:
        - name: ANYCAM_MARKET_DATA_DIR
          value: /data/anycam-market
        - name: ANYCAM_REGISTRY_API_BASE
          value: http://anycam-model-registry:8099
        - name: ANYCAM_MARKET_OBJECT_DIR
          value: /data/anycam-market/objects
        volumeMounts:
        - name: model-store
          mountPath: /data/anycam-market
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: anycam-r640-model-store
      securityContext:
        fsGroup: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: anycam-model-registry
  namespace: anycam
spec:
  selector:
    app: anycam-model-registry
  ports:
  - name: http
    port: 8099
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anycam-market-public
  namespace: anycam
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: apps-wildcard-https
  hostnames:
  - market.apps.re8ch.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /market/
    backendRefs:
    - name: anycam-model-registry
      port: 8099
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anycam-market-demo-seed
  namespace: anycam
data:
  seed.py: "from anycam_backend import curated_market\n\nrevision = \"4299e5c7bd07d76ccd546f27ad068d4a94adb385\"\
    \nrepository = \"qualcomm/MobileNet-v2\"\ncandidate = {\n    \"name\": \"MobileNet\
    \ v2 INT8\",\n    \"task\": \"classification\",\n    \"description\": \"ImageNet\
    \ image classification, 224 \xD7 224 RGB input, 1000 scores\",\n    \"runtime\"\
    : \"TFLITE\",\n    \"availability\": \"NEEDS_CONVERSION\",\n    \"inputSpec\"\
    : {\"description\": \"224 \xD7 224 RGB image\"},\n    \"outputSpec\": {\"description\"\
    : \"1000 class scores\"},\n    \"files\": [],\n    \"source\": {\"kind\": \"huggingface\"\
    , \"repoId\": repository,\n               \"url\": \"https://huggingface.co/qualcomm/MobileNet-v2\"\
    ,\n               \"revision\": revision},\n}\ncurated_market.discover([candidate],\
    \ \"hf\")\nproduct_id = curated_market.identity(\"hf\", repository, \"main\")\n\
    curated_market.select(\n    product_id, revision=revision, model_license=\"Apache-2.0\"\
    ,\n    artifact_license=\"Apache-2.0\", example_license=\"CC0-1.0\",\n    example_url=\"\
    https://commons.wikimedia.org/wiki/Special:Redirect/file/Red_apple_on_white_background.jpg\"\
    ,\n    example_sha256=\"d4a7d9c025a0606b8ac1b79b3685b82e09990ea6c2a200932b479f95d7c8ff8f\"\
    ,\n    artifact_url=\"https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobilenet_v2/releases/v0.63.0/mobilenet_v2-tflite-w8a8.zip\"\
    ,\n    artifact_sha256=\"2eeb390160d47519313bc7a47e9895e39724cff62eb0dbe2dad32a5a4bc76b04\"\
    ,\n    artifact_member=\"mobilenet_v2-tflite-w8a8/mobilenet_v2.tflite\",\n   \
    \ model_sha256=\"8bfa78effd1a5036f228d3b25eaf49b09d3dd07d13211d3e98639c7c103aa30c\"\
    ,\n    labels_member=\"mobilenet_v2-tflite-w8a8/labels.txt\",\n)\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: anycam-market-demo-seed-v2
  namespace: anycam
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 10001
      containers:
      - name: seed
        image: ghcr.io/woomou/anycam-market-demo@sha256:fedbb358d50a59582c1cb847e189f473073a486d02bb218087e4bc2bfce83045
        command:
        - python
        - /scripts/seed.py
        env:
        - name: ANYCAM_MARKET_DATA_DIR
          value: /data/anycam-market
        - name: ANYCAM_MARKET_OBJECT_DIR
          value: /data/anycam-market/objects
        volumeMounts:
        - name: model-store
          mountPath: /data/anycam-market
        - name: seed
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: anycam-r640-model-store
      - name: seed
        configMap:
          name: anycam-market-demo-seed
