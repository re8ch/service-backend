apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns-cloudflare
  namespace: qianwen-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-cloudflare
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-cloudflare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-cloudflare
subjects:
  - kind: ServiceAccount
    name: external-dns-cloudflare
    namespace: qianwen-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-cloudflare
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: cloudflare-re8ch
spec:
  replicas: 1
  strategy:
    # The controller is singleton by replica count; RollingUpdate lets a
    # replacement start when the previous node is unreachable and its Pod is
    # stuck Terminating.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: cloudflare-re8ch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/instance: cloudflare-re8ch
    spec:
      serviceAccountName: external-dns-cloudflare
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets: [{name: ghcr-re8ch}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
      containers:
        - name: external-dns
          image: ghcr.io/re8ch/external-dns:v0.21.0@sha256:99160687de6c703460ed1b792ccb985012a96cfb787109427b87b70faa69b33e
          args:
            - --source=ingress
            - --provider=cloudflare
            - --domain-filter=re8ch.com
            # ExternalDNS is only the execution layer for PublicEdge. Ordinary
            # Ingresses and Gateway API routes cannot publish DNS directly.
            - --label-filter=networking.re8ch.com/dns-authority=public-edge
            # Never derive a public DNS answer from an RFC1918 Gateway VIP.
            # Public origins must be explicit routable targets on the labeled
            # Service/Ingress/Route resource.
            - --exclude-target-net=192.0.2.203/8
            - --exclude-target-net=192.0.2.179/12
            - --exclude-target-net=192.0.2.148/16
            - --policy=upsert-only
            # This is the only label-scoped writer for these records. Avoid the
            # TXT registry because it doubles record usage and makes Cloudflare
            # replacements fail at the zone quota boundary.
            - --registry=noop
            # Public failover must converge without waiting five minutes.
            - --interval=1m
            - --events
            - --log-format=json
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-pg-dns-controller-secret
                  key: CF_API_TOKEN
            - {name: KUBERNETES_SERVICE_HOST, value: "127.0.0.1"}
            - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
