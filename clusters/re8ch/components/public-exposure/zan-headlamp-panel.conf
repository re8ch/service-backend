server {
    listen 80;
    server_name headlamp.re8ch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://headlamp.service.re8ch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name headlamp.re8ch.com;

    ssl_certificate     /etc/letsencrypt/live/headlamp.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/headlamp.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /re8ch-headlamp-tenant-init.js {
        root /var/www/html;
        add_header Cache-Control "no-store";
    }

    location / {
        sub_filter_once on;
        sub_filter '</head>' '<script src="/re8ch-headlamp-tenant-init.js"></script></head>';
        proxy_pass http://10.251.0.4;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
