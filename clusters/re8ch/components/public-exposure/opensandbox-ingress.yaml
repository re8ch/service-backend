apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-server
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: opensandbox.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensandbox-server
                port:
                  name: http
  tls:
    - hosts: [opensandbox.re8ch.com]
      secretName: re8ch-wildcard-tls
