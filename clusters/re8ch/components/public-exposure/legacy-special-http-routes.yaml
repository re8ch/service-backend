# Explicit Gateway API translations for the last supported Traefik-only
# behaviours. These routes contain no proxy hop and are consumed directly by
# the shared Cilium Gateway/Advanced Fabric data plane.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: codex-app-server-console-public, namespace: codex-platform}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-sh217-https}
  hostnames: [api-shanghai217.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /codex-console}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: codex-app-server-console, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: codex-session-web-public, namespace: codex-platform}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-sh217-https}
  hostnames: [api-shanghai217.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /codex}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: codex-session-web, port: 8080}]
    - matches: [{path: {type: PathPrefix, value: /api}}]
      backendRefs: [{name: codex-session-web, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: headlamp-http-redirect, namespace: headlamp}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters: [{type: RequestRedirect, requestRedirect: {scheme: https, port: 443, statusCode: 308}}]
---
