apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: vmcp-r640-backends-public, namespace: toolhive-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: admin-https}]
  hostnames: [admin.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /backend/admin}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: mcp-ops-admin-external, port: 8088}]
    - matches: [{path: {type: PathPrefix, value: /backend/observe}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: mcp-ops-observe-external, port: 8088}]
    - matches: [{path: {type: PathPrefix, value: /backend/operate}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
      backendRefs: [{name: mcp-ops-operate-external, port: 8088}]
