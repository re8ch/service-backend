    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-gz24-https}
  hostnames: [api.re8ch.com, api-shanghai77.re8ch.com, api-shanghai217.re8ch.com, api-guangzhou24.re8ch.com]
