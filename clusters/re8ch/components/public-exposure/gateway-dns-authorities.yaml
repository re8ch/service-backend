apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steel-browser
  namespace: ai-operations
  labels: {public.re8ch.com/external-dns: enabled}
  annotations: &public-edge-dns
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: browser.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: oauth2-proxy-steel, port: {number: 4180}}}
---
