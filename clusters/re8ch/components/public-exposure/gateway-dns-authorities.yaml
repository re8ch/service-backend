---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensandbox-server
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/name: opensandbox-server
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: opensandbox.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: opensandbox-server, port: {name: http}}}
