apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: operate-tools-public, namespace: toolhive-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-wildcard-https}]
  hostnames: [operate.tools.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /mcp}}, {path: {type: PathPrefix, value: /.well-known}}]
      backendRefs: [{name: re8ch-operate-vmcp-session-router, port: 4483}]
