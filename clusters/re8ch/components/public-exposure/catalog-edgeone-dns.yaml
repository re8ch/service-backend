apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-edgeone-dns-authority
  namespace: regional-routing
  labels:
    networking.re8ch.com/dns-authority: public-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: catalog.re8ch.com
    external-dns.alpha.kubernetes.io/target: catalog.re8ch.com.eo.dnse1.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  # DNS authority only. EdgeOne serves the public site from its COS origin.
  ingressClassName: external-dns-only
  rules:
    - host: catalog.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: public-edge-manager
                port:
                  number: 8080
