metadata:
  name: service-zone-admin-admin-tools-public
  namespace: toolhive-system
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - admin.service.re8ch.com
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: re8ch-admin-vmcp-session-router
      port: 4483
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /mcp
    - path:
        type: PathPrefix
        value: /oauth
