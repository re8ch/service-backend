apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-dex-dex-oauth-authorization-server-discovery
  namespace: dex
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - dex.service.re8ch.com
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: dex
      port: 80
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replaceFullPath: /.well-known/openid-configuration
          type: ReplaceFullPath
    - responseHeaderModifier:
        set:
        - name: X-Re8ch-OAuth-Discovery
          value: rfc8414-via-oidc
      type: ResponseHeaderModifier
    matches:
    - path:
        type: Exact
        value: /.well-known/oauth-authorization-server
---
