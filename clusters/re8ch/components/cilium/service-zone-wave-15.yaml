apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: service-zone-admin-vmcp-r640-backends-public
  namespace: toolhive-system
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: service-wildcard-https
  hostnames:
  - admin.service.re8ch.com
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: mcp-ops-admin-external
      port: 8088
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /backend/admin
  - backendRefs:
    - group: ''
      kind: Service
      name: mcp-ops-observe-external
      port: 8088
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /backend/observe
  - backendRefs:
    - group: ''
      kind: Service
      name: mcp-ops-operate-external
      port: 8088
      weight: 1
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /backend/operate
---
