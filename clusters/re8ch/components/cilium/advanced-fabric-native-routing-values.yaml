# Apply only after every retained node has a complete FRR replacement RIB.
routingMode: native
ipv4NativeRoutingCIDR: 10.42.0.0/16
autoDirectNodeRoutes: false
directRoutingSkipUnreachable: false
# Every K3s server/agent exposes its health-checked local control-plane load
# balancer here.  Cilium must not bootstrap against the R640 voter directly.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6444
bgpControlPlane: {enabled: true}
operator:
  replicas: 3
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [a1-wsl-zt, b1-wsl-zt, r640]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {io.cilium/app: operator, name: cilium-operator}
          topologyKey: kubernetes.io/hostname
