apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge-origin
  namespace: headlamp
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: http}
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-public
  namespace: headlamp
  annotations:
    # Gateway status contains private service VIPs for every regional parent.
    # Publish only the routable public edge; the VIPs remain internal origins.
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: headlamp-https
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: headlamp-https}
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-edge-origin
  namespace: qianwen-ops
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: panel-grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-public
  namespace: qianwen-ops
  annotations:
    networking.re8ch.com/dns-authority: qianwen-ops/grafana-dns-authority
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: grafana-https
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: panel-grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phonycenter-public
  namespace: voice-observability
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [phonycenter.re8ch.com]
  rules:
    - backendRefs:
        - name: homer-ui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-public
  namespace: llm-gateway
  annotations:
    networking.re8ch.com/dns-authority: llm-gateway/litellm-dns-authority
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: litellm-https
  hostnames: [litellm.re8ch.com]
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-dns-authority
  namespace: llm-gateway
  labels: {networking.re8ch.com/dns-authority: public-edge}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: litellm.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: litellm, port: {number: 4000}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supabase-public
  namespace: supabase-pg-re8ch
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: supabase-https
  hostnames: [supabase.re8ch.com]
  rules:
    - backendRefs:
        - name: supabase-api-kong
          port: 8000
