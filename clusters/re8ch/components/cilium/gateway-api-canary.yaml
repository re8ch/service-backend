apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-dns-authority
  namespace: llm-gateway
  labels: {networking.re8ch.com/dns-authority: migrated-to-service-zone}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: litellm.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: litellm.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: litellm, port: {number: 4000}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supabase-public
  namespace: supabase-pg-re8ch
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: supabase-https
  hostnames: [supabase.re8ch.com]
  rules:
    - backendRefs:
        - name: supabase-api-kong
          port: 8000
---
# Delegated service-zone wave 1. Each route shares the single wildcard TLS
# listener; PublicEdge publishes its A only after an HTTPS readiness probe.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: grafana-service-public, namespace: observability-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}]
  hostnames: [grafana.service.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /}}]
      filters: [{type: RequestRedirect, requestRedirect: {path: {type: ReplaceFullPath, replaceFullPath: /grafana/}, statusCode: 302}}]
    - matches: [{path: {type: PathPrefix, value: /grafana}}]
      backendRefs: [{name: re8ch-grafana, port: 3000}]
