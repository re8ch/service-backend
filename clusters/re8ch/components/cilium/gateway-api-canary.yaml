    - {name: mail-https, hostname: mail.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - name: tools-wildcard-https
      hostname: "*.tools.re8ch.com"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: re8ch-tools-wildcard-tls}]
      allowedRoutes: {namespaces: {from: All}}
