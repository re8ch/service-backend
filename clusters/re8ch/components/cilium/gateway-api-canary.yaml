apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: re8ch-service-vip
  namespace: kube-system
spec:
  description: RE8CH Cilium-FRR service VIP gateway
  service:
    type: LoadBalancer
    loadBalancerClass: io.cilium/bgp-control-plane
    externalTrafficPolicy: Cluster
    allocateLoadBalancerNodePorts: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-re8ch
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: re8ch-service-vip
    namespace: kube-system
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: access-subdomains, namespace: kube-system}
spec:
  secretName: access-subdomains-tls
  issuerRef: {kind: ClusterIssuer, name: re8ch-cloudflare-dns01}
  dnsNames: [sub.access.re8ch.com, dns.access.re8ch.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: re8ch-apps-public-gateway, namespace: kube-system}
spec:
  secretName: re8ch-apps-wildcard-tls
  issuerRef: {kind: ClusterIssuer, name: re8ch-cloudflare-dns01}
  dnsNames: ["*.apps.re8ch.com"]
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: re8ch-gateway-canary
  namespace: kube-system
spec:
  gatewayClassName: cilium-re8ch
  infrastructure:
    labels:
      networking.re8ch.com/lb-pool: service-vip
      networking.re8ch.com/bgp-advertise: enabled
    annotations:
      lbipam.cilium.io/ips: 192.0.2.209
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: apps-wildcard-https
      hostname: "*.apps.re8ch.com"
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-apps-wildcard-tls}]}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: saas.re8ch.com/tenant, operator: Exists}
    - {name: browser-https, hostname: browser.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: storage-https, hostname: storage.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: agent-https, hostname: agent.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: among-clusters-https, hostname: among-clusters.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: among-clusters-ingest-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    # access.re8ch.com is SNI-routed as raw TLS; Mihomo terminates AnyTLS.
    - {name: access-tls, hostname: access.re8ch.com, protocol: TLS, port: 443, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: All}}}
    - {name: access-us-ca-tls, hostname: us-ca.access.re8ch.com, protocol: TLS, port: 443, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: All}}}
    - {name: access-my-kul-tls, hostname: my-kul.access.re8ch.com, protocol: TLS, port: 443, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: All}}}
    - {name: access-us-la-tls, hostname: route-la.access.re8ch.com, protocol: TLS, port: 443, tls: {mode: Passthrough}, allowedRoutes: {namespaces: {from: All}}}
    - {name: access-sub-https, hostname: sub.access.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: access-subdomains-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: access-dns-https, hostname: dns.access.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: access-subdomains-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: opensandbox-https, hostname: opensandbox.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: admin-https, hostname: admin.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - name: tools-wildcard-https
      hostname: "*.tools.re8ch.com"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{kind: Secret, name: re8ch-tools-wildcard-tls}]
      allowedRoutes: {namespaces: {from: All}}
    - name: tools-https
      hostname: tools.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: headlamp-https
      hostname: headlamp.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: dex-https
      hostname: dex.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grafana-https
      hostname: grafana.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - {name: litellm-https, hostname: litellm.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: supabase-https, hostname: supabase.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: auth-https, hostname: auth.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: codex-https, hostname: codex.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: decision-https, hostname: decision.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: feishu-agent-https, hostname: feishu-agent.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
