apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge-origin
  namespace: headlamp
spec:
  parentRefs:
    # Public HTTP is owned by headlamp-http-redirect. Keep this origin route on
    # regional listeners only so it cannot race the canonical 308 redirect.
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: http}
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-public
  namespace: headlamp
  annotations:
    # Gateway status contains private service VIPs for every regional parent.
    # Publish only the routable public edge; the VIPs remain internal origins.
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: headlamp-https
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: headlamp-https}
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: headlamp-service-public, namespace: headlamp}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}
  hostnames: [headlamp.service.re8ch.com]
  rules:
    # /oidc-callback still terminates in Headlamp and sets the cookie. Only
    # replace its final /auth landing page so mobile browsers do not depend on
    # a cross-window storage event.
    - matches:
        - path:
            type: Exact
            value: /auth
      backendRefs:
        - name: headlamp-oidc-landing
          port: 80
    - backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-edge-origin
  namespace: observability-system
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: re8ch-grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-public
  namespace: observability-system
  annotations:
    networking.re8ch.com/dns-authority: observability-system/grafana-dns-authority
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: grafana-https
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: re8ch-grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phonycenter-public
  namespace: voice-observability
  labels: {public.re8ch.com/external-dns: enabled}
