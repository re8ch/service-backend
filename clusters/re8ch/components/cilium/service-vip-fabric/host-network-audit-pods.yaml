apiVersion: v1
kind: Pod
metadata:
  name: re8ch-network-audit-a1
  namespace: kube-system
spec:
  nodeName: a1-wsl-zt
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: audit
      image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
      imagePullPolicy: Never
      command: [sleep, "900"]
      securityContext: {privileged: true}
      volumeMounts: [{name: host-root, mountPath: /host}]
  volumes: [{name: host-root, hostPath: {path: /, type: Directory}}]
