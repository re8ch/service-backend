apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: re8ch-service-vip-frr
spec:
  timers:
    connectRetryTimeSeconds: 3
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 30
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          networking.re8ch.com/advertisement: service-vip
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: re8ch-service-vip-a1
spec:
  nodeSelector:
    matchLabels: {kubernetes.io/hostname: a1-wsl-zt}
  bgpInstances:
    - name: service-vip
      localASN: 4250010147
      peers:
        - name: host-frr
          peerASN: 4200000073
          peerAddress: 10.181.22.73
          peerConfigRef: {name: re8ch-service-vip-frr}
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: re8ch-service-vip-b1
spec:
  nodeSelector:
    matchLabels: {kubernetes.io/hostname: b1-wsl-zt}
  bgpInstances:
    - name: service-vip
      localASN: 4250010125
      peers:
        - name: host-frr
          peerASN: 4200000073
          peerAddress: 10.181.22.73
          peerConfigRef: {name: re8ch-service-vip-frr}
---
