# Two Cilium Operator replicas with one elected leader across independent control planes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    # hostNetwork operator replicas reserve the same health ports. Roll one
    # replica at a time while the other remains available.
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    spec:
      nodeSelector: {kubernetes.io/os: linux}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [a1-wsl-zt, b1-wsl-zt, r640]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [r640]}
            - weight: 80
              preference:
                matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [b1-wsl-zt]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {io.cilium/app: operator, name: cilium-operator}
              topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cilium-operator
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels: {io.cilium/app: operator, name: cilium-operator}
