apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: advfab-worker-node-ips
  namespace: kube-system
spec:
  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
          - vm-20-12-ubuntu
          - suxunji
          - muaya-lightweight
          - muaya-ecs
          - zan
  defaults:
    # AdvFab node identities are /32s on loopback, so Cilium cannot infer a
    # direct-routing device after K3s adopts 10.250.0.x as its InternalIP.
    # Pin the primary private-transit leg while FRR retains route selection and
    # wg-pt-b1 remains the ECMP/failure-path peer.
    devices: wg-pt-a1,wg-pt-b1
    direct-routing-device: wg-pt-a1
    auto-direct-node-routes: "false"
    direct-routing-skip-unreachable: "false"
