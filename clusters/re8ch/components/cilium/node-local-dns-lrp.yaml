apiVersion: cilium.io/v2
kind: CiliumLocalRedirectPolicy
metadata:
  name: nodelocaldns
  namespace: kube-system
spec:
  redirectFrontend:
    serviceMatcher:
      serviceName: kube-dns
      namespace: kube-system
      toPorts:
        - {name: dns, port: "53", protocol: UDP}
        - {name: dns-tcp, port: "53", protocol: TCP}
  redirectBackend:
    localEndpointSelector:
      matchLabels:
        k8s-app: node-local-dns
    toPorts:
      - {name: dns, port: "53", protocol: UDP}
      - {name: dns-tcp, port: "53", protocol: TCP}
