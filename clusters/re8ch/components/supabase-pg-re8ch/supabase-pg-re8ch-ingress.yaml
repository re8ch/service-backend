apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-pg-re8ch-studio
  namespace: supabase-pg-re8ch
  annotations:
    external-dns.alpha.kubernetes.io/target: 1.14.174.244
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/gateway-section: supabase-https
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: advanced-fabric
  rules:
    - host: supabase.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: supabase-api-kong
                port:
                  number: 8000
