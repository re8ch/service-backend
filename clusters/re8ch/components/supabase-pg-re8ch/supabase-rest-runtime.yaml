apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-rest
  namespace: supabase-pg-re8ch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/component: rest }
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: supabase-pg-re8ch
        app.kubernetes.io/component: rest
    spec:
      nodeSelector: { kubernetes.io/hostname: restricted-node-6dc3f140f9 }
      tolerations:
        - { key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule }
      containers:
        - name: rest
          image: docker.io/postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: supabase-pg-re8ch-env }
            - secretRef: { name: supabase-pg-re8ch-secrets }
          env:
            - { name: PGRST_DB_URI, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: PGRST_DB_URI } } }
            - { name: PGRST_DB_ANON_ROLE, value: anon }
            - { name: PGRST_ADMIN_SERVER_PORT, value: "3001" }
            - { name: PGRST_ADMIN_SERVER_HOST, value: 127.0.0.1 }
            - { name: PGRST_JWT_SECRET, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: JWT_SECRET } } }
            - { name: PGRST_DB_USE_LEGACY_GUCS, value: "false" }
            - { name: PGRST_APP_SETTINGS_JWT_SECRET, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: JWT_SECRET } } }
            - { name: PGRST_APP_SETTINGS_JWT_EXP, valueFrom: { configMapKeyRef: { name: supabase-pg-re8ch-env, key: JWT_EXPIRY } } }
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 40m, memory: 128Mi }
            limits: { cpu: 100m, memory: 512Mi }
