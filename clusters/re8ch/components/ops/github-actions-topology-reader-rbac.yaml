apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-topology-reader
  namespace: ops
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [restricted-topology-context]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-topology-reader
  namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-actions-topology-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:credential-contract:node-observer
