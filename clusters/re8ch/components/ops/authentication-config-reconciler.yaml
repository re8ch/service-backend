apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: re8ch-authentication-config-reconciler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: re8ch-authentication-config-reconciler
    app.kubernetes.io/component: control-plane
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-authentication-config-reconciler
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-authentication-config-reconciler
        app.kubernetes.io/component: control-plane
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: reconciler
        image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
        - |
          source=/desired/dex-dual-issuer-authentication.yaml
          target=/host/dex-dual-issuer-authentication.yaml
          while true; do
            if ! cmp -s "$source" "$target"; then
              temporary="${target}.reconcile.$$"
              trap 'rm -f "$temporary"' EXIT INT TERM
              cp "$source" "$temporary"
              chmod 0600 "$temporary"
              mv -f "$temporary" "$target"
              trap - EXIT INT TERM
            fi
            sleep 30
          done
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - cmp -s /desired/dex-dual-issuer-authentication.yaml /host/dex-dual-issuer-authentication.yaml
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests: {cpu: 1m, memory: 4Mi}
          limits: {cpu: 20m, memory: 16Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: desired
          mountPath: /desired
          readOnly: true
        - name: host-authentication-config
          mountPath: /host
      terminationGracePeriodSeconds: 5
      volumes:
      - name: desired
        configMap:
          name: re8ch-kube-apiserver-authentication-config
      - name: host-authentication-config
        hostPath:
          path: /etc/rancher/k3s
          type: Directory
