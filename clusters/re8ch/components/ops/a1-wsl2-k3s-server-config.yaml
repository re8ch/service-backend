server: https://192.0.2.178:6443
token-file: /etc/rancher/k3s/server-token
data-dir: /var/lib/rancher/k3s-server-a1-wsl-zt
node-name: restricted-node-1eb0570f74
node-ip: 192.0.2.176
cluster-dns: 192.0.2.149
advertise-address: 192.0.2.242
tls-san:
  - 192.0.2.116
  - 192.0.2.242
  - 192.0.2.178
  - 192.0.2.176
  - 192.0.2.4
  - k3s-api.internal.re8ch.com
flannel-backend: none
disable-network-policy: true
write-kubeconfig-mode: "0644"
disable:
  - servicelb
  - coredns
embedded-registry: false
kubelet-arg:
  - "max-pods=1024"
node-label:
  - "pigsty.cc/provider=openstack-wsl"
  - "pigsty.cc/region=openstack"
  - "pigsty.cc/node-class=control-plane"
  - "pigsty.cc/workload=control-plane"
  - "pigsty.cc/zt-ip=192.0.2.176"
  - "re8ch.com/cilium-migrate=true"
  - "re8ch.com/control-route=wireguard-primary-zerotier-fallback"
  - "re8ch.com/external-ip-mode=none"
  - "re8ch.com/network-level=4"
  - "re8ch.com/public-control=none"
  - "re8ch.com/public-ip=none"
kube-apiserver-arg:
  - "event-ttl=1h"
  - "oidc-issuer-url=https://dex.re8ch.com"
  - "oidc-client-id=headlamp"
  - "oidc-username-claim=email"
  - "oidc-username-prefix=oidc:"
  - "oidc-groups-claim=groups"
  - "oidc-groups-prefix=oidc:"
# Advertise etcd membership on the node-owned AdvancedFabrics identity. Keep
# the ZeroTier identity listening during migration as a local rollback path.
etcd-arg:
  - "advertise-client-urls=https://192.0.2.242:2379"
  - "initial-advertise-peer-urls=https://192.0.2.242:2380"
  - "listen-client-urls=https://192.0.2.242:2379,https://192.0.2.176:2379,https://127.0.0.1:2379"
  - "listen-peer-urls=https://192.0.2.242:2380,https://192.0.2.176:2380,https://127.0.0.1:2380"
