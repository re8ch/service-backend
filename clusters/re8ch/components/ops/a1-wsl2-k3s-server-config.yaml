cluster-init: true
token-file: /etc/rancher/k3s/server-token
data-dir: /var/lib/rancher/k3s-server-a1-wsl-zt
node-name: a1-wsl-zt
node-ip: 10.250.0.147
node-taint:
  - "node-role.kubernetes.io/control-plane=true:NoSchedule"
cluster-dns: 10.43.65.40
advertise-address: 10.250.0.147
tls-san:
  - 10.250.0.1
  - 10.250.0.147
  - 10.181.22.128
  - 10.181.22.147
  - 10.181.22.125
  - k3s-api.internal.re8ch.com
  - kube-api.re8ch.com
flannel-backend: none
disable-network-policy: true
disable-scheduler: false
write-kubeconfig-mode: "0644"
disable:
  - servicelb
  - coredns
embedded-registry: false
etcd-snapshot-schedule-cron: "0 * * * *"
etcd-snapshot-retention: 24
etcd-snapshot-compress: true
kubelet-arg:
  # A1 is a 12 GiB embedded-etcd control-plane voter, not a general worker.
  # Leave room for a rolling ToolHive/ConnecTool cohort without advertising
  # unbounded kubelet, CNI and API-server watch capacity.
  - "max-pods=128"
  - "kube-reserved=cpu=2,memory=2Gi,ephemeral-storage=2Gi,pid=2048"
  - "system-reserved=cpu=1,memory=2Gi,ephemeral-storage=2Gi,pid=2048"
  - "enforce-node-allocatable=pods"
  - "eviction-hard=memory.available<2Gi,nodefs.available<10%,imagefs.available<15%,pid.available<10%"
node-label:
  - "pigsty.cc/provider=openstack-wsl"
  - "pigsty.cc/region=openstack"
  - "pigsty.cc/node-class=control-plane"
  - "pigsty.cc/workload=control-plane"
  - "pigsty.cc/zt-ip=10.181.22.147"
  - "re8ch.com/cilium-migrate=true"
  - "re8ch.com/control-route=wireguard-primary-zerotier-fallback"
  - "re8ch.com/external-ip-mode=none"
  - "re8ch.com/network-level=4"
  - "re8ch.com/public-control=none"
  - "re8ch.com/public-ip=none"
  - "scheduling.re8ch.com/node-profile=control-small"
kube-apiserver-arg:
  - "event-ttl=1h"
  - "authentication-config=/etc/rancher/k3s/dex-dual-issuer-authentication.yaml"
# K3s derives its expected embedded-etcd peer URL from node-ip, so both must
# use the node-owned AdvancedFabrics identity. The legacy client listener is
# retained for diagnostics; peer rollback restores this file and restarts K3s.
etcd-arg:
  - "advertise-client-urls=https://10.250.0.147:2379"
  - "initial-advertise-peer-urls=https://10.250.0.147:2380"
  - "listen-client-urls=https://10.250.0.147:2379,https://10.181.22.147:2379,https://127.0.0.1:2379"
  - "listen-peer-urls=https://10.250.0.147:2380,https://127.0.0.1:2380"
