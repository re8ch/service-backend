# Retired 2026-10-03 after R640 left etcd. Recovery reference only; never
# restart this server against its stale local etcd database.
node-name: r640
node-ip: 10.250.0.128
node-taint:
  - "node-role.kubernetes.io/control-plane=true:NoSchedule"
node-external-ip: 223.159.210.222
cluster-dns: 10.43.65.40
advertise-address: 10.250.0.128
tls-san:
  - 10.250.0.1
  - 10.250.0.128
  - 10.181.22.128
  - 192.168.88.251
  - k3s-api.internal.re8ch.com
flannel-backend: none
disable-network-policy: true
write-kubeconfig-mode: "0644"
node-label:
  - "pigsty.cc/workload=pg-re8ch"
  - "pigsty.cc/node-class=database"
  - "pigsty.cc/provider=onprem"
  - "pigsty.cc/region=r640-lan"
  - "pigsty.cc/zt-ip=10.181.22.128"
  - "networking.re8ch.com/geo=cn"
  - "topology.kubernetes.io/region=cn-hunan"
  - "topology.kubernetes.io/zone=hunan"
  - "re8ch.com/external-ip-mode=mikrotik-proxy"
  - "re8ch.com/public-ip=none"
  - "re8ch.com/numa-nodes=2"
  - "re8ch.com/cilium-migrate=true"
  - "scheduling.re8ch.com/node-profile=worker-large"
disable:
  - servicelb
  - coredns
kubelet-arg:
  - "max-pods=256"
  - "kube-reserved=cpu=2,memory=4Gi,ephemeral-storage=10Gi,pid=4096"
  - "system-reserved=cpu=2,memory=4Gi,ephemeral-storage=10Gi,pid=4096"
  - "enforce-node-allocatable=pods"
  - "eviction-hard=memory.available<4Gi,nodefs.available<10%,imagefs.available<15%,pid.available<10%"
kube-apiserver-arg:
  - "event-ttl=1h"
  - "authentication-config=/etc/rancher/k3s/dex-dual-issuer-authentication.yaml"
embedded-registry: false
cluster-init: true
etcd-arg:
  - "advertise-client-urls=https://10.250.0.128:2379"
  - "initial-advertise-peer-urls=https://10.250.0.128:2380"
  - "listen-client-urls=https://10.250.0.128:2379,https://10.181.22.128:2379,https://127.0.0.1:2379,https://192.168.88.251:2379"
  - "listen-peer-urls=https://10.250.0.128:2380,https://127.0.0.1:2380"
