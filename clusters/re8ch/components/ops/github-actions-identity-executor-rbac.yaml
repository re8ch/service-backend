apiVersion: v1
kind: ConfigMap
metadata:
  name: ssa-state-identity-access-telemetry-service-account
  namespace: egress-fabric
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
  labels:
    delivery.re8ch.com/state: accepted
    delivery.re8ch.com/authority-domain: identity-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: identity-access-telemetry-service-account
  namespace: egress-fabric
  labels:
    delivery.re8ch.com/rbac-profile: identity-access
rules:
- apiGroups: ['']
  resources: [serviceaccounts]
  resourceNames: [access-telemetry]
  verbs: [get, patch, update, delete]
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [ssa-state-identity-access-telemetry-service-account]
  verbs: [get, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: identity-access-telemetry-service-account
  namespace: egress-fabric
  labels:
    delivery.re8ch.com/rbac-profile: identity-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: identity-access-telemetry-service-account
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: re8ch:release-executor:identity-access
