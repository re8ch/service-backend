apiVersion: v1
kind: ServiceAccount
metadata: {name: paralus-helmrelease-retirement, namespace: flux-system}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: paralus-helmrelease-retirement, namespace: flux-system}
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    resourceNames: [paralus]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: paralus-helmrelease-retirement, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: paralus-helmrelease-retirement}
subjects:
  - {kind: ServiceAccount, name: paralus-helmrelease-retirement, namespace: flux-system}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: paralus-helmrelease-retirement
  namespace: flux-system
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: paralus-helmrelease-retirement
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: delete-retired-release
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              api=https://kubernetes.default.svc/apis/helm.toolkit.fluxcd.io/v2/namespaces/flux-system/helmreleases/paralus
              token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              code=$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}' \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                --header "Authorization: Bearer $token" \
                --request DELETE "$api")
              case "$code" in
                200|202|404) exit 0 ;;
                *) cat /tmp/response >&2; exit 1 ;;
              esac
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
