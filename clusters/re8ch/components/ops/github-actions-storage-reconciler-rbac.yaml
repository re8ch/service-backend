apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-reconciler-toolhive-system
  namespace: toolhive-system
  labels:
    delivery.re8ch.com/rbac-profile: data-storage-reconciler
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - ssa-state-main-data-storage-toolhive-system
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - toolhive.stacklok.dev
  resources:
  - mcpservers
  resourceNames:
  - cloud-disk-mcp
  verbs:
  - get
  - patch
  - update
