server: https://192.0.2.178:6443
token-file: /etc/rancher/k3s/server-token
data-dir: /var/lib/rancher/k3s-server-b1-wsl-zt
node-name: restricted-node-296f36f2fb
node-ip: 192.0.2.1
cluster-dns: 192.0.2.149
advertise-address: 192.0.2.1
tls-san:
  - 192.0.2.116
  - 192.0.2.1
  - 192.0.2.178
  - 192.0.2.176
  - 192.0.2.4
  - k3s-api.internal.re8ch.com
flannel-backend: none
disable-network-policy: true
write-kubeconfig-mode: "0644"
disable:
  - servicelb
  - coredns
embedded-registry: true
kubelet-arg:
  - "max-pods=256"
  - "kube-reserved=cpu=500m,memory=1Gi,ephemeral-storage=2Gi,pid=2048"
  - "system-reserved=cpu=500m,memory=1Gi,ephemeral-storage=2Gi,pid=2048"
  - "enforce-node-allocatable=pods"
  - "eviction-hard=memory.available<10%,nodefs.available<10%,imagefs.available<15%,pid.available<10%"
node-label:
  - "pigsty.cc/provider=openstack-wsl"
  - "pigsty.cc/region=openstack"
  - "pigsty.cc/node-class=control-plane"
  - "pigsty.cc/workload=control-plane"
  - "pigsty.cc/zt-ip=192.0.2.4"
  - "re8ch.com/cilium-migrate=true"
  - "re8ch.com/control-route=wireguard-primary-zerotier-fallback"
  - "re8ch.com/external-ip-mode=none"
  - "re8ch.com/network-level=4"
  - "re8ch.com/public-control=none"
  - "re8ch.com/public-ip=none"
  - "scheduling.re8ch.com/node-profile=control-small"
kube-apiserver-arg:
  - "event-ttl=1h"
  - "oidc-issuer-url=https://dex.re8ch.com"
  - "oidc-client-id=headlamp"
  - "oidc-username-claim=email"
  - "oidc-username-prefix=oidc:"
  - "oidc-groups-claim=groups"
  - "oidc-groups-prefix=oidc:"
# K3s derives its expected embedded-etcd peer URL from node-ip, so both must
# use the node-owned AdvancedFabrics identity. The legacy client listener is
# retained for diagnostics; peer rollback restores this file and restarts K3s.
etcd-arg:
  - "advertise-client-urls=https://192.0.2.1:2379"
  - "initial-advertise-peer-urls=https://192.0.2.1:2380"
  - "listen-client-urls=https://192.0.2.1:2379,https://192.0.2.4:2379,https://127.0.0.1:2379"
  - "listen-peer-urls=https://192.0.2.1:2380,https://127.0.0.1:2380"
