apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-actions-node-observer
  labels: {operations.re8ch.com/credential-contract: node-observer}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [alerts, providers, receivers]
    verbs: [get, list]
  - nonResourceURLs: [/api, /api/*, /apis, /apis/*, /version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-node-observer
  labels: {operations.re8ch.com/credential-contract: node-observer}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-actions-node-observer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: re8ch:credential-contract:node-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-flux-observer
  namespace: flux-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
---
