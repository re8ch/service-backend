apiVersion: v1
kind: ConfigMap
metadata:
  name: re8ch-release-state-api-conformance-runner-projection
  namespace: api-conformance-runners
  labels:
    delivery.re8ch.com/state: accepted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-executor-api-conformance-canary
  namespace: api-conformance-runners
  labels: {delivery.re8ch.com/rbac-profile: active-canary}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames:
      - api-conformance-runner-projection-contract
      - re8ch-release-state-api-conformance-runner-projection
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-executor-api-conformance-canary
  namespace: api-conformance-runners
  labels: {delivery.re8ch.com/rbac-profile: active-canary}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-executor-api-conformance-canary
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: re8ch:release-executor:api-conformance
---
# Reserved profiles have no binding. A later reviewed domain cutover binds one
# profile in one namespace and narrows names through admission/contract policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: re8ch-release-executor-workload-reserved
  labels: {delivery.re8ch.com/rbac-profile: reserved-unbound}
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [policy, autoscaling]
    resources: [poddisruptionbudgets, horizontalpodautoscalers]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: re8ch-release-executor-network-policy-reserved
  labels: {delivery.re8ch.com/rbac-profile: reserved-unbound}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: re8ch-release-executor-namespaced-rbac-reserved
  labels: {delivery.re8ch.com/rbac-profile: reserved-unbound}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, patch, update, delete]
