apiVersion: v1
kind: ServiceAccount
metadata: {name: retire-unused-observable-ontology, namespace: flux-system}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: retire-unused-observable-ontology, namespace: observable}
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [observable-postgrest]
  verbs: [get, delete]
- apiGroups: [""]
  resources: [services]
  resourceNames: [observable-postgrest]
  verbs: [get, delete]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  resourceNames: [observable-postgrest]
  verbs: [get, delete]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  resourceNames: [observable-postgrest]
  verbs: [get, delete]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  resourceNames: [observable-postgrest-ro, observable-postgrest-rw]
  verbs: [get, delete]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [ssa-state-main-data-storage-observable]
  verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: retire-unused-observable-ontology, namespace: observable}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: retire-unused-observable-ontology}
subjects:
- {kind: ServiceAccount, name: retire-unused-observable-ontology, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: retire-unused-observable-ontology, namespace: re8ch-ontology-microscope}
rules:
- apiGroups: [apps]
  resources: [deployments]
  resourceNames: [ontology-microscope, ontology-microscope-adapter, ontology-microscope-evaluation-worker, ontology-microscope-neuronpedia]
  verbs: [get, delete]
- apiGroups: [apps]
  resources: [statefulsets]
  resourceNames: [ontology-microscope-neo4j, ontology-neuronpedia-postgres]
  verbs: [get, delete]
- apiGroups: [""]
  resources: [services]
  resourceNames: [ontology-microscope, ontology-microscope-adapter, ontology-microscope-neo4j, ontology-microscope-neuronpedia, ontology-neuronpedia-postgres]
  verbs: [get, delete]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  resourceNames: [ontology-microscope]
  verbs: [get, delete]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  resourceNames: [ontology-microscope-adapter-egress, ontology-microscope-evaluation-worker, ontology-microscope-neo4j, ontology-microscope-neuronpedia-public-ingress, ontology-microscope-public-ingress]
  verbs: [get, delete]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [ontology-microscope-auth-proxy, ontology-microscope-neuronpedia-auth-proxy, ssa-state-main-delivery-products-re8ch-ontology-microscope]
  verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: retire-unused-observable-ontology, namespace: re8ch-ontology-microscope}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: retire-unused-observable-ontology}
subjects:
- {kind: ServiceAccount, name: retire-unused-observable-ontology, namespace: flux-system}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: retire-unused-observable-ontology-v1
  namespace: flux-system
  annotations:
    governance.re8ch.com/change: retire-unused-observable-ontology
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {app.kubernetes.io/name: retire-unused-observable-ontology}}
    spec:
      serviceAccountName: retire-unused-observable-ontology
      restartPolicy: OnFailure
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - &kubectlStep
        name: delete-observable-runtime
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        command: [kubectl]
        args: [--namespace, observable, delete, deployment,service,horizontalpodautoscaler,poddisruptionbudget, observable-postgrest, --ignore-not-found=true, --wait=true]
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
        securityContext: &securityContext {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      - <<: *kubectlStep
        name: delete-observable-routes
        args: [--namespace, observable, delete, httproute, observable-postgrest-ro, observable-postgrest-rw, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-deployments
        args: [--namespace, re8ch-ontology-microscope, delete, deployment, ontology-microscope, ontology-microscope-adapter, ontology-microscope-evaluation-worker, ontology-microscope-neuronpedia, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-statefulsets
        args: [--namespace, re8ch-ontology-microscope, delete, statefulset, ontology-microscope-neo4j, ontology-neuronpedia-postgres, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-services
        args: [--namespace, re8ch-ontology-microscope, delete, service, ontology-microscope, ontology-microscope-adapter, ontology-microscope-neo4j, ontology-microscope-neuronpedia, ontology-neuronpedia-postgres, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-route
        args: [--namespace, re8ch-ontology-microscope, delete, httproute, ontology-microscope, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-policies
        args: [--namespace, re8ch-ontology-microscope, delete, ciliumnetworkpolicy, ontology-microscope-adapter-egress, ontology-microscope-evaluation-worker, ontology-microscope-neo4j, ontology-microscope-neuronpedia-public-ingress, ontology-microscope-public-ingress, --ignore-not-found=true, --wait=true]
      - <<: *kubectlStep
        name: delete-ontology-control-state
        args: [--namespace, re8ch-ontology-microscope, delete, configmap, ontology-microscope-auth-proxy, ontology-microscope-neuronpedia-auth-proxy, ssa-state-main-delivery-products-re8ch-ontology-microscope, --ignore-not-found=true, --wait=true]
      containers:
      - <<: *kubectlStep
        name: delete-retired-control-state
        args: [--namespace, observable, delete, configmap, ssa-state-main-data-storage-observable, --ignore-not-found=true, --wait=true]
