apiVersion: apps/v1
kind: Deployment
metadata: {name: harbor-credential-broker, namespace: credential-broker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: harbor-credential-broker}}
  template:
    metadata: {labels: {app: harbor-credential-broker}}
    spec:
      serviceAccountName: credential-broker
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      imagePullSecrets: [{name: harbor-registry-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: broker
          image: registry.re8ch.com/image/re8ch-ai-operations:0.1.19@sha256:70f310d32c30209c0bef0598707bbcbd4bd7000b4136302ff15d17120eeb330f
          imagePullPolicy: IfNotPresent
          env:
            - {name: RE8CH_TOOL_PROFILE, value: tenant}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-harbor-tenant}
            - {name: ALLOW_AUTHENTICATED_DEX, value: "true"}
            - {name: PUBLIC_ORIGIN, value: "https://tools.re8ch.com"}
            - {name: PUBLIC_MCP_URL, value: "https://tools.re8ch.com/harbor-tenant/mcp"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://tools.re8ch.com/.well-known/oauth-protected-resource/harbor-tenant/mcp"}
            - {name: DEVICE_REGISTRY_PATH, value: /var/lib/re8ch-ai-operations/devices.db}
            - {name: CREDENTIAL_NAMESPACE, value: credential-broker}
            - {name: HARBOR_TENANTS_PATH, value: /etc/re8ch-ai-operations/harbor-tenants.json}
          ports: [{name: http, containerPort: 19443}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: registry, mountPath: /var/lib/re8ch-ai-operations}
            - {name: harbor-tenants, mountPath: /etc/re8ch-ai-operations/harbor-tenants.json, subPath: harbor-tenants.json, readOnly: true}
      volumes:
        - {name: registry, persistentVolumeClaim: {claimName: credential-broker-registry}}
        - {name: harbor-tenants, configMap: {name: harbor-tenant-catalog}}
---
apiVersion: v1
kind: Service
metadata: {name: harbor-credential-broker, namespace: credential-broker}
spec: {selector: {app: harbor-credential-broker}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: harbor-credential-broker, namespace: credential-broker}
spec:
  hostnames: [tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-https}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /harbor-tenant}}]
      backendRefs: [{name: harbor-credential-broker, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /credentials/redeem}}]
      backendRefs: [{name: harbor-credential-broker, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /credentials/adopt}}]
      backendRefs: [{name: harbor-credential-broker, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/harbor-tenant}}]
      backendRefs: [{name: harbor-credential-broker, port: 80}]
