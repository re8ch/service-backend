apiVersion: apps/v1
kind: Deployment
metadata: {name: cloud-platform-tool, namespace: ai-operations}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector: {matchLabels: {app: cloud-platform-tool}}
  template:
    metadata: {labels: {app: cloud-platform-tool, re8ch.com/tool-plane: cloud}}
    spec:
      serviceAccountName: ai-operations
      automountServiceAccountToken: false
      imagePullSecrets: [{name: harbor-registry-pull}]
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: cloud-platform-tool}}
              topologyKey: kubernetes.io/hostname
      securityContext: {fsGroup: 100, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          image: ghcr.io/re8ch/re8ch-ai-operations:0.1.12@sha256:0f5fde1a0baed6f5590472f41485ccfe73d9437d5c4c9f9683b259a16840f7dc
          imagePullPolicy: IfNotPresent
          env:
            - {name: RE8CH_TOOL_PROFILE, value: all}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-ai-tools}
            - {name: ALLOW_AUTHENTICATED_DEX, value: "true"}
            - {name: PUBLIC_ORIGIN, value: "https://tools.re8ch.com"}
            - {name: PUBLIC_MCP_URL, value: "https://tools.re8ch.com/cloud/mcp"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://tools.re8ch.com/.well-known/oauth-protected-resource/mcp"}
            - {name: INFRA_EXEC_NODE, value: restricted-node-1eb0570f74}
            - {name: TEABLE_BASE_URL, value: "https://teable.re8ch.com"}
            - {name: LITELLM_BASE_URL, value: "https://litellm.re8ch.com"}
            - {name: OPENSANDBOX_BASE_URL, value: "http://opensandbox-orchestra-proxy.opensandbox-system.svc.cluster.local:8080"}
            - {name: GH_TOKEN, valueFrom: {secretKeyRef: {name: github-native-auth, key: token, optional: true}}}
            - {name: KAGENT_BASE_URL, value: "http://kagent-controller.kagent.svc.cluster.local:8083"}
            - {name: CODEX_BASE_URL, value: "http://codex-app-server.codex-app-server.svc.cluster.local:4500"}
            - {name: DEVICE_REGISTRY_PATH, value: /var/lib/re8ch-ai-operations/devices.db}
            - {name: CAPSULE_POLICY_PATH, value: /etc/re8ch-ai-operations/capsule-policy.json}
            - {name: CAPSULE_POLICY_REVISION, value: "1"}
            - name: CAPSULE_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: ops-capsule-signing, key: signing-key}}
          ports: [{name: http, containerPort: 19443}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, failureThreshold: 6}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: registry, mountPath: /var/lib/re8ch-ai-operations}
            - {name: inventory, mountPath: /etc/re8ch-ai-operations/nodes.json, subPath: nodes.json, readOnly: true}
            - {name: capsule-policy, mountPath: /etc/re8ch-ai-operations/capsule-policy.json, subPath: policy.json, readOnly: true}
            - {name: runtime, mountPath: /etc/re8ch-ai-operations/kubeconfigs/re8ch.yaml, subPath: kubeconfig-re8ch.yaml, readOnly: true}
            - {name: runtime, mountPath: /etc/re8ch-ai-operations/ssh_config, subPath: ssh-config, readOnly: true}
            - {name: runtime, mountPath: /etc/re8ch-ai-operations/id_ed25519, subPath: id_ed25519, readOnly: true}
      volumes:
        - {name: registry, persistentVolumeClaim: {claimName: cloud-device-registry}}
        - {name: inventory, configMap: {name: ai-operations-inventory}}
        - {name: capsule-policy, configMap: {name: ops-capsule-policy}}
        - name: runtime
          secret:
            secretName: cloud-platform-runtime
            defaultMode: 256
            items:
              - {key: kubeconfig-re8ch.yaml, path: kubeconfig-re8ch.yaml}
              - {key: ssh-config, path: ssh-config}
              - {key: id_ed25519, path: id_ed25519}
---
