apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steel-browser-data
  namespace: ai-operations
  labels:
    app.kubernetes.io/name: steel-browser
    app.kubernetes.io/component: steel-runtime
    app.kubernetes.io/part-of: agent-workspace
    browser.re8ch.com/profile-id: default
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs-r640
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steel-browser
  namespace: ai-operations
  labels:
    app.kubernetes.io/name: steel-browser
    app.kubernetes.io/component: steel-runtime
    app.kubernetes.io/part-of: agent-workspace
    browser.re8ch.com/profile-id: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: steel-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steel-browser
        app.kubernetes.io/component: steel-runtime
        app.kubernetes.io/part-of: agent-workspace
        browser.re8ch.com/profile-id: default
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: clear-stale-profile-lock
          image: ghcr.io/steel-dev/steel-browser-api:latest@sha256:21142907c6f9c4eb671defc9c722ee68e2be48a3490a30f12405f181f61ca0f4
          command:
            - sh
            - -lc
            - rm -f /profile/SingletonLock /profile/SingletonCookie /profile/SingletonSocket
          volumeMounts:
            - {name: data, mountPath: /profile, subPath: profiles/default}
      containers:
        - name: steel-browser-api
          image: ghcr.io/steel-dev/steel-browser-api:latest@sha256:21142907c6f9c4eb671defc9c722ee68e2be48a3490a30f12405f181f61ca0f4
          imagePullPolicy: IfNotPresent
          env:
            - name: DOMAIN
              value: browser.re8ch.com
            - name: CDP_DOMAIN
              value: steel-browser.ai-operations.svc.cluster.local:9223
            - name: USE_SSL
              value: "true"
            - name: LOG_STORAGE_ENABLED
              value: "true"
            - name: LOG_STORAGE_PATH
              value: /data/logs/browser-logs.duckdb
            # The current upstream fingerprint generator cannot produce a
            # consistent fingerprint on this Linux/Chromium combination.
            # Steel explicitly supports skipping injection; session/CDP
            # lifecycle remains fully managed by Steel.
            - name: SKIP_FINGERPRINT_INJECTION
              value: "true"
          ports:
            - {name: api, containerPort: 3000, protocol: TCP}
            - {name: cdp, containerPort: 9223, protocol: TCP}
          readinessProbe:
            httpGet: {path: /v1/health, port: api}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet: {path: /v1/health, port: api}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "6", memory: 10Gi}
          volumeMounts:
            - {name: data, mountPath: /app/.cache, subPath: cache}
            # Steel OSS currently normalizes all persistent sessions to this
            # fixed directory. Mount the directory itself so Chromium identity
            # survives Pod recreation.
            - {name: data, mountPath: /app/api/user-data-dir, subPath: profiles/default}
            - {name: data, mountPath: /data/logs, subPath: logs}
            - {name: data, mountPath: /tmp/steel-browser-exports, subPath: exports}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: steel-browser-data}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: steel-browser
  namespace: ai-operations
  labels:
    app.kubernetes.io/name: steel-browser
    app.kubernetes.io/component: steel-runtime
    app.kubernetes.io/part-of: agent-workspace
    browser.re8ch.com/profile-id: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: steel-browser
  ports:
    - {name: api, port: 3000, targetPort: api, protocol: TCP}
    - {name: cdp, port: 9223, targetPort: cdp, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: steel-browser
  namespace: ai-operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steel-browser
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-operations
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cube-trial
      ports:
        - {port: 3000, protocol: TCP}
        - {port: 9223, protocol: TCP}
