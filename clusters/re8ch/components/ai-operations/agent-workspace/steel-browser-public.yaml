apiVersion: v1
kind: ConfigMap
metadata:
  name: steel-browser-gateway
  namespace: ai-operations
data:
  default.conf: |
    server {
      listen 8080;
      client_max_body_size 100m;

      location ~ ^/(v1|files|documentation)(/|$) {
        proxy_pass http://steel-browser:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
      }

      location / {
        error_page 418 = @steel_websocket;
        if ($http_upgrade != "") { return 418; }
        proxy_pass http://steel-browser-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
      }

      location @steel_websocket {
        proxy_pass http://steel-browser:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steel-browser-ui
  namespace: ai-operations
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: steel-browser-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: steel-browser-ui, app.kubernetes.io/part-of: agent-workspace}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: ui
          image: ghcr.io/steel-dev/steel-browser-ui:latest@sha256:d866fe57ec8a883bcedc930d533141ee628d857d570abed72358c140806b07b2
          env:
            - {name: API_URL, value: "https://browser.service.re8ch.com"}
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: steel-browser-ui, namespace: ai-operations}
spec:
  selector: {app.kubernetes.io/name: steel-browser-ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steel-browser-gateway
  namespace: ai-operations
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: steel-browser-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: steel-browser-gateway, app.kubernetes.io/part-of: agent-workspace}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: nginx
          image: nginx:1.29.0-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: steel-browser-gateway}
---
apiVersion: v1
kind: Service
metadata: {name: steel-browser-gateway, namespace: ai-operations}
spec:
  selector: {app.kubernetes.io/name: steel-browser-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-steel
  namespace: ai-operations
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: oauth2-proxy-steel}
  template:
    metadata:
      labels: {app.kubernetes.io/name: oauth2-proxy-steel, app.kubernetes.io/part-of: agent-workspace}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://dex.service.re8ch.com
            - --redirect-url=https://browser.service.re8ch.com/oauth2/callback
            - --upstream=http://steel-browser-gateway:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            # Dex still enforces membership in the configured re8ch GitHub org.
            # Steel does not authorize by team, so avoid requesting the groups
            # claim and the extra GitHub teams API dependency.
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
          envFrom:
            - secretRef: {name: oauth2-proxy-steel}
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: oauth2-proxy-steel, namespace: ai-operations}
spec:
  selector: {app.kubernetes.io/name: oauth2-proxy-steel}
  ports: [{name: http, port: 4180, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steel-browser
  namespace: ai-operations
  labels:
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/hostname: browser.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  # HTTP is served by ai-operations/steel-browser-public via Cilium Gateway.
  # Retain this object only as the DNS publication authority.
  ingressClassName: external-dns-only
  rules:
    - host: browser.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: oauth2-proxy-steel, port: {number: 4180}}
