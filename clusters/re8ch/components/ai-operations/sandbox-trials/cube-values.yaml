# CubeSandbox qualification runtime. The chart source is pinned by
# cube-source.yaml; credentials are injected from cube-trial-secret by the
# HelmRelease and must never be added here.
global:
  timezone: Asia/Shanghai

# Bind all chart-managed durable state to the existing Rook/CephFS fabric.
persistence:
  storageClassName: cephfs-re8ch

placement:
  controlPlane:
    nodeSelector:
      kubernetes.io/hostname: restricted-node-6dc3f140f9
      cube.tencent.com/cube-control: "true"
    tolerations: []
  compute:
    nodeSelector:
      kubernetes.io/hostname: restricted-node-6dc3f140f9
      cube.tencent.com/cube-node: "true"
    tolerations: []
  # Kept deliberately unmatched. The trial must never install a host kernel.
  pvm:
    nodeSelector:
      cube.tencent.com/allow-pvm-bootstrap: "disabled-for-trial"
    tolerations: []

cubeNode:
  podAnnotations:
    cube.re8ch.com/cubelet-hostport: "9999"
    re8ch.com/cube-router-mode: linux-routing-stack
  pvmGuestKernel:
    enabled: false
  network:
    # Separate from the K3s 10.42/16 Pod and 10.43/16 Service ranges.
    cidr: 192.0.2.33/18
    # v0.6.0 does not expose cube-router as a native Helm value. Apply
    # cube-router-daemonset.patch.yaml after each Helm install or upgrade.

cubeProxy:
  enabled: true
  domain: cube-trial.internal
  configureClusterDNS: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 1, memory: 512Mi}

controlPlane:
  master:
    # Upstream v0.6.0 prints the complete effective config on startup. Keep the
    # pinned binary behind a narrow stdout filter until the source fix lands in
    # a released image; all other output and the original exit status survive.
    command: [/bin/bash, -c]
    args:
      - |
        fifo=/tmp/cube-master.stdout
        rm -f "$fifo"
        mkfifo "$fifo"
        sed -u '/^cfg:/d' <"$fifo" &
        filter_pid=$!
        /usr/local/services/cubetoolbox/CubeMaster/bin/cubemaster >"$fifo" 2>&1 &
        master_pid=$!
        terminate() {
          kill -TERM "$master_pid" 2>/dev/null || true
          wait "$master_pid"
        }
        trap terminate TERM INT
        wait "$master_pid"
        status=$?
        wait "$filter_pid" || true
        exit "$status"
    env:
      - {name: HTTP_PROXY, value: "http://192.0.2.178:17891"}
      - {name: HTTPS_PROXY, value: "http://192.0.2.178:17891"}
      - {name: http_proxy, value: "http://192.0.2.178:17891"}
      - {name: https_proxy, value: "http://192.0.2.178:17891"}
      - name: NO_PROXY
        value: "127.0.0.1,localhost,::1,.re8ch.com,.svc,.svc.cluster.local,.cluster.local,192.0.2.183/8,192.0.2.57/16,192.0.2.205/16,192.0.2.81/10,192.0.2.33/12,192.0.2.136/16"
      - name: no_proxy
        value: "127.0.0.1,localhost,::1,.re8ch.com,.svc,.svc.cluster.local,.cluster.local,192.0.2.183/8,192.0.2.57/16,192.0.2.205/16,192.0.2.81/10,192.0.2.33/12,192.0.2.136/16"
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 2, memory: 2Gi}
  api:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 1, memory: 512Mi}

cubemastercli:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}

webui:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}

cubeOps:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 1, memory: 512Mi}

lifecycleManager:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 500m, memory: 256Mi}

bootstrap:
  pvmHostKernel:
    enabled: false
  nodeInit:
    dataCubelet:
      loopback:
        enabled: true
        imagePath: /data/cubelet-xfs.img
        size: 25G

# Trial credentials are injected at render/apply time and are never committed.
mysql:
  persistence:
    storageClassName: cephfs-re8ch
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 2, memory: 2Gi}
redis:
  persistence:
    storageClassName: cephfs-re8ch
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 1, memory: 512Mi}
