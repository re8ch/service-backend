apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-webui-terminal-dist
  namespace: cube-trial
  labels:
    app.kubernetes.io/name: cube-webui-terminal
    app.kubernetes.io/part-of: cube-sandbox
binaryData:
  dist.tar.gz: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-trial-webui-config
  namespace: cube-trial
  labels:
    app.kubernetes.io/component: webui
    app.kubernetes.io/instance: cube-trial
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cube
data:
  nginx.conf: |
    worker_processes auto;
    
    events {
        worker_connections 1024;
    }
    
    http {
        include /usr/local/openresty/nginx/conf/mime.types;
        default_type application/octet-stream;
    
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
    
        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/xml;
    
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }
    
        server {
            listen 80;
            server_name _;
    
            root /usr/share/nginx/html;
            index index.html;
    
            location = /cubeapi {
                return 308 /cubeapi/;
            }
            location ^~ /sandbox/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 7206s;
                proxy_send_timeout 7206s;
    
                proxy_pass http://cube-trial-proxy.cube-trial.svc.cluster.local:80;
            }
    
            location /opsapi/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                proxy_pass http://cube-trial-ops.cube-trial.svc.cluster.local:3010/api/;
            }

            # Validate the browser JWT without exposing the CubeAPI admin key.
            location = /__cube_connect_auth {
                internal;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                proxy_set_header Authorization $http_authorization;
                proxy_pass http://cube-trial-ops.cube-trial.svc.cluster.local:3010/api/v1/sdk/v2/sandboxes?limit=1;
            }

            # CubeOps v0.6.0 forwards connect to CubeMaster's removed legacy
            # route. Authenticate with CubeOps, then use CubeAPI's compatible
            # implementation with the server-mounted admin key.
            location ~ ^/sandboxes/[^/]+/connect$ {
                auth_request /__cube_connect_auth;
                access_by_lua_block {
                    local file = assert(io.open("/var/run/secrets/cube-api/admin-token", "r"))
                    local token = file:read("*a")
                    file:close()
                    token = token:gsub("%s+$", "")
                    ngx.req.clear_header("Authorization")
                    ngx.req.set_header("X-API-Key", token)
                }
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
                proxy_pass http://cube-trial-api.cube-trial.svc.cluster.local:3000;
            }

            location /cubeapi/v1/ {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                rewrite ^/cubeapi/v1/(.*)$ /api/v1/sdk/$1 break;
                proxy_pass http://cube-trial-ops.cube-trial.svc.cluster.local:3010;
            }
    
            location = /health {
                proxy_pass http://cube-trial-ops.cube-trial.svc.cluster.local:3010/health;
            }
    
            location ~ ^/(sandboxes|v2/sandboxes|templates|snapshots) {
                if ($http_authorization = "") {
                    return 418;
                }
                add_header Vary "Authorization" always;
                add_header Cache-Control "no-store" always;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_send_timeout 300s;
    
                rewrite ^/(.*)$ /api/v1/sdk/$1 break;
                proxy_pass http://cube-trial-ops.cube-trial.svc.cluster.local:3010;
            }
    
            error_page 418 = @spa_fallback;
            location @spa_fallback {
                root /usr/share/nginx/html;
                try_files /index.html =404;
                add_header Vary "Authorization" always;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            }
    
            location /assets/ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
    
            location / {
                try_files $uri $uri/ /index.html;
            }
        }
    }
