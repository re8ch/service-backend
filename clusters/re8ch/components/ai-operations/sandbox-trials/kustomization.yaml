apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cube-source.yaml
  # cube-release.yaml remains staged until cube-trial-secret is provisioned.
  # Reconciling a HelmRelease with absent credential inputs permanently marks
  # the release failed and pollutes the active platform health signal.
  - cube-public-gateway.yaml
configMapGenerator:
  - name: cube-trial-values
    namespace: cube-trial
    files:
      - values.yaml=cube-values.yaml
generatorOptions:
  disableNameSuffixHash: true
