apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cube-source.yaml
  - cube-release.yaml
  - cube-public-gateway.yaml
configMapGenerator:
  - name: cube-trial-values
    namespace: cube-trial
    files:
      - values.yaml=cube-values.yaml
generatorOptions:
  disableNameSuffixHash: true
