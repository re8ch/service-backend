apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cube-trial
  namespace: cube-trial
  labels:
    app.kubernetes.io/part-of: cube-sandbox
spec:
  interval: 30m
  timeout: 10m
  releaseName: cube-trial
  chart:
    spec:
      chart: ./deploy/kubernetes/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cubesandbox
        namespace: flux-system
      interval: 24h
  install:
    disableTakeOwnership: false
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: cube-trial-values
      valuesKey: values.yaml
    - kind: Secret
      name: cube-trial-secret
      valuesKey: mysql-password
      targetPath: mysql.password
    - kind: Secret
      name: cube-trial-secret
      valuesKey: mysql-root-password
      targetPath: mysql.rootPassword
    - kind: Secret
      name: cube-trial-secret
      valuesKey: redis-password
      targetPath: redis.password
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: cube-trial-node
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: cube-trial-node
              spec:
                template:
                  metadata:
                    annotations:
                      cube.re8ch.com/cubelet-hostport: "9999"
                      re8ch.com/cube-router-mode: linux-routing-stack
                  spec:
                    containers:
                      - name: network-agent
                        command:
                          - /usr/bin/tini
                          - -s
                          - --
                          - /bin/bash
                          - -ec
                          - |
                            cfg=/usr/local/services/cubetoolbox/Cubelet/config/config.toml
                            sentinel=/usr/local/services/cubetoolbox/.staged-cubelet
                            until test -f "${sentinel}" && test -f "${cfg}"; do sleep 1; done
                            sed -i -E \
                              -e 's|^([[:space:]]*)cube_router_enable = .*|\1cube_router_enable = true|' \
                              -e 's|^([[:space:]]*)cube_router_cidr = .*|\1cube_router_cidr = ""|' \
                              "${cfg}"
                            grep -qE '^[[:space:]]*cube_router_enable = true$' "${cfg}"
                            exec /usr/local/bin/component-entrypoint.sh
                        env:
                          - name: CUBE_SANDBOX_NETWORK_CIDR
                            value: ""
                          - name: CUBE_SANDBOX_CUBE_ROUTER_ENABLE
                            value: "1"
                      - name: cubelet
                        ports:
                          - name: cubelet-grpc
                            containerPort: 9999
                            hostPort: 9999
                            protocol: TCP
                        command:
                          - /usr/bin/tini
                          - -s
                          - --
                          - /bin/bash
                          - -ec
                          - |
                            cfg=/opt/cube-image/Cubelet/config/config.toml
                            sed -i -E \
                              -e 's|^([[:space:]]*)cidr = .*|\1cidr = "192.0.2.179/18"|' \
                              -e 's|^([[:space:]]*)cube_router_enable = .*|\1cube_router_enable = true|' \
                              -e 's|^([[:space:]]*)cube_router_cidr = .*|\1cube_router_cidr = ""|' \
                              "${cfg}"
                            set +e
                            /usr/local/bin/component-entrypoint.sh
                            rc=$?
                            pid="$(pidof cubelet 2>/dev/null | awk '{print $1}' || true)"
                            if test -n "${pid}" && kill -0 "${pid}" 2>/dev/null \
                              && ss -lntp 2>/dev/null | grep -q ':9999'; then
                              printf '%s\n' "${pid}" >/run/cube-node/cubelet.pid
                              cleanup() { kill -TERM "${pid}" 2>/dev/null || true; }
                              trap cleanup TERM INT HUP EXIT
                              while kill -0 "${pid}" 2>/dev/null; do sleep 10; done
                              exit 1
                            fi
                            exit "${rc}"
                        env:
                          - name: CUBE_SANDBOX_NETWORK_CIDR
                            value: ""
                          - name: CUBE_SANDBOX_CUBE_ROUTER_ENABLE
                            value: "1"
                      - name: cube-egress-net
                        env:
                          - name: CUBE_SANDBOX_NETWORK_CIDR
                            value: 192.0.2.179/18
