apiVersion: v1
kind: ServiceAccount
metadata: {name: retire-tenantgrant-crd, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: retire-tenantgrant-crd}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [tenantgrants.tenancy.re8ch.com]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: retire-tenantgrant-crd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: retire-tenantgrant-crd}
subjects: [{kind: ServiceAccount, name: retire-tenantgrant-crd, namespace: flux-system}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: retire-tenantgrant-crd
  namespace: flux-system
  annotations: {governance.re8ch.com/change: retire-tenantgrant-after-runtime-rollout}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata: {labels: {app.kubernetes.io/name: retire-tenantgrant-crd}}
    spec:
      serviceAccountName: retire-tenantgrant-crd
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: restricted-node-1eb0570f74}
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command: [kubectl]
          args: [delete, customresourcedefinition, tenantgrants.tenancy.re8ch.com, --ignore-not-found=true, --wait=false]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
