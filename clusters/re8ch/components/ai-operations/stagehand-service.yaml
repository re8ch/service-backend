apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagehand-service
  namespace: ai-operations
  labels: {app.kubernetes.io/name: stagehand-service, app.kubernetes.io/part-of: agent-workspace}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: stagehand-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stagehand-service, app.kubernetes.io/part-of: agent-workspace}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {kubernetes.io/hostname: r640}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      imagePullSecrets: [{name: ghcr-re8ch}]
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: stagehand-service
          image: ghcr.io/re8ch/stagehand-service@sha256:3e7a39dc30d4286e6c9795a04f76bc2c793bd4117b9cf96f83dc8f9a0c6765bb
          imagePullPolicy: IfNotPresent
          env:
            - {name: PORT, value: "8080"}
            - {name: STAGEHAND_MODEL, value: openai/kimi-k2-5}
            - {name: LITELLM_BASE_URL, value: "http://litellm.llm-gateway.svc.cluster.local:4000/v1"}
            - {name: STEEL_URL, value: "http://steel-browser.ai-operations.svc.cluster.local:3000"}
            - {name: STEEL_INTERNAL_HOST, value: "steel-browser.ai-operations.svc.cluster.local:3000"}
            # Reuse the existing scoped virtual key for both upstream inference
            # and private API authentication; no provider credential enters this Pod.
            - {name: LITELLM_API_KEY, valueFrom: {secretKeyRef: {name: cluster-infra-litellm, key: LITELLM_API_TOKEN}}}
            - {name: STAGEHAND_API_TOKEN, valueFrom: {secretKeyRef: {name: cluster-infra-litellm, key: LITELLM_API_TOKEN}}}
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 4}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: stagehand-service
  namespace: ai-operations
  labels: {app.kubernetes.io/name: stagehand-service, app.kubernetes.io/part-of: agent-workspace}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: stagehand-service}
  ports: [{name: http, port: 8080, targetPort: http, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: stagehand-service, namespace: ai-operations}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: stagehand-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-operations}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: toolhive-system}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-operations}}
          podSelector: {matchLabels: {app.kubernetes.io/name: steel-browser}}
      ports: [{port: 3000, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: llm-gateway}}
          podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}
      ports: [{port: 4000, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
