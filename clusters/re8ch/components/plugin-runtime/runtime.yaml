apiVersion: apps/v1
kind: Deployment
metadata:
  name: re8ch-plugin-runtime
  namespace: toolhive-system
  labels: {app.kubernetes.io/name: re8ch-plugin-runtime, app.kubernetes.io/part-of: toolhive}
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector: {matchLabels: {app.kubernetes.io/name: re8ch-plugin-runtime}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: re8ch-plugin-runtime, app.kubernetes.io/part-of: toolhive}
    spec:
      serviceAccountName: re8ch-plugin-runtime
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: re8ch-plugin-runtime}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: runtime
          image: registry.re8ch.com/functions-shared/re8ch-plugin-runtime:0.1.2@sha256:0bea8e03f713181d4f497283941d232607c6377f175c7cd1f2ad16613b5d0c54
          imagePullPolicy: IfNotPresent
          env:
            - {name: LISTEN_PORT, value: "8088"}
            - {name: PLUGIN_DEFINITIONS_DIR, value: /etc/re8ch-plugins/definitions}
            - {name: PLUGIN_SYNC_INTERVAL_SECONDS, value: "30"}
          ports: [{name: mcp, containerPort: 8088}]
          readinessProbe: {httpGet: {path: /health/readiness, port: mcp}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/liveness, port: mcp}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: definitions, mountPath: /etc/re8ch-plugins/definitions, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: definitions, configMap: {name: re8ch-plugin-definitions}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: re8ch-plugin-runtime, namespace: toolhive-system}
spec:
  selector: {app.kubernetes.io/name: re8ch-plugin-runtime}
  trafficDistribution: PreferSameNode
  ports: [{name: mcp, port: 8088, targetPort: mcp}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: re8ch-plugin-runtime, namespace: toolhive-system}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: re8ch-plugin-runtime}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: re8ch-plugin-runtime, namespace: toolhive-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: re8ch-plugin-runtime}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: mcpserver}}
        - podSelector: {matchLabels: {toolhive-name: re8ch-tools-vmcp}}
      ports: [{protocol: TCP, port: 8088}]
  egress:
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 8080}, {protocol: TCP, port: 9090}, {protocol: TCP, port: 9091}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
