apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtime.yaml
  - rbac.yaml
  - toolhive.yaml
configMapGenerator:
  - name: re8ch-plugin-definitions
    namespace: toolhive-system
    files:
      - plugins/advanced-fabrics.json
      - plugins/cilium.json
      - plugins/mihomos-cluster.json
      - plugins/public-edge.json
      - plugins/rook-ceph.json
generatorOptions:
  disableNameSuffixHash: true
