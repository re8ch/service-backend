apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: deepseek-v4-flash
  namespace: kagent
spec:
  provider: OpenAI
  model: deepseek-v4-flash
  apiKeySecret: kagent-litellm
  apiKeySecretKey: API_KEY
  openAI:
    baseUrl: http://litellm.llm-gateway.svc.cluster.local:4000/v1
    timeout: 120
