server {
    listen 80;
    server_name teable.re8ch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://teable.re8ch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name teable.re8ch.com;

    ssl_certificate     /etc/letsencrypt/live/teable.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teable.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;
    proxy_connect_timeout 15s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        # Panel -> ICP relay -> R640 Teable. This avoids the currently broken
        # panel/R640 cross-node Flannel path without changing public DNS.
        proxy_pass http://10.181.22.73:32031;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
