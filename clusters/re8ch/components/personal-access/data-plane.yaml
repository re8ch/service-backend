---
apiVersion: v1
kind: Service
metadata: {name: personal-access-auto, namespace: egress-fabric}
spec:
  selector: {app.kubernetes.io/name: personal-access}
  ports: [{name: anytls, port: 24443, targetPort: anytls, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata: {name: personal-access-us-ca, namespace: egress-fabric}
spec:
  selector: {app.kubernetes.io/name: personal-access, access.re8ch.com/region: us-ca}
  ports: [{name: anytls, port: 24443, targetPort: anytls, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata: {name: personal-access-my-kul, namespace: egress-fabric}
spec:
  selector: {app.kubernetes.io/name: personal-access, access.re8ch.com/region: my-kul}
  ports: [{name: anytls, port: 24443, targetPort: anytls, protocol: TCP}]
---
apiVersion: v1
kind: Service
metadata:
  name: personal-access-hysteria2
  namespace: egress-fabric
  annotations: {lbipam.cilium.io/ips: 192.0.2.224}
  labels: {networking.re8ch.com/lb-pool: service-vip, networking.re8ch.com/bgp-advertise: enabled}
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  externalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: personal-access}
  ports: [{name: hysteria2, port: 443, targetPort: hysteria2, protocol: UDP}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: access-anytls
  namespace: egress-fabric
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    networking.re8ch.com/tls-mode: passthrough
    external-dns.alpha.kubernetes.io/hostname: access.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.192
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-tls}]
  hostnames: [access.re8ch.com]
  rules: [{backendRefs: [{name: personal-access-auto, port: 24443}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: access-anytls-us-ca, namespace: egress-fabric}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-us-ca-tls}]
  hostnames: [us-ca.access.re8ch.com]
  rules: [{backendRefs: [{name: personal-access-us-ca, port: 24443}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: access-anytls-my-kul, namespace: egress-fabric}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-my-kul-tls}]
  hostnames: [my-kul.access.re8ch.com]
  rules: [{backendRefs: [{name: personal-access-my-kul, port: 24443}]}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: access-hysteria2-dns
  namespace: egress-fabric
  annotations:
    external-dns.alpha.kubernetes.io/hostname: backup.access.re8ch.com
    networking.re8ch.com/dns-state: canary-not-published
spec:
  ingressClassName: external-dns-only
  rules: [{host: backup.access.re8ch.com}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: personal-access-public-ingress, namespace: egress-fabric}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: personal-access}}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 24443, protocol: TCP}
        - {port: 24443, protocol: UDP}
