apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: personal-access-udp-host-tuning
  namespace: egress-fabric
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-access-udp-host-tuning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-access-udp-host-tuning
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: overseas-la
      tolerations:
        - operator: Exists
      containers:
        - name: reconciler
          image: docker.io/library/busybox:1.36.1
          securityContext:
            privileged: true
          command: [/bin/sh, -ec]
          args:
            - |
              cat > /host-etc-sysctl/90-re8ch-hysteria2.conf <<'EOF'
              net.core.rmem_max = 16777216
              net.core.wmem_max = 16777216
              EOF
              while true; do
                sysctl -w net.core.rmem_max=16777216
                sysctl -w net.core.wmem_max=16777216
                sleep 60
              done
          resources:
            requests: {cpu: 5m, memory: 4Mi}
            limits: {cpu: 50m, memory: 16Mi}
          volumeMounts:
            - {name: host-etc-sysctl, mountPath: /host-etc-sysctl}
      volumes:
        - name: host-etc-sysctl
          hostPath: {path: /etc/sysctl.d, type: DirectoryOrCreate}
