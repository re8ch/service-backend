apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: access-anytls-us-la, namespace: egress-fabric}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-us-la-tls}]
  hostnames: [route-la.access.re8ch.com]
  rules: [{backendRefs: [{name: personal-access-us-la, port: 24443}]}]
