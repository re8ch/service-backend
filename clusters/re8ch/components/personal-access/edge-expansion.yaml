          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: work, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}, {name: tls, mountPath: /etc/mihomo/tls, readOnly: true}]
      volumes:
