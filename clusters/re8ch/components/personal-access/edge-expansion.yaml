apiVersion: v1
kind: Service
metadata: {name: personal-access-us-la, namespace: egress-fabric}
spec: {ports: [{name: anytls, port: 24443, targetPort: anytls, protocol: TCP}]}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: personal-access-us-la-public, namespace: egress-fabric, labels: {kubernetes.io/service-name: personal-access-us-la}}
addressType: IPv4
ports: [{name: anytls, port: 24443, protocol: TCP}]
endpoints: [{addresses: [192.0.2.91], conditions: {ready: true}, zone: us-la}]
---
apiVersion: v1
kind: Service
metadata:
  name: personal-access-hysteria2-us-la
  namespace: egress-fabric
  annotations: {lbipam.cilium.io/ips: 192.0.2.86}
  labels: {networking.re8ch.com/lb-pool: service-vip, networking.re8ch.com/bgp-advertise: enabled}
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  externalTrafficPolicy: Cluster
  ports: [{name: hysteria2, port: 4443, targetPort: 24444, protocol: UDP}]
---
apiVersion: discovery.k8s.io/v1
