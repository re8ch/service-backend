apiVersion: apps/v1
kind: Deployment
metadata: {name: personal-access-us-la, namespace: egress-fabric}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: personal-access, access.re8ch.com/region: us-la}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: personal-access, app.kubernetes.io/component: public-ingress, access.re8ch.com/region: us-la}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {kubernetes.io/hostname: overseas-la}
      tolerations: [{operator: Exists}]
      serviceAccountName: access-telemetry
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: render-users
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [/bin/sh, -ec]
          args: ['awk ''/^__ANYTLS_USERS__$|^__HYSTERIA2_USERS__$/{while((getline line < "/credentials/users.yaml")>0) print line; close("/credentials/users.yaml"); next} {print}'' /base/config.yaml | sed "s/__CONTROLLER_SECRET__/$(cat /controller/secret)/" > /work/config.yaml']
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: base, mountPath: /base, readOnly: true}, {name: credentials, mountPath: /credentials, readOnly: true}, {name: work, mountPath: /work}, {name: controller, mountPath: /controller, readOnly: true}]
      containers:
        - name: mihomo
          image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
          args: [-d, /etc/mihomo]
          ports: [{name: anytls, containerPort: 24443, protocol: TCP}, {name: hysteria2, containerPort: 24444, protocol: UDP}]
          readinessProbe: {tcpSocket: {port: anytls}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: anytls}, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "2", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: work, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}, {name: tls, mountPath: /etc/mihomo/tls, readOnly: true}]
      volumes:
        - {name: base, configMap: {name: personal-access-mihomo}}
        - {name: credentials, secret: {secretName: personal-access-users}}
        - {name: tls, secret: {secretName: access-re8ch-com-tls}}
        - {name: work, emptyDir: {}}
        - {name: controller, secret: {secretName: access-controller-api, items: [{key: controller-secret, path: secret}]}}
---
