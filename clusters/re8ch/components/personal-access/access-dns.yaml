apiVersion: v1
kind: ConfigMap
metadata: {name: access-dns-config, namespace: egress-fabric}
data:
  mosdns.yaml: |
    log: {level: info, production: true}
    plugins:
      - tag: cache
        type: cache
        args: {size: 65536, lazy_cache_ttl: 86400}
      - tag: private_domains
        type: domain_set
        args: {files: [/rules/current/private-domains.txt]}
      - tag: cn_domains
        type: domain_set
        args: {files: [/rules/current/cn-domains.txt]}
      - tag: forward_cn
        type: forward
        args:
          concurrent: 2
          upstreams:
            - {addr: https://dns.alidns.com/dns-query, dial_addr: 192.0.2.131}
            - {addr: https://doh.pub/dns-query, dial_addr: 192.0.2.148}
      - tag: forward_global
        type: forward
        args:
          concurrent: 2
          upstreams:
            - {addr: https://1.1.1.1/dns-query, socks5: mihomos-node-cn-local:17891}
            - {addr: https://dns.google/dns-query, dial_addr: 8.8.8.8, socks5: mihomos-node-cn-local:17891}
      - tag: main_sequence
        type: sequence
        args:
          - exec: $cache
          - matches: has_resp
            exec: accept
          - matches: qname $private_domains $cn_domains
            exec: $forward_cn
          - matches: has_resp
            exec: accept
          - exec: $forward_global
          - exec: $cache
      - tag: udp_server
        type: udp_server
        args: {entry: main_sequence, listen: 0.0.0.0:5353}
      - tag: tcp_server
        type: tcp_server
        args: {entry: main_sequence, listen: 0.0.0.0:5353}
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:3000
      session_ttl: 720h
    users: []
    auth_attempts: 5
    block_auth_min: 15
    dns:
      bind_hosts: [0.0.0.0]
      port: 5353
      ratelimit: 200
      refuse_any: true
      upstream_dns: [mosdns.egress-fabric.svc.cluster.local:5353]
      bootstrap_dns: [192.0.2.131, 192.0.2.148]
      cache_size: 4194304
      cache_ttl_min: 60
      cache_ttl_max: 86400
    filtering:
      filtering_enabled: true
      filters_update_interval: 24
    filters:
      - enabled: true
        url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
        name: AdGuard DNS filter
        id: 1
    querylog:
      enabled: true
      file_enabled: true
      interval: 24h
      size_memory: 1000
      anonymize_client_ip: false
    statistics: {enabled: true, interval: 24h}
    schema_version: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: access-adguard-data, namespace: egress-fabric}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rbd-r640
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mosdns, namespace: egress-fabric}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: mosdns}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mosdns, app.kubernetes.io/part-of: access-dns}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {networking.re8ch.com/mihomo-node: enabled}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: mosdns}}}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mosdns
          image: docker.io/irinesistiana/mosdns:v5.3.4@sha256:27e62602195489061e6282b8b5028c70a9b00a1f06fc1604f99ce229072e9908
          args: [start, -c, /etc/mosdns/config.yaml]
          ports: [{name: dns-udp, containerPort: 5353, protocol: UDP}, {name: dns-tcp, containerPort: 5353, protocol: TCP}]
          readinessProbe: {tcpSocket: {port: dns-tcp}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: config, mountPath: /etc/mosdns/config.yaml, subPath: mosdns.yaml, readOnly: true}
            - {name: rules, mountPath: /rules, readOnly: true}
            - {name: cache, mountPath: /etc/mosdns/cache}
      volumes:
        - {name: config, configMap: {name: access-dns-config}}
        - {name: rules, persistentVolumeClaim: {claimName: access-rule-cache}}
        - {name: cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: mosdns, namespace: egress-fabric}
spec:
  selector: {app.kubernetes.io/name: mosdns}
  ports:
    - {name: dns-udp, port: 5353, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 5353, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mosdns, namespace: egress-fabric}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: mosdns}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: access-adguard, namespace: egress-fabric}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: access-adguard}}
  template:
    metadata: {labels: {app.kubernetes.io/name: access-adguard, app.kubernetes.io/part-of: access-dns}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: initialize
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [python, -c]
          args: ["from pathlib import Path; (Path('/data/work')).mkdir(parents=True,exist_ok=True); (Path('/data/conf')).mkdir(parents=True,exist_ok=True); p=Path('/data/conf/AdGuardHome.yaml'); p.write_bytes(Path('/template/AdGuardHome.yaml').read_bytes()) if not p.exists() else None"]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: data, mountPath: /data}, {name: config, mountPath: /template, readOnly: true}]
      containers:
        - name: adguard
          image: docker.io/adguard/adguardhome:v0.107.76@sha256:904e081ea2d67fc6440696960eac009c0f649a5eabf44da409dfc36c8b3304c9
          args: [--no-check-update, -c, /opt/adguardhome/conf/AdGuardHome.yaml, -w, /opt/adguardhome/work]
          ports: [{name: dns-udp, containerPort: 5353, protocol: UDP}, {name: dns-tcp, containerPort: 5353, protocol: TCP}, {name: http, containerPort: 3000, protocol: TCP}]
          readinessProbe: {tcpSocket: {port: dns-tcp}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: dns-tcp}, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: data, mountPath: /opt/adguardhome/work, subPath: work}
            - {name: data, mountPath: /opt/adguardhome/conf, subPath: conf}
      volumes: [{name: data, persistentVolumeClaim: {claimName: access-adguard-data}}, {name: config, configMap: {name: access-dns-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: access-dns
  namespace: egress-fabric
  annotations: {lbipam.cilium.io/ips: 192.0.2.78}
  labels: {networking.re8ch.com/lb-pool: service-vip, networking.re8ch.com/bgp-advertise: enabled}
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  # Preserve RouterOS/LAN source addresses so the Cilium policy can enforce the
  # internal-only allowlist at the endpoint.
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: access-adguard}
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata: {name: access-dns-admin, namespace: egress-fabric}
spec:
  selector: {app.kubernetes.io/name: access-adguard}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oauth2-proxy-access-dns, namespace: egress-fabric}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-dns}}
  template:
    metadata: {labels: {app.kubernetes.io/name: oauth2-proxy-access-dns}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0@sha256:37c1570c0427e02fc7c947ef2c04e8995b8347b7abc9fcf1dbb4e376a4b221a7
          args: [--provider=oidc, --oidc-issuer-url=https://dex.re8ch.com, --redirect-url=https://dns.access.re8ch.com/oauth2/callback, --upstream=http://access-dns-admin:3000, --http-address=0.0.0.0:4180, --email-domain=*, --scope=openid profile email, --cookie-secure=true, --cookie-samesite=lax, --reverse-proxy=true, --skip-provider-button=true]
          envFrom: [{secretRef: {name: oauth2-proxy-access-dns}}]
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 200m, memory: 96Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: oauth2-proxy-access-dns, namespace: egress-fabric}
spec: {selector: {app.kubernetes.io/name: oauth2-proxy-access-dns}, ports: [{name: http, port: 4180, targetPort: http}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: access-dns-admin, namespace: egress-fabric}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-dns-https}]
  hostnames: [dns.access.re8ch.com]
  rules: [{backendRefs: [{name: oauth2-proxy-access-dns, port: 4180}]}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: access-dns-admin-record
  namespace: egress-fabric
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dns.access.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec: {ingressClassName: external-dns-only, rules: [{host: dns.access.re8ch.com}]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: access-dns, namespace: egress-fabric}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: access-adguard}}
  ingress:
    - fromCIDR: [192.0.2.16/24, 192.0.2.224/16]
      toPorts: [{ports: [{port: "5353", protocol: UDP}, {port: "5353", protocol: TCP}]}]
    - fromEndpoints: [{matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-dns}}]
      toPorts: [{ports: [{port: "3000", protocol: TCP}]}]
