apiVersion: v1
kind: ConfigMap
metadata: {name: edge-access-anytls, namespace: egress-fabric}
data:
  config.yaml: |
    allow-lan: false
    mode: rule
    log-level: warning
    proxies:
      - {name: NODE-SMART-EGRESS, type: socks5, server: 127.0.0.1, port: 17891, udp: true}
    listeners:
      - name: edge-access-anytls
        type: anytls
        listen: 0.0.0.0
        port: 24443
        users:
    __ANYTLS_USERS__
        certificate: /etc/mihomo/tls/tls.crt
        private-key: /etc/mihomo/tls/tls.key
        proxy: NODE-SMART-EGRESS
    rules: ["MATCH,NODE-SMART-EGRESS"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: edge-access-anytls, namespace: egress-fabric}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: edge-access-anytls}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: edge-access-anytls, app.kubernetes.io/component: public-ingress}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {networking.re8ch.com/edge-access-anytls: enabled}
      tolerations: [{operator: Exists}]
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: render-users
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [/bin/sh, -ec]
          args:
            - |
              awk '/^__ANYTLS_USERS__$/{while((getline line < "/credentials/users.yaml")>0) print line; close("/credentials/users.yaml"); next} {print}' /base/config.yaml > /work/config.yaml
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: base, mountPath: /base, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: work, mountPath: /work}
      containers:
        - name: mihomo
          image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
          args: [-d, /etc/mihomo]
          ports: [{name: anytls, containerPort: 24443, protocol: TCP}]
          readinessProbe: {tcpSocket: {port: anytls}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: anytls}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 800m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: work, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: tls, mountPath: /etc/mihomo/tls, readOnly: true}
      volumes:
        - {name: base, configMap: {name: edge-access-anytls}}
        - {name: credentials, secret: {secretName: personal-access-users}}
        - {name: tls, secret: {secretName: access-re8ch-com-tls}}
        - {name: work, emptyDir: {}}
