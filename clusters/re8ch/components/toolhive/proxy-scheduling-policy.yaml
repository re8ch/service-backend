apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: toolhive-mcp-r640.re8ch.com
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: is-toolhive-mcp-workload
      expression: >-
        object.metadata.namespace == 'toolhive-system' &&
        has(object.metadata.labels) &&
        'toolhive' in object.metadata.labels &&
        object.metadata.labels['toolhive'] == 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.template.spec.nodeSelector)
          ? [JSONPatch{
              op: 'add',
              path: '/spec/template/spec/nodeSelector/' + jsonpatch.escapeKey('kubernetes.io/hostname'),
              value: 'restricted-node-6dc3f140f9'
            }]
          : [JSONPatch{
              op: 'add',
              path: '/spec/template/spec/nodeSelector',
              value: {'kubernetes.io/hostname': 'restricted-node-6dc3f140f9'}
            }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: toolhive-mcp-r640.re8ch.com
spec:
  policyName: toolhive-mcp-r640.re8ch.com
  matchResources:
    namespaceSelector:
      matchLabels: {re8ch.com/plane: control}
