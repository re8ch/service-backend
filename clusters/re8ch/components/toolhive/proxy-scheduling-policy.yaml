apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: toolhive-mcp-a1-b1.re8ch.com
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: is-toolhive-mcp-workload
      expression: >-
        object.metadata.namespace == 'toolhive-system' &&
        has(object.metadata.labels) &&
        'toolhive' in object.metadata.labels &&
        object.metadata.labels['toolhive'] == 'true' &&
        'toolhive-name' in object.metadata.labels
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.template.spec.nodeSelector)
          ? [JSONPatch{op: 'replace', path: '/spec/template/spec/nodeSelector', value: {}}]
          : []
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: 'add',
            path: '/spec/template/spec/affinity',
            value: Object.spec.template.spec.affinity{
              nodeAffinity: Object.spec.template.spec.affinity.nodeAffinity{
                requiredDuringSchedulingIgnoredDuringExecution:
                  Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                    nodeSelectorTerms: [
                      Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms{
                        matchExpressions: [
                          Object.spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.matchExpressions{
                            key: 'kubernetes.io/hostname',
                            operator: 'In',
                            values: ['restricted-node-1eb0570f74', 'restricted-node-296f36f2fb']
                          }
                        ]
                      }
                    ]
                  }
              },
              podAntiAffinity: Object.spec.template.spec.affinity.podAntiAffinity{
                requiredDuringSchedulingIgnoredDuringExecution: [
                  Object.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                    labelSelector:
                      Object.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.labelSelector{
                        matchLabels: {'toolhive-name': object.metadata.labels['toolhive-name']}
                      },
                    topologyKey: 'kubernetes.io/hostname'
                  }
                ]
              }
            }
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: toolhive-mcp-a1-b1.re8ch.com
spec:
  policyName: toolhive-mcp-a1-b1.re8ch.com
  matchResources:
    namespaceSelector:
      matchLabels: {re8ch.com/plane: control}
