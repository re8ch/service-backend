apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata: {name: external-operate-oidc, namespace: toolhive-system}
spec:
  type: inline
  inline:
    issuer: https://dex.re8ch.com
    clientId: re8ch-platform-tools
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata: {name: external-admin-oidc, namespace: toolhive-system}
spec:
  type: inline
  inline:
    issuer: https://dex.re8ch.com
    clientId: re8ch-platform-admin
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ops-operate-external
  namespace: toolhive-system
  labels: {re8ch.com/risk: controlled-write, re8ch.com/publication-stage: canary}
  annotations:
    re8ch.com/architecture-revision: scalable-vmcp-v2
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: RE8CH Platform Operate
    toolhive.stacklok.dev/registry-description: OAuth-protected, allowlisted platform restart and 0/1 scaling operations.
    toolhive.stacklok.dev/registry-category: operations,controlled-write,external,oauth
    toolhive.stacklok.dev/registry-url: https://operate.tools.re8ch.com/mcp
spec:
  groupRef: {name: platform-operate}
  image: docker.1ms.run/library/python:3.12-alpine
  backendReplicas: 2
  replicas: 2
  sessionAffinity: None
  sessionStorage:
    provider: redis
    address: toolhive-auth-redis.toolhive-system.svc.cluster.local:6379
    db: 7
    keyPrefix: "thv:mcp:operate-external:"
    passwordRef: {name: toolhive-auth-redis, key: password}
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: ops-mcp-operate
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: TRUST_LOOPBACK_PROXY, value: "true"}
    - {name: TRUST_PROXY_CIDRS, value: "192.0.2.57/16"}
    - {name: OPS_TOOL_PROFILE, value: operate}
  toolConfigRef: {name: ops-operate-tools}
  telemetryConfigRef: {name: platform-tools-telemetry, serviceName: re8ch-platform-operate-external}
  audit: {enabled: true}
  oidcConfigRef:
    name: external-operate-oidc
    audience: re8ch-platform-tools
    resourceUrl: https://operate.tools.re8ch.com/mcp
    scopes: [openid, profile, email, groups, offline_access]
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  podTemplateSpec:
    metadata:
      annotations: {re8ch.com/code-revision: scalable-vmcp-v2}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/instance: ops-operate-external}}
              topologyKey: kubernetes.io/hostname
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          command: [python, /app/app.py]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app-code, mountPath: /app, readOnly: true}]
      volumes: [{name: app-code, configMap: {name: ops-mcp-server-code}}]
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ops-admin-external
  namespace: toolhive-system
  labels: {re8ch.com/risk: privileged, re8ch.com/publication-stage: canary}
  annotations:
    re8ch.com/architecture-revision: scalable-vmcp-v2
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: RE8CH Platform Admin
    toolhive.stacklok.dev/registry-description: Dex-authenticated identity, RBAC, tenant, database, Harbor and publication administration.
    toolhive.stacklok.dev/registry-category: operations,privileged,external,oauth
    toolhive.stacklok.dev/registry-url: https://admin.re8ch.com:8443/mcp
spec:
  groupRef: {name: platform-admin}
  image: docker.1ms.run/library/python:3.12-alpine
  backendReplicas: 2
  replicas: 2
  sessionAffinity: None
  sessionStorage:
    provider: redis
    address: toolhive-auth-redis.toolhive-system.svc.cluster.local:6379
    db: 8
    keyPrefix: "thv:mcp:admin-external:"
    passwordRef: {name: toolhive-auth-redis, key: password}
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: ops-mcp-admin
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: TRUST_LOOPBACK_PROXY, value: "true"}
    - {name: TRUST_PROXY_CIDRS, value: "192.0.2.57/16"}
    - {name: OPS_TOOL_PROFILE, value: admin}
    - {name: HARBOR_URL, value: "https://registry.re8ch.com"}
    - {name: HARBOR_API_URL, value: "https://registry.re8ch.com"}
    - {name: HARBOR_SKIP_TLS_VERIFY, value: "true"}
  toolConfigRef: {name: ops-admin-tools}
  telemetryConfigRef: {name: platform-tools-telemetry, serviceName: re8ch-platform-admin-external}
  audit: {enabled: true}
  oidcConfigRef:
    name: external-admin-oidc
    audience: re8ch-platform-admin
    resourceUrl: https://admin.re8ch.com:8443/mcp
    scopes: [openid, profile, email, groups, offline_access]
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  podTemplateSpec:
    metadata:
      annotations: {re8ch.com/code-revision: scalable-vmcp-v3-admin-workflow}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/instance: ops-admin-external}}
              topologyKey: kubernetes.io/hostname
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          command: [python, /app/app.py]
          env:
            - name: HARBOR_USERNAME
              valueFrom: {secretKeyRef: {name: ops-mcp-harbor-auth, key: username}}
            - name: HARBOR_PASSWORD
              valueFrom: {secretKeyRef: {name: ops-mcp-harbor-auth, key: password}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app-code, mountPath: /app, readOnly: true}]
      volumes: [{name: app-code, configMap: {name: ops-mcp-server-code}}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operate-tools-re8ch-com
  namespace: toolhive-system
  annotations: {traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"}
spec:
  ingressClassName: traefik
  rules:
    - host: operate.tools.re8ch.com
      http:
        paths:
          - {path: /mcp, pathType: Prefix, backend: {service: {name: mcp-ops-operate-external-proxy, port: {number: 8080}}}}
          - {path: /.well-known, pathType: Prefix, backend: {service: {name: mcp-ops-operate-external-proxy, port: {number: 8080}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-tools-re8ch-com
  namespace: toolhive-system
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: admin.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [admin.re8ch.com]
      secretName: re8ch-wildcard-tls
  rules:
    - host: admin.re8ch.com
      http:
        paths:
          - {path: /mcp, pathType: Prefix, backend: {service: {name: vmcp-re8ch-admin-vmcp, port: {number: 4483}}}}
          - {path: /.well-known, pathType: Prefix, backend: {service: {name: vmcp-re8ch-admin-vmcp, port: {number: 4483}}}}
          - {path: /oauth, pathType: Prefix, backend: {service: {name: vmcp-re8ch-admin-vmcp, port: {number: 4483}}}}
