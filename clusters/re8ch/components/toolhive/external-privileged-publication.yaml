# The privileged public surface is owned by ConnecTool's admin vMCP. Legacy
# direct operate/admin MCPServer resources are retired by the migration Job.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-tools-public
  namespace: toolhive-system
  annotations:
    # Adopt the historical client-side-applied Route into Flux ownership.
    kustomize.toolkit.fluxcd.io/ssa: Override
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: admin-https
  hostnames: [admin.re8ch.com]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /mcp}}
        - {path: {type: PathPrefix, value: /oauth}}
        - {path: {type: PathPrefix, value: /.well-known}}
      backendRefs: [{name: re8ch-admin-vmcp-session-router, port: 4483}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-tools-re8ch-com
  namespace: toolhive-system
  labels:
    public.re8ch.com/external-dns: enabled
    networking.re8ch.com/dns-authority: public-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: admin.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: advanced-fabric
  tls:
    - hosts: [admin.re8ch.com]
      secretName: re8ch-wildcard-tls
  rules:
    - host: admin.re8ch.com
      http:
        paths:
          - {path: /mcp, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
          - {path: /.well-known, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
          - {path: /oauth, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
