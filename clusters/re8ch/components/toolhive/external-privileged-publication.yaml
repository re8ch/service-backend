# The privileged public surface is owned by ConnecTool's admin vMCP. Legacy
# direct operate/admin MCPServer resources are retired by the migration Job.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-tools-re8ch-com
  namespace: toolhive-system
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: admin.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [admin.re8ch.com]
      secretName: re8ch-wildcard-tls
  rules:
    - host: admin.re8ch.com
      http:
        paths:
          - {path: /mcp, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
          - {path: /.well-known, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
          - {path: /oauth, pathType: Prefix, backend: {service: {name: re8ch-admin-vmcp-session-router, port: {number: 4483}}}}
