apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  ref:
    digest: sha256:4881731dd7ceaf0fefcdecdb23b1c87d16b1f60fe8aa5ee75304fd33f4fa4d22
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 10m
  releaseName: toolhive-operator
  targetNamespace: toolhive-system
  storageNamespace: toolhive-system
  chartRef: {kind: OCIRepository, name: toolhive-operator}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    operator:
      replicaCount: 2
      features: {experimental: false, storageVersionMigrator: false}
      image: ghcr.io/stacklok/toolhive/operator@sha256:7998095e6b998d2ae50f93393fa8c969d41a1422457d1775aef81c81dfa24b67
      toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner@sha256:1ee5a4d66763180fdfdb95c4da9afb7112946e90531516fb9a1fd279f2c9cd29
      vmcpImage: ghcr.io/stacklok/toolhive/vmcp@sha256:22b6bb5c642c45e913afef0ea0ca696b1f12cd7dd26d74a8e8cb0b794cd2774c
      env:
        - {name: TOOLHIVE_SKIP_UPDATE_CHECK, value: "true"}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      rbac: {scope: namespace, allowedNamespaces: [toolhive-system]}
      serviceAccount: {create: true, name: toolhive-operator}
      # Explicitly clear the value retained by the pre-Flux Helm release.
      nodeSelector: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: scheduling.re8ch.com/service-plane, operator: In, values: [core]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: toolhive-operator}}
              topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: toolhive-operator, namespace: toolhive-system}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-operator}}
