apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  ref:
    digest: sha256:b67eee6d2ef251dd34b2c7e563ba1e0bbd9b5936d9d2fb7b671f6c86ff61b258
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 10m
  releaseName: toolhive-operator
  targetNamespace: toolhive-system
  storageNamespace: toolhive-system
  chartRef: {kind: OCIRepository, name: toolhive-operator}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    operator:
      replicaCount: 2
      features: {experimental: false, storageVersionMigrator: false}
      image: ghcr.io/stacklok/toolhive/operator@sha256:2916086b1f9508e563d8055b3ab31c45f1e04edf4df81e8a41a334c8dc902cde
      toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner@sha256:f60433f850e76e62516d69f6f00cfa69064639175210fff728696d1c86164fa1
      vmcpImage: ghcr.io/stacklok/toolhive/vmcp@sha256:5911e13fcea86c1274f0650e172792e9429bf4b16ae77a303d1bc4bf820fc619
      env:
        - {name: TOOLHIVE_SKIP_UPDATE_CHECK, value: "true"}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      rbac: {scope: namespace, allowedNamespaces: [toolhive-system]}
      serviceAccount: {create: true, name: toolhive-operator}
      # Explicitly clear the value retained by the pre-Flux Helm release.
      nodeSelector: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: scheduling.re8ch.com/service-plane, operator: In, values: [core]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: toolhive-operator}}
              topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: toolhive-operator, namespace: toolhive-system}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-operator}}
