# Deliberately narrower than re8ch:ops-mcp-observe. The public backend needs
# enough metadata and resource-usage evidence to build sanitized health and
# inventory responses. It must never receive Secret, pod/log, exec, PV/PVC,
# Job or RBAC access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: re8ch:ops-mcp-public-observe
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # metrics-server is HA on the control plane and scrapes every Ready node.
  # These read-only resources let the sanitized observe backend report the
  # resulting node coverage and tenant-scoped Pod usage; they grant no access
  # to Pod specifications, logs, exec, or Secrets.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["nuclio.io"]
    resources: ["nucliofunctions", "nucliofunctions/status", "nuclioapigateways", "nuclioprojects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["toolhive.stacklok.dev"]
    resources: ["mcpservers", "mcpservers/status", "mcpremoteproxies", "mcpremoteproxies/status", "mcpgroups", "mcptoolconfigs", "mcpoidcconfigs", "virtualmcpservers", "virtualmcpservers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "gitrepositories/status", "ocirepositories", "ocirepositories/status", "helmrepositories", "helmrepositories/status", "helmcharts", "helmcharts/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations", "kustomizations/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases", "helmreleases/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["receivers", "receivers/status", "providers", "providers/status", "alerts", "alerts/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sandbox.opensandbox.io"]
    resources: ["batchsandboxes", "batchsandboxes/status", "pools", "pools/status", "sandboxsnapshots", "sandboxsnapshots/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["anatomy.re8ch.com"]
    resources: ["runtimeanalyses", "runtimeanalyses/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: re8ch:ops-mcp-public-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: re8ch:ops-mcp-public-observe
subjects:
  - kind: ServiceAccount
    name: ops-mcp-public
    namespace: toolhive-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch:ops-mcp-ceph-observe, namespace: rook-ceph}
rules:
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters]
    resourceNames: [rook-ceph]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch:ops-mcp-ceph-observe, namespace: rook-ceph}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: re8ch:ops-mcp-ceph-observe}
subjects: [{kind: ServiceAccount, name: ops-mcp-public, namespace: toolhive-system}]
