apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-mcp-public
  namespace: toolhive-system
  labels:
    re8ch.com/risk: public-read
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-public-read-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - get_usage_guide
    - get_tenant_context
    - list_k8s_resources
    - get_registry_info
    - get_tenant_resource_catalog
    - get_grafana_links
    - get_tenant_metrics_summary
    - get_platform_service_health
    - get_platform_service_catalog
    - get_platform_permission_coverage
    - get_platform_access_posture
    - get_managed_platform_operation_status
    - get_nuclio_function_status
    - diagnose_nuclio_function
    - get_nuclio_capacity_status
    - get_litellm_gateway_status
    - get_fleet_control_status
    - get_supabase_platform_status
    - get_neo4j_platform_status
    - get_identity_platform_status
    - get_agent_runtime_status
    - get_observability_platform_status
    - get_artifact_platform_status
    - get_database_routing_status
    - get_external_publication_readiness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
  labels:
    app.kubernetes.io/name: toolhive-cloud-ui
    app.kubernetes.io/part-of: toolhive
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-cloud-ui}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolhive-cloud-ui
        app.kubernetes.io/part-of: toolhive
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-re8ch}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: scheduling.re8ch.com/service-plane, operator: In, values: [core]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app.kubernetes.io/name: toolhive-cloud-ui}}
              topologyKey: kubernetes.io/hostname
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: cloud-ui
          image: ghcr.io/re8ch/toolhive-cloud-ui-re8ch@sha256:31c2230e14a02833f31f2853dd3abd166eb0ab3c9ee4bc297d06c97c52187eae
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: OIDC_ISSUER_URL, value: "https://auth.re8ch.com/application/o/toolhive-cloud-ui"}
            - {name: OIDC_CLIENT_ID, value: re8ch-toolhive-cloud-ui}
            - {name: BETTER_AUTH_URL, value: "https://tools.service.re8ch.com"}
            - {name: TRUSTED_ORIGINS, value: "https://tools.service.re8ch.com"}
            - {name: API_BASE_URL, value: "http://toolhive-registry-server.toolhive-system.svc.cluster.local:8080"}
            - {name: PUBLIC_CATALOG, value: "true"}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: toolhive-cloud-ui-auth, key: oidc-client-secret}}}
            - {name: BETTER_AUTH_SECRET, valueFrom: {secretKeyRef: {name: toolhive-cloud-ui-auth, key: better-auth-secret}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
spec:
  selector: {app.kubernetes.io/name: toolhive-cloud-ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [tools.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: toolhive-cloud-ui, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tools-re8ch-com
  namespace: toolhive-system
  labels: {networking.re8ch.com/dns-authority: migrated-to-service-zone}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tools.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: advanced-fabric
  tls:
    - hosts: [tools.re8ch.com]
      secretName: re8ch-wildcard-tls
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: re8ch-tools-vmcp-session-router
                port: {number: 4483}
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: re8ch-tools-vmcp-session-router
                port: {number: 4483}
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: re8ch-tools-vmcp-session-router
                port: {number: 4483}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: advanced-fabric
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toolhive-cloud-ui
                port: {number: 80}
