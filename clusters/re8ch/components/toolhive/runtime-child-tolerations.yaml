apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: re8ch-toolhive-child-tolerations
spec:
  admission: true
  background: true
  generateExisting: true
  validationFailureAction: Audit
  rules:
    - name: add-r640-capacity-tolerations
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              namespaces: [toolhive-system]
              selector:
                matchLabels:
                  toolhive: "true"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
                  - key: scheduling.re8ch.com/capacity-window
                    operator: Equal
                    value: closed
                    effect: NoSchedule
    - name: project-functions-shared-pull-secret
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: [toolhive-system]
      generate:
        apiVersion: v1
        kind: Secret
        name: harbor-functions-shared-pull
        namespace: toolhive-system
        synchronize: true
        clone:
          namespace: anycam
          name: harbor-functions-shared-pull
    - name: add-session-router-image-pull-secret
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [toolhive-system]
              selector:
                matchLabels:
                  app.kubernetes.io/component: session-router
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                imagePullSecrets:
                  - name: harbor-functions-shared-pull
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kyverno-toolhive-pull-secret-source, namespace: anycam}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [harbor-functions-shared-pull]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kyverno-toolhive-pull-secret-source, namespace: anycam}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kyverno-toolhive-pull-secret-source}
subjects:
  - {kind: ServiceAccount, name: kyverno-admission-controller, namespace: kyverno}
  - {kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: kyverno-toolhive-pull-secret-target, namespace: toolhive-system}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: kyverno-toolhive-pull-secret-target, namespace: toolhive-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kyverno-toolhive-pull-secret-target}
subjects:
  - {kind: ServiceAccount, name: kyverno-admission-controller, namespace: kyverno}
  - {kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno}
