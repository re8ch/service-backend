apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: re8ch-toolhive-child-tolerations
spec:
  admission: true
  background: false
  validationFailureAction: Audit
  rules:
    - name: add-r640-capacity-tolerations
      match:
        any:
          - resources:
              kinds: [Deployment, StatefulSet]
              namespaces: [toolhive-system]
              selector:
                matchLabels:
                  toolhive: "true"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
                  - key: scheduling.re8ch.com/capacity-window
                    operator: Equal
                    value: closed
                    effect: NoSchedule
