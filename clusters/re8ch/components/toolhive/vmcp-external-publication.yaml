apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata: {name: platform-admin-public, namespace: toolhive-system}
spec: {description: "Admin tools aggregated only through the ConnecTool vMCP."}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata: {name: platform-tools-public, namespace: toolhive-system}
spec: {description: "Observe and operate tools aggregated only through the ConnecTool vMCP."}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata: {name: ops-operate-tools, namespace: toolhive-system}
spec:
  toolsFilter:
    - get_managed_platform_operation_status
    - restart_managed_platform_deployment
    - scale_managed_platform_deployment
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata: {name: ops-admin-tools, namespace: toolhive-system}
spec:
  toolsFilter:
    - list_dex_users
    - get_dex_hash_instructions
    - create_dex_user
    - grant_user_namespace
    - get_tenancy_admin_workflow
    - generate_pg_tenant_database_plan
    - ensure_tenant_database_secrets
    - ensure_tenant_database_bundle
    - ensure_tenant_access
    - ensure_harbor_tenant
    - set_tool_publication_stage
    - get_tenant_secret_refs
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata: {name: platform-tools-telemetry, namespace: toolhive-system}
spec:
  # Prometheus remains local to each proxy. OTLP stays disabled until a stable
  # in-cluster collector Service is part of the declared platform contract.
  openTelemetry: {enabled: false}
  prometheus: {enabled: true}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata: {name: vmcp-observe-backend-auth, namespace: toolhive-system}
spec:
  type: headerInjection
  headerInjection:
    headerName: X-Ops-Token
    valueSecretRef: {name: ops-mcp-observe-upstream, key: x-ops-token}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata: {name: vmcp-admin-backend-auth, namespace: toolhive-system}
spec:
  type: headerInjection
  headerInjection:
    headerName: X-Ops-Token
    valueSecretRef: {name: ops-mcp-admin-upstream, key: x-ops-token}
---
# Each internal workload has two backend and proxy replicas. ConnecTool's
# runtime policy spreads operator-generated children one per A1/B1 node and
# configures their Services to prefer a same-node endpoint.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ops-admin-vmcp-internal
  namespace: toolhive-system
  labels: {re8ch.com/risk: privileged, re8ch.com/publication-stage: vmcp-internal}
  annotations: {re8ch.com/reconcile-generation: connectool-0.4.2}
spec:
  groupRef: {name: platform-admin-public}
  image: docker.1ms.run/library/python:3.12-alpine
  replicas: 2
  backendReplicas: 2
  sessionAffinity: ClientIP
  sessionStorage: {provider: memory}
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: ops-mcp-admin
  secrets:
    - {name: ops-mcp-admin-upstream, key: x-ops-token, targetEnvName: OPS_ADMIN_TOKEN}
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: OPS_TOOL_PROFILE, value: admin}
    - {name: HARBOR_URL, value: "https://registry.re8ch.com"}
    - {name: HARBOR_API_URL, value: "https://registry.re8ch.com"}
    - {name: HARBOR_SKIP_TLS_VERIFY, value: "true"}
  toolConfigRef: {name: ops-admin-tools}
  telemetryConfigRef: {name: platform-tools-telemetry, serviceName: re8ch-ops-admin-vmcp-internal}
  audit: {enabled: true}
  resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
  podTemplateSpec:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {toolhive-name: ops-admin-vmcp-internal}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mcp
          command: [python, /app/app.py]
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 384Mi}}
          env:
            - {name: HARBOR_USERNAME, valueFrom: {secretKeyRef: {name: ops-mcp-harbor-auth, key: username}}}
            - {name: HARBOR_PASSWORD, valueFrom: {secretKeyRef: {name: ops-mcp-harbor-auth, key: password}}}
          volumeMounts: [{name: app-code, mountPath: /app, readOnly: true}]
      volumes: [{name: app-code, configMap: {name: ops-mcp-server-code}}]
---
