      - {key: toolhive-name, operator: In, values: [ops-admin-vmcp-internal, ops-observe-vmcp-internal, ops-operate-vmcp-internal]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: mcpserver, toolhive: "true"}}
      ports: [{protocol: TCP, port: 8088}]
