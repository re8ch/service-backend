apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
  labels: {app.kubernetes.io/name: toolhive-cloud-ui, app.kubernetes.io/part-of: toolhive}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-cloud-ui}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: toolhive-cloud-ui, app.kubernetes.io/part-of: toolhive}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-re8ch}]
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: cloud-ui
          image: ghcr.io/re8ch/toolhive-cloud-ui-re8ch@sha256:9d75db88b6ff8987e55c68f90ce7b925c582bd6b414630427406c9eb3e2a20df
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: OIDC_ISSUER_URL, value: "https://db-rw.re8ch.com/auth/v1"}
            - {name: OIDC_CLIENT_ID, value: "32098a11-be0c-5dd4-9f29-ec87c30faf19"}
            - {name: BETTER_AUTH_URL, value: "https://tools.re8ch.com"}
            - {name: TRUSTED_ORIGINS, value: "https://tools.re8ch.com"}
            - {name: API_BASE_URL, value: "http://toolhive-registry-server.toolhive-system.svc.cluster.local:8080"}
            - {name: PUBLIC_CATALOG, value: "true"}
            - {name: BETTER_AUTH_SECRET, valueFrom: {secretKeyRef: {name: toolhive-cloud-ui-auth, key: better-auth-secret}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1001, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: toolhive-cloud-ui, namespace: toolhive-system}
spec:
  selector: {app.kubernetes.io/name: toolhive-cloud-ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: toolhive-cloud-ui, namespace: toolhive-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [tools.re8ch.com]
  rules: [{matches: [{path: {type: PathPrefix, value: /}}], backendRefs: [{name: toolhive-cloud-ui, port: 80}]}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tools-re8ch-com
  namespace: toolhive-system
  labels: {networking.re8ch.com/dns-authority: public-edge}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tools.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: tools.re8ch.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: toolhive-cloud-ui, port: {number: 80}}}}]
