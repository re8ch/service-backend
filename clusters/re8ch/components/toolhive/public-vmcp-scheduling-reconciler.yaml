apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-vmcp-scheduling-reconciler
  namespace: toolhive-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-vmcp-scheduling-reconciler
  namespace: toolhive-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      - vmcp-re8ch-tools-vmcp
      - vmcp-tenant-vmcp
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-vmcp-scheduling-reconciler
  namespace: toolhive-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-vmcp-scheduling-reconciler
subjects:
  - kind: ServiceAccount
    name: public-vmcp-scheduling-reconciler
    namespace: toolhive-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: public-vmcp-scheduling-reconciler-v1
  namespace: toolhive-system
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: public-vmcp-scheduling-reconciler
      restartPolicy: Never
      containers:
        - name: reconcile
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              for deployment in vmcp-re8ch-tools-vmcp vmcp-tenant-vmcp; do
                attempt=1
                until [ "$attempt" -gt 5 ]; do
                  kubectl -n toolhive-system patch deployment "$deployment" --type merge \
                    -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"re8ch.com/scheduling-reconcile\":\"v1-$attempt\"}}}}}"
                  node_selector="$(kubectl -n toolhive-system get deployment "$deployment" -o jsonpath='{.spec.template.spec.nodeSelector.kubernetes\.io/hostname}')"
                  [ "$node_selector" = restricted-node-6dc3f140f9 ] && break
                  attempt=$((attempt + 1))
                  sleep 2
                done
                [ "$node_selector" = restricted-node-6dc3f140f9 ]
                kubectl -n toolhive-system rollout status deployment "$deployment" --timeout=180s
              done
