replicaCount: 2

image:
  registryServerUrl: ghcr.io/stacklok/thv-registry-api:v1.5.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  exposeInternalPort: true
  internalPort: 8081

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels: {app.kubernetes.io/name: toolhive-registry-server}
        topologyKey: kubernetes.io/hostname

rbac:
  scope: namespace
  allowedNamespaces:
    - toolhive-system

config:
  sources:
    - name: managed-workloads
      kubernetes:
        namespaces: [toolhive-system]
    - name: re8ch-managed
      managed: {}
  registries:
    - name: approved
      sources: [managed-workloads, re8ch-managed]
  database:
    # Temporary Service IP: B1 currently cannot reach kube-dns (192.0.2.240).
    # Restore postgresql.mcp-registry.svc.cluster.local after the Cilium/CoreDNS
    # service-routing incident is resolved.
    host: 192.0.2.150
    port: 5432
    user: mcpregistry
    migrationUser: mcpregistry
    database: mcp-registry
    sslMode: disable
    maxOpenConns: 10
  auth:
    mode: anonymous
  audit:
    enabled: true
  telemetry:
    enabled: true
    serviceName: re8ch-toolhive-registry
    # Temporary Service IP for the same cluster-DNS incident described above.
    endpoint: 192.0.2.161:4318
    insecure: true
    tracing:
      enabled: true
      sampling: 0.1
    metrics:
      enabled: true

extraEnv:
  - name: THV_REGISTRY_DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: toolhive-registry-database
        key: migration-password
  - name: THV_REGISTRY_DATABASE_MIGRATIONPASSWORD
    valueFrom:
      secretKeyRef:
        name: toolhive-registry-database
        key: migration-password
