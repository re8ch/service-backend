replicaCount: 2

image:
  registryServerUrl: ghcr.io/stacklok/thv-registry-api:v1.5.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  exposeInternalPort: true
  internalPort: 8081

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: scheduling.re8ch.com/service-plane
              operator: In
              values: [core]
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels: {app.kubernetes.io/name: toolhive-registry-server}
        topologyKey: kubernetes.io/hostname

rbac:
  scope: namespace
  allowedNamespaces:
    - toolhive-system

config:
  sources:
    - name: managed-workloads
      kubernetes:
        namespaces: [toolhive-system]
    - name: re8ch-managed
      managed: {}
  registries:
    - name: approved
      sources: [managed-workloads, re8ch-managed]
  database:
    host: postgresql.mcp-registry.svc.cluster.local
    port: 5432
    user: mcpregistry
    migrationUser: mcpregistry
    database: toolhive-registry
    sslMode: disable
    maxOpenConns: 10
  auth:
    mode: anonymous
  audit:
    enabled: true
  telemetry:
    # No stable OTLP collector Service currently exists. Do not couple Registry
    # readiness to the former hard-coded ClusterIP.
    enabled: false
    serviceName: re8ch-toolhive-registry
    insecure: true
    tracing:
      enabled: false
      sampling: 0.1
    metrics:
      enabled: false

extraEnv:
  - name: THV_REGISTRY_DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: toolhive-registry-database
        key: migration-password
  - name: THV_REGISTRY_DATABASE_MIGRATIONPASSWORD
    valueFrom:
      secretKeyRef:
        name: toolhive-registry-database
        key: migration-password
