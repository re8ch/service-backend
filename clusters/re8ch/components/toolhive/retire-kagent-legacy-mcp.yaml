apiVersion: v1
kind: ServiceAccount
metadata: {name: retire-kagent-legacy-mcp, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: retire-kagent-legacy-mcp}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kagent]
    verbs: [get, delete]
  - apiGroups: [toolhive.stacklok.dev]
    resources: [mcpservers]
    resourceNames:
      - ops-observe-external
      - ops-operate-external
      - ops-admin-external
      - ops-observe-managed
      - ops-operate-managed
      - ops-admin-managed
      - cluster-infra-plugins-runtime
    verbs: [get, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingadmissionpolicies, mutatingadmissionpolicybindings]
    resourceNames: [toolhive-mcp-r640.re8ch.com]
    verbs: [get, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [toolhive-operator]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: retire-kagent-legacy-mcp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: retire-kagent-legacy-mcp}
subjects:
  - {kind: ServiceAccount, name: retire-kagent-legacy-mcp, namespace: flux-system}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: retire-kagent-legacy-mcp-v4
  namespace: flux-system
  annotations:
    governance.re8ch.com/change: retire-kagent-and-consolidate-mcp-under-connectool
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata: {labels: {app.kubernetes.io/name: retire-kagent-legacy-mcp}}
    spec:
      serviceAccountName: retire-kagent-legacy-mcp
      restartPolicy: OnFailure
      nodeSelector: {kubernetes.io/hostname: restricted-node-1eb0570f74}
      initContainers:
        - &deleteAdmission
          name: delete-r640-policy-binding
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command: [kubectl]
          args: [delete, mutatingadmissionpolicybinding.admissionregistration.k8s.io, toolhive-mcp-r640.re8ch.com, --ignore-not-found=true, --wait=false]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: &securityContext {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
        - <<: *deleteAdmission
          name: delete-r640-policy
          args: [delete, mutatingadmissionpolicy.admissionregistration.k8s.io, toolhive-mcp-r640.re8ch.com, --ignore-not-found=true, --wait=false]
        - <<: *deleteAdmission
          name: clear-operator-r640-selector
          args: [--namespace, toolhive-system, patch, deployment, toolhive-operator, --type=merge, --patch, '{"spec":{"template":{"spec":{"nodeSelector":null}}}}']
        - &deleteMCP
          name: delete-observe-external
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command: [kubectl]
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-observe-external, --ignore-not-found=true, --wait=false]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: *securityContext
        - <<: *deleteMCP
          name: delete-operate-external
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-operate-external, --ignore-not-found=true, --wait=false]
        - <<: *deleteMCP
          name: delete-admin-external
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-admin-external, --ignore-not-found=true, --wait=false]
        - <<: *deleteMCP
          name: delete-observe-managed
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-observe-managed, --ignore-not-found=true, --wait=false]
        - <<: *deleteMCP
          name: delete-operate-managed
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-operate-managed, --ignore-not-found=true, --wait=false]
        - <<: *deleteMCP
          name: delete-admin-managed
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, ops-admin-managed, --ignore-not-found=true, --wait=false]
        - <<: *deleteMCP
          name: delete-cluster-infra-plugin-wrapper
          args: [--namespace, toolhive-system, delete, mcpserver.toolhive.stacklok.dev, cluster-infra-plugins-runtime, --ignore-not-found=true, --wait=false]
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command: [kubectl]
          args: [delete, namespace, kagent, --ignore-not-found=true, --wait=false]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: *securityContext
