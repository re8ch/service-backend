# Exact downstream authorization for restart_managed_platform_deployment.
# Tool validation is not treated as an authorization boundary; every namespace
# repeats the allowlist with Kubernetes resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch:toolhive-platform-restart, namespace: auth}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [authentik-server, authentik-worker]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch:toolhive-platform-restart, namespace: auth}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: re8ch:toolhive-platform-restart}
subjects: [{kind: ServiceAccount, name: ops-mcp-operate, namespace: toolhive-system}]
---
# Shared Grafana is deliberately a named recovery target, not a namespace-wide
# mutation permission. Scale is constrained to 0/1 by the MCP implementation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch:toolhive-platform-restart, namespace: observability-system}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [re8ch-grafana]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch:toolhive-platform-restart, namespace: observability-system}
