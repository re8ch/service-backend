operator:
  replicaCount: 2
  features:
    experimental: false
    storageVersionMigrator: false
  image: ghcr.io/stacklok/toolhive/operator@sha256:2916086b1f9508e563d8055b3ab31c45f1e04edf4df81e8a41a334c8dc902cde
  toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner@sha256:f60433f850e76e62516d69f6f00cfa69064639175210fff728696d1c86164fa1
  vmcpImage: ghcr.io/stacklok/toolhive/vmcp@sha256:5911e13fcea86c1274f0650e172792e9429bf4b16ae77a303d1bc4bf820fc619
  env:
    - name: TOOLHIVE_SKIP_UPDATE_CHECK
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  rbac:
    scope: namespace
    allowedNamespaces:
      - toolhive-system
  serviceAccount:
    create: true
    name: toolhive-operator
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: scheduling.re8ch.com/service-plane
                operator: In
                values: [core]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app.kubernetes.io/name: toolhive-operator}
          topologyKey: kubernetes.io/hostname
