operator:
  replicaCount: 2
  features:
    experimental: false
    storageVersionMigrator: false
  image: ghcr.io/stacklok/toolhive/operator@sha256:7998095e6b998d2ae50f93393fa8c969d41a1422457d1775aef81c81dfa24b67
  toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner@sha256:1ee5a4d66763180fdfdb95c4da9afb7112946e90531516fb9a1fd279f2c9cd29
  vmcpImage: ghcr.io/stacklok/toolhive/vmcp@sha256:22b6bb5c642c45e913afef0ea0ca696b1f12cd7dd26d74a8e8cb0b794cd2774c
  env:
    - name: TOOLHIVE_SKIP_UPDATE_CHECK
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  rbac:
    scope: namespace
    allowedNamespaces:
      - toolhive-system
  serviceAccount:
    create: true
    name: toolhive-operator
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: scheduling.re8ch.com/service-plane
                operator: In
                values: [core]
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: {app.kubernetes.io/name: toolhive-operator}
            topologyKey: kubernetes.io/hostname
