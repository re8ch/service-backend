operator:
  replicaCount: 2
  features:
    experimental: false
    storageVersionMigrator: false
  image: ghcr.io/stacklok/toolhive/operator:v0.41.0
  toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner:v0.41.0
  vmcpImage: ghcr.io/stacklok/toolhive/vmcp:v0.41.0
  env:
    - name: TOOLHIVE_SKIP_UPDATE_CHECK
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  rbac:
    scope: namespace
    allowedNamespaces:
      - toolhive-system
  serviceAccount:
    create: true
    name: toolhive-operator
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: scheduling.re8ch.com/service-plane
                operator: In
                values: [core]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app.kubernetes.io/name: toolhive-operator}
          topologyKey: kubernetes.io/hostname
