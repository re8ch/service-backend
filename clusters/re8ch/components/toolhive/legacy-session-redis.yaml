# Temporary rollback window for the direct MCPServers retired in the same
# release. No ConnecTool vMCP consumes this Service after the 0.4 migration.
# Delete this file and its PVC through the follow-up cleanup after AB health is
# verified for one rollout window.
apiVersion: v1
kind: Service
metadata: {name: toolhive-auth-redis, namespace: toolhive-system}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: toolhive-auth-redis-ab}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: toolhive-auth-redis-ab, namespace: toolhive-system}
spec:
  serviceName: toolhive-auth-redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-auth-redis-ab}}
  template:
    metadata: {labels: {app.kubernetes.io/name: toolhive-auth-redis-ab, app.kubernetes.io/part-of: toolhive}}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: [redis-server, --appendonly, "yes", --requirepass, $(REDIS_PASSWORD)]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: toolhive-auth-redis, key: password}}
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 5, failureThreshold: 6}
          livenessProbe: {tcpSocket: {port: redis}, periodSeconds: 10, failureThreshold: 6}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000, capabilities: {drop: [ALL]}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteMany]
        storageClassName: cephfs-re8ch
        resources: {requests: {storage: 2Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: toolhive-auth-redis, namespace: toolhive-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: toolhive-auth-redis-ab}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: virtualmcpserver}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: mcpserver}}
      ports: [{protocol: TCP, port: 6379}]
