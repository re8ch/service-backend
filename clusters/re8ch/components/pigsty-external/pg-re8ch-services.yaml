apiVersion: v1
kind: Service
metadata: {name: pg-re8ch-primary, namespace: pigsty-external, labels: {re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: primary}}
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}, {name: pgbouncer, port: 6432, targetPort: 6432}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: pg-re8ch-primary, namespace: pigsty-external, labels: {kubernetes.io/service-name: pg-re8ch-primary, re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: primary}}
addressType: IPv4
ports: [{name: postgres, port: 5432}, {name: pgbouncer, port: 6432}]
# Bootstrap value only. The Patroni role reconciler owns this address at runtime.
endpoints: [{addresses: [10.250.0.128], conditions: {ready: true}}]
---
apiVersion: v1
kind: Service
metadata: {name: pg-re8ch-replicas, namespace: pigsty-external, labels: {re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: replica}}
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}, {name: pgbouncer, port: 6432, targetPort: 6432}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: pg-re8ch-replicas, namespace: pigsty-external, labels: {kubernetes.io/service-name: pg-re8ch-replicas, re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: replica}}
addressType: IPv4
ports: [{name: postgres, port: 5432}, {name: pgbouncer, port: 6432}]
# Retired by the declared single-instance topology. Never publish stale replicas.
endpoints: []
