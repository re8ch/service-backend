apiVersion: v1
kind: Service
metadata:
  name: aesthete-native-api-origin
  namespace: aesthete
spec:
  clusterIP: None
  ports:
    - {name: http, port: 12094, protocol: TCP}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: aesthete-native-api-origin-ipv4
  namespace: aesthete
  labels:
    kubernetes.io/service-name: aesthete-native-api-origin
    endpointslice.kubernetes.io/managed-by: re8ch-gitops
addressType: IPv4
ports:
  - {name: http, port: 12094, protocol: TCP}
endpoints:
  - addresses: [192.168.88.251]
    conditions: {ready: true}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aesthete-native-api
  namespace: aesthete
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}
  hostnames: [aesthete.service.re8ch.com]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /api/auth}}
        - {path: {type: PathPrefix, value: /api/rooms}}
        - {path: {type: PathPrefix, value: /api/captures}}
        - {path: {type: Exact, value: /api/materials}}
        - {path: {type: PathPrefix, value: /bridge}}
      backendRefs:
        - {name: aesthete-native-api-origin, port: 12094}
