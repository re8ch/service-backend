apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: rook-release, namespace: flux-system}
spec:
  interval: 3m
  url: https://charts.rook.io/release
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata: {name: ceph-csi-operator, namespace: flux-system}
spec:
  interval: 3m
  url: https://ceph.github.io/ceph-csi-operator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: rook-ceph, namespace: flux-system}
spec:
  interval: 1m
  releaseName: rook-ceph
  targetNamespace: rook-ceph
  storageNamespace: rook-ceph
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.3
      sourceRef: {kind: HelmRepository, name: rook-release}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  valuesFrom:
    - {kind: ConfigMap, name: rook-ceph-operator-values, valuesKey: values.yaml}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: ceph-csi-drivers, namespace: flux-system}
spec:
  interval: 1m
  releaseName: ceph-csi-drivers
  targetNamespace: rook-ceph
  storageNamespace: rook-ceph
  dependsOn: [{name: rook-ceph}]
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef: {kind: HelmRepository, name: ceph-csi-operator}
  install:
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  valuesFrom:
    - {kind: ConfigMap, name: rook-ceph-csi-values, valuesKey: values.yaml}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: rook-ceph-cluster, namespace: flux-system}
spec:
  interval: 1m
  releaseName: rook-ceph-cluster
  targetNamespace: rook-ceph
  storageNamespace: rook-ceph
  dependsOn:
    - {name: rook-ceph}
    - {name: ceph-csi-drivers}
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.3
      sourceRef: {kind: HelmRepository, name: rook-release}
  install:
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  valuesFrom:
    - {kind: ConfigMap, name: rook-ceph-cluster-values, valuesKey: values.yaml}
    - {kind: ConfigMap, name: rook-ceph-production-overlay, valuesKey: values.yaml}
