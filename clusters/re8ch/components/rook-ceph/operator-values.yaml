# Rook v1.20.3 pilot settings for the RE8CH K3s v1.36 cluster.
# All three OSDs use dedicated block devices (VHDX or LV); loop-backed images
# are deliberately rejected.
allowLoopDevices: false

nodeSelector:
  storage.re8ch.com/coordinator: "true"

tolerations:
  - key: scheduling.re8ch.com/capacity-window
    operator: Equal
    value: closed
    effect: NoSchedule
  - key: storage.re8ch.com/coordinator
    operator: Equal
    value: "true"
    effect: NoSchedule

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

discover:
  nodeAffinity: "scheduling.re8ch.com/capability-storage-ceph-osd=true"
