apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: replicated-storage-whitelist.re8ch.com
  annotations:
    storage.re8ch.com/purpose: block-new-legacy-cephfs-claims
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: >-
        !has(object.spec.storageClassName) ||
        !(object.spec.storageClassName in ['cephfs-re8ch', 'cephfs-pilot'])
      message: >-
        cephfs-re8ch and cephfs-pilot are retired for new claims. Use
        cephfs-r640 for externally backed-up shared data, rbd-r640 for
        application-consistent block data, or local-path for rebuildable data.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: replicated-storage-whitelist.re8ch.com
spec:
  policyName: replicated-storage-whitelist.re8ch.com
  validationActions: [Deny]
