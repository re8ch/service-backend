apiVersion: v1
kind: Namespace
metadata:
  name: registry-authority
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-registry-authority-installer
  namespace: registry-authority
data:
  registries-prefix.yaml: |
    mirrors:
      docker.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-dockerhub/$1"}
      ghcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-ghcr/$1"}
      gcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-gcr/$1"}
      quay.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-quay/$1"}
      nvcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-nvcr/$1"}
      registry.k8s.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-k8s/$1"}
      mcr.microsoft.com:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-mcr/$1"}
      docker.elastic.co:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-elastic/$1"}
      container-registry.oracle.com:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-oracle/$1"}
      registry.re8ch.com:
        endpoint: ["https://registry.re8ch.com"]
  install.sh: |
    #!/bin/sh
    set -eu

    host=/host
    registry_dir="$host/etc/rancher/k3s"
    registry_file="$registry_dir/registries.yaml"
    hosts_file="$host/etc/hosts"
    prefix=/config/registries-prefix.yaml
    proxy_url=http://127.0.0.1:17891
    no_proxy=127.0.0.1,localhost,::1,ghcr.io,.ghcr.io,.re8ch.com,.zt.re8ch.com,.svc,.svc.cluster.local,.cluster.local,192.0.2.183/8,192.0.2.57/16,192.0.2.205/16,192.0.2.81/10,192.0.2.33/12,192.0.2.136/16

    mkdir -p "$registry_dir"
    work=$(mktemp "$registry_dir/.registries.yaml.XXXXXX")
    trap 'rm -f "$work"' EXIT
    cp "$prefix" "$work"
    if [ -f "$registry_file" ] && grep -q '^configs:' "$registry_file"; then
      awk '/^configs:/{copy=1} copy{print}' "$registry_file" >>"$work"
    else
      printf 'configs: {}\n' >>"$work"
    fi

    changed=true
    if [ -f "$registry_file" ] && cmp -s "$work" "$registry_file"; then
      changed=false
    else
      if [ -f "$registry_file" ]; then
        cp -p "$registry_file" "$registry_file.pre-re8ch-authority"
      fi
      install -m 0600 "$work" "$registry_file"
    fi

    # Kubelet/containerd runs in the host network namespace, where public DNS
    # can hairpin registry.re8ch.com through the edge instead of reaching the
    # in-cluster Harbor origin. Keep the stable Harbor Service IP authoritative
    # for node-local image pulls.
    hosts_work=$(mktemp "$host/etc/.hosts.XXXXXX")
    awk '
      {
        keep=1
        for (i=2; i<=NF; i++) if ($i == "registry.re8ch.com") keep=0
        if (keep) print
      }
    ' "$hosts_file" >"$hosts_work"
    printf '%s\n' '192.0.2.26 registry.re8ch.com # re8ch cluster-local Harbor origin' >>"$hosts_work"
    cat "$hosts_work" >"$hosts_file"
    rm -f "$hosts_work"

    # Some former servers retain a disabled k3s.service alongside the active
    # agent unit. Selecting by unit-file existence can accidentally start a
    # second local control plane and replace the agent CA. Prefer the unit that
    # is active, then the one enabled for boot.
    service=k3s-agent
    if chroot "$host" systemctl is-active --quiet k3s-agent ||
       chroot "$host" systemctl is-enabled --quiet k3s-agent; then
      service=k3s-agent
    elif chroot "$host" systemctl is-active --quiet k3s ||
         chroot "$host" systemctl is-enabled --quiet k3s; then
      service=k3s
    else
      printf 'no active or enabled k3s unit found\n' >&2
      exit 1
    fi
    dropin="$host/etc/systemd/system/$service.service.d"
    mkdir -p "$dropin"
    cat >"$dropin/20-re8ch-registry-egress.conf" <<EOF
    [Service]
    Environment="HTTP_PROXY=$proxy_url"
    Environment="HTTPS_PROXY=$proxy_url"
    Environment="http_proxy=$proxy_url"
    Environment="https_proxy=$proxy_url"
    Environment="NO_PROXY=$no_proxy"
    Environment="no_proxy=$no_proxy"
    EOF

    chroot "$host" systemctl daemon-reload
    printf 'service=%s changed=%s\n' "$service" "$changed"
    if [ "${RESTART_K3S:-false}" = true ] && [ "$changed" = true ]; then
      chroot "$host" systemd-run --quiet --collect \
        --unit=re8ch-k3s-registry-restart --on-active=3s \
        /bin/systemctl restart "$service"
    fi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-registry-authority-installer
  namespace: registry-authority
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: k3s-registry-authority-installer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: k3s-registry-authority-installer}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      containers:
        - name: installer
          image: docker.io/library/alpine:3.22
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              /config/install.sh
              touch /state/installed
              exec sleep infinity
          env:
            # Installing the mirror configuration is safe to roll out to every
            # node. K3s activation is performed separately, one node at a time,
            # so a first deployment cannot restart the whole cluster together.
            - {name: RESTART_K3S, value: "false"}
          readinessProbe:
            exec: {command: [/bin/sh, -ec, test -f /state/installed]}
            periodSeconds: 5
          securityContext:
            privileged: true
          volumeMounts:
            - {name: host-root, mountPath: /host}
            - {name: installer, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - {name: host-root, hostPath: {path: /, type: Directory}}
        - {name: installer, configMap: {name: k3s-registry-authority-installer, defaultMode: 0555}}
        - {name: state, emptyDir: {}}
