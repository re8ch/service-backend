apiVersion: v1
kind: Namespace
metadata:
  name: registry-authority
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-registry-authority-installer
  namespace: registry-authority
data:
  registries-prefix.yaml: |
    mirrors:
      docker.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-dockerhub/$1"}
      ghcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-ghcr/$1"}
      gcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-gcr/$1"}
      quay.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-quay/$1"}
      nvcr.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-nvcr/$1"}
      registry.k8s.io:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-k8s/$1"}
      mcr.microsoft.com:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-mcr/$1"}
      docker.elastic.co:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-elastic/$1"}
      container-registry.oracle.com:
        endpoint: ["https://registry.re8ch.com"]
        rewrite: {"^(.*)$": "proxy-oracle/$1"}
      registry.re8ch.com:
        endpoint: ["https://registry.re8ch.com"]
  install.sh: |
    #!/bin/sh
    set -eu

    host=/host
    registry_dir="$host/etc/rancher/k3s"
    registry_file="$registry_dir/registries.yaml"
    hosts_file="$host/etc/hosts"
    prefix=/config/registries-prefix.yaml
    mkdir -p "$registry_dir"
    work=$(mktemp "$registry_dir/.registries.yaml.XXXXXX")
    trap 'rm -f "$work"' EXIT
    cp "$prefix" "$work"
    if [ -f "$registry_file" ] && grep -q '^configs:' "$registry_file"; then
      awk '/^configs:/{copy=1} copy{print}' "$registry_file" >>"$work"
    else
      printf 'configs: {}\n' >>"$work"
    fi

    changed=true
    if [ -f "$registry_file" ] && cmp -s "$work" "$registry_file"; then
      changed=false
    else
      if [ -f "$registry_file" ]; then
        cp -p "$registry_file" "$registry_file.pre-re8ch-authority"
      fi
      install -m 0600 "$work" "$registry_file"
    fi

    # Kubelet/containerd runs in the host network namespace, where public DNS
    # can hairpin registry.re8ch.com through the edge instead of reaching the
    # in-cluster Harbor origin. Keep the stable Harbor Service IP authoritative
    # for node-local image pulls.
    hosts_work=$(mktemp "$host/etc/.hosts.XXXXXX")
    awk '
      {
        keep=1
        for (i=2; i<=NF; i++) if ($i == "registry.re8ch.com") keep=0
        if (keep) print
      }
    ' "$hosts_file" >"$hosts_work"
    printf '%s\n' '192.0.2.218 registry.re8ch.com # re8ch cluster-local Harbor origin' >>"$hosts_work"
    cat "$hosts_work" >"$hosts_file"
    rm -f "$hosts_work"

    # K3s/containerd is infrastructure and must never depend on Mihomo or an
    # airport being reachable. Image sources are mirrored through the internal
    # Harbor origin above; remove the former node-local proxy dependency from
    # both possible K3s units.
    for service in k3s-agent k3s; do
      proxy_dropin="$host/etc/systemd/system/$service.service.d/20-re8ch-registry-egress.conf"
      if [ -e "$proxy_dropin" ]; then
        rm -f "$proxy_dropin"
        changed=true
      fi
    done

    # This pod has its own PID namespace. Chrooting into the host filesystem
    # cannot reach the host systemd bus; host activation is a separate rollout.
    printf 'registry-authority changed=%s\n' "$changed"
    if [ "${RESTART_K3S:-false}" = true ] && [ "$changed" = true ]; then
      # Some former servers retain a disabled k3s.service alongside the active
      # agent unit. Never start a second control plane while activating config.
      service=
      if chroot "$host" systemctl is-active --quiet k3s-agent; then
        service=k3s-agent
      elif chroot "$host" systemctl is-active --quiet k3s; then
        service=k3s
      else
        printf 'no active k3s unit found\n' >&2
        exit 1
      fi
      chroot "$host" systemd-run --quiet --collect \
        --unit=re8ch-k3s-registry-restart --on-active=3s \
        /bin/systemctl restart "$service"
    fi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-registry-authority-installer
  namespace: registry-authority
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: k3s-registry-authority-installer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: k3s-registry-authority-installer}
    spec:
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      containers:
        - name: installer
          # Cilium initializes before this DaemonSet and leaves this digest in
          # containerd. Reuse it so registry bootstrap does not need a mirror.
          image: quay.io/cilium/cilium-ci@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              /config/install.sh
              touch /state/installed
              exec sleep infinity
          env:
            # Installing the mirror configuration is safe to roll out to every
            # node. K3s activation is performed separately, one node at a time,
            # so a first deployment cannot restart the whole cluster together.
            - {name: RESTART_K3S, value: "false"}
          readinessProbe:
            exec: {command: [/bin/sh, -ec, test -f /state/installed]}
            periodSeconds: 5
          securityContext:
            privileged: true
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: host-root, mountPath: /host}
            - {name: installer, mountPath: /config, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - {name: host-root, hostPath: {path: /, type: Directory}}
        - {name: installer, configMap: {name: k3s-registry-authority-installer, defaultMode: 0555}}
        - {name: state, emptyDir: {}}
