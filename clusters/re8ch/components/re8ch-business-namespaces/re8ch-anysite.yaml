apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: anysite-postgrest
    app.kubernetes.io/part-of: anysite
  name: anysite-postgrest
  namespace: re8ch-anysite
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: anysite-postgrest
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-21T01:15:15+08:00'
      labels:
        app.kubernetes.io/name: anysite-postgrest
        app.kubernetes.io/part-of: anysite
    spec:
      containers:
      - env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              key: PGRST_DB_URI
              name: anysite-db-credentials
        - name: PGRST_DB_SCHEMAS
          value: scale
        - name: PGRST_DB_ANON_ROLE
          value: anysite_app_ro
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: PGRST_JWT_SECRET
              name: anysite-db-credentials
        - name: PGRST_DB_POOL
          value: '10'
        - name: PGRST_ADMIN_SERVER_PORT
          value: '3001'
        - name: PGRST_ADMIN_SERVER_HOST
          value: 127.0.0.1
        image: mjhsdd6xkcym4k.xuanyuan.run/postgrest/postgrest:v14.12
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        name: postgrest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: r640
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-api
  namespace: re8ch-anysite
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: scale-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-22T16:37:00+08:00'
      labels:
        app: scale-api
    spec:
      containers:
      - args:
        - uvicorn
        - scale.api:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: SCALE_DATABASE_URL
          value: http://10.43.70.93:3000
        - name: SCALE_POSTGREST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: PGRST_JWT_SECRET
              name: anysite-db-credentials
        - name: SCALE_EMBEDDED_WORKER
          value: 'false'
        - name: SCALE_SCENE_ASSET_DIR
          value: /var/cache/scale/scenes
        - name: SCALE_SCENE_GPU_ENABLED
          value: 'false'
        - name: SCALE_CORS_ORIGINS
          value: https://anysiteonearth.re8ch.com,https://anysiteonearth.pages.dev,https://agent-scale-v1-1.anysiteonearth.pages.dev,https://agent-scale-v1-1-ek2j.anysiteonearth.pages.dev,http://localhost:3000
        - name: SCALE_SENTINEL1_COLLECTION
          value: sentinel-1-rtc
        - name: SCALE_ERA5_URL
          value: https://archive-api.open-meteo.com/v1/archive
        image: registry.re8ch.com/anysite/scale:1.4.1-20260728.1
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/cache/scale
          name: cache
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: r640
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: scale-cache
---
