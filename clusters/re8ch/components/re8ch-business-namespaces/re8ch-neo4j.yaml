apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: re8ch-knowledge-graph
  name: neo4j
  namespace: re8ch-neo4j
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  serviceName: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: re8ch-knowledge-graph
    spec:
      containers:
      - env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              key: NEO4J_AUTH
              name: neo4j-auth
        - name: NEO4J_PLUGINS
          value: '["apoc","graph-data-science","genai"]'
        - name: NEO4J_server_memory_heap_initial__size
          value: 4G
        - name: NEO4J_server_memory_heap_max__size
          value: 4G
        - name: NEO4J_server_memory_pagecache_size
          value: 4G
        - name: NEO4J_dbms_security_procedures_allowlist
          value: apoc.*,gds.*,genai.*
        - name: NEO4J_dbms_security_procedures_unrestricted
          value: apoc.*,gds.*,genai.*
        - name: NEO4J_server_default__listen__address
          value: 0.0.0.0
        - name: NEO4J_server_default__advertised__address
          value: neo4j.re8ch.com
        - name: NEO4J_server_bolt_advertised__address
          value: neo4j.re8ch.com:7687
        - name: NEO4J_server_http_advertised__address
          value: neo4j.re8ch.com:7474
        image: neo4j:2026.06.0-community
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - grep
            - 1D32
            - /proc/net/tcp6
          failureThreshold: 3
          initialDelaySeconds: 120
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: neo4j
        ports:
        - containerPort: 7474
          name: http
          protocol: TCP
        - containerPort: 7687
          name: bolt
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - grep
            - 1D32
            - /proc/net/tcp6
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
          requests:
            cpu: '1'
            memory: 10Gi
        startupProbe:
          exec:
            command:
            - grep
            - 1D32
            - /proc/net/tcp6
          failureThreshold: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /plugins
          name: plugins
        - mountPath: /logs
          name: logs
        - mountPath: /conf/apoc.conf
          name: config
          readOnly: true
          subPath: apoc.conf
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: r640
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 120
      volumes:
      - configMap:
          defaultMode: 420
          name: neo4j-config
        name: config
      - emptyDir: {}
        name: logs
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
      storageClassName: local-path
      volumeMode: Filesystem
    status:
      phase: Pending
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: plugins
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
      volumeMode: Filesystem
    status:
      phase: Pending
---
