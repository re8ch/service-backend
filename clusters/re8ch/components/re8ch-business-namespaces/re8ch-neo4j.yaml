apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledger-casegraph-backup
  namespace: re8ch-neo4j
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          - args:
            - "user=\"${NEO4J_AUTH%%/*}\"\npassword=\"${NEO4J_AUTH#*/}\"\nstamp=\"\
              $(date -u +%Y%m%dT%H%M%SZ)\"\n/var/lib/neo4j/bin/cypher-shell \\\n \
              \ -a neo4j://ledger-casegraph.neo4j.svc.cluster.local:7687 \\\n  -u\
              \ \"$user\" -p \"$password\" \\\n  \"CALL apoc.export.cypher.all('backups/ledger-casegraph-${stamp}.cypher',{format:'cypher-shell'})\"\
              \n"
            command:
            - /bin/bash
            - -ceu
            env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  key: NEO4J_AUTH
                  name: ledger-casegraph-auth
            image: neo4j:2026.06.0-community
            imagePullPolicy: IfNotPresent
            name: logical-backup
            resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  schedule: 17 2 * * *
  successfulJobsHistoryLimit: 3
  suspend: false
---
