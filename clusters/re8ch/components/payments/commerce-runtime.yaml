apiVersion: apps/v1
kind: Deployment
metadata: {name: commerce-api, namespace: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app: commerce-api}}
  template:
    metadata: {labels: {app: commerce-api}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets: [{name: harbor-hyperswitch-admin}]
      containers:
        - name: commerce-api
          image: registry.re8ch.com/hyperswitch/processor-commerce-api@sha256:dbfc6ae7b7eaa04ba654ef416ac7e0cb847c1b08171b11796585702cebeadc1d
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: commerce-api-secrets}}]
          env:
            - {name: WX_PAY_MCH_ID, valueFrom: {secretKeyRef: {name: commerce-ruiqi-merchant-certificate, key: WX_PAY_MCH_ID}}}
            - {name: WX_PAY_SERIAL_NO, valueFrom: {secretKeyRef: {name: commerce-ruiqi-merchant-certificate, key: WX_PAY_SERIAL_NO}}}
            - {name: WX_PAY_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: commerce-ruiqi-merchant-certificate, key: WX_PAY_PRIVATE_KEY}}}
            - {name: WX_PAY_API_V3_KEY, valueFrom: {secretKeyRef: {name: commerce-ruiqi-api-v3, key: WX_PAY_API_V3_KEY}}}
            - {name: WX_PAY_PLATFORM_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: commerce-ruiqi-platform-certificate, key: WX_PAY_PLATFORM_PUBLIC_KEY}}}
            - {name: WX_PAY_PLATFORM_SERIAL_NO, valueFrom: {secretKeyRef: {name: commerce-ruiqi-platform-certificate, key: WX_PAY_PLATFORM_SERIAL_NO}}}
            - {name: WX_PAY_APP_ID, valueFrom: {secretKeyRef: {name: commerce-wechat-app-identities, key: WX_PAY_APP_ID}}}
            - {name: WECHAT_MINI_APP_ID, valueFrom: {secretKeyRef: {name: commerce-wechat-app-identities, key: WECHAT_MINI_APP_ID}}}
            - {name: RE8CH_AUTH_BASE_URL, value: "https://api.re8ch.com/auth"}
            - {name: COMMERCE_RW_URL, value: "https://db-rw.re8ch.com/commerce"}
            - {name: COMMERCE_RO_URL, value: "https://db-ro.re8ch.com/commerce"}
            - {name: WX_PAY_NOTIFY_URL, value: "https://api.re8ch.com/commerce/v1/webhooks/wechat"}
            - {name: COMMERCE_CHECKOUT_ENABLED, value: "false"}
            - {name: COMMERCE_MINI_CHECKOUT_ENABLED, value: "false"}
          readinessProbe: {httpGet: {path: /v1/readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /v1/healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
