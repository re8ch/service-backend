# Secrets billing-payment-postgrest-secrets and payment-registry-secrets
# are provisioned out of band.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nuclio-payment-registry-api
  namespace: payments
data:
  processor.yaml: |
    metadata:
      name: payment-registry-api
      namespace: payments
    spec:
      runtime: golang
      handler: main:Handler
      eventTimeout: 60s
      triggers:
        default-http:
          kind: http
          mode: sync
          name: default-http
          attributes:
            serviceType: ClusterIP
            maxRequestBodySize: 1048576
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-postgrest
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment-postgrest}
  template:
    metadata:
      labels: {app: payment-postgrest}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgrest
          image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: billing-payment-postgrest-secrets, key: PGRST_DB_URI_RW}}
            - {name: PGRST_DB_SCHEMAS, value: payment_api}
            - {name: PGRST_DB_ANON_ROLE, value: payment_anon}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: billing-payment-postgrest-secrets, key: PGRST_JWT_SECRET}}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-postgrest
  namespace: payments
spec:
  selector: {app: payment-postgrest}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-postgrest-ro, namespace: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-postgrest-ro}}
  template:
    metadata: {labels: {app: payment-postgrest-ro}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgrest
          image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 3000}]
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: billing-payment-postgrest-secrets, key: PGRST_DB_URI_RO}}
            - {name: PGRST_DB_SCHEMAS, value: payment_api}
            - {name: PGRST_DB_ANON_ROLE, value: payment_anon}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: billing-payment-postgrest-secrets, key: PGRST_JWT_SECRET}}
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: payment-postgrest-ro, namespace: payments}
spec: {selector: {app: payment-postgrest-ro}, ports: [{name: http, port: 3000, targetPort: http}]}
---
# The RO hostname uses the primary until the Pigsty replica contains this
# database. The payment API invokes only read RPCs through that hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-postgrest-rw
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-rw-https}
  hostnames: [db-rw.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /payment}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: payment-postgrest, port: 3000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-postgrest-ro
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-ro-https}
  hostnames: [db-ro.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /payment}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}
      backendRefs: [{name: payment-postgrest-ro, port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nuclio-payment-registry-api, namespace: payments}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: payment-registry-api}}
  template:
    metadata: {labels: {app: payment-registry-api}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets: [{name: harbor-hyperswitch-admin}]
      containers:
        - name: payment-registry-api
          image: registry.re8ch.com/hyperswitch/processor-payment-registry-api@sha256:f5e5fc8423d49237bcb097cbb92054ff42f15f7ff7c9aa201738a048cd4c424b
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - secretRef: {name: payment-registry-secrets}
          env:
            - {name: BILLING_CREDITS_ENABLED, value: "true"}
            - {name: CREDITS_DISPATCH_ENABLED, value: "false"}
            - {name: HYPERSWITCH_PROFILE_ID, value: pro_DrrIuD3GsS8AlvOkJCvo}
            - {name: PAYMENT_POSTGREST_RW_BASE_URL, value: "http://payment-postgrest.payments.svc.cluster.local:3000"}
            - {name: PAYMENT_POSTGREST_RO_BASE_URL, value: "http://payment-postgrest-ro.payments.svc.cluster.local:3000"}
          readinessProbe: {httpGet: {path: /v1/readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /v1/healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: nuclio-payment-registry-api
  namespace: payments
spec:
  selector: {app: payment-registry-api}
  ports: [{name: http, port: 8080, targetPort: http}]
