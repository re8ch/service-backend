apiVersion: v1
kind: Namespace
metadata:
  name: mcp-registry
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mcp-registry-postgresql-r640
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-r640
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [restricted-node-6dc3f140f9]
  hostPath:
    path: /var/lib/re8ch/mcp-registry-postgresql
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-registry-postgresql-r640
  namespace: mcp-registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual-r640
  volumeName: mcp-registry-postgresql-r640
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcp-registry-postgresql-ab
  namespace: mcp-registry
  labels:
    storage.re8ch.com/replicated-approved: "true"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs-re8ch
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mcp-registry
spec:
  selector:
    app.kubernetes.io/name: mcp-registry-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-registry-postgresql
  namespace: mcp-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-registry-postgresql
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # The registry data already lives on the replicated CephFS
                    # claim, so its database must not reintroduce an restricted-node-6dc3f140f9 MCP
                    # runtime dependency.
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
      containers:
        - name: postgresql
          image: postgres:16.9-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mcp-registry
            - name: POSTGRES_USER
              value: mcpregistry
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-registry-runtime
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U mcpregistry -d mcp-registry"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-registry-postgresql-ab
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  type: ClusterIP
  trafficDistribution: PreferSameNode
  selector:
    app.kubernetes.io/name: mcp-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  replicas: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-registry
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mcp-registry
              topologyKey: kubernetes.io/hostname
      containers:
        - name: registry
          # GHCR did not publish the v1.7.9 tag; pin the release-channel
          # multi-architecture index resolved from `latest` on 2026-08-03.
          image: ghcr.io/modelcontextprotocol/registry@sha256:1b416da8aeccf85f720d7787ef3119d0199773a81adea479d877810bde801dfc
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MCP_REGISTRY_SERVER_ADDRESS
              value: :8080
            - name: MCP_REGISTRY_VERSION
              value: v1.8.0-re8ch
            - name: MCP_REGISTRY_ENVIRONMENT
              value: production
            - name: MCP_REGISTRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-registry-runtime
                  key: DATABASE_URL
            - name: MCP_REGISTRY_JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-registry-runtime
                  key: JWT_PRIVATE_KEY
            - name: MCP_REGISTRY_ENABLE_ANONYMOUS_AUTH
              value: "false"
            - name: MCP_REGISTRY_ENABLE_REGISTRY_VALIDATION
              value: "true"
          readinessProbe:
            httpGet: {path: /v0/servers, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-registry
  namespace: mcp-registry
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-ingress
  namespace: mcp-registry
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-registry-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-registry
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: toolhive-system
      ports:
        - protocol: TCP
          port: 5432
