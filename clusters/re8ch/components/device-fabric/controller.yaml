apiVersion: v1
kind: Namespace
metadata:
  name: edge-devices
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: device-fabric-controller
  namespace: edge-devices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: device-fabric-controller
rules:
  - apiGroups: [devices.re8ch.com]
    resources: [edgedevices, deviceservices]
    verbs: [get, list, watch]
  - apiGroups: [devices.re8ch.com]
    resources: [deviceservices/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, tlsroutes, tcproutes, udproutes]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: device-fabric-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: device-fabric-controller
subjects:
  - kind: ServiceAccount
    name: device-fabric-controller
    namespace: edge-devices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-fabric-controller
  namespace: edge-devices
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: device-fabric-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: device-fabric-controller}
      annotations:
        devices.re8ch.com/source-sha256: 33ac688c3da4a575a68aa7bd11ca666a8df69f7e5dbd5583dee5f400d105160b
    spec:
      serviceAccountName: device-fabric-controller
      nodeSelector:
        kubernetes.io/hostname: r640
      containers:
        - name: controller
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/re8ch/controller/controller.py]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: controller-source
              mountPath: /opt/re8ch/controller
              readOnly: true
      volumes:
        - name: controller-source
          configMap:
            name: device-fabric-controller-source
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r640-usb-dra
  namespace: edge-devices
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: r640-usb-dra
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: r640-usb-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: r640-usb-dra
subjects:
  - kind: ServiceAccount
    name: r640-usb-dra
    namespace: edge-devices
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: r640-usb-dra
  namespace: edge-devices
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: r640-usb-dra}
  template:
    metadata:
      labels: {app.kubernetes.io/name: r640-usb-dra}
      annotations:
        devices.re8ch.com/binary-sha256: a3dba7a3e721022fa4a7adf0e4a6851234ec97638fb75aedae266766d4017b50
    spec:
      serviceAccountName: r640-usb-dra
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
        - {operator: Exists, effect: NoSchedule}
      containers:
        - name: driver
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command: [/opt/re8ch/bin/r640-usb-dra]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: sys-usb, mountPath: /sys/bus/usb/devices, readOnly: true}
            - {name: dev-usb, mountPath: /dev/bus/usb}
            - {name: kubelet-plugins, mountPath: /var/lib/kubelet/plugins}
            - {name: kubelet-registry, mountPath: /var/lib/kubelet/plugins_registry}
            - {name: cdi, mountPath: /etc/cdi}
            - {name: driver-binary, mountPath: /opt/re8ch/bin, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      volumes:
        - name: sys-usb
          hostPath: {path: /sys/bus/usb/devices, type: Directory}
        - name: dev-usb
          hostPath: {path: /dev/bus/usb, type: Directory}
        - name: kubelet-plugins
          hostPath: {path: /var/lib/kubelet/plugins, type: DirectoryOrCreate}
        - name: kubelet-registry
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: DirectoryOrCreate}
        - name: cdi
          hostPath: {path: /etc/cdi, type: DirectoryOrCreate}
        - name: driver-binary
          hostPath: {path: /opt/re8ch-infra/device-fabric/bin, type: Directory}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: re8ch-usb
spec:
  selectors:
    - cel:
        expression: device.driver == "usb.devices.re8ch.com"
