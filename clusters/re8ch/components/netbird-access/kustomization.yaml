apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - control-plane.yaml
  - routing-peers.yaml
  - mihomo-gateway.yaml
  - egress-probe.yaml
  - network-policy.yaml
configMapGenerator:
  - name: netbird-quality-benchmark
    namespace: netbird-access
    files:
      - quality-benchmark.sh
generatorOptions:
  disableNameSuffixHash: true
