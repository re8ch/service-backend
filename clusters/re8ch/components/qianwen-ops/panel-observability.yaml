kind: Service
metadata:
  name: panel-re8ch-vmalert
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-re8ch-vmalert
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-re8ch-vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-pigsty-vmalert
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-pigsty-vmalert
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-pigsty-vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-pigsty-vmalert
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: artchais-nuclio-1
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/*.yml
            - -datasource.url=http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428?extra_label=source%3Dpigsty
            - -remoteWrite.url=http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428
            - -evaluationInterval=30s
            - -external.label=source=pigsty
            - -notifier.blackhole=true
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: panel-pigsty-vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: panel-pigsty-vmalert
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-pigsty-vmalert
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-pigsty-vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
