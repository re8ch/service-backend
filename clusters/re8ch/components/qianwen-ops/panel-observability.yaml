    #!/usr/bin/env python3
    import json
    import os
    import re
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    VM_SERVICE_HOST = os.getenv("PANEL_VICTORIA_METRICS_SERVICE_HOST", "panel-victoria-metrics.qianwen-ops.svc.cluster.local")
    UPSTREAM = os.getenv("VM_UPSTREAM", "http://%s:8428" % VM_SERVICE_HOST).rstrip("/")
    TENANTS = {
        "qianwen": {"tenant": "qianwen", "namespaces": ["qwen"], "databases": ["qianwen_prod", "qianwen_test", "cardcat"]},
        "ledger": {"tenant": "ledger", "namespaces": ["ledger"], "databases": ["ledger"]},
        "anycam": {"tenant": "anycam", "namespaces": ["anycam"], "databases": ["anycam_prod"]},
        "bench": {"tenant": "bench", "namespaces": ["bench"], "databases": ["bench"]},
        "cardcat": {"tenant": "cardcat", "namespaces": ["cardcat"], "databases": ["cardcat"]},
    }
    QUERY_ENDPOINTS = {"api/v1/query", "api/v1/query_range"}
    READONLY_ENDPOINTS = {"api/v1/status/buildinfo"}
    METADATA_ENDPOINTS = {"api/v1/labels", "api/v1/series"}
    SHARED_TENANTS = {"re8ch"}
    SHARED_PIGSTY_INS = ["pg-meta-1", "pg-meta-2", "pg-meta-3"]
    SHARED_PIGSTY_IPS = ["192.0.2.89", "192.0.2.112", "192.0.2.251"]
    SHARED_SYSTEM_DATABASES = {"wal", "log", "pgbouncer", "template0", "template1"}
    TENANT_DB_METRIC_PREFIXES = (
        "pg_db",
        "pg:db:",
        "pg_table",
        "pg:table:",
        "pg_query",
        "pg:query:",
        "pg_activity",
        "pg_lock",
        "pg_size",
        "pg_index",
        "pg_class",
        "pg_namespace",
        "pg_stat",
        "pgbouncer:db:",
        "pgbouncer_database",
    )
    SHARED_NODE_PATTERNS = [
        re.compile(r"\bnode_cpu_seconds_total\s*\{\s*node\s*="),
        re.compile(r"\brate\s*\(\s*node_cpu_seconds_total\s*\{\s*node\s*="),
        re.compile(r"\bup\s*\{\s*job\s*=~\s*\"\.\*node\.\*\""),
        re.compile(r"\bup\s*\{\s*ip\s*=~"),
        re.compile(r"\bup\s*\{[^{}]*\bcls\s*=~?\s*\"(?:nginx|grafana|vmetrics|vlogs|vtraces|vmalert|alertmanager)\"[^{}]*\bip\s*=~?"),
        re.compile(r"\bup\s*\{[^{}]*\bjob\s*=~?\s*\"juice\"[^{}]*\bip\s*=~?"),
        re.compile(r"\bkube_node_status_condition\s*\{\s*condition\s*=\s*\"Ready\"\s*,\s*status\s*=\s*\"true\""),
        re.compile(r"\bpg_up\s*\{\s*source\s*=\s*\"pigsty\""),
        re.compile(r"\bup\s*\{\s*job\s*=\s*\"pgsql\""),
        re.compile(r"\bup\s*\{[^{}]*\bcls\s*=~?\s*\"pg-meta\"[^{}]*\bjob\s*=~?\s*\"pgsql\""),
        re.compile(r"\b(?:docker|etcd|redis|minio|mongo|mysql|mysql_exporter|vector)_up(?:\{|,|\)|$)"),
        re.compile(r"\bnode_up(?:\{|,|\)|$)"),
        re.compile(r"\bnode_load[0-9]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode_uname_info(?:\{|,|\)|$)"),
        re.compile(r"\bnode_memory_[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode_filesystem_[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode:fs:[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode:cpu:[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode:dev:[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode:cls:[A-Za-z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bup\s*\{[^{}]*\bjob\s*=~?\s*\"etcd\"[^{}]*\bcls\s*=~?\s*\"etcd\""),
        re.compile(r"\bup\s*\{[^{}]*\bcls\s*=~?\s*\"etcd\"[^{}]*\bjob\s*=~?\s*\"etcd\""),
        re.compile(r"\betcd_server_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bprobe_duration_seconds(?:\{|,|\)|$)"),
        re.compile(r"\bprobe_success\s*\{[^{}]*\bjob\s*=~?\s*\"pgsql-vip\""),
    ]
    SHARED_PIGSTY_CLUSTER_PATTERNS = [
        re.compile(r"\bpg_up(?:\{|,|\)|$)"),
        re.compile(r"\bpg:cls:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg:ins:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg:env:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bcls:pressure1(?:\{|,|\)|$)"),
        re.compile(r"\bpg_in_recovery(?:\{|,|\)|$)"),
        re.compile(r"\bpg_uptime(?:\{|,|\)|$)"),
        re.compile(r"\bpg_meta_info(?:\{|,|\)|$)"),
        re.compile(r"\bpatroni_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer:ins:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bhaproxy_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bhaproxy_process_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bhaproxy_process_[a-zA-Z0-9_:]+\s*\{"),
        re.compile(r"\bpgbackrest_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_lock_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_lsn(?:\{|,|\)|$)"),
        re.compile(r"\bpg_repl_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_lag(?:\{|,|\)|$)"),
        re.compile(r"\bpg_recv_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_sync_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_pub[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_sub[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_slot_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_timeline_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_xact_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_checkpoint_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_checkpointer_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_bgwriter_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_backend_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_wait_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_setting_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_archiver_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_io_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_version(?:\{|,|\)|$)"),
        re.compile(r"\bpg_conf_reload_time(?:\{|,|\)|$)"),
        re.compile(r"\bpg_is_wal_replay_paused(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer:cls:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer_up(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer_stat_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bnode:ins:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bhaproxy:ins:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bhaproxy:cls:[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bprocess_cpu_seconds_total(?:\{|,|\)|$)"),
        re.compile(r"\bins:pressure1(?:\{|,|\)|$)"),
        re.compile(r"\bpg_exporter_agent_up(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer_exporter_agent_up(?:\{|,|\)|$)"),
        re.compile(r"\bpgbackrest_exporter_agent_up(?:\{|,|\)|$)"),
        re.compile(r"\bpg_exporter_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpgbouncer_exporter_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpgbackrest_exporter_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bpg_backup_[a-zA-Z0-9_:]+(?:\{|,|\)|$)"),
        re.compile(r"\bup\s*\{[^{}]*\bins\s*=~?\s*\"pg-meta-[123]\"[^{}]*\bjob\s*=~?\s*\"pgsql\|pgrds\""),
        re.compile(r"\bup\s*\{[^{}]*\bins\s*=~?\s*\"pg-meta-[123]\"[^{}]*\bjob\s*=~?\s*\"pgrds\|pgsql\""),
        re.compile(r"\bup\s*\{[^{}]*\bcls\s*=~?\s*[\"']pg-meta\.\*[\"'][^{}]*\bjob\s*=~?\s*[\"']pgsql\|pgrds[\"']"),
        re.compile(r"\bup\s*\{[^{}]*\bcls\s*=~?\s*[\"']pg-meta\.\*[\"'][^{}]*\bjob\s*=~?\s*[\"']pgrds\|pgsql[\"']"),
        re.compile(r"\bpg_downstream_count(?:\{|,|\)|$)"),
        re.compile(r"\bALERTS(?:\{|,|\)|$)"),
    ]

    def query_looks_cross_tenant(cfg, query):
        allowed_tenant = cfg["tenant"]
        allowed_namespaces = set(cfg["namespaces"])
        allowed_databases = set(cfg.get("databases", []))
        for label, value in re.findall(r'\b(tenant|namespace|kubernetes_namespace|kubernetes_pod_namespace|datname|database)\s*=~?\s*"([^"]+)"', query or ""):
            values = {re.sub(r"[^A-Za-z0-9_-]", "", part) for part in re.split(r"[|,]", value) if part}
            if label == "tenant" and any(part != allowed_tenant and part not in SHARED_TENANTS for part in values):
                return True
            if label in ("datname", "database"):
                allowed_db_values = allowed_databases | SHARED_SYSTEM_DATABASES
                if any(part not in allowed_db_values and not part.startswith("template") for part in values):
                    return True
                continue
            if label != "tenant" and any(part not in allowed_namespaces for part in values):
                return True
        for tenant, other in TENANTS.items():
            if tenant != allowed_tenant and tenant not in allowed_databases and re.search(r"\b%s\b" % re.escape(tenant), query or ""):
                return True
            for namespace in other["namespaces"]:
                if namespace not in allowed_namespaces and namespace not in allowed_databases and re.search(r"\b%s\b" % re.escape(namespace), query or ""):
                    return True
        return False

    def tenantize_db_metric_query(cfg, query):
        def replace_selector(match):
            metric = match.group("metric")
            labels = match.group("labels")
            if not metric.startswith(TENANT_DB_METRIC_PREFIXES):
                return match.group(0)
            if re.search(r'\btenant\s*=~?\s*["\']', labels):
                return match.group(0)
            labels = labels.strip()
            if labels:
                labels = 'tenant="%s",%s' % (cfg["tenant"], labels)
            else:
                labels = 'tenant="%s"' % cfg["tenant"]
            return "%s{%s}" % (metric, labels)
        query = re.sub(r'(?P<metric>\b[a-zA-Z_:][a-zA-Z0-9_:]*)\s*\{(?P<labels>[^{}]*)\}', replace_selector, query)
        for prefix in TENANT_DB_METRIC_PREFIXES:
            query = re.sub(
                r'(?<![A-Za-z0-9_:])(%s[A-Za-z0-9_:]*)(?!\s*\{|[A-Za-z0-9_:])' % re.escape(prefix),
                r'\1{tenant="%s"}' % cfg["tenant"],
                query,
            )
        return query

    def query_is_allowed(cfg, query):
        query = (query or "").strip()
        if not query:
            return False
        if re.fullmatch(r"\s*(?:vector\s*\(\s*)?-?\d+(?:\.\d+)?\s*\)?\s*", query):
            return True
        if query_looks_cross_tenant(cfg, query):
            return False
        if query.startswith(TENANT_DB_METRIC_PREFIXES):
            return True
        if any(pattern.search(query) for pattern in SHARED_PIGSTY_CLUSTER_PATTERNS):
            return True
        tenant_label = 'tenant="%s"' % cfg["tenant"]
        tenant_regex = 'tenant=~"%s"' % cfg["tenant"]
        shared_tenant_labels = ['tenant="%s"' % tenant for tenant in SHARED_TENANTS]
        shared_tenant_regexes = ['tenant=~"%s"' % tenant for tenant in SHARED_TENANTS]
        namespace_labels = []
        for namespace in cfg["namespaces"]:
            namespace_labels.extend([
                'namespace="%s"' % namespace,
                'kubernetes_namespace="%s"' % namespace,
                'kubernetes_pod_namespace="%s"' % namespace,
            ])
        database_labels = []
        for database in cfg.get("databases", []):
            database_labels.extend([
                'datname="%s"' % database,
                'database="%s"' % database,
            ])
        if (
            tenant_label in query
            or tenant_regex in query
            or any(label in query for label in shared_tenant_labels)
            or any(label in query for label in shared_tenant_regexes)
            or any(label in query for label in namespace_labels)
            or any(label in query for label in database_labels)
        ):
            return True
        for database in cfg.get("databases", []):
            if re.search(r'\b(datname|database)\s*=~\s*"[^"]*\b%s\b[^"]*"' % re.escape(database), query):
                return True
        return any(pattern.search(query) for pattern in SHARED_NODE_PATTERNS)

    def allowed_label_values(cfg, label):
        shared = {
            "tenant": [cfg["tenant"], "re8ch"],
            "namespace": cfg["namespaces"],
            "kubernetes_namespace": cfg["namespaces"],
            "kubernetes_pod_namespace": cfg["namespaces"],
            "datname": cfg.get("databases", []),
            "database": cfg.get("databases", []),
            "cls": ["k3s", "pg-meta", "pigsty-infra"],
            "ins": SHARED_PIGSTY_INS,
            "ip": SHARED_PIGSTY_IPS,
            "node": SHARED_PIGSTY_IPS,
            "nodename": ["pg-meta-1", "pg-meta-2", "pg-meta-3"],
            "job": [
                "http-probe",
                "k3s-node-exporter",
                "k8s-cadvisor",
                "advanced-fabric-dns",
                "k8s-kubelet",
                "k8s-traefik",
                "kube-state-metrics",
                "pigsty-infra-exporters",
                "pigsty-infra-node-exporter",
                "pigsty-pg-meta-node-exporter",
                "pgsql",
                "pgbouncer",
                "patroni",
                "haproxy",
                "pgbackrest",
            ],
        }
        return shared.get(label)

    def series_is_allowed(cfg, metric):
        tenant = metric.get("tenant")
        if tenant and tenant not in {cfg["tenant"], *SHARED_TENANTS}:
            return False
        datname = metric.get("datname") or metric.get("database")
        if datname and datname not in set(cfg.get("databases", [])):
            return False
        namespace = metric.get("namespace") or metric.get("kubernetes_namespace") or metric.get("kubernetes_pod_namespace")
        if namespace and namespace not in set(cfg["namespaces"]):
            return False
        return bool(tenant or datname or namespace or metric.get("source") in {"k3s", "pigsty"})

    def filter_metadata_response(cfg, rest, payload):
        data = payload.get("data")
        if rest == "api/v1/series" and isinstance(data, list):
            payload["data"] = [metric for metric in data if isinstance(metric, dict) and series_is_allowed(cfg, metric)]
        elif rest.startswith("api/v1/label/") and rest.endswith("/values") and isinstance(data, list):
            label = rest.removeprefix("api/v1/label/").removesuffix("/values")
            allowed = allowed_label_values(cfg, label)
            if allowed is not None:
                payload["data"] = [value for value in data if value in set(allowed)]
        elif rest == "api/v1/labels" and isinstance(data, list):
            payload["data"] = [label for label in data if label not in {"project", "stack", "tenant_id"}]
        return payload

    def read_body_params(handler):
        length = int(handler.headers.get("Content-Length") or 0)
        body = handler.rfile.read(length) if length else b""
        content_type = handler.headers.get("Content-Type", "application/x-www-form-urlencoded")
        if body and "application/x-www-form-urlencoded" in content_type:
            return body, urllib.parse.parse_qs(body.decode(), keep_blank_values=True), content_type
        return body, {}, content_type

    def open_upstream(req):
        last_exc = None
        for attempt in range(3):
            try:
                return urllib.request.urlopen(req, timeout=20)
            except urllib.error.URLError as exc:
                last_exc = exc
                if attempt == 2:
                    break
                time.sleep(0.2 * (attempt + 1))
        raise last_exc

    class Handler(BaseHTTPRequestHandler):
        def send_json(self, status, obj):
            data = json.dumps(obj).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def forward(self, method):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path in ("/health", "/-/healthy"):
                self.send_json(200, {"status": "ok"})
                return
            parts = parsed.path.strip("/").split("/", 1)
            if len(parts) != 2 or parts[0] not in TENANTS:
                self.send_json(404, {"status": "error", "error": "unknown tenant path"})
                return
            tenant, rest = parts
            cfg = TENANTS[tenant]
            body = None
            query = parsed.query
            headers = {}
            if rest in QUERY_ENDPOINTS:
                if method == "POST":
                    body, form, content_type = read_body_params(self)
                    headers["Content-Type"] = content_type
                    promql = form.get("query", [""])[0] if form else urllib.parse.parse_qs(query).get("query", [""])[0]
                    scoped_promql = tenantize_db_metric_query(cfg, promql)
                    if form and scoped_promql != promql:
                        form["query"] = [scoped_promql]
                        body = urllib.parse.urlencode(form, doseq=True).encode()
                    elif scoped_promql != promql:
                        params = urllib.parse.parse_qs(query, keep_blank_values=True)
                        params["query"] = [scoped_promql]
                        query = urllib.parse.urlencode(params, doseq=True)
                    promql = scoped_promql
                else:
                    promql = urllib.parse.parse_qs(query).get("query", [""])[0]
                    scoped_promql = tenantize_db_metric_query(cfg, promql)
                    if scoped_promql != promql:
                        params = urllib.parse.parse_qs(query, keep_blank_values=True)
                        params["query"] = [scoped_promql]
                        query = urllib.parse.urlencode(params, doseq=True)
                    promql = scoped_promql
                if not query_is_allowed(cfg, promql):
                    self.send_json(403, {"status": "error", "error": "query is outside tenant allowlist"})
                    return
            elif rest in READONLY_ENDPOINTS:
                pass
            elif rest.startswith("api/v1/label/") and rest.endswith("/values"):
                label = rest.removeprefix("api/v1/label/").removesuffix("/values")
                matches = urllib.parse.parse_qs(query).get("match[]", [])
                if any(not query_is_allowed(cfg, match) for match in matches):
                    self.send_json(403, {"status": "error", "error": "metadata query is outside tenant allowlist"})
                    return
                static_values = allowed_label_values(cfg, label) if not matches else None
                if static_values is not None:
                    self.send_json(200, {"status": "success", "data": static_values})
                    return
            elif rest in METADATA_ENDPOINTS:
                matches = urllib.parse.parse_qs(query).get("match[]", [])
                if any(not query_is_allowed(cfg, match) for match in matches):
                    self.send_json(403, {"status": "error", "error": "metadata query is outside tenant allowlist"})
                    return
            else:
                self.send_json(403, {"status": "error", "error": "endpoint is disabled for tenant datasource"})
                return
            target = "%s/%s" % (UPSTREAM, rest)
            if query:
                target += "?" + query
            req = urllib.request.Request(target, data=body, headers=headers, method=method)
            try:
                with open_upstream(req) as resp:
                    data = resp.read()
                    if rest in METADATA_ENDPOINTS or (rest.startswith("api/v1/label/") and rest.endswith("/values")):
                        try:
                            payload = json.loads(data.decode())
                            data = json.dumps(filter_metadata_response(cfg, rest, payload)).encode()
                        except Exception:
                            pass
                    self.send_response(resp.status)
                    self.send_header("Content-Type", resp.headers.get("Content-Type", "application/json"))
                    self.send_header("Content-Length", str(len(data)))
                    self.end_headers()
                    self.wfile.write(data)
            except Exception as exc:
                self.send_json(502, {"status": "error", "error": str(exc)})

        def do_GET(self):
            self.forward("GET")

        def do_POST(self):
            self.forward("POST")

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 39091), Handler).serve_forever()
