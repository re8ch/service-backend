apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-qwen-functions-vmagent-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-qwen-functions-vmagent
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 2m
      scrape_timeout: 20s

    scrape_configs:
      - job_name: qwen-functions-vmagent-self
        metrics_path: /metrics
        static_configs:
          - targets: ["127.0.0.1:8429"]
            labels:
              tenant: qianwen
              layer: observability
              category: vmagent
              service: functions-vmagent
              source: re8ch
              cls: qwen-vmagent
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'vmagent_remotewrite_.*|vm_promscrape_.*|process_.*|go_.*'
            action: keep

      - job_name: k8s-nuclio-functions
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - qwen
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: qwen
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_class]
            regex: function
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            regex: __NODE_NAME__
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:8080
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            target_label: function
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: ([^-]+).*
            target_label: tenant
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-([^-]+).*'
            target_label: layer
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-[^-]+-([^-]+).*'
            target_label: category
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-(.*)'
            target_label: service
            replacement: ${1}
          - target_label: source
            replacement: re8ch
          - target_label: cls
            replacement: qwen-function-metrics
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 're8ch_cloud_function_.*|re8ch_generation_task_failures_total'
            action: keep
          - source_labels: [path_template]
            regex: '.*/\.env|.*phpinfo.*|.*phpversion.*|.*pinfo\.php|/cgi-bin.*|/onvif.*|/\.git.*|/\.ht.*|/HNAP1|/boaform.*|/vendor/phpunit.*|.*/wp-.*|.*/xmlrpc\.php|.*/wlwmanifest\.xml'
            action: drop
          - source_labels: [path]
            regex: '.*/\.env|.*phpinfo.*|.*phpversion.*|.*pinfo\.php|/cgi-bin.*|/onvif.*|/\.git.*|/\.ht.*|/HNAP1|/boaform.*|/vendor/phpunit.*|.*/wp-.*|.*/xmlrpc\.php|.*/wlwmanifest\.xml'
            action: drop
          - source_labels: [path_template, path]
            separator: ';'
            regex: ';(.+)'
            target_label: path_template
            replacement: ${1}
            action: replace
          - regex: 'path|status|exported_.*'
            action: labeldrop

      - job_name: k8s-nuclio-functions-runtime
        scrape_interval: 2m
        scrape_timeout: 20s
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - qwen
                - ledger
                - anycam
                - nuclio
                - bench
                - cardcat
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_class]
            regex: function
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            regex: __NODE_NAME__
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:8090
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            target_label: function
          - source_labels: [__meta_kubernetes_pod_label_saas_re8ch_com_tenant]
            target_label: tenant
          - source_labels: [__meta_kubernetes_pod_label_saas_re8ch_com_layer]
            target_label: layer
          - source_labels: [__meta_kubernetes_pod_label_saas_re8ch_com_function]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: ([^-]+).*
            target_label: tenant
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-([^-]+).*'
            target_label: layer
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-[^-]+-([^-]+).*'
            target_label: category
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-(.*)'
            target_label: service
            replacement: ${1}
          - target_label: source
            replacement: re8ch
          - target_label: cls
            replacement: nuclio-runtime
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'nuclio_processor_.*|up'
            action: keep
          - regex: 'path|exported_.*'
            action: labeldrop
---
