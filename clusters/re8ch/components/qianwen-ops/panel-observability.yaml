apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-victoria-metrics-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: victoria-self
        static_configs:
          - targets: ["127.0.0.1:8428"]
            labels:
              node: rancher-panel
              source: k3s
              cls: observability

      - job_name: toolhive-mcp-control-plane
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["mcp-ops-observe-managed-proxy.toolhive-system.svc.cluster.local:8080"]
            labels:
              tenant: platform
              source: toolhive
              cls: mcp-control-plane
              access_level: observe
          - targets: ["mcp-ops-operate-managed-proxy.toolhive-system.svc.cluster.local:8080"]
            labels:
              tenant: platform
              source: toolhive
              cls: mcp-control-plane
              access_level: operate
          - targets: ["mcp-ops-admin-managed-proxy.toolhive-system.svc.cluster.local:8080"]
            labels:
              tenant: platform
              source: toolhive
              cls: mcp-control-plane
              access_level: admin
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'toolhive_mcp_.*|mcp_server_operation_.*|process_(cpu|resident_memory|start_time)_.*'
            action: keep

      - job_name: re8ch-network-exporters
        scrape_interval: 30s
        scrape_timeout: 15s
        static_configs:
          - targets:
              - "192.0.2.192:9788"
              - "192.0.2.178:9788"
              - "192.0.2.112:9788"
              - "192.0.2.182:9788"
              - "192.0.2.74:9788"
              - "192.0.2.138:9788"
              - "192.0.2.89:9788"
              - "192.0.2.79:9788"
            labels:
              tenant: re8ch
              source: host-network
              cls: network-economics

      - job_name: re8ch-routing-advisor
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["re8ch-routing-advisor.qianwen-ops.svc.cluster.local:9790"]
            labels:
              tenant: re8ch
              source: k3s
              cls: network-economics

      - job_name: advanced-fabric-node-measurements
        scrape_interval: 30s
        scrape_timeout: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: advanced-fabric-agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:19101
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: tenant
            replacement: re8ch
          - target_label: source
            replacement: advanced-fabric
          - target_label: cls
            replacement: network-tradeoff
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'advanced_fabric_(measurement_state|observable|structural_evidence_coverage)|re8ch_(network_path|dns_probe|doh_probe)_.*'
            action: keep

      - job_name: opencost
        scrape_interval: 60s
        scrape_timeout: 15s
        static_configs:
          - targets: ["opencost.opencost.svc.cluster.local:9003"]
            labels:
              tenant: re8ch
              source: k3s
              cls: cost-management

      - job_name: victoria-logs-self
        scrape_interval: 60s
        scrape_timeout: 10s
        static_configs:
          - targets: ["panel-victoria-logs.qianwen-ops.svc.cluster.local:9428"]
            labels:
              tenant: platform
              layer: observability
              category: logs
              service: victoria-logs
              node: rancher-panel
              source: k3s
              cls: observability
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'vl_.*|vm_.*|process_.*|go_.*'
            action: keep

      - job_name: victoria-logs-vlagent
        scrape_interval: 60s
        scrape_timeout: 10s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: panel-vlagent
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
          - target_label: tenant
            replacement: platform
          - target_label: layer
            replacement: observability
          - target_label: category
            replacement: logs
          - target_label: service
            replacement: vlagent
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: observability
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'vl_.*|vm_.*|process_.*|go_.*'
            action: keep

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
            labels:
              tenant: re8ch
              node: rancher-panel
              source: k3s
              cls: k3s

      - job_name: advanced-fabric-dns
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["192.0.2.149:9153"]
            labels:
              tenant: re8ch
              node: rancher-panel
              source: k3s
              cls: k3s

      # Scrape host-network and overlay-isolated services through the API
      # server proxy. This follows kube-prometheus' connectivity model and
      # avoids assuming the central VM node can route to every endpoint IP.
      - job_name: rook-ceph-manager
        scrape_interval: 30s
        scrape_timeout: 20s
        scheme: https
        metrics_path: /api/v1/namespaces/rook-ceph/services/http:rook-ceph-mgr:9283/proxy/metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
            labels: {tenant: platform, source: kubernetes-api-proxy, cls: ceph, service: ceph-manager}

      - job_name: rook-ceph-exporter
        scrape_interval: 60s
        scrape_timeout: 30s
        scheme: https
        metrics_path: /api/v1/namespaces/rook-ceph/services/http:rook-ceph-exporter:9926/proxy/metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
            labels: {tenant: platform, source: kubernetes-api-proxy, cls: ceph, service: ceph-exporter}

      - job_name: kagent-tools-metrics
        scrape_interval: 30s
        scrape_timeout: 20s
        scheme: https
        metrics_path: /api/v1/namespaces/kagent/services/http:kagent-tools-metrics:8085/proxy/metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        static_configs:
          - targets: ["kubernetes.default.svc:443"]
            labels: {tenant: platform, source: kubernetes-api-proxy, cls: application, namespace: kagent, service: kagent-tools}

      - job_name: k8s-traefik
        scrape_interval: 60s
        scrape_timeout: 10s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: traefik
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:9100
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s-gateway
          - target_label: tenant
            replacement: re8ch
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'traefik_(entrypoint|service|router)_.*|traefik_config_.*'
            action: keep
          - source_labels: [service]
            target_label: backend_service
          - source_labels: [service]
            regex: '^([^-]+)-nuclio-(.+)-8080@kubernetes$'
            target_label: namespace
            replacement: ${1}
          - source_labels: [service]
            regex: '^([^-]+)-nuclio-(.+)-8080@kubernetes$'
            target_label: function
            replacement: ${2}
          - source_labels: [function]
            regex: '^([^-]+).*'
            target_label: tenant
            replacement: ${1}
          - source_labels: [function]
            regex: '^[^-]+-([^-]+).*'
            target_label: layer
            replacement: ${1}
          - source_labels: [function]
            regex: '^[^-]+-[^-]+-([^-]+).*'
            target_label: category
            replacement: ${1}

      - job_name: pigsty-infra-node-exporter
        static_configs:
          - labels:
              tenant: re8ch
              source: pigsty
              cls: pigsty-infra
            targets:
              - "192.0.2.192:9100"
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip

      - job_name: pigsty-pg-meta-node-exporter
        static_configs:
          - labels:
              tenant: re8ch
              source: pigsty
              cls: pg-meta
            targets:
              - "192.0.2.89:9100"
              - "192.0.2.112:9100"
              - "192.0.2.251:9100"
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip

      - job_name: k3s-node-exporter
        scrape_interval: 60s
        scrape_timeout: 45s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: panel-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s
          - target_label: tenant
            replacement: re8ch

      - job_name: k8s-kubelet
        scrape_interval: 60s
        scrape_timeout: 45s
        max_scrape_size: 67108864
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: harbor-registry
            action: drop
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s
          - target_label: tenant
            replacement: re8ch

      - job_name: k8s-cadvisor
        scrape_interval: 120s
        scrape_timeout: 45s
        max_scrape_size: 67108864
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: harbor-registry
            action: drop
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s
          - target_label: tenant
            replacement: re8ch
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_fs_.*|container_network_.*|machine_.*'
            action: keep
          - source_labels: [container]
            regex: ''
            action: drop

      - job_name: pigsty-infra-exporters
        scrape_interval: 30s
        scrape_timeout: 20s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-icp-infra-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: node
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pigsty-infra
          - target_label: tenant
            replacement: re8ch

      - job_name: pigsty-pgsql-exporters
        scrape_interval: 30s
        scrape_timeout: 20s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-pg-meta-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: ins
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pg
            target_label: job
            replacement: pgsql
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pgbouncer
            target_label: job
            replacement: pgbouncer
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-patroni
            target_label: job
            replacement: patroni
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-haproxy
            target_label: job
            replacement: haproxy
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pgbackrest
            target_label: job
            replacement: pgbackrest
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pg-meta
        metric_relabel_configs:
          - source_labels: [datname]
            regex: 'qianwen_prod|qianwen_test|cardcat'
            target_label: tenant
            replacement: qianwen
          - source_labels: [datname]
            regex: 'ledger'
            target_label: tenant
            replacement: ledger
          - source_labels: [datname]
            regex: 'anycam_prod'
            target_label: tenant
            replacement: anycam
          - source_labels: [datname]
            regex: 'bench'
            target_label: tenant
            replacement: bench

      - job_name: http-probe
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - labels:
              tenant: platform
              layer: panel
              category: grafana
              service: portainer-grafana
              source: re8ch
              cls: http-probe
            targets:
              - https://grafana.re8ch.com/grafana/api/health
          - labels:
              tenant: platform
              layer: network
              category: planet
              service: zt-planet
              source: re8ch
              cls: http-probe
            targets:
              - https://zt.re8ch.com/
          - labels:
              tenant: re8ch
              layer: public
              category: api
              service: api-root
              source: re8ch
              cls: http-probe
            targets:
              - https://api.re8ch.com/health
          - labels:
              tenant: platform
              layer: registry
              category: harbor
              service: harbor-public
              source: re8ch
              cls: http-probe
            targets:
              - https://registry.re8ch.com/
          - labels:
              tenant: platform
              layer: registry
              category: harbor
              service: harbor-api-ping
              source: re8ch
              cls: http-probe
            targets:
              - https://registry.re8ch.com/api/v2.0/ping
          - labels:
              tenant: platform
              layer: registry
              category: harbor
              service: harbor-core-internal
              source: re8ch
              cls: http-probe
            targets:
              - http://core.harbor.svc.cluster.local:8080/api/v2.0/ping
          - labels:
              tenant: platform
              layer: registry
              category: harbor
              service: harbor-registry-v2
              source: re8ch
              cls: http-probe
            targets:
              - http://registry.harbor.svc.cluster.local:5000/v2/
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: panel-blackbox-exporter.qianwen-ops.svc.cluster.local:9115

      - job_name: harbor-trivy-adapter
        scrape_interval: 120s
        scrape_timeout: 30s
        static_configs:
          - targets: ["trivy-adapter.harbor.svc.cluster.local:8080"]
            labels:
              tenant: platform
              layer: registry
              category: scanner
              service: trivy-adapter
              source: k3s
              cls: harbor
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'trivy_.*|go_goroutines|go_memstats_alloc_bytes|process_cpu_seconds_total|process_resident_memory_bytes|up'
            action: keep

      - job_name: pigsty-blackbox-probe
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - labels:
              source: pigsty
              cls: pg-meta
            targets:
              - 192.0.2.192
              - 192.0.2.89
              - 192.0.2.112
              - 192.0.2.251
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: pigsty-icp-infra-exporters.qianwen-ops.svc.cluster.local:9115
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: panel-victoria-metrics-discovery
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services", "services/proxy", "pods", "nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: panel-victoria-metrics-discovery
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
subjects:
  - kind: ServiceAccount
    name: panel-victoria-metrics
    namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: panel-victoria-metrics-discovery
---
apiVersion: v1
kind: Service
metadata:
  name: pigsty-icp-infra-exporters
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: pigsty-icp-infra-exporters
    app.kubernetes.io/part-of: panel-observability
spec:
  ports:
    - name: metrics-alertmanager
      port: 9059
      targetPort: 9059
    - name: metrics-blackbox
      port: 9115
      targetPort: 9115
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pigsty-icp-infra-exporters
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: pigsty-icp-infra-exporters
    app.kubernetes.io/part-of: panel-observability
subsets:
  - addresses:
      - ip: 192.0.2.192
        hostname: icp
    ports:
      - name: metrics-alertmanager
        port: 9059
      - name: metrics-blackbox
        port: 9115
---
apiVersion: v1
kind: Service
metadata:
  name: pigsty-pg-meta-exporters
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: pigsty-pg-meta-exporters
    app.kubernetes.io/part-of: panel-observability
spec:
  ports:
    - name: metrics-pg
      port: 9630
      targetPort: 9630
    - name: metrics-pgbouncer
      port: 9631
      targetPort: 9631
    - name: metrics-patroni
      port: 8008
      targetPort: 8008
    - name: metrics-haproxy
      port: 9101
      targetPort: 9101
    - name: metrics-pgbackrest
      port: 9854
      targetPort: 9854
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pigsty-pg-meta-exporters
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: pigsty-pg-meta-exporters
    app.kubernetes.io/part-of: panel-observability
subsets:
  - addresses:
      - ip: 192.0.2.89
        hostname: pg-meta-1
      - ip: 192.0.2.112
        hostname: pg-meta-2
      - ip: 192.0.2.251
        hostname: pg-meta-3
    ports:
      - name: metrics-pg
        port: 9630
      - name: metrics-pgbouncer
        port: 9631
      - name: metrics-patroni
        port: 8008
      - name: metrics-haproxy
        port: 9101
      - name: metrics-pgbackrest
        port: 9854
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-blackbox-exporter
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-blackbox-exporter
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-blackbox-exporter
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: artchais-nuclio-1
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
