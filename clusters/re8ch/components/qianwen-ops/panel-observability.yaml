apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-tenant-metrics-proxy
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-tenant-metrics-proxy
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-tenant-metrics-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-tenant-metrics-proxy
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: artchais-nuclio-1
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
      containers:
        - name: proxy
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/tenant-metrics-proxy.py"]
          env:
            - name: VM_UPSTREAM
              value: http://$(PANEL_VICTORIA_METRICS_SERVICE_HOST):8428
          ports:
            - name: http
              containerPort: 39091
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
