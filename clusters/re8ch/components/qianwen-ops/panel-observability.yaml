apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-re8ch-vmalert-rules
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-re8ch-vmalert
    app.kubernetes.io/part-of: panel-observability
data:
  re8ch.yml: |
    groups:
      - name: re8ch-observability-lite-rules
        interval: 30s
        rules:
          - record: qianwen_nuclio_function_info
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      label_replace(
                        kube_deployment_status_replicas_available{namespace=~"nuclio|qwen|ledger|anycam|cardcat|bench",deployment=~"nuclio-.+",deployment!~"nuclio-(controller|dashboard)"}
                      , "function", "$1", "deployment", "nuclio-(.*)")
                    , "tenant", "$1", "deployment", "nuclio-([^-]+).*")
                , "layer", "$1", "deployment", "nuclio-[^-]+-([^-]+).*")
              , "category", "$1", "deployment", "nuclio-[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "deployment", "nuclio-[^-]+-(.*)")
          - record: qianwen_nuclio_function_started_unixtime
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_started_unixtime
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_cold_starts_total
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_cold_starts_total
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_requests_total
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_requests_total
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_errors_total
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_errors_total
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_request_duration_seconds_bucket
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_request_duration_seconds_bucket
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_request_duration_seconds_sum
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_request_duration_seconds_sum
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_nuclio_function_request_duration_seconds_count
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_cloud_function_request_duration_seconds_count
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
          - record: qianwen_generation_task_failures_total
            expr: |
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      re8ch_generation_task_failures_total
                    , "tenant", "$1", "function", "([^-]+).*")
                  , "layer", "$1", "function", "[^-]+-([^-]+).*")
                , "category", "$1", "function", "[^-]+-[^-]+-([^-]+).*")
              , "service", "$1", "function", "[^-]+-(.*)")
      - name: re8ch-headlamp-recording-rules
        interval: 30s
        rules:
          - record: re8ch:nuclio:function_info
            expr: qianwen_nuclio_function_info
          - record: re8ch:nuclio:function_requests:rate5m
            expr: |
              sum by (tenant, layer, category, service, function) (
                rate(qianwen_nuclio_function_requests_total[5m])
              )
          - record: re8ch:nuclio:function_errors:rate5m
            expr: |
              sum by (tenant, layer, category, service, function) (
                rate(qianwen_nuclio_function_errors_total[5m])
              )
          - record: re8ch:gateway:requests:rate5m
            expr: |
              sum by (tenant, layer, category, namespace, function, backend_service, code, method) (
                rate(traefik_service_request_duration_seconds_count[5m])
              )
          - record: re8ch:gateway:errors:rate5m
            expr: |
              sum by (tenant, layer, category, namespace, function, backend_service, code, method) (
                rate(traefik_service_request_duration_seconds_count{code=~"[45].*"}[5m])
              )
          - record: re8ch:harbor:container_cpu:rate5m
            expr: |
              sum by (namespace, pod, container, node) (
                rate(container_cpu_usage_seconds_total{namespace="harbor"}[5m])
              )
          - record: re8ch:advanced_fabric:structural_evidence_coverage
            expr: |
              max by (node, latent, collector_epoch, definition) (
                advanced_fabric_structural_evidence_coverage
              )
          - record: re8ch:advanced_fabric:observable
            expr: |
              max by (node, symbol, collector_epoch, definition) (
                advanced_fabric_observable
              )
      - name: re8ch-headlamp-alert-rules
        interval: 30s
        rules:
          - alert: Re8chVMAgentRemoteWriteBacklog
            expr: sum(vmagent_remotewrite_pending_data_bytes{job=~".*vmagent-self"}) > 0
            for: 10m
            labels:
              severity: warning
              service: observability
            annotations:
              summary: vmagent remote write backlog is non-zero
          - alert: Re8chTraefikScrapeDown
            expr: up{job="k8s-traefik"} == 0
            for: 5m
            labels:
              severity: warning
              service: gateway
            annotations:
              summary: Traefik metrics scrape is down
          - alert: Re8chNuclioRuntimeScrapeDown
            expr: up{job="k8s-nuclio-functions-runtime"} == 0
            for: 10m
            labels:
              severity: warning
              service: nuclio
            annotations:
              summary: Nuclio runtime metrics scrape is down
          - alert: Re8chHarborProbeFailed
            expr: probe_success{job="http-probe", category="harbor"} == 0
            for: 5m
            labels:
              severity: warning
              service: harbor
            annotations:
              summary: Harbor public or internal probe failed
          - alert: Re8chToolHiveMCPProxyDown
            expr: up{job="toolhive-mcp-control-plane"} == 0
            for: 2m
            labels:
              severity: critical
              service: toolhive
            annotations:
              summary: ToolHive MCP proxy scrape is down
              description: "{{ $labels.access_level }} ToolHive proxy {{ $labels.instance }} has been down for two minutes"
          - alert: Re8chToolHiveToolCallErrors
            expr: |
              sum by (server) (
                rate(toolhive_mcp_requests_total{mcp_method="tools/call",status_code!~"2.."}[5m])
              ) > 0
            for: 5m
            labels:
              severity: warning
              service: toolhive
            annotations:
              summary: ToolHive MCP tool calls are returning errors
              description: "ToolHive server {{ $labels.server }} has failed tool calls for five minutes"
          - alert: Re8chPanelVMDiskFreeLow
            expr: |
              100 * min by (node, mountpoint) (
                node_filesystem_avail_bytes{job="k3s-node-exporter", node="rancher-panel", fstype!~"tmpfs|overlay"}
                /
                node_filesystem_size_bytes{job="k3s-node-exporter", node="rancher-panel", fstype!~"tmpfs|overlay"}
              ) < 15
            for: 10m
            labels:
              severity: warning
              service: observability
            annotations:
              summary: Panel VictoriaMetrics node disk free is below 15 percent
          - alert: Re8chAdvancedFabricMeasurementScrapeDown
            expr: count(up{job="advanced-fabric-node-measurements"} == 1) == 0
            for: 5m
            labels:
              severity: warning
              service: advanced-fabric
            annotations:
              summary: Advanced Fabric node measurement scrapes are unavailable
---
