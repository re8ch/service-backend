apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-tenant-logs-proxy
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-tenant-logs-proxy
    app.kubernetes.io/part-of: panel-observability
data:
  tenant-logs-proxy.py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    VLOGS_SERVICE_HOST = os.getenv("PANEL_VICTORIA_LOGS_SERVICE_HOST", "panel-victoria-logs.qianwen-ops.svc.cluster.local")
    UPSTREAM = os.getenv("VLOGS_UPSTREAM", "http://%s:9428" % VLOGS_SERVICE_HOST).rstrip("/")
    TENANTS = {
        "qianwen": {"tenant": "qianwen", "namespaces": ["qwen"], "dashboardUid": "tenant-qianwen-overview", "orgId": "2"},
        "ledger": {"tenant": "ledger", "namespaces": ["ledger"], "dashboardUid": "tenant-ledger-overview", "orgId": "3"},
        "anycam": {"tenant": "anycam", "namespaces": ["anycam"], "dashboardUid": "", "orgId": ""},
        "bench": {"tenant": "bench", "namespaces": ["bench"], "dashboardUid": "", "orgId": ""},
        "cardcat": {"tenant": "cardcat", "namespaces": ["cardcat"], "dashboardUid": "", "orgId": ""},
    }
    SHARED_PIGSTY_IPS = {"192.0.2.89", "192.0.2.112", "192.0.2.251"}
    SHARED_PIGSTY_LOG_JOBS = {"postgres", "pgbackrest", "syslog"}
    SHARED_PIGSTY_SYSLOG_APPS = {
        "postgres",
        "patroni",
        "pgbouncer",
        "pg_exporter",
        "pgbouncer_exporter",
        "pgbackrest_exporter",
        "vip-manager",
    }
    ALLOWED_ENDPOINTS = {
        "select/logsql/query",
        "select/logsql/tail",
        "select/logsql/hits",
        "select/logsql/field_names",
        "select/logsql/field_values",
        "select/logsql/stats_query",
        "select/logsql/stats_query_range",
    }

    def shared_pigsty_log_query(query):
        query = (query or "").strip()
        ip_values = set()
        for values in re.findall(r"\b(?:ip|host):in\(([^)]*)\)", query):
            ip_values.update(value.strip().strip('"') for value in values.split(","))
        ip_values.update(re.findall(r"\b(?:ip|host):\"?([0-9.]+)\"?", query))
        if not ip_values or any(ip not in SHARED_PIGSTY_IPS for ip in ip_values):
            return False
        jobs = set(re.findall(r"\bjob:([A-Za-z0-9_-]+)", query))
        if not jobs or any(job not in SHARED_PIGSTY_LOG_JOBS for job in jobs):
            return False
        app_values = set(re.findall(r"\bapp:([A-Za-z0-9_-]+)", query))
        for values in re.findall(r"\bapp:in\(([^)]*)\)", query):
            app_values.update(value.strip().strip('"') for value in values.split(","))
        return not app_values or all(app in SHARED_PIGSTY_SYSLOG_APPS for app in app_values)

    def scoped_query(cfg, query):
        query = (query or "*").strip() or "*"
        if shared_pigsty_log_query(query):
            return query
        namespace = cfg["namespaces"][0]
        scope = "kubernetes.pod_namespace:%s" % namespace
        if query == "*":
            return scope
        if query.startswith(scope):
            return query
        return "%s %s" % (scope, query)

    def query_looks_cross_tenant(cfg, query):
        query = query or ""
        allowed_namespaces = set(cfg["namespaces"])
        allowed_tenant = cfg["tenant"]
        for match in re.findall(r"\b(?:tenant|kubernetes\.pod_namespace|namespace):([A-Za-z0-9_-]+)", query):
            if match != allowed_tenant and match not in allowed_namespaces:
                return True
        for tenant, other in TENANTS.items():
            if tenant != allowed_tenant and re.search(r"\b%s\b" % re.escape(tenant), query):
                return True
            for namespace in other["namespaces"]:
                if namespace not in allowed_namespaces and re.search(r"\b%s\b" % re.escape(namespace), query):
                    return True
        return False

    def update_form_query(raw_body, cfg):
        params = urllib.parse.parse_qs(raw_body.decode(), keep_blank_values=True)
        query = params.get("query", [""])[0]
        if query_looks_cross_tenant(cfg, query):
            raise PermissionError("query references another tenant or namespace")
        params["query"] = [scoped_query(cfg, query)]
        return urllib.parse.urlencode(params, doseq=True).encode()

    def update_url_query(raw_query, cfg):
        params = urllib.parse.parse_qs(raw_query, keep_blank_values=True)
        query = params.get("query", [""])[0]
        if query_looks_cross_tenant(cfg, query):
            raise PermissionError("query references another tenant or namespace")
        params["query"] = [scoped_query(cfg, query)]
        return urllib.parse.urlencode(params, doseq=True)

    def open_upstream(req):
        last_exc = None
        for attempt in range(3):
            try:
                return urllib.request.urlopen(req, timeout=20)
            except urllib.error.URLError as exc:
                last_exc = exc
                if attempt == 2:
                    break
                time.sleep(0.2 * (attempt + 1))
        raise last_exc

    class Handler(BaseHTTPRequestHandler):
        def send_json(self, status, obj):
            data = json.dumps(obj).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def forward(self, method):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path in ("/health", "/-/healthy"):
                self.send_json(200, {"status": "ok"})
                return
            parts = parsed.path.strip("/").split("/", 1)
            if len(parts) != 2 or parts[0] not in TENANTS:
                self.send_json(404, {"status": "error", "error": "unknown tenant path"})
                return
            tenant, rest = parts
            if rest not in ALLOWED_ENDPOINTS:
                self.send_json(404, {"status": "error", "error": "unsupported VictoriaLogs endpoint"})
                return
            cfg = TENANTS[tenant]
            body = None
            query = parsed.query
            headers = {}
            try:
                if method == "POST":
                    length = int(self.headers.get("Content-Length") or 0)
                    body = self.rfile.read(length) if length else b""
                    content_type = self.headers.get("Content-Type", "application/x-www-form-urlencoded")
                    headers["Content-Type"] = content_type
                    if "application/x-www-form-urlencoded" in content_type:
                        body = update_form_query(body, cfg)
                    else:
                        query = update_url_query(query, cfg)
                else:
                    query = update_url_query(query, cfg)
            except PermissionError as exc:
                self.send_json(403, {"status": "error", "error": str(exc)})
                return
            target = "%s/%s" % (UPSTREAM, rest)
            if query:
                target += "?" + query
            req = urllib.request.Request(target, data=body, headers=headers, method=method)
            try:
                with open_upstream(req) as resp:
                    data = resp.read()
                    self.send_response(resp.status)
                    self.send_header("Content-Type", resp.headers.get("Content-Type", "application/json"))
                    self.send_header("Content-Length", str(len(data)))
                    self.end_headers()
                    self.wfile.write(data)
            except Exception as exc:
                self.send_json(502, {"status": "error", "error": str(exc)})

        def do_GET(self):
            self.forward("GET")

        def do_POST(self):
            self.forward("POST")

        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 39092), Handler).serve_forever()
---
