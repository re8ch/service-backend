apiVersion: v1
kind: ConfigMap
metadata:
  name: observable-pgcat-targets
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: observable-pgcat-collector
    app.kubernetes.io/part-of: re8ch-observable
data:
  targets.json: |
    [
      {"tenant_id":"qianwen","database_name":"qianwen_prod","instance_name":"pg-meta-1","datasource_uid":"pg-meta-1-qianwen-prod"},
      {"tenant_id":"qianwen","database_name":"qianwen_prod","instance_name":"pg-meta-2","datasource_uid":"pg-meta-2-qianwen-prod"},
      {"tenant_id":"qianwen","database_name":"qianwen_prod","instance_name":"pg-meta-3","datasource_uid":"pg-meta-3-qianwen-prod"},
      {"tenant_id":"qianwen","database_name":"qianwen_test","instance_name":"pg-meta-1","datasource_uid":"pg-meta-1-qianwen-test"},
      {"tenant_id":"qianwen","database_name":"qianwen_test","instance_name":"pg-meta-2","datasource_uid":"pg-meta-2-qianwen-test"},
      {"tenant_id":"qianwen","database_name":"qianwen_test","instance_name":"pg-meta-3","datasource_uid":"pg-meta-3-qianwen-test"},
      {"tenant_id":"qianwen","database_name":"cardcat","instance_name":"pg-meta-1","datasource_uid":"pg-meta-1-cardcat"},
      {"tenant_id":"qianwen","database_name":"cardcat","instance_name":"pg-meta-2","datasource_uid":"pg-meta-2-cardcat"},
      {"tenant_id":"qianwen","database_name":"cardcat","instance_name":"pg-meta-3","datasource_uid":"pg-meta-3-cardcat"}
    ]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: observable-pgcat-collector
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: observable-pgcat-collector
    app.kubernetes.io/part-of: re8ch-observable
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: observable-pgcat-collector
            app.kubernetes.io/part-of: re8ch-observable
        spec:
          restartPolicy: Never
          serviceAccountName: observable-collector
          nodeSelector:
            kubernetes.io/hostname: rancher-panel
          tolerations:
            - key: dedicated
              operator: Equal
              value: panel
              effect: NoSchedule
          containers:
            - name: collector
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/app/observable_pgcat_collector.py", "--once"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: GRAFANA_URL
                  value: http://panel-grafana.qianwen-ops.svc.cluster.local:3000/grafana
                - name: GRAFANA_ORG_ID
                  value: "1"
                - name: GRAFANA_BASIC_AUTH_USER
                  valueFrom:
                    secretKeyRef:
                      name: panel-grafana-admin-recovery
                      key: username
                - name: GRAFANA_BASIC_AUTH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: panel-grafana-admin-recovery
                      key: password
                - name: OBSERVABLE_RPC_RW_BASE_URL
                  value: https://db-rw.re8ch.com/observable
                - name: OBSERVABLE_PGCAT_TARGETS_FILE
                  value: /etc/re8ch/pgcat-targets/targets.json
                - name: OBSERVABLE_PGCAT_COLLECT_INTERVAL_SECONDS
                  value: "300"
                - name: OBSERVABLE_REQUEST_TIMEOUT_SECONDS
                  value: "30"
                - name: OBSERVABLE_SERVICE_ROLE
                  value: observable_app_rw
                - name: PGRST_JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: observable-collector-secrets
                      key: PGRST_JWT_SECRET
                - name: PGRST_JWT_AUD
                  value: https://db-rw.re8ch.com/observable
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: collector-code
                  mountPath: /app
                  readOnly: true
                - name: pgcat-targets
                  mountPath: /etc/re8ch/pgcat-targets
                  readOnly: true
          volumes:
            - name: collector-code
              configMap:
                name: observable-collector-code
                defaultMode: 0555
            - name: pgcat-targets
              configMap:
                name: observable-pgcat-targets
