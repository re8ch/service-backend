apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: staticreleases.delivery.re8ch.com}
spec:
  group: delivery.re8ch.com
  scope: Namespaced
  names: {plural: staticreleases, singular: staticrelease, kind: StaticRelease, shortNames: [sr]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - name: Applied
      type: string
      jsonPath: .status.appliedDigest
    - name: Healthy
      type: string
      jsonPath: '.status.conditions[?(@.type=="Healthy")].status'
    - name: Suspended
      type: boolean
      jsonPath: .status.suspended
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [releaseID, renderer, targetCluster, targetNamespace, contractDigest, chartDigest, valuesDigest, bundleRepository, stages]
            properties:
              releaseID: {type: string, maxLength: 63}
              renderer: {type: string, enum: [helm, kustomize]}
              targetCluster: {type: string}
              targetNamespace: {type: string}
              contractDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              chartDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              valuesDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              bundleRepository: {type: string, pattern: '^oci://'}
              bundleDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              dependencies: {type: array, items: {type: string}}
              stages: {type: array, minItems: 1, items: {type: string}}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: releaseoperations.delivery.re8ch.com}
spec:
  group: delivery.re8ch.com
  scope: Namespaced
  names: {plural: releaseoperations, singular: releaseoperation, kind: ReleaseOperation, shortNames: [rop]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - name: Release
      type: string
      jsonPath: .spec.releaseRef
    - name: Action
      type: string
      jsonPath: .spec.action
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            x-kubernetes-validations:
            - {rule: "self == oldSelf", message: ReleaseOperation spec is immutable}
            required: [releaseRef, action, approvedDigest, contractDigest, requestedBy, idempotencyKey, timeoutSeconds]
            properties:
              releaseRef: {type: string, maxLength: 63}
              action: {type: string, enum: [reconcile, force-reconcile, reset, suspend, resume, rollback]}
              approvedDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              contractDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              requestedBy: {type: string, maxLength: 253}
              reason: {type: string, maxLength: 512}
              idempotencyKey: {type: string, minLength: 1, maxLength: 128}
              timeoutSeconds: {type: integer, minimum: 1, maximum: 3600}
              approvalRef: {type: string, maxLength: 253}
              forceConflictObjects:
                type: array
                items: {type: string}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
