apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: delivery-staticrelease-git-authority}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [delivery.re8ch.com]
      apiVersions: [v1alpha1]
      operations: [UPDATE]
      resources: [staticreleases]
  validations:
  - expression: >-
      object.spec == oldObject.spec ||
      request.userInfo.username == 'system:serviceaccount:flux-system:kustomize-controller'
    message: StaticRelease desired state may be changed only by the main Git projection
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: delivery-staticrelease-git-authority}
spec:
  policyName: delivery-staticrelease-git-authority
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: delivery-immutable-operations}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [delivery.re8ch.com]
      apiVersions: [v1alpha1]
      operations: [DELETE]
      resources: [staticreleases, releaseoperations]
  validations:
  - {expression: "false", message: delivery history is append-only; delete through reviewed Git retirement}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: delivery-immutable-operations}
spec:
  policyName: delivery-immutable-operations
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: flux-compat-projections}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [helm.toolkit.fluxcd.io]
      apiVersions: [v2]
      operations: [UPDATE, DELETE]
      resources: [helmreleases]
  matchConditions:
  - name: compat-only
    expression: >-
      has(object.metadata.labels) &&
      'delivery.re8ch.com/compat-projection' in object.metadata.labels &&
      object.metadata.labels['delivery.re8ch.com/compat-projection'] == 'true'
  validations:
  - expression: "request.operation != 'DELETE'"
    message: compatibility projections cannot be deleted directly
  - expression: >-
      request.operation != 'UPDATE' ||
      (object.spec.interval == oldObject.spec.interval &&
       ((!has(object.spec.timeout) && !has(oldObject.spec.timeout)) ||
        (has(object.spec.timeout) && has(oldObject.spec.timeout) && object.spec.timeout == oldObject.spec.timeout)) &&
       object.spec.chart == oldObject.spec.chart &&
       ((!has(object.spec.releaseName) && !has(oldObject.spec.releaseName)) ||
        (has(object.spec.releaseName) && has(oldObject.spec.releaseName) && object.spec.releaseName == oldObject.spec.releaseName)) &&
       ((!has(object.spec.targetNamespace) && !has(oldObject.spec.targetNamespace)) ||
        (has(object.spec.targetNamespace) && has(oldObject.spec.targetNamespace) && object.spec.targetNamespace == oldObject.spec.targetNamespace)) &&
       ((!has(object.spec.storageNamespace) && !has(oldObject.spec.storageNamespace)) ||
        (has(object.spec.storageNamespace) && has(oldObject.spec.storageNamespace) && object.spec.storageNamespace == oldObject.spec.storageNamespace)) &&
       ((!has(object.spec.valuesFrom) && !has(oldObject.spec.valuesFrom)) ||
        (has(object.spec.valuesFrom) && has(oldObject.spec.valuesFrom) && object.spec.valuesFrom == oldObject.spec.valuesFrom)) &&
       ((!has(object.spec.dependsOn) && !has(oldObject.spec.dependsOn)) ||
        (has(object.spec.dependsOn) && has(oldObject.spec.dependsOn) && object.spec.dependsOn == oldObject.spec.dependsOn)) &&
       ((!has(object.spec.install) && !has(oldObject.spec.install)) ||
        (has(object.spec.install) && has(oldObject.spec.install) && object.spec.install == oldObject.spec.install)) &&
       ((!has(object.spec.upgrade) && !has(oldObject.spec.upgrade)) ||
        (has(object.spec.upgrade) && has(oldObject.spec.upgrade) && object.spec.upgrade == oldObject.spec.upgrade)) &&
       ((!has(object.spec.rollback) && !has(oldObject.spec.rollback)) ||
        (has(object.spec.rollback) && has(oldObject.spec.rollback) && object.spec.rollback == oldObject.spec.rollback)))
    message: only reconcile annotations and spec.suspend are writable on compatibility projections
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: flux-compat-projections}
spec:
  policyName: flux-compat-projections
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: flux-source-compat-projections}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [source.toolkit.fluxcd.io]
      apiVersions: [v1]
      operations: [UPDATE, DELETE]
      resources: [helmrepositories, helmcharts]
  matchConditions:
  - name: compat-only
    expression: >-
      has(object.metadata.labels) &&
      'delivery.re8ch.com/compat-projection' in object.metadata.labels &&
      object.metadata.labels['delivery.re8ch.com/compat-projection'] == 'true'
  validations:
  - {expression: "request.operation != 'DELETE'", message: compatibility projections cannot be deleted directly}
  - {expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec", message: source compatibility specs are immutable}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: flux-source-compat-projections}
spec:
  policyName: flux-source-compat-projections
  validationActions: [Deny]
