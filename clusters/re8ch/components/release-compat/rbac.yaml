apiVersion: v1
kind: ServiceAccount
metadata: {name: release-compat-controller, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: release-compat-controller}
rules:
- apiGroups: [delivery.re8ch.com]
  resources: [staticreleases, releaseoperations]
  verbs: [get, list, watch]
- apiGroups: [delivery.re8ch.com]
  resources: [releaseoperations]
  verbs: [create]
- apiGroups: [delivery.re8ch.com]
  resources: [staticreleases/status, releaseoperations/status]
  verbs: [get, patch, update]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  verbs: [get, list, watch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases/status]
  verbs: [get, patch, update]
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [helmrepositories, helmcharts]
  verbs: [get, list, watch]
- apiGroups: [source.toolkit.fluxcd.io]
  resources: [helmrepositories/status, helmcharts/status]
  verbs: [get, patch, update]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: ['']
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: release-compat-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: release-compat-controller}
subjects: [{kind: ServiceAccount, name: release-compat-controller, namespace: flux-system}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: re8ch-release-dispatcher, namespace: flux-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch-release-dispatcher, namespace: flux-system}
rules:
- apiGroups: [delivery.re8ch.com]
  resources: [releaseoperations]
  verbs: [get, list, watch]
- apiGroups: [delivery.re8ch.com]
  resources: [releaseoperations/status]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch-release-dispatcher, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: re8ch-release-dispatcher}
subjects: [{kind: ServiceAccount, name: re8ch-release-dispatcher, namespace: flux-system}]
