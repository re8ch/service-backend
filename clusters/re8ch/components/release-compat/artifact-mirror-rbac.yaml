apiVersion: v1
kind: ServiceAccount
metadata: {name: release-artifact-mirror, namespace: flux-system}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: release-artifact-publisher, namespace: flux-system}
rules:
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create]
- apiGroups: [batch]
  resources: [jobs]
  resourceNames: [release-artifact-mirror]
  verbs: [get, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: release-artifact-publisher, namespace: flux-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release-artifact-publisher}
subjects:
- {apiGroup: rbac.authorization.k8s.io, kind: Group, name: 're8ch:release-artifact-publisher'}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: release-artifact-mirror-job}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [batch]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [jobs]
  matchConditions:
  - name: publisher-identity
    expression: "request.userInfo.groups.exists(g, g == 're8ch:release-artifact-publisher')"
  validations:
  - expression: >-
      object.metadata.namespace == 'flux-system' &&
      object.metadata.name == 'release-artifact-mirror' &&
      object.metadata.labels['delivery.re8ch.com/component'] == 'artifact-mirror' &&
      object.metadata.annotations['delivery.re8ch.com/operation-id'].matches('^[0-9]{1,20}$')
    message: artifact publisher may create only the audited mirror Job
  - expression: >-
      object.spec.template.spec.serviceAccountName == 'release-artifact-mirror' &&
      object.spec.template.spec.automountServiceAccountToken == false &&
      object.spec.template.spec.restartPolicy == 'Never' &&
      object.spec.template.spec.nodeSelector == {'kubernetes.io/hostname': 'restricted-node-1eb0570f74'} &&
      object.spec.template.spec.initContainers.size() == 2 &&
      object.spec.template.spec.initContainers.all(c,
        c.image == 'ghcr.io/oras-project/oras@sha256:a3ce6b38d4c510ea9fdc0449b942ea44fb790f157e79b5e7e30b1e7460fe5579') &&
      object.spec.template.spec.containers.size() == 1 &&
      object.spec.template.spec.containers[0].image == 'ghcr.io/sigstore/cosign/cosign@sha256:2adcba84c5389dfbfe62a1fb1a4bf6dc48f7c7d6221050f6c4825db3ba9c300c'
    message: mirror Job runtime, identity and immutable images are fixed
  - expression: >-
      object.spec.template.spec.volumes.exists(v,
        v.name == 'registry-auth' && v.secret.secretName == 'release-artifact-mirror-auth') &&
      object.spec.template.spec.imagePullSecrets.exists(s, s.name == 'release-artifact-mirror-auth')
    message: mirror Job may use only the dedicated combined registry credential
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: release-artifact-mirror-job}
spec:
  policyName: release-artifact-mirror-job
  validationActions: [Deny]
