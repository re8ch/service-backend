# The first merge deliberately stages the controller at zero replicas. The
# release workflow replaces this digest and lifts replicas only after the image
# signature, CRDs, admission policy and golden metrics gate have passed.
apiVersion: apps/v1
kind: Deployment
metadata: {name: release-compat-controller, namespace: flux-system}
spec:
  replicas: 2
  selector: {matchLabels: {delivery.re8ch.com/component: release-compat-controller}}
  template:
    metadata:
      labels: {app: helm-controller, delivery.re8ch.com/component: release-compat-controller}
      annotations: {prometheus.io/port: "8080", prometheus.io/scrape: "true"}
    spec:
      serviceAccountName: release-compat-controller
      nodeSelector: {kubernetes.io/hostname: a1-wsl-zt}
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: 'true', effect: NoSchedule}
      - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      imagePullSecrets: [{name: gitops-oci-reader}]
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: controller
        image: registry.re8ch.com/functions-shared/release-compat-controller@sha256:c691ff19e5d368008556c4274c749ab2f3510843551b8b7a3b31becc7954eda9
        imagePullPolicy: IfNotPresent
        ports: [{name: http-prom, containerPort: 8080}, {name: healthz, containerPort: 8081}]
        readinessProbe: {httpGet: {path: /readyz, port: healthz}}
        livenessProbe: {httpGet: {path: /healthz, port: healthz}}
        resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {cpu: 250m, memory: 192Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata:
  name: helm-controller
  namespace: flux-system
  labels: {app.kubernetes.io/component: helm-controller, delivery.re8ch.com/compat-projection: 'true'}
spec:
  selector: {delivery.re8ch.com/component: release-compat-controller}
  ports: [{name: http-prom, port: 8080, targetPort: http-prom}]
---
# This deployment is activated only after the independently provisioned
# re8ch-release-dispatcher GitHub App secret exists. The App has metadata:read
# and actions:write on service-backend only; it has no Contents permission.
apiVersion: apps/v1
kind: Deployment
metadata: {name: re8ch-release-dispatcher, namespace: flux-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: re8ch-release-dispatcher}}
  template:
    metadata: {labels: {app: re8ch-release-dispatcher}}
    spec:
      serviceAccountName: re8ch-release-dispatcher
      nodeSelector: {kubernetes.io/hostname: a1-wsl-zt}
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: 'true', effect: NoSchedule}
      - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      imagePullSecrets: [{name: gitops-oci-reader}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: dispatcher
        image: registry.re8ch.com/functions-shared/release-compat-controller@sha256:c691ff19e5d368008556c4274c749ab2f3510843551b8b7a3b31becc7954eda9
        env:
        - {name: MODE, value: dispatcher}
        - name: GITHUB_APP_ID
          valueFrom: {secretKeyRef: {name: re8ch-release-dispatcher-github-app, key: app-id}}
        - name: GITHUB_INSTALLATION_ID
          valueFrom: {secretKeyRef: {name: re8ch-release-dispatcher-github-app, key: installation-id}}
        - {name: GITHUB_PRIVATE_KEY_FILE, value: /var/run/github-app/private-key.pem}
        volumeMounts: [{name: github-app, mountPath: /var/run/github-app, readOnly: true}]
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 96Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
      volumes:
      - name: github-app
        secret:
          secretName: re8ch-release-dispatcher-github-app
          items: [{key: private-key.pem, path: private-key.pem}]
