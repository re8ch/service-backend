apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- api.yaml
- admission.yaml
- rbac.yaml
- ceph-executor-rbac.yaml
- artifact-mirror-rbac.yaml
- controller.yaml
- ceph-static-releases.yaml
- storage-smoke.yaml
- helmcharts.yaml

patches:

# Permanently omit retired controller workloads while retaining CRDs and history.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller|image-reflector-controller|image-automation-controller|release-compat-controller|re8ch-release-dispatcher)
    namespace: (flux-system|flux-agent-system|flux-identity-system|flux-observability-system|flux-network-system)
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: retired-local-gitops-controller
- target:
    version: v1
    kind: Service
    name: helm-controller
    namespace: flux-system
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: helm-controller
