apiVersion: v1
kind: Namespace
metadata:
  name: cloud-disk
  labels:
    app.kubernetes.io/part-of: cloud-disk
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloud-disk-workspace
  namespace: cloud-disk
  labels:
    app.kubernetes.io/name: cloud-disk
    storage.re8ch.com/consumer: cephfs-re8ch
    storage.re8ch.com/replicated-approved: "true"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs-re8ch
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-disk
  namespace: cloud-disk
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-disk
  namespace: cloud-disk
  labels:
    app.kubernetes.io/name: cloud-disk
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: cloud-disk}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-disk
        app.kubernetes.io/part-of: cloud-disk
    spec:
      serviceAccountName: cloud-disk
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          command: [/bin/sh, -ec]
          args:
            - >-
              exec rclone gui --no-open-browser
              --addr 0.0.0.0:5580 --api-addr 0.0.0.0:5581
              --user "$GUI_USER" --pass "$GUI_PASS" --log-level ERROR
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: HTTP_PROXY, value: "http://$(NODE_IP):17891"}
            - {name: HTTPS_PROXY, value: "http://$(NODE_IP):17891"}
            - {name: NO_PROXY, value: "127.0.0.1,localhost,.svc,.cluster.local,192.0.2.203/8,192.0.2.225/10"}
            - name: RCLONE_CONFIG
              value: /etc/rclone/rclone.conf
            - name: GUI_USER
              valueFrom: {secretKeyRef: {name: cloud-disk-credentials, key: gui-user}}
            - name: GUI_PASS
              valueFrom: {secretKeyRef: {name: cloud-disk-credentials, key: gui-pass}}
            - name: XDG_CACHE_HOME
              value: /cache
          ports:
            - {name: gui, containerPort: 5580}
            - {name: rc, containerPort: 5581}
          readinessProbe:
            httpGet: {path: /, port: gui}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: gui}
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: credentials, mountPath: /etc/rclone, readOnly: true}
            - {name: workspace, mountPath: /workspace}
            - {name: cache, mountPath: /cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: credentials
          secret:
            secretName: cloud-disk-credentials
            defaultMode: 0440
        - name: workspace
          persistentVolumeClaim: {claimName: cloud-disk-workspace}
        - name: cache
          emptyDir: {sizeLimit: 2Gi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-disk-deny-ingress
  namespace: cloud-disk
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cloud-disk}
  policyTypes: [Ingress]
