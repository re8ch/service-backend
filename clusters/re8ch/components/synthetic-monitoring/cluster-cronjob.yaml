apiVersion: v1
kind: Namespace
metadata:
  name: synthetic-monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-contracts
  namespace: synthetic-monitoring
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-contracts-fast
  namespace: synthetic-monitoring
spec:
  schedule: 4/5 * * * *
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        spec:
          serviceAccountName: k6-contracts
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: k6
            image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
            args:
            - run
            - /work/smoke.js
            workingDir: /work
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            volumeMounts:
            - name: contracts
              mountPath: /work
              readOnly: true
            - name: scratch
              mountPath: /tmp
            env:
            - name: PROBE_VANTAGE
              value: internal
            - name: PROBE_CADENCE
              value: fast
          volumes:
          - name: contracts
            configMap:
              name: k6-contracts
          - name: scratch
            emptyDir:
              sizeLimit: 16Mi
---
