apiVersion: v1
kind: ServiceAccount
metadata: {name: regional-routing-authority, namespace: regional-routing}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: regional-routing-authority-observer}
rules:
  - apiGroups: [networking.re8ch.com]
    resources: [publicedges]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes, tlsroutes, tcproutes, gateways]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, nodes, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: regional-routing-authority-observer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: regional-routing-authority-observer}
subjects:
  - {kind: ServiceAccount, name: regional-routing-authority, namespace: regional-routing}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: regional-routing-authority-public-edge-status}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: public-edge-manager}
subjects:
  - {kind: ServiceAccount, name: regional-routing-authority, namespace: regional-routing}
