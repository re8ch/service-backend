apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: re8ch-service-http01}
spec:
  acme:
    email: admin@re8ch.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: re8ch-service-http01-account}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: re8ch-gateway-canary
                namespace: kube-system
                sectionName: http
