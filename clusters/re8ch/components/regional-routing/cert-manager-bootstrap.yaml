apiVersion: v1
kind: Namespace
metadata: {name: cert-manager}
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata: {name: cert-manager, namespace: kube-system}
spec:
  chart: oci://quay.io/jetstack/charts/cert-manager
  version: v1.21.1
  targetNamespace: cert-manager
  createNamespace: true
  backOffLimit: 20
  valuesContent: |-
    crds:
      enabled: true
    prometheus:
      enabled: true
    webhook:
      replicaCount: 2
      timeoutSeconds: 10
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: scheduling.re8ch.com/service-plane
                    operator: In
                    values: [core]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: webhook
                  app.kubernetes.io/instance: cert-manager
                  app.kubernetes.io/name: webhook
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cert-manager-cloudflare-bootstrap, namespace: cert-manager}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-cloudflare-dns-token, namespace: qianwen-ops}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudflare-pg-dns-controller-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cert-manager-read-cloudflare-dns-token, namespace: qianwen-ops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-cloudflare-dns-token}
subjects:
  - {kind: ServiceAccount, name: cert-manager-cloudflare-bootstrap, namespace: cert-manager}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: write-cloudflare-dns-token, namespace: cert-manager}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cert-manager-write-cloudflare-dns-token, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: write-cloudflare-dns-token}
subjects:
  - {kind: ServiceAccount, name: cert-manager-cloudflare-bootstrap, namespace: cert-manager}
---
apiVersion: batch/v1
kind: Job
metadata: {name: cert-manager-cloudflare-bootstrap, namespace: cert-manager}
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: cert-manager-cloudflare-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: copy-secret
          image: docker.1ms.run/library/python:3.12-alpine
          command: [python3, -c]
          args:
            - |
              import json, os, ssl, urllib.error, urllib.request
              root = "/var/run/secrets/kubernetes.io/serviceaccount"
              token = open(root + "/token", encoding="utf-8").read().strip()
              api = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT_HTTPS"])
              context = ssl.create_default_context(cafile=root + "/ca.crt")
              headers = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
              source = urllib.request.Request(api + "/api/v1/namespaces/qianwen-ops/secrets/cloudflare-pg-dns-controller-secret", headers=headers)
              with urllib.request.urlopen(source, context=context, timeout=10) as response:
                  encoded = json.load(response)["data"]["CF_API_TOKEN"]
              body = json.dumps({"apiVersion":"v1","kind":"Secret","metadata":{"name":"cloudflare-api-token","namespace":"cert-manager"},"type":"Opaque","data":{"api-token":encoded}}).encode()
              target = api + "/api/v1/namespaces/cert-manager/secrets"
              request = urllib.request.Request(target, data=body, headers=headers, method="POST")
              try:
                  urllib.request.urlopen(request, context=context, timeout=10).read()
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
