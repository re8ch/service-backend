apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: re8ch-region-loudi, namespace: kube-system}
spec:
  gatewayClassName: cilium-re8ch
  infrastructure:
    labels: {networking.re8ch.com/lb-pool: service-vip, networking.re8ch.com/bgp-advertise: enabled}
    annotations: {lbipam.cilium.io/ips: 10.251.0.5}
  listeners:
    - {name: http, protocol: HTTP, port: 80, allowedRoutes: {namespaces: {from: All}}}
    - name: tools-https
      hostname: tools.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: headlamp-https
      hostname: headlamp.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: dex-https
      hostname: dex.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: grafana-https
      hostname: grafana.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: api-https
      hostname: api.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - {name: pay-ui-https, hostname: pay.service.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-service-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - {name: pay-api-https, hostname: pay-api.service.re8ch.com, protocol: HTTPS, port: 443, tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-service-wildcard-tls}]}, allowedRoutes: {namespaces: {from: All}}}
    - name: db-ro-https
      hostname: db-ro.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: db-rw-https
      hostname: db-rw.re8ch.com
      protocol: HTTPS
      port: 443
      tls: {mode: Terminate, certificateRefs: [{kind: Secret, name: re8ch-wildcard-tls}]}
      allowedRoutes: {namespaces: {from: All}}
    - name: harbor-tls
      hostname: registry.re8ch.com
      protocol: TLS
      port: 443
      tls: {mode: Passthrough}
      allowedRoutes: {namespaces: {from: All}}
---
