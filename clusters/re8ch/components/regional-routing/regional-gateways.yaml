apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: auth-regional, namespace: auth}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: api-https}
  hostnames: [api.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /auth}}]
      backendRefs: [{name: re8ch-auth-gateway, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: regional-discovery-regional, namespace: regional-routing}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: api-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: api-https}
  hostnames: [api.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /.well-known/re8ch-routing/v1}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /v1/discovery}}
      backendRefs: [{name: public-edge-manager, port: 8080}]
