# Route pre-stage for application hostnames that already have concrete Services.
# DNS authority stays on the compatibility object until the forced-edge smoke passes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: teable-public, namespace: agent-collab}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: teable-https}]
  hostnames: [teable.re8ch.com]
  rules: [{backendRefs: [{name: teable, port: 3000}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: steel-browser-public, namespace: ai-operations}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: browser-https}]
  hostnames: [browser.re8ch.com]
  rules: [{backendRefs: [{name: oauth2-proxy-steel, port: 4180}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: storage-collaborator-public, namespace: dataspace}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: storage-https}]
  hostnames: [storage.re8ch.com]
  rules: [{backendRefs: [{name: dataspace-gateway, port: 8080}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: network-policy-public, namespace: egress-fabric}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: agent-https}]
  hostnames: [agent.re8ch.com]
  rules: [{backendRefs: [{name: network-decomplexer-policy-api, port: 80}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: netbird-dashboard-public, namespace: netbird-access}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-https}]
  hostnames: [access.re8ch.com]
  rules: [{backendRefs: [{name: netbird-dashboard, port: 80}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: opensandbox-public, namespace: opensandbox-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: opensandbox-https}]
  hostnames: [opensandbox.re8ch.com]
  rules: [{backendRefs: [{name: opensandbox-server, port: 80}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: admin-tools-public, namespace: toolhive-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: admin-https}]
  hostnames: [admin.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /mcp}}, {path: {type: PathPrefix, value: /oauth}}, {path: {type: PathPrefix, value: /.well-known}}]
      backendRefs: [{name: re8ch-admin-vmcp-session-router, port: 4483}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: operate-tools-public, namespace: toolhive-system}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-wildcard-https}]
  hostnames: [operate.tools.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /mcp}}, {path: {type: PathPrefix, value: /.well-known}}]
      backendRefs: [{name: mcp-ops-operate-external-proxy, port: 8080}]
