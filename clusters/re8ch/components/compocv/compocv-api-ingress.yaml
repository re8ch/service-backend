apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compocv
  namespace: compocv
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: api.re8ch.com
      http:
        paths:
          - path: /compocv
            pathType: Prefix
            backend:
              service:
                name: compocv-api-relay
                port:
                  name: http
    - host: api-shanghai77.re8ch.com
      http:
        paths:
          - path: /compocv
            pathType: Prefix
            backend:
              service:
                name: compocv-api-relay
                port:
                  name: http
    - host: api-shanghai217.re8ch.com
      http:
        paths:
          - path: /compocv
            pathType: Prefix
            backend:
              service:
                name: compocv-api-relay
                port:
                  name: http
    - host: api-guangzhou24.re8ch.com
      http:
        paths:
          - path: /compocv
            pathType: Prefix
            backend:
              service:
                name: compocv-api-relay
                port:
                  name: http
