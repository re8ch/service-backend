---
apiVersion: batch/v1
kind: Job
metadata:
  name: studio-database-bootstrap-v2
  namespace: supabase-pg-re8ch
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      imagePullSecrets:
      - name: studio-registry-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: migrations
        emptyDir: {}
      initContainers:
      - name: source-migration
        image: registry.re8ch.com/studio-toolkit/api@sha256:8eb7d0c6a7702f3739bb729ddf284ca193f25dd2edfbc11ff8e6e587d4514e0e
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 128Mi
        command:
        - python
        - -c
        - import shutil; shutil.copyfile("/app/toolkit/sql/001_studio.sql", "/migrations/001_studio.sql")
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      containers:
      - name: migrate
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        command:
        - /bin/sh
        - -ec
        args:
        - 'export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"

          export PGHOST=pg-re8ch-primary.pigsty-external.svc.cluster.local PGPORT=5432
          PGUSER="$POSTGRES_ADMIN_USER"

          until pg_isready; do sleep 5; done

          psql -d postgres -v ON_ERROR_STOP=1 -v password="$STUDIO_DATABASE_PASSWORD"
          <<''SQL''

          SELECT format(''CREATE ROLE studio_authenticator LOGIN NOINHERIT PASSWORD
          %L'', :''password'') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname=''studio_authenticator'')\gexec

          SELECT format(''ALTER ROLE studio_authenticator LOGIN NOINHERIT PASSWORD
          %L'', :''password'')\gexec

          SELECT ''CREATE DATABASE studio_toolkit TEMPLATE template0 ENCODING ''''UTF8''''''
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname=''studio_toolkit'')\gexec

          REVOKE ALL ON DATABASE studio_toolkit FROM PUBLIC;

          GRANT CONNECT ON DATABASE studio_toolkit TO studio_authenticator;

          SQL

          psql -d studio_toolkit -v ON_ERROR_STOP=1 -f /migrations/001_studio.sql

          psql -d studio_toolkit -v ON_ERROR_STOP=1 <<''SQL''

          GRANT studio_app_ro,studio_app_rw,studio_identity_ro TO studio_authenticator;

          REVOKE CREATE ON SCHEMA public FROM PUBLIC;

          NOTIFY pgrst, ''reload schema'';

          SQL

          '
        securityContext: *id001
        env:
        - name: POSTGRES_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: supabase-pg-re8ch-secrets
              key: POSTGRES_USER_READ_WRITE
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-pg-re8ch-secrets
              key: POSTGRES_PASSWORD
        - name: STUDIO_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: studio-db-bootstrap
              key: STUDIO_DATABASE_PASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /migrations
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 256Mi
