apiVersion: v1
kind: Namespace
metadata:
  name: studio-toolkit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studio-blobs
  namespace: studio-toolkit
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: cephfs-r640
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  namespace: studio-toolkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studio-api
  template:
    metadata:
      labels:
        app: studio-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      imagePullSecrets:
      - name: studio-registry-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: studio-api
        image: registry.re8ch.com/studio-toolkit/api@sha256:8eb7d0c6a7702f3739bb729ddf284ca193f25dd2edfbc11ff8e6e587d4514e0e
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: STUDIO_MODE
          value: production
        - name: STUDIO_ROOT_PATH
          value: /studio
        - name: STUDIO_BLOB_ROOT
          value: /data
        - name: STUDIO_AUTH_FILE
          value: /config/auth.json
        - name: STUDIO_POSTGREST_RO
          value: https://db-ro.re8ch.com/studio
        - name: STUDIO_POSTGREST_RW
          value: https://db-rw.re8ch.com/studio
        - name: STUDIO_POSTGREST_JWT_KEY
          valueFrom:
            secretKeyRef:
              name: studio-config
              key: STUDIO_POSTGREST_JWT_KEY
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: blobs
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet: &id001
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
      terminationGracePeriodSeconds: 30
      volumes:
      - name: blobs
        persistentVolumeClaim:
          claimName: studio-blobs
      - name: config
        secret:
          secretName: studio-config
          items:
          - key: auth.json
            path: auth.json
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: studio-api
  namespace: studio-toolkit
spec:
  selector:
    app: studio-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-db-ro
  namespace: studio-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio-db-ro
  template:
    metadata:
      labels:
        app: studio-db-ro
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      imagePullSecrets:
      - name: studio-registry-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: studio-db-ro
        image: docker.io/postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              name: studio-config
              key: PGRST_DB_URI_RW
        - name: PGRST_DB_SCHEMAS
          value: studio
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: studio-config
              key: STUDIO_POSTGREST_JWT_KEY
        - name: PGRST_DB_POOL
          value: '10'
        - name: PGRST_ADMIN_SERVER_PORT
          value: '3001'
        - name: PGRST_ADMIN_SERVER_HOST
          value: 0.0.0.0
        - name: PGRST_DB_CHANNEL_ENABLED
          value: 'false'
        - name: PGOPTIONS
          value: -c default_transaction_read_only=on
        - name: PGRST_DB_TX_END
          value: rollback
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet: &id001
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: studio-db-ro
  namespace: studio-toolkit
spec:
  selector:
    app: studio-db-ro
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
