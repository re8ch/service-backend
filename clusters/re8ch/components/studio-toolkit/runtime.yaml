---
apiVersion: v1
kind: Service
metadata:
  name: studio-db-rw
  namespace: studio-toolkit
spec:
  selector:
    app: studio-db-rw
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-worker-r640
  namespace: studio-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio-worker-r640
  template:
    metadata:
      labels:
        app: studio-worker-r640
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      imagePullSecrets:
      - name: studio-registry-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: studio-worker-r640
        image: registry.re8ch.com/studio-toolkit/worker@sha256:f237866b1ab6e51c1dee62298d0ce6a03fe3e11a2ba7f1cb719e467e012319ac
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: STUDIO_URL
          value: http://studio-api:8080
        - name: STUDIO_WORKER_TOKEN
          valueFrom:
            secretKeyRef:
              name: studio-worker
              key: STUDIO_WORKER_TOKEN
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            cpu: '4'
            memory: 4Gi
            ephemeral-storage: 10Gi
        volumeMounts:
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/studio
        command:
        - python
        - -m
        - toolkit.worker
        args:
        - --region
        - cn-r640
        - --work
        - /work
        - --allow-private-http
      terminationGracePeriodSeconds: 30
      volumes:
      - name: work
        emptyDir:
          sizeLimit: 8Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: home
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: studio-retention
  namespace: studio-toolkit
spec:
  schedule: 17 3 * * *
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: restricted-node-6dc3f140f9
          imagePullSecrets:
          - name: studio-registry-reader
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: collect
            image: registry.re8ch.com/studio-toolkit/api@sha256:8eb7d0c6a7702f3739bb729ddf284ca193f25dd2edfbc11ff8e6e587d4514e0e
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            env:
            - name: STUDIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: studio-retention
                  key: STUDIO_TOKEN
            command:
            - python
            - -c
            - import os,httpx; r=httpx.post("http://studio-api:8080/v1/retention/collect",headers={"Authorization":"Bearer
              "+os.environ["STUDIO_TOKEN"]},timeout=60); r.raise_for_status(); print(r.text)
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studio-api
  namespace: studio-toolkit
spec:
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: api-https
  hostnames:
  - api.re8ch.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /studio
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: studio-api
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
