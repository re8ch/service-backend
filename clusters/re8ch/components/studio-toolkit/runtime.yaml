      imagePullSecrets:
      - name: studio-registry-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: studio-db-rw
        image: docker.io/postgrest/postgrest:v14.12@sha256:54000f24847d01a2c2302e0041cf0618b875c57fb48507d743cfa9aaa50bf43c
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: PGRST_DB_URI
          valueFrom:
            secretKeyRef:
              name: studio-config
              key: PGRST_DB_URI_RW
        - name: PGRST_DB_SCHEMAS
          value: studio
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: studio-config
              key: STUDIO_POSTGREST_JWT_KEY
        - name: PGRST_DB_POOL
          value: '10'
        - name: PGRST_ADMIN_SERVER_PORT
          value: '3001'
        - name: PGRST_ADMIN_SERVER_HOST
          value: 0.0.0.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          httpGet: &id001
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: *id001
