apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - harbor-registry-app.yaml
  - harbor-trivy-adapter.yaml
  - harbor-s3-backup.yaml
patches:
  - path: harbor-registry-oss-esa-image-patch.yaml
  - target: {kind: Namespace, name: harbor}
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: harbor
        labels:
          re8ch.com/access-policy: toolhive-v1
          re8ch.com/domain: artifact-control
          re8ch.com/plane: control
