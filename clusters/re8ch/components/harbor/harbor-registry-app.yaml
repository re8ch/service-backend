apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-proxy
  namespace: harbor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-registry
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-registry
        app.kubernetes.io/component: proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
        - key: harbor.re8ch.com/standalone
          operator: Equal
          value: "true"
          effect: NoSchedule
      enableServiceLinks: false
      containers:
        - name: proxy
          image: goharbor/nginx-photon:v2.15.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
              # Temporary cluster-only compatibility for nodes whose containerd
              # mirror still targets :28443. RouterOS no longer publishes this
              # port; remove it after the rolling node mirror migration to 443.
              hostPort: 28443
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: harbor-config-root
              mountPath: /etc/nginx
              subPath: nginx
              readOnly: true
            - name: harbor-data
              mountPath: /etc/cert
              subPath: secret/cert
              readOnly: true
            - name: harbor-config-root
              mountPath: /harbor_cust_cert
              subPath: shared/trust-certificates
              readOnly: true
      volumes:
        - name: harbor-data
          hostPath:
            path: /var/lib/rancher/harbor/data
            type: Directory
        - name: harbor-config-root
          hostPath:
            path: /var/lib/rancher/harbor/config
            type: Directory
