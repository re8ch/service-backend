apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-core
  namespace: harbor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-registry
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-registry
        app.kubernetes.io/component: core
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
        - key: harbor.re8ch.com/standalone
          operator: Equal
          value: "true"
          effect: NoSchedule
      enableServiceLinks: false
      containers:
        - name: core
          image: goharbor/harbor-core:v2.15.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-core-env
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - {name: HTTP_PROXY, value: "http://$(NODE_IP):17891"}
            - {name: HTTPS_PROXY, value: "http://$(NODE_IP):17891"}
            - {name: NO_PROXY, value: "127.0.0.1,localhost,::1,core,registry,registryctl,redis,postgresql,jobservice,portal,log,trivy-adapter,harbor-registry,.svc,.svc.cluster.local,.cluster.local,.re8ch.com,192.0.2.183/8,192.0.2.81/10,192.0.2.33/12,192.0.2.136/16"}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: harbor-data
              mountPath: /etc/core/ca
              subPath: ca_download
            - name: harbor-data
              mountPath: /data
            - name: harbor-config-root
              mountPath: /etc/core/certificates
              subPath: core/certificates
              readOnly: true
            - name: harbor-config-root
              mountPath: /etc/core/app.conf
              subPath: core/app.conf
              readOnly: true
            - name: harbor-data
              mountPath: /etc/core/private_key.pem
              subPath: secret/core/private_key.pem
              readOnly: true
            - name: harbor-data
              mountPath: /etc/core/key
              subPath: secret/keys/secretkey
              readOnly: true
            - name: harbor-config-root
              mountPath: /harbor_cust_cert
              subPath: shared/trust-certificates
              readOnly: true
      volumes:
        - name: harbor-data
          hostPath:
            path: /var/lib/rancher/harbor/data
            type: Directory
        - name: harbor-config-root
          hostPath:
            path: /var/lib/rancher/harbor/config
            type: Directory
---
