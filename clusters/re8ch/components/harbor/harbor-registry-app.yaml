---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-log
  namespace: harbor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-registry
      app.kubernetes.io/component: log
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-registry
        app.kubernetes.io/component: log
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
        - key: harbor.re8ch.com/standalone
          operator: Equal
          value: "true"
          effect: NoSchedule
      enableServiceLinks: false
      containers:
        - name: log
          image: goharbor/harbor-log:v2.15.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: syslog
              containerPort: 10514
          volumeMounts:
            - name: harbor-log-dir
              mountPath: /var/log/docker
            - name: harbor-config-root
              mountPath: /etc/logrotate.d/logrotate.conf
              subPath: log/logrotate.conf
              readOnly: true
            - name: harbor-config-root
              mountPath: /etc/rsyslog.d/rsyslog_docker.conf
              subPath: log/rsyslog_docker.conf
              readOnly: true
      volumes:
        - name: harbor-log-dir
          hostPath:
            path: /var/lib/rancher/harbor/log
            type: DirectoryOrCreate
        - name: harbor-config-root
          hostPath:
            path: /var/lib/rancher/harbor/config
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-postgresql
  namespace: harbor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-registry
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-registry
        app.kubernetes.io/component: postgresql
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
        - key: harbor.re8ch.com/standalone
          operator: Equal
          value: "true"
          effect: NoSchedule
      enableServiceLinks: false
      containers:
        - name: postgresql
          image: goharbor/harbor-db:v2.15.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: harbor-db-env
          ports:
            - name: postgresql
              containerPort: 5432
          volumeMounts:
            - name: harbor-data
              mountPath: /var/lib/postgresql/data
              subPath: database
            - name: db-shm
              mountPath: /dev/shm
      volumes:
        - name: harbor-data
          hostPath:
            path: /var/lib/rancher/harbor/data
            type: Directory
        - name: db-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
