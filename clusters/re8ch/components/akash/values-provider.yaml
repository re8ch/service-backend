chainid: sandbox-2
node: https://rpc.sandbox-2.aksh.pw:443
domain: provider-sandbox.akash.re8ch.com
keyringbackend: file
bidmindeposit: 5000000uakt
minimumbalance: "10000000"
withdrawalperiod: 12h
deploymentnetworkpoliciesenabled: "true"
cluster_node_port_quantity: "0"
ipoperator: false
overcommit_pct_cpu: 0
overcommit_pct_mem: 0
overcommit_pct_storage: 0
attributes:
  - {key: location-region, value: ap-east}
  - {key: country, value: CN}
  - {key: city, value: "Shanghai"}
  - {key: location-type, value: homelab}
  - {key: host, value: akash}
  - {key: tier, value: community}
  - {key: organization, value: RE8CH}
  - {key: feat-persistent-storage, value: "false"}
  - {key: feat-shm, value: "true"}
  - {key: capabilities/cpu/arch, value: x86-64}
  - {key: capabilities/storage/1/class, value: default}
  - {key: capabilities/storage/1/persistent, value: "false"}
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: "2", memory: 4Gi}
nodeSelector: {kubernetes.io/hostname: r640}
tolerations:
  - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
gatewayApi:
  enabled: true
  gatewayName: akash-gateway
  gatewayNamespace: akash-gateway
  implementation: nginx
letsEncrypt:
  enabled: true
  acme:
    httpChallengePort: 5002
storage:
  home:
    size: 10Gi
    accessMode: ReadWriteOnce
