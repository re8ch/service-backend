# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: r640-agent-ephemeral
  namespace: arc-runners
  labels:
    re8ch.com/execution-lifecycle: "single-job"
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.15.1
    app.kubernetes.io/name: r640-agent-ephemeral
    app.kubernetes.io/instance: r640-agent-ephemeral
    app.kubernetes.io/version: "0.15.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: r640-agent-ephemeral
    actions.github.com/scale-set-namespace: arc-runners
  annotations:
    actions.github.com/values-hash: f8b275ceace60a3cbe312da5dcf634dbf6cb991db2318210d7665f033b20af8
    actions.github.com/cleanup-manager-role-binding: r640-agent-ephemeral-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: r640-agent-ephemeral-gha-rs-manager
    actions.github.com/cleanup-kubernetes-mode-role-binding-name: r640-agent-ephemeral-gha-rs-kube-mode
    actions.github.com/cleanup-kubernetes-mode-role-name: r640-agent-ephemeral-gha-rs-kube-mode
    actions.github.com/cleanup-kubernetes-mode-service-account-name: r640-agent-ephemeral-gha-rs-kube-mode

spec:
  githubConfigUrl: https://github.com/re8ch
  githubConfigSecret: arc-re8ch-agent-github-app
  runnerGroup: GitOps R640
  runnerScaleSetName: r640-agent-ephemeral
  maxRunners: 16
  minRunners: 0
  listenerTemplate:
    spec:
      containers:
      - name: listener
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: pg-re8ch
  listenerConfig:
    scaler:
      burst: 100
      qps: 50

  template:
    spec:
      nodeSelector: 
        kubernetes.io/hostname: r640
      tolerations: 
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: pg-re8ch
      restartPolicy: Never
      serviceAccountName: r640-agent-ephemeral-gha-rs-kube-mode
      containers:
      - name: runner
        
        command: 
          - /home/runner/run.sh
        image: 
          ghcr.io/actions/actions-runner@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
        resources: 
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext: 
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s-novolume/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "true"
          - name: ACTIONS_RUNNER_IMAGE
            value: "ghcr.io/actions/actions-runner@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690"
        volumeMounts: []
      
      volumes: []
