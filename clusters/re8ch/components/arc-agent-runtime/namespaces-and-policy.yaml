apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    app.kubernetes.io/part-of: re8ch-agent-runtime
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    app.kubernetes.io/part-of: re8ch-agent-runtime
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: r640-agent-runtime
  namespace: arc-runners
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 96Gi
    limits.cpu: "48"
    limits.memory: 128Gi
    pods: "48"
    secrets: "64"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}

