apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    app.kubernetes.io/part-of: re8ch-agent-runtime
---
apiVersion: v1
kind: Namespace
metadata:
  name: re8ch-arc-runners
  labels:
    app.kubernetes.io/part-of: re8ch-agent-runtime
    tenancy.re8ch.com/tenant: re8ch
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: self-hosted-agent-runtime
  namespace: re8ch-arc-runners
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 96Gi
    limits.cpu: "48"
    limits.memory: 128Gi
    pods: "48"
    secrets: "64"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: re8ch-arc-runners
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: re8ch-arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-https-egress
  namespace: re8ch-arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - ports:
    - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-egress
  namespace: re8ch-arc-runners
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock: {cidr: 10.42.0.0/16}
    - ipBlock: {cidr: 10.43.0.0/16}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver-egress
  namespace: re8ch-arc-runners
spec:
  endpointSelector: {}
  egress:
  - toEntities: [kube-apiserver]
    toPorts:
    - ports:
      - {protocol: TCP, port: "443"}
      - {protocol: TCP, port: "6443"}

