apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ledger-regional-edge
  namespace: ledger
  labels:
    saas.re8ch.com/product: ledger
    saas.re8ch.com/tenant: ledger
    saas.re8ch.com/layer: prod
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # api.re8ch.com weighted DNS: hostNetwork Traefik + internalTrafficPolicy Local.
    - match: Host(`api.re8ch.com`) && PathPrefix(`/ledger-wechat-auth`)
      kind: Rule
      priority: 120
      middlewares:
        - name: ledger-strip-wechat-auth-prefix
      services:
        - name: ledger-wechat-auth-local
          port: 8080
    - match: Host(`api.re8ch.com`) && PathPrefix(`/ledger-gnucash-report-runner`)
      kind: Rule
      priority: 120
      middlewares:
        - name: ledger-strip-report-runner-prefix
      services:
        - name: ledger-gnucash-report-runner-local
          port: 8080
    - match: Host(`api.re8ch.com`) && PathPrefix(`/ledger`)
      kind: Rule
      priority: 110
      services:
        - name: ledger-api-gateway-local
          port: 8080
    - match: Host(`api.re8ch.com`) && PathPrefix(`/wechat`)
      kind: Rule
      priority: 100
      services:
        - name: ledger-api-gateway-local
          port: 8080

    # Guangzhou edge
