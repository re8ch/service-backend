      services:
        - name: nuclio-ledger-gnucash-report-runner
          port: 8080
    - match: Host(`api-cand1.re8ch.com`) && PathPrefix(`/ledger-gnucash-report-runner`)
      kind: Rule
      priority: 120
      middlewares:
        - name: ledger-strip-report-runner-prefix
