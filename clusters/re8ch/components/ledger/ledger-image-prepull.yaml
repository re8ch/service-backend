apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-image-prepull-images
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-image-prepull
    app.kubernetes.io/component: image-prepull
    app.kubernetes.io/part-of: ledger
    re8ch.com/tenant: ledger
data:
  images.txt: |
    registry.re8ch.com/ledger/processor-ledger-api-gateway:security-go1264-cgo-20260612034000
    registry.re8ch.com/ledger/processor-ledger-gnucash-report-runner:security-go1264-cgo-20260612034000
    registry.re8ch.com/ledger/processor-ledger-wechat-auth:identity-security-alpine-go1264-20260612023000
    registry.re8ch.com/ledger/processor-ledger-wechat-auth:userdata-security-alpine-go1264-20260612023000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ledger-image-prepull
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger-image-prepull
    app.kubernetes.io/component: image-prepull
    app.kubernetes.io/part-of: ledger
    re8ch.com/tenant: ledger
spec:
  schedule: "37 4 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 3
      parallelism: 3
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ledger-image-prepull
            app.kubernetes.io/component: image-prepull
            app.kubernetes.io/part-of: ledger
            re8ch.com/tenant: ledger
        spec:
          restartPolicy: Never
          nodeSelector:
            pigsty.cc/workload: nuclio
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ledger-image-prepull
                  matchLabelKeys:
                    - batch.kubernetes.io/job-name
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: prepull
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  export K3S_DATA_DIR=/host/var/lib/rancher/k3s
                  ln -sf /host/usr/local/bin/k3s /tmp/crictl
                  cat > /tmp/crictl.yaml <<'CFG'
                  runtime-endpoint: unix:///host/run/k3s/containerd/containerd.sock
                  image-endpoint: unix:///host/run/k3s/containerd/containerd.sock
                  timeout: 30
                  debug: false
                  CFG

                  auth_b64="$(sed -n 's/.*"auth"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /harbor/.dockerconfigjson | head -n1)"
                  if [ -z "${auth_b64}" ]; then
                    echo "ERROR missing Harbor docker auth" >&2
                    exit 2
                  fi
                  auth="$(printf '%s' "${auth_b64}" | base64 -d)"

                  node="${NODE_NAME:-unknown}"
                  ok=0
                  fail=0
                  total=0
                  echo "ledger prepull start node=${node}"
                  case "${node}" in
                    qianwen-test-nuclio-2) stagger=0 ;;
                    artchais-nuclio-1) stagger=90 ;;
                    qianwen-prod-nuclio-3) stagger=180 ;;
                    *) stagger=30 ;;
                  esac
                  if [ "${stagger}" -gt 0 ]; then
                    echo "ledger prepull stagger node=${node} seconds=${stagger}"
                    sleep "${stagger}"
                  fi
                  while IFS= read -r image || [ -n "${image}" ]; do
                    case "${image}" in
                      ""|\#*) continue ;;
                    esac
                    total=$((total + 1))
                    echo "PULL start node=${node} image=${image}"
                    attempt=1
                    pulled=0
                    max_attempts="${PREPULL_RETRIES:-3}"
                    while [ "${attempt}" -le "${max_attempts}" ]; do
                      echo "PULL attempt node=${node} attempt=${attempt}/${max_attempts} image=${image}"
                      if /tmp/crictl --config /tmp/crictl.yaml pull --creds "${auth}" --pull-timeout 30m "${image}"; then
                        pulled=1
                        break
                      fi
                      echo "PULL attempt fail node=${node} attempt=${attempt}/${max_attempts} image=${image}" >&2
                      sleep $((attempt * 15))
                      attempt=$((attempt + 1))
                    done
                    if [ "${pulled}" -eq 1 ]; then
                      ok=$((ok + 1))
                      echo "PULL ok node=${node} image=${image}"
                    else
                      fail=$((fail + 1))
                      echo "PULL fail node=${node} image=${image}" >&2
                    fi
                  done < /images/images.txt
                  echo "ledger prepull summary node=${node} total=${total} ok=${ok} fail=${fail}"
                  if [ "${PREPULL_FAIL_ON_ERROR:-false}" = "true" ] && [ "${fail}" -ne 0 ]; then
                    exit 1
                  fi
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: PREPULL_FAIL_ON_ERROR
                  value: "true"
                - name: PREPULL_RETRIES
                  value: "3"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                privileged: true
              volumeMounts:
                - name: host-root
                  mountPath: /host
                  readOnly: true
                - name: harbor-auth
                  mountPath: /harbor
                  readOnly: true
                - name: images
                  mountPath: /images
                  readOnly: true
          volumes:
            - name: host-root
              hostPath:
                path: /
                type: Directory
            - name: harbor-auth
              secret:
                secretName: harbor-ledger-pull
                items:
                  - key: .dockerconfigjson
                    path: .dockerconfigjson
            - name: images
              configMap:
                name: ledger-image-prepull-images
                items:
                  - key: images.txt
                    path: images.txt
