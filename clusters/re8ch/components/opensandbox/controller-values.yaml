namespaceOverride: opensandbox-system

controller:
  replicaCount: 1
  image:
    repository: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/controller
    tag: "v0.2.0"
    pullPolicy: IfNotPresent
  nodeSelector:
    kubernetes.io/hostname: r640
  tolerations:
    - key: dedicated
      operator: Equal
      value: pg-re8ch
      effect: NoSchedule
  priorityClassName: opensandbox-control
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

crds:
  install: true
  keep: true

networkPolicy:
  enabled: false
