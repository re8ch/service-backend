apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-app-server-console
---
apiVersion: v1
kind: Secret
metadata:
  name: codex-app-server-console-host-token
  annotations:
    kubernetes.io/service-account.name: codex-app-server-console
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codex-app-server-console-readonly
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codex-app-server-console-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codex-app-server-console-readonly
subjects:
  - kind: ServiceAccount
    name: codex-app-server-console
    namespace: codex-platform
