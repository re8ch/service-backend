apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: codex-app-server-console-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /codex-console
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codex-app-server-console
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: codex-platform-codex-app-server-console-strip-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: api-shanghai217.re8ch.com
      http:
        paths:
          - path: /codex-console
            pathType: Prefix
            backend:
              service:
                name: codex-app-server-console
                port:
                  name: http
  tls:
    - hosts:
        - api-shanghai217.re8ch.com
      secretName: re8ch-wildcard-tls
