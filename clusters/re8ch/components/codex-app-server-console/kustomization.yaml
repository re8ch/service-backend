apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-platform
resources:
  - rbac.yaml
  - workload.yaml
  - ingress.yaml
configMapGenerator:
  - name: codex-app-server-console-code
    files:
      - server.mjs=app/server.mjs
      - index.html=app/index.html
generatorOptions:
  disableNameSuffixHash: true
