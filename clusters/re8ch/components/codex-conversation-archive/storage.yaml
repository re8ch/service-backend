apiVersion: v1
kind: Namespace
metadata:
  name: codex-archive
  labels:
    app.kubernetes.io/part-of: codex-conversation-archive
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-conversations
  namespace: codex-archive
  labels:
    app.kubernetes.io/name: codex-conversation-archive
    app.kubernetes.io/part-of: codex-conversation-archive
  annotations:
    storage.re8ch.com/availability-class: single-node
    storage.re8ch.com/failure-domain: r640
    storage.re8ch.com/data-classification: private-conversations
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cephfs-r640
  resources:
    requests:
      storage: 32Gi
