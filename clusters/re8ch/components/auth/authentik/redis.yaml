apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-redis-data
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/part-of: authentik
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/part-of: authentik
spec:
  # Authentik is retired; retain the PVC and definition only for rollback.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-redis
        app.kubernetes.io/part-of: authentik
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          command: [sh, -ceu]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [sh, -ceu, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -qx PONG']
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [sh, -ceu, 'redis-cli -a "$REDIS_PASSWORD" ping | grep -qx PONG']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: auth
  labels:
    app.kubernetes.io/name: authentik-redis
    app.kubernetes.io/part-of: authentik
spec:
  selector:
    app.kubernetes.io/name: authentik-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-redis
  namespace: auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
      ports:
        - protocol: TCP
          port: 6379
