apiVersion: apps/v1
kind: Deployment
metadata: {name: re8ch-user-center, namespace: auth}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: re8ch-user-center}}
  template:
    metadata: {labels: {app.kubernetes.io/name: re8ch-user-center, app.kubernetes.io/part-of: re8ch-auth}}
    spec:
      imagePullSecrets: [{name: ghcr-re8ch}]
      containers:
        - name: web
          image: ghcr.io/re8ch/user-hub@sha256:e6ed2ba8ab55bf7e6455e135a6933f3c3ed4d1c06497bfcb5b9b6c06cc427632
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 101, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: re8ch-user-center, namespace: auth}
spec: {selector: {app.kubernetes.io/name: re8ch-user-center}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: re8ch-user-center, namespace: auth}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: auth-https}]
  hostnames: [auth.re8ch.com]
  rules:
    - matches:
        - {path: {type: Exact, value: /.well-known/openid-configuration}}
        - {path: {type: Exact, value: /jwks}}
        - {path: {type: Exact, value: /authorize}}
        - {path: {type: Exact, value: /token}}
        - {path: {type: Exact, value: /userinfo}}
        - {path: {type: Exact, value: /start}}
        - {path: {type: PathPrefix, value: /callback}}
        - {path: {type: PathPrefix, value: /auth}}
      backendRefs: [{name: re8ch-auth-gateway, port: 8080}]
      filters: [{type: ResponseHeaderModifier, responseHeaderModifier: {set: [{name: X-Re8ch-Identity-Plane, value: stalwart-broker}]}}]
    - backendRefs: [{name: re8ch-user-center, port: 80}]
      filters: [{type: ResponseHeaderModifier, responseHeaderModifier: {set: [{name: X-Re8ch-Gateway, value: cilium}]}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: re8ch-user-center-http-redirect, namespace: auth}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [auth.re8ch.com]
  rules: [{filters: [{type: RequestRedirect, requestRedirect: {scheme: https, statusCode: 308}}]}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: re8ch-user-center-dns
  namespace: auth
  labels: {networking.re8ch.com/dns-authority: public-edge}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: auth.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules: [{host: auth.re8ch.com, http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: re8ch-user-center, port: {number: 80}}}}]}}]
