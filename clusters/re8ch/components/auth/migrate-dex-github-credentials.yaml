apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate-dex-github-credentials
  namespace: dex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migrate-dex-github-credentials
  namespace: auth
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [re8ch-auth-gateway-secrets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [re8ch-auth-gateway]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: migrate-dex-github-credentials
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: migrate-dex-github-credentials
subjects:
  - kind: ServiceAccount
    name: migrate-dex-github-credentials
    namespace: dex
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-dex-github-credentials-v3
  namespace: dex
  annotations:
    governance.re8ch.com/change: migrate-github-oauth-from-dex-to-stalwart-broker
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrate-dex-github-credentials}
    spec:
      serviceAccountName: migrate-dex-github-credentials
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          command: [/bin/sh, -euc]
          args:
            - |
              test -s /source/client-id
              test -s /source/client-secret
              client_id="$(base64 < /source/client-id | tr -d '\n')"
              client_secret="$(base64 < /source/client-secret | tr -d '\n')"
              umask 077
              printf '[{"op":"add","path":"/data/GITHUB_OAUTH_CLIENT_ID","value":"%s"},{"op":"add","path":"/data/GITHUB_OAUTH_CLIENT_SECRET","value":"%s"}]' \
                "$client_id" "$client_secret" > /tmp/github-credentials.patch.json
              kubectl patch secret re8ch-auth-gateway-secrets \
                --namespace auth --type=json \
                --patch-file=/tmp/github-credentials.patch.json
              rm -f /tmp/github-credentials.patch.json
              kubectl rollout restart deployment/re8ch-auth-gateway --namespace auth
          volumeMounts:
            - {name: dex-github, mountPath: /source, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: dex-github
          secret:
            secretName: dex-github
            items:
              - {key: client-id, path: client-id}
              - {key: client-secret, path: client-secret}
