apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate-dex-github-credentials
  namespace: dex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migrate-dex-github-credentials
  namespace: auth
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [re8ch-auth-gateway-secrets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [re8ch-auth-gateway]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: migrate-dex-github-credentials
  namespace: auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: migrate-dex-github-credentials
subjects:
  - kind: ServiceAccount
    name: migrate-dex-github-credentials
    namespace: dex
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-dex-github-credentials-v4
  namespace: dex
  annotations:
    governance.re8ch.com/change: migrate-github-oauth-from-dex-to-stalwart-broker
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrate-dex-github-credentials}
    spec:
      serviceAccountName: migrate-dex-github-credentials
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [python3, -c]
          args:
            - |
              import base64
              import json
              import ssl
              import time
              import urllib.request

              api = "https://kubernetes.default.svc"
              token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
              context = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

              def patch(path, payload, content_type):
                  request = urllib.request.Request(
                      api + path,
                      data=json.dumps(payload).encode(),
                      method="PATCH",
                      headers={"Authorization": "Bearer " + token, "Content-Type": content_type},
                  )
                  with urllib.request.urlopen(request, context=context, timeout=30) as response:
                      if response.status not in (200, 201):
                          raise RuntimeError(f"Kubernetes API returned {response.status}")

              client_id = open("/source/client-id", "rb").read()
              client_secret = open("/source/client-secret", "rb").read()
              if not client_id or not client_secret:
                  raise RuntimeError("Dex GitHub credential keys must be non-empty")
              patch(
                  "/api/v1/namespaces/auth/secrets/re8ch-auth-gateway-secrets",
                  [
                      {"op": "add", "path": "/data/GITHUB_OAUTH_CLIENT_ID", "value": base64.b64encode(client_id).decode()},
                      {"op": "add", "path": "/data/GITHUB_OAUTH_CLIENT_SECRET", "value": base64.b64encode(client_secret).decode()},
                  ],
                  "application/json-patch+json",
              )
              patch(
                  "/apis/apps/v1/namespaces/auth/deployments/re8ch-auth-gateway",
                  {"spec": {"template": {"metadata": {"annotations": {
                      "auth.re8ch.com/restarted-at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  }}}}},
                  "application/merge-patch+json",
              )
              print("GitHub OAuth credentials migrated; broker rollout requested")
          volumeMounts:
            - {name: dex-github, mountPath: /source, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: dex-github
          secret:
            secretName: dex-github
            items:
              - {key: client-id, path: client-id}
              - {key: client-secret, path: client-secret}
