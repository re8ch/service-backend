apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgrest
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-postgrest
    app.kubernetes.io/part-of: re8ch-auth
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth-postgrest}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-postgrest
        app.kubernetes.io/part-of: re8ch-auth
    spec:
      nodeSelector:
        scheduling.re8ch.com/pool-service-core-r640: "true"
      containers:
        - name: postgrest
          image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: auth-db-credentials, key: PGRST_DB_URI}}
            - {name: PGRST_DB_SCHEMAS, value: api}
            # No anonymous role: auth RPCs require a signed database role.
            - {name: PGRST_SERVER_ADMIN_PORT, value: "3001"}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: re8ch-auth-gateway-secrets, key: PGRST_JWT_SECRET}}
            - {name: PGRST_DB_POOL, value: "10"}
          ports:
            - {name: http, containerPort: 3000}
            - {name: admin, containerPort: 3001}
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgrest
  namespace: auth
spec:
  clusterIP: 192.0.2.158
  selector: {app.kubernetes.io/name: auth-postgrest}
  ports:
    - {name: http, port: 3000, targetPort: http}
    - {name: admin, port: 3001, targetPort: admin}
---
# Keep auth RPCs on the PostgREST instance connected to the auth database.
# The generic db-rw fallback serves a different schema cache.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-rpc-rw
  namespace: auth
spec:
  hostnames: [db-rw.re8ch.com]
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-rw-https}
  rules:
    - matches: [{path: {type: PathPrefix, value: /auth/rpc}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /rpc}}
      backendRefs: [{name: auth-postgrest, port: 3000}]

---
# Auth discovery must use the same database API as auth RPCs, rather than
# falling through to the retired domain-ex role gateway. RO exposes only
# GET/HEAD here; existing database grants continue to govern access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-discovery
  namespace: auth
spec:
  hostnames: [db-rw.re8ch.com, db-ro.re8ch.com]
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-ro-https}
  rules:
    - matches:
        - {path: {type: Exact, value: /auth}, method: GET}
        - {path: {type: Exact, value: /auth/}, method: GET}
        - {path: {type: Exact, value: /auth}, method: HEAD}
        - {path: {type: Exact, value: /auth/}, method: HEAD}
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /}}
      backendRefs: [{name: auth-postgrest, port: 3000}]

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-auth-postgrest-readiness
  namespace: auth
spec:
  hostnames: [db-rw.re8ch.com, db-ro.re8ch.com]
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-ro-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-ro-https}
  rules:
    - matches: [{path: {type: Exact, value: /auth/ready}, method: GET}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /ready}}
      backendRefs: [{name: auth-postgrest, port: 3001}]
