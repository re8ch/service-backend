apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgrest
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-postgrest
    app.kubernetes.io/part-of: re8ch-auth
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth-postgrest}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-postgrest
        app.kubernetes.io/part-of: re8ch-auth
    spec:
      nodeSelector:
        scheduling.re8ch.com/pool-service-core-r640: "true"
      containers:
        - name: postgrest
          image: docker.io/postgrest/postgrest:v14.1@sha256:e9490aa503a5fb07d8e8c80da46e5c0c193894e583b59ed9077e74c4101ffae2
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: auth-db-credentials, key: PGRST_DB_URI}}
            - {name: PGRST_DB_SCHEMAS, value: api}
            - {name: PGRST_DB_ANON_ROLE, value: anon}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: re8ch-auth-gateway-secrets, key: PGRST_JWT_SECRET}}
            - {name: PGRST_DB_POOL, value: "10"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgrest
  namespace: auth
spec:
  clusterIP: 192.0.2.3
  selector: {app.kubernetes.io/name: auth-postgrest}
  ports:
    - {name: http, port: 3000, targetPort: http}
