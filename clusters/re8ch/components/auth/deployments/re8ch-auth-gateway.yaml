apiVersion: apps/v1
kind: Deployment
metadata:
  name: re8ch-auth-gateway
  namespace: auth
  labels:
    app.kubernetes.io/name: re8ch-auth-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: re8ch-auth
    saas.re8ch.com/tenant: auth
    saas.re8ch.com/product: re8ch-auth
    saas.re8ch.com/layer: prod
    saas.re8ch.com/function: gateway
spec:
  replicas: 2
  minReadySeconds: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-auth-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: service-core-r640
      labels:
        app.kubernetes.io/name: re8ch-auth-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: re8ch-auth
        saas.re8ch.com/tenant: auth
        saas.re8ch.com/product: re8ch-auth
        saas.re8ch.com/layer: prod
        saas.re8ch.com/function: gateway
    spec:
      terminationGracePeriodSeconds: 45
      hostNetwork: false
      # The auth broker must resolve the identity-egress Service even when the
      # locality-aware advanced DNS VIP is degraded. The canonical kube-dns
      # Service has all healthy DNS backends and is stable across node moves.
      dnsPolicy: None
      dnsConfig:
        nameservers: [192.0.2.240]
        searches: [auth.svc.cluster.local, svc.cluster.local, cluster.local]
        options: [{name: ndots, value: "5"}]
      nodeSelector:
        scheduling.re8ch.com/pool-service-core-r640: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: anchor
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: harbor-auth-admin
      containers:
        - name: gateway
          image: registry.re8ch.com/auth/re8ch-auth-gateway@sha256:60a356e08728ce2d22d908bfcc4e3c6bc52ad9556ac50223fed6a11f9b35d5b0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: prod
            - name: GODEBUG
              value: netdns=cgo
            - name: HTTPS_PROXY
              # Control-plane Cilium Service translation is currently degraded.
              # overseas-la is the declared healthy identity-egress authority.
              value: http://192.0.2.147:17893
            - name: HTTP_PROXY
              value: http://192.0.2.147:17893
            - name: NO_PROXY
              value: localhost,127.0.0.1,::1,.svc,.cluster.local,192.0.2.183/8,192.0.2.33/12,192.0.2.136/16
            - name: API_BASE_URL
              value: https://api.re8ch.com/auth
            - name: PUBLIC_API_BASE_URL
              value: https://api.re8ch.com/auth
            - name: IDENTITY_AUTH_URL
              value: https://db-rw.re8ch.com/auth/v1
            - name: IDENTITY_USER_URL
              value: http://supabase-identity-auth.supabase-identity.svc:9999/user
            - name: IDENTITY_RO_URL
              value: http://192.0.2.107:3000
            - name: IDENTITY_RW_URL
              value: http://192.0.2.93:3000
            - name: IDENTITY_AVATAR_COS_BUCKET
              value: re8ch-avatars-1301339749
            - name: IDENTITY_AVATAR_COS_REGION
              value: ap-guangzhou
            - name: IDENTITY_PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef: {name: re8ch-auth-gateway-secrets, key: IDENTITY_PGRST_JWT_SECRET}
            - name: IDENTITY_GOTRUE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef: {name: re8ch-auth-gateway-secrets, key: IDENTITY_GOTRUE_SERVICE_ROLE_KEY}
            - name: IDENTITY_SEND_EMAIL_HOOK_SECRET
