apiVersion: v1
kind: ServiceAccount
metadata: {name: dex-service-config-reconciler, namespace: dex}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dex-service-config-reconciler, namespace: dex}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dex-config, dex-config-service, re8ch-auth-broker-oidc, supabase-identity-oidc]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [dex, dex-service]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dex-service-config-reconciler, namespace: dex}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dex-service-config-reconciler}
subjects: [{kind: ServiceAccount, name: dex-service-config-reconciler, namespace: dex}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dex-service-config-reconciler, namespace: dex}
data:
  reconcile.py: |
    import base64
    import copy
    import json
    import ssl
    import time
    import urllib.error
    import urllib.request
    import yaml

    api = 'https://kubernetes.default.svc'
    token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
    context = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')

    def request(path, method='GET', body=None, content_type='application/json'):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(api + path, data=data, method=method, headers={
            'Authorization': 'Bearer ' + token, 'Content-Type': content_type,
        })
        with urllib.request.urlopen(req, context=context, timeout=20) as response:
            return json.load(response)

    source = request('/api/v1/namespaces/dex/secrets/dex-config')
    config = yaml.safe_load(base64.b64decode(source['data']['config.yaml']))
    if config.get('issuer') != 'https://dex.re8ch.com':
        raise RuntimeError('canonical Dex issuer changed; refusing to derive a stale config')
    github = [item for item in config.get('connectors', []) if item.get('type') == 'github']
    if len(github) != 1:
        raise RuntimeError('expected exactly one canonical GitHub connector')
    headlamp = [item for item in config.get('staticClients', []) if item.get('id') == 'headlamp']
    if len(headlamp) != 1:
        raise RuntimeError('expected exactly one Headlamp OIDC client')
    callback = 'https://headlamp.service.re8ch.com/oidc-callback'
    redirects = headlamp[0].setdefault('redirectURIs', [])
    if callback not in redirects:
        redirects.append(callback)
    # The Kubernetes API authenticates the canonical issuer. Register the
    # service-domain callback there before deriving the separate Dex service.
    canonical_encoded = base64.b64encode(yaml.safe_dump(config, sort_keys=False).encode()).decode()
    if source['data']['config.yaml'] != canonical_encoded:
        request('/api/v1/namespaces/dex/secrets/dex-config', 'PATCH', {
            'data': {'config.yaml': canonical_encoded},
        }, 'application/merge-patch+json')
        request('/apis/apps/v1/namespaces/dex/deployments/dex', 'PATCH', {
            'spec': {'template': {'metadata': {'annotations': {
                'dex.re8ch.com/config-reconciled-at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
            }}}}}, 'application/merge-patch+json')
    config['issuer'] = 'https://dex.service.re8ch.com'
    github[0]['config']['redirectURI'] = 'https://dex.service.re8ch.com/callback'
    # Stalwart's external OIDC directory uses its WebUI public PKCE client to
    # federate the existing GitHub connector during the isolated IdP pilot.
    stalwart_redirects = [
        'https://id-stalwart.tools.re8ch.com/account/oauth/callback',
        'https://id-stalwart.tools.re8ch.com/admin/oauth/callback',
    ]
    clients = config.setdefault('staticClients', [])
    stalwart = next((item for item in clients if item.get('id') == 'stalwart-webui'), None)
    if stalwart is None:
        stalwart = {'id': 'stalwart-webui'}
        clients.append(stalwart)
    stalwart.update({
        'name': 'RE8CH Stalwart IdP Pilot',
        'public': True,
        'redirectURIs': stalwart_redirects,
    })
    stalwart.pop('secret', None)
    # Supabase uses a dedicated Dex client and GitHub connector. Restricting
    # this connector leaves the existing Dex clients and GitHub login intact.
    try:
        identity_secret = request('/api/v1/namespaces/dex/secrets/supabase-identity-oidc')
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise
        identity_secret = None
    if identity_secret:
        identity_values = identity_secret.get('data', {})
        identity_client_id = base64.b64decode(identity_values.get('client-id', '')).decode().strip()
        identity_client_secret = base64.b64decode(identity_values.get('client-secret', '')).decode().strip()
        if identity_client_id != 'supabase-identity' or not identity_client_secret:
            raise RuntimeError('supabase-identity-oidc Secret must contain the expected client ID and secret')
        identity_client = next((item for item in clients if item.get('id') == identity_client_id), None)
        if identity_client is None:
            identity_client = {'id': identity_client_id}
            clients.append(identity_client)
        identity_client.update({
            'name': 'RE8CH Supabase Identity',
            'secret': identity_client_secret,
            'redirectURIs': ['https://auth.re8ch.com/auth/v1/callback'],
            'allowedConnectors': ['github-re8ch-identity'],
            'ssoSharedWith': [],
        })
    # Keep the canonical public Dex separate. The broker has one confidential
    # client whose callback belongs to the service issuer only.
    try:
        broker_secret = request('/api/v1/namespaces/dex/secrets/re8ch-auth-broker-oidc')
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise
        broker_secret = None
    connectors = [item for item in config.get('connectors', []) if item.get('id') != 're8ch-auth']
    if identity_secret:
        restricted_github = copy.deepcopy(github[0])
        restricted_github['id'] = 'github-re8ch-identity'
        restricted_github['name'] = 'RE8CH GitHub Identity'
        restricted_github['grantTypes'] = ['authorization_code', 'refresh_token']
        restricted_github['config']['orgs'] = [{'name': 're8ch'}]
        restricted_github['config']['loadAllGroups'] = False
        connectors = [item for item in connectors if item.get('id') != restricted_github['id']]
        connectors.append(restricted_github)
    if broker_secret and base64.b64decode(broker_secret.get('data', {}).get('enabled', '')).decode().strip() == 'true':
        values = broker_secret.get('data', {})
        client_id = base64.b64decode(values.get('client-id', '')).decode().strip()
        client_secret = base64.b64decode(values.get('client-secret', '')).decode().strip()
        if not client_id or not client_secret:
            raise RuntimeError('broker OIDC Secret must contain client-id and client-secret')
        connectors.append({
            'type': 'oidc', 'id': 're8ch-auth', 'name': 'RE8CH Account',
            'config': {
                'issuer': 'https://api.re8ch.com/auth',
                'clientID': client_id,
                'clientSecret': client_secret,
                'redirectURI': 'https://dex.service.re8ch.com/callback',
                'scopes': ['openid', 'profile', 'email', 'groups'],
                'getUserInfo': True,
                'insecureEnableGroups': True,
                'insecureSkipEmailVerified': True,
            },
        })
    config['connectors'] = connectors
    encoded = base64.b64encode(yaml.safe_dump(config, sort_keys=False).encode()).decode()
    path = '/api/v1/namespaces/dex/secrets/dex-config-service'
    try:
        target = request(path)
    except urllib.error.HTTPError as exc:
        if exc.code != 404:
            raise
        target = None
    if target and target.get('data', {}).get('config.yaml') == encoded:
        raise SystemExit(0)
    if target:
        request(path, 'PATCH', {'data': {'config.yaml': encoded}}, 'application/merge-patch+json')
    else:
        request('/api/v1/namespaces/dex/secrets', 'POST', {
            'apiVersion': 'v1', 'kind': 'Secret',
            'metadata': {'name': 'dex-config-service', 'namespace': 'dex'},
            'type': 'Opaque', 'data': {'config.yaml': encoded},
        })
    request('/apis/apps/v1/namespaces/dex/deployments/dex-service', 'PATCH', {
        'spec': {'template': {'metadata': {'annotations': {
            'dex.re8ch.com/config-reconciled-at': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
        }}}}}, 'application/merge-patch+json')
    print('Dex service issuer configuration reconciled; rollout requested')
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dex-service-config-reconciler, namespace: dex}
spec:
  replicas: 1
  selector: {matchLabels: {app: dex-service-config-reconciler}}
  template:
    metadata: {labels: {app: dex-service-config-reconciler}}
    spec:
      serviceAccountName: dex-service-config-reconciler
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      containers:
        - name: reconcile
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [/bin/sh, -c]
          args:
            - |
              while true; do
                python3 /scripts/reconcile.py
                sleep 60
              done
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts: [{name: script, mountPath: /scripts, readOnly: true}]
      volumes: [{name: script, configMap: {name: dex-service-config-reconciler, defaultMode: 0444}}]
