apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
  labels: {app.kubernetes.io/name: dex}
spec:
  # Incident mitigation: cross-node PublicEdge traffic cannot reach the
  # domain-ex host-network endpoint. Keep the locally reachable core endpoint
  # serving until Dex can return to a routable HA data path.
  replicas: 1
  strategy:
    type: RollingUpdate
    # Exactly two eligible nodes plus required anti-affinity leave no placement
    # for a surge pod, so replace one replica at a time.
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app.kubernetes.io/name: dex}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dex}
      annotations:
        images.re8ch.com/dex-digest: sha256:3b472d149aab6bb00516230bed8c582fc66a037966b8c222219b3942228cc5b2
    spec:
      # PublicEdge can route the Cilium pod CIDR but not these nodes' host-
      # network port 5556. On restricted-node-6dc3f140f9, this pod path also reaches the local
      # PostgreSQL primary without crossing the broken inter-node service path.
      dnsPolicy: ClusterFirst
      # Keep the identity bootstrap path available while the replacement DNS
      # plane is being repaired. This is the stable ClusterIP of the GitOps-
      # managed primary database Service, not a PostgreSQL member address.
      hostAliases:
        - ip: 192.0.2.202
          hostnames: [pg-re8ch-primary.pigsty-external.svc.cluster.local]
      imagePullSecrets: [{name: ghcr-re8ch}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: dex}}
      tolerations: [{operator: Exists}]
      containers:
        - name: dex
          image: ghcr.io/re8ch/dex:v2.44.0-amd64@sha256:3b472d149aab6bb00516230bed8c582fc66a037966b8c222219b3942228cc5b2
          # The digest is immutable; ordinary restarts may use node-local CRI
          # cache while a new target can pull the exact artifact.
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/dex]
          args: [serve, /etc/dex/config.yaml]
          ports: [{name: http, containerPort: 5556}]
          env:
            - {name: GITHUB_CLIENT_ID, valueFrom: {secretKeyRef: {name: dex-github, key: client-id}}}
            - {name: GITHUB_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: dex-github, key: client-secret}}}
            - {name: DEX_DB_PASSWORD, valueFrom: {secretKeyRef: {name: dex-postgres, key: password}}}
            # Upstream OAuth is a cluster service with its own endpoint health,
            # failover and policy boundary. Dex never targets a node proxy.
            - {name: HTTP_PROXY, value: "http://identity-egress.egress-fabric.svc.cluster.local:17893"}
            - {name: HTTPS_PROXY, value: "http://identity-egress.egress-fabric.svc.cluster.local:17893"}
            - {name: NO_PROXY, value: "127.0.0.1,localhost,.svc,.cluster.local,192.0.2.183/8,192.0.2.81/10"}
          readinessProbe: {httpGet: {path: /.well-known/openid-configuration, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts: [{name: config, mountPath: /etc/dex, readOnly: true}]
      volumes: [{name: config, secret: {secretName: dex-config}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dex, namespace: dex}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: dex}}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
  labels: {app.kubernetes.io/name: dex}
spec:
  type: NodePort
  # Prefer the Dex replica colocated with an in-cluster caller, while retaining
  # the other replica as an automatic fallback during failure or rollout.
  trafficDistribution: PreferSameNode
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: dex}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP, nodePort: 30781}
