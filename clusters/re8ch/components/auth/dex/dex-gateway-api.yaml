apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-public
  namespace: dex
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: dex-https}
  hostnames: [dex.re8ch.com]
  rules:
    - backendRefs: [{name: dex, port: 80}]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set: [{name: X-Re8ch-Gateway, value: cilium}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: dex-http-redirect, namespace: dex}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: http}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: http}
  hostnames: [dex.re8ch.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 308}
---
# DNS authority is intentionally separate from the multi-parent HTTPRoute.
# ExternalDNS otherwise inherits the canary Gateway's obsolete R640 target.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex-dns-authority
  namespace: dex
  labels:
    networking.re8ch.com/dns-authority: public-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dex.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: dex.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port: {number: 80}
