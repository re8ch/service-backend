apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-dependency-preflight
  namespace: tenant-infrastructure
spec:
  podSelector:
    matchLabels: {app: tenant-control-controller}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: auth}
      podSelector:
        matchLabels: {app.kubernetes.io/name: re8ch-auth-gateway}
    ports: [{protocol: TCP, port: 19447}]
---
# User deletion must inspect retained tenant volumes before archiving its personal
# organization. Keep this read-only permission independent of the Helm release.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identity-dependency-volume-reader
rules:
- apiGroups: [""]
  resources: [persistentvolumes]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: identity-dependency-volume-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: identity-dependency-volume-reader
subjects:
- kind: ServiceAccount
  name: tenant-control-controller
  namespace: tenant-infrastructure
