apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-egress-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 17893
    external-controller: 0.0.0.0:19091
    bind-address: 0.0.0.0
    allow-lan: true
    mode: rule
    ipv6: false
    rules:
      - MATCH,DIRECT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-egress
  namespace: egress-fabric
  labels: {app.kubernetes.io/name: identity-egress}
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    # There are exactly two edge failure domains. Replace one replica at a
    # time so an update never needs a third eligible node.
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app.kubernetes.io/name: identity-egress}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: identity-egress}
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # Public egress belongs to the edge node network. The proxy binds the
      # Pod address used by the Service endpoint, which can differ from hostIP.
      hostNetwork: true
      dnsPolicy: Default
      priorityClassName: system-cluster-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [overseas-kl, overseas-la, restricted-node-6dc3f140f9]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: identity-egress}}
      tolerations: [{operator: Exists}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: bind-node-address
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          # restricted-node-6dc3f140f9's overlay address is not a valid public-egress source. Let the
          # kernel choose its provider-facing source there; edge nodes continue
          # binding their routable endpoint address.
          args: ['if [ "$NODE_NAME" = restricted-node-6dc3f140f9 ]; then cp /base/config.yaml /work/config.yaml; else sed "s|bind-address: 0.0.0.0|bind-address: ${POD_IP}|" /base/config.yaml > /work/config.yaml; fi']
          env:
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /base, readOnly: true}
            - {name: rendered-config, mountPath: /work}
      containers:
        - name: proxy
          image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
          imagePullPolicy: IfNotPresent
          args: [-d, /var/lib/mihomo, -f, /work/config.yaml]
          ports:
            - {name: proxy, containerPort: 17893, protocol: TCP}
            - {name: controller, containerPort: 19091, protocol: TCP}
          startupProbe:
            httpGet: {path: /version, port: controller}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # Provider discovery is on the user-login critical path. Keep an
            # endpoint out of rotation when it cannot reach Google's OIDC
            # metadata instead of letting the auth gateway fail by timeout.
            httpGet:
              path: /proxies/DIRECT/delay?url=https%3A%2F%2Faccounts.google.com%2F.well-known%2Fopenid-configuration&timeout=5000
              port: controller
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 2
          livenessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: rendered-config, mountPath: /work, readOnly: true}
            - {name: state, mountPath: /var/lib/mihomo}
      volumes:
        - {name: config, configMap: {name: identity-egress-config}}
        - {name: rendered-config, emptyDir: {}}
        - {name: state, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-egress
  namespace: egress-fabric
  labels: {app.kubernetes.io/name: identity-egress}
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: identity-egress}
  ports:
    - {name: proxy, port: 17893, targetPort: proxy, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-egress-gitops
  namespace: egress-fabric
  labels: {app.kubernetes.io/name: identity-egress}
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  selector: {app.kubernetes.io/name: identity-egress}
  ports:
    - {name: proxy, port: 17893, targetPort: proxy, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-egress-control-plane
  namespace: egress-fabric
  labels: {app.kubernetes.io/name: identity-egress}
spec:
  # Dex runs on restricted-node-6dc3f140f9. Only select the colocated endpoint so OAuth never
  # depends on a cross-node Service path to an overseas edge.
  internalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: identity-egress}
  ports:
    - {name: proxy, port: 17893, targetPort: proxy, protocol: TCP}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: identity-egress, namespace: egress-fabric}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: identity-egress}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-egress, namespace: egress-fabric}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identity-egress}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dex}
          podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [dex, dex-service]}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: auth}
          podSelector:
            matchLabels: {app.kubernetes.io/name: re8ch-auth-gateway}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: flux-system}
          podSelector:
            matchLabels: {app: source-controller}
      ports: [{port: 17893, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [192.0.2.203/8, 192.0.2.225/10, 127.0.0.0/8, 192.0.2.148/16, 192.0.2.179/12, 192.0.2.148/16]
      ports: [{port: 443, protocol: TCP}]
---
# Tenant claim traffic is transparently SNATed on the controlled restricted-node-6dc3f140f9 egress
# node. The per-claim NetworkPolicy independently rejects private/control-plane
# destinations before this policy is considered.
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata: {name: tenant-metered-public}
spec:
  selectors:
    - namespaceSelector:
        matchExpressions: [{key: saas.re8ch.com/tenant, operator: Exists}]
      podSelector:
        matchLabels: {networking.re8ch.com/egress-class: metered-public}
  destinationCIDRs: [0.0.0.0/0]
  excludedCIDRs: [192.0.2.203/8, 192.0.2.225/10, 127.0.0.0/8, 192.0.2.148/16, 192.0.2.179/12, 192.0.2.148/16, 224.0.0.0/4]
  egressGateway:
    nodeSelector:
      matchLabels: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
