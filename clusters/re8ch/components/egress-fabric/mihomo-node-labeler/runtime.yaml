apiVersion: v1
kind: ServiceAccount
metadata: {name: mihomo-node-labeler, namespace: egress-fabric}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mihomo-node-labeler-inventory, namespace: flux-system}
rules:
  - {apiGroups: [""], resources: [secrets], resourceNames: [cluster-node-inventory], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mihomo-node-labeler-inventory, namespace: flux-system}
subjects: [{kind: ServiceAccount, name: mihomo-node-labeler, namespace: egress-fabric}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mihomo-node-labeler-inventory}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: mihomo-node-labeler}
rules:
  - {apiGroups: [""], resources: [nodes], verbs: [list, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: mihomo-node-labeler}
subjects: [{kind: ServiceAccount, name: mihomo-node-labeler, namespace: egress-fabric}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mihomo-node-labeler}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mihomo-node-labeler, namespace: egress-fabric}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mihomo-node-labeler}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mihomo-node-labeler}}
    spec:
      serviceAccountName: mihomo-node-labeler
      nodeSelector: {kubernetes.io/hostname: r640}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [python, /app/mihomo_node_labels.py]
          resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: code, mountPath: /app, readOnly: true}]
      volumes: [{name: code, configMap: {name: mihomo-node-labeler-code}}]
