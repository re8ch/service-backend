apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-node-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 17891
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: rule
    log-level: warning
    ipv6: false
    external-controller: 0.0.0.0:19090
    external-controller-cors:
      allow-private-network: false
    secret: ""
    unified-delay: true
    tcp-concurrent: true
    find-process-mode: "off"
    proxies:
      # Keep exits as distinct members so Mihomo, rather than DNS selection,
      # owns health tracking and failover. Order is the required preference.
      - {name: OVERSEAS-LA, type: socks5, server: mihomo-egress-overseas-la.egress-fabric.svc.cluster.local, port: 1080, udp: true}
      - {name: OVERSEAS-LA-2, type: socks5, server: mihomo-egress-overseas-la-2.egress-fabric.svc.cluster.local, port: 1080, udp: true}
      - {name: OVERSEAS-FLK, type: socks5, server: mihomo-egress-overseas-flk.egress-fabric.svc.cluster.local, port: 1080, udp: true}
    proxy-providers:
      external-paths:
        type: file
        path: /etc/mihomo/paths.yaml
        health-check:
          enable: true
          url: https://www.gstatic.com/generate_204
          interval: 30
          timeout: 5000
          lazy: false
    proxy-groups:
      - name: stable-egress
        type: fallback
        proxies: [OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]
        url: https://www.gstatic.com/generate_204
        interval: 30
        timeout: 5000
        lazy: false
      - name: github-egress
        type: fallback
        proxies: [OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]
        url: https://github.com/login/oauth/access_token
        interval: 30
        timeout: 5000
        lazy: false
      - name: ghcr-egress
        type: fallback
        proxies: [OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]
        url: https://ghcr.io/v2/
        interval: 30
        timeout: 5000
        lazy: false
    rule-providers:
      cn-ip:
        type: file
        behavior: classical
        path: /etc/mihomo/rules/cn-ip-rules.yaml
    rules:
      - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
      - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
      - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
      - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
      # Probe/control destinations must reveal the physical direct path.
      - DOMAIN,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,ghcr.io,ghcr-egress
      - DOMAIN-SUFFIX,pkg-containers.githubusercontent.com,ghcr-egress
      - DOMAIN-SUFFIX,github.com,github-egress
      - DOMAIN-SUFFIX,githubusercontent.com,github-egress
      - DOMAIN-SUFFIX,cn,DIRECT
      - RULE-SET,cn-ip,DIRECT
      - MATCH,stable-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-node-global-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 17891
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: rule
    log-level: warning
    ipv6: false
    external-controller: 0.0.0.0:19090
    unified-delay: true
    tcp-concurrent: true
    proxies:
      - {name: CN-FABRIC, type: socks5, server: mihomo-egress-cn-headless.egress-fabric.svc.cluster.local, port: 1080, udp: true}
    proxy-groups:
      - {name: stable-cn-egress, type: fallback, proxies: [CN-FABRIC], url: "https://connectivitycheck.gstatic.com/generate_204", interval: 30, timeout: 5000, lazy: false}
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    rules:
      - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
      - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
      - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
      - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
      - DOMAIN,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,cn,stable-cn-egress
      - RULE-SET,cn-ip,stable-cn-egress
      - MATCH,DIRECT
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-la-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 1080
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: direct
    log-level: warning
    ipv6: false
    external-controller: 127.0.0.1:9090
    rules:
      - MATCH,DIRECT
