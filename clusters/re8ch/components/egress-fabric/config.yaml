apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-node-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 17891
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: rule
    log-level: warning
    ipv6: false
    external-controller: 0.0.0.0:19090
    external-controller-cors:
      allow-private-network: false
    secret: ""
    unified-delay: true
    tcp-concurrent: true
    find-process-mode: "off"
    proxies:
      # Stable cross-cluster MihomosCluster projection. Harbor reaches this via
      # the node-local mixed proxy without encoding a remote node or address.
      - {name: ATLANTIC-REGISTRY, type: socks5, server: mihomos-global-exit-atlantic.egress-fabric.svc.cluster.local, port: 1080, udp: false}
      # Keep exits as distinct members so Mihomo, rather than DNS selection,
      # owns health tracking and failover. Order is the required preference.
      - {name: OVERSEAS-LA, type: socks5, server: mihomo-egress-overseas-la.egress-fabric.svc.cluster.local, port: 1080, udp: true}
      - {name: OVERSEAS-LA-2, type: socks5, server: mihomo-egress-overseas-la-2.egress-fabric.svc.cluster.local, port: 1080, udp: true}
      - {name: OVERSEAS-FLK, type: socks5, server: mihomo-egress-overseas-flk.egress-fabric.svc.cluster.local, port: 1080, udp: true}
    proxy-groups:
      - name: registry-egress
        type: fallback
        proxies: [ATLANTIC-REGISTRY, OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]
        url: https://registry.k8s.io/v2/
        interval: 600
        timeout: 5000
        lazy: true
      - name: stable-egress
        type: fallback
        proxies: [OVERSEAS-LA, OVERSEAS-LA-2, OVERSEAS-FLK]
        url: https://www.gstatic.com/generate_204
        interval: 600
        timeout: 5000
        lazy: true
    rule-providers:
      cn-ip:
        type: file
        behavior: classical
        path: /etc/mihomo/rules/cn-ip-rules.yaml
    rules:
      - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
      - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
      - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
      - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
      # Never send an exit's own public listener back through the exit pool.
      # PublicEdge probes and AmongCluster control traffic must observe the
      # physical endpoint, otherwise the selected proxy forms an egress loop.
      - IP-CIDR,179.255.126.104/32,DIRECT,no-resolve
      - IP-CIDR,179.253.231.159/32,DIRECT,no-resolve
      - IP-CIDR,2.28.106.230/32,DIRECT,no-resolve
      - IP-CIDR,2.29.219.31/32,DIRECT,no-resolve
      - IP-CIDR,198.20.153.89/32,DIRECT,no-resolve
      # Probe/control destinations must reveal the physical direct path.
      - DOMAIN,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,ipinfo.io,DIRECT
      # Upstreams represented by registry.re8ch.com Harbor proxy projects.
      - DOMAIN-SUFFIX,docker.io,registry-egress
      - DOMAIN,production.cloudflare.docker.com,registry-egress
      - DOMAIN-SUFFIX,gcr.io,registry-egress
      - DOMAIN-SUFFIX,quay.io,registry-egress
      - DOMAIN-SUFFIX,nvcr.io,registry-egress
      - DOMAIN-SUFFIX,registry.k8s.io,registry-egress
      - DOMAIN-SUFFIX,mcr.microsoft.com,registry-egress
      - DOMAIN-SUFFIX,docker.elastic.co,registry-egress
      - DOMAIN-SUFFIX,container-registry.oracle.com,registry-egress
      - DOMAIN-SUFFIX,ghcr.io,registry-egress
      - DOMAIN-SUFFIX,pkg-containers.githubusercontent.com,registry-egress
      - DOMAIN-SUFFIX,github.com,stable-egress
      - DOMAIN-SUFFIX,githubusercontent.com,stable-egress
      - DOMAIN-SUFFIX,cn,DIRECT
      - RULE-SET,cn-ip,DIRECT
      - MATCH,stable-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-node-global-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 17891
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: rule
    log-level: warning
    ipv6: false
    external-controller: 0.0.0.0:19090
    unified-delay: true
    tcp-concurrent: true
    proxies:
      - {name: CN-FABRIC, type: socks5, server: mihomo-egress-cn-headless.egress-fabric.svc.cluster.local, port: 1080, udp: true}
    proxy-groups:
      - {name: stable-cn-egress, type: fallback, proxies: [CN-FABRIC], url: "https://connect.rom.miui.com/generate_204", interval: 600, timeout: 5000, lazy: true}
    rule-providers:
      cn-ip: {type: file, behavior: classical, path: /etc/mihomo/rules/cn-ip-rules.yaml}
    rules:
      - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
      - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
      - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
      - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
      - DOMAIN,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,ipinfo.io,DIRECT
      - DOMAIN-SUFFIX,cn,stable-cn-egress
      - RULE-SET,cn-ip,stable-cn-egress
      - MATCH,DIRECT
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mihomo-la-config
  namespace: egress-fabric
data:
  config.yaml: |
    mixed-port: 1080
    allow-lan: true
    bind-address: "0.0.0.0"
    mode: direct
    log-level: warning
    ipv6: false
    external-controller: 127.0.0.1:9090
    rules:
      - MATCH,DIRECT
