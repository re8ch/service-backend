apiVersion: apps/v1
kind: Deployment
metadata:
  name: path-controller
  namespace: egress-fabric
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: path-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: path-controller}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: path-controller
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: PreferNoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt, b1-wsl-zt]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: docker.1ms.run/library/python:3.12-alpine
          command: [python, /opt/re8ch/path-controller.py]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Empty means all clients are shadow-only. Set exactly two IDs for
            # the first CN/overseas canary after evidence collection is ready.
            - {name: CANARY_CLIENT_IDS, value: ""}
            - {name: GEODB_PATH, value: /etc/re8ch-geodb/geodb.json.gz}
            - {name: GEODB_SHA256, value: 2187d580ae7ece4c1c399e0723ed2adbf29f666a5d1a013d6746fb8cf9943ff5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: code, mountPath: /opt/re8ch, readOnly: true}
            - {name: geodb, mountPath: /etc/re8ch-geodb, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
      volumes:
        - name: code
          configMap: {name: route-path-controller-code, defaultMode: 0555}
        - name: geodb
          configMap: {name: re8ch-geodb-snapshot}
---
apiVersion: v1
kind: Service
metadata:
  name: path-controller
  namespace: egress-fabric
spec:
  selector: {app.kubernetes.io/name: path-controller}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
