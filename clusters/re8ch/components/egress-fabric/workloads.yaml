apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mihomo-egress
  namespace: egress-fabric
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: mihomo-egress}
  template:
    metadata:
      annotations: {scheduling.re8ch.com/placement-class: node-serving-agent}
      labels: {app.kubernetes.io/name: mihomo-egress}
    spec:
      hostNetwork: true
      priorityClassName: system-node-critical
      # Exit agents follow a capability label. Consumers use the Service and
      # never encode a node name or region-specific Pod identity.
      nodeSelector: {networking.re8ch.com/mihomo-exit: enabled, scheduling.re8ch.com/workload-eligible: "true"}
      # Keep an already-running exit available during a temporary kubelet or
      # control-plane partition. Health probes, not Node Ready, remove it.
      tolerations:
        - {operator: Exists}
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - {name: ndots, value: "1"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mihomo
          image: docker.io/metacubex/mihomo:v1.19.29@sha256:e1d7dadaa9368a52d420d65007e0e0d87cb148d292faa67326eda3fef5757f59
          args: [-d, /etc/mihomo]
          ports:
            - {name: socks, containerPort: 1080, protocol: TCP}
          readinessProbe: {tcpSocket: {port: socks}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: socks}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 800m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /etc/mihomo}
      initContainers:
        - name: bind-private-node-address
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              sed "s/bind-address: \"0.0.0.0\"/bind-address: \"${HOST_IP}\"/" /base/config.yaml > /work/config.yaml
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /base, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: config
          configMap: {name: mihomo-la-config}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-egress
  namespace: egress-fabric
spec:
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: mihomo-egress}
  ports:
    - {name: socks, port: 1080, targetPort: socks, protocol: TCP}
---
# Compatibility name for clients not yet migrated to the region-neutral name.
apiVersion: v1
kind: Service
metadata:
  name: mihomo-egress-la
  namespace: egress-fabric
spec:
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: mihomo-egress}
  ports:
    - {name: socks, port: 1080, targetPort: socks, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-egress-headless
  namespace: egress-fabric
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: {app.kubernetes.io/name: mihomo-egress}
  ports:
    - {name: socks, port: 1080, targetPort: socks, protocol: TCP}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mihomo-node
  namespace: egress-fabric
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # hostNetwork listeners are node-unique; surge would collide on ports.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mihomo-node}
  template:
    metadata:
      annotations: {scheduling.re8ch.com/placement-class: node-serving-agent}
      labels: {app.kubernetes.io/name: mihomo-node, networking.re8ch.com/mihomo-local-proxy: "true"}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {networking.re8ch.com/geo: cn, scheduling.re8ch.com/workload-eligible: "true"}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      # Every schedulable cluster node owns a local egress proxy. Geography
      # and path selection remain data-plane policy, not placement gates.
      containers:
        - name: mihomo
          image: metacubex/mihomo:v1.19.29
          imagePullPolicy: IfNotPresent
          args: [-d, /etc/mihomo]
          ports:
            - {name: mixed, containerPort: 17891, protocol: TCP}
            - {name: controller, containerPort: 19090, protocol: TCP}
          startupProbe:
            httpGet: {path: /version, port: controller}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 15}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: work, mountPath: /etc/mihomo}
            - {name: config, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: paths, mountPath: /etc/mihomo/paths.yaml, subPath: paths.yaml, readOnly: true}
            - {name: cn-rules, mountPath: /etc/mihomo/rules, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mihomo-node-config}
        - name: paths
          secret: {secretName: egress-fabric-paths}
        - name: work
          emptyDir: {}
        - name: cn-rules
          configMap: {name: mihomo-cn-ip-rules}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-node
  namespace: egress-fabric
spec:
  internalTrafficPolicy: Local
  selector: {networking.re8ch.com/mihomo-local-proxy: "true"}
  ports:
    - {name: mixed, port: 17891, targetPort: mixed, protocol: TCP}
---
# Bootstrap path for nodes that do not yet have a local Mihomo image.
apiVersion: v1
kind: Service
metadata:
  name: mihomo-gateway
  namespace: egress-fabric
spec:
  selector: {networking.re8ch.com/mihomo-local-proxy: "true"}
  ports:
    - {name: mixed, port: 17891, targetPort: mixed, protocol: TCP}
