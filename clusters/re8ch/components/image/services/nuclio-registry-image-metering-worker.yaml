      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    nuclio.io/app: functionres
    nuclio.io/class: function
    nuclio.io/function-name: registry-image-metering-worker
    nuclio.io/function-version: latest
    nuclio.io/project-name: default
