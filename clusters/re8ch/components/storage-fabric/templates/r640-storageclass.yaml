{{- if .Values.managedDatasets.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs-r640
  labels:
    storage.re8ch.com/availability-class: single-node
    storage.re8ch.com/failure-domain: r640
    storage.re8ch.com/replication: "1"
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    storage.re8ch.com/ha: "false"
    storage.re8ch.com/backup-required: "true"
    storage.re8ch.com/usage-policy: >-
      R640-local single-copy CephFS. R640 failure makes data unavailable; use
      only for workloads with a verified external backup.
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph
  fsName: re8ch-files
  pool: re8ch-files-r640
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - noatime
  - ms_mode=secure
{{- end }}
