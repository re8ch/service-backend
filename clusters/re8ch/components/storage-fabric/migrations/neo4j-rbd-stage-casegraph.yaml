apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-ledger-casegraph-0-rbd-stage
  namespace: neo4j
  labels:
    storage.re8ch.com/migration: local-path-to-r640-rbd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rbd-r640
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: migrate-ledger-casegraph-to-rbd
  namespace: neo4j
spec:
  nodeSelector:
    kubernetes.io/hostname: r640
  restartPolicy: Never
  containers:
    - name: copy
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - >-
          set -eu;
          cd /source;
          tar cpf - . | (cd /target && tar xpf -);
          sync;
          test "$(find /source -xdev -type f | wc -l)" = "$(find /target -xdev -type f | wc -l)";
          du -sk /source /target
      securityContext:
        runAsUser: 0
      volumeMounts:
        - {name: source, mountPath: /source, readOnly: true}
        - {name: target, mountPath: /target}
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: data-ledger-casegraph-0
        readOnly: true
    - name: target
      persistentVolumeClaim:
        claimName: data-ledger-casegraph-0-rbd-stage
