apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [reconciler.yaml, public-mesh-podcidr.yaml, control-api-source.yaml, dns-reachability.yaml, ../host-network-controller]
configMapGenerator:
  - name: public-mesh-podcidr
    namespace: kube-system
    files:
      - public-mesh-podcidr-reconcile.sh
      - inventory.json=public-mesh-inventory.json
  - name: host-network-contract
    namespace: kube-system
    files: [host-network-contract.json]
  - name: podcidr-fabric-inventory
    namespace: kube-system
    files: [inventory.json]
  - name: control-dns-reachability
    namespace: kube-system
    files: [probe.py]
generatorOptions:
  disableNameSuffixHash: true
