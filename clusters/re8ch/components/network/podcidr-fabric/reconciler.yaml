apiVersion: v1
kind: ConfigMap
metadata:
  name: podcidr-fabric-reconciler
  namespace: kube-system
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu
    loaded_revision="$(sha256sum /config/reconcile.sh /config/inventory.json)"
    reload_if_changed() {
      if [ "${loaded_revision}" != "$(sha256sum /config/reconcile.sh /config/inventory.json)" ]; then
        echo "${NODE_NAME}: projected fabric revision changed; reloading owner"
        exec /usr/bin/sh /config/reconcile.sh
      fi
    }

    node="$(jq -c --arg name "${NODE_NAME}" '.nodes[] | select(.name == $name)' /config/inventory.json)"
    route_server="$(jq -c --arg name "${NODE_NAME}" '.routeServers[] | select(.name == $name)' /config/inventory.json)"
    test -n "${node}${route_server}"

    host() {
      nsenter -t 1 -n chroot /host "$@"
    }

    reconcile_host_source_identity() {
      source_policy="$(jq -c --arg n "${NODE_NAME}" '.hostSourceIdentity[$n] // empty' /config/inventory.json)"
      binding="$(host vtysh -c 'show running-config' | sed -n 's/^ip protocol bgp route-map //p')"
      if [ -z "${source_policy}" ]; then
        if [ "${binding}" = RE8CH-POD-SOURCE ]; then
          host vtysh -c 'configure terminal' -c 'no ip protocol bgp route-map RE8CH-POD-SOURCE' -c 'end' -c 'write memory'
        fi
        return 0
      fi
      case "${binding}" in
        ''|RE8CH-POD-SOURCE) ;;
        *) echo "${NODE_NAME}: refusing to replace foreign zebra route policy ${binding}" >&2; return 1 ;;
      esac
      source_ip="$(printf '%s' "${source_policy}" | jq -r .source)"
      host ip -j -4 address show | jq -e --arg ip "${source_ip}" '[.[].addr_info[]? | select(.local == $ip)] | length > 0' >/dev/null
      desired_prefixes="$(printf '%s' "${source_policy}" | jq -r '.prefixMatches[]')"
      # Apply one identity to every admitted fabric BGP route. Pod and identity/
      # VIP routes can share Zebra nexthop groups; their source intent must agree.
      # Zebra preferred source changes locally originated packets only. Forwarded
      # Pod packets retain their addresses; BGP next hops and ECMP stay intact.
      {
        echo 'configure terminal'
        echo 'no ip prefix-list RE8CH-POD-SOURCE'
        printf '%s\n' "${desired_prefixes}" | awk '{print "ip prefix-list RE8CH-POD-SOURCE seq " NR*10 " permit " $0}'
        echo 'route-map RE8CH-POD-SOURCE permit 10'
        echo 'match ip address prefix-list RE8CH-POD-SOURCE'
        echo "set src ${source_ip}"
        echo 'exit'
        echo 'route-map RE8CH-POD-SOURCE permit 1000'
        echo 'exit'
        echo 'no route-map RE8CH-POD-SOURCE optimization'
        echo 'ip protocol bgp route-map RE8CH-POD-SOURCE'
        echo 'end'
      } > /run/re8ch-pod-source.vty
      policy_hash="$(sha256sum /run/re8ch-pod-source.vty)"
      [ "${binding}" = RE8CH-POD-SOURCE ] && [ "${source_policy_hash:-}" = "${policy_hash}" ] && return 0
      # A rejected revision remains latched across container restarts. A changed
      # declaration/script produces a new token and is eligible for a new trial.
      trial_hash="$(printf '%s%s' "${loaded_revision}" "${policy_hash}" | sha256sum | awk '{print $1}')"
      failed_file=/host/var/lib/re8ch/pod-source-rejected
      [ "$(cat "${failed_file}" 2>/dev/null || true)" = "${trial_hash}" ] && return 0
      host vtysh < /run/re8ch-pod-source.vty
      # Validate the actual FIB source before persisting. On failure unbind only
      # this owned filter; learned routes remain under FRR and no host route is added.
      verified=false
      tries=0
      while [ "${tries}" -lt 60 ]; do
        tries=$((tries + 1))
        sleep 1
        if host ip -j route show proto bgp | jq -e --arg src "${source_ip}" --argjson p "${source_policy}" '[.[] | select(.dst | test("^10\\.(42\\.[0-9]+\\.0/24|250\\.0\\.[0-9]+(/32)?|251\\.0\\.[0-9]+(/32)?)$"))] as $routes | ($routes | length > 0) and all($routes[]; .prefsrc == $src)' >/dev/null; then
          verified=true; break
        fi
      done
      mkdir -p /host/var/lib/re8ch
      host ip -j route show proto bgp > /host/var/lib/re8ch/pod-source-observed.json.next
      mv /host/var/lib/re8ch/pod-source-observed.json.next /host/var/lib/re8ch/pod-source-observed.json
      if [ "${verified}" != true ]; then
        host vtysh -c 'configure terminal' -c 'no ip protocol bgp route-map RE8CH-POD-SOURCE' -c 'end' -c 'write memory'
        mkdir -p /host/var/lib/re8ch
        printf '%s\n' "${trial_hash}" > "${failed_file}"
        echo "${NODE_NAME}: source policy FIB verification failed; binding rolled back and revision rejected" >&2
        return 0
      fi
      host vtysh -c 'write memory'
      rm -f "${failed_file}"
      source_policy_hash="${policy_hash}"
    }

    # Advertise that this running writer understands per-peer adoption.
    # Delivery waits for this marker before transferring ownership.
    host touch /run/re8ch-public-mesh-handoff-v1

    wait_for_bgp() {
      attempts=0
      while [ "${attempts}" -lt 30 ]; do
        summary="$(host vtysh -c 'show bgp ipv4 unicast summary json' 2>/dev/null || true)"
        peers_ready=false
        control_plane_node=false
        jq -e --arg node "${NODE_NAME}" '.controlPlaneNodes | index($node) != null' /config/inventory.json >/dev/null && control_plane_node=true
        if [ -n "${route_server}" ]; then
          # A/B are a single logical route-server plane.  Do not report either
          # node Ready when its peer RR is absent, even if a spoke session is
          # still Established.
          rr_peer="$(jq -r --arg own "${NODE_NAME}" '.routeServers[] | select(.name != $own) | .rrInterconnectIp' /config/inventory.json)"
          printf '%s' "${summary}" | jq -e --argjson asn "${asn}" --arg peer "${rr_peer}" \
            '.as == $asn and .peers[$peer].state == "Established"' >/dev/null && peers_ready=true
        elif [ "${control_plane_node}" = true ]; then
          # restricted-node-6dc3f140f9 must retain both A1 and B1 sessions.  A single surviving RR is
          # degraded service, not a completed reconciliation.
          printf '%s' "${summary}" | jq -e --argjson asn "${asn}" --arg a1 "${a1_peer}" --arg b1 "${b1_peer}" \
            '.as == $asn and .peers[$a1].state == "Established" and .peers[$b1].state == "Established"' >/dev/null && peers_ready=true
        else
          printf '%s' "${summary}" | jq -e --argjson asn "${asn}" \
            '.as == $asn and ([.peers[]? | select(.state == "Established")] | length >= 1)' >/dev/null && peers_ready=true
        fi

        rib_ready=true
        fib_ready=true
        if [ "${control_plane_node}" = true ]; then
          jq -r '.readinessPodCIDRs[]' /config/inventory.json | while read -r prefix; do
            [ "${prefix}" = "${pod_cidr}" ] && continue
            host vtysh -c "show bgp ipv4 unicast ${prefix} json" 2>/dev/null |
              jq -e '[.paths[]? | select(.valid == true)] | length > 0' >/dev/null || {
                touch /tmp/podcidr-fabric-rib-missing
                break
              }
            host ip -4 route show exact "${prefix}" | grep -Eq "^${prefix} .*(via|dev) " || {
              touch /tmp/podcidr-fabric-fib-missing
              break
            }
          done
        fi
        [ ! -e /tmp/podcidr-fabric-rib-missing ] || rib_ready=false
        [ ! -e /tmp/podcidr-fabric-fib-missing ] || fib_ready=false
        rm -f /tmp/podcidr-fabric-rib-missing /tmp/podcidr-fabric-fib-missing

        if [ "${peers_ready}" = true ] && [ "${rib_ready}" = true ] && [ "${fib_ready}" = true ]; then
          return 0
        fi
        attempts=$((attempts + 1))
        sleep 2
      done
      echo "${NODE_NAME}: A/B peer, complete PodCIDR RIB, or kernel FIB gate is not ready" >&2
      return 1
    }

    if ! host systemctl is-active --quiet frr; then
      host vtysh -C -f /etc/frr/frr.conf
      host systemctl enable --now frr
    fi

    cleanup_cilium_direct_routes() {
      jq -e '.removeCiliumDirectRoutes == true' /config/inventory.json >/dev/null || return 0
      jq -r '.routeServers[], .nodes[] | .podCIDR' /config/inventory.json | while read -r prefix; do
        [ "${prefix}" = "${pod_cidr}" ] && continue
        host vtysh -c "show bgp ipv4 unicast ${prefix} json" 2>/dev/null |
          jq -e '[.paths[]? | select(.valid == true)] | length > 0' >/dev/null || {
            # A missing replacement path is a per-prefix safety condition, not
            # a fatal controller error. Keep the kernel route and continue
            # reconciling BGP sessions and every other prefix.
            echo "${NODE_NAME}: retaining ${prefix}; no valid FRR replacement path" >&2
            continue
          }
        while host ip route show "${prefix}" proto kernel | grep -q "^${prefix}"; do
          host ip route del "${prefix}" proto kernel
        done
      done
    }

    reconcile_control_api_source_identity() {
      [ -n "${node}" ] || return 0
      [ "$(printf '%s' "${node}" | jq -r '.peerMode')" = transport ] || return 0
      last="$(printf '%s' "${node}" | jq -r '.internalIp | split(".")[3]')"
      identity="$(printf '%s' "${node}" | jq -r '.acceleratedIp')"
      host nft list table ip re8ch_control_api_snat >/dev/null 2>&1 ||
        host nft add table ip re8ch_control_api_snat
      host nft list chain ip re8ch_control_api_snat postrouting >/dev/null 2>&1 ||
        host nft 'add chain ip re8ch_control_api_snat postrouting { type nat hook postrouting priority srcnat; policy accept; }'
      for fabric in 93 94; do
        if [ "${fabric}" = 93 ]; then iface=wg-pt-a1; else iface=wg-pt-b1; fi
        host ip link show "${iface}" >/dev/null 2>&1 || continue
        # ECMP can send a socket sourced from either tunnel across this iface.
        for source_fabric in 93 94; do
          for api_ip in 192.0.2.116 $(jq -r '.routeServers[], .relayNodes[]? | .acceleratedIp' /config/inventory.json); do
            rule="ip saddr 172.31.${source_fabric}.${last} ip daddr ${api_ip} tcp dport 6443 oifname \"${iface}\" snat to ${identity}"
            host nft list chain ip re8ch_control_api_snat postrouting | grep -Fq "${rule}" ||
              host nft add rule ip re8ch_control_api_snat postrouting ip saddr "172.31.${source_fabric}.${last}/32" ip daddr "${api_ip}/32" tcp dport 6443 oifname "${iface}" snat to "${identity}"
          done
        done
      done
    }

    reconcile_control_api_spoke_symmetry() {
      [ -n "${route_server}" ] || return 0
      if [ "${NODE_NAME}" = restricted-node-1eb0570f74 ]; then cp_iface=wg-cp-a1; else cp_iface=wg-cp-b1; fi
      host ip link show "${cp_iface}" >/dev/null 2>&1 || return 0
      local_ip="$(printf '%s' "${route_server}" | jq -r '.acceleratedIp')"
      for relay_ip in $(jq -r '.relayNodes[]? | .acceleratedIp' /config/inventory.json); do
        for spoke_ip in $(jq -r '.nodes[] | select(.peerMode == "transport" and .name != "restricted-node-6dc3f140f9") | .acceleratedIp' /config/inventory.json); do
          host ip rule show | grep -Fq "from ${spoke_ip} to ${relay_ip} ipproto tcp dport 6443 lookup 15300" ||
            host ip rule add pref 11519 from "${spoke_ip}/32" to "${relay_ip}/32" ipproto tcp dport 6443 lookup 15300
          host ip rule show | grep -Fq "to ${spoke_ip} iif ${cp_iface} lookup main" ||
            host ip rule add pref 11522 iif "${cp_iface}" to "${spoke_ip}/32" lookup main
          for reply_ip in "${local_ip}" 192.0.2.116; do
            host ip rule show | grep -Fq "from ${reply_ip} to ${spoke_ip} ipproto tcp sport 6443 lookup main" ||
              host ip rule add pref 11522 from "${reply_ip}/32" to "${spoke_ip}/32" ipproto tcp sport 6443 lookup main
          done
        done
      done
      for node_ip in $(jq -r '.nodes[].acceleratedIp' /config/inventory.json); do
        host ip rule show | grep -Fq "from 192.0.2.116 to ${node_ip} ipproto tcp sport 6443 lookup main" ||
          host ip rule add pref 11522 from 192.0.2.116/32 to "${node_ip}/32" ipproto tcp sport 6443 lookup main
      done
    }

    reconcile_wireguard_allowed_ips() {
      if [ -n "${route_server}" ]; then
        # The A1/B1 interconnect also carries return traffic for the opposite
        # route server's transport spokes.  Without this explicit transport
        # CIDR, a reflected route can be reachable in the forward direction
        # while replies escape through WSL's default gateway.
        if host ip link show wg-wsl-lan >/dev/null 2>&1; then
          jq -c --arg own "${NODE_NAME}" '.routeServers[] | select(.name != $own)' /config/inventory.json | while read -r other_rr; do
            other_interconnect="$(printf '%s' "${other_rr}" | jq -r .rrInterconnectIp)"
            other_transport_octet="$(printf '%s' "${other_rr}" | jq -r '.transportIp | split(".")[2]')"
            other_transport_cidr="172.31.${other_transport_octet}.0/24"
            peer_key="$(host wg show wg-wsl-lan allowed-ips | awk -v needle="${other_interconnect}/32" '$0 ~ needle {print $1; exit}')"
            [ -n "${peer_key}" ] || continue
            allowed="$(host wg show wg-wsl-lan allowed-ips | awk -v key="${peer_key}" '$1 == key {for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit}')"
            case ",${allowed}," in *",${other_transport_cidr},"*) : ;; *) host wg set wg-wsl-lan peer "${peer_key}" allowed-ips "${allowed},${other_transport_cidr}" ;; esac
            host vtysh -c 'configure terminal' -c "ip route ${other_transport_cidr} ${other_interconnect} wg-wsl-lan 5" -c end
          done
        fi
        if [ "${NODE_NAME}" = restricted-node-1eb0570f74 ]; then iface=wg-pt-a1; fabric_octet=93; else iface=wg-pt-b1; fabric_octet=94; fi
        host ip link show "${iface}" >/dev/null 2>&1 || return 0
        jq -c '.nodes[] | select(.peerMode == "transport")' /config/inventory.json | while read -r spoke; do
          last="$(printf '%s' "${spoke}" | jq -r '.internalIp | split(".")[3]')"
          prefix="$(printf '%s' "${spoke}" | jq -r .podCIDR)"
          peer_key="$(host wg show "${iface}" allowed-ips | awk -v needle="172.31.${fabric_octet}.${last}/32" '$0 ~ needle {print $1; exit}')"
          [ -n "${peer_key}" ] || continue
          allowed="$(host wg show "${iface}" allowed-ips | awk -v key="${peer_key}" '$1 == key {for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit}')"
          case ",${allowed}," in *",${prefix},"*) : ;; *) host wg set "${iface}" peer "${peer_key}" allowed-ips "${allowed},${prefix}" ;; esac
        done
        # Relayed identities use restricted-node-6dc3f140f9's existing tunnel, never a direct A/B peer.
        r640_peer="$(host wg show "${iface}" allowed-ips | awk -v transit="172.31.${fabric_octet}.128/32" '{ for (i=2; i<=NF; i++) if ($i == transit) { print $1; exit } }')"
        if [ -n "${r640_peer}" ]; then
          allowed="$(host wg show "${iface}" allowed-ips | awk -v key="${r640_peer}" '$1 == key { for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit }')"
          current="${allowed}"
          for prefix in $(jq -r '.relayNodes[]? | (.acceleratedIp + "/32"), (.podCIDR // empty)' /config/inventory.json); do
            case ",${allowed}," in *",${prefix},"*) : ;; *) allowed="${allowed},${prefix}" ;; esac
          done
          [ "${allowed}" = "${current}" ] || host wg set "${iface}" peer "${r640_peer}" allowed-ips "${allowed}"
        fi
        return 0
      fi

      for iface in wg-pt-a1 wg-pt-b1; do
        host ip link show "${iface}" >/dev/null 2>&1 || continue
        peer_key="$(host wg show "${iface}" peers | awk 'NR == 1 {print; exit}')"
        [ -n "${peer_key}" ] || continue
        allowed="$(host wg show "${iface}" allowed-ips | awk -v key="${peer_key}" '$1 == key {for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit}')"
        remote_pods="$(jq -r --arg own "${pod_cidr}" '.routeServers[], .relayNodes[]?, .nodes[] | .podCIDR | select(. != $own)' /config/inventory.json | paste -sd, -)"
        relay_identities="192.0.2.116/32,$(jq -r '.relayNodes[]? | .acceleratedIp + "/32"' /config/inventory.json | paste -sd, -)"
        if [ "${peer_mode}" = transport ]; then
          if [ "${iface}" = wg-pt-a1 ]; then transport_cidr=192.0.2.63/24; else transport_cidr=192.0.2.208/24; fi
          case ",${allowed}," in *",${transport_cidr},"*) : ;; *) allowed="${allowed},${transport_cidr}" ;; esac
          host vtysh -c 'configure terminal' -c "ip route ${transport_cidr} ${iface} 5" -c end
        fi
        for prefix in $(printf '%s,%s' "${remote_pods}" "${relay_identities}" | tr ',' ' '); do
          case ",${allowed}," in *",${prefix},"*) : ;; *) allowed="${allowed},${prefix}" ;; esac
        done
        host wg set "${iface}" peer "${peer_key}" allowed-ips "${allowed}"
      done
    }

    reconcile_rr_interconnect_transit_sources() {
      [ -n "${route_server}" ] || return 0
      iface=wg-wsl-lan
      host ip link show "${iface}" >/dev/null 2>&1 || {
        echo "${NODE_NAME}: missing ${iface} for route-server transit" >&2
        return 1
      }
      rr_peer="$(jq -r --arg own "${NODE_NAME}" '.routeServers[] | select(.name != $own) | .rrInterconnectIp' /config/inventory.json)"
      peer_key="$(host wg show "${iface}" allowed-ips | awk -v peer="${rr_peer}/32" '
        { for (i=2; i<=NF; i++) if ($i == peer) { print $1; exit } }
      ')"
      [ -n "${peer_key}" ] || {
        echo "${NODE_NAME}: missing ${iface} peer for ${rr_peer}" >&2
        return 1
      }
      allowed="$(host wg show "${iface}" allowed-ips | awk -v key="${peer_key}" '
        $1 == key { for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit }
      ')"
      current="${allowed}"
      # Forwarded spoke traffic is SNATed to its inventory-owned accelerated
      # identity. The opposite RR must accept those exact sources on its
      # interconnect; permitting the whole accelerated /24 is unnecessary.
      for prefix in $(jq -r '.nodes[].acceleratedIp + "/32", (.relayNodes[]? | (.acceleratedIp + "/32"), (.podCIDR // empty))' /config/inventory.json); do
        case ",${allowed}," in *",${prefix},"*) : ;; *) allowed="${allowed},${prefix}" ;; esac
      done
      [ "${allowed}" = "${current}" ] || host wg set "${iface}" peer "${peer_key}" allowed-ips "${allowed}"
    }

    reconcile_rr_interconnect_source_identity() {
      [ -n "${route_server}" ] || return 0
      interconnect_ip="$(printf '%s' "${route_server}" | jq -r .rrInterconnectIp)"
      accelerated_ip="$(printf '%s' "${route_server}" | jq -r .acceleratedIp)"
      accelerated_cidr="$(jq -r .acceleratedCIDR /config/inventory.json)"
      host nft list table ip re8ch_fabric >/dev/null 2>&1 || host nft add table ip re8ch_fabric
      host nft list chain ip re8ch_fabric postrouting >/dev/null 2>&1 ||
        host nft 'add chain ip re8ch_fabric postrouting { type nat hook postrouting priority srcnat; policy accept; }'
      # FRR may select the opposite RR for a control-plane destination. Keep
      # locally originated interconnect traffic on the node's declared /32 so
      # the next WireGuard peer accepts it and can route the reply symmetrically.
      rule="ip saddr ${interconnect_ip} ip daddr ${accelerated_cidr} oifname \"wg-wsl-lan\" snat to ${accelerated_ip}"
      host nft list chain ip re8ch_fabric postrouting | grep -Fq "${rule}" ||
        host nft add rule ip re8ch_fabric postrouting ip saddr "${interconnect_ip}/32" \
          ip daddr "${accelerated_cidr}" oifname wg-wsl-lan snat to "${accelerated_ip}"
    }

    reconcile_transit_forwarding() {
      [ "${NODE_NAME}" = restricted-node-6dc3f140f9 ] || return 0
      chain=RE8CH-FABRIC-FORWARD
      if ! jq -e --arg node "${NODE_NAME}" '.transitForwarding[$node] | length > 0' /config/inventory.json >/dev/null; then
        if host iptables -w -S "${chain}" >/dev/null 2>&1; then
          host iptables -w -D FORWARD -j "${chain}" 2>/dev/null || true
          host iptables -w -F "${chain}"
          host iptables -w -X "${chain}"
        fi
        return 0
      fi
      desired="$(mktemp)"
      jq -r --arg node "${NODE_NAME}" --arg chain "${chain}" '.transitForwarding[$node][] |
        "-A " + $chain + " -s " + .source + " -d " + .destination + " -i " + .inInterface + " -o " + .outInterface + " -j ACCEPT"' /config/inventory.json >"${desired}"
      current="$(host iptables -w -S "${chain}" 2>/dev/null | sed '/^-N /d' || true)"
      if [ "${current}" != "$(cat "${desired}")" ]; then
        transaction="$(mktemp)"
        { echo '*filter'; echo ":${chain} - [0:0]"; echo "-F ${chain}"; cat "${desired}"; echo COMMIT; } >"${transaction}"
        host iptables-restore --test --noflush -w <"${transaction}"
        host iptables-restore --noflush -w <"${transaction}"
        rm -f "${transaction}"
      fi
      # Before UFW's default deny, but after Cilium's local-delivery chain.
      host iptables -w -C FORWARD -j "${chain}" 2>/dev/null || host iptables -w -I FORWARD 2 -j "${chain}"
      rm -f "${desired}"
    }

    reconcile_r640_identity_transit_nat() {
      [ "${NODE_NAME}" = restricted-node-1eb0570f74 ] || return 0
      host ip link show wg-pt-a1 >/dev/null 2>&1 || return 0
      host nft list table ip re8ch_fabric >/dev/null 2>&1 || host nft add table ip re8ch_fabric
      host nft list chain ip re8ch_fabric postrouting >/dev/null 2>&1 ||
        host nft 'add chain ip re8ch_fabric postrouting { type nat hook postrouting priority srcnat; policy accept; }'
      jq -r '.nodes[] | select(.peerMode == "identity") | .podCIDR' /config/inventory.json | while read -r peer_pods; do
        host nft list chain ip re8ch_fabric postrouting | grep -Fq "ip daddr ${peer_pods}" ||
          host nft add rule ip re8ch_fabric postrouting ip saddr 192.0.2.86/32 ip daddr "${peer_pods}" masquerade
      done
    }

    reconcile_public_mesh_allowed_ips() {
      iface=wg-public-mesh
      host ip link show "${iface}" >/dev/null 2>&1 || return 0
      jq -c --arg own "${NODE_NAME}" '.routeServers[], .nodes[], .relayNodes[]? | select(.name != $own)' /config/inventory.json | while read -r remote; do
        last="$(printf '%s' "${remote}" | jq -r '.acceleratedIp | split(".")[3]')"
        accelerated="$(printf '%s' "${remote}" | jq -r .acceleratedIp)"
        prefix="$(printf '%s' "${remote}" | jq -r .podCIDR)"
        peer_key="$(host wg show "${iface}" allowed-ips | awk -v accel="${accelerated}/32" -v mesh="172.31.92.${last}/32" '
          { for (i=2; i<=NF; i++) if ($i == accel || $i == mesh) { print $1; exit } }
        ')"
        [ -n "${peer_key}" ] || continue
        allowed="$(host wg show "${iface}" allowed-ips | awk -v key="${peer_key}" '$1 == key {for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit}')"
        # A reviewed host adoption transfers this peer's complete AllowedIPs
        # to the single host assembler. Other peers stay with this reconciler.
        if [ -f /host/var/lib/re8ch/host-network/adoption.json ] &&
          jq -e --arg key "${peer_key}" '.peerKeys | index($key) != null' /host/var/lib/re8ch/host-network/adoption.json >/dev/null; then
          continue
        fi
        case ",${allowed}," in *",${prefix},"*) : ;; *) host wg set "${iface}" peer "${peer_key}" allowed-ips "${allowed},${prefix}" ;; esac
      done
    }

    cleanup_retired_panel_api_dnat() {
      [ "${NODE_NAME}" = vm-20-12-ubuntu ] || return 0
      # This bootstrap-only redirect makes a connection addressed to restricted-node-6dc3f140f9
      # register its K3s remotedialer session on A1 instead. Remove only the
      # exact historical rule; do not alter any other OUTPUT NAT policy.
      while host iptables -t nat -C OUTPUT \
        -d 192.0.2.178/32 -p tcp --dport 6443 \
        -m comment --comment 'RE8CH panel K3s API recovery via A1' \
        -j DNAT --to-destination 192.0.2.176:6443 2>/dev/null; do
        host iptables -t nat -D OUTPUT \
          -d 192.0.2.178/32 -p tcp --dport 6443 \
          -m comment --comment 'RE8CH panel K3s API recovery via A1' \
          -j DNAT --to-destination 192.0.2.176:6443
      done
    }

    reconcile_control_plane_identity_routes() {
      # A host may be joined to several ZeroTier networks. Select the interface
      # which actually owns this Kubernetes InternalIP; interface enumeration
      # order is not routing authority.
      identity_iface="$(host ip -o -4 addr show | awk -v own="${internal_ip}" '$4 ~ ("^" own "/") {print $2; exit}')"
      # Control-plane identities are certificate and etcd authorities, not a
      # generic optimization domain. restricted-node-6dc3f140f9 has no ordinary Linux ZeroTier L2
      # endpoint: B1 reaches it directly through wg-pt-b1, while A1 reaches it
      # directly through wg-pt-a1 over the public underlay. Never overwrite those paths with a
      # 192.0.2.178/32 route via the ZeroTier interface.
      # Identity-mode BGP speakers preserve their Kubernetes InternalIP as the
      # next hop. Pin those /32 identities to the interface which owns this
      # node's InternalIP so a broad underlay/default route cannot capture
      # recursive BGP next-hop resolution. This must run before the restricted-node-6dc3f140f9/B1
      # control-plane exception below.
      if [ -n "${identity_iface}" ]; then
        jq -r --arg own "${NODE_NAME}" '. as $root | ($root.nodes[] | select(.name == $own) | .publicMeshIdentityPeers // []) as $mesh | $root.nodes[] | select(.name != $own and .peerMode == "identity" and (.name as $name | $mesh | index($name) | not)) | .internalIp' /config/inventory.json | while read -r peer_ip; do
          host vtysh -c 'configure terminal' -c "ip route ${peer_ip}/32 ${identity_iface} 5" -c end
        done
        jq -r --arg own "${NODE_NAME}" '. as $root | ($root.nodes[] | select(.name == $own) | .publicMeshIdentityPeers // [])[] as $name | ($root.routeServers[], $root.nodes[]) | select(.name == $name) | .internalIp' /config/inventory.json | while read -r peer_ip; do
          host vtysh -c 'configure terminal' -c "no ip route ${peer_ip}/32 ${identity_iface} 5" -c end
        done
      fi
      # restricted-node-6dc3f140f9's ZeroTier membership cannot currently reach the Qwen identity
      # peers directly, while its private A1 transit is healthy and already
      # authorizes every remote PodCIDR. Resolve identity-mode leaf PodCIDRs
      # through that transit so the public edge can reach their workloads.
      if [ "${NODE_NAME}" = restricted-node-6dc3f140f9 ] && host ip link show wg-pt-a1 >/dev/null 2>&1; then
        jq -r --arg own "${NODE_NAME}" '. as $root | ($root.nodes[] | select(.name == $own) | .publicMeshPodCIDRPeers // []) as $mesh | $root.nodes[] | select(.name != $own and .peerMode == "identity" and (.name as $name | $mesh | index($name) | not)) | .podCIDR' /config/inventory.json | while read -r peer_pods; do
          host vtysh -c 'configure terminal' -c "ip route ${peer_pods} wg-pt-a1 5" -c end
        done
        jq -r --arg own "${NODE_NAME}" '. as $root | ($root.nodes[] | select(.name == $own) | .publicMeshPodCIDRPeers // [])[] as $name | $root.nodes[] | select(.name == $name) | .podCIDR' /config/inventory.json | while read -r peer_pods; do
          host vtysh -c 'configure terminal' -c "no ip route ${peer_pods} wg-pt-a1 5" -c end
        done
      fi
      if [ "${NODE_NAME}" = restricted-node-1eb0570f74 ]; then
        host vtysh -c 'configure terminal' \
          -c "no ip route 192.0.2.178/32 ${identity_iface} 5" \
          -c 'ip route 192.0.2.178/32 wg-pt-a1 5' \
          -c end
        return 0
      fi
      if [ "${NODE_NAME}" = restricted-node-296f36f2fb ] || [ "${NODE_NAME}" = restricted-node-6dc3f140f9 ]; then
        return 0
      fi
      [ -n "${identity_iface}" ] || return 0
      jq -c --arg own "${NODE_NAME}" '. as $root | ($root.nodes[] | select(.name == $own) | .publicMeshIdentityPeers // []) as $mesh | .controlPlaneNodes[] | select(. != $own) as $name | ($root.routeServers[], $root.nodes[]) | select(.name == $name) | {ip:.internalIp, publicMesh:($mesh | index($name) != null)}' /config/inventory.json | while read -r api_peer; do
        api_ip="$(printf '%s' "${api_peer}" | jq -r .ip)"
        host ip -o link show | awk -F': ' -v selected="${identity_iface}" '$2 != selected && ($2 ~ /^zt/ || $2 ~ /^re8chzt/) {print $2}' | while read -r stale_iface; do
          host vtysh -c 'configure terminal' -c "no ip route ${api_ip}/32 ${stale_iface} 5" -c end
        done
        if [ "$(printf '%s' "${api_peer}" | jq -r .publicMesh)" = true ]; then
          host vtysh -c 'configure terminal' -c "no ip route ${api_ip}/32 ${identity_iface} 5" -c end
        else
          host vtysh -c 'configure terminal' -c "ip route ${api_ip}/32 ${identity_iface} 5" -c end
        fi
      done
    }

    if [ -n "${route_server}" ]; then
      asn="$(printf '%s' "${route_server}" | jq -r .asn)"
      pod_cidr="$(printf '%s' "${route_server}" | jq -r .podCIDR)"
      accelerated_ip="$(printf '%s' "${route_server}" | jq -r .acceleratedIp)"
      internal_ip="$(printf '%s' "${route_server}" | jq -r .internalIp)"
      transport_ip="$(printf '%s' "${route_server}" | jq -r .transportIp)"
      rr_interconnect_ip="$(printf '%s' "${route_server}" | jq -r .rrInterconnectIp)"
      transport_octet="$(printf '%s' "${route_server}" | jq -r '.transportIp | split(".")[2]')"
      commands="$(mktemp)"
      {
        echo 'configure terminal'
        echo 'no ip prefix-list POD-FABRIC-OUT'
        jq -r '.routeServers[], .nodes[] | .podCIDR' /config/inventory.json | awk '{print "ip prefix-list POD-FABRIC-OUT seq " NR * 10 " permit " $0}'
        jq -r '.routeServers[], .nodes[] | .acceleratedIp + "/32"' /config/inventory.json | awk '{print "ip prefix-list POD-FABRIC-OUT seq " 300 + NR * 10 " permit " $0}'
        jq -r '.relayNodes[]? | (.acceleratedIp + "/32"), (.podCIDR // empty)' /config/inventory.json | awk '{print "ip prefix-list POD-FABRIC-OUT seq " 600 + NR * 10 " permit " $0}'
        echo 'ip prefix-list POD-FABRIC-OUT seq 900 permit 192.0.2.121/24 ge 32 le 32'
        echo 'ip prefix-list POD-FABRIC-OUT seq 1000 deny any'
        echo 'no ip prefix-list POD-FABRIC-RR-SELF'
        echo "ip prefix-list POD-FABRIC-RR-SELF seq 10 permit ${pod_cidr}"
        echo "ip prefix-list POD-FABRIC-RR-SELF seq 20 permit ${accelerated_ip}/32"
        echo 'ip prefix-list POD-FABRIC-RR-SELF seq 1000 deny any'
        # Route reflectors are control-plane only. Never attract reflected
        # traffic by rewriting its next hop to the RR identity/transit IP.
        # Do not delete route-maps while bgpd is using them. FRR 8.4 can drop
        # bgpd during that transaction; redefine the desired clauses in place.
        echo 'route-map POD-FABRIC-RR-IDENTITY-OUT permit 10'
        echo 'match ip address prefix-list POD-FABRIC-RR-SELF'
        echo "set ip next-hop ${internal_ip}"
        echo 'exit'
        echo 'route-map POD-FABRIC-RR-IDENTITY-OUT permit 20'
        echo 'match ip address prefix-list POD-FABRIC-OUT'
        echo 'exit'
        # Transport spokes peer over the point-to-point WireGuard subnet and
        # must receive a next hop in that same subnet. Advertising the
        # ZeroTier identity here creates an asymmetric forward/reverse path.
        echo 'route-map POD-FABRIC-RR-TRANSPORT-OUT permit 10'
        echo 'match ip address prefix-list POD-FABRIC-RR-SELF'
        echo "set ip next-hop ${transport_ip}"
        echo 'exit'
        echo 'route-map POD-FABRIC-RR-TRANSPORT-OUT permit 20'
        echo 'match ip address prefix-list POD-FABRIC-OUT'
        echo 'exit'
        echo 'no ip route 192.0.2.6/24 Null0 254'
        echo "ip route ${pod_cidr} Null0 254"
        echo "router bgp ${asn}"
        jq -c '.nodes[]' /config/inventory.json | while read -r spoke; do
          spoke_asn="$(printf '%s' "${spoke}" | jq -r .asn)"
          mode="$(printf '%s' "${spoke}" | jq -r .peerMode)"
          internal_peer="$(printf '%s' "${spoke}" | jq -r .internalIp)"
          last="$(printf '%s' "${spoke}" | jq -r '.internalIp | split(".")[3]')"
          transport_peer="172.31.${transport_octet}.${last}"
          if [ "${mode}" = identity ]; then
            peer="${internal_peer}"
            stale_peer="${transport_peer}"
            update_source="${internal_ip}"
          else
            peer="${transport_peer}"
            stale_peer="${internal_peer}"
            update_source="${transport_ip}"
          fi
          echo "no neighbor ${stale_peer}"
          echo "neighbor ${peer} remote-as ${spoke_asn}"
          echo "neighbor ${peer} update-source ${update_source}"
          echo "neighbor ${peer} disable-connected-check"
        done
        jq -c --arg own "${NODE_NAME}" '.routeServers[] | select(.name != $own)' /config/inventory.json | while read -r other_rr; do
          peer="$(printf '%s' "${other_rr}" | jq -r .rrInterconnectIp)"
          peer_asn="$(printf '%s' "${other_rr}" | jq -r .asn)"
          echo "neighbor ${peer} remote-as ${peer_asn}"
          echo "neighbor ${peer} update-source ${rr_interconnect_ip}"
          echo "neighbor ${peer} disable-connected-check"
        done
        echo 'address-family ipv4 unicast'
        echo 'no network 192.0.2.6/24'
        echo "network ${pod_cidr}"
        echo "network ${accelerated_ip}/32"
        jq -c '.nodes[]' /config/inventory.json | while read -r spoke; do
          mode="$(printf '%s' "${spoke}" | jq -r .peerMode)"
          if [ "${mode}" = identity ]; then
            peer="$(printf '%s' "${spoke}" | jq -r .internalIp)"
          else
            last="$(printf '%s' "${spoke}" | jq -r '.internalIp | split(".")[3]')"
            peer="172.31.${transport_octet}.${last}"
          fi
          echo "neighbor ${peer} activate"
          echo "neighbor ${peer} prefix-list POD-FABRIC-OUT in"
          echo "neighbor ${peer} prefix-list POD-FABRIC-OUT out"
          echo "neighbor ${peer} maximum-prefix 64 90 restart 5"
          echo "no neighbor ${peer} route-map POD-FABRIC-IDENTITY-OUT out"
          echo "no neighbor ${peer} route-map POD-FABRIC-TRANSPORT-OUT out"
          if [ "${mode}" = transport ]; then
            # A transport spoke cannot resolve a route-server interconnect
            # next hop learned from the other control-plane route server.
            # Re-anchor reflected routes on this directly attached WG peer.
            echo "no neighbor ${peer} attribute-unchanged next-hop"
            echo "neighbor ${peer} next-hop-self force"
          else
            echo "no neighbor ${peer} next-hop-self force"
            echo "neighbor ${peer} attribute-unchanged next-hop"
          fi
          if [ "${mode}" = transport ]; then
            echo "no neighbor ${peer} route-map POD-FABRIC-RR-OUT out"
            echo "no neighbor ${peer} route-map POD-FABRIC-RR-IDENTITY-OUT out"
            echo "neighbor ${peer} route-map POD-FABRIC-RR-TRANSPORT-OUT out"
            echo "no neighbor ${peer} route-map POD-NH-${last} in"
          else
            echo "no neighbor ${peer} route-map POD-FABRIC-RR-OUT out"
            echo "no neighbor ${peer} route-map POD-FABRIC-RR-TRANSPORT-OUT out"
            echo "neighbor ${peer} route-map POD-FABRIC-RR-IDENTITY-OUT out"
          fi
        done
        jq -c --arg own "${NODE_NAME}" '.routeServers[] | select(.name != $own)' /config/inventory.json | while read -r other_rr; do
          peer="$(printf '%s' "${other_rr}" | jq -r .rrInterconnectIp)"
          echo "neighbor ${peer} activate"
          echo "neighbor ${peer} prefix-list POD-FABRIC-OUT in"
          echo "neighbor ${peer} prefix-list POD-FABRIC-OUT out"
          echo "neighbor ${peer} maximum-prefix 64 90 restart 5"
          echo "neighbor ${peer} attribute-unchanged next-hop"
          echo "no neighbor ${peer} route-map POD-FABRIC-RR-OUT out"
          echo "no neighbor ${peer} route-map POD-FABRIC-RR-TRANSPORT-OUT out"
          echo "neighbor ${peer} route-map POD-FABRIC-RR-IDENTITY-OUT out"
        done
        echo 'exit-address-family'
        echo 'end'
        echo 'write memory'
        echo 'clear bgp * soft out'
      } >"${commands}"
      host vtysh <"${commands}"
      rm -f "${commands}"
      reconcile_wireguard_allowed_ips
      reconcile_control_api_spoke_symmetry
      reconcile_rr_interconnect_transit_sources
      reconcile_rr_interconnect_source_identity
      reconcile_public_mesh_allowed_ips
      reconcile_r640_identity_transit_nat
      reconcile_control_plane_identity_routes
      cleanup_cilium_direct_routes
      wait_for_bgp
      touch /run/podcidr-fabric-ready
      echo "${NODE_NAME}: declarative PodCIDR route-server policy reconciled"
      while sleep 60; do
      reload_if_changed
        reconcile_public_mesh_allowed_ips
        reconcile_wireguard_allowed_ips
        reconcile_control_api_spoke_symmetry
        reconcile_rr_interconnect_transit_sources || {
          rm -f /run/podcidr-fabric-ready
          exit 1
        }
        reconcile_rr_interconnect_source_identity || {
          rm -f /run/podcidr-fabric-ready
          exit 1
        }
        host vtysh -c 'show bgp ipv4 unicast summary' >/dev/null || {
          rm -f /run/podcidr-fabric-ready
          exit 1
        }
      done
      exit 0
    fi

    asn="$(printf '%s' "${node}" | jq -r .asn)"
    pod_cidr="$(printf '%s' "${node}" | jq -r .podCIDR)"
    accelerated_ip="$(printf '%s' "${node}" | jq -r .acceleratedIp)"
    internal_ip="$(printf '%s' "${node}" | jq -r .internalIp)"
    peer_mode="$(printf '%s' "${node}" | jq -r .peerMode)"
    if [ "${peer_mode}" = transport ]; then
      a1_peer=192.0.2.178
      b1_peer=192.0.2.101
      stale_a1_peer=192.0.2.176
      stale_b1_peer=192.0.2.4
      last="$(printf '%s' "${internal_ip}" | awk -F. '{print $4}')"
      a1_update_source="172.31.93.${last}"
      b1_update_source="172.31.94.${last}"
    else
      a1_peer=192.0.2.176
      b1_peer=192.0.2.4
      stale_a1_peer=192.0.2.178
      stale_b1_peer=192.0.2.101
      a1_update_source="${internal_ip}"
      b1_update_source="${internal_ip}"
    fi
    a1_asn="$(jq -r '.routeServers[] | select(.name == "restricted-node-1eb0570f74") | .asn' /config/inventory.json)"
    b1_asn="$(jq -r '.routeServers[] | select(.name == "restricted-node-296f36f2fb") | .asn' /config/inventory.json)"

    apply_fabric() {
      relay_prefix_lines="$(jq -r '.relayNodes[]? | (.acceleratedIp + "/32"), (.podCIDR // empty)' /config/inventory.json | awk '{print "ip prefix-list POD-FABRIC-SELF seq " 200 + NR * 10 " permit " $0}')"
      host vtysh <<EOF
    configure terminal
    no ip prefix-list POD-FABRIC-IN
    ip prefix-list POD-FABRIC-IN seq 10 permit 192.0.2.57/16 ge 24 le 24
    ip prefix-list POD-FABRIC-IN seq 20 permit 192.0.2.65/24 ge 32 le 32
    ip prefix-list POD-FABRIC-IN seq 30 permit 192.0.2.121/24 ge 32 le 32
    ip prefix-list POD-FABRIC-IN seq 1000 deny any
    no ip prefix-list POD-FABRIC-SELF
    ip prefix-list POD-FABRIC-SELF seq 10 permit ${pod_cidr}
    ip prefix-list POD-FABRIC-SELF seq 20 permit ${accelerated_ip}/32
    ${relay_prefix_lines}
    ip prefix-list POD-FABRIC-SELF seq 1000 deny any
    route-map POD-FABRIC-SELF-NH-A1 permit 10
    match ip address prefix-list POD-FABRIC-SELF
    set ip next-hop ${a1_update_source}
    exit
    route-map POD-FABRIC-SELF-NH-B1 permit 10
    match ip address prefix-list POD-FABRIC-SELF
    set ip next-hop ${b1_update_source}
    exit
    ip route ${pod_cidr} Null0 254
    router bgp ${asn}
    bgp ebgp-requires-policy
    bgp bestpath as-path multipath-relax
    no bgp default ipv4-unicast
    no neighbor ${stale_a1_peer}
    no neighbor ${stale_b1_peer}
    neighbor ${a1_peer} remote-as ${a1_asn}
    neighbor ${a1_peer} update-source ${a1_update_source}
    neighbor ${a1_peer} disable-connected-check
    neighbor ${b1_peer} remote-as ${b1_asn}
    neighbor ${b1_peer} update-source ${b1_update_source}
    neighbor ${b1_peer} disable-connected-check
    address-family ipv4 unicast
    network ${pod_cidr}
    network ${accelerated_ip}/32
    neighbor ${a1_peer} activate
    neighbor ${a1_peer} prefix-list POD-FABRIC-IN in
    neighbor ${a1_peer} prefix-list POD-FABRIC-SELF out
    neighbor ${a1_peer} route-map POD-FABRIC-SELF-NH-A1 out
    neighbor ${a1_peer} maximum-prefix 64 90 restart 5
    neighbor ${b1_peer} activate
    neighbor ${b1_peer} prefix-list POD-FABRIC-IN in
    neighbor ${b1_peer} prefix-list POD-FABRIC-SELF out
    neighbor ${b1_peer} route-map POD-FABRIC-SELF-NH-B1 out
    neighbor ${b1_peer} maximum-prefix 64 90 restart 5
    maximum-paths 2
    exit-address-family
    end
    write memory
    clear bgp ${a1_peer} soft
    clear bgp ${b1_peer} soft
    EOF
    }

    reconcile_relay_nodes() {
      [ "${NODE_NAME}" = restricted-node-6dc3f140f9 ] || return 0
      jq -c '.relayNodes[]?' /config/inventory.json | while read -r relay; do
        peer="$(printf '%s' "${relay}" | jq -r .transportIp)"
        relay_ip="$(printf '%s' "${relay}" | jq -r .relayIp)"
        relay_asn="$(printf '%s' "${relay}" | jq -r .asn)"
        identity="$(printf '%s' "${relay}" | jq -r .acceleratedIp)"
        pod_prefix="$(printf '%s' "${relay}" | jq -r .podCIDR)"
        [ "$(printf '%s' "${relay}" | jq -r .name)" = restricted-node-abb3f27a69 ] || { echo "unsupported relay node" >&2; return 1; }
        [ "${relay_ip}" = 192.0.2.198 ] || { echo "unsupported relay source: ${relay_ip}" >&2; return 1; }
        host vtysh <<EOF
    configure terminal
    ip prefix-list MUBAO-IN seq 10 permit ${identity}/32
    ip prefix-list MUBAO-IN seq 20 permit ${pod_prefix}
    ip prefix-list MUBAO-IN seq 1000 deny any
    ip prefix-list MUBAO-OUT seq 10 permit 192.0.2.179/32
    ip prefix-list MUBAO-OUT seq 15 permit 192.0.2.116/32
    ip prefix-list MUBAO-OUT seq 20 permit 192.0.2.242/32
    ip prefix-list MUBAO-OUT seq 30 permit 192.0.2.1/32
    ip prefix-list MUBAO-OUT seq 40 permit 192.0.2.57/16 ge 24 le 24
    ip prefix-list MUBAO-OUT seq 1000 deny any
    router bgp ${asn}
    neighbor ${peer} remote-as ${relay_asn}
    neighbor ${peer} update-source ${relay_ip}
    neighbor ${peer} disable-connected-check
    neighbor ${peer} timers 3 9
    address-family ipv4 unicast
    neighbor ${peer} activate
    neighbor ${peer} prefix-list MUBAO-IN in
    neighbor ${peer} prefix-list MUBAO-OUT out
    neighbor ${peer} maximum-prefix 2 90 restart 5
    exit-address-family
    end
    write memory
    clear bgp ${peer} soft
    EOF
        peer_key="$(host wg show wg-pt-mubao allowed-ips | awk -v transit="${peer}/32" '{ for (i=2; i<=NF; i++) if ($i == transit) { print $1; exit } }')"
        [ -n "${peer_key}" ] || { echo "missing MUBAO WireGuard peer" >&2; return 1; }
        allowed="$(host wg show wg-pt-mubao allowed-ips | awk -v key="${peer_key}" '$1 == key { for (i=2; i<=NF; i++) printf "%s%s", (i==2 ? "" : ","), $i; print ""; exit }')"
        case ",${allowed}," in *",${pod_prefix},"*) : ;; *) host wg set wg-pt-mubao peer "${peer_key}" allowed-ips "${allowed},${pod_prefix}" ;; esac
      done
    }

    reconcile_routeros_boundary() {
      routeros_peer="$(printf '%s' "${node}" | jq -r '.routerOsPeer // empty')"
      [ -n "${routeros_peer}" ] || return 0
      commands="$(mktemp)"
      {
        echo 'configure terminal'
        echo 'no ip prefix-list ROS-R640-SERVICE-OUT'
        echo "ip prefix-list ROS-R640-SERVICE-OUT seq 5 permit ${pod_cidr}"
        printf '%s\n' "${node}" | jq -r '.serviceVipExports[]?' | awk '{print "ip prefix-list ROS-R640-SERVICE-OUT seq " NR * 10 " permit " $0}'
        echo 'ip prefix-list ROS-R640-SERVICE-OUT seq 1000 deny any'
        printf '%s\n' "${node}" | jq -r '.serviceVipExports[]?' | while read -r vip; do
          echo "ip route ${vip} Null0 254"
        done
        echo "router bgp ${asn}"
        echo 'address-family ipv4 unicast'
        printf '%s\n' "${node}" | jq -r '.serviceVipExports[]?' | while read -r vip; do
          echo "network ${vip}"
        done
        echo "neighbor ${routeros_peer} prefix-list ROS-R640-SERVICE-OUT out"
        echo 'end'
        echo 'write memory'
        echo "clear bgp ${routeros_peer} soft out"
      } >"${commands}"
      host vtysh <"${commands}"
      rm -f "${commands}"
    }

    reconcile_r640_b1_podcidr_authority() {
      [ "${NODE_NAME}" = restricted-node-6dc3f140f9 ] || return 0
      prefix="$(jq -r '.routeServers[] | select(.name == "restricted-node-296f36f2fb") | .podCIDR' /config/inventory.json)"
      [ -n "${prefix}" ] || return 1
      # A historical low-metric route through RouterOS can override the valid
      # FRR path and blackhole B1 DNS while its Pod remains locally Ready.
      host vtysh -c "show bgp ipv4 unicast ${prefix} json" 2>/dev/null |
        jq -e '[.paths[]? | select(.valid == true)] | length > 0' >/dev/null || return 1
      while host ip -4 route show exact "${prefix}" | grep -Eq 'via 192\.168\.88\.1 dev eno2np1'; do
        host ip route del "${prefix}" via 192.0.2.240 dev eno2np1 || return 1
      done
      host ip -4 route show exact "${prefix}" | grep -Eq 'dev wg-pt-(a1|b1)' || return 1
    }

    apply_fabric
    reconcile_host_source_identity
    reconcile_transit_forwarding
    reconcile_relay_nodes
    reconcile_routeros_boundary
    reconcile_r640_b1_podcidr_authority
    reconcile_wireguard_allowed_ips
    reconcile_control_api_source_identity
    reconcile_public_mesh_allowed_ips
    cleanup_retired_panel_api_dnat
    reconcile_r640_identity_transit_nat
    reconcile_control_plane_identity_routes
    cleanup_cilium_direct_routes
    wait_for_bgp
    touch /run/podcidr-fabric-ready
    echo "${NODE_NAME}: declarative PodCIDR fabric reconciled"
    while sleep 60; do
      reload_if_changed
      reconcile_host_source_identity
      reconcile_transit_forwarding
      reconcile_public_mesh_allowed_ips
      reconcile_r640_b1_podcidr_authority || {
        rm -f /run/podcidr-fabric-ready
        exit 1
      }
      reconcile_wireguard_allowed_ips
      reconcile_control_api_source_identity
      host vtysh -c 'show bgp ipv4 unicast summary' >/dev/null || {
        rm -f /run/podcidr-fabric-ready
        exit 1
      }
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: podcidr-fabric-reconciler
  namespace: kube-system
  labels: {app.kubernetes.io/name: podcidr-fabric-reconciler}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: podcidr-fabric-reconciler}
  updateStrategy:
    type: RollingUpdate
    # Multiple remote edges may already be unavailable for unrelated underlay
    # faults. Keep one bounded rollout slot at the current 12-node scale so
    # that stale edge state cannot block policy delivery to A1/B1/restricted-node-6dc3f140f9.
    rollingUpdate: {maxUnavailable: 25%}
  template:
    metadata:
      labels: {app.kubernetes.io/name: podcidr-fabric-reconciler}
      annotations:
        # The script and inventory use stable ConfigMap names. Bump this value
        # whenever either contract changes so GitOps performs a controlled
        # DaemonSet rollout instead of leaving agents on stale mounted data.
        networking.re8ch.com/config-revision: content-reload-v1
    spec:
      hostPID: true
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: networking.re8ch.com/podcidr-fabric
                    operator: In
                    values: [enabled]
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # LA1 must reconcile both route-server AllowedIPs after a
                    # WireGuard restart so BGP ECMP cannot hash into a peer
                    # that rejects the selected PodCIDR.
                    values: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74, restricted-node-296f36f2fb, overseas-flk, overseas-la, overseas-la-2]
      containers:
        - name: reconciler
          image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/sh, /config/reconcile.sh]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext: {privileged: true}
          readinessProbe:
            exec: {command: [/usr/bin/test, -f, /run/podcidr-fabric-ready]}
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: host-root, mountPath: /host, readOnly: false}
      volumes:
        - name: config
          projected:
            sources:
              - configMap: {name: podcidr-fabric-reconciler, items: [{key: reconcile.sh, path: reconcile.sh}]}
              - configMap: {name: podcidr-fabric-inventory, items: [{key: inventory.json, path: inventory.json}]}
        - name: host-root
          hostPath: {path: /, type: Directory}
