apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [delivery.yaml]
configMapGenerator:
  - name: host-network-controller
    namespace: kube-system
    files:
      - agent.py
      - health.py
      - deliver.sh
      - package.json
      - adoption.json
      - re8ch-host-network.service
      - re8ch-host-network.timer
      - re8ch-host-network-watchdog.service
      - re8ch-host-network-watchdog.timer
      - re8ch-host-network-recover.service
