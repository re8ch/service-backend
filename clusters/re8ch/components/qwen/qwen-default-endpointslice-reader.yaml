apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen-default-endpointslice-reader
  namespace: qwen
  labels:
    re8ch.com/tenant: qwen
    re8ch.com/purpose: gateway-local-endpoint-discovery
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwen-default-endpointslice-reader
  namespace: qwen
  labels:
    re8ch.com/tenant: qwen
    re8ch.com/purpose: gateway-local-endpoint-discovery
subjects:
  - kind: ServiceAccount
    name: default
    namespace: qwen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen-default-endpointslice-reader
