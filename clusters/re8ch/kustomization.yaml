- flux-system/github-webhook-route.yaml
- secrets/stalwart-recovery-admin.sops.yaml
- secrets/among-clusters-hub-admin.sops.yaml
- secrets/hyperswitch-runtime-values.sops.yaml
- secrets/hyperswitch-bootstrap-admin.sops.yaml
- secrets/tenant-claim-internal-auth.sops.yaml
- secrets/tenant-registry-supply-chain.sops.yaml
- secrets/admin-vmcp-backend-auth-toolhive.sops.yaml
- secrets/admin-vmcp-backend-auth-tenant.sops.yaml
- secrets/cloudflare-advfab-dns-token.sops.yaml
- secrets/incidentrelay-config.sops.yaml
- secrets/incidentrelay-db-bootstrap.sops.yaml
- secrets/incidentrelay-bootstrap-admin.sops.yaml
- secrets/ontology-microscope-db.sops.yaml
- components/cilium/gateway-api-canary.yaml
- components/cilium/advfab-worker-node-ips.yaml
- components/cilium/native-routing-rollout.yaml
- components/farseer/public-web.yaml
- components/cilium/r640-policy-update-budget.yaml
- components/ai-operations/platform.yaml
- components/tenancy/re8ch-managed-business-namespaces.yaml
- components/auth/dex/dex-ha-deployment.yaml
- components/egress-fabric/identity-egress.yaml
- components/public-exposure/external-dns-cloudflare.yaml
- components/public-exposure/external-dns-advfab.yaml
- components/public-exposure/gateway-dns-authorities.yaml
- components/public-exposure/legacy-special-http-routes.yaml
