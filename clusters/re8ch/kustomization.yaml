patchesStrategicMerge:
- retire-legacy-mcp.patch.yaml
patches:
- target:
    version: v1
    kind: Namespace
    name: flux-system
  patch: |-
    - op: add
      path: /metadata/labels/scheduling.re8ch.com~1control-plane-allowed
      value: "true"
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: domain-platform-among-clusters
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/patches
      value:
      - target:
          kind: Namespace
          name: among-clusters
        patch: |-
          apiVersion: v1
          kind: Namespace
          metadata:
            name: among-clusters
            labels:
              scheduling.re8ch.com/control-plane-allowed: "true"
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: domain-platform-scheduling-fabric
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/patches
      value:
      - target:
          kind: Namespace
          name: (kyverno|kueue-system|scheduler-system|scheduling-system)
        patch: |-
          apiVersion: v1
          kind: Namespace
          metadata:
            name: not-used
            labels:
              scheduling.re8ch.com/control-plane-allowed: "true"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|kustomize-controller|notification-controller)
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [restricted-node-1eb0570f74, restricted-node-abb3f27a69]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {}
            matchLabelKeys: [app]
            topologyKey: kubernetes.io/hostname
    - op: replace
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirst
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
- target:
    group: apps
    version: v1
    kind: Deployment
    name: notification-controller
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution
      value:
      - weight: 100
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-abb3f27a69]}
      - weight: 80
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74]}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|kustomize-controller)
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution
      value:
      - weight: 100
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-abb3f27a69]}
      - weight: 80
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74]}
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=10
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|kustomize-controller|notification-controller)
    namespace: flux-system
  patch: |-
    # MUBAO's Pod Service path to 192.0.2.52 can time out. Both scheduled
    # control nodes expose the API on their node IP with the cluster CA.
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_HOST, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT, value: "6443"}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
- path: flux-system/source-controller-egress.patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: source-controller
    namespace: flux-system
