apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespaces.yaml
- flux-system/gotk-components.yaml
- flux-system/verification-keys.yaml
- flux-system/sops-canary.sops.yaml
- flux-system/service-backend-github-app-auth.sops.yaml
- flux-system/service-backend-github-ssh.sops.yaml
- flux-system/service-backend-github-reaction-auth.sops.yaml
- flux-system/service-backend-github-policy-reviewer-auth.sops.yaml
- flux-system/service-backend-github-webhook.sops.yaml
- flux-system/service-backend-github-proxy.sops.yaml
- flux-system/service-backend-github-socks.yaml
- flux-system/service-backend-control-plane-proxy.yaml
- flux-system/gotk-sync.yaml
- flux-system/github-control-plane.yaml
- flux-system/github-webhook-route.yaml
- flux-system/controller-ha.yaml
- flux-system/gitops-oci-reader.sops.yaml
- domain-sources
- ../../platform/observability-source
- flux-system/domain-reconcilers.yaml
- flux-system/retired-image-controllers.yaml
- flux-federation
- components/ops/github-actions-node-observer-rbac.yaml
- components/ops/github-actions-release-executor-rbac.yaml
- components/ops/github-actions-main-domain-executor-rbac.yaml
- components/ops/retire-unused-observable-ontology.yaml
- components/release-compat
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (source-controller|kustomize-controller|helm-controller|notification-controller)
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args/1
      value: --watch-all-namespaces=false
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: domain-.*
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/suspend
      value: true
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: observability-.*
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/suspend
      value: true
- target:
    version: v1
    kind: Namespace
    name: flux-system
  patch: |-
    - op: add
      path: /metadata/labels/scheduling.re8ch.com~1control-plane-allowed
      value: "true"
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: domain-platform-among-clusters
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/patches
      value:
      - target:
          kind: Namespace
          name: among-clusters
        patch: |-
          apiVersion: v1
          kind: Namespace
          metadata:
            name: among-clusters
            labels:
              scheduling.re8ch.com/control-plane-allowed: "true"
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: domain-platform-scheduling-fabric
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/patches
      value:
      - target:
          kind: Namespace
          name: (kyverno|kueue-system|scheduler-system|scheduling-system)
        patch: |-
          apiVersion: v1
          kind: Namespace
          metadata:
            name: not-used
            labels:
              scheduling.re8ch.com/control-plane-allowed: "true"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|notification-controller)
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [restricted-node-1eb0570f74, restricted-node-6dc3f140f9]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {}
            matchLabelKeys: [app]
            topologyKey: kubernetes.io/hostname
    - op: replace
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirst
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
- target:
    group: apps
    version: v1
    kind: Deployment
    name: notification-controller
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution
      value:
      - weight: 100
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-abb3f27a69]}
      - weight: 80
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74]}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: helm-controller
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution
      value:
      - weight: 100
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-abb3f27a69]}
      - weight: 80
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74]}
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=1
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|notification-controller)
    namespace: flux-system
  patch: |-
    # Run two replicas with Flux's default leader election. Keep one replica on
    # the preferred overseas delivery node and one on the restricted-node-6dc3f140f9 recovery anchor.
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
    - op: replace
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [overseas-kl, restricted-node-6dc3f140f9]
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [overseas-kl]}
          - weight: 50
            preference:
              matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {}
            matchLabelKeys: [app]
            topologyKey: kubernetes.io/hostname
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
      - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.116"}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT, value: "6443"}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: kustomize-controller
    namespace: flux-system
  patch: |-
    # Keep manifest rendering on B1, which has verified connectivity to the
    # direct control-plane endpoint and does not need a standby replica.
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/strategy
      value:
        type: Recreate
    - op: replace
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [restricted-node-296f36f2fb]
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - {key: storage.re8ch.com/coordinator, operator: Equal, value: "true", effect: NoSchedule}
      - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
    - op: add
      path: /spec/template/spec/containers/0/args/-
      # Bound cross-region Kubernetes API pressure so reconciliation does not
      # amplify an etcd/control-plane recovery event.
      value: --concurrent=4
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.242"}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT, value: "6443"}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
- path: flux-system/source-controller-egress.patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: source-controller
    namespace: flux-system
- target:
    group: apps
    version: v1
    kind: Deployment
    name: source-controller
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=4
