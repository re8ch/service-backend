patchesStrategicMerge:
- retire-legacy-mcp.patch.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|kustomize-controller|notification-controller)
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate: {maxSurge: 1, maxUnavailable: 1}
    - op: add
      path: /spec/template/spec/affinity
      value:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {}
            matchLabelKeys: [app]
            topologyKey: kubernetes.io/hostname
    - op: replace
      path: /spec/template/spec/dnsPolicy
      value: ClusterFirst
    - op: add
      path: /spec/template/spec/tolerations
      value:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
- target:
    group: apps
    version: v1
    kind: Deployment
    name: notification-controller
    namespace: flux-system
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: add
      path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution
      value:
      - weight: 100
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
      - weight: 80
        preference:
          matchExpressions:
          - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-296f36f2fb]}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: (helm-controller|kustomize-controller)
    namespace: flux-system
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --concurrent=10
- path: flux-system/source-controller-egress.patch.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: source-controller
    namespace: flux-system
configMapGenerator:
