apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantPortfolio
metadata:
  name: re8ch
spec:
  tenantRef: re8ch
  displayName: RE8CH
  identityRef: oidc-group:re8ch
  visibility: Private
  hostingMode: platform-managed
  byocAllowed: false
  namespacePolicy:
    defaultNamespace: re8ch-default
    allowedPrefixes: [re8ch-]
  legacyNamespaceMigration:
    ledger: re8ch-ledger
    neo4j: re8ch-neo4j
    anysite: re8ch-anysite
    dataspace: re8ch-dataspace
  excludedClasses:
    - internal-control-plane
    - shared-infrastructure-product
    - ai-platform
  assignmentRule: Business-specific workloads owned by RE8CH are attributed to this tenant; cluster infrastructure and shared AI supply remain platform-owned.
