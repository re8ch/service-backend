schemaVersion: re8ch.com/v1alpha1
clusters:
  - id: re8ch-k3s
    distribution: k3s
    datastore: embedded-etcd
    transportNetwork: zerotier
    controlPlaneNodes: [a1-wsl-zt]
    warmStandbyNodes: [b1-wsl-zt]
    backupPolicy: hourly-etcd-snapshot-encrypted-r640-copy
    publicRoutingAuthority: external-dns
    networkGateway:
      asset: mikrotik-rb4011
      managedThrough: r640
      directAiLogin: false
