schemaVersion: re8ch.com/v1alpha1
defaults:
  businessWorkloads: deny
  platformWorkloads: confirmation-required
  genericShell: deny
nodeOperations:
  worker:
    approvals: 1
    preflight: [node-ready, pdb-safe, drain-safe, replacement-capacity]
  controlPlaneEtcd:
    approvals: 2
    distinctApprovers: true
    approvalWindowMinutes: 15
    preflight: [all-etcd-members-healthy, quorum-safe, recent-etcd-snapshot, peer-control-plane-ready]
    denyOnUnknownNode: true
allowedHostActions: [status, allowed-service-status, allowed-service-restart, cordon-drain-reboot-wait-uncordon]
