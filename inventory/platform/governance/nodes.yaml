schemaVersion: re8ch.com/v1alpha1
defaults:
  operatingSystem: linux
  sshUser: re8ch-ai
  authentication: cloud-platform-permanent-jump-key
nodes:
  - {id: r640, roles: [worker, pg-re8ch, api-relay], sshTarget: r640, operationPolicy: control-plane-two-person, firewall: cn, egressPolicy: auto, mihomoNode: enabled, cephStorage: true, cephClient: true}
  - {id: mubao-wsl, roles: [], sshTarget: null, operationPolicy: control-plane-two-person, managementState: fenced-retired-offline, firewall: none, egressPolicy: disabled, mihomoNode: disabled}
  - id: a1-wsl-zt
    roles: [control-plane, etcd]
    sshTarget: null
    operationPolicy: control-plane-two-person
    managementState: unverified
    firewall: cn
    egressPolicy: auto
    cephStorage: false
    cephClient: true
    localStorageClass: local-a1
    host:
      platform: Windows Server 2022 / WSL2 NAT
      cloudPlatformNode: a1-windows
      sshTarget: Administrator@192.168.254.69
      windowsLanIp: 192.168.254.69
      wslNatCidr: 172.28.32.0/20
      peerHost: b1-wsl-zt
      peerWindowsLanIp: 192.168.254.86
    fabric:
      nodeIdentity: 10.181.22.147
      podCIDR: 10.42.10.0/24
      windowsWireGuard: {interface: re8ch-wsl-lan, address: 172.31.250.1/30, peerPort: 51820}
      hnscForward: {protocol: udp, hostPort: 51821, guestPort: 51821}
      wslWireGuard: {interface: wg-wsl-lan, address: 172.31.251.1/30, peer: b1-wsl-zt, apiVipPaths: [local-owner, advfab-relay]}
      r640Transit: {interface: wg-pt-a1, port: 51889, hubPublicIp: 223.159.210.222, hubBackend: 192.168.88.251}
    watchdog: {role: active-server, serviceName: k3s.service}
  - id: b1-wsl-zt
    roles: [worker, manual-dr-standby]
    sshTarget: b1-wsl-zt
    operationPolicy: control-plane-two-person
    managementState: cloud-platform-managed
    firewall: cn
    egressPolicy: auto
    cephStorage: false
    cephClient: true
    localStorageClass: local-b1
    host:
      platform: Windows Server 2022 / WSL2 NAT
      cloudPlatformNode: b1-windows
      sshTarget: Administrator@192.168.254.86
      windowsLanIp: 192.168.254.86
      wslNatCidr: 172.18.144.0/20
      peerHost: a1-wsl-zt
      peerWindowsLanIp: 192.168.254.69
    fabric:
      nodeIdentity: 10.181.22.125
      podCIDR: 10.42.13.0/24
      windowsWireGuard: {interface: re8ch-wsl-lan, address: 172.31.250.2/30, peerPort: 51820}
      hnscForward: {protocol: udp, hostPort: 51821, guestPort: 51821}
      wslWireGuard: {interface: wg-wsl-lan, address: 172.31.251.2/30, peer: a1-wsl-zt, apiVipPaths: [hnsc-host-lan-direct, advfab-relay]}
      r640Transit: {interface: wg-pt-b1, port: 51890, hubPublicIp: 223.159.210.222, hubBackend: 192.168.88.251}
    watchdog: {role: worker-standby, serviceName: k3s-agent.service}
  - {id: amdwsl-zt, roles: [gpu], sshTarget: amdwsl-zt, operationPolicy: worker-one-person, managementState: unverified, firewall: cn, egressPolicy: auto, mihomoNode: enabled}
  - {id: artchais-nuclio-1, roles: [nuclio], sshTarget: artchais, operationPolicy: worker-one-person}
  - {id: harbor-registry, roles: [platform], sshTarget: harbor, operationPolicy: worker-one-person}
  - {id: overseas-edge-50, roles: [edge], sshTarget: null, operationPolicy: worker-one-person, managementState: unverified, firewall: none, egressPolicy: direct}
  - {id: qianwen-nuclio-79, roles: [nuclio], sshTarget: ali, operationPolicy: worker-one-person, managementState: unverified}
  - {id: qianwen-prod-nuclio-3, roles: [database], sshTarget: null, operationPolicy: worker-one-person, managementState: unverified}
  - {id: qianwen-test-nuclio-2, roles: [worker], sshTarget: null, operationPolicy: worker-one-person, managementState: unverified}
  - {id: rancher-panel, roles: [panel], sshTarget: rancher, operationPolicy: worker-one-person}
  - {id: vm-20-12-ubuntu, roles: [worker], sshTarget: ICP, operationPolicy: worker-one-person}
