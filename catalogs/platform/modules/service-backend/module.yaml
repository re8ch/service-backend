apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: service-backend, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/re8ch/service-backend.git', defaultBranch: main, owner: re8ch}
  projectType: gitops-control-plane
  writePolicy: github-pr
  knowledge: [README.md, runbooks/, clusters/, operations/]
  tools: [gh, flux, re8ch-workspace, kubectl, helm]
  deployments: [github.com/re8ch/service-backend, k3s/re8ch]
  source:
    kind: root
    path: .
    metadataPolicy: in-repository
  identity:
    maintainerAddress: service-backend-maintain@phonaid.com
    accountClass: platform-root
  clusterIndex:
    path: .re8ch/cluster-resources.yaml
