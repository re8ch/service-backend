apiVersion: workspace.re8ch.com/v1alpha1
kind: WorkspaceModule
metadata: {name: mihomos-cluster, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: https://github.com/re8ch/mihomos-cluster.git, defaultBranch: main, owner: re8ch}
  workspace: {macPath: platform/mihomos-cluster, r640Path: platform/mihomos-cluster}
  projectType: kubernetes-network-controller
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [mihomos, kubectl]
  deployments: [mihomos]
