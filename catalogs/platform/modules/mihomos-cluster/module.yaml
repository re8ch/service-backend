apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: mihomos-cluster, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/public-edge/mihomos-cluster.git', defaultBranch: main, owner: re8ch}
  projectType: kubernetes-network-controller
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [mihomos, kubectl]
  deployments: [mihomos]
  source:
    kind: submodule
    path: source
    metadataPolicy: in-repository
  identity:
    maintainerAddress: mihomos-cluster-maintain@phonaid.com
    accountClass: project-maintainer
  clusterIndex:
    path: .re8ch/cluster-resources.yaml
