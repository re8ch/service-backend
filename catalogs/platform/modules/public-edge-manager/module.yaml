apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: public-edge-manager, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/public-edge/public-edge-manager.git', defaultBranch: main, owner: public-edge}
  projectType: network-controller
  writePolicy: github-pr
  knowledge: [README.md, CONTRIBUTING.md, SECURITY.md]
  tools: [public-edge, helm, kubectl]
  deployments: [public-edge-manager]
  source: {kind: submodule, path: source, metadataPolicy: in-repository}
  identity: {maintainerAddress: public-edge-manager-maintain@phonaid.com, accountClass: project-maintainer}
  clusterIndex: {path: .re8ch/cluster-resources.yaml}
