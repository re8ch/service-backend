apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: cluster-website, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/re8ch/cluster-website.git', defaultBranch: main, owner: re8ch}
  projectType: web
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [npm]
  deployments: [cluster-website]
  source:
    kind: submodule
    path: source
    metadataPolicy: in-repository
  identity:
    maintainerAddress: cluster-website-maintain@phonaid.com
    accountClass: project-maintainer
  clusterIndex:
    path: .re8ch/cluster-resources.yaml
