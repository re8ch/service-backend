apiVersion: workspace.re8ch.com/v1alpha1
kind: WorkspaceModule
metadata: {name: codex-admin-plugins, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: https://github.com/re8ch/codex-admin-plugins.git, defaultBranch: main, owner: re8ch}
  workspace: {macPath: platform/codex-admin-plugins, r640Path: platform/codex-admin-plugins}
  projectType: codex-plugin-bundle
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [plugin-creator, toolhive]
  deployments: [codex-plugin-marketplace]
