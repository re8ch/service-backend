apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: codex-admin-plugins, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/re8ch-ai/codex-admin-plugins.git', defaultBranch: main, owner: re8ch-ai}
  projectType: codex-plugin-bundle
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [plugin-creator, toolhive]
  deployments: [codex-plugin-marketplace]
  source:
    kind: submodule
    path: source
    metadataPolicy: in-repository
  identity:
    maintainerAddress: codex-admin-plugins-maintain@phonaid.com
    accountClass: project-maintainer
  clusterIndex:
    path: .re8ch/cluster-resources.yaml
