apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspaceModule
metadata: {name: headlamp-mihomos-cluster, catalog: platform}
spec:
  ownership: owned
  lifecycle: active
  repository: {provider: github, url: 'https://github.com/public-edge/headlamp-mihomos-cluster.git', defaultBranch: main, owner: public-edge}
  projectType: headlamp-plugin
  writePolicy: github-pr
  knowledge: [README.md]
  tools: [npm, kubectl]
  dependencies: [mihomos-cluster]
  source: {kind: submodule, path: source, metadataPolicy: in-repository}
  identity: {maintainerAddress: headlamp-mihomos-cluster-maintain@phonaid.com, accountClass: project-maintainer}
  clusterIndex: {path: .re8ch/cluster-resources.yaml}
