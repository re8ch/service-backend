apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: artchais-web
spec:
  parent:
    catalog: artchais
    repository: git@gitlab.com:reachievellc/service-backend.git
    catalogPath: catalogs/artchais/modules/artchais-web
    submodulePath: catalogs/artchais/modules/artchais-web/source
  identity:
    maintainerAddress: artchais-web-collab@phonaid.com
    accountClass: collaboration
    googleWorkspacePolicy: external
  workspace:
    name: artchais-web-collab
    oneActivePerAccount: true
    branchPrefix: workspace/artchais-web-collab/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
