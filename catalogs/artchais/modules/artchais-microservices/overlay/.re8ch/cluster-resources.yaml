apiVersion: governance.re8ch.com/v1alpha1
kind: ClusterResourceIndex
metadata:
  name: artchais-microservices
spec:
  controlPlane:
    repository: https://github.com/re8ch/service-backend.git
    revision: main
    indexPath: indexes/deployments.json
  lookup:
    module: artchais-microservices
    catalog: artchais
    declaredDeployments: []
  evidence:
    authority: kubernetes
    requiredPlanes:
    - monitoring
    - deploying
    - planning
