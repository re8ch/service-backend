apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: qianwen-brand
spec:
  parent:
    catalog: qianwen
    repository: git@gitlab.com:reachievellc/service-backend.git
    catalogPath: catalogs/qianwen/modules/qianwen-brand
    submodulePath: catalogs/qianwen/modules/qianwen-brand/source
  identity:
    maintainerAddress: qianwen-brand-collab@phonaid.com
    accountClass: collaboration
    googleWorkspacePolicy: external
  workspace:
    name: qianwen-brand-collab
    oneActivePerAccount: true
    branchPrefix: workspace/qianwen-brand-collab/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
