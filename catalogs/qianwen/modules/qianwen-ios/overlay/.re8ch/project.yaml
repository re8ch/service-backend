apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: qianwen-ios
spec:
  parent:
    catalog: qianwen
    repository: https://github.com/re8ch/service-backend.git
    catalogPath: catalogs/qianwen/modules/qianwen-ios
    submodulePath: catalogs/qianwen/modules/qianwen-ios/source
  identity:
    maintainerAddress: qianwen-ios-collab@phonaid.com
    accountClass: collaboration
    googleWorkspacePolicy: external
  workspace:
    name: qianwen-ios-collab
    oneActivePerAccount: true
    branchPrefix: workspace/qianwen-ios-collab/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
