apiVersion: governance.re8ch.com/v1alpha1
kind: ProjectBinding
metadata:
  name: qianwen-capture-helper
spec:
  parent:
    catalog: qianwen
    repository: https://github.com/re8ch/service-backend.git
    catalogPath: catalogs/qianwen/modules/qianwen-capture-helper
    submodulePath: catalogs/qianwen/modules/qianwen-capture-helper/source
  identity:
    maintainerAddress: qianwen-capture-helper-collab@phonaid.com
    accountClass: collaboration
    googleWorkspacePolicy: external
  workspace:
    name: qianwen-capture-helper-collab
    oneActivePerAccount: true
    branchPrefix: workspace/qianwen-capture-helper-collab/
  contract:
    transport: branch-pull-request
    completion: pull-request-closed
    evidenceAuthority: kubernetes
