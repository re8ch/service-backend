apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: tenant-observability}
spec:
  source: {type: remoteMcp, url: https://tools.re8ch.com/tenant/observability/mcp}
  identityRef: tenant-observability-self
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [tenant-self]
    allowedOperations: [service-catalog-list, service-instance-plan, service-instance-create, service-instance-get, service-instance-list, service-instance-update, service-instance-suspend, service-instance-resume, service-instance-delete, service-binding-create, service-binding-list, service-binding-revoke, usage-summary-get, operation-get, grafana-datasource-list, grafana-datasource-get, grafana-query, grafana-analyze, grafana-indicators, grafana-correlate, grafana-render, grafana-exploration-save, grafana-exploration-delete]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: tenant_observability}
