apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: admin}
spec:
  source: {type: remoteMcp, url: "https://admin.re8ch.com:8443/mcp"}
  identityRef: platform-admin
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [admin]
    allowedOperations: [tenant-create, tenant-list, tenant-grant-create, tenant-visibility-update, tenant-delete, byoc-registration-list, byoc-connection-approve, byoc-connection-revoke]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: admin}
