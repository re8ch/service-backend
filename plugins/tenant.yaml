apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: tenant}
spec:
  source: {type: remoteMcp, url: "https://tools.re8ch.com/tenant/mcp"}
  identityRef: tenant-self
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [tenant-self]
    allowedOperations: [service-catalog-list, service-instance-plan, service-instance-create, service-instance-get, service-instance-list, service-instance-update, service-instance-suspend, service-instance-resume, service-instance-delete, service-binding-create, service-binding-list, service-binding-revoke, harbor-project-get, harbor-repository-list, harbor-artifact-list, harbor-artifact-get, harbor-artifact-scan-start, harbor-vulnerability-report-get, harbor-sbom-get, harbor-accessory-list, harbor-tag-create, harbor-tag-delete, harbor-audit-log-list, harbor-build-start, harbor-build-get, harbor-build-list, harbor-build-cancel, grafana-capabilities, grafana-datasource-list, grafana-query, grafana-render, grafana-exploration-save, grafana-exploration-delete, byoc-cluster-register, byoc-registration-list, byoc-connection-list, byoc-connection-revoke, tenant-capabilities-list, tenant-claim-plan, tenant-claim-create, tenant-claim-get, tenant-claim-list, tenant-claim-update, tenant-claim-renew, tenant-claim-cancel, tenant-usage-summary-get, operation-get]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, serviceAccount, hostPath, hostNetwork, privileged, nodePort, rawManifest, gpu, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: tenant}
