apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinitionList
items:
  - metadata: {name: advanced-fabrics}
    spec: {source: {type: kubernetes, apiGroups: [networking.re8ch.com]}, identityRef: advanced-fabrics-operator, healthCheck: {type: kubernetes}, policy: {resourceScopes: [advanced-fabric, kube-system], allowedOperations: [get, list, watch, status, node-network-status, kernel-ecmp-routes, bgp-candidate-paths, path-decisions, network-quality-status, dns-quality-status, network-intelligence-status, route-diff, rate-limit-dry-run], deniedFields: [secret, data, stringData]}, publication: {enabled: true, toolPrefix: advanced_fabrics}}
  - metadata: {name: public-edge}
    spec: {source: {type: kubernetes, apiGroups: [edge.re8ch.com]}, identityRef: public-edge-operator, healthCheck: {type: kubernetes}, policy: {resourceScopes: [public-edge], allowedOperations: [get, list, watch, candidate-status, service-binding, publish-status], deniedFields: [candidateSelection, secret]}, publication: {enabled: true, toolPrefix: public_edge}}
  - metadata: {name: mihomos-cluster}
    spec: {source: {type: openapi, url: http://mihomos-cluster.mihomos.svc/openapi.json}, identityRef: mihomos-operator, healthCheck: {type: http, path: /healthz}, policy: {resourceScopes: [mihomos], allowedOperations: [nodes, providers, rules, proxy-groups, health, config-diff, config-publish], deniedFields: [secret]}, publication: {enabled: true, toolPrefix: mihomos}}
  - metadata: {name: dex-oidc}
    spec: {source: {type: kubernetes, apiGroups: [dex.coreos.com]}, identityRef: dex-diagnostics, healthCheck: {type: http, path: /healthz}, policy: {resourceScopes: [dex], allowedOperations: [client-list, connector-list, claims-diagnose, redirect-uri-check, session-status], deniedFields: [clientSecret, secret, refreshToken]}, publication: {enabled: true, toolPrefix: dex}}
