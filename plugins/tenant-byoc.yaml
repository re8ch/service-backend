apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: tenant-byoc}
spec:
  source: {type: remoteMcp, url: https://tools.re8ch.com/tenant/byoc/mcp}
  identityRef: tenant-byoc-self
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [tenant-self]
    allowedOperations: [byoc-cluster-register, byoc-registration-list, byoc-connection-list, byoc-connection-revoke]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: tenant_byoc}
