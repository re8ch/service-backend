apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: tenant-registry}
spec:
  source: {type: remoteMcp, url: https://tools.re8ch.com/tenant/registry/mcp}
  identityRef: tenant-registry-self
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [tenant-self]
    allowedOperations: [service-catalog-list, service-instance-plan, service-instance-create, service-instance-get, service-instance-list, service-instance-update, service-instance-suspend, service-instance-resume, service-instance-delete, service-binding-create, service-binding-list, service-binding-revoke, usage-summary-get, operation-get, harbor-project-get, harbor-repository-list, harbor-artifact-list, harbor-artifact-get, harbor-artifact-scan-start, harbor-vulnerability-report-get, harbor-sbom-get, harbor-accessory-list, harbor-tag-create, harbor-tag-delete, harbor-audit-log-list, harbor-build-start, harbor-build-get, harbor-build-list, harbor-build-cancel]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: tenant_registry}
