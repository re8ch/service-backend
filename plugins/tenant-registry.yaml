apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: tenant-registry}
spec:
  source: {type: remoteMcp, url: https://tools.re8ch.com/tenant/registry/mcp}
  identityRef: tenant-registry-self
  healthCheck: {type: http, path: /healthz}
  policy:
    resourceScopes: [tenant-self]
    allowedOperations: [service-catalog-list, service-instance-plan, service-instance-create, service-instance-get, service-instance-list, service-instance-update, service-instance-suspend, service-instance-resume, service-instance-delete, service-binding-create, service-binding-list, service-binding-revoke, usage-summary-get, operation-get]
    deniedFields: [password, token, secret, kubeconfig, privateKey, credentialMaterial, candidateRef, rawInfrastructureMutation, price, tax, journalEntry]
  publication: {enabled: false, toolPrefix: tenant_registry}
