apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: pigsty}
spec:
  source: {type: cli, image: registry.re8ch.com/tools/pig@sha256:REPLACE_WITH_VERIFIED_DIGEST, entrypoint: [pig], structuredOutput: json}
  identityRef: pigsty-operator
  healthCheck: {type: cli, argv: [pig, status, --format, json]}
  policy: {resourceScopes: [pg-re8ch], allowedOperations: [status, instance, service, config-diff, backup-list], deniedFields: [password, secret, dsn]}
  publication: {enabled: true, toolPrefix: pigsty}
