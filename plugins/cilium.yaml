apiVersion: plugins.re8ch.com/v1alpha1
kind: PluginDefinition
metadata: {name: cilium}
spec:
  source: {type: kubernetes, apiGroups: [cilium.io], cliImage: registry.re8ch.com/tools/cilium-cli@sha256:REPLACE_WITH_VERIFIED_DIGEST}
  identityRef: cilium-operator
  healthCheck: {type: kubernetes, resource: daemonset/cilium, namespace: kube-system}
  policy: {resourceScopes: [kube-system], allowedOperations: [get, list, watch, status, connectivity-test], deniedFields: [data, stringData]}
  publication: {enabled: true, toolPrefix: cilium}
