---
qwen_realtime:
  hosts:
    pg-meta-1:
      ansible_host: 192.0.2.172
    pg-meta-2:
      ansible_host: 192.0.2.141
    pg-meta-3:
      ansible_host: 192.0.2.33
  vars:
    qwen_realtime_db_name: qianwen_prod
    qwen_realtime_tenant_id: api
    qwen_realtime_publication: qwen_task_events_pub
    qwen_realtime_slot_name: qwen_task_events_slot
    qwen_realtime_patroni_config_path: /etc/patroni/patroni.yml
    qwen_realtime_manage_patroni_callbacks: true
    qwen_realtime_timer_interval: 60s

    # Supply these from Ansible Vault or an external secret loader.
    # qwen_realtime_db_password: ""
    # qwen_realtime_api_jwt_secret: ""
    # qwen_realtime_db_enc_key: ""
    # qwen_realtime_secret_key_base: ""
