apiVersion: v1
kind: Pod
metadata: {name: re8ch-kpr-panel-host-route-audit, namespace: kube-system}
spec:
  nodeName: vm-20-12-ubuntu
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: audit
      image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
      imagePullPolicy: Never
      command: [sh, -ec]
      args:
        - >-
          nsenter -t 1 -m -n -- sh -c '
          ip route get 192.0.2.183;
          ip route get 192.0.2.18;
          ip route get 192.0.2.208;
          systemctl is-active wg-quick@wg-r640 || true;
          wg show wg-r640 || true;
          vtysh -c "show ip route 192.0.2.183/32" || true
          ' > /dev/termination-log 2>&1
      securityContext: {privileged: true}
---
apiVersion: v1
kind: Pod
metadata: {name: re8ch-kpr-panel-r640-lan-canary, namespace: kube-system}
spec:
  nodeName: vm-20-12-ubuntu
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: canary
      image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
      imagePullPolicy: Never
      command: [sh, -ec]
      args:
        - >-
          nsenter -t 1 -m -n -- sh -ec '
          peer=$(wg show wg-r640 peers);
          wg set wg-r640 peer "$peer" allowed-ips 192.0.2.109/32,192.0.2.183/32,192.0.2.97/32;
          ip route replace 192.0.2.97/32 dev wg-r640 metric 20;
          ip route get 192.0.2.97;
          timeout 8 bash -c "exec 3<>/dev/tcp/192.0.2.97/6443";
          echo R640_LAN_API_TCP_OK
          ' > /dev/termination-log 2>&1
      securityContext: {privileged: true}
---
