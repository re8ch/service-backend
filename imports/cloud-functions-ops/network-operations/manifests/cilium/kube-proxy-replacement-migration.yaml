apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: kube-proxy-replacement
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      io.cilium.migration/kube-proxy-replacement: "true"
  defaults:
    kube-proxy-replacement: "true"
    kube-proxy-replacement-healthz-bind-address: "'0.0.0.0:10256'"
---
apiVersion: v1
kind: Pod
metadata: {name: re8ch-kpr-probe-panel, namespace: kube-system}
spec:
  nodeName: vm-20-12-ubuntu
  hostNetwork: true
  hostPID: true
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
      imagePullPolicy: Never
      command: [sh, -ec]
      args: ["bpftool feature probe kernel >/dev/null || exit 11; test -d /host/run/cilium/cgroupv2 || exit 12; test -d /host/sys/fs/bpf || exit 13"]
      securityContext: {privileged: true}
      volumeMounts: [{name: host-root, mountPath: /host, readOnly: true}]
  volumes: [{name: host-root, hostPath: {path: /, type: Directory}}]
---
