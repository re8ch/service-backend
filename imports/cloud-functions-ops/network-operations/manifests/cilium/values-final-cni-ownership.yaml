# Layer this after values-migration.yaml only after the public mesh has passed
# its 24-hour stability gate and all rollback drills.
cni:
  install: true
  customConf: false
  exclusive: true
  uninstall: false

routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8473

kubeProxyReplacement: "true"

bgpControlPlane:
  # Enables the control-plane machinery only. Peer, advertisement, and LB IPAM
  # resources remain separately managed and must never reuse the DN42 VRF.
  enabled: true

# EDT-based pacing for pod and Gateway traffic. BBR remains disabled because
# it is not exposed by every control-plane kernel.
bandwidthManager:
  enabled: true
  bbr: false

# Reduce global CT/NAT map lock contention under concurrent Harbor traffic.
bpf:
  distributedLRU:
    enabled: true

# Enables the policy API without changing traffic until an explicit LRP exists.
localRedirectPolicy: true

gatewayAPI:
  enabled: false

operator:
  replicas: 2
