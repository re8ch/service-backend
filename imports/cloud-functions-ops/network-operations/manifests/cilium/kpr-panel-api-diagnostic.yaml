apiVersion: v1
kind: Pod
metadata:
  name: re8ch-kpr-apiserver-a1-v6
  namespace: kube-system
spec:
  nodeName: vm-20-12-ubuntu
  hostNetwork: true
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: probe
      image: quay.io/cilium/cilium-ci:latest@sha256:19ff540fa2927047d4935d5c1b173818225cc288c20a55d0bdb8748ea8adbb26
      imagePullPolicy: Never
      terminationMessagePolicy: FallbackToLogsOnError
      command: [cilium-dbg, build-config]
      env:
        - {name: K8S_NODE_NAME, value: vm-20-12-ubuntu}
        - {name: CILIUM_K8S_NAMESPACE, value: kube-system}
        - {name: KUBERNETES_SERVICE_HOST, value: 192.0.2.18}
        - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
