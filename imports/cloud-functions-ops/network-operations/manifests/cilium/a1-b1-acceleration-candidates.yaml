# Dormant until the WSL kernel/Hyper-V NIC prerequisites in the runbook pass.
apiVersion: cilium.io/v2
kind: CiliumNodeConfig
metadata:
  name: a1-b1-xdp-best-effort
  namespace: kube-system
spec:
  nodeSelector:
    matchLabels:
      cilium.re8ch.com/xdp-best-effort: "true"
  defaults:
    # Use best-effort for heterogeneous Hyper-V/netvsc, WireGuard and ZeroTier
    # devices. Promote to native only after cilium-dbg reports Native on eth0.
    bpf-lb-acceleration: best-effort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: a1-b1-acceleration-prerequisites
  namespace: kube-system
data:
  bbr: tcp_bbr must appear in tcp_available_congestion_control on both WSL kernels
  xdp: validate native XDP attach on Hyper-V netvsc eth0 before adding the selector label
  lrp: create only for a named ClusterIP Service with a node-local backend
  current-kernel: 192.0.2.141-microsoft-standard-WSL2
  current-congestion-control: cubic
  current-qdisc: fq
