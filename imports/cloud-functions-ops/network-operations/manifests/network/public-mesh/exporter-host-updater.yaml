apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: re8ch-network-exporter-host-updater
  namespace: kube-system
  labels: {app.kubernetes.io/name: re8ch-network-exporter-host-updater}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: re8ch-network-exporter-host-updater}
  template:
    metadata:
      labels: {app.kubernetes.io/name: re8ch-network-exporter-host-updater}
    spec:
      hostPID: true
      tolerations: [{operator: Exists}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-6dc3f140f9, rancher-panel, vm-20-12-ubuntu, artchais-nuclio-1, harbor-registry, overseas-edge-50]
      containers:
        - name: updater
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext: {privileged: true}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          command: [/bin/sh, -ec]
          args:
            - |
              case "$NODE_NAME" in
                restricted-node-6dc3f140f9) node_id=128; listen=192.0.2.178 ;;
                rancher-panel) node_id=16; listen=192.0.2.138 ;;
                vm-20-12-ubuntu) node_id=73; listen=192.0.2.192 ;;
                artchais-nuclio-1) node_id=77; listen=192.0.2.182 ;;
                harbor-registry) node_id=95; listen=192.0.2.74 ;;
                overseas-edge-50) node_id=50; listen=192.0.2.79 ;;
                *) exit 2 ;;
              esac
              install -D -m 0755 /payload/re8ch-network-exporter.py /host/usr/local/sbin/re8ch-network-exporter
              install -D -m 0644 /payload/inventory.json /host/etc/re8ch-public-mesh-inventory.json
              install -D -m 0644 /payload/throughput-targets.json /host/etc/re8ch-throughput-targets.json
              install -D -m 0644 /payload/re8ch-network-exporter.service /host/etc/systemd/system/re8ch-network-exporter.service
              if [ ! -s /host/etc/re8ch-network-exporter.env ]; then
                printf 'NODE_ID=%s\nLISTEN_ADDRESS=%s\n' "$node_id" "$listen" > /host/etc/re8ch-network-exporter.env
                chmod 0600 /host/etc/re8ch-network-exporter.env
              fi
              nsenter -t 1 -m -u -i -n -p -- systemctl daemon-reload
              nsenter -t 1 -m -u -i -n -p -- systemctl enable --now re8ch-network-exporter.service
              nsenter -t 1 -m -u -i -n -p -- systemctl restart re8ch-network-exporter.service
              echo "updated $NODE_NAME"
              sleep 3600
          volumeMounts:
            - {name: host-root, mountPath: /host}
            - {name: payload, mountPath: /payload, readOnly: true}
      volumes:
        - name: host-root
          hostPath: {path: /, type: Directory}
        - name: payload
          configMap: {name: re8ch-network-exporter-host-payload}
