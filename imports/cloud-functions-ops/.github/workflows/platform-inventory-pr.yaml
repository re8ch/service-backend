name: Platform inventory PR

on:
  push:
    branches: [inventory-bot/live-drift]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open or update inventory PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head inventory-bot/live-drift --base master --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base master --head inventory-bot/live-drift --title "chore(inventory): reconcile live platform inventory" --body "Automated credential-free inventory drift. Review required; this workflow never merges."
          else
            gh pr edit "$existing" --title "chore(inventory): reconcile live platform inventory"
          fi
