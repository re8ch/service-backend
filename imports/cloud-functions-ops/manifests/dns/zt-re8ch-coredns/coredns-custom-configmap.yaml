apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  ynzs.server: |
    ynzs.com:53 {
        errors
        cache 30
        forward . 192.0.2.131 192.0.2.121 {
            policy sequential
        }
    }
  zt-re8ch.server: |
    zt.re8ch.com:53 {
        errors
        cache 30
        forward . 192.0.2.67 192.0.2.79 192.0.2.203 {
            policy sequential
        }
    }
