apiVersion: v1
kind: ConfigMap
metadata:
  name: compocv-api-relay-nginx
  namespace: compocv
data:
  default.conf: |
    map $http_x_forwarded_proto $compocv_forwarded_proto {
      default $http_x_forwarded_proto;
      "" https;
    }

    server {
      listen 18080;
      server_name _;

      location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $compocv_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        # restricted-node-6dc3f140f9 is reached through its existing ZeroTier/MikroTik service
        # entrypoint. The NodePort avoids the broken cross-node PodCIDR path.
        proxy_pass http://192.0.2.97:32080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compocv-api-relay
  namespace: compocv
  labels:
    app.kubernetes.io/name: compocv-api-relay
    app.kubernetes.io/part-of: compocv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: compocv-api-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compocv-api-relay
        app.kubernetes.io/part-of: compocv
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: artchais-nuclio-1
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 18080
              hostPort: 18080
          readinessProbe:
            httpGet:
              path: /compocv/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /compocv/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: compocv-api-relay-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: compocv-api-r640-nodeport
  namespace: compocv
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 32080
  selector:
    nuclio.io/app: functionres
    nuclio.io/class: function
    nuclio.io/function-name: compocv-api
    nuclio.io/function-version: latest
    nuclio.io/project-name: default
---
apiVersion: v1
kind: Service
metadata:
  name: compocv-api-relay
  namespace: compocv
spec:
  ports:
    - name: http
      port: 18080
      targetPort: http
  selector:
    app.kubernetes.io/name: compocv-api-relay
