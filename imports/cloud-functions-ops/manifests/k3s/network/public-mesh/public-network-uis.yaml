      - {name: qianwen-nuclio-79, address: 192.0.2.112, platform: frr, credential: {username: hyperglass-ro, key: /run/hyperglass-ssh/id_ed25519}, directives: [{builtins: [bgp_route, bgp_aspath, bgp_community]}]}
