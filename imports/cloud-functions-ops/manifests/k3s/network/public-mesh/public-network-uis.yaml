apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperglass-redis
  namespace: qianwen-ops
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: hyperglass-redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: hyperglass-redis}}
    spec:
      nodeSelector: {kubernetes.io/hostname: rancher-panel}
      tolerations: [{key: dedicated, operator: Equal, value: panel, effect: NoSchedule}]
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{name: redis, containerPort: 6379}]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 50m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsUser: 999, runAsGroup: 1000, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Service
metadata: {name: hyperglass-redis, namespace: qianwen-ops}
spec:
  selector: {app.kubernetes.io/name: hyperglass-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperglass
  namespace: qianwen-ops
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: hyperglass}}
  template:
    metadata: {labels: {app.kubernetes.io/name: hyperglass}}
    spec:
      nodeSelector: {kubernetes.io/hostname: rancher-panel}
      tolerations: [{key: dedicated, operator: Equal, value: panel, effect: NoSchedule}]
      imagePullSecrets: [{name: harbor-qianwen-admin}]
      initContainers:
        - name: prepare-config
          image: registry.re8ch.com/qianwen/hyperglass:2.0.4-re8ch5
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /etc/hyperglass/. /config/ && cp /config-source/devices.yaml /config/devices.yaml"]
          securityContext: {allowPrivilegeEscalation: false, runAsUser: 0, runAsGroup: 0, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config-source, mountPath: /config-source, readOnly: true}
            - {name: config, mountPath: /config}
      containers:
        - name: hyperglass
          image: registry.re8ch.com/qianwen/hyperglass:2.0.4-re8ch5
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "hyperglass.console"]
          args: ["start", "--workers", "1"]
          env:
            - {name: HYPERGLASS_REDIS_HOST, value: hyperglass-redis.qianwen-ops.svc.cluster.local}
            - {name: HYPERGLASS_USE_PREBUILT_UI, value: "true"}
            - {name: HYPERGLASS_HOST, value: 0.0.0.0}
            - {name: HYPERGLASS_PORT, value: "8001"}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=768"}
          ports: [{name: http, containerPort: 8001}]
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/hyperglass}
            - {name: ssh, mountPath: /run/hyperglass-ssh, readOnly: true}
      volumes:
        - {name: config-source, configMap: {name: hyperglass-config}}
        - {name: config, emptyDir: {}}
        - {name: ssh, secret: {secretName: hyperglass-ssh, defaultMode: 256}}
---
apiVersion: v1
kind: Service
metadata: {name: hyperglass, namespace: qianwen-ops}
spec:
  selector: {app.kubernetes.io/name: hyperglass}
  ports: [{name: http, port: 8001, targetPort: http}]
---
# Three isolated oauth2-proxy instances. Secret keys required per app:
# OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET.
apiVersion: apps/v1
kind: Deployment
metadata: {name: oauth2-proxy-hubble, namespace: qianwen-ops}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-hubble}}
  template:
    metadata: {labels: {app.kubernetes.io/name: oauth2-proxy-hubble}}
    spec:
      nodeSelector: {kubernetes.io/hostname: rancher-panel}
      tolerations: [{key: dedicated, operator: Equal, value: panel, effect: NoSchedule}]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
          args: ["--provider=oidc", "--oidc-issuer-url=https://dex.re8ch.com", "--redirect-url=https://hubble.re8ch.com/oauth2/callback", "--upstream=http://hubble-ui.kube-system.svc.cluster.local:80", "--http-address=0.0.0.0:4180", "--email-domain=*", "--scope=openid profile email groups", "--cookie-secure=true", "--cookie-samesite=lax", "--reverse-proxy=true", "--skip-provider-button=true"]
          envFrom: [{secretRef: {name: oauth2-proxy-hubble}}]
          ports: [{name: http, containerPort: 4180}]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
