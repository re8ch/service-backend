apiVersion: apps/v1
kind: Deployment
metadata:
  name: re8ch-routing-advisor
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: re8ch-routing-advisor
    app.kubernetes.io/part-of: network-economics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-routing-advisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-routing-advisor
        app.kubernetes.io/part-of: network-economics
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: advisor
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/re8ch-routing-advisor.py"]
          args:
            - --metrics-url=http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428
            - --policy=/config/routing-policy.yaml
            - --costs=/config/network-costs.yaml
            - --listen=0.0.0.0:9790
          ports:
            - name: metrics
              containerPort: 9790
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: re8ch-routing-advisor-script
        - name: config
          projected:
            sources:
              - configMap:
                  name: re8ch-network-costs
              - configMap:
                  name: re8ch-routing-policy
---
apiVersion: v1
kind: Service
metadata:
  name: re8ch-routing-advisor
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: re8ch-routing-advisor
    app.kubernetes.io/part-of: network-economics
spec:
  selector:
    app.kubernetes.io/name: re8ch-routing-advisor
  ports:
    - name: metrics
      port: 9790
      targetPort: metrics
