server {
    listen 80;
    server_name hubble.re8ch.com cost.re8ch.com bgp.re8ch.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# Hyperglass is deployed and validated internally, but its public activation is
# intentionally held at the rollout gate until Harbor and Qwen smokes recover.
server {
    listen 443 ssl;
    server_name bgp.re8ch.com;
    ssl_certificate /etc/letsencrypt/live/bgp.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bgp.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 503;
}

server {
    listen 443 ssl;
    server_name hubble.re8ch.com;
    ssl_certificate /etc/letsencrypt/live/hubble.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hubble.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:32180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name cost.re8ch.com;
    ssl_certificate /etc/letsencrypt/live/cost.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cost.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:32181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
