# Teable on K3S with PostgreSQL provided by pg-re8ch.
#
# This is the current deployment manifest. The older
# teable-cloud.reference.yaml records a rolled-back experiment and should not be
# applied directly.
#
# Database wiring:
# - Secret agent-collab/teable-db-credentials owns PRISMA_DATABASE_URL material.
# - PGHOST_WRITE should use the MikroTik-managed ZeroTier service entrypoint
#   192.0.2.183 so cluster, docs, and service config all share one address
#   system. The 192.0.2.97 LAN address is a lower-level MikroTik/restricted-node-6dc3f140f9 path,
#   not the public K3S service contract for this deployment.
# - Do not point Teable back at legacy pgwrite.* overlay hostnames for this
#   deployment.
#
# SSH/network reminder:
# - 192.0.2.183:22 is restricted-node-6dc3f140f9 through MikroTik forwarding.
# - 192.0.2.183:2222 is MikroTik RouterOS management.
#
# Placement:
# - Teable is memory-hungry enough to disturb the small ICP/control-plane node
#   during image pulls and startup. Keep it off vm-20-12-ubuntu.
# - restricted-node-6dc3f140f9 has the headroom for this first deployment. Revisit placement when a
#   dedicated platform node is available.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: teable-config
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable
    app.kubernetes.io/part-of: agent-collab
data:
  PUBLIC_ORIGIN: "https://teable.re8ch.com"
  PORT: "3000"
  LOG_LEVEL: "info"
  NEXT_ENV_IMAGES_ALL_REMOTE: "true"
  PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
  BACKEND_CACHE_PROVIDER: "redis"
  BACKEND_SESSION_COOKIE_SECURE: "true"
  TELEMETRY_REPORT_DISABLED: "true"
  TIMEZONE: "Asia/Shanghai"
  TZ: "Asia/Shanghai"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teable-assets-r640
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable
    app.kubernetes.io/part-of: agent-collab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teable-redis-data-r640
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable-redis
    app.kubernetes.io/part-of: agent-collab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: teable-redis
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable-redis
    app.kubernetes.io/part-of: agent-collab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teable-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teable-redis
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable-redis
    app.kubernetes.io/part-of: agent-collab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teable-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teable-redis
        app.kubernetes.io/part-of: agent-collab
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: pg-re8ch
          effect: NoSchedule
      containers:
        - name: redis
          image: redis:7.2.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teable-runtime-secret
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --raw ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - redis-cli -a "$REDIS_PASSWORD" --raw ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: teable-redis-data-r640
---
apiVersion: v1
kind: Service
metadata:
  name: teable
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable
    app.kubernetes.io/part-of: agent-collab
spec:
  # The fixed NodePort is the restricted-node-6dc3f140f9 recovery path used by the ICP edge relay
  # when cross-node Flannel VXLAN is unavailable.
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: teable
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 32030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teable
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable
    app.kubernetes.io/part-of: agent-collab
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teable
        app.kubernetes.io/part-of: agent-collab
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: pg-re8ch
          effect: NoSchedule
      initContainers:
        - name: db-migrate
          image: ghcr.io/teableio/teable:latest
          imagePullPolicy: IfNotPresent
          args:
            - migrate-only
          envFrom:
            - configMapRef:
                name: teable-config
            - secretRef:
                name: teable-runtime-secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teable-runtime-secret
                  key: REDIS_PASSWORD
            - name: BACKEND_CACHE_REDIS_URI
              value: "redis://:$(REDIS_PASSWORD)@teable-redis.agent-collab.svc.cluster.local:6379/0"
            - name: PRISMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teable-db-credentials
                  key: DATABASE_URL_MIGRATOR
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: teable
          image: ghcr.io/teableio/teable:latest
          imagePullPolicy: IfNotPresent
          args:
            - skip-migrate
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: teable-config
            - secretRef:
                name: teable-runtime-secret
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teable-runtime-secret
                  key: REDIS_PASSWORD
            - name: BACKEND_CACHE_REDIS_URI
              value: "redis://:$(REDIS_PASSWORD)@teable-redis.agent-collab.svc.cluster.local:6379/0"
            - name: PRISMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teable-db-credentials
                  key: DATABASE_URL_MIGRATOR
          volumeMounts:
            - name: assets
              mountPath: /app/.assets
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: teable-assets-r640
