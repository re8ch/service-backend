apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teable
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable
    app.kubernetes.io/part-of: agent-collab
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/target: 192.0.2.67
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: teable.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # The relay reaches restricted-node-6dc3f140f9 through the existing ICP WireGuard path.
                # Direct panel-to-R640 Flannel traffic is not currently reliable.
                name: teable-edge-relay
                port:
                  name: http
  tls:
    - hosts:
        - teable.re8ch.com
