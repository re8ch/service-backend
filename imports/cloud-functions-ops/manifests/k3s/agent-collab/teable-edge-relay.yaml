apiVersion: v1
kind: ConfigMap
metadata:
  name: teable-edge-relay-code
  namespace: agent-collab
data:
  server.mjs: |
    import http from 'node:http';
    import net from 'node:net';

    const upstreamHost = '192.0.2.178';
    const upstreamPort = 32030;
    const server = http.createServer((request, response) => {
      const upstream = http.request({
        host: upstreamHost,
        port: upstreamPort,
        method: request.method,
        path: request.url,
        headers: {
          ...request.headers,
          'x-forwarded-proto': request.headers['x-forwarded-proto'] || 'https',
          'x-forwarded-host': request.headers['x-forwarded-host'] || request.headers.host,
        },
      }, (upstreamResponse) => {
        response.writeHead(upstreamResponse.statusCode || 502, upstreamResponse.headers);
        upstreamResponse.pipe(response);
      });
      upstream.on('error', (error) => {
        if (!response.headersSent) response.writeHead(502, {'content-type': 'text/plain'});
        response.end(`Teable relay unavailable: ${error.code || 'upstream_error'}\n`);
      });
      request.pipe(upstream);
    });

    server.on('upgrade', (request, socket, head) => {
      const upstream = net.connect(upstreamPort, upstreamHost, () => {
        upstream.write(
          `${request.method} ${request.url} HTTP/${request.httpVersion}\r\n` +
          Object.entries(request.headers).map(([key, value]) => `${key}: ${value}`).join('\r\n') +
          '\r\n\r\n'
        );
        if (head.length) upstream.write(head);
        socket.pipe(upstream).pipe(socket);
      });
      upstream.on('error', () => socket.destroy());
    });

    server.listen(8080, '0.0.0.0');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teable-edge-relay
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable-edge-relay
    app.kubernetes.io/part-of: agent-collab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teable-edge-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teable-edge-relay
        app.kubernetes.io/part-of: agent-collab
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-20-12-ubuntu
      # ICP became an agent-only anchor during the restricted-node-6dc3f140f9/Cilium control-plane
      # migration.  Keep the relay local to its NodePort while tolerating the
      # durable scheduling boundary applied to that node.
      tolerations:
        - key: anchor
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: relay
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: [node, /app/server.mjs]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: teable-edge-relay-code
---
apiVersion: v1
kind: Service
metadata:
  name: teable-edge-relay
  namespace: agent-collab
  labels:
    app.kubernetes.io/name: teable-edge-relay
    app.kubernetes.io/part-of: agent-collab
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: teable-edge-relay
  ports:
    - {name: http, port: 3000, targetPort: http, nodePort: 32031}
