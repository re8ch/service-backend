apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger
  namespace: telemetry
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: telemetry
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.76.0
        imagePullPolicy: IfNotPresent
        args:
        - --badger.directory-key=/badger/keys
        - --badger.directory-value=/badger/values
        - --badger.ephemeral=false
        - --badger.span-store-ttl=336h
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: badger
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: ui, containerPort: 16686, hostPort: 16686}
        - {name: admin, containerPort: 14269}
        readinessProbe:
          httpGet: {path: /, port: admin}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: admin}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: badger
          mountPath: /badger
      volumes:
      - name: badger
        persistentVolumeClaim:
          claimName: jaeger-badger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: telemetry
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
  - {name: ui, port: 16686, targetPort: ui}
  - {name: admin, port: 14269, targetPort: admin}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui-lan
  namespace: telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-otel-collector
  namespace: telemetry
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      batch:
        timeout: 5s
        send_batch_size: 512
    exporters:
      otlp/jaeger:
        endpoint: jaeger.telemetry.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
      telemetry:
        resource:
          service.name: kagent-otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-otel-collector
  namespace: telemetry
  labels:
    app.kubernetes.io/name: kagent-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-otel-collector
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
        imagePullPolicy: IfNotPresent
        args: [--config=/etc/otelcol/config.yaml]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        - {name: health, containerPort: 13133}
        readinessProbe:
          httpGet: {path: /, port: health}
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: health}
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: kagent-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-otel-collector
  namespace: telemetry
spec:
  selector:
    app.kubernetes.io/name: kagent-otel-collector
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
  - {name: otlp-http, port: 4318, targetPort: otlp-http}
