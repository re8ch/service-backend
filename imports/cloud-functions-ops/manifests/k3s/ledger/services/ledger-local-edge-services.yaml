# Node-local aggregator services for api.re8ch.com weighted DNS.
# Each Nuclio edge node only routes to the ledger pod scheduled on that node.
apiVersion: v1
kind: Service
metadata:
  name: ledger-api-gateway-local
  namespace: ledger
  labels:
    ledger.re8ch.com/routing: local-edge
    saas.re8ch.com/product: ledger
    saas.re8ch.com/tenant: ledger
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    ledger.re8ch.com/component: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
