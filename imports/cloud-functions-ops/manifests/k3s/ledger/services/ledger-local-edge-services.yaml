# R640-owned Ledger services for api.re8ch.com.
# Select the canonical functions only; regional partner replicas use suffixed names.
apiVersion: v1
kind: Service
metadata:
  name: ledger-api-gateway-local
  namespace: ledger
  labels:
    ledger.re8ch.com/routing: local-edge
    saas.re8ch.com/product: ledger
    saas.re8ch.com/tenant: ledger
  annotations:
    service.kubernetes.io/topology-mode: Auto
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    nuclio.io/function-name: ledger-api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
