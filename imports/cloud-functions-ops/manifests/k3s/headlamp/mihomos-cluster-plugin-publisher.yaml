apiVersion: batch/v1
kind: Job
metadata:
  name: headlamp-mihomos-plugin-0-1-1
  namespace: headlamp
  labels: {app.kubernetes.io/name: headlamp-mihomos-cluster-plugin}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: headlamp-mihomos-cluster-plugin}}
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
      containers:
        - name: publish
          # Reuse the image already pinned and cached by the Headlamp pods;
          # plugin publication must not depend on a new public image pull.
          image: ghcr.io/headlamp-k8s/headlamp:v0.42.0
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              install_dir=/plugins/mihomos-cluster-0.1.1
              mkdir -p "$install_dir"
              cp /bundle/main.js "$install_dir/main.js.next"
              cp /bundle/package.json "$install_dir/package.json.next"
              mv -f "$install_dir/main.js.next" "$install_dir/main.js"
              mv -f "$install_dir/package.json.next" "$install_dir/package.json"
              sha256sum "$install_dir/main.js" > "$install_dir/main.js.sha256"
              rm -rf /plugins/mihomos-cluster
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
            - {name: plugins, mountPath: /plugins}
      volumes:
        - name: bundle
          configMap: {name: headlamp-mihomos-cluster-plugin-bundle}
        - name: plugins
          persistentVolumeClaim: {claimName: headlamp-plugins-v2}
