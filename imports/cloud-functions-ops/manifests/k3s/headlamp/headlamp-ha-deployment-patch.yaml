# Apply with: kubectl patch deployment/headlamp -n headlamp --type=merge
#   --patch-file manifests/k3s/headlamp/headlamp-ha-deployment-patch.yaml
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        traffic.re8ch.com/headlamp-active: "true"
    spec:
      nodeSelector: null
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # Keep the management UI on the two surviving control-plane
                    # nodes so it stays available while restricted-node-6dc3f140f9 or a worker is down.
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/name: headlamp}
      # Only plugin artifacts are shared. Runtime, cache and identity state
      # remain inside the stateless Headlamp containers.
      volumes:
        - name: plugins
          emptyDir: null
          persistentVolumeClaim:
            claimName: headlamp-plugins
      # Use the node underlay for the Kubernetes API proxy. This avoids B1's
      # intermittent Pod-network path to the API Service VIP while preserving
      # two independent replicas and routable Service endpoints.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
