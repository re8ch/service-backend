apiVersion: v1
kind: PersistentVolume
metadata:
  name: teable-infra-minio-r640
spec:
  capacity: {storage: 20Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-r640
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [restricted-node-6dc3f140f9]
  hostPath: {path: /var/lib/re8ch/teable-infra-minio, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: teable-infra-minio-r640, namespace: opensandbox-system}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual-r640
  volumeName: teable-infra-minio-r640
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: teable-infra-minio, namespace: opensandbox-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: teable-infra-minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: teable-infra-minio}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: teable-infra-storage, key: minio-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: teable-infra-storage, key: minio-password}}
          ports:
            - {name: api, containerPort: 9000}
          readinessProbe: {httpGet: {path: /minio/health/ready, port: api}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: teable-infra-minio-r640}
---
apiVersion: v1
kind: Service
metadata: {name: teable-infra-minio, namespace: opensandbox-system}
spec:
  selector: {app.kubernetes.io/name: teable-infra-minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
---
apiVersion: batch/v1
kind: Job
metadata: {name: teable-infra-minio-bootstrap, namespace: opensandbox-system}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          command: [/bin/sh, -ec]
          args:
            - |
              until mc alias set local http://teable-infra-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 2; done
              mc mb --ignore-existing local/teable-agent
              # The MinIO API is ClusterIP-only; the authenticated teable-infra
              # facade is its sole supported client-facing entrypoint.
              mc anonymous set public local/teable-agent
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: teable-infra-storage, key: minio-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: teable-infra-storage, key: minio-password}}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: teable-infra-git-r640}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-r640
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [restricted-node-6dc3f140f9]
  hostPath: {path: /var/lib/re8ch/teable-infra-git, type: DirectoryOrCreate}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: teable-infra-git-r640, namespace: opensandbox-system}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual-r640
  volumeName: teable-infra-git-r640
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: teable-infra-git-app, namespace: opensandbox-system}
data:
  server.py: |
    import io, json, os, re, shutil, subprocess, urllib.parse, zipfile
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    ROOT = "/data/repos"
    KEY = os.environ["TEABLE_INFRA_API_KEY"]
    PUBLIC = os.environ.get("GIT_PUBLIC_URL", "http://teable-infra-git.opensandbox-system.svc.cluster.local:8080")
    os.makedirs(ROOT, exist_ok=True)
    def repo(app):
        if not re.fullmatch(r"[A-Za-z0-9_-]+", app): raise ValueError("invalid appId")
        return os.path.join(ROOT, app + ".git")
    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def auth(self): return self.headers.get("Authorization") == "Bearer " + KEY
        def out(self, code, body=b"", ctype="application/json"):
            if isinstance(body, dict): body=json.dumps(body,separators=(",", ":")).encode()
            self.send_response(code); self.send_header("Content-Type",ctype); self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
        def run(self):
            if self.path == "/health": return self.out(200,{"status":"ok"})
            if not self.auth(): return self.out(401,{"error":"unauthorized"})
            path=urllib.parse.urlsplit(self.path)
            if path.path == "/api/git/repos" and self.command == "POST":
                n=int(self.headers.get("Content-Length","0")); app=json.loads(self.rfile.read(n) or b"{}").get("appId","")
                try: p=repo(app)
                except ValueError as e: return self.out(400,{"error":str(e)})
                existed=os.path.isdir(p)
                if not existed: subprocess.run(["git","init","--bare","--initial-branch=main",p],check=True)
                subprocess.run(["git","--git-dir",p,"config","http.receivepack","true"],check=True)
                return self.out(200 if existed else 201,{"appId":app})
            if path.path == "/api/git/credentials" and self.command == "POST":
                n=int(self.headers.get("Content-Length","0")); app=json.loads(self.rfile.read(n) or b"{}").get("appId","")
                try: repo(app)
                except ValueError as e: return self.out(400,{"error":str(e)})
                return self.out(200,{"gitUrl":f"{PUBLIC}/git/{app}.git","token":KEY,"expiresIn":900})
            m=re.fullmatch(r"/api/git/repos/([A-Za-z0-9_-]+)",path.path)
            if m and self.command == "DELETE":
                p=repo(m.group(1))
                if not os.path.exists(p): return self.out(404,{"error":"not found"})
                shutil.rmtree(p); return self.out(204,b"")
            m=re.fullmatch(r"/api/git/repos/([A-Za-z0-9_-]+)/archive",path.path)
            if m and self.command == "GET":
                p=repo(m.group(1)); ref=urllib.parse.parse_qs(path.query).get("ref",["main"])[0]
                x=subprocess.run(["git","--git-dir",p,"archive","--format=zip",ref],capture_output=True)
                return self.out(200,x.stdout,"application/zip") if x.returncode==0 else self.out(404,{"error":x.stderr.decode(errors="replace")})
            m=re.match(r"/git/([A-Za-z0-9_-]+\.git)(/.*)?$",path.path)
            if m:
                env=os.environ.copy(); env.update({"GIT_PROJECT_ROOT":ROOT,"GIT_HTTP_EXPORT_ALL":"1","PATH_INFO":"/"+m.group(1)+(m.group(2) or ""),"QUERY_STRING":path.query,"REQUEST_METHOD":self.command,"CONTENT_TYPE":self.headers.get("Content-Type",""),"CONTENT_LENGTH":self.headers.get("Content-Length","0"),"REMOTE_USER":"teable"})
                body=self.rfile.read(int(env["CONTENT_LENGTH"])) if int(env["CONTENT_LENGTH"] or 0) else b""
                x=subprocess.run(["git","http-backend"],input=body,capture_output=True,env=env)
                separator=b"\r\n\r\n" if b"\r\n\r\n" in x.stdout else b"\n\n"
                head,_,data=x.stdout.partition(separator); lines=head.decode(errors="replace").splitlines(); status=200
                for line in lines:
                    if line.lower().startswith("status:"): status=int(line.split()[1])
                self.send_response(status)
                for line in lines:
                    if ":" in line and not line.lower().startswith("status:"):
                        k,v=line.split(":",1); self.send_header(k.strip(),v.strip())
                self.send_header("Content-Length",str(len(data))); self.end_headers(); self.wfile.write(data); return
            self.out(404,{"error":"not_found"})
        do_GET=do_POST=do_DELETE=run
        def log_message(self,fmt,*args): print(fmt%args,flush=True)
    ThreadingHTTPServer(("0.0.0.0",8080),H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: teable-infra-git, namespace: opensandbox-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: teable-infra-git}}
  template:
    metadata: {labels: {app.kubernetes.io/name: teable-infra-git}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: git
          image: python:3.12-alpine
          command: [/bin/sh, -ec]
          args: ["apk add --no-cache git git-daemon >/dev/null && exec python /app/server.py"]
          env:
            - name: TEABLE_INFRA_API_KEY
              valueFrom: {secretKeyRef: {name: opensandbox-api-key, key: teable-api-key}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - {name: app, configMap: {name: teable-infra-git-app}}
        - {name: data, persistentVolumeClaim: {claimName: teable-infra-git-r640}}
---
apiVersion: v1
kind: Service
metadata: {name: teable-infra-git, namespace: opensandbox-system}
spec:
  selector: {app.kubernetes.io/name: teable-infra-git}
  ports: [{name: http, port: 8080, targetPort: http}]
