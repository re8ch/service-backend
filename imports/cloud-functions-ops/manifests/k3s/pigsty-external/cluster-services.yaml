apiVersion: v1
kind: Service
metadata: {name: pg-re8ch-primary, namespace: pigsty-external, labels: {re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: primary}}
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432}, {name: pgbouncer, port: 6432, targetPort: 6432}]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata: {name: pg-re8ch-primary, namespace: pigsty-external, labels: {kubernetes.io/service-name: pg-re8ch-primary, re8ch.com/cluster: pg-re8ch, re8ch.com/data-role: primary}}
addressType: IPv4
ports: [{name: postgres, port: 5432}, {name: pgbouncer, port: 6432}]
# Patroni primary after the restricted-node-6dc3f140f9 outage (timeline 27).
endpoints: [{addresses: [192.0.2.172], conditions: {ready: true}}]
---
apiVersion: v1
kind: Service
