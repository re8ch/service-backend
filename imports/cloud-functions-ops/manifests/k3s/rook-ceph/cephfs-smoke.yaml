apiVersion: v1
kind: Namespace
metadata:
  name: cephfs-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cephfs-shared
  namespace: cephfs-smoke
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: cephfs-pilot
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cephfs-cross-node-smoke
  namespace: cephfs-smoke
spec:
  selector:
    matchLabels:
      app: cephfs-cross-node-smoke
  template:
    metadata:
      labels:
        app: cephfs-cross-node-smoke
    spec:
      nodeSelector:
        storage.re8ch.com/ceph-pilot: "true"
      containers:
        - name: smoke
          # Reuse the Ceph image already pinned and cached on all three pilot
          # nodes. This avoids making the storage acceptance test depend on a
          # fresh Docker Hub pull from the WSL control-plane nodes.
          image: quay.io/ceph/ceph:v20.2.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              node="${NODE_NAME}"
              while true; do
                date -u +%FT%TZ > "/shared/${node}.tmp"
                mv "/shared/${node}.tmp" "/shared/${node}.txt"
                sleep 15
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: cephfs-shared
