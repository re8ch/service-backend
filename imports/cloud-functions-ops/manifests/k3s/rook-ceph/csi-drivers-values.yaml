# Rook v1.20.3 requires the separate ceph-csi-drivers chart. These values are
# based on Rook's v1.20.3 recommended values and intentionally enable only the
# CephFS driver used by this pilot.
operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
      replicas: 1

drivers:
  rbd:
    enabled: false
    name: rook-ceph.rbd.csi.ceph.com
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    # Production uses native Ceph Messenger v2 secure mode. Without an
    # explicit v2 mode, the kernel client may attempt a V1 banner on port 3300.
    kernelMountOptions:
      ms_mode: secure
    nodePlugin:
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: observability
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.re8ch.com/ceph-client
                    operator: In
                    values: ["true"]
    controllerPlugin:
      replicas: 1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["restricted-node-6dc3f140f9"]
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
