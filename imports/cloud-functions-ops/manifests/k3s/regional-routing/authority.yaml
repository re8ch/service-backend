apiVersion: v1
kind: Namespace
metadata:
  name: regional-routing
  labels: {re8ch.com/plane: networking}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regional-routing-authority
  namespace: regional-routing
data:
  NAMESERVERS: ns-sh.re8ch.com. ns-gz.re8ch.com. ns-us.re8ch.com.
  CANDIDATES_JSON: |-
    [
      {
        "id": "domain-ex",
        "region": "shanghai",
        "ip": "192.0.2.62",
        "localIp": "192.0.2.200",
        "priority": 0,
        "priorityByRegion": {"shanghai": 20, "guangzhou": 20, "los-angeles": 30},
        "probes": {
          "api": "https://api.re8ch.com/ledger/_region",
          "db-ro": "https://db-ro.re8ch.com/auth/",
          "db-rw": "https://db-rw.re8ch.com/auth/"
        }
      },
      {
        "id": "vm-20-12-ubuntu",
        "region": "guangzhou",
        "ip": "192.0.2.122",
        "localIp": "192.0.2.239",
        "priority": 5,
        "priorityByRegion": {"shanghai": 25, "guangzhou": 20, "los-angeles": 30},
        "probes": {
          "api": "https://api.re8ch.com/ledger/_region",
          "db-ro": "https://db-ro.re8ch.com/auth/",
          "db-rw": "https://db-rw.re8ch.com/auth/"
        }
      },
      {
        "id": "overseas-edge-50",
        "region": "los-angeles",
        "ip": "192.0.2.189",
        "localIp": "192.0.2.189",
        "priority": 10,
        "priorityByRegion": {"shanghai": 40, "guangzhou": 40, "los-angeles": -30},
        "probes": {
          "api": "https://api.re8ch.com/ledger/_region",
          "db-ro": "https://db-ro.re8ch.com/auth/",
          "db-rw": "https://db-rw.re8ch.com/auth/"
        }
      },
      {
        "id": "restricted-node-6dc3f140f9",
        "region": "china-central",
        "ip": "192.0.2.138",
        "localIp": "192.0.2.169",
        "priority": -30,
        "priorityByRegion": {"shanghai": -40, "guangzhou": -40, "los-angeles": 25},
        "probes": {
          "api": "https://api.re8ch.com/ledger/_region",
          "db-ro": "https://db-ro.re8ch.com/auth/",
          "db-rw": "https://db-rw.re8ch.com/auth/"
        }
      }
    ]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: regional-routing-authority
  namespace: regional-routing
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: regional-routing-authority}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regional-routing-authority
        app.kubernetes.io/part-of: regional-routing
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {kubernetes.io/os: linux}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [domain-ex, vm-20-12-ubuntu, overseas-edge-50]
      tolerations: [{operator: Exists}]
      containers:
        - name: authority
          image: docker.1ms.run/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python3, /app/authority.py]
          envFrom: [{configMapRef: {name: regional-routing-authority}}]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
      volumes:
        - name: script
          configMap: {name: regional-routing-authority-script, defaultMode: 0555}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: regional-routing-authority
  namespace: regional-routing
spec:
  selector: {app.kubernetes.io/name: regional-routing-authority}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regional-edge-tls-proxy
  namespace: regional-routing
data:
  nginx.conf: |-
    events {}
    http {
      access_log /dev/stdout;
      error_log /dev/stderr notice;
      server {
        listen 443 ssl;
        server_name api.re8ch.com;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /.well-known/re8ch-routing/v1 {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_pass http://192.0.2.213:80;
        }
        location / {
          resolver 192.0.2.240 valid=30s ipv6=off;
          set $legacy_api api.re8ch.com.eo.dnse1.com;
          proxy_set_header Host api.re8ch.com;
          proxy_set_header X-Forwarded-Host api.re8ch.com;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_ssl_server_name on;
          proxy_ssl_name api.re8ch.com;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 3;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_pass https://$legacy_api;
        }
      }
      server {
        listen 443 ssl;
        server_name db-ro.re8ch.com db-rw.re8ch.com;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location ^~ /observable/ {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_pass http://192.0.2.213:80;
        }
        location / {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_ssl_server_name on;
          proxy_ssl_name $host;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 3;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_pass https://192.0.2.62;
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: regional-edge-tls-proxy
  namespace: regional-routing
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: regional-edge-tls-proxy}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regional-edge-tls-proxy
        app.kubernetes.io/part-of: regional-routing
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      nodeSelector: {kubernetes.io/hostname: overseas-edge-50}
      tolerations: [{operator: Exists}]
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 443, protocol: TCP}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID], drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - name: config
          configMap: {name: regional-edge-tls-proxy}
        - name: tls
          secret: {secretName: re8ch-wildcard-tls}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: regional-routing-authority
  namespace: regional-routing
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: regional-routing-authority}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: regional-routing-discovery
  namespace: regional-routing
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
  hostnames: [api.re8ch.com, db-ro.re8ch.com, db-rw.re8ch.com]
  rules:
    - matches:
        - path: {type: Exact, value: /.well-known/re8ch-routing/v1}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /v1/discovery}
      backendRefs:
        - {name: regional-routing-authority, port: 8080}
