apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: re8ch-cloudflare-dns01}
spec:
  acme:
    email: admin@re8ch.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: {name: re8ch-cloudflare-dns01-account}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: {name: cloudflare-api-token, key: api-token}
