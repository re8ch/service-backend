apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - public-edge-crd.yaml
  - public-edge-rbac.yaml
  - node-edge-labels.yaml
  - authority.yaml
  - regional-gateways.yaml
  - regional-origin-dnat.yaml
  - migrated-public-http-routes.yaml
configMapGenerator:
  - name: regional-routing-authority-script
    namespace: regional-routing
    files:
      - authority.py=../../../apps/regional-routing-authority/authority.py
generatorOptions:
  disableNameSuffixHash: true
