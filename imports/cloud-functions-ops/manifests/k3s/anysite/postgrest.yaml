apiVersion: apps/v1
kind: Deployment
metadata:
  name: anysite-postgrest
  namespace: anysite
  labels:
    app.kubernetes.io/name: anysite-postgrest
    app.kubernetes.io/part-of: anysite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anysite-postgrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anysite-postgrest
        app.kubernetes.io/part-of: anysite
    spec:
      serviceAccountName: anysite-runtime
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: pg-re8ch
          effect: NoSchedule
      containers:
        - name: postgrest
          image: mjhsdd6xkcym4k.xuanyuan.run/postgrest/postgrest:v14.12
          imagePullPolicy: IfNotPresent
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: anysite-db-credentials
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMAS
              value: scale
            - name: PGRST_DB_ANON_ROLE
              value: anysite_app_ro
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anysite-db-credentials
                  key: PGRST_JWT_SECRET
            - name: PGRST_DB_POOL
              value: "10"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
            - name: PGRST_ADMIN_SERVER_HOST
              value: 127.0.0.1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anysite-postgrest
  namespace: anysite
  labels:
    app.kubernetes.io/name: anysite-postgrest
    app.kubernetes.io/part-of: anysite
spec:
  clusterIP: 192.0.2.95
  type: NodePort
  selector:
    app.kubernetes.io/name: anysite-postgrest
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30191
