    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/component: studio }
  template: &supabase_pod_template_base
    metadata:
      labels:
        app.kubernetes.io/part-of: supabase-pg-re8ch
        app.kubernetes.io/component: studio
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - key: dedicated
          operator: Equal
          value: pg-re8ch
          effect: NoSchedule
      containers:
        - name: studio
          image: mjhsdd6xkcym4k.xuanyuan.run/supabase/studio:2026.07.07-sha-a6a04f2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: supabase-pg-re8ch-env }
            - secretRef: { name: supabase-pg-re8ch-secrets }
          env:
            - { name: HOSTNAME, value: "0.0.0.0" }
            - { name: STUDIO_PG_META_URL, value: "http://supabase-meta:8080" }
            - { name: SUPABASE_URL, value: "http://supabase-api-kong:8000" }
            - { name: SUPABASE_ANON_KEY, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: ANON_KEY } } }
            - { name: SUPABASE_SERVICE_KEY, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: SERVICE_ROLE_KEY } } }
            - { name: AUTH_JWT_SECRET, valueFrom: { secretKeyRef: { name: supabase-pg-re8ch-secrets, key: JWT_SECRET } } }
            - { name: DEFAULT_ORGANIZATION_NAME, valueFrom: { configMapKeyRef: { name: supabase-pg-re8ch-env, key: STUDIO_DEFAULT_ORGANIZATION } } }
            - { name: DEFAULT_PROJECT_NAME, valueFrom: { configMapKeyRef: { name: supabase-pg-re8ch-env, key: STUDIO_DEFAULT_PROJECT } } }
            - { name: ENABLED_FEATURES_LOGS_ALL, value: "false" }
            - { name: SNIPPETS_MANAGEMENT_FOLDER, value: "/tmp/snippets" }
            - { name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER, value: "/tmp/edge-functions" }
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 80m, memory: 256Mi }
            limits: { cpu: 200m, memory: 768Mi }
