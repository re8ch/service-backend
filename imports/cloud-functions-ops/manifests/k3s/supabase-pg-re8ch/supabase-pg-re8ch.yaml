  namespace: supabase-pg-re8ch
data:
  POSTGRES_HOST: 192.0.2.183
  POSTGRES_PORT: "5432"
  POSTGRES_DB: postgres
  PGRST_DB_SCHEMAS: public,storage,graphql_public
  PGRST_DB_MAX_ROWS: "1000"
  PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
  SITE_URL: http://supabase-pg-re8ch.supabase-pg-re8ch.svc.cluster.local:8000
  API_EXTERNAL_URL: http://supabase-pg-re8ch.supabase-pg-re8ch.svc.cluster.local:8000
  SUPABASE_PUBLIC_URL: http://supabase-pg-re8ch.supabase-pg-re8ch.svc.cluster.local:8000
  STUDIO_DEFAULT_ORGANIZATION: RE8CH
  STUDIO_DEFAULT_PROJECT: pg-re8ch
  DISABLE_SIGNUP: "true"
  JWT_EXPIRY: "3600"
  ENABLE_EMAIL_SIGNUP: "false"
  ENABLE_ANONYMOUS_USERS: "false"
  ENABLE_EMAIL_AUTOCONFIRM: "true"
  ENABLE_PHONE_SIGNUP: "false"
  ENABLE_PHONE_AUTOCONFIRM: "false"
  SMTP_ADMIN_EMAIL: ops@re8ch.com
  SMTP_HOST: localhost
  SMTP_PORT: "25"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_SENDER_NAME: RE8CH Supabase
  ADDITIONAL_REDIRECT_URLS: ""
  MAILER_URLPATHS_INVITE: /auth/v1/verify
  MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
  GLOBAL_S3_BUCKET: supabase-pg-re8ch
  STORAGE_TENANT_ID: pg-re8ch
  REGION: r640-lan
  IMGPROXY_AUTO_WEBP: "true"
  S3_PROTOCOL_ACCESS_KEY_ID: ""
  S3_PROTOCOL_ACCESS_KEY_SECRET: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-kong-config
  namespace: supabase-pg-re8ch
data:
  kong-entrypoint.sh: |
    #!/bin/sh
    if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
      export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)"
      export LUA_RT_WS_EXPR="\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
    else
      export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
      export LUA_RT_WS_EXPR="\$(query_params.apikey)"
    fi
    awk '{
      result = ""
      rest = $0
      while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
        varname = substr(rest, RSTART + 1, RLENGTH - 1)
        if (varname in ENVIRON) {
          result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
        } else {
          result = result substr(rest, 1, RSTART + RLENGTH - 1)
        }
        rest = substr(rest, RSTART + RLENGTH)
      }
      print result rest
    }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"
    sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' "$KONG_DECLARATIVE_CONFIG"
    exec /entrypoint.sh kong docker-start
  kong.yml: |
    _format_version: '2.1'
    _transform: true
    consumers:
      - username: DASHBOARD
      - username: anon
        keyauth_credentials:
          - key: $SUPABASE_ANON_KEY
      - username: service_role
        keyauth_credentials:
          - key: $SUPABASE_SERVICE_KEY
    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin
    basicauth_credentials:
      - consumer: DASHBOARD
        username: '$DASHBOARD_USERNAME'
        password: '$DASHBOARD_PASSWORD'
    services:
      - name: auth-v1-open
        url: http://supabase-auth:9999/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths: [/auth/v1/verify]
        plugins:
          - name: cors
      - name: auth-v1-open-callback
        url: http://supabase-auth:9999/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths: [/auth/v1/callback]
        plugins:
          - name: cors
      - name: auth-v1-open-authorize
        url: http://supabase-auth:9999/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths: [/auth/v1/authorize]
        plugins:
          - name: cors
      - name: auth-v1
        url: http://supabase-auth:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths: [/auth/v1/]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: rest-v1
        url: http://supabase-rest:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths: [/rest/v1/]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: realtime-v1-ws
        url: http://supabase-realtime:4000/socket
        protocol: ws
        routes:
          - name: realtime-v1-ws
            strip_path: true
            paths: [/realtime/v1/]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "x-api-key:$LUA_RT_WS_EXPR"
              replace:
                querystring:
                  - "apikey:$LUA_RT_WS_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: realtime-v1-rest
        url: http://supabase-realtime:4000/api
        routes:
          - name: realtime-v1-rest
            strip_path: true
            paths: [/realtime/v1/api]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: storage-v1
        url: http://supabase-storage:5000/
        routes:
          - name: storage-v1-all
            strip_path: true
            paths: [/storage/v1/]
        plugins:
          - name: cors
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
      - name: meta
        url: http://supabase-meta:8080/
        routes:
          - name: meta-all
            strip_path: true
            paths: [/pg/]
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin]
      - name: dashboard
        url: http://192.0.2.97:3000/
        routes:
          - name: dashboard-all
            strip_path: true
            paths: [/]
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
---
