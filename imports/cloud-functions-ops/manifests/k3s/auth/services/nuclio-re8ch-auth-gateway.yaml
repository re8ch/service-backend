apiVersion: v1
kind: Service
metadata:
  name: nuclio-re8ch-auth-gateway
  namespace: auth
  labels:
    nuclio.io/app: functionres
    nuclio.io/class: function
    nuclio.io/function-name: re8ch-auth-gateway
    nuclio.io/function-version: latest
    nuclio.io/project-name: default
    saas.re8ch.com/tenant: auth
    saas.re8ch.com/product: re8ch-auth
    saas.re8ch.com/function: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    nuclio.io/app: functionres
    nuclio.io/class: function
    nuclio.io/function-name: re8ch-auth-gateway
    nuclio.io/function-version: latest
    nuclio.io/project-name: default
