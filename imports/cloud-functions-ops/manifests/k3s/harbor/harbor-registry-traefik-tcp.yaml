apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: harbor-registry-tls-passthrough
  namespace: harbor
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`registry.re8ch.com`)
      services:
        - name: harbor-registry
          port: 443
  tls:
    passthrough: true
