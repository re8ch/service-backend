apiVersion: v1
kind: Service
metadata:
  name: re8ch-cilium-gateway-vip
  namespace: harbor
spec:
  clusterIP: None
  ports:
    - name: tls
      port: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: re8ch-cilium-gateway-vip
  namespace: harbor
  labels:
    kubernetes.io/service-name: re8ch-cilium-gateway-vip
addressType: IPv4
ports:
  - name: tls
    port: 443
    protocol: TCP
endpoints:
  - addresses: [192.0.2.209]
    conditions: {ready: true}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: harbor-registry-tls-passthrough
  namespace: harbor
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`registry.re8ch.com`)
      services:
        - name: re8ch-cilium-gateway-vip
          port: 443
  tls:
    passthrough: true
