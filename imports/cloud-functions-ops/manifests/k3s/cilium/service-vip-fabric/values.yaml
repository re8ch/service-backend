stage: 1
pool:
  name: re8ch-service-vip
  cidr: 192.0.2.121/24
  enabled: true
canary:
  enabled: true
  namespace: kube-system
  address: 192.0.2.120
advertisement:
  labels:
    networking.re8ch.com/lb-pool: service-vip
    networking.re8ch.com/bgp-advertise: enabled
peer:
  timers: {connectRetry: 3, hold: 9, keepAlive: 3}
  gracefulRestartSeconds: 30
nodes:
  a1:
    hostname: restricted-node-1eb0570f74
    localASN: 4250010147
    routerID: 192.0.2.242
    localAddress: 192.0.2.176
    peers:
      - {name: icp-frr, asn: 4200000073, address: 192.0.2.192}
  b1:
    hostname: restricted-node-296f36f2fb
    localASN: 4250010125
    routerID: 192.0.2.1
    localAddress: 192.0.2.4
    peers:
      - {name: icp-frr, asn: 4200000073, address: 192.0.2.192}
  restricted-node-6dc3f140f9:
    hostname: restricted-node-6dc3f140f9
    localASN: 4250000128
    routerID: 192.0.2.179
    localAddress: 192.0.2.179
    peers:
      - {name: frr-a1, asn: 4200010147, address: 192.0.2.242}
      - {name: frr-b1, asn: 4200010125, address: 192.0.2.1}

# Optional regional egress. This does not proxy cluster, Ceph, etcd or private
# traffic. Supply an existing Secret containing paths.yaml with encrypted
# proxy-provider transports; the chart never packages provider credentials.
mihomoGateway:
  enabled: false
  image:
    repository: metacubex/mihomo
    tag: v1.19.29
    pullPolicy: IfNotPresent
  capabilityLabel: networking.re8ch.com/mihomo-node
  capabilityValue: enabled
  existingPathsSecret: egress-fabric-paths
  service:
    type: ClusterIP
    requestedLoadBalancerIP: ""
    externalTrafficPolicy: Local
    advertise: false
  controller:
    enabled: true
  rules:
    overseasDomains:
      - github.com
      - githubusercontent.com
      - ghcr.io
      - quay.io
      - registry.k8s.io
      - pkg.dev
      - docker.io
      - docker.com
      - amazonaws.com
