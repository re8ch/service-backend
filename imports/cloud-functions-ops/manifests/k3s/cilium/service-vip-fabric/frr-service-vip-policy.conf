! Policy-only fragment. It defines no neighbor and changes no route by itself.
! Attach RE8CH-SVC-VIP-IN to Cilium-facing peers and RE8CH-SVC-VIP-OUT to
! service-fabric peers only after the Stage 1 live gates pass.
!
ip prefix-list RE8CH-PROTECTED-NODE seq 10 permit 192.0.2.253/24 le 32
ip prefix-list RE8CH-PROTECTED-POD seq 10 permit 192.0.2.224/16 le 32
ip prefix-list RE8CH-SVC-VIP-EXACT seq 10 permit 192.0.2.215/24 ge 32 le 32
!
route-map RE8CH-SVC-VIP-IN deny 10
 match ip address prefix-list RE8CH-PROTECTED-NODE
route-map RE8CH-SVC-VIP-IN deny 20
 match ip address prefix-list RE8CH-PROTECTED-POD
route-map RE8CH-SVC-VIP-IN permit 100
 match ip address prefix-list RE8CH-SVC-VIP-EXACT
route-map RE8CH-SVC-VIP-IN deny 1000
!
route-map RE8CH-SVC-VIP-OUT deny 10
 match ip address prefix-list RE8CH-PROTECTED-NODE
route-map RE8CH-SVC-VIP-OUT deny 20
 match ip address prefix-list RE8CH-PROTECTED-POD
route-map RE8CH-SVC-VIP-OUT permit 100
 match ip address prefix-list RE8CH-SVC-VIP-EXACT
route-map RE8CH-SVC-VIP-OUT deny 1000
!
