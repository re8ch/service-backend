apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: re8ch-service-vip
  labels:
    networking.re8ch.com/stage: "0"
spec:
  # Stage 0 is intentionally inert. Enabling this requires live health gates,
  # a reviewed FRR handoff, and a single labelled canary Service.
  disabled: true
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.0.2.215/24
  serviceSelector:
    matchLabels:
      networking.re8ch.com/lb-pool: service-vip
      networking.re8ch.com/bgp-advertise: enabled
