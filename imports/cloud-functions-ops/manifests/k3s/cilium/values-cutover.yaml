# Full cutover overlay. WSL remains excluded because it has no
# re8ch.com/cilium-migrate=true label.

cni:
  install: true
  customConf: false
  exclusive: true
  uninstall: false

nodeSelector:
  kubernetes.io/os: linux
  re8ch.com/cilium-migrate: "true"

envoy:
  enabled: false

operator:
  replicas: 2
  skipCRDCreation: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - restricted-node-1eb0570f74
                  - restricted-node-296f36f2fb
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              io.cilium/app: operator
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
    - key: node-role.kubernetes.io/master
      operator: Exists
    - key: node.kubernetes.io/not-ready
      operator: Exists

hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
