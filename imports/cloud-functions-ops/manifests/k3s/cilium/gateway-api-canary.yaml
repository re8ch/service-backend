apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: re8ch-service-vip
  namespace: kube-system
spec:
  description: RE8CH Cilium-FRR service VIP gateway
  service:
    type: LoadBalancer
    loadBalancerClass: io.cilium/bgp-control-plane
    externalTrafficPolicy: Cluster
    allocateLoadBalancerNodePorts: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-re8ch
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: re8ch-service-vip
    namespace: kube-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: re8ch-gateway-canary
  namespace: kube-system
  annotations:
    # DNS names belong to the public 443 edge, while the Gateway and backend
    # Pods may live anywhere in the Cilium routing domain.
    external-dns.alpha.kubernetes.io/target: 192.0.2.67
spec:
  gatewayClassName: cilium-re8ch
  infrastructure:
    labels:
      networking.re8ch.com/lb-pool: service-vip
      networking.re8ch.com/bgp-advertise: enabled
    annotations:
      lbipam.cilium.io/ips: 192.0.2.209
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: tools-https
      hostname: tools.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: headlamp-https
      hostname: headlamp.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: dex-https
      hostname: dex.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grafana-https
      hostname: grafana.re8ch.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: re8ch-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: harbor-tls
      hostname: registry.re8ch.com
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-edge-origin
  namespace: headlamp
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-public
  namespace: headlamp
  annotations:
    # Gateway status contains private service VIPs for every regional parent.
    # Publish only the routable public edge; the VIPs remain internal origins.
    external-dns.alpha.kubernetes.io/target: 192.0.2.79
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: headlamp-https
  hostnames: [headlamp.re8ch.com]
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: headlamp
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-edge-origin
  namespace: qianwen-ops
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: panel-grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-public
  namespace: qianwen-ops
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: grafana-https
  hostnames: [grafana.re8ch.com]
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Re8ch-Gateway
                value: cilium
      backendRefs:
        - name: panel-grafana
          port: 3000
---
