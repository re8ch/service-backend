apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    networking.re8ch.com/lb-pool: service-vip
    networking.re8ch.com/bgp-advertise: enabled
  annotations:
    lbipam.cilium.io/ips: 192.0.2.235
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  externalTrafficPolicy: Cluster
  # Headlamp v0.42 runs single-active because OAuth state is process-local.
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30778
---
apiVersion: v1
kind: Service
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
    networking.re8ch.com/lb-pool: service-vip
    networking.re8ch.com/bgp-advertise: enabled
  annotations:
    lbipam.cilium.io/ips: 192.0.2.209
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/bgp-control-plane
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: panel-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: panel-grafana-vip-origin
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    networking.re8ch.com/origin: service-vip
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: panel-grafana-vip-origin-ipv4
  namespace: qianwen-ops
  labels:
    kubernetes.io/service-name: panel-grafana-vip-origin
    endpointslice.kubernetes.io/managed-by: re8ch-network-fabric
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 3000
endpoints:
  - addresses: [192.0.2.209]
    conditions: {ready: true}
