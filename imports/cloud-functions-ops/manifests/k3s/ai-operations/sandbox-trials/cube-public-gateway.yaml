apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-cube
  namespace: cube-trial
  labels:
    app.kubernetes.io/name: oauth2-proxy-cube
    app.kubernetes.io/part-of: cube-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-cube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-cube
        app.kubernetes.io/part-of: cube-sandbox
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0@sha256:37c1570c0427e02fc7c947ef2c04e8995b8347b7abc9fcf1dbb4e376a4b221a7
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://dex.re8ch.com
            - --redirect-url=https://cube.re8ch.com/oauth2/callback
            - --upstream=http://cube-trial-webui:12088
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --skip-provider-button=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-cube
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-cube
  namespace: cube-trial
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-cube
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cube-public
  namespace: cube-trial
  labels:
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/hostname: cube.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: re8ch-gateway-canary
      namespace: kube-system
      sectionName: http
  hostnames:
    - cube.re8ch.com
  rules:
    - backendRefs:
        - name: oauth2-proxy-cube
          port: 4180
