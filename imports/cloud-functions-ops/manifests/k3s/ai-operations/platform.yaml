---
apiVersion: v1
kind: Service
metadata: {name: cluster-infra-tool, namespace: ai-operations}
spec: {selector: {app: cluster-infra-tool}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: agent-orchestra-collab, namespace: ai-operations}
spec: {selector: {app: agent-orchestra-collab}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloud-platform-tool
  namespace: ai-operations
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tools.re8ch.com
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [tools.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /mcp}}]
      backendRefs: [{name: cloud-platform-tool, port: 80}]
    - matches: [{path: {type: Exact, value: /.well-known/oauth-protected-resource/mcp}}]
      backendRefs: [{name: cloud-platform-tool, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /cloud}}]
      backendRefs: [{name: cloud-platform-tool, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/cloud}}]
      backendRefs: [{name: cloud-platform-tool, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster-infra-tool
  namespace: ai-operations
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [tools.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /infra}}]
      backendRefs: [{name: cluster-infra-tool, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/infra}}]
      backendRefs: [{name: cluster-infra-tool, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-orchestra-collab
  namespace: ai-operations
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [tools.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /orchestra}}]
      backendRefs: [{name: agent-orchestra-collab, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/orchestra}}]
      backendRefs: [{name: agent-orchestra-collab, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: marketplace-installer
  namespace: ai-operations
  labels: {public.re8ch.com/external-dns: enabled}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  hostnames: [marketplace.re8ch.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /install}}]
      backendRefs: [{name: agent-orchestra-collab, port: 80}]
