apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: terminaldevices.workspace.re8ch.com}
spec:
  group: workspace.re8ch.com
  scope: Namespaced
  names: {plural: terminaldevices, singular: terminaldevice, kind: TerminalDevice, shortNames: [tdev]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [identityRef, providerRef, durableStateRef]
              properties:
                identityRef: {type: string}
                providerRef: {type: string}
                durableStateRef: {type: string}
                credentialRefs: {type: array, items: {type: string}}
                image: {type: string}
                memoryMiB: {type: integer, minimum: 512}
                region: {type: string}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Active, Standby, Recreating, Failed]}
                providerInstanceRef: {type: string}
                providerVolumeRef: {type: string}
                lastActivityAt: {type: string, format: date-time}
                observedGeneration: {type: integer, format: int64}
---
