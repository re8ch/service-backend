apiVersion: v1
kind: ServiceAccount
metadata:
  name: akash-lease-admission
  namespace: akash-services
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akash-lease-admission
  namespace: akash-services
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: akash-lease-admission}
  template:
    metadata:
      labels: {app.kubernetes.io/name: akash-lease-admission}
    spec:
      serviceAccountName: akash-lease-admission
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admission
          image: __AKASH_ADMISSION_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8443}]
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 5, periodSeconds: 10}
      volumes:
        - name: tls
          secret: {secretName: akash-lease-admission-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: akash-lease-admission
  namespace: akash-services
spec:
  selector: {app.kubernetes.io/name: akash-lease-admission}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: akash-lease-admission
webhooks:
  - name: lease-pods.akash.re8ch.com
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    namespaceSelector:
      matchLabels: {re8ch.com/akash-lease: "true"}
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
        scope: Namespaced
    clientConfig:
      caBundle: __AKASH_ADMISSION_CA_BUNDLE__
      service:
        namespace: akash-services
        name: akash-lease-admission
        path: /
        port: 443
