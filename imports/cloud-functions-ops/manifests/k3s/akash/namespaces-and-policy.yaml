apiVersion: v1
kind: Namespace
metadata:
  name: akash-services
  labels:
    akash.network: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: akash-gateway
  labels:
    akash.network: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: lease
  labels:
    akash.network: "true"
    re8ch.com/akash-lease: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: akash-sandbox-hard-cap
  namespace: lease
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.ephemeral-storage: 100Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    limits.ephemeral-storage: 100Gi
    pods: "10"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: akash-sandbox-container-limits
  namespace: lease
spec:
  limits:
    - type: Container
      max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 100Gi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-lease-default-deny
  namespace: lease
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-lease-dns
  namespace: lease
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akash-lease-from-gateway
  namespace: lease
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: akash-gateway
