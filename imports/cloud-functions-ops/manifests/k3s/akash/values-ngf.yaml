nginxGateway:
  gatewayClassName: nginx
  gwAPIExperimentalFeatures: {enable: true}
  leaderElection: {enable: true}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
  tolerations:
    - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
nginx:
  kind: deployment
  replicas: 1
  pod:
    nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
    tolerations:
      - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
  container:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
  service:
    type: NodePort
    externalTrafficPolicy: Local
    nodePorts:
      - {port: 30080, listenerPort: 80}
      - {port: 30443, listenerPort: 443}
      - {port: 31443, listenerPort: 8443}
      - {port: 31444, listenerPort: 8444}
certGenerator:
  nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
  tolerations:
    - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
