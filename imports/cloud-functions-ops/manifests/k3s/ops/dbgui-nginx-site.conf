server {
    listen 80;
    server_name dbgui.re8ch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://dbgui.re8ch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dbgui.re8ch.com;

    ssl_certificate     /etc/letsencrypt/live/dbgui.re8ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dbgui.re8ch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8978;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
