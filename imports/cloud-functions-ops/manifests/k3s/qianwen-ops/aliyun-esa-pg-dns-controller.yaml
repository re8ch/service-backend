apiVersion: v1
kind: ConfigMap
metadata:
  name: aliyun-esa-pg-dns-controller-config
  namespace: qianwen-ops
data:
  APPLY: "0"
  ESA_SITE_NAME: ynzs.com
  ESA_ENDPOINT: esa.cn-hangzhou.aliyuncs.com
  ESA_TTL: "1"
  ESA_PROXIED: "false"
  ESA_RW_PROXIED: "false"
  ESA_RO_SLOT_PROXIED: "false"
  ESA_RW_RECORD_NAMES: mgr-rw.jz.ynzs.com
  ESA_RO_SLOT_RECORD_NAMES: pg-2.ynzs.com pg-3.ynzs.com
  PG_EDGE_NODES: pg-meta-1,192.0.2.62,192.0.2.89 pg-meta-2,192.0.2.197,192.0.2.112 pg-meta-3,192.0.2.41,192.0.2.251
  PATRONI_PORT: "8008"
  READY_HOST: db.re8ch.com
  READY_PATH: /__lb/ready
  RUN_INTERVAL_SECONDS: "30"
  ALLOW_RO_FALLBACK_TO_PRIMARY: "0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aliyun-esa-pg-dns-controller-script
  namespace: qianwen-ops
data:
  aliyun_esa_pg_dns_controller.py: |
    #!/usr/bin/env python3
    import base64
    import hashlib
    import hmac
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import uuid

    VERSION = "2024-09-10"


    def env(name, default=""):
        return os.environ.get(name, default).strip()


    def required(name):
        value = env(name)
        if not value:
            raise SystemExit(f"missing {name}")
        return value


    def log(message):
        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        print(f"{ts} {message}", file=sys.stderr, flush=True)


    def percent(value):
        return urllib.parse.quote(str(value), safe="~")


    def http_request(method, url, headers=None, data=None, timeout=10, insecure=False, read_body=True):
        body = data.encode("utf-8") if isinstance(data, str) else data
        req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
        context = ssl._create_unverified_context() if insecure else None
        try:
            with urllib.request.urlopen(req, timeout=timeout, context=context) as resp:
                return resp.status, resp.read() if read_body else b""
        except urllib.error.HTTPError as exc:
            return exc.code, exc.read()
        except Exception:
            return 0, b""


    def esa_call(action, params=None, method="GET"):
        endpoint = env("ESA_ENDPOINT", "esa.cn-hangzhou.aliyuncs.com")
        query = dict(params or {})
        query.update({
            "Action": action,
            "Version": VERSION,
            "Format": "JSON",
            "AccessKeyId": required("ALIYUN_ACCESS_KEY_ID"),
            "SignatureMethod": "HMAC-SHA1",
            "SignatureNonce": str(uuid.uuid4()),
            "SignatureVersion": "1.0",
            "Timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        })
        canonical = "&".join(f"{percent(k)}={percent(query[k])}" for k in sorted(query))
        string_to_sign = f"{method}&%2F&{percent(canonical)}"
        digest = hmac.new(
            (required("ALIYUN_ACCESS_KEY_SECRET") + "&").encode("utf-8"),
            string_to_sign.encode("utf-8"),
            hashlib.sha1,
        ).digest()
        query["Signature"] = base64.b64encode(digest).decode("ascii")
        encoded = urllib.parse.urlencode(query)
        url = f"https://{endpoint}/"
        data = None
        if method == "GET":
            url = f"{url}?{encoded}"
        else:
            data = encoded.encode("utf-8")
        status, raw = http_request(
            method,
            url,
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            data=data,
            timeout=20,
        )
        if status < 200 or status >= 300:
            raise RuntimeError(f"esa {action} failed: http {status}: {raw.decode('utf-8', 'replace')}")
        payload = json.loads(raw.decode("utf-8"))
        if payload.get("Code"):
            raise RuntimeError(f"esa {action} failed: {payload}")
        return payload


    def site_id():
        configured = env("ESA_SITE_ID")
        if configured:
            return int(configured)
        name = required("ESA_SITE_NAME")
        payload = esa_call("ListSites", {"SiteName": name, "PageSize": 20})
        for site in payload.get("Sites", []):
            if site.get("SiteName") == name:
                return int(site["SiteId"])
        raise RuntimeError(f"site not found: {name}")


    def list_records(site_id_value, name):
        payload = esa_call("ListRecords", {
            "SiteId": site_id_value,
            "RecordName": name,
            "RecordMatchType": "exact",
            "PageSize": 100,
        })
        return payload.get("Records", [])


    def parse_names(raw):
        return [item.strip() for item in raw.replace(",", " ").split() if item.strip()]


    def parse_nodes(raw):
        nodes = []
        for item in raw.split():
            parts = item.split(",")
            if len(parts) != 3:
                raise ValueError(f"invalid PG_EDGE_NODES item: {item}")
            nodes.append({"name": parts[0], "public_ip": parts[1], "zt_ip": parts[2]})
        return nodes


    def patroni_role(zt_ip, port):
        for role in ("primary", "replica"):
            status, _ = http_request("GET", f"http://{zt_ip}:{port}/{role}", timeout=3)
            if status == 200:
                return role
        return "unknown"


    def public_ready(public_ip, host, path):
        headers = {"Host": host}
        status, _ = http_request(
            "HEAD",
            f"https://{public_ip}{path}",
            headers=headers,
            timeout=5,
            insecure=True,
            read_body=False,
        )
        return 200 <= status < 300


    def expand_slot_ips(ips, count):
        if not ips or count <= 0:
            return []
        return [ips[i % len(ips)] for i in range(count)]


    def sync_a_record(site_id_value, name, desired_ip, ttl, proxied, apply):
        if not desired_ip:
            log(f"skip {name}: empty desired IP")
            return

        records = list_records(site_id_value, name)
        changed = False
        kept = False
        for record in records:
            record_id = record["RecordId"]
            record_type = record.get("RecordType")
            source_type = record.get("RecordSourceType") or ""
            current_ip = (record.get("Data") or {}).get("Value")
            current_ttl = int(record.get("Ttl") or 1)
            current_proxied = bool(record.get("Proxied"))
            if record_type == "A/AAAA" and source_type == "":
                kept = True
                if current_ip != desired_ip or current_ttl != ttl or current_proxied != proxied:
                    log(f"patch A/AAAA {name} {current_ip} -> {desired_ip}")
                    changed = True
                    if apply:
                        esa_call("UpdateRecord", {
                            "RecordId": record_id,
                            "Type": "A/AAAA",
                            "Data": json.dumps({"Value": desired_ip}, separators=(",", ":")),
                            "Ttl": ttl,
                            "Proxied": "true" if proxied else "false",
                            "Comment": "managed-by=aliyun-esa-pg-dns-controller",
                        }, method="POST")
                continue
            log(f"delete incompatible {record_type} {name} -> {current_ip or source_type}")
            changed = True
            if apply:
                esa_call("DeleteRecord", {"RecordId": record_id}, method="POST")

        if not kept:
            log(f"create A/AAAA {name} -> {desired_ip}")
            changed = True
            if apply:
                esa_call("CreateRecord", {
                    "SiteId": site_id_value,
                    "RecordName": name,
                    "Type": "A/AAAA",
                    "Data": json.dumps({"Value": desired_ip}, separators=(",", ":")),
                    "Ttl": ttl,
                    "Proxied": "true" if proxied else "false",
                    "Comment": "managed-by=aliyun-esa-pg-dns-controller",
                }, method="POST")

        if not changed:
            log(f"{name} already in sync -> {desired_ip}")


    def run_once():
        apply = env("APPLY", "0") == "1"
        ttl = int(env("ESA_TTL", "1"))
        default_proxied = env("ESA_PROXIED", "false").lower() in ("1", "true", "yes", "on")
        rw_proxied = env("ESA_RW_PROXIED", str(default_proxied).lower()).lower() in ("1", "true", "yes", "on")
        ro_slot_proxied = env("ESA_RO_SLOT_PROXIED", str(default_proxied).lower()).lower() in ("1", "true", "yes", "on")
        patroni_port = env("PATRONI_PORT", "8008")
        ready_host = env("READY_HOST", "db.re8ch.com")
        ready_path = env("READY_PATH", "/__lb/ready")
        allow_ro_fallback = env("ALLOW_RO_FALLBACK_TO_PRIMARY", "0") == "1"
        rw_names = parse_names(env("ESA_RW_RECORD_NAMES", "mgr-rw.jz.ynzs.com"))
        ro_slot_names = parse_names(env("ESA_RO_SLOT_RECORD_NAMES", "pg-2.ynzs.com pg-3.ynzs.com"))
        nodes = parse_nodes(required("PG_EDGE_NODES"))

        current_site_id = site_id()
        ready_primary_ip = ""
        ro_ips = []
        log(
            "probe nodes; apply=%s; ttl=%s; rw_proxied=%s; ro_slot_proxied=%s; site_id=%s"
            % (int(apply), ttl, str(rw_proxied).lower(), str(ro_slot_proxied).lower(), current_site_id)
        )
        for node in nodes:
            role = patroni_role(node["zt_ip"], patroni_port)
            ready = public_ready(node["public_ip"], ready_host, ready_path)
            log(f"node={node['name']} public={node['public_ip']} zt={node['zt_ip']} role={role} ready={str(ready).lower()}")
            if role == "primary" and ready:
                ready_primary_ip = node["public_ip"]
            elif role == "replica" and ready:
                ro_ips.append(node["public_ip"])

        if ready_primary_ip:
            for name in rw_names:
                sync_a_record(current_site_id, name, ready_primary_ip, ttl, rw_proxied, apply)
        else:
            log(f"no ready primary; leaving RW records untouched: {','.join(rw_names)}")

        if not ro_ips and allow_ro_fallback and ready_primary_ip:
            log(f"no ready replicas; falling back RO slots to ready primary {ready_primary_ip}")
            ro_ips = [ready_primary_ip]
        if ro_ips and (len(ro_ips) >= len(ro_slot_names) or allow_ro_fallback):
            for name, ip in zip(ro_slot_names, expand_slot_ips(ro_ips, len(ro_slot_names))):
                sync_a_record(current_site_id, name, ip, ttl, ro_slot_proxied, apply)
        elif ro_ips:
            log(
                f"only {len(ro_ips)} ready replicas for {len(ro_slot_names)} RO slots; "
                f"leaving RO records untouched: {','.join(ro_slot_names)}"
            )
        else:
            log(f"no ready replicas; leaving RO records untouched: {','.join(ro_slot_names)}")


    def main():
        interval = int(env("RUN_INTERVAL_SECONDS", "0") or "0")
        if interval <= 0:
            run_once()
            return
        log(f"start loop interval={interval}s")
        while True:
            started = time.monotonic()
            try:
                run_once()
            except Exception as exc:
                log(f"controller iteration failed: {exc}")
            elapsed = time.monotonic() - started
            time.sleep(max(0, interval - elapsed))


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aliyun-esa-pg-dns-controller
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: aliyun-esa-pg-dns-controller
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aliyun-esa-pg-dns-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aliyun-esa-pg-dns-controller
    spec:
      nodeSelector:
        qianwen.cc/dns-controller: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /scripts/aliyun_esa_pg_dns_controller.py
          envFrom:
            - configMapRef:
                name: aliyun-esa-pg-dns-controller-config
            - secretRef:
                name: aliyun-esa-pg-dns-controller-secret
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: aliyun-esa-pg-dns-controller-script
            defaultMode: 0555
