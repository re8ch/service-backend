apiVersion: v1
kind: ServiceAccount
metadata:
  name: observable-collector
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: observable-collector
    app.kubernetes.io/part-of: re8ch-observable
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observable-collector-readonly
  labels:
    app.kubernetes.io/name: observable-collector
    app.kubernetes.io/part-of: re8ch-observable
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observable-collector-readonly
  labels:
    app.kubernetes.io/name: observable-collector
    app.kubernetes.io/part-of: re8ch-observable
subjects:
  - kind: ServiceAccount
    name: observable-collector
    namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observable-collector-readonly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observable-collector
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: observable-collector
    app.kubernetes.io/part-of: re8ch-observable
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observable-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observable-collector
        app.kubernetes.io/part-of: re8ch-observable
    spec:
      serviceAccountName: observable-collector
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: collector
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/observable_collector.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: OBSERVABLE_RPC_RW_BASE_URL
              value: https://db-rw.re8ch.com/observable
            - name: OBSERVABLE_RPC_RO_BASE_URL
              value: https://db-ro.re8ch.com/observable
            - name: OBSERVABLE_TENANT_CATALOG
              value: /etc/re8ch/tenant-catalog/tenants.yaml
            - name: OBSERVABLE_TENANT_ALIASES
              value: qwen=qianwen
            - name: OBSERVABLE_COLLECT_INTERVAL_SECONDS
              value: "60"
            - name: OBSERVABLE_REQUEST_TIMEOUT_SECONDS
              value: "12"
            - name: OBSERVABLE_SERVICE_ROLE
              value: observable_app_rw
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: observable-collector-secrets
                  key: PGRST_JWT_SECRET
            - name: PGRST_JWT_AUD
              value: https://db-rw.re8ch.com/observable
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: collector-code
              mountPath: /app
              readOnly: true
            - name: tenant-catalog
              mountPath: /etc/re8ch/tenant-catalog
              readOnly: true
      volumes:
        - name: collector-code
          configMap:
            name: observable-collector-code
            defaultMode: 0555
        - name: tenant-catalog
          configMap:
            name: tenant-catalog
            optional: true
