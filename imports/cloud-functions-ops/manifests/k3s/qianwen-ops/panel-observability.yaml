apiVersion: v1
kind: Service
metadata:
  name: panel-node-exporter
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-node-exporter
    app.kubernetes.io/part-of: panel-observability
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: panel-node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: panel-node-exporter
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-node-exporter
    app.kubernetes.io/part-of: panel-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-node-exporter
        app.kubernetes.io/part-of: panel-observability
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - artchais-nuclio-1
                      - qianwen-prod-nuclio-3
                      - qianwen-test-nuclio-2
                      - vm-20-12-ubuntu
                      - rancher-panel
                      - harbor-registry
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:19100
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.diskstats
            - --collector.filesystem
            - --collector.netdev
            - --collector.loadavg
            - --collector.uname
            - --collector.time
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            - name: metrics
              containerPort: 19100
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-victoria-metrics-data
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-victoria-metrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-victoria-metrics
        app.kubernetes.io/part-of: panel-observability
    spec:
      serviceAccountName: panel-victoria-metrics
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-metrics-data
            - -httpListenAddr=:8428
            - -retentionPeriod=7d
            - -promscrape.config=/etc/victoria-metrics/prometheus.yml
            - -promscrape.fileSDCheckInterval=5s
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/victoria-metrics
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
      volumes:
        - name: config
          configMap:
            name: panel-victoria-metrics-config
        - name: data
          persistentVolumeClaim:
            claimName: panel-victoria-metrics-data
---
