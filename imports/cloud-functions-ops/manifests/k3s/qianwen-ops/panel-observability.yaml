apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-victoria-metrics-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: victoria-self
        static_configs:
          - targets: ["127.0.0.1:8428"]
            labels:
              node: rancher-panel

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
            labels:
              node: rancher-panel
              source: k3s
              cls: k3s

      - job_name: k8s-coredns
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["192.0.2.240:9153"]
            labels:
              node: rancher-panel
              source: k3s
              cls: k3s

      - job_name: pigsty-infra-node-exporter
        static_configs:
          - labels:
              source: pigsty
              cls: pigsty-infra
            targets:
              - "192.0.2.192:9100"
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip

      - job_name: pigsty-pg-meta-node-exporter
        static_configs:
          - labels:
              source: pigsty
              cls: pg-meta
            targets:
              - "192.0.2.89:9100"
              - "192.0.2.112:9100"
              - "192.0.2.251:9100"
        relabel_configs:
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip

      - job_name: k3s-node-exporter
        scrape_interval: 60s
        scrape_timeout: 45s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: panel-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s

      - job_name: k8s-kubelet
        scrape_interval: 60s
        scrape_timeout: 20s
        scheme: https
        metrics_path: /metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: harbor-registry
            action: drop
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:10250
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s

      - job_name: k8s-cadvisor
        scrape_interval: 120s
        scrape_timeout: 25s
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: harbor-registry
            action: drop
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:10250
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_fs_.*|container_network_.*|machine_.*'
            action: keep
          - source_labels: [container]
            regex: ''
            action: drop

      - job_name: pigsty-infra-exporters
        scrape_interval: 30s
        scrape_timeout: 20s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-icp-infra-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: node
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pigsty-infra

      - job_name: pigsty-pgsql-exporters
        scrape_interval: 30s
        scrape_timeout: 20s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-pg-meta-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__address__]
            regex: ([^:]+):.*
            target_label: ip
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: ins
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pg
            target_label: job
            replacement: pgsql
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pgbouncer
            target_label: job
            replacement: pgbouncer
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-patroni
            target_label: job
            replacement: patroni
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-haproxy
            target_label: job
            replacement: haproxy
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-pgbackrest
            target_label: job
            replacement: pgbackrest
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pg-meta

      - job_name: http-probe
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - labels:
              tenant: platform
              layer: panel
              category: grafana
              service: portainer-grafana
              source: re8ch
              cls: http-probe
            targets:
              - https://portainer.re8ch.com/grafana/
          - labels:
              tenant: platform
              layer: network
              category: planet
              service: zt-planet
              source: re8ch
              cls: http-probe
            targets:
              - https://zt.re8ch.com/
          - labels:
              tenant: re8ch
              layer: public
              category: api
              service: api-root
              source: re8ch
              cls: http-probe
            targets:
              - https://api.re8ch.com/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: pigsty-icp-infra-exporters.qianwen-ops.svc.cluster.local:9115

      - job_name: pigsty-blackbox-probe
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - labels:
              source: pigsty
              cls: pg-meta
            targets:
              - 192.0.2.192
              - 192.0.2.89
              - 192.0.2.112
              - 192.0.2.251
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: pigsty-icp-infra-exporters.qianwen-ops.svc.cluster.local:9115
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
---
apiVersion: rbac.authorization.k8s.io/v1
