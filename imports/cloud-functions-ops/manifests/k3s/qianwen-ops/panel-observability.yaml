apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-victoria-metrics-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: victoria-self
        static_configs:
          - targets: ["127.0.0.1:8428"]
            labels:
              node: rancher-panel

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
            labels:
              node: rancher-panel

      - job_name: node-exporter
        static_configs:
          - labels:
              source: pigsty
              cls: pigsty
            targets:
              - "192.0.2.192:9100"
              - "192.0.2.89:9100"
              - "192.0.2.112:9100"
              - "192.0.2.251:9100"

      - job_name: k3s-node-exporter
        scrape_interval: 120s
        scrape_timeout: 45s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: panel-node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
          - target_label: source
            replacement: k3s
          - target_label: cls
            replacement: k3s

      - job_name: pigsty-infra-exporters
        scrape_interval: 30s
        scrape_timeout: 10s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-icp-infra-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: node
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pigsty-infra

      - job_name: pigsty-pgsql-exporters
        scrape_interval: 30s
        scrape_timeout: 10s
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qianwen-ops
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: pigsty-pg-meta-exporters
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-.+
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics-(.+)
            target_label: component
          - source_labels: [__meta_kubernetes_endpoint_hostname]
            target_label: ins
          - target_label: source
            replacement: pigsty
          - target_label: cls
            replacement: pg-meta

      - job_name: pigsty-blackbox-probe
        scrape_interval: 60s
        scrape_timeout: 10s
        metrics_path: /probe
        params:
          module: [icmp]
        static_configs:
          - labels:
              source: pigsty
              cls: pg-meta
            targets:
              - 192.0.2.192
              - 192.0.2.89
              - 192.0.2.112
              - 192.0.2.251
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: pigsty-icp-infra-exporters.qianwen-ops.svc.cluster.local:9115
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: panel-victoria-metrics-discovery
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: panel-victoria-metrics-discovery
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
subjects:
  - kind: ServiceAccount
    name: panel-victoria-metrics
    namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: panel-victoria-metrics-discovery
---
apiVersion: v1
