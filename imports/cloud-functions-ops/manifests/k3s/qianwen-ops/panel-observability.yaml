apiVersion: v1
kind: Service
metadata:
  name: panel-node-exporter
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-node-exporter
    app.kubernetes.io/part-of: panel-observability
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: panel-node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: panel-node-exporter
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-node-exporter
    app.kubernetes.io/part-of: panel-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-node-exporter
        app.kubernetes.io/part-of: panel-observability
    spec:
      hostPID: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - artchais-nuclio-1
                      - qianwen-prod-nuclio-3
                      - qianwen-test-nuclio-2
                      - rancher-panel
                      - harbor-registry
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.meminfo
            - --collector.diskstats
            - --collector.filesystem
            - --collector.netdev
            - --collector.loadavg
            - --collector.uname
            - --collector.time
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-victoria-metrics-data
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-victoria-metrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-victoria-metrics
        app.kubernetes.io/part-of: panel-observability
    spec:
      serviceAccountName: panel-victoria-metrics
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-metrics-data
            - -httpListenAddr=:8428
            - -retentionPeriod=7d
            - -promscrape.config=/etc/victoria-metrics/prometheus.yml
            - -promscrape.fileSDCheckInterval=5s
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/victoria-metrics
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
      volumes:
        - name: config
          configMap:
            name: panel-victoria-metrics-config
        - name: data
          persistentVolumeClaim:
            claimName: panel-victoria-metrics-data
---
apiVersion: v1
kind: Service
metadata:
  name: panel-victoria-metrics
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-victoria-metrics
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-grafana-datasources
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: ds-prometheus
        type: prometheus
        access: proxy
        url: http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428
        isDefault: true
        editable: true
      - name: Re8ch Loki
        uid: re8ch-loki
        type: loki
        access: proxy
        url: http://loki-lite.qianwen-ops.svc.cluster.local:3100
        isDefault: false
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-grafana-dashboard-providers
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Re8ch Observability
        orgId: 1
        folder: Re8ch Observability
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/qianwen
          foldersFromFilesStructure: false
      - name: Pigsty PGSQL
        orgId: 1
        folder: Pigsty PGSQL
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/pigsty
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-grafana-data
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-grafana
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SERVER_DOMAIN
              value: portainer.re8ch.com
            - name: GF_SERVER_ROOT_URL
              value: https://portainer.re8ch.com/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: panel-grafana-data
        - name: datasources
          configMap:
            name: panel-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: panel-grafana-dashboard-providers
---
apiVersion: v1
kind: Service
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
