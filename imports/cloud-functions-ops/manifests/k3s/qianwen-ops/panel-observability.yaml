      nodePort: 30428
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-qwen-functions-vmagent-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-qwen-functions-vmagent
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 2m
      scrape_timeout: 20s

    scrape_configs:
      - job_name: qwen-functions-vmagent-self
        metrics_path: /metrics
        static_configs:
          - targets: ["127.0.0.1:8429"]
            labels:
              tenant: qianwen
              layer: observability
              category: vmagent
              service: functions-vmagent
              source: re8ch
              cls: qwen-vmagent
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'vmagent_remotewrite_.*|vm_promscrape_.*|process_.*|go_.*'
            action: keep

      - job_name: k8s-nuclio-functions
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - qwen
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: qwen
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_class]
            regex: function
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            regex: __NODE_NAME__
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:8080
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            target_label: function
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: ([^-]+).*
            target_label: tenant
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-([^-]+).*'
            target_label: layer
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-[^-]+-([^-]+).*'
            target_label: category
            replacement: ${1}
          - source_labels: [__meta_kubernetes_pod_label_nuclio_io_function_name]
            regex: '[^-]+-(.*)'
            target_label: service
            replacement: ${1}
          - target_label: source
            replacement: re8ch
          - target_label: cls
            replacement: qwen-function-metrics
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 're8ch_cloud_function_.*|re8ch_generation_task_failures_total'
            action: keep
          - source_labels: [path_template]
            regex: '.*/\.env|.*phpinfo.*|.*phpversion.*|.*pinfo\.php|/cgi-bin.*|/onvif.*|/\.git.*|/\.ht.*|/HNAP1|/boaform.*|/vendor/phpunit.*|.*/wp-.*|.*/xmlrpc\.php|.*/wlwmanifest\.xml'
            action: drop
          - source_labels: [path]
            regex: '.*/\.env|.*phpinfo.*|.*phpversion.*|.*pinfo\.php|/cgi-bin.*|/onvif.*|/\.git.*|/\.ht.*|/HNAP1|/boaform.*|/vendor/phpunit.*|.*/wp-.*|.*/xmlrpc\.php|.*/wlwmanifest\.xml'
            action: drop
          - source_labels: [path_template, path]
            separator: ';'
            regex: ';(.+)'
            target_label: path_template
            replacement: ${1}
            action: replace
          - regex: 'path|status|exported_.*'
            action: labeldrop
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: panel-qwen-functions-vmagent
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-qwen-functions-vmagent
    app.kubernetes.io/part-of: panel-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-qwen-functions-vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-qwen-functions-vmagent
        app.kubernetes.io/part-of: panel-observability
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: panel-victoria-metrics
      nodeSelector:
        pigsty.cc/workload: nuclio
      tolerations:
        - operator: Exists
      initContainers:
        - name: render-config
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - sed "s/__NODE_NAME__/${NODE_NAME}/g" /template/prometheus.yml > /generated/prometheus.yml
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: generated-config
              mountPath: /generated
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -promscrape.config=/generated/prometheus.yml
            - -remoteWrite.url=http://192.0.2.192:30428/api/v1/write
            - -httpListenAddr=:8429
            - -promscrape.fileSDCheckInterval=30s
          ports:
            - name: http
              containerPort: 8429
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: generated-config
              mountPath: /generated
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: panel-qwen-functions-vmagent-config
        - name: generated-config
          emptyDir: {}
---
