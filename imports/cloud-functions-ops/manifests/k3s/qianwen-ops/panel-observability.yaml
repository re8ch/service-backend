apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-re8ch-vmalert
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-re8ch-vmalert
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-re8ch-vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-re8ch-vmalert
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/*.yml
            - -datasource.url=http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428
            - -remoteWrite.url=http://192.0.2.192:30428
            - -evaluationInterval=30s
            - -external.label=source=re8ch
            - -notifier.blackhole=true
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: panel-re8ch-vmalert-rules
---
