apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-qwen-nodeport-vmagent-config
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-qwen-nodeport-vmagent
    app.kubernetes.io/part-of: panel-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 1m
      scrape_timeout: 20s

    scrape_configs:
      - job_name: qwen-nodeport-vmagent-self
        metrics_path: /metrics
        static_configs:
          - targets: ["127.0.0.1:8429"]
            labels:
              tenant: qianwen
              layer: observability
              category: vmagent
              service: nodeport-vmagent
              source: re8ch
              cls: qwen-vmagent
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'vmagent_remotewrite_.*|vm_promscrape_.*|process_.*|go_.*'
            action: keep

      - job_name: k8s-nuclio-edge
        metrics_path: /metrics
        static_configs:
          - targets: ["127.0.0.1:30740"]
            labels:
              tenant: qianwen
              layer: agent
              category: api
              service: agent-api
              source: re8ch
              cls: qwen-nodeport-metrics
          - targets: ["127.0.0.1:31995"]
            labels:
              tenant: qianwen
              layer: mcp
              category: gateway
              service: mcp-gateway
              source: re8ch
              cls: qwen-nodeport-metrics
          - targets: ["127.0.0.1:31998"]
            labels:
              tenant: qianwen
              layer: prod
              category: api
              service: api-gateway
              source: re8ch
              cls: qwen-nodeport-metrics
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'api_edge_.*'
            action: keep
          - source_labels: [path_template]
            regex: '.*/\.env|.*phpinfo.*|.*phpversion.*|.*pinfo\.php|/cgi-bin.*|/onvif.*|/\.git.*|/\.ht.*|/HNAP1|/boaform.*|/vendor/phpunit.*|.*/wp-.*|.*/xmlrpc\.php|.*/wlwmanifest\.xml'
            action: drop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-qwen-nodeport-vmagent
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-qwen-nodeport-vmagent
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-qwen-nodeport-vmagent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-qwen-nodeport-vmagent
        app.kubernetes.io/part-of: panel-observability
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: vm-20-12-ubuntu
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.142.0
          imagePullPolicy: IfNotPresent
          args:
            - -promscrape.config=/etc/vmagent/prometheus.yml
            - -remoteWrite.url=http://192.0.2.192:30428/api/v1/write
            - -httpListenAddr=:8429
            - -promscrape.fileSDCheckInterval=30s
          ports:
            - name: http
              containerPort: 8429
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: panel-qwen-nodeport-vmagent-config
---
