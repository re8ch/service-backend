          tlsAuthWithCACert: false
        secureJsonData:
          password: ${PG_MONITOR_PASSWORD}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: panel-grafana-dashboard-providers
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Re8ch Observability
        orgId: 1
        folder: Re8ch Observability
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/qianwen
          foldersFromFilesStructure: false
      - name: Pigsty PGSQL
        orgId: 1
        folder: Pigsty PGSQL
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/pigsty
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-grafana-data
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-grafana
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SERVER_DOMAIN
              value: portainer.re8ch.com
            - name: GF_SERVER_ROOT_URL
              value: https://portainer.re8ch.com/grafana/
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_RENDERING_SERVER_URL
              value: http://panel-grafana-renderer.qianwen-ops.svc.cluster.local:8081/render
            - name: GF_RENDERING_CALLBACK_URL
              value: http://panel-grafana.qianwen-ops.svc.cluster.local:3000/grafana/
            - name: GF_RENDERING_RENDERER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panel-grafana-renderer-auth
                  key: token
            - name: GF_RENDERING_SERVER_TIMEOUT
              value: "60"
            - name: PG_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: panel-grafana-pg-monitor
                  key: password
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: panel-grafana-data
        - name: datasources
          configMap:
            name: panel-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: panel-grafana-dashboard-providers
---
apiVersion: v1
kind: Service
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-grafana-renderer
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana-renderer
    app.kubernetes.io/part-of: panel-observability
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-grafana-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-grafana-renderer
        app.kubernetes.io/part-of: panel-observability
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: panel
          effect: NoSchedule
      containers:
        - name: renderer
          image: grafana/grafana-image-renderer:latest@sha256:a30a68c2de11a1aad5733452536ac50fbc2f3958e6d0aa046ef9eb56db7c6a6d
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: panel-grafana-renderer-auth
                  key: token
            - name: TZ
              value: Asia/Shanghai
            - name: GOMEMLIMIT
              value: 512MiB
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /render/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /render/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: panel-grafana-renderer
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: panel-grafana-renderer
    app.kubernetes.io/part-of: panel-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: panel-grafana-renderer
  ports:
    - name: http
      port: 8081
      targetPort: http
