# Public TLS edge for services carried by the Cilium Gateway VIP 10.251.0.4.

server {
    listen 80;
    server_name registry.re8ch.com phonycenter.re8ch.com litellm.re8ch.com supabase.re8ch.com tools.re8ch.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tools.re8ch.com;

    ssl_certificate     /etc/nginx/ssl/re8ch-wildcard/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/re8ch-wildcard/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://192.0.2.213;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    server_name registry.re8ch.com;

    ssl_certificate     /etc/nginx/ssl/re8ch-wildcard/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/re8ch-wildcard/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass https://192.0.2.213;
        proxy_ssl_server_name on;
        proxy_ssl_name registry.re8ch.com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

