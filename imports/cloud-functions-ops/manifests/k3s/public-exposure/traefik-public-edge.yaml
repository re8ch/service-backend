apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik-public-edge
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: public-edge
    app.kubernetes.io/part-of: re8ch-public-ingress
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: public-edge
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: public-edge
        app.kubernetes.io/part-of: re8ch-public-ingress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "19102"
    spec:
      serviceAccountName: traefik
      automountServiceAccountToken: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # zan already has a host-level listener on 80/443. Keep it
                    # out of this DaemonSet until that listener is migrated.
                    values: [domain-ex, suxunji]
      containers:
        - name: traefik
          image: rancher/mirrored-library-traefik:3.6.13
          imagePullPolicy: IfNotPresent
          args:
            - --entryPoints.metrics.address=:19102/tcp
            - --entryPoints.traefik.address=:8080/tcp
            - --entryPoints.web.address=:80/tcp
            - --entryPoints.websecure.address=:443/tcp
            - --entryPoints.websecure.http.tls=true
            - --api.dashboard=true
            - --ping=true
            - --metrics.prometheus=true
            - --metrics.prometheus.entrypoint=metrics
            - --providers.kubernetescrd
            - --providers.kubernetescrd.allowEmptyServices=true
            - --providers.kubernetesingress
            - --providers.kubernetesingress.allowEmptyServices=true
            - --providers.kubernetesingress.ingressendpoint.publishedservice=kube-system/traefik
            - --log.level=INFO
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: USER
              value: traefik
          ports:
            - {name: metrics, containerPort: 19102, hostPort: 19102, protocol: TCP}
            - {name: traefik, containerPort: 8080, protocol: TCP}
            - {name: web, containerPort: 80, hostPort: 80, protocol: TCP}
            - {name: websecure, containerPort: 443, hostPort: 443, protocol: TCP}
          livenessProbe:
            httpGet: {host: 127.0.0.1, path: /ping, port: 8080, scheme: HTTP}
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {host: 127.0.0.1, path: /ping, port: 8080, scheme: HTTP}
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      securityContext:
        runAsUser: 0
        runAsGroup: 65532
        runAsNonRoot: false
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
