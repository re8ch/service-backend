apiVersion: v1
kind: Service
metadata:
  name: external-dns-placeholder
  namespace: qianwen-ops
spec:
  ports:
    - name: dns-only
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-panel-services-dns
  namespace: qianwen-ops
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: portainer.re8ch.com,hubble.re8ch.com,cost.re8ch.com,bgp.re8ch.com,dbgui.re8ch.com,fleet.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.192
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: portainer.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: external-dns-placeholder, port: {name: dns-only}}
---
