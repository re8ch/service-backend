apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns-cloudflare
  namespace: qianwen-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-cloudflare
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-cloudflare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-cloudflare
subjects:
  - kind: ServiceAccount
    name: external-dns-cloudflare
    namespace: qianwen-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-cloudflare
  namespace: qianwen-ops
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: cloudflare-re8ch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: cloudflare-re8ch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/instance: cloudflare-re8ch
    spec:
      serviceAccountName: external-dns-cloudflare
      nodeSelector:
        kubernetes.io/hostname: overseas-edge-50
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=ingress
            - --provider=cloudflare
            - --domain-filter=re8ch.com
            - --label-filter=public.re8ch.com/external-dns=enabled
            - --policy=upsert-only
            # This is the only label-scoped writer for these records. Avoid the
            # TXT registry because it doubles record usage and makes Cloudflare
            # replacements fail at the zone quota boundary.
            - --registry=noop
            - --interval=5m
            - --events
            - --log-format=json
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-pg-dns-controller-secret
                  key: CF_API_TOKEN
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
