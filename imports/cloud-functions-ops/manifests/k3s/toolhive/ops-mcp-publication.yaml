apiVersion: v1
kind: Namespace
metadata:
  name: toolhive-system
  labels:
    re8ch.com/domain: tool-control
    re8ch.com/plane: control
    re8ch.com/access-policy: toolhive-v1
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: observe-workload-identity
  namespace: toolhive-system
spec:
  type: kubernetesServiceAccount
  kubernetesServiceAccount:
    issuer: https://kubernetes.default.svc.cluster.local
    namespace: kagent
    serviceAccount: readonly-k8s-diagnostic-agent
    useClusterAuth: true
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: operate-workload-identity
  namespace: toolhive-system
spec:
  type: kubernetesServiceAccount
  kubernetesServiceAccount:
    issuer: https://kubernetes.default.svc.cluster.local
    namespace: kagent
    serviceAccount: my-first-k8s-agent
    useClusterAuth: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-admin-agent
  namespace: toolhive-system
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: admin-workload-identity
  namespace: toolhive-system
spec:
  type: kubernetesServiceAccount
  kubernetesServiceAccount:
    issuer: https://kubernetes.default.svc.cluster.local
    namespace: toolhive-system
    serviceAccount: platform-admin-agent
    useClusterAuth: true
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: platform-observe
  namespace: toolhive-system
spec:
  description: Read-only platform inventory, health, metrics and registry metadata.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: platform-operate
  namespace: toolhive-system
spec:
  description: Bounded tenant operations; never publishes raw credentials or generic API proxies.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: platform-admin
  namespace: toolhive-system
spec:
  description: Privileged platform provisioning tools for approval-gated admin agents.
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-observe-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - get_usage_guide
    - get_tenant_context
    - list_k8s_resources
    - get_registry_info
    - get_tenant_resource_catalog
    - get_grafana_links
    - get_tenant_metrics_summary
    - get_platform_service_health
    - get_platform_service_catalog
    - get_platform_permission_coverage
    - get_platform_access_posture
    - get_managed_platform_operation_status
    - get_nuclio_function_status
    - diagnose_nuclio_function
    - get_nuclio_capacity_status
    - get_litellm_gateway_status
    - get_fleet_control_status
    - get_supabase_platform_status
    - get_neo4j_platform_status
    - get_identity_platform_status
    - get_agent_runtime_status
    - get_observability_platform_status
    - get_artifact_platform_status
    - get_database_routing_status
    - get_external_publication_readiness
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-operate-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - get_managed_platform_operation_status
    - restart_managed_platform_deployment
    - scale_managed_platform_deployment
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-admin-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - list_authentik_users
    - ensure_authentik_user
    - grant_authentik_user_group
    - get_tenancy_admin_workflow
    - generate_pg_tenant_database_plan
    - ensure_tenant_database_secrets
    - ensure_tenant_database_bundle
    - ensure_tenant_access
    - ensure_harbor_tenant
    - set_tool_publication_stage
    - get_tenant_secret_refs
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: platform-tools-telemetry
  namespace: toolhive-system
spec:
  openTelemetry:
    enabled: true
    endpoint: http://trial-gateway-collector.observability-ai.svc.cluster.local:4318
    insecure: true
    tracing:
      enabled: true
      samplingRate: "1.0"
    metrics:
      enabled: true
    resourceAttributes:
      deployment.environment: production
      service.namespace: toolhive-system
      re8ch.plane: tool-control
  prometheus:
    enabled: true
