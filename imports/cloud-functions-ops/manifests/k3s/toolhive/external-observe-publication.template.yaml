# SAFETY TEMPLATE — this file intentionally contains no Kubernetes objects.
# Do not uncomment or apply it until every gate below passes. The public
# surface must be a separate MCPServer; never replace the internal Kubernetes
# service-account authentication on ops-observe-managed.
#
# PUBLICATION GATES
# - tools.re8ch.com and auth.re8ch.com route to the intended public gateway.
# - Both names present a publicly trusted, complete TLS certificate chain.
# - GET https://tools.re8ch.com/.well-known/oauth-protected-resource returns
#   RFC 9728 metadata whose resource is exactly https://tools.re8ch.com/mcp.
# - Authentik exposes OAuth/OIDC metadata, authorization code + PKCE S256, and
#   echoes resource=https://tools.re8ch.com/mcp into the issued token audience.
# - The production callback shown by the plugin portal is registered. The
#   current ChatGPT/Codex production form is
#   https://chatgpt.com/connector/oauth/{callback_id}; do not guess callback_id.
# - CIMD is preferred. If DCR or a predefined confidential client is used,
#   its registration/Secret is provisioned from the Secret manager.
# - The public server uses a dedicated public-read MCPToolConfig. It must not
#   reuse ops-observe-tools because that surface intentionally exposes internal
#   namespace, workload, route, and control-plane topology.
# - Every public tool advertises oauth2 securitySchemes/scopes plus accurate
#   readOnlyHint, openWorldHint and destructiveHint annotations.
# - GET https://tools.re8ch.com/mcp without a token returns 401 plus a
#   WWW-Authenticate challenge referencing the protected-resource metadata.
# - Domain control is proven at /.well-known/openai-apps-challenge when the
#   plugin portal issues a verification token.
# - Five positive and three negative publication tests pass.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: external-observe-oauth-client
#   namespace: toolhive-system
# type: Opaque
# stringData:
#   client-secret: REPLACE_FROM_SECRET_MANAGER
# ---
# apiVersion: toolhive.stacklok.dev/v1beta1
# kind: MCPOIDCConfig
# metadata:
#   name: external-observe-oidc
#   namespace: toolhive-system
# spec:
#   type: inline
#   inline:
#     issuer: https://auth.re8ch.com/application/o/REPLACE_SLUG/
#     clientId: REPLACE_CLIENT_ID
#     clientSecretRef:
#       name: external-observe-oauth-client
#       key: client-secret
# ---
# Create a dedicated public-read MCPToolConfig before this server. Candidate
# tools must return tenant-scoped or deliberately public information only;
# cluster-wide catalog, access posture, internal routes, workload names and
# admin/operate tools are excluded. User-to-tenant mapping must be enforced from
# verified token claims before any tenant-specific tool is admitted.
#
# The separate external MCPServer may reuse reviewed code, but must use its own
# environment, audience, tool filter and telemetry service name. Copying the
# internal object is not automated until issuer, claims mapping, callback,
# public gateway and per-tool security metadata exist.
# apiVersion: toolhive.stacklok.dev/v1beta1
# kind: MCPServer
# metadata:
#   name: ops-observe-external
#   namespace: toolhive-system
#   labels:
#     re8ch.com/risk: read-only
#     re8ch.com/publication-stage: canary
# spec:
#   groupRef: {name: platform-observe}
#   toolConfigRef: {name: ops-public-read-tools}
#   telemetryConfigRef:
#     name: platform-tools-telemetry
#     serviceName: re8ch-ops-observe-external
#   audit: {enabled: true}
#   oidcConfigRef:
#     name: external-observe-oidc
#     audience: https://tools.re8ch.com/mcp
#     resourceUrl: https://tools.re8ch.com/mcp
#     scopes: [openid, profile, email, platform:read]
#
# Add a public Ingress only after the separate MCPServer is Ready. Run
# verify-external-publication-readiness.sh and then confirm unauthenticated,
# wrong-audience, wrong-scope and cross-tenant tests return 401/403.
