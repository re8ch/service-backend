apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-mcp-public
  namespace: toolhive-system
  labels:
    re8ch.com/risk: public-read
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: external-observe-oidc
  namespace: toolhive-system
spec:
  type: inline
  inline:
    issuer: https://auth.re8ch.com/application/o/toolhive-external/
    clientId: re8ch-toolhive-external
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-public-read-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - get_public_tool_service_info
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ops-observe-external
  namespace: toolhive-system
  labels:
    re8ch.com/risk: public-read
    re8ch.com/publication-stage: canary
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: RE8CH External Tools
    toolhive.stacklok.dev/registry-description: OAuth-protected public read-only RE8CH tools.
    toolhive.stacklok.dev/registry-category: operations,read-only,external,oauth
    toolhive.stacklok.dev/registry-url: https://tools.re8ch.com/mcp
spec:
  groupRef: {name: platform-observe}
  image: mjhsdd6xkcym4k.xuanyuan.run/library/python:3.12-alpine
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: ops-mcp-public
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: TRUST_LOOPBACK_PROXY, value: "true"}
    - {name: TRUST_PROXY_CIDRS, value: "192.0.2.57/16"}
    - {name: OPS_TOOL_PROFILE, value: public}
  toolConfigRef: {name: ops-public-read-tools}
  telemetryConfigRef:
    name: platform-tools-telemetry
    serviceName: re8ch-ops-observe-external
  audit: {enabled: true}
  oidcConfigRef:
    name: external-observe-oidc
    audience: https://tools.re8ch.com/mcp
    resourceUrl: https://tools.re8ch.com/mcp
    scopes: [openid, profile, email, "platform:read"]
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  podTemplateSpec:
    spec:
      nodeSelector: {kubernetes.io/hostname: rancher-panel}
      tolerations:
        - {key: dedicated, operator: Equal, value: panel, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          command: [python, /app/app.py]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app-code, mountPath: /app, readOnly: true}
      volumes:
        - name: app-code
          configMap: {name: ops-mcp-server-code}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tools-portal-content
  namespace: toolhive-system
data:
  index.html: |
    <!doctype html>
    <html lang="zh-CN">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>RE8CH External Tools</title>
        <style>
          body{margin:0;background:#0b1020;color:#e8ecf4;font:16px/1.6 system-ui,sans-serif}
          main{max-width:760px;margin:8vh auto;padding:32px}
          section{background:#151c31;border:1px solid #2a3557;border-radius:16px;padding:28px}
          h1{margin-top:0}code{background:#090d18;padding:3px 7px;border-radius:6px}
          a{color:#8fc7ff}.ok{color:#75e6a4}.muted{color:#a8b2ca}
        </style>
      </head>
      <body><main><section>
        <h1>RE8CH External Tools</h1>
        <p class="ok">ToolHive public-read canary is online.</p>
        <p>身份登录与工具运行已解耦。Authentik 管理用户与 OAuth 授权；Agent 通过独立 MCP 资源访问工具。</p>
        <p>MCP URL：<code>https://tools.re8ch.com/mcp</code></p>
        <p>Scope：<code>platform:read</code></p>
        <p><a href="https://auth.re8ch.com/if/user/">账号与授权管理</a> · <a href="/.well-known/oauth-protected-resource">OAuth resource metadata</a></p>
        <p class="muted">请在 Codex、ChatGPT Connector、Claude Code 或其他 MCP 客户端中添加 MCP URL；不要用浏览器直接打开协议端点。</p>
      </section></main></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tools-portal
  namespace: toolhive-system
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: tools-portal}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tools-portal}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: portal
          image: python:3.12-alpine
          command: [python, -m, http.server, "8080", --directory, /portal]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: content, mountPath: /portal/index.html, subPath: index.html, readOnly: true}
      volumes:
        - name: content
          configMap: {name: tools-portal-content}
---
apiVersion: v1
kind: Service
metadata:
  name: tools-portal
  namespace: toolhive-system
spec:
  selector: {app.kubernetes.io/name: tools-portal}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tools-re8ch-com
  namespace: toolhive-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-ops-observe-external-proxy
                port: {number: 8080}
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: mcp-ops-observe-external-proxy
                port: {number: 8080}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tools-portal-strip-prefix
  namespace: toolhive-system
spec:
  stripPrefix:
    prefixes: [/portal]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tools-portal
  namespace: toolhive-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: toolhive-system-tools-portal-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: tools-portal
                port: {number: 80}
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: tools-portal
                port: {number: 80}
