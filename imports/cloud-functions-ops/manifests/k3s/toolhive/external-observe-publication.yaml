apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-mcp-public
  namespace: toolhive-system
  labels:
    re8ch.com/risk: public-read
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: external-observe-oidc
  namespace: toolhive-system
spec:
  type: inline
  inline:
    issuer: https://auth.re8ch.com/application/o/toolhive-external/
    clientId: re8ch-toolhive-external
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: ops-public-read-tools
  namespace: toolhive-system
spec:
  toolsFilter:
    - get_public_tool_service_info
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: ops-observe-external
  namespace: toolhive-system
  labels:
    re8ch.com/risk: public-read
    re8ch.com/publication-stage: canary
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: RE8CH External Tools
    toolhive.stacklok.dev/registry-description: OAuth-protected public read-only RE8CH tools.
    toolhive.stacklok.dev/registry-category: operations,read-only,external,oauth
    toolhive.stacklok.dev/registry-url: https://tools.re8ch.com/mcp
spec:
  groupRef: {name: platform-observe}
  image: mjhsdd6xkcym4k.xuanyuan.run/library/python:3.12-alpine
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: ops-mcp-public
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: TRUST_LOOPBACK_PROXY, value: "true"}
    - {name: TRUST_PROXY_CIDRS, value: "192.0.2.224/16"}
    - {name: OPS_TOOL_PROFILE, value: public}
  toolConfigRef: {name: ops-public-read-tools}
  telemetryConfigRef:
    name: platform-tools-telemetry
    serviceName: re8ch-ops-observe-external
  audit: {enabled: true}
  oidcConfigRef:
    name: external-observe-oidc
    audience: https://tools.re8ch.com/mcp
    resourceUrl: https://tools.re8ch.com/mcp
    scopes: [openid, profile, email, "platform:read"]
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  podTemplateSpec:
    spec:
      nodeSelector: {kubernetes.io/hostname: rancher-panel}
      tolerations:
        - {key: dedicated, operator: Equal, value: panel, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          command: [python, /app/app.py]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app-code, mountPath: /app, readOnly: true}
      volumes:
        - name: app-code
          configMap: {name: ops-mcp-server-code}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
  labels:
    app.kubernetes.io/name: toolhive-cloud-ui
    app.kubernetes.io/part-of: toolhive
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: toolhive-cloud-ui}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toolhive-cloud-ui
        app.kubernetes.io/part-of: toolhive
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: cloud-ui
          image: ghcr.io/stacklok/toolhive-cloud-ui:v0.6.2
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: OIDC_ISSUER_URL, value: "https://auth.re8ch.com/application/o/toolhive-cloud-ui"}
            - {name: OIDC_CLIENT_ID, value: re8ch-toolhive-cloud-ui}
            - {name: BETTER_AUTH_URL, value: "https://tools.re8ch.com"}
            - {name: TRUSTED_ORIGINS, value: "https://tools.re8ch.com"}
            - {name: API_BASE_URL, value: "http://toolhive-registry-server.toolhive-system.svc.cluster.local:8080"}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: toolhive-cloud-ui-auth, key: oidc-client-secret}}}
            - {name: BETTER_AUTH_SECRET, valueFrom: {secretKeyRef: {name: toolhive-cloud-ui-auth, key: better-auth-secret}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10, failureThreshold: 3}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
spec:
  selector: {app.kubernetes.io/name: toolhive-cloud-ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tools-re8ch-com
  namespace: toolhive-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-ops-observe-external-proxy
                port: {number: 8080}
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: mcp-ops-observe-external-proxy
                port: {number: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toolhive-cloud-ui
  namespace: toolhive-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tools.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toolhive-cloud-ui
                port: {number: 80}
