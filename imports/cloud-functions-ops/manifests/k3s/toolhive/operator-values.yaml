operator:
  replicaCount: 1
  features:
    experimental: false
    storageVersionMigrator: false
  image: ghcr.io/stacklok/toolhive/operator:v0.41.0
  toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner:v0.41.0
  vmcpImage: ghcr.io/stacklok/toolhive/vmcp:v0.41.0
  env:
    - name: TOOLHIVE_SKIP_UPDATE_CHECK
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  rbac:
    scope: namespace
    allowedNamespaces:
      - toolhive-system
  serviceAccount:
    create: true
    name: toolhive-operator
  nodeSelector:
    kubernetes.io/hostname: restricted-node-6dc3f140f9
