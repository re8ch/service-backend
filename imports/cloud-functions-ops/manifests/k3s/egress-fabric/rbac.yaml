apiVersion: v1
kind: ServiceAccount
metadata:
  name: path-controller
  namespace: egress-fabric
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: path-controller
  namespace: egress-fabric
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: path-controller
  namespace: egress-fabric
subjects:
  - kind: ServiceAccount
    name: path-controller
    namespace: egress-fabric
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: path-controller
