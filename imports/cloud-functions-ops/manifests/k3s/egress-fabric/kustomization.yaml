apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - config.yaml
  - workloads.yaml
  - network-policy.yaml
  - mobile-policy-api.yaml
configMapGenerator:
  - name: route-path-controller-code
    namespace: egress-fabric
    files:
      - path-controller.py=controller/path_controller.py
  - name: re8ch-geodb-snapshot
    namespace: egress-fabric
    files:
      - geodb.json.gz=geodb/geodb.json.gz
generatorOptions:
  disableNameSuffixHash: true
