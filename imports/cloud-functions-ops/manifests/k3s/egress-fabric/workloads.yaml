apiVersion: apps/v1
kind: Deployment
metadata:
  name: mihomo-egress-la
  namespace: egress-fabric
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mihomo-egress, app.kubernetes.io/instance: la}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mihomo-egress, app.kubernetes.io/instance: la}
    spec:
      nodeSelector: {kubernetes.io/hostname: overseas-edge-50}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - {name: ndots, value: "1"}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mihomo
          image: metacubex/mihomo:v1.19.29
          args: [-d, /etc/mihomo]
          ports:
            - {name: socks, containerPort: 1080, protocol: TCP}
          readinessProbe: {tcpSocket: {port: socks}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: socks}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 800m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /etc/mihomo}
            - {name: config, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mihomo-la-config}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-egress-la
  namespace: egress-fabric
spec:
  selector: {app.kubernetes.io/name: mihomo-egress, app.kubernetes.io/instance: la}
  ports:
    - {name: socks, port: 1080, targetPort: socks, protocol: TCP}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mihomo-node
  namespace: egress-fabric
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app.kubernetes.io/name: mihomo-node}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mihomo-node}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Enable only after the pinned image is present on the node.
                  - key: networking.re8ch.com/mihomo-node
                    operator: In
                    values: [enabled]
      containers:
        - name: mihomo
          image: metacubex/mihomo:v1.19.29
          args: [-d, /etc/mihomo]
          ports:
            - {name: mixed, containerPort: 7890, protocol: TCP}
            - {name: controller, containerPort: 9090, protocol: TCP}
          startupProbe:
            httpGet: {path: /version, port: controller}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /version, port: controller}, periodSeconds: 15}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: work, mountPath: /etc/mihomo}
            - {name: config, mountPath: /etc/mihomo/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: paths, mountPath: /etc/mihomo/paths.yaml, subPath: paths.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: mihomo-node-config}
        - name: paths
          secret: {secretName: egress-fabric-paths}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mihomo-node
  namespace: egress-fabric
spec:
  internalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: mihomo-node}
  ports:
    - {name: mixed, port: 7890, targetPort: mixed, protocol: TCP}
---
# Bootstrap path for nodes that do not yet have a local Mihomo image.
apiVersion: v1
kind: Service
metadata:
  name: mihomo-gateway
  namespace: egress-fabric
spec:
  selector: {app.kubernetes.io/name: mihomo-node}
  ports:
    - {name: mixed, port: 7890, targetPort: mixed, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: path-controller
  namespace: egress-fabric
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: path-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: path-controller}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: path-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: python:3.13-alpine
          command: [python, /opt/re8ch/path-controller.py]
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            # Empty means all clients are shadow-only. Set exactly two IDs for
            # the first CN/overseas canary after evidence collection is ready.
            - {name: CANARY_CLIENT_IDS, value: ""}
            - {name: GEODB_PATH, value: /etc/re8ch-geodb/geodb.json.gz}
            - {name: GEODB_SHA256, value: 2187d580ae7ece4c1c399e0723ed2adbf29f666a5d1a013d6746fb8cf9943ff5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: code, mountPath: /opt/re8ch, readOnly: true}
            - {name: geodb, mountPath: /etc/re8ch-geodb, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
      volumes:
        - name: code
          configMap: {name: route-path-controller-code, defaultMode: 0555}
        - name: geodb
          configMap: {name: re8ch-geodb-snapshot}
---
apiVersion: v1
kind: Service
metadata:
  name: path-controller
  namespace: egress-fabric
spec:
  selector: {app.kubernetes.io/name: path-controller}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
