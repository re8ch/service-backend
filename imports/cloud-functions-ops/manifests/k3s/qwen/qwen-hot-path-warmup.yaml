apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen-hot-path-warmup
  namespace: qwen
  labels:
    app.kubernetes.io/name: qwen-hot-path-warmup
    app.kubernetes.io/component: warmup
    app.kubernetes.io/part-of: qwen
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 30
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen-hot-path-warmup
            app.kubernetes.io/component: warmup
            app.kubernetes.io/part-of: qwen
        spec:
          restartPolicy: Never
          nodeSelector:
            pigsty.cc/workload: nuclio
          containers:
            - name: warmup
              image: appropriate/curl:latest
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  origins="${QW_WARMUP_API_ORIGINS:-192.0.2.122 192.0.2.183}"
                  api_host="${QW_WARMUP_API_HOST:-api.jz.ynzs.com}"
                  payload='{"configId":117}'
                  status_task_id="${QW_WARMUP_STATUS_TASK_ID:-f4f62507-6e69-47d6-8e9b-b24b2a0b2f77}"

                  warm() {
                    method="$1"
                    ip="$2"
                    path="$3"
                    data="${4:-}"
                    if [ -n "${data}" ]; then
                      curl -sS --connect-timeout 5 --max-time 12 \
                        --resolve "${api_host}:443:${ip}" \
                        -X "${method}" \
                        -H 'Content-Type: application/json' \
                        -H 'Origin: https://jz.ynzs.com' \
                        -d "${data}" \
                        "https://${api_host}${path}" >/dev/null || echo "warm_failed ${ip} ${method} ${path}" >&2
                    else
                      curl -sS --connect-timeout 5 --max-time 10 \
                        --resolve "${api_host}:443:${ip}" \
                        -X "${method}" \
                        -H 'Origin: https://jz.ynzs.com' \
                        -H 'Access-Control-Request-Method: POST' \
                        -H 'Access-Control-Request-Headers: content-type,authorization,x-trace-id' \
                        "https://${api_host}${path}" >/dev/null || echo "warm_failed ${ip} ${method} ${path}" >&2
                    fi
                  }

                  for ip in ${origins}; do
                    for _ in 1 2 3; do
                      warm POST "${ip}" /other/playgroundVideoMeta "${payload}"
                      warm OPTIONS "${ip}" /other/playgroundVideoMeta
                      warm OPTIONS "${ip}" /other/playgroundVideo
                      warm POST "${ip}" /other/playgroundVideo '{}'
                      warm OPTIONS "${ip}" /other/playgroundImage
                      warm POST "${ip}" /other/playgroundImage '{}'
                      if [ -n "${status_task_id}" ]; then
                        warm POST "${ip}" /other/playgroundImage "{\"action\":\"status\",\"taskId\":\"${status_task_id}\"}"
                      fi
                      warm OPTIONS "${ip}" /other/playgroundText
                      warm POST "${ip}" /other/playgroundText '{}'
                      warm OPTIONS "${ip}" /other/ossSts
                      warm POST "${ip}" /other/ossSts '{}'
                      warm OPTIONS "${ip}" /client-events
                      warm POST "${ip}" /client-events '{"events":[]}'
                      warm OPTIONS "${ip}" /tasks/get
                      warm OPTIONS "${ip}" /tasks/list
                      warm POST "${ip}" /tasks/get '{}'
                      warm POST "${ip}" /tasks/list '{}'
                    done
                    warm GET "${ip}" /_region
                  done
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
