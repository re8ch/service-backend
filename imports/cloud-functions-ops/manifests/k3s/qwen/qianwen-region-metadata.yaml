apiVersion: v1
kind: ConfigMap
metadata:
  name: qianwen-region-metadata-nginx
  namespace: qwen
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /_region {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Length, Content-Type, X-Requested-With, X-Trace-Id, X-Client-Trace-Id, X-Request-Id, X-Error-Id, X-Client-Region, X-Preferred-Api, X-Region-Cache-Version, X-Client-Event-Id, X-Client-Interaction-Id, X-Client-Interaction-Name, X-Client-Visitor-Id, X-Client-Visitor-Token, X-Visitor-Id, X-Visitor-Token, X-PostHog-Distinct-Id, X-PostHog-Session-Id, X-PostHog-Window-Id, X-PostHog-Replay-Id, X-PostHog-Person-Properties, X-PostHog-Groups, X-PostHog-Group-Properties, X-Qianwen-Visitor-Id, X-Qianwen-Visitor-Token, X-Qianwen-Trace-Id" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header Cache-Control "no-store" always;

        if ($request_method = OPTIONS) {
          return 204;
        }

        default_type application/json;
        return 200 '{"clientRegion":"global","preferredApi":"https://api.jz.ynzs.com","preferredApiName":"api-jz","readApi":"https://api.jz.ynzs.com","writeApi":"https://api.jz.ynzs.com","fallbackApis":["https://api-shanghai217.re8ch.com"],"reason":"static_native_gateway_primary","routeSource":"qwen_region_metadata","selectedRegion":"global","ttlSeconds":60,"version":2}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qianwen-region-metadata
  namespace: qwen
  labels:
    app.kubernetes.io/name: qianwen-region-metadata
    saas.re8ch.com/tenant: qianwen
    saas.re8ch.com/layer: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: qianwen-region-metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qianwen-region-metadata
        saas.re8ch.com/tenant: qianwen
        saas.re8ch.com/layer: prod
    spec:
      nodeSelector:
        pigsty.cc/workload: nuclio
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: qianwen-region-metadata
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /_region
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: qianwen-region-metadata-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: qianwen-region-metadata
  namespace: qwen
  labels:
    app.kubernetes.io/name: qianwen-region-metadata
    saas.re8ch.com/tenant: qianwen
    saas.re8ch.com/layer: prod
spec:
  selector:
    app.kubernetes.io/name: qianwen-region-metadata
  ports:
    - name: http
      port: 8080
      targetPort: http
