---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qwen-image-prepull
  namespace: qwen
  labels:
    app.kubernetes.io/name: qwen-image-prepull
    app.kubernetes.io/component: image-prepull
    app.kubernetes.io/part-of: qwen
    re8ch.com/tenant: qwen
spec:
  schedule: "17 4 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      completions: 3
      parallelism: 3
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qwen-image-prepull
            app.kubernetes.io/component: image-prepull
            app.kubernetes.io/part-of: qwen
            re8ch.com/tenant: qwen
        spec:
          restartPolicy: Never
          nodeSelector:
            pigsty.cc/workload: nuclio
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: qwen-image-prepull
                  matchLabelKeys:
                    - batch.kubernetes.io/job-name
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: prepull
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  ln -sf /host/usr/local/bin/k3s /tmp/crictl
                  cat > /tmp/crictl.yaml <<'CFG'
                  runtime-endpoint: unix:///host/run/k3s/containerd/containerd.sock
                  image-endpoint: unix:///host/run/k3s/containerd/containerd.sock
                  timeout: 30
                  debug: false
                  CFG

                  auth="$(sed -n 's/.*"auth"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /harbor/.dockerconfigjson | head -n1)"
                  if [ -z "${auth}" ]; then
                    echo "ERROR missing Harbor docker auth" >&2
                    exit 2
                  fi

                  node="${NODE_NAME:-unknown}"
                  ok=0
                  fail=0
                  total=0
                  echo "qwen prepull start node=${node}"
                  while IFS= read -r image || [ -n "${image}" ]; do
                    case "${image}" in
                      ""|\#*) continue ;;
                    esac
                    total=$((total + 1))
                    echo "PULL start node=${node} image=${image}"
                    if /tmp/crictl --config /tmp/crictl.yaml pull --auth "${auth}" --pull-timeout 10m "${image}"; then
                      ok=$((ok + 1))
                      echo "PULL ok node=${node} image=${image}"
                    else
                      fail=$((fail + 1))
                      echo "PULL fail node=${node} image=${image}" >&2
                    fi
                  done < /images/images.txt
                  echo "qwen prepull summary node=${node} total=${total} ok=${ok} fail=${fail}"
                  if [ "${QW_PREPULL_FAIL_ON_ERROR:-false}" = "true" ] && [ "${fail}" -ne 0 ]; then
                    exit 1
                  fi
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: QW_PREPULL_FAIL_ON_ERROR
                  value: "false"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                privileged: true
              volumeMounts:
                - name: host-root
                  mountPath: /host
                  readOnly: true
                - name: harbor-auth
                  mountPath: /harbor
                  readOnly: true
                - name: images
                  mountPath: /images
                  readOnly: true
          volumes:
            - name: host-root
              hostPath:
                path: /
                type: Directory
            - name: harbor-auth
              secret:
                secretName: harbor-qianwen-admin
                items:
                  - key: .dockerconfigjson
                    path: .dockerconfigjson
            - name: images
              configMap:
                name: qwen-image-prepull-images
                items:
                  - key: images.txt
                    path: images.txt
