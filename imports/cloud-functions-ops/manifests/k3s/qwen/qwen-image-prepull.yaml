data:
  images.txt: |
    registry.re8ch.com/qianwen/processor-qianwen-agent-api:agent-tool-allowlist-20260531165859
    registry.re8ch.com/qianwen/processor-qianwen-mcp-gateway:mcp-gateway-20260531114748
    registry.re8ch.com/qianwen/processor-qianwen-prod-analytics:prod-posthog-drop-noise-20260603212715
    registry.re8ch.com/qianwen/processor-qianwen-prod-api-core:prod-api-core-read-cache-20260610054254
    registry.re8ch.com/qianwen/processor-qianwen-prod-api-gateway:prod-edge-video-meta-cache-20260610032953
    registry.re8ch.com/qianwen/processor-qianwen-prod-assets-api:prod-sentry-sdk-20260523113137
    registry.re8ch.com/qianwen/processor-qianwen-prod-feishu-agent:prod-feishu-agent-grafana-catalog-20260609013358
    registry.re8ch.com/qianwen/processor-qianwen-prod-image-api:prod-image-status-cache-20260610045755
    registry.re8ch.com/qianwen/processor-qianwen-prod-image-worker:prod-structured-task-errors-go1259-20260611161832
