apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-edge-redirects-nginx
  namespace: qwen
  labels:
    saas.re8ch.com/product: qianwen
    saas.re8ch.com/tenant: qianwen
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /callback {
        return 302 https://api.jz.ynzs.com/callback-code/$arg_code/$arg_state;
      }

      location = /other/wechatWeb/callback {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Qianwen-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Qianwen-Raw-Query $query_string;
        proxy_pass http://192.0.2.27:8080;
      }

      location = /billing/alipay/return {
        return 302 https://jz.ynzs.com/homepage/project#/myResources?outTradeNo=$arg_out_trade_no&tradeNo=$arg_trade_no&verified=1;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-edge-redirects
  namespace: qwen
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "true"
  labels:
    app.kubernetes.io/name: qwen-edge-redirects
    saas.re8ch.com/product: qianwen
    saas.re8ch.com/tenant: qianwen
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-edge-redirects
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen-edge-redirects
    spec:
      nodeSelector:
        pigsty.cc/workload: nuclio
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: nginx-config
          configMap:
            name: qwen-edge-redirects-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-edge-redirects
  namespace: qwen
  labels:
    app.kubernetes.io/name: qwen-edge-redirects
spec:
  selector:
    app.kubernetes.io/name: qwen-edge-redirects
  ports:
    - name: http
      port: 8080
      targetPort: http
