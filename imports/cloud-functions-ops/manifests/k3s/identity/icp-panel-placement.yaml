# Strategic-merge placement patches for the low-frequency human identity/UI
# workloads hosted by the ICP K3s Agent. Apply each document to its namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-20-12-ubuntu
      volumes:
        - name: data
          hostPath:
            path: /var/lib/rancher/k3s/storage/pvc-da70faf0-4576-4706-8750-7c181ed8e541_dex_dex-data
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: rancher-panel
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: headlamp
          args:
            - -in-cluster
            - -in-cluster-context-name=re8ch-k3s
            - -enable-dynamic-clusters
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            - -oidc-idp-issuer-url=https://dex.re8ch.com
            - -oidc-callback-url=https://headlamp.re8ch.com/oidc-callback
            - -oidc-scopes=openid,profile,email,groups
            - -oidc-skip-tls-verify
            - -plugins-dir=/headlamp/plugins
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: headlamp-plugins
