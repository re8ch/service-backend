apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-app-server-console
  labels:
    app.kubernetes.io/name: codex-app-server-console
    app.kubernetes.io/part-of: codex-session-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-app-server-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-app-server-console
        app.kubernetes.io/part-of: codex-session-platform
    spec:
      serviceAccountName: codex-app-server-console
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      containers:
        - name: console
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: [node, /app/server.mjs]
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_BASE_URL
              value: https://api.re8ch.com/auth
            - name: AUTH_SERVICE
              value: codex
            - name: APP_BASE_PATH
              value: /codex-console
            - name: OPERATOR_GROUPS
              value: service:codex:operator,platform:admin,re8ch:admin
            - name: INTERNAL_DIRECT_HOSTS
              value: 192.0.2.97:32032,192.0.2.183:32032
            - name: INTERNAL_SOURCE_PREFIXES
              value: 192.168.88.,10.181.22.
            - name: CODEX_APP_SERVER_HOST
              value: codex-app-server.codex-app-server.svc.cluster.local
            - name: CODEX_APP_SERVER_PORT
              value: "4500"
            - name: CODEX_DEFAULT_CWD
              value: /workspace
            - name: CODEX_APP_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-app-server-client-token
                  key: CODEX_APP_SERVER_TOKEN
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: codex-app-server-console-code
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-app-server-console
  labels:
    app.kubernetes.io/name: codex-app-server-console
spec:
  selector:
    app.kubernetes.io/name: codex-app-server-console
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: codex-app-server-console-internal
  labels:
    app.kubernetes.io/name: codex-app-server-console
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: codex-app-server-console
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 32032
