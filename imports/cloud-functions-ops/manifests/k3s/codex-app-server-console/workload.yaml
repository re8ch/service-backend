apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-app-server-console
  labels:
    app.kubernetes.io/name: codex-app-server-console
    app.kubernetes.io/part-of: codex-session-platform
spec:
  # The live internal console runs as a host service on restricted-node-6dc3f140f9. Keep this
  # deployment disabled until the public ingress/auth path is restored.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-app-server-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-app-server-console
        app.kubernetes.io/part-of: codex-session-platform
    spec:
      serviceAccountName: codex-app-server-console
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      containers:
        - name: console
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: [node, /app/server.mjs]
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_BASE_URL
              value: https://api.re8ch.com/auth
            - name: AUTH_SERVICE
              value: codex
            - name: APP_BASE_PATH
              value: /codex-console
            - name: OPERATOR_GROUPS
              value: service:codex:operator,platform:admin,re8ch:admin
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: codex-app-server-console-code
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codex-app-server-console
  labels:
    app.kubernetes.io/name: codex-app-server-console
spec:
  selector:
    app.kubernetes.io/name: codex-app-server-console
  ports:
    - name: http
      port: 8080
      targetPort: http
