apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbird-access
  namespace: netbird-access
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`access.re8ch.com`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      kind: Rule
      priority: 100
      services:
        - name: netbird-server
          port: 80
          scheme: h2c
    - match: Host(`access.re8ch.com`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      kind: Rule
      priority: 100
      services:
        - name: netbird-server
          port: 80
    - match: Host(`access.re8ch.com`)
      kind: Rule
      priority: 1
      services:
        - name: netbird-dashboard
          port: 80
  tls:
    secretName: re8ch-wildcard-tls
---
# The cluster ExternalDNS controller intentionally watches standard Ingress
# resources only. This non-routable declaration publishes DNS while the
# IngressRoute above remains the sole Traefik routing authority.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netbird-access-dns
  namespace: netbird-access
  labels:
    public.re8ch.com/external-dns: enabled
  annotations:
    external-dns.alpha.kubernetes.io/hostname: access.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: access.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netbird-dashboard
                port:
                  name: http
