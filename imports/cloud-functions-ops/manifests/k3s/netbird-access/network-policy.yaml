apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbird-control-plane
  namespace: netbird-access
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [netbird-server, netbird-dashboard]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - {port: 80, protocol: TCP}
        - {port: 9000, protocol: TCP}
        - {port: 9090, protocol: TCP}
        - {port: 3478, protocol: UDP}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netbird-control-plane-from-gateway
  namespace: netbird-access
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [netbird-server, netbird-dashboard]
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "9000", protocol: TCP}
            - {port: "9090", protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netbird-routing-peers
  namespace: netbird-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netbird-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.0.2.81/10}
      ports:
        - {port: 22054, protocol: UDP}
        - {port: 22054, protocol: TCP}
  egress:
    - {}
