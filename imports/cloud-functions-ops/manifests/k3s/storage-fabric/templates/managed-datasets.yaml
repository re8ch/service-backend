{{- if .Values.managedDatasets.enabled }}
{{- range .Values.managedDatasets.datasets }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: managed-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    storage.re8ch.com/managed-dataset: {{ .name | quote }}
    storage.re8ch.com/category: {{ .category | quote }}
    storage.re8ch.com/fallback: local-source
  annotations:
    storage.re8ch.com/source-node: restricted-node-6dc3f140f9
    storage.re8ch.com/source-path: {{ .sourcePath | quote }}
    storage.re8ch.com/source-device: {{ .sourceDevice | quote }}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ $.Values.managedDatasets.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .capacity }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    storage.re8ch.com/managed-dataset: {{ .name | quote }}
spec:
  schedule: {{ .schedule | quote }}
  suspend: {{ .suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            storage.re8ch.com/managed-dataset: {{ .name | quote }}
        spec:
          restartPolicy: Never
          nodeSelector:
{{ toYaml $.Values.managedDatasets.nodeSelector | indent 12 }}
          containers:
            - name: sync
              image: {{ $.Values.managedDatasets.image | quote }}
              imagePullPolicy: IfNotPresent
              command: [sh, -ceu]
              args:
                - |
                  marker="/managed/.storage-fabric"
                  mkdir -p "$marker"
                  date -u +%Y-%m-%dT%H:%M:%SZ > "$marker/sync-started"
                  cp -a /source/. /managed/
                  source_files="$(find /source -xdev -type f | wc -l)"
                  managed_files="$(find /managed -xdev -type f | wc -l)"
                  test "$managed_files" -ge "$source_files"
                  printf '%s\n' "$source_files" > "$marker/source-files"
                  du -sb /source | cut -f1 > "$marker/source-bytes"
                  date -u +%Y-%m-%dT%H:%M:%SZ > "$marker/sync-completed"
              securityContext:
                runAsUser: 0
                runAsGroup: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                  add: [DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN, FOWNER]
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: managed
                  mountPath: /managed
          volumes:
            - name: source
              hostPath:
                path: {{ .sourcePath | quote }}
                type: Directory
            - name: managed
              persistentVolumeClaim:
                claimName: managed-{{ .name }}
{{- end }}
{{- end }}
