apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "re8ch-storage-fabric.fullname" . }}-inventory
  labels:
    app.kubernetes.io/name: {{ include "re8ch-storage-fabric.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  inventory.yaml: |
{{ toYaml (dict "buckets" .Values.buckets "placementClasses" .Values.placementClasses "r640Allocations" .Values.r640Allocations "managedDatasets" .Values.managedDatasets.datasets) | indent 4 }}
