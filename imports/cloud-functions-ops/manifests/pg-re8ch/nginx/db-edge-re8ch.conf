# Managed by Codex for re8ch DB edge routing. Do not merge with ynzs/mgr routes.
server {
    listen 80;
    server_name db.re8ch.com db-rw.re8ch.com db-ro.re8ch.com db-ro-1.re8ch.com db-ro-2.re8ch.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name db-rw.re8ch.com;

    ssl_certificate /etc/letsencrypt/live/db-re8ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db-re8ch/privkey.pem;

    add_header X-Qianwen-DB-Route rw-direct always;

    location = /compocv {
        return 308 /compocv/;
    }

    location ^~ /compocv/ {
        proxy_pass http://192.0.2.172:3080/compocv/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CompoCV-DB-Entry db-edge-compocv;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }


    location = /auth {
        return 308 /auth/;
    }

    location ^~ /auth/ {
        proxy_pass http://192.0.2.172:3080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-DB-Entry db-edge-auth;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }


    location = /anysite {
        return 308 /anysite/;
    }

    location ^~ /anysite/ {
        proxy_pass http://192.0.2.172:3080/anysite/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Anysite-DB-Entry db-edge-anysite;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /ledger {
        return 308 /ledger/;
    }

    location = /image {
        return 308 /image/;
    }

    location ^~ /image/ {
        proxy_pass http://192.0.2.172:3080/image/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Image-DB-Entry db-edge-image;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /ledger/ {
        proxy_pass http://192.0.2.172:3014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ledger-DB-Entry db-edge-ledger;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://192.0.2.172:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Qianwen-DB-Entry rw-direct;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

