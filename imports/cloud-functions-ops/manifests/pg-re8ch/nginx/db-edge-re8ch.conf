server {
    listen 443 ssl;
    server_name db.re8ch.com;

    ssl_certificate /etc/letsencrypt/live/db-re8ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db-re8ch/privkey.pem;

    add_header X-Qianwen-DB-Route fallback always;
    location = /compocv {
        return 308 /compocv/;
    }

    location ^~ /compocv/ {
        proxy_pass http://192.0.2.172:3080/compocv/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-CompoCV-DB-Entry db-edge-compocv;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }


    location = /__lb/ready {
        access_log off;
        auth_request /__lb/upstream-ready;
        root /var/www/db-edge-ready;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Qianwen-DB-Ready "ok" always;
    }

    location = /__lb/upstream-ready {
        internal;
        proxy_pass http://192.0.2.172:3080/auth/;
        proxy_http_version 1.1;
        proxy_method HEAD;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Qianwen-DB-Entry lb-ready;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location ^~ /rw/ {
        proxy_pass http://192.0.2.172:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Qianwen-DB-Entry fallback-rw-prefix;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /ro/ {
        proxy_pass http://192.0.2.172:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Qianwen-DB-Entry fallback-ro-prefix;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /anysite {
        return 308 /anysite/;
    }

    location ^~ /anysite/ {
        proxy_pass http://192.0.2.172:3080/anysite/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Anysite-DB-Entry db-edge-anysite;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /ledger {
        return 308 /ledger/;
    }

    location ^~ /ledger/ {
        proxy_pass http://192.0.2.172:3014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ledger-DB-Entry db-edge-ledger;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://192.0.2.172:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Qianwen-DB-Entry fallback-method-gateway;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
