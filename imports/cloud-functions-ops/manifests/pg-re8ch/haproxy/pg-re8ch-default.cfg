# service: pg-re8ch-default @ 192.0.2.89:5436
# service instances 192.0.2.178, 192.0.2.89, 192.0.2.138
listen pg-re8ch-default
    bind *:5436
    mode tcp
    maxconn 5000
    balance first
    default-server inter 2s fastinter 1s downinter 2s rise 3 fall 3 on-marked-down shutdown-sessions slowstart 30s maxconn 3000 maxqueue 128 weight 100

    # restricted-node-6dc3f140f9 is the designated pg-re8ch primary. Replica promotion is a
    # controlled Patroni operation; enable a replica here only after promotion.
    server pg-re8ch-1 192.0.2.178:5432 check port 5432 weight 100
    server pg-re8ch-2 192.0.2.89:5432 disabled
    server pg-re8ch-3 192.0.2.138:5432 disabled
