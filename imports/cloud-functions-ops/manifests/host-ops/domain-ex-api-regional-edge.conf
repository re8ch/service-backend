# Managed companion for the regional routing authority. The public edge
# terminates TLS; Cilium Gateway API owns service and Pod selection.
server {
    listen 443 ssl;
    server_name api.re8ch.com;

    ssl_certificate /etc/nginx/ssl/re8ch-wildcard/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/re8ch-wildcard/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://192.0.2.213;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
