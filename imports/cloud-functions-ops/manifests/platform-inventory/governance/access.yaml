schemaVersion: re8ch.com/v1alpha1
authentikGroups:
  observers: RE8CH Platform Observers
  operators: RE8CH Platform Operators
  nodeOperators: RE8CH Platform Node Operators
  administrators: RE8CH Platform Admins
principles:
  - Kubernetes RBAC and backend allowlists remain authoritative after OIDC authorization.
  - Secret values and unrestricted Kubernetes objects are never exposed to agents.
  - No RE8CH role implies membership in authentik Admins.
ssh:
  mode: cloud-platform-permanent-jump-key
  privateKeyRef: secret://ai-operations/cloud-platform-runtime#id_ed25519
  account: re8ch-ai
  clientPrivateKeyReturned: false
  deactivationAuthority: ai-operations/device-registry
