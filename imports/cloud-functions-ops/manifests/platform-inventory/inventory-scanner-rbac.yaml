apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-inventory-scanner
  namespace: toolhive-system
  labels: {re8ch.com/access-level: inventory-read}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: re8ch:platform-inventory-scanner
rules:
  - apiGroups: [""]
    resources: ["nodes", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: re8ch:platform-inventory-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: re8ch:platform-inventory-scanner
subjects:
  - kind: ServiceAccount
    name: platform-inventory-scanner
    namespace: toolhive-system
