apiVersion: v1
kind: ServiceAccount
metadata: {name: mihomos-status, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ include "mihomos-cluster.name" . }}-status}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ include "mihomos-cluster.name" . }}-status}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "mihomos-cluster.name" . }}-status}
subjects: [{kind: ServiceAccount, name: mihomos-status, namespace: {{ .Release.Namespace }}}]
