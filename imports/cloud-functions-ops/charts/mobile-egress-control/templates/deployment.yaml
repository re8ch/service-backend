apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mobile-egress-control
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: mobile-egress-control}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mobile-egress-control}}
    spec:
      serviceAccountName: {{ .Release.Name }}-mobile-egress-control
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          env:
            - {name: AUTH_ME_URL, value: {{ .Values.authMeURL | quote }}}
            - {name: SIGNING_KEY_ID, value: {{ .Values.signingKeyID | quote }}}
            - {name: CATALOG_PATH, value: /config/catalog.json}
            - {name: KUBERNETES_CATALOG, value: "true"}
            - {name: MOBILE_SOCKS_PORT, value: "31081"}
            - {name: SIGNING_KEY_PATH, value: /secrets/signing-key}
            - {name: CREDENTIAL_SECRET_PATH, value: /secrets/credential-secret}
            - {name: SOCKS_USERNAME_PATH, value: /socks-credentials/username}
            - {name: SOCKS_PASSWORD_PATH, value: /socks-credentials/password}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secret, mountPath: /secrets, readOnly: true}
            - {name: socks-credentials, mountPath: /socks-credentials, readOnly: true}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-mobile-egress-control}
        - name: secret
          secret: {secretName: {{ .Values.existingSecret }}}
        - name: socks-credentials
          secret: {secretName: {{ .Values.socksCredentialsSecret }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mobile-egress-control
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: mobile-egress-control}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-mobile-egress-control, namespace: {{ .Release.Namespace }} }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ .Release.Name }}-mobile-egress-control}
rules:
  - {apiGroups: [""], resources: [nodes, pods], verbs: [get, list]}
  - {apiGroups: [networking.re8ch.com], resources: [advancedfabrics], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ .Release.Name }}-mobile-egress-control}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-mobile-egress-control}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}-mobile-egress-control, namespace: {{ .Release.Namespace }} }]
