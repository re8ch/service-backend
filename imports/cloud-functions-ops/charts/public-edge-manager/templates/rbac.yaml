apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "public-edge-manager.name" . }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ include "public-edge-manager.name" . }}}
rules:
  - apiGroups: [networking.re8ch.com]
    resources: [publicedges]
    verbs: [get, list, watch]
  - apiGroups: [networking.re8ch.com]
    resources: [publicedges/status]
    verbs: [get, patch, update]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tlsroutes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ include "public-edge-manager.name" . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "public-edge-manager.name" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "public-edge-manager.name" . }}, namespace: {{ .Release.Namespace }}}
