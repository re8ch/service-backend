{{- range .Values.publicEdges }}
apiVersion: networking.re8ch.com/v1alpha1
kind: PublicEdge
metadata: {name: {{ .name }}}
spec:
  area: {{ .area }}
  region: {{ .region }}
  nodeName: {{ .nodeName }}
  enabled: {{ if hasKey . "enabled" }}{{ .enabled }}{{ else }}true{{ end }}
  draining: {{ if hasKey . "draining" }}{{ .draining }}{{ else }}false{{ end }}
  endpoint: {{ .endpoint | toYaml | nindent 4 }}
  gatewayVIP: {{ .gatewayVIP }}
  capacityMbps: {{ .capacityMbps }}
  priority: {{ default 0 .priority }}
  protocols: {{ default (list "http" "https" "tls-passthrough") .protocols | toJson }}
  ports: {{ default (list 80 443) .ports | toJson }}
  serviceClasses: {{ .serviceClasses | toJson }}
  forwarding: {{ .forwarding | toYaml | nindent 4 }}
---
{{- end }}
