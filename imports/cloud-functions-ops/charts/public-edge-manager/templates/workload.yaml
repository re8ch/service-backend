apiVersion: apps/v1
kind: DaemonSet
metadata: {name: {{ include "public-edge-manager.name" . }}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}}
    spec:
      serviceAccountName: {{ include "public-edge-manager.name" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: {{ keys .Values.authorityNodes | toJson }}
      tolerations: [{operator: Exists}]
      containers:
        - name: manager
          image: {{ include "public-edge-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{configMapRef: {name: {{ include "public-edge-manager.name" . }}}}]
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: PROBE_CONNECT_TIMEOUT_SECONDS, value: {{ .Values.probe.connectTimeoutSeconds | quote }}}
            - {name: PROBE_RESPONSE_TIMEOUT_SECONDS, value: {{ .Values.probe.responseTimeoutSeconds | quote }}}
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "public-edge-manager.name" . }}}
spec:
  selector: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}
  ports: [{name: http, port: 8080, targetPort: http}]
