#!KAMAILIO

# Historical, deliberately disarmed A8-C IMS pass-through POC.
# Do not deploy without reviewing the carrier registration and inbound leg.

debug=2
log_stderror=no
log_facility=LOG_LOCAL0
fork=yes
children=2
auto_aliases=no
local_rport=on

listen=udp:192.0.2.97:5060
alias=192.0.2.39:5060

loadmodule "pv.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "textops.so"
loadmodule "xlog.so"

modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

request_route {
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "A8IMS malformed request from $si:$sp\n");
        exit;
    }
    if (!mf_process_maxfwd_header("16")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    force_rport();
    if (is_method("OPTIONS") && $rU == "health") {
        sl_send_reply("200", "A8 IMS POC Ready");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    xlog(
        "L_INFO",
        "A8IMS request method=$rm source=$si:$sp ruri=$ru callid=$ci\n"
    );
    if ($si == "192.0.2.106" || $si == "192.0.2.148") {
        xlog(
            "L_WARN",
            "A8IMS carrier request held method=$rm source=$si:$sp callid=$ci\n"
        );
        sl_send_reply("503", "Inbound POC Leg Not Armed");
        exit;
    }
    $du = "sip:192.0.2.106:5060;transport=udp";
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
