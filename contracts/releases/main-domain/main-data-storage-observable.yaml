apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-data-storage-observable
spec:
  target:
    cluster: re8ch
    namespace: observable
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-data-storage-observable
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-main-domain
    audience: https://kube-api.re8ch.com/release-executor-main-domain
    signer: https://github.com/re8ch/service-backend/.github/workflows/main-domain-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
