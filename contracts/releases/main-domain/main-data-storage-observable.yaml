    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist:
    - apps/Deployment/observable/observable-postgrest
    - autoscaling/HorizontalPodAutoscaler/observable/observable-postgrest
    - core/Service/observable/observable-postgrest
    - gateway.networking.k8s.io/HTTPRoute/observable/observable-postgrest-ro
    - gateway.networking.k8s.io/HTTPRoute/observable/observable-postgrest-rw
    - policy/PodDisruptionBudget/observable/observable-postgrest
