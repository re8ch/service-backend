    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist:
    - core/ConfigMap/pigsty-external/pg-re8ch-topology
    - core/Service/pigsty-external/pg-re8ch-primary
    - core/Service/pigsty-external/pg-re8ch-replicas
    - discovery.k8s.io/EndpointSlice/pigsty-external/pg-re8ch-primary
    - discovery.k8s.io/EndpointSlice/pigsty-external/pg-re8ch-replicas
