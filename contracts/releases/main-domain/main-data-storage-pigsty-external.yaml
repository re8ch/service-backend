apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-data-storage-pigsty-external
spec:
  authorityDomain: data-storage
  target:
    cluster: re8ch
    namespace: pigsty-external
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-data-storage-pigsty-external
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-executor-data-storage
    audience: https://kube-api.re8ch.com/release-executor-data-storage
    signer: https://github.com/re8ch/service-backend/.github/workflows/main-domain-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/main-data-storage-pigsty-external
    resources:
    - core/ConfigMap
    - core/Service
    - discovery.k8s.io/EndpointSlice
    objectNames:
    - pg-re8ch-primary
    - pg-re8ch-replicas
    - pg-re8ch-topology
    allowClusterScoped: false
  inventory:
