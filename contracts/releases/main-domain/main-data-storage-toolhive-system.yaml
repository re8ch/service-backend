apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-data-storage-toolhive-system
spec:
  authorityDomain: data-storage
  target:
    cluster: re8ch
    namespace: toolhive-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-data-storage-toolhive-system
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-executor-data-storage
    audience: https://kube-api.re8ch.com/release-executor-data-storage
    signer: https://github.com/re8ch/service-backend/.github/workflows/main-domain-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/main-data-storage-toolhive-system
    resources:
    - toolhive.stacklok.dev/MCPServer
    objectNames:
    - cloud-disk-mcp
    allowClusterScoped: false
  inventory:
    digest: sha256:08e38150e6ddf9725c7efbc10c24cf8d3ce6f3848d47d5013f8645afbeb5229e
  lifecycle:
    prune: true
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist:
    - toolhive.stacklok.dev/MCPServer/toolhive-system/cloud-disk-mcp
