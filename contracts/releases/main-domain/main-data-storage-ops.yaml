apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-data-storage-ops
spec:
  authorityDomain: data-storage
  target:
    cluster: re8ch
    namespace: ops
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-data-storage-ops
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-executor-data-storage
    audience: https://kube-api.re8ch.com/release-executor-data-storage
    signer: https://github.com/re8ch/service-backend/.github/workflows/main-domain-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/main-data-storage-ops
    resources:
    - apps/Deployment
    - core/ConfigMap
    - core/PersistentVolumeClaim
    - core/Service
    - gateway.networking.k8s.io/HTTPRoute
    - networking.k8s.io/Ingress
    objectNames:
    - cloudbeaver
    - cloudbeaver-datasources
    - cloudbeaver-dns-authority
    - cloudbeaver-public
    - cloudbeaver-workspace
    - cloudbeaver-workspace-rbd
    allowClusterScoped: false
  inventory:
    digest: sha256:8ef6226b98c201e85c22bc48f7d7d65ef367bde9ccb249134679e75723d1846c
  lifecycle:
    prune: true
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist:
    - apps/Deployment/ops/cloudbeaver
    - core/ConfigMap/ops/cloudbeaver-datasources
    - core/Service/ops/cloudbeaver
    - gateway.networking.k8s.io/HTTPRoute/ops/cloudbeaver-public
    - networking.k8s.io/Ingress/ops/cloudbeaver-dns-authority
