    - core/Namespace
    - core/PersistentVolume
    objectNames:
    - hyperswitch-superposition-local-key-r640
    - payments
    allowClusterScoped: true
    requireExisting: true
  inventory:
    digest: sha256:010ff456666eed2dee44308ffada4dfb8aa4bf26967103126be4c6ba536cedc7
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
