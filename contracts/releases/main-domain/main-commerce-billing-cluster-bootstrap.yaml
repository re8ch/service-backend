    - ClusterPolicy
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - Namespace
    - Node
    - NodeProfile
    - PersistentVolume
    - PersistentVolumeClaim
    - PlacementClass
    - SchedulerProfile
    - StorageClass
    - TenantNamespace
    - ValidatingAdmissionPolicy
    - ValidatingAdmissionPolicyBinding
    - ValidatingWebhookConfiguration
    deletionAllowlist: []
