apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-data-storage-cluster-bootstrap
spec:
  authorityDomain: data-storage
  target:
    cluster: re8ch
    namespace: ops
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-data-storage-cluster-bootstrap
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-executor-data-storage
    audience: https://kube-api.re8ch.com/release-executor-data-storage
    signer: https://github.com/re8ch/service-backend/.github/workflows/main-domain-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/main-data-storage-cluster-bootstrap
    resources:
    - core/Namespace
    objectNames:
    - cloud-disk
    allowClusterScoped: true
    requireExisting: true
  inventory:
    digest: sha256:54125874d831589cf43d9fefb6f9434d3999d2fde35c2c3bca10b231abc684bc
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - APIService
    - ClusterPolicy
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - Namespace
    - Node
    - NodeProfile
    - PersistentVolume
    - PersistentVolumeClaim
    - PlacementClass
    - SchedulerProfile
    - StorageClass
    - Tenant
    - TenantNamespace
    - ValidatingAdmissionPolicy
    - ValidatingAdmissionPolicyBinding
    - ValidatingWebhookConfiguration
    deletionAllowlist: []
