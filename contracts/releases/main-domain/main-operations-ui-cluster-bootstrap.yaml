apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: main-operations-ui-cluster-bootstrap
spec:
  authorityDomain: operations-ui
  target:
    cluster: re8ch
    namespace: ops
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: re8ch/service-backend
    path: operations/releases/main-domain-ssa/main-operations-ui-cluster-bootstrap
  provenance:
    repository: re8ch/service-backend
    workflow: .github/workflows/main-domain-release.yml
    ref: refs/heads/main
    environment: release-executor-operations-ui
    audience: https://kube-api.re8ch.com/release-executor-operations-ui
