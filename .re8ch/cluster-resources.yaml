apiVersion: governance.re8ch.com/v1alpha1
kind: ClusterResourceIndex
metadata:
  name: service-backend
spec:
  controlPlane:
    repository: https://github.com/re8ch/service-backend.git
    revision: main
    indexPath: indexes/deployments.json
  lookup:
    module: service-backend
    catalog: platform
    declaredDeployments:
    - github.com/re8ch/service-backend
    - k3s/re8ch
  evidence:
    authority: kubernetes
    requiredPlanes:
    - monitoring
    - deploying
    - planning
