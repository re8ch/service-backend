stages: [validate, test, render, security, release, canary]

default:
  tags: [macmini-a1]
  image:
    name: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
    entrypoint: [""]
  retry:
    max: 2
    when: runner_system_failure

schema:
  stage: validate
  script:
    - python tests/validate_schemas.py
    - python operations/scripts/validate-r640-public-authority.py

unit:
  stage: test
  before_script:
    - git submodule update --init catalogs/platform/modules/connectool/source
  script:
    - pytest -q

render:
  stage: render
  script:
    - kustomize build clusters/re8ch >/tmp/rendered.yaml
    - kustomize build platform/observability/bootstrap >/tmp/observability-bootstrap.yaml
    - kustomize build platform/observability/production >/tmp/observability-production.yaml
    - test -s /tmp/rendered.yaml
    - test -s /tmp/observability-bootstrap.yaml
    - test -s /tmp/observability-production.yaml

secret-scan:
  stage: security
  script:
    - python tests/check_no_plaintext_secrets.py

workspace-drift:
  stage: validate
  script:
    - python operations/workspace-controller/workspace.py doctor
    - python operations/workspace-controller/workspace.py index --write
    - git diff --exit-code -- indexes

macmini-devops-context:
  stage: validate
  tags: [macmini-service-backend-shell]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  before_script: []
  script:
    - test -d /Volumes/A1/service-backend
    - curl -fsS http://127.0.0.1:19640/healthz
    - /Volumes/A1/service-backend/.venv/bin/python /Volumes/A1/service-backend/operations/workspace-controller/workspace.py --root /Volumes/A1/service-backend memory-audit

tenant-release-preflight:
  stage: validate
  tags: [macmini-service-backend-shell]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: []
  script:
    - ./operations/mcp-conformance/release-tenant-infrastructure.sh --check

tenant-infrastructure-release:
  stage: release
  tags: [macmini-service-backend-shell]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $TENANT_FORCE_RELEASE == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - clusters/re8ch/components/ai-operations/**/*
  before_script: []
  script:
    - ./operations/mcp-conformance/release-tenant-infrastructure.sh
  artifacts:
    paths: [tenant-infrastructure.image, tenant-infrastructure.spdx.json]

tenant-mcp-canary:
  stage: canary
  tags: [macmini-a1]
  needs:
    - job: tenant-infrastructure-release
      optional: true
      artifacts: false
  id_tokens:
    MCP_EVIDENCE_SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script: []
  script:
    - test -n "$TENANT_REGISTRY_CANARY_REFRESH_TOKEN"
    - test -n "$TENANT_OBSERVABILITY_CANARY_REFRESH_TOKEN"
    - export DEX_REFRESH_TOKEN="$TENANT_REGISTRY_CANARY_REFRESH_TOKEN" DEX_CLIENT_ID=re8ch-tenant-registry DEX_RESOURCE=https://tools.re8ch.com/tenant/registry/mcp
    - export TENANT_REGISTRY_CANARY_TOKEN="$(./operations/mcp-conformance/dex-refresh-token.sh)"
    - python3 operations/mcp-conformance/mcp_collection.py operations/mcp-conformance/collections/tenant-registry-canary.json --output tenant-registry-canary.evidence.json
    - unset TENANT_REGISTRY_CANARY_TOKEN DEX_REFRESH_TOKEN
    - export DEX_REFRESH_TOKEN="$TENANT_OBSERVABILITY_CANARY_REFRESH_TOKEN" DEX_CLIENT_ID=re8ch-tenant-observability DEX_RESOURCE=https://tools.re8ch.com/tenant/observability/mcp
    - export TENANT_OBSERVABILITY_CANARY_TOKEN="$(./operations/mcp-conformance/dex-refresh-token.sh)"
    - python3 operations/mcp-conformance/mcp_collection.py operations/mcp-conformance/collections/tenant-observability-canary.json --output tenant-observability-canary.evidence.json
    - unset TENANT_OBSERVABILITY_CANARY_TOKEN DEX_REFRESH_TOKEN
  artifacts:
    paths: [tenant-registry-canary.evidence.json, tenant-registry-canary.evidence.json.bundle, tenant-observability-canary.evidence.json, tenant-observability-canary.evidence.json.bundle]
