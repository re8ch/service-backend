stages: [validate, test, render, security, release]

default:
  image: registry.re8ch.com/helm/connectool-ci-tools@sha256:9e9ea9643b5f9632b73da484289a0b60a16ba576dd35732d738bf5c595393c77
  retry:
    max: 2
    when: runner_system_failure

before_script: []

schema:
  stage: validate
  tags: [macmini-service-backend]
  script:
    - python tests/validate_schemas.py
    - python operations/scripts/validate-r640-public-authority.py

unit:
  stage: test
  tags: [r640-fallback]
  script:
    - pytest -q

render:
  stage: render
  tags: [r640-fallback]
  script:
    - kustomize build clusters/re8ch >/tmp/rendered.yaml
    - kustomize build platform/observability/bootstrap >/tmp/observability-bootstrap.yaml
    - kustomize build platform/observability/production >/tmp/observability-production.yaml
    - test -s /tmp/rendered.yaml
    - test -s /tmp/observability-bootstrap.yaml
    - test -s /tmp/observability-production.yaml

connectool-chart:
  stage: render
  tags: [r640-fallback]
  before_script: []
  image:
    name: registry.re8ch.com/helm/connectool-ci-tools@sha256:9e9ea9643b5f9632b73da484289a0b60a16ba576dd35732d738bf5c595393c77
    entrypoint: [""]
  script:
    - helm lint clusters/re8ch/charts/connectool
    - helm lint clusters/re8ch/charts/connectool -f clusters/re8ch/charts/connectool/examples/re8ch-values.yaml
    - helm template connectool clusters/re8ch/charts/connectool --namespace connectool -f clusters/re8ch/charts/connectool/examples/re8ch-values.yaml >/tmp/connectool.yaml
    - helm package clusters/re8ch/charts/connectool --destination dist
    - test -s /tmp/connectool.yaml
    - test -s dist/connectool-0.1.5.tgz
  artifacts:
    paths: [dist/connectool-0.1.5.tgz]

release-connectool-chart:
  stage: release
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  before_script:
    - apk add --no-cache ca-certificates curl tar
    - curl -fsSLo /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v2.4.3/cosign-linux-amd64
    - chmod +x /usr/local/bin/cosign
    - curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane
    - curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz | tar -xz -C /usr/local/bin oras
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - operations/ci/release-connectool-chart.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^connectool-v[0-9]+\.[0-9]+\.[0-9]+$/'

secret-scan:
  stage: security
  tags: [macmini-service-backend]
  script:
    - python tests/check_no_plaintext_secrets.py

workspace-drift:
  stage: validate
  tags: [macmini-service-backend]
  script:
    - python operations/workspace-controller/workspace.py doctor
    - python operations/workspace-controller/workspace.py index --write
    - git diff --exit-code -- indexes

macmini-devops-context:
  stage: validate
  tags: [macmini-a1]
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
  before_script: []
  script:
    - test -d /Volumes/A1/service-backend
    - curl -fsS http://127.0.0.1:19640/healthz
    - /Volumes/A1/service-backend/.venv/bin/python /Volumes/A1/service-backend/operations/workspace-controller/workspace.py --root /Volumes/A1/service-backend memory-audit
