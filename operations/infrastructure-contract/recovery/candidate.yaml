  restore.py: "\"\"\"One-shot fixed Secret recovery; private material stays inside\
    \ pod memory.\"\"\"\nimport base64\nimport hashlib\nimport json\nimport os\nfrom\
    \ pathlib import Path\nimport secrets\nimport ssl\nimport subprocess\nimport sys\n\
    import urllib.error\nimport urllib.request\n\nRECIPIENT = 'age1c7camhc8ql85t5u4hrjmsmkurfa0n0v7lg05espasa9fqapjz5vqql8lfj'\n\
    SOURCE = 'sha256:99c7f741aec926fe7e3839adf488d58c6fb7522d73b42fbd820a9bdbf8fbdc64'\n\
    OWNER = 'infra-contracts-recovery-20261030'\nTARGETS = {'ai-operations-ssh-config':\
    \ {'ssh-config', 'byoc-known-hosts'},\n           'infrastructure-contracts':\
    \ {'compat-nodes.yaml'}}\nKEY = '/age/age.agekey'\nCIPHER_HASHES = {'ai-operations-ssh-config':\
    \ 'ba5c7754c495e4c7f96dc90a0392a34298ec2c8980191cee518143d3d3992509', 'infrastructure-contracts':\
    \ '5e88cf065289f24a53f54fdf8568846d2cdf9ca2f1e76eb12f02e5c88499f89c'}\nclass Rejected(Exception):\
    \ pass\nclass DiagnosticRejected(Rejected):\n    def __init__(self, stage):\n\
    \        self.stage = stage\n        super().__init__()\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
    \    def redirect_request(self, *args, **kwargs): raise Rejected()\n\ndef sops(args,\
    \ body, runner=subprocess.run):\n    env = {'PATH': os.environ.get('PATH', '/usr/local/bin:/usr/bin:/bin'),\n\
    \           'HOME': '/tmp', 'SOPS_AGE_KEY_FILE': KEY}\n    r = runner(['sops',\
    \ *args], input=body, stdout=subprocess.PIPE,\n               stderr=subprocess.DEVNULL,\
    \ env=env, cwd='/tmp', timeout=30, check=False)\n    if r.returncode or len(r.stdout)\
    \ > 1048576: raise Rejected()\n    return r.stdout\n\ndef verify_key():\n    #\
    \ Challenge is noncredential random data, discarded without printing.\n    body\
    \ = json.dumps({'challenge': secrets.token_hex(32)}).encode()\n    encrypted =\
    \ sops(['encrypt', '--age', RECIPIENT, '--input-type', 'json', '--output-type',\
    \ 'json', '/dev/stdin'], body)\n    plain = sops(['decrypt', '--input-type', 'json',\
    \ '--output-type', 'json', '/dev/stdin'], encrypted)\n    if json.loads(plain)\
    \ != json.loads(body): raise Rejected()\n\ndef decode(name, ciphertext):\n   \
    \ try:\n        c = json.loads(ciphertext)\n        if [a['recipient'] for a in\
    \ c['sops']['age']] != [RECIPIENT]: raise Rejected()\n    except Exception:\n\
    \        raise DiagnosticRejected('source_envelope') from None\n    try:\n   \
    \     plain = sops(['decrypt', '--input-type', 'json', '--output-type', 'json',\
    \ '/dev/stdin'], ciphertext)\n    except Exception:\n        raise DiagnosticRejected('source_sops_decrypt')\
    \ from None\n    try:\n        value = json.loads(plain)\n        if value.get('apiVersion')\
    \ != 'v1' or value.get('kind') != 'Secret': raise Rejected()\n        m = value['metadata']\n\
    \        if m['name'] != name or m['namespace'] != 'ai-operations' or m['annotations']['operations.re8ch.com/source-digest']\
    \ != SOURCE: raise Rejected()\n        data = value.get('stringData')\n      \
    \  if not isinstance(data, dict) or set(data) != TARGETS[name] or 'data' in value:\
    \ raise Rejected()\n        if any(not isinstance(v, str) or not v for v in data.values()):\
    \ raise Rejected()\n        return {k: base64.b64encode(v.encode()).decode() for\
    \ k, v in data.items()}\n    except Exception:\n        raise DiagnosticRejected('source_document_validation')\
    \ from None\n\ndef patch(name, data, receipt):\n    if set(receipt) != {'uid',\
    \ 'resourceVersion'} or any(not isinstance(v, str) or not v or v.startswith('REPLACE')\
    \ for v in receipt.values()): raise Rejected()\n    return [\n        {'op': 'test',\
    \ 'path': '/metadata/uid', 'value': receipt['uid']},\n        {'op': 'test', 'path':\
    \ '/metadata/resourceVersion', 'value': receipt['resourceVersion']},\n       \
    \ {'op': 'test', 'path': '/metadata/labels/operations.re8ch.com~1recovery', 'value':\
    \ OWNER},\n        {'op': 'add', 'path': '/data', 'value': data},\n        {'op':\
    \ 'add', 'path': '/metadata/annotations/operations.re8ch.com~1source-digest',\
    \ 'value': SOURCE},\n    ]\n\ndef send(name, ops, dry_run):\n    host = os.environ['KUBERNETES_SERVICE_HOST']\n\
    \    port = os.environ.get('KUBERNETES_SERVICE_PORT_HTTPS', '443')\n    if not\
    \ host or not port.isdigit(): raise Rejected()\n    if ':' in host: host = '['\
    \ + host + ']'\n    path = '/api/v1/namespaces/ai-operations/secrets/' + name\n\
    \    url = f'https://{host}:{port}{path}' + ('?dryRun=All' if dry_run else '')\n\
    \    sa = Path('/var/run/secrets/kubernetes.io/serviceaccount')\n    token = (sa\
    \ / 'token').read_text().strip()\n    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}),\
    \ NoRedirect(), urllib.request.HTTPSHandler(context=ssl.create_default_context(cafile=str(sa\
    \ / 'ca.crt'))))\n    req = urllib.request.Request(url, data=json.dumps(ops).encode(),\
    \ method='PATCH',\n          headers={'Authorization': 'Bearer ' + token, 'Content-Type':\
    \ 'application/json-patch+json'})\n    with opener.open(req, timeout=30) as response:\n\
    \        raw = response.read(1048577)\n    if len(raw) > 1048576: raise Rejected()\n\
    \    return json.loads(raw)\n\ndef prepare(directory, state):\n    ciphertexts\
    \ = {}\n    for name in TARGETS:\n        try:\n            raw = (directory /\
    \ (name + '.json')).read_bytes()\n            if len(raw) > 1048576 or hashlib.sha256(raw).hexdigest()\
    \ != CIPHER_HASHES[name]: raise Rejected()\n            ciphertexts[name] = raw\n\
    \        except Exception:\n            raise DiagnosticRejected('source_cipher_hash')\
    \ from None\n    try:\n        verify_key()\n    except Exception:\n        raise\
    \ DiagnosticRejected('key_challenge') from None\n    decoded = {}\n    for name,\
    \ raw in ciphertexts.items():\n        try:\n            decoded[name] = decode(name,\
    \ raw)\n        except DiagnosticRejected:\n            raise\n        except\
    \ Exception:\n            raise DiagnosticRejected('source_decrypt_and_validate')\
    \ from None\n    try:\n        fd = os.open(state / 'prepared.json', os.O_CREAT\
    \ | os.O_EXCL | os.O_WRONLY, 0o600)\n        with os.fdopen(fd, 'w') as out:\n\
    \            json.dump({'sourceDigest': SOURCE, 'data': decoded}, out)\n    except\
    \ Exception:\n        raise DiagnosticRejected('memory_handoff') from None\n \
    \   return {'prepared': True, 'recipientMatched': True, 'sourceDigest': SOURCE}\n\
    \ndef run(directory, dry_run=True, state=Path('/state')):\n    receipts = json.loads((directory\
    \ / 'targets.json').read_text())\n    if set(receipts) != set(TARGETS): raise\
    \ Rejected()\n    raw = (state / 'prepared.json').read_bytes()\n    if len(raw)\
    \ > 1048576: raise Rejected()\n    document = json.loads(raw)\n    if document.get('sourceDigest')\
    \ != SOURCE or set(document.get('data', {})) != set(TARGETS): raise Rejected()\n\
    \    prepared = {}\n    for name, data in document['data'].items():\n        if\
    \ not isinstance(data, dict) or set(data) != TARGETS[name]: raise Rejected()\n\
    \        if any(not isinstance(v, str) or not base64.b64decode(v, validate=True)\
    \ for v in data.values()): raise Rejected()\n        prepared[name] = (data, patch(name,\
    \ data, receipts[name]))\n    result = []\n    # Preflight both objects before\
    \ any real write. No automatic retries.\n    for name, (data, ops) in prepared.items():\n\
    \        returned = send(name, ops, True)\n        if returned.get('data') !=\
    \ data or returned['metadata']['uid'] != receipts[name]['uid']: raise Rejected()\n\
    \    if not dry_run:\n        for name, (data, ops) in prepared.items():\n   \
    \         returned = send(name, ops, False)\n            if returned.get('data')\
    \ != data or returned['metadata']['uid'] != receipts[name]['uid']: raise Rejected()\n\
    \    for name, (data, _) in prepared.items():\n        result.append({'reference':\
    \ 'kubernetes://ai-operations/' + name, 'matched': True,\n                   \
    \    'contentHash': hashlib.sha256(json.dumps(data, sort_keys=True).encode()).hexdigest()})\n\
    \    return {'dryRun': dry_run, 'sourceDigest': SOURCE, 'recipientMatched': True,\
    \ 'secrets': result}\n\ndef main():\n    try:\n        if sys.argv[1:] not in\
    \ ([], ['--apply'], ['--prepare']): raise Rejected()\n        result = prepare(Path('/input'),\
    \ Path('/state')) if sys.argv[1:] == ['--prepare'] else run(Path('/input'), dry_run=not\
    \ sys.argv[1:])\n        print(json.dumps(result))\n    except DiagnosticRejected\
    \ as error:\n        print(json.dumps({'status': 'failed', 'stage': error.stage,\
    \ 'reason': 'recovery_not_confirmed_do_not_retry'}))\n        return 1\n    except\
    \ Exception:\n        print('{\"status\":\"failed\",\"reason\":\"recovery_not_confirmed_do_not_retry\"\
    }')\n        return 1\n    return 0\nif __name__ == '__main__': sys.exit(main())\n"
