  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infra-contracts-recovery
  namespace: ai-operations
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - ai-operations-ssh-config
  - infrastructure-contracts
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
