  name: infra-contracts-recovery
  namespace: ai-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-contracts-recovery
subjects:
- kind: ServiceAccount
  name: infra-contracts-recovery
  namespace: flux-system
---
