---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infra-contracts-recovery
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app: infra-contracts-recovery
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: infra-contracts-recovery-dryrun-v4
  namespace: flux-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: infra-contracts-recovery
    spec:
      restartPolicy: Never
      serviceAccountName: infra-contracts-recovery
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: restore
        image: ghcr.io/getsops/sops@sha256:857f5a151ac0b2bfc55c1e4e5581d66fb8e268e4d106b38e74191f3bac9d58ea
        command:
        - python3
        - -B
        - /input/restore.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
        - name: state
          mountPath: /state
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: identity
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      initContainers:
      - name: decrypt
        image: ghcr.io/getsops/sops@sha256:857f5a151ac0b2bfc55c1e4e5581d66fb8e268e4d106b38e74191f3bac9d58ea
        command:
        - python3
        - -B
        - /input/restore.py
        - --prepare
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: input
          mountPath: /input
          readOnly: true
        - name: age
          mountPath: /age
          readOnly: true
        - name: state
          mountPath: /state
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: state
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: input
        configMap:
          name: infra-contracts-recovery
          defaultMode: 288
      - name: age
        secret:
          secretName: sops-age
          defaultMode: 288
          items:
          - key: age.agekey
            path: age.agekey
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: identity
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt

