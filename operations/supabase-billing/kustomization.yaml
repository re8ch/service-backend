apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - billing-stack.yaml
  - postgrest-runtime.yaml
  - network-policy.yaml
  - public-routes.yaml
  - ledger-service-catalog.yaml
  - runtime-authority-migrations.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: supabase-billing-tool-publication-authority-v1
    namespace: supabase-pg-re8ch
    files:
      - migration.sql=tool-publication-authority.sql
  - name: supabase-billing-org-cluster-bindings-v1
    namespace: supabase-pg-re8ch
    files:
      - migration.sql=org-cluster-bindings.sql
  - name: supabase-billing-dynamic-mcp-catalog-v2
    namespace: supabase-pg-re8ch
    files:
      - migration.sql=dynamic-mcp-catalog-authority.sql
