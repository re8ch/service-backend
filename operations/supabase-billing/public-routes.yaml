apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: supabase-billing-api, namespace: supabase-billing}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: billing-supabase-https}]
  hostnames: [billing-supabase.re8ch.com]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /auth/v1}}
        - {path: {type: PathPrefix, value: /rest/v1}}
        - {path: {type: PathPrefix, value: /realtime/v1}}
        - {path: {type: PathPrefix, value: /storage/v1}}
      backendRefs: [{name: supabase-billing-kong, port: 8000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: supabase-billing-studio, namespace: supabase-billing}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: billing-studio-https}]
  hostnames: [billing-studio.re8ch.com]
  rules: [{backendRefs: [{name: supabase-billing-kong, port: 8000}]}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supabase-billing-dns
  namespace: supabase-billing
  labels: {networking.re8ch.com/dns-authority: public-edge}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: billing-supabase.re8ch.com,billing-studio.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: billing-supabase.re8ch.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: supabase-billing-kong, port: {number: 8000}}}}]}
    - host: billing-studio.re8ch.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: supabase-billing-kong, port: {number: 8000}}}}]}
