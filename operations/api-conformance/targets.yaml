apiVersion: conformance.re8ch.com/v1alpha1
kind: APIConformanceTarget
metadata:
  name: cloud-functions-identity
  namespace: api-conformance-system
  annotations:
    conformance.re8ch.com/activation-blockers: dedicated-canary-auth-secret,reviewed-cleanup-fixture,github-app-installation
spec:
  serviceRef: identity.re8ch.v2
  repository: re8ch/cloud-functions
  commit: e37a09c132aaca7779495f78d10deef4547cab5f
  branch: master
  baseUrl: https://api.re8ch.com/auth
  suspend: true
  schema:
    url: https://api.re8ch.com/auth/v2/openapi.yaml
    sha256: 61426b8acbde14744fda187c805b79b298f25ec2823c7c9735d35548c71e2742
  network: {allowedHosts: [api.re8ch.com]}
  operations:
    readOperationIds: [listUsers, getUser, listOrganizations, getOrganization, listOrganizationMembers]
    mutationOperationIds: [createUser, updateUser, deleteUser, createOrganization, renameOrganization, addOrganizationMember, updateOrganizationMember, removeOrganizationMember, archiveOrganization]
    allowGeneratedMutations: false
  limits: {maxExamples: 25, maxRequests: 500, ratePerSecond: 1, timeoutSeconds: 600}
  schedule: {readSeconds: 21600, mutationSeconds: 86400}
  canary: {tenantRef: schemathesis-canary-identity}
---
