apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apiconformancetargets.conformance.re8ch.com
spec:
  group: conformance.re8ch.com
  scope: Namespaced
  names:
    plural: apiconformancetargets
    singular: apiconformancetarget
    kind: APIConformanceTarget
    shortNames: [act]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Ready, type: boolean, jsonPath: .status.ready}
    - {name: Result, type: string, jsonPath: .status.lastResult}
    - {name: Run, type: string, jsonPath: .status.lastRunRef}
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [serviceRef, repository, commit, branch, baseUrl, schema, network, operations, limits]
            properties:
              serviceRef: {type: string, minLength: 1}
              repository: {type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'}
              commit: {type: string, pattern: '^[a-f0-9]{40}$'}
              branch: {type: string, minLength: 1}
              imageDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
              baseUrl: {type: string, pattern: '^https://'}
              suspend: {type: boolean, default: false}
              schema:
                type: object
                required: [url, sha256]
                properties:
                  url: {type: string, pattern: '^https://'}
                  sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
              network:
                type: object
                required: [allowedHosts]
                properties:
                  allowedHosts:
                    type: array
                    minItems: 1
                    items: {type: string, pattern: '^[A-Za-z0-9.-]+$'}
              operations:
                type: object
                required: [readOperationIds, mutationOperationIds]
                properties:
                  readOperationIds: {type: array, items: {type: string, minLength: 1}}
                  mutationOperationIds: {type: array, items: {type: string, minLength: 1}}
                  allowGeneratedMutations: {type: boolean, default: false}
              limits:
                type: object
                required: [maxExamples, maxRequests, ratePerSecond, timeoutSeconds]
                properties:
                  maxExamples: {type: integer, minimum: 1, maximum: 100}
                  maxRequests: {type: integer, minimum: 1, maximum: 2000}
                  ratePerSecond: {type: integer, minimum: 1, maximum: 5}
                  timeoutSeconds: {type: integer, minimum: 60, maximum: 900}
              schedule:
                type: object
                properties:
                  readSeconds: {type: integer, minimum: 900, default: 21600}
                  mutationSeconds: {type: integer, minimum: 3600, default: 86400}
              github:
                type: object
                required: [installationId]
                properties: {installationId: {type: string, pattern: '^[0-9]+$'}}
              authSecretRef:
                type: object
                required: [name]
                properties:
                  name: {type: string, minLength: 1}
                  key: {type: string, default: authorization}
              canary:
                type: object
                properties:
                  tenantRef: {type: string, pattern: '^schemathesis-canary[A-Za-z0-9_.-]*$'}
                  resourceRef: {type: string}
              lifecycle:
                type: object
                properties:
                  setup:
                    type: array
                    items: &lifecycleStep
                      type: object
                      required: [method, path, expectedStatuses]
                      properties:
                        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
                        path: {type: string, pattern: '^/'}
                        body: {x-kubernetes-preserve-unknown-fields: true}
                        expectedStatuses: {type: array, minItems: 1, items: {type: integer, minimum: 100, maximum: 599}}
                        capture: {type: object, additionalProperties: {type: string, pattern: '^\\$\\.'}}
                  reversal: {type: array, items: *lifecycleStep}
                  cleanup:
                    type: array
                    minItems: 1
                    items: *lifecycleStep
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apiconformanceruns.conformance.re8ch.com
spec:
  group: conformance.re8ch.com
  scope: Namespaced
  names:
    plural: apiconformanceruns
    singular: apiconformancerun
    kind: APIConformanceRun
    shortNames: [acr]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Target, type: string, jsonPath: .spec.targetRef}
    - {name: Mode, type: string, jsonPath: .spec.mode}
    - {name: Phase, type: string, jsonPath: .status.phase}
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [targetRef, mode, trigger, commit]
            properties:
              targetRef: {type: string, minLength: 1}
              mode: {type: string, enum: [read, mutation]}
              trigger: {type: string, enum: [schedule, deployment, manual]}
              commit: {type: string, pattern: '^[a-f0-9]{40}$'}
              imageDigest: {type: string, pattern: '^$|^sha256:[a-f0-9]{64}$'}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
