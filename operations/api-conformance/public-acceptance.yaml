# This target proves public/anonymous contracts and the result delivery path.
# It does not assert authenticated CRUD, wallet balances or ledger conservation.
apiVersion: conformance.re8ch.com/v1alpha1
kind: APIConformanceTarget
metadata:
  name: commerce-public-contract
  namespace: api-conformance-system
spec:
  serviceRef: commerce.re8ch.v1
  github: {installationId: "171153917"}
  repository: re8ch/cloud-functions
  commit: 81a757cdb10784d69957c7a4e7aee8568d36a295
  imageDigest: sha256:cc16ca8150d4140e988dbdfdfc8653f15472be1ff15ee3aefe59b243c52d0e4c
  branch: master
  baseUrl: https://api.re8ch.com/commerce
  suspend: false
  schema:
    url: https://api.re8ch.com/commerce/v1/openapi.yaml
    sha256: 9d4084209c3d6e30dff411ba7a36859af3a94524c373727eb7140034a2f10d00
  # restricted-node-6dc3f140f9's declared public authority. FQDN policy remains in place; this
  # single pinned address is placed in the runner hosts file and egress policy.
  # restricted-node-6dc3f140f9's public IP is classified as reserved:host by Cilium. CIDR policy
  # cannot select it; the reviewed host entity is restricted to TCP 443.
  network: {allowedHosts: [api.re8ch.com], pinnedEgressIPs: {api.re8ch.com: 192.0.2.138}, pinnedEgressEntity: host}
  operations:
    readOperationIds: [commerceHealth, listCommerceOrders]
    mutationOperationIds: []
    allowGeneratedMutations: false
  # Envoy rejects extension method QUERY with HTTP/1.1 400 before app routing;
  # HTTP/2 returns 405. Schemathesis 4.29.1 requires 405 in both transports.
  # Keep every response/schema/auth check; exempt only this transport probe.
  checks:
    exclude: [unsupported_method]
    rationale: Envoy returns 400 for HTTP/1.1 QUERY before app routing; HTTP/2 returns 405, so this single transport probe cannot be enforced at the application API.
  limits: {maxExamples: 5, maxRequests: 100, ratePerSecond: 1, timeoutSeconds: 180}
  schedule: {readSeconds: 21600}
---
# Anonymous identity denial/response contract only. The authenticated CRUD
# target remains suspended until dedicated canary credentials and cleanup exist.
apiVersion: conformance.re8ch.com/v1alpha1
kind: APIConformanceTarget
metadata:
  name: identity-public-denial-contract
  namespace: api-conformance-system
spec:
  serviceRef: identity.re8ch.v2
  github: {installationId: "171153917"}
  repository: re8ch/cloud-functions
  commit: 81a757cdb10784d69957c7a4e7aee8568d36a295
  imageDigest: sha256:d83d0a9278d686c74022b203f26420433deeebf0ab83efc23b0312565e82205e
  branch: master
  baseUrl: https://api.re8ch.com/auth
  suspend: false
  schema:
    url: https://api.re8ch.com/auth/v2/openapi.yaml
    sha256: 61426b8acbde14744fda187c805b79b298f25ec2823c7c9735d35548c71e2742
  network: {allowedHosts: [api.re8ch.com], pinnedEgressIPs: {api.re8ch.com: 192.0.2.138}, pinnedEgressEntity: host}
  operations:
    readOperationIds: [listUsers, listOrganizations]
    mutationOperationIds: []
    allowGeneratedMutations: false
  checks:
    exclude: [unsupported_method]
    rationale: Envoy returns 400 for HTTP/1.1 QUERY before app routing; HTTP/2 returns 405, so this single transport probe cannot be enforced at the application API.
  # Coverage generates 63 cases; the initial 100-second engine cap expired
  # before the report on restricted-node-6dc3f140f9. Retain 1 req/s and a finite 200-request cap.
  limits: {maxExamples: 3, maxRequests: 200, ratePerSecond: 1, timeoutSeconds: 240}
  schedule: {readSeconds: 21600}
---
