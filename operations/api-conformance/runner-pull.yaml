# Enable only after runner-runtime bootstrap RBAC and its Secret boundary apply.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: api-conformance-runner-pull}
spec:
  admission: true
  background: true
  generateExisting: true
  validationFailureAction: Audit
  rules:
  - name: project-shared-runtime-pull
    match:
      any:
      - resources: {kinds: [Namespace], names: [api-conformance-runners]}
    generate:
      apiVersion: v1
      kind: Secret
      name: harbor-functions-shared-pull
      namespace: api-conformance-runners
      synchronize: true
      clone: {namespace: toolhive-system, name: harbor-functions-shared-pull}
