apiVersion: v1
kind: Namespace
metadata:
  name: api-conformance-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    scheduling.re8ch.com/control-plane-allowed: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-conformance-controller, namespace: api-conformance-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: api-conformance-controller, namespace: api-conformance-system}
rules:
- apiGroups: [conformance.re8ch.com]
  resources: [apiconformancetargets, apiconformanceruns]
  verbs: [get, list, watch, create, patch]
- apiGroups: [conformance.re8ch.com]
  resources: [apiconformancetargets/status, apiconformanceruns/status]
  verbs: [get, patch, update]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/log]
  verbs: [get]
- apiGroups: [cilium.io]
  resources: [ciliumnetworkpolicies]
  verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-conformance-controller, namespace: api-conformance-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: api-conformance-controller}
subjects: [{kind: ServiceAccount, name: api-conformance-controller, namespace: api-conformance-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: api-conformance-controller}
rules:
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: api-conformance-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: api-conformance-controller}
subjects: [{kind: ServiceAccount, name: api-conformance-controller, namespace: api-conformance-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-conformance-controller, namespace: api-conformance-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: api-conformance-controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: api-conformance-controller}}
    spec:
      serviceAccountName: api-conformance-controller
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: controller
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        command: [python, /app/controller.py]
        resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 300m, memory: 192Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        env:
        - {name: CODE_CONFIG_MAP, value: api-conformance-code}
        - {name: GITHUB_REPOSITORY_INSTALLATIONS, value: '{"re8ch/cloud-functions":"171153917"}'}
        - {name: DISCOVERY_ENABLED, value: "false"}
        - {name: RUNNER_PULL_SECRET, value: harbor-functions-shared-pull}
        - {name: RUNNER_NAMESPACE, value: api-conformance-runners}
        - {name: RUNNER_IMAGE, value: 'registry.re8ch.com/functions-shared/api-conformance-runner@sha256:f91f4d46e1eff19bcd68917e683fb8a43565c4aa403af0309453ec8ca7a9c418'}
        # Explicitly reviewed R640 node address from public-mesh inventory.
        - {name: HOST_IDENTITY_EGRESS_IPS, value: '["223.159.210.222"]'}
        - {name: RESULT_DELIVERY_MODE, value: oidc}
        # R640 pod egress to GitHub times out; the established local control
        # plane proxy has a healthy GitHub path and keeps the App token scoped.
        - {name: HTTPS_PROXY, value: 'http://10.43.179.196:17893'}
        - {name: NO_PROXY, value: 'localhost,127.0.0.1,::1,.svc,.cluster.local,10.0.0.0/8,100.64.0.0/10'}
        - {name: RESULT_REPOSITORY_BINDINGS, value: '{"re8ch/cloud-functions":{"repositoryId":"1248776882","ownerId":"283958313"}}'}
        - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: GITHUB_APP_ID, valueFrom: {secretKeyRef: {name: api-conformance-github-app, key: app-id, optional: true}}}
        volumeMounts:
        - {name: code, mountPath: /app, readOnly: true}
        - {name: github-app, mountPath: /github-app, readOnly: true}
      volumes:
      - {name: code, configMap: {name: api-conformance-code}}
      - name: github-app
        secret: {secretName: api-conformance-github-app, optional: true, items: [{key: private-key.pem, path: private-key.pem}]}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: api-conformance-default-deny, namespace: api-conformance-system}
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: api-conformance-controller, namespace: api-conformance-system}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: api-conformance-controller}}
  egress:
  - toEntities: [kube-apiserver]
  - toEndpoints: [{matchLabels: {'k8s:io.kubernetes.pod.namespace': kube-system, 'k8s:app.kubernetes.io/name': advanced-fabric-doh}}]
    toPorts:
    - ports: [{port: "53", protocol: UDP}, {port: "53", protocol: TCP}]
      rules: {dns: [{matchPattern: '*'}]}
  - toFQDNs: [{matchName: api.github.com}]
    toPorts: [{ports: [{port: "443", protocol: TCP}]}]
  - toEntities: [host]
    toPorts: [{ports: [{port: "17893", protocol: TCP}]}]
---
# Clone only the existing shared-runtime pull credential through the established
# Kyverno pattern. No plaintext credential enters Git, agent output or a pod mount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: api-conformance-pull-source, namespace: toolhive-system}
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [harbor-functions-shared-pull]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-conformance-pull-source, namespace: toolhive-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: api-conformance-pull-source}
subjects:
- {kind: ServiceAccount, name: kyverno-admission-controller, namespace: kyverno}
- {kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: api-conformance-pull-target, namespace: api-conformance-system}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [harbor-functions-shared-pull]
  verbs: [get, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: api-conformance-pull-target, namespace: api-conformance-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: api-conformance-pull-target}
subjects:
- {kind: ServiceAccount, name: kyverno-admission-controller, namespace: kyverno}
- {kind: ServiceAccount, name: kyverno-background-controller, namespace: kyverno}
