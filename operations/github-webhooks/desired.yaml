apiVersion: collaboration.re8ch.com/v1alpha1
kind: GitHubWebhookSet
metadata:
  name: re8ch-agent-automation-mvp
spec:
  organization:
    login: re8ch
    active: true
    events: [issues, issue_comment, pull_request, pull_request_review, push, workflow_run]
    urlEnvironment: RE8CH_AUTOMATION_WEBHOOK_URL
    secretEnvironment: RE8CH_AUTOMATION_WEBHOOK_SECRET
  repositoryExceptions:
    - repository: re8ch/service-backend
      ownership: flux
      policy: retain
      reason: Existing push webhook feeds Flux source reconciliation; organization automation must not replace it.
