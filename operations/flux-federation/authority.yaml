apiVersion: gitops.re8ch.com/v1alpha1
kind: FluxFederationAuthority
metadata:
  name: re8ch
spec:
  migrationOrder:
    - observability-metering
    - agent-runtime
    - identity-access
    - networking
  domains:
    observability-metering:
      organization: siren-observer
      repository: ssh://git@ssh.github.com:443/siren-observer/observability-gitops.git
      controllerNamespace: flux-observability-system
      lock: 9ddb096b25ee9b1ab0d37f730c504b7b13bea626
      state: autonomous
    agent-runtime:
      organization: re8ch-ai
      repository: ssh://git@ssh.github.com:443/re8ch-ai/agent-gitops.git
      controllerNamespace: flux-agent-system
      lock: fe9cae9809804832433c73decdd9dc9fceddcbee
      state: autonomous
    identity-access:
      organization: re8ch
      repository: ssh://git@ssh.github.com:443/re8ch/identity-gitops.git
      controllerNamespace: flux-identity-system
      lock: 04dcbe952d261f533bbc179a5c2767e7280b3cb2
      state: autonomous
    networking:
      organization: pillars-infra
      repository: ssh://git@ssh.github.com:443/pillars-infra/network-gitops.git
      controllerNamespace: flux-network-system
      lock: 1fdda9a16730d0b440b8cce1a0ba528df07a7af8
      state: autonomous
  sharedBootstrapSecrets:
    - sops-age
    - gitops-oci-reader
  allowedSigningIdentities:
    - Woomou GitHub SSH signing key
    - GitHub web-flow merge signing key
  mainFluxOwns:
    - flux-crds
    - autonomous-controller-lifecycle
    - namespaces
    - global-rbac
    - shared-gateway-authority
    - secret-and-policy-boundaries
  controllerVersion: v2.6.1
