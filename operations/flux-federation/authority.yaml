apiVersion: gitops.re8ch.com/v1alpha1
kind: FluxFederationAuthority
metadata:
  name: re8ch
spec:
  migrationOrder:
    - observability-metering
    - agent-runtime
    - identity-access
    - networking
  domains:
    observability-metering:
      organization: siren-observer
      repository: ssh://git@ssh.github.com:443/siren-observer/observability-gitops.git
      controllerNamespace: flux-observability-system
