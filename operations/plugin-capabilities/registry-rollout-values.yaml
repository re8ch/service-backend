# Reference values for the reviewed ToolHive directory promotion. The directory
# exposes one RE8CH entry; tenant-native resolves the authenticated organization,
# membership and grants before publishing its capability schema.
sources:
  - name: re8ch-unified
    file: {path: /etc/re8ch-approved-catalog/registry.json}
    syncPolicy: {interval: 1m}
release:
  values:
    extraVolumes:
      - name: re8ch-approved-catalog
        configMap: {name: re8ch-approved-tool-catalog}
    extraVolumeMounts:
      - {name: re8ch-approved-catalog, mountPath: /etc/re8ch-approved-catalog, readOnly: true}
    config:
      sources:
        - name: re8ch-unified
          file: {path: /etc/re8ch-approved-catalog/registry.json}
          syncPolicy: {interval: 1m}
      registries:
        - name: approved
          sources: [re8ch-unified]
