# Apply in a separate signed GitOps promotion after the matching Cloud Platform
# image has passed authenticated tools/list and operation acceptance.
# Merge into platform/connectool/release.yaml spec.values.toolhive.registry.
# Existing managed sources and registry membership are deliberately retained.
sources:
  - name: re8ch-plugin-operations
    file: {path: /etc/re8ch-plugin-catalog/registry.json}
    syncPolicy: {interval: 1m}
  - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
  - {name: re8ch-managed, managed: {}}
release:
  values:
    extraVolumes:
      - name: re8ch-plugin-catalog
        configMap: {name: re8ch-plugin-operation-catalog}
    extraVolumeMounts:
      - {name: re8ch-plugin-catalog, mountPath: /etc/re8ch-plugin-catalog, readOnly: true}
    config:
      sources:
        - name: re8ch-plugin-operations
          file: {path: /etc/re8ch-plugin-catalog/registry.json}
          syncPolicy: {interval: 1m}
        - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
        - {name: re8ch-managed, managed: {}}
      registries:
        - name: approved
          sources: [re8ch-plugin-operations, managed-workloads, re8ch-managed]
