version: 1

external_inputs:
  platform/runtime-anatomy:
    - clusters/re8ch/charts/runtime-anatomy/**
  platform/birfucate-metering:
    - clusters/re8ch/charts/birfucate-metering/**

# Every deployable Kustomize root belongs to exactly one domain.  `impact.py`
# validates this inventory before selecting tests, so a new root cannot silently
# bypass CI.
shared_paths:
  - .github/workflows/ci.yml
  - .github/workflows/full-regression.yml
  - .github/workflows/github-security-checks.yml
  - operations/ci/**
  - operations/workspace-controller/**
  - schemas/**
  - contracts/infrastructure/**
  - operations/infrastructure-contract/**
  - operations/github-maintenance/**
  - clusters/re8ch/secrets/infrastructure-contracts.sops.yaml
  - clusters/re8ch/secrets/cluster-node-inventory.sops.yaml
  - clusters/re8ch/secrets/ai-operations-inventory.sops.yaml
  - tests/conftest.py
  - tests/validate_schemas.py
  - operations/releases/codenames.yaml
  - clusters/re8ch/kustomization.yaml
  - clusters/re8ch/domain-sources/kustomization.yaml
  - clusters/re8ch/flux-system/**

# A change to a domain-specific workflow is validated by that workflow and by
# the baseline GitHub policy checks. It must not expand control-plane CI to all
# domains merely because the file lives under .github/workflows.
ci_metadata_paths:
  - .github/workflows/**
  - .github/dependabot.yml

always_tests:
  - tests/test_incremental_ci.py

# Repository tools that validate or compile desired state but do not own a
# deployable Kustomize root. Keeping these mappings explicit lets CI run their
# contract tests without treating the path as an unknown, repository-wide risk.
focused_suites:
  unit-evidence-consumers:
    paths:
    - tests/test_unit_evidence.py
    tests:
    - tests/test_unit_pr.py
  domain-publication:
    paths:
      - operations/releases/domain_publish.py
    tests:
      - tests/test_domain_publication.py

  kustomize-render:
    paths:
    - tests/kustomize_render.py
    tests:
    - tests/test_kustomize_render.py
  native-yaml-contract:
    paths:
    - operations/releases/helmrelease_inventory.py
    - operations/flux-lightweight/inventory.py
    - operations/ci/impact.py
    - operations/releases/compile_main_domain_ssa.py
    - operations/releases/unified_bundle.py
    - operations/workspace-controller/workspace.py
    - operations/flux-federation/validate.py
    - tests/test_domain_reconcilers.py
    - tests/test_main_domain_ssa.py
    - tests/test_flux_controller_ha.py
    - tests/test_flux_fast_reconcile.py
    - tests/test_flux_image_controller_retirement.py
    - tests/test_tenant_infrastructure_gitops.py
    - tests/test_release_codenames.py
    - operations/releases/helmrelease-inventory.yaml
    - operations/releases/helmrelease-classifications.yaml
    - operations/ci/domain-catalog.yaml
    - clusters/re8ch/flux-federation/controllers.yaml
    - clusters/re8ch/domains/identity-access/resources.yaml
    tests:
    - tests/test_native_yaml_loader.py

domains:
  control-plane:
    theme: constellations
    paths:
      - operations/github-policy-reviewer/**
      - catalogs/**
      - indexes/**
      - workspace.yaml
      - platform/workspace-controller/**
      - platform/git-workspaces/**
      - clusters/re8ch/components/codex-app-server-console/**
      - clusters/re8ch/components/ai-operations/sandbox-trials/**
      - clusters/re8ch/domains/agent-runtime/**
      - clusters/re8ch/flux-federation/**
      - operations/flux-federation/**
    roots:
      - platform/workspace-controller
      - platform/git-workspaces
      - clusters/re8ch/components/codex-app-server-console
      - clusters/re8ch/components/ai-operations/sandbox-trials
      - clusters/re8ch/domains/agent-runtime
      - clusters/re8ch/flux-federation
    tests:
      - tests/test_github_policy_reviewer.py
      - tests/test_workspace_controller.py
      - tests/test_workspace_mirror.py
      - tests/test_declarations.py

  networking:
    theme: winds
    paths:
      - operations/network/**
      - platform/advanced-fabric/**
      - platform/among-clusters/**
      - platform/public-edge-manager/**
      - clusters/re8ch/components/egress-fabric/**
      - clusters/re8ch/components/multicloud-functions-dns/**
      - clusters/re8ch/components/network/**
      - clusters/re8ch/components/regional-routing/**
      - clusters/re8ch/domains/networking/**
    roots:
