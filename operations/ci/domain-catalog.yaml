version: 1

external_inputs:
  platform/runtime-anatomy:
    - clusters/re8ch/charts/runtime-anatomy/**
  platform/birfucate-metering:
    - clusters/re8ch/charts/birfucate-metering/**

# Every deployable Kustomize root belongs to exactly one domain.  `impact.py`
# validates this inventory before selecting tests, so a new root cannot silently
# bypass CI.
shared_paths:
  - .github/workflows/ci.yml
  - .github/workflows/full-regression.yml
  - .github/workflows/github-security-checks.yml
  - operations/ci/**
  - operations/workspace-controller/**
  - schemas/**
  - contracts/infrastructure/**
  - operations/infrastructure-contract/**
  - operations/github-maintenance/**
  - clusters/re8ch/secrets/infrastructure-contracts.sops.yaml
  - clusters/re8ch/secrets/cluster-node-inventory.sops.yaml
  - clusters/re8ch/secrets/ai-operations-inventory.sops.yaml
  - tests/conftest.py
  - tests/kustomize_render.py
  - tests/validate_schemas.py
  - clusters/re8ch/kustomization.yaml
  - clusters/re8ch/domain-sources/kustomization.yaml
  - clusters/re8ch/flux-system/**

# A change to a domain-specific workflow is validated by that workflow and by
# the baseline GitHub policy checks. It must not expand control-plane CI to all
# domains merely because the file lives under .github/workflows.
ci_metadata_paths:
  - .github/workflows/**
  - .github/dependabot.yml

always_tests:
  - tests/test_github_bot_merge.py
  - tests/test_infrastructure_contracts.py
  - tests/test_git_k8s_manifests.py
  - tests/test_git_governance_gate.py
  - tests/test_incremental_ci.py
  - tests/test_release_codenames.py
  - tests/test_domain_oci_release.py
  - tests/test_domain_publication.py
  - tests/test_live_domain_sources.py
  - tests/test_domain_reconcilers.py

# Repository tools that validate or compile desired state but do not own a
# deployable Kustomize root. Keeping these mappings explicit lets CI run their
# contract tests without treating the path as an unknown, repository-wide risk.
focused_suites:
  domain-publication:
    paths:
      - operations/releases/domain_publish.py
    tests:
      - tests/test_domain_publication.py

domains:
  control-plane:
    theme: constellations
    paths:
      - operations/github-policy-reviewer/**
      - catalogs/**
      - indexes/**
      - workspace.yaml
      - platform/workspace-controller/**
      - platform/git-workspaces/**
      - clusters/re8ch/components/codex-app-server-console/**
      - clusters/re8ch/components/ai-operations/sandbox-trials/**
      - clusters/re8ch/domains/agent-runtime/**
      - clusters/re8ch/flux-federation/**
      - operations/flux-federation/**
    roots:
      - platform/workspace-controller
      - platform/git-workspaces
      - clusters/re8ch/components/codex-app-server-console
      - clusters/re8ch/components/ai-operations/sandbox-trials
      - clusters/re8ch/domains/agent-runtime
      - clusters/re8ch/flux-federation
    tests:
      - tests/test_github_policy_reviewer.py
      - tests/test_workspace_controller.py
      - tests/test_workspace_mirror.py
      - tests/test_declarations.py

  networking:
    theme: winds
    paths:
      - operations/network/**
      - platform/advanced-fabric/**
      - platform/among-clusters/**
      - platform/public-edge-manager/**
      - clusters/re8ch/components/egress-fabric/**
      - clusters/re8ch/components/multicloud-functions-dns/**
      - clusters/re8ch/components/network/**
      - clusters/re8ch/components/regional-routing/**
      - clusters/re8ch/domains/networking/**
    roots:
      - platform/advanced-fabric
      - platform/among-clusters
      - platform/public-edge-manager
      - clusters/re8ch/components/egress-fabric
      - clusters/re8ch/components/egress-fabric/mihomo-node-labeler
      - clusters/re8ch/components/multicloud-functions-dns/anycam
      - clusters/re8ch/components/multicloud-functions-dns/base
      - clusters/re8ch/components/multicloud-functions-dns/ledger
      - clusters/re8ch/components/network/podcidr-fabric
      - clusters/re8ch/components/network/host-network-controller
      - clusters/re8ch/components/regional-routing
      - clusters/re8ch/domains/networking
    tests:
      - tests/test_advanced_fabric.py
      - tests/test_advanced_fabric_control_plane.py
      - tests/test_advanced_fabric_dns_authority.py
      - tests/test_among_clusters.py
      - tests/test_among_clusters_service.py
      - tests/test_gateway_api_ingress_migration.py
      - tests/test_private_transit_config.py
      - tests/test_public_mesh_config.py
      - tests/test_host_network_agent.py
      - tests/test_routeros_transit_controller.py
      - tests/test_network_fabric_model.py
      - tests/test_public_mesh_identity_routes.py
      - tests/test_r640_public_authority.py
      - tests/test_public_edge_publisher.py

  identity-access:
    theme: guardians
    paths:
      - platform/agent-onboarding-runtime/**
      - platform/apps/access-subscription/**
      - platform/paralus/**
      - platform/secretary-system/**
      - clusters/re8ch/components/netbird-access/**
      - clusters/re8ch/components/personal-access/**
      - clusters/re8ch/components/re8ch-business-namespaces/**
      - clusters/re8ch/domains/identity-access/**
    roots:
      - platform/agent-onboarding-runtime
      - platform/apps/access-subscription
      - platform/paralus
      - platform/secretary-system
      - clusters/re8ch/components/netbird-access
      - clusters/re8ch/components/personal-access
      - clusters/re8ch/components/re8ch-business-namespaces
      - clusters/re8ch/domains/identity-access
    tests:
      - tests/test_dex_egress.py
      - tests/test_identity_egress.py
      - tests/test_native_mcp_oauth_gitops.py

  observability:
    theme: lenses
    paths:
      - platform/observability-source/**
      - platform/observability/**
      - clusters/re8ch/components/synthetic-monitoring/**
      - operations/k6/**
      - operations/api-conformance/**
      - clusters/re8ch/domains/observability-metering/**
    roots:
      - platform/observability-source
      - platform/observability/bootstrap
      - platform/observability/opencost-recovery
      - platform/observability/production
      - clusters/re8ch/components/synthetic-monitoring
      - operations/api-conformance
      - clusters/re8ch/domains/observability-metering
    tests:
      - tests/test_observability.py
      - tests/test_k6_contracts.py
      - tests/test_k6_summary.py
      - tests/test_api_conformance_system.py

  tenant-runtime:
    theme: habitats
    paths:
      - operations/tenant-conformance/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
      - platform/apps/tenant-mcp/**
      - clusters/re8ch/tenant-mcp-image/**
      - clusters/re8ch/flux-system/tenant-mcp-image.yaml
      - platform/cloud-platform/**
      - platform/runtime-anatomy/**
      - platform/scheduling-fabric/**
      - clusters/re8ch/components/plugin-runtime/**
      - clusters/re8ch/components/cloud-disk/**
      - clusters/re8ch/components/release-compat/**
      - operations/cloud-disk/**
      - clusters/re8ch/domains/data-storage/**
      - clusters/re8ch/domains/tenant-runtime/**
      - clusters/re8ch/domains/main-legacy/**
    roots:
      - platform/cloud-platform
      - clusters/re8ch/tenant-mcp-image
      - platform/runtime-anatomy
      - platform/scheduling-fabric
      - platform/scheduling-fabric/resources
      - platform/scheduling-fabric/governance/controllers
      - platform/scheduling-fabric/governance/policies
      - clusters/re8ch/components/plugin-runtime
      - clusters/re8ch/components/cloud-disk
      - clusters/re8ch/components/release-compat
      - clusters/re8ch/domains/data-storage
      - clusters/re8ch/domains/tenant-runtime
      - clusters/re8ch/domains/main-legacy/data-storage
      - clusters/re8ch/domains/main-legacy/commerce-billing
      - clusters/re8ch/domains/main-legacy/delivery-products
      - clusters/re8ch/domains/main-legacy/operations-ui
      - clusters/re8ch/domains/main-legacy/tenant-runtime
    tests:
      - tests/test_cloud_platform.py
      - tests/test_cloud_platform_manifest.py
      - tests/test_runtime_anatomy_canary_script.py
      - tests/test_runtime_anatomy_chart.py
      - tests/test_runtime_anatomy_controller.py
      - tests/test_tenant_broker.py
      - tests/test_tenant_control_controller.py
      - tests/test_tenant_infrastructure.py
      - tests/test_tenant_infrastructure_gitops.py
      - tests/test_tenant_image_delivery.py
      - tests/test_scheduling_governance.py
      - tests/test_ceph_static_release.py
      - tests/test_ssa_release_executor.py

  delivery:
    theme: waypoints
    paths:
      - inventory/public-sites.yaml
      - schemas/public-site-catalog.schema.json
      - operations/public-sites/**
      - tests/test_public_sites.py
      - platform/adapter/**
      - platform/connectool/**
      - platform/external-projects/**
      - platform/hyperswitch/**
      - clusters/re8ch/domains/delivery-products/**
    roots:
      - platform/adapter
      - platform/connectool
      - platform/external-projects
      - platform/external-projects/ontology-microscope
      - platform/hyperswitch
      - clusters/re8ch/domains/delivery-products
    tests:
      - tests/test_adapter.py
      - tests/test_adapter_chart.py
      - tests/test_connectool_chart.py
      - tests/test_connectool_delivery.py
      - tests/test_hyperswitch_gitops.py
      - tests/test_ontology_neuronpedia_gitops.py
    submodules:
      - catalogs/platform/modules/connectool/source

  operations-ui:
    theme: beacons
    paths:
      - platform/incidentrelay/**
      - platform/headlamp/**
      - platform/stalwart/**
      - clusters/re8ch/domains/operations-ui/**
    roots:
      - platform/incidentrelay
      - platform/headlamp
      - platform/stalwart
      - clusters/re8ch/domains/operations-ui
    tests:
      - tests/test_headlamp_birfucate_browser.py
      - tests/test_headlamp_plugin_catalog.py
      - tests/test_incidentrelay_gitops.py

  metering:
    theme: currents
    paths:
      - platform/birfucate-metering/**
    roots:
      - platform/birfucate-metering
    tests:
      - tests/test_birfucate_discovery.py
      - tests/test_birfucate_metering.py

  commerce-billing:
    theme: currents
    paths:
      - operations/commerce/**
      - operations/supabase-billing/**
      - clusters/re8ch/components/payments/**
      - clusters/re8ch/secrets/commerce-*.sops.yaml
      - clusters/re8ch/secrets/ledger-wechat-app-identities.sops.yaml
      - clusters/re8ch/domains/commerce-billing/**
    roots:
      - operations/supabase-billing
      - clusters/re8ch/domains/commerce-billing
    tests:
      - tests/test_payment_postgrest_resources.py
      - tests/test_supabase_billing_stack.py

# Inputs of standalone CI checks. Shared/unknown changes enable every check.
# These declarations narrow execution, not ownership or required status checks.
check_paths:
  workspace: [catalogs/**, indexes/**, workspace/**, workspace.yaml, operations/workspace-controller/**]
  helm_inventory: [clusters/**, platform/**, operations/releases/helmrelease_inventory.py, operations/releases/helmrelease-*.yaml]
  commerce: [operations/commerce/**]
  k6: [operations/k6/**, clusters/re8ch/components/synthetic-monitoring/**, tests/test_k6*]
  schemas: [schemas/**, plugins/**, inventory/**, catalogs/**, .re8ch/**, deployments/**, releases/**, tenant-claims/**, workspace/**, tests/validate_schemas.py]
  fabric: [operations/network/**, clusters/re8ch/components/network/**, contracts/infrastructure/**]
  encrypted: [contracts/infrastructure/**, operations/infrastructure-contract/**, clusters/re8ch/secrets/**]
  public_authority: [operations/network/**, platform/advanced-fabric/**, platform/among-clusters/**, operations/scripts/validate-r640-public-authority.py]
  domain_bundles: [clusters/re8ch/domains/**, operations/releases/compile_domain_bundles.py]
  federation: [operations/flux-federation/**, clusters/re8ch/flux-federation/**]
