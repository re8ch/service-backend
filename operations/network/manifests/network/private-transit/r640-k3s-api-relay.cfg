# restricted-node-6dc3f140f9 remains a network relay after its K3s server becomes a worker agent.
# Add to the existing HAProxy config directory only after k3s.service stops.
frontend re8ch_k3s_api
    bind *:6443
    mode tcp
    default_backend re8ch_k3s_controlplane

backend re8ch_k3s_controlplane
    mode tcp
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    server a1 192.0.2.242:6443 check check-ssl verify none inter 2s fall 2 rise 2
    server b1 192.0.2.1:6443 check check-ssl verify none inter 2s fall 2 rise 2
    server mubao 192.0.2.223:6443 check check-ssl verify none inter 2s fall 2 rise 2
