# R640 remains a network relay after its K3s server becomes a worker agent.
# Add to the existing HAProxy config directory only after k3s.service stops.
frontend re8ch_k3s_api
    bind *:6443
    mode tcp
    default_backend re8ch_k3s_controlplane

backend re8ch_k3s_controlplane
    mode tcp
    option httpchk GET /readyz
    http-check expect status 200
    server a1 10.250.0.147:6443 check check-ssl verify none inter 2s fall 2 rise 2
    # B1 is a manual DR target. Promotion requires fencing A1, restoring a
    # reviewed snapshot, and explicitly enabling this backend on R640.
    server b1 10.250.0.125:6443 check check-ssl verify none inter 2s fall 2 rise 2 disabled
