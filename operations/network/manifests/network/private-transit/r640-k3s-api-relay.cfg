# R640 API relay for the three-voter production target. Install only after
# R640 has joined the existing cluster as a server and all three direct
# endpoints pass authenticated /readyz checks. The CA path is host-managed.
frontend re8ch_k3s_api
    bind *:6443
    mode tcp
    default_backend re8ch_k3s_controlplane

backend re8ch_k3s_controlplane
    mode tcp
    option httpchk GET /readyz
    http-check expect status 200
    default-server check check-ssl verify required ca-file /var/lib/rancher/k3s/server/tls/server-ca.crt inter 2s fall 2 rise 2
    server r640 127.0.0.1:6443
    server a1 10.250.0.147:6443
    server b1 10.250.0.125:6443
