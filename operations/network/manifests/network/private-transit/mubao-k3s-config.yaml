server: https://10.250.0.128:6443
token-file: /etc/rancher/k3s/server-token
node-name: mubao-wsl
node-ip: 10.250.0.29
cluster-dns: 10.43.65.40
advertise-address: 10.250.0.29
tls-san:
  - 10.250.0.1
  - 10.250.0.29
  - 10.181.22.29
flannel-backend: none
disable-network-policy: true
disable:
  - servicelb
  - coredns
embedded-registry: false
write-kubeconfig-mode: "0600"
node-taint:
  - node-role.kubernetes.io/control-plane=true:NoSchedule
node-label:
  - pigsty.cc/provider=onprem-wsl
  - pigsty.cc/region=loudi
  - pigsty.cc/node-class=control-plane
  - pigsty.cc/workload=control-plane
  - pigsty.cc/zt-ip=10.181.22.29
  - re8ch.com/cilium-migrate=true
  - re8ch.com/control-route=advfab-relay
  - re8ch.com/external-ip-mode=none
  - re8ch.com/public-control=none
  - re8ch.com/public-ip=none
  - networking.re8ch.com/geo=cn
kubelet-arg:
  # Bound pod admission on the shared 10 GiB WSL VM; image pulls stay serialized.
  - max-pods=32
  - serialize-image-pulls=true
  - kube-reserved=cpu=500m,memory=768Mi,ephemeral-storage=2Gi,pid=1024
  - system-reserved=cpu=500m,memory=768Mi,ephemeral-storage=2Gi,pid=1024
  - enforce-node-allocatable=pods
  - eviction-hard=memory.available<1Gi,nodefs.available<10%,imagefs.available<15%,pid.available<10%
kube-apiserver-arg:
  - event-ttl=1h
  - authentication-config=/etc/rancher/k3s/dex-dual-issuer-authentication.yaml
  # API Priority and Fairness uses the sum as its request concurrency ceiling.
  - max-requests-inflight=200
  - max-mutating-requests-inflight=100
etcd-arg:
  - advertise-client-urls=https://10.250.0.29:2379
  - initial-advertise-peer-urls=https://10.250.0.29:2380
  - listen-client-urls=https://10.250.0.29:2379,https://127.0.0.1:2379
  - listen-peer-urls=https://10.250.0.29:2380,https://127.0.0.1:2380
