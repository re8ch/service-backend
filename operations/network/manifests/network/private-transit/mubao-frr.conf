frr version 8.4.4
frr defaults traditional
hostname MUBAO
log syslog informational
service integrated-vtysh-config
!
ip prefix-list MUBAO-SELF-OUT seq 10 permit 192.0.2.223/32
ip prefix-list MUBAO-SELF-OUT seq 20 permit 192.0.2.113/24
ip prefix-list MUBAO-SELF-OUT seq 1000 deny any
ip prefix-list MUBAO-R640-IN seq 10 permit 192.0.2.179/32
ip prefix-list MUBAO-R640-IN seq 15 permit 192.0.2.116/32
ip prefix-list MUBAO-R640-IN seq 20 permit 192.0.2.242/32
ip prefix-list MUBAO-R640-IN seq 30 permit 192.0.2.1/32
ip prefix-list MUBAO-R640-IN seq 40 permit 192.0.2.57/16 ge 24 le 24
ip prefix-list MUBAO-R640-IN seq 1000 deny any
!
ip route 192.0.2.223/32 Null0 254
ip route 192.0.2.113/24 Null0 254
!
router bgp 4200010029
 bgp router-id 192.0.2.223
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 192.0.2.198 remote-as 4200000128
 neighbor 192.0.2.198 update-source 192.0.2.135
 neighbor 192.0.2.198 disable-connected-check
 neighbor 192.0.2.198 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.223/32
  network 192.0.2.113/24
  neighbor 192.0.2.198 activate
  neighbor 192.0.2.198 prefix-list MUBAO-R640-IN in
  neighbor 192.0.2.198 prefix-list MUBAO-SELF-OUT out
  neighbor 192.0.2.198 maximum-prefix 64 90 restart 5
 exit-address-family
!
