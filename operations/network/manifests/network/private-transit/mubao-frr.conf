frr version 8.4.4
frr defaults traditional
hostname MUBAO
log syslog informational
service integrated-vtysh-config
!
ip prefix-list MUBAO-SELF-OUT seq 10 permit 10.250.0.29/32
ip prefix-list MUBAO-SELF-OUT seq 20 permit 10.42.5.0/24
ip prefix-list MUBAO-SELF-OUT seq 1000 deny any
ip prefix-list MUBAO-R640-IN seq 10 permit 10.250.0.128/32
ip prefix-list MUBAO-R640-IN seq 15 permit 10.250.0.1/32
ip prefix-list MUBAO-R640-IN seq 20 permit 10.250.0.147/32
ip prefix-list MUBAO-R640-IN seq 30 permit 10.250.0.125/32
ip prefix-list MUBAO-R640-IN seq 40 permit 10.42.0.0/16 ge 24 le 24
ip prefix-list MUBAO-R640-IN seq 50 permit 10.64.0.0/12 ge 24 le 24
ip prefix-list MUBAO-R640-IN seq 1000 deny any
ip prefix-list ROS-CP-FIB-PEERS seq 10 permit 10.250.0.147/32
ip prefix-list ROS-CP-FIB-PEERS seq 20 permit 10.250.0.125/32
ip prefix-list ROS-CP-FIB-PEERS seq 30 permit 10.64.0.0/12 ge 24 le 24
route-map ROS-CP-FIB-SRC permit 10
 match ip address prefix-list ROS-CP-FIB-PEERS
 set src 10.250.0.29
exit
route-map ROS-CP-FIB-SRC permit 100
exit
ip protocol bgp route-map ROS-CP-FIB-SRC
!
ip route 10.250.0.29/32 Null0 254
ip route 10.42.5.0/24 Null0 254
!
router bgp 4200010029
 bgp router-id 10.250.0.29
 bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 172.31.95.128 remote-as 4200000128
 neighbor 172.31.95.128 update-source 172.31.95.30
 neighbor 172.31.95.128 disable-connected-check
 neighbor 172.31.95.128 timers 3 9
 !
 address-family ipv4 unicast
  network 10.250.0.29/32
  network 10.42.5.0/24
  neighbor 172.31.95.128 activate
  neighbor 172.31.95.128 prefix-list MUBAO-R640-IN in
  neighbor 172.31.95.128 prefix-list MUBAO-SELF-OUT out
  neighbor 172.31.95.128 maximum-prefix 64 90 restart 5
 exit-address-family
!
