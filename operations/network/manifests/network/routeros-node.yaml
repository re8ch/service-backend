apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routerosnodes.networking.re8ch.com
spec:
  group: networking.re8ch.com
  scope: Cluster
  names:
    plural: routerosnodes
    singular: routerosnode
    kind: RouterOSNode
    shortNames: [rosnode]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeRef, routerAddress, localPodCIDR, remotePodCIDRs, mode]
              properties:
                nodeRef: {type: string}
                routerAddress: {type: string}
                mode: {type: string, enum: [Observe, Apply]}
                localPodCIDR: {type: string}
                remotePodCIDRs:
                  type: array
                  items:
                    type: object
                    required: [cidr, nextHop]
                    properties:
                      cidr: {type: string}
                      nextHop: {type: string}
                bgp:
                  type: object
                  properties:
                    routerASN: {type: integer, format: int64}
                    peerASN: {type: integer, format: int64}
                    peerAddress: {type: string}
                credentialsSecretRef:
                  type: object
                  required: [name, namespace]
                  properties:
                    name: {type: string}
                    namespace: {type: string}
                publicEdge:
                  type: object
                  properties:
                    publicIP: {type: string, format: ipv4}
                    authority: {type: string, enum: [RouterOS]}
                    deliveryMode: {type: string, enum: [EBGPTransitAndDNAT]}
                    gatewayVIP: {type: string, format: ipv4}
                    gatewayRef: {type: string}
                    routingAuthority: {type: string, enum: [AdvancedFabric]}
                    fallbackLanBackend: {type: string, format: ipv4}
                    requiredForwardPorts:
                      type: array
                      items: {type: integer, minimum: 1, maximum: 65535}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Ready
          type: string
          jsonPath: .status.ready
        - name: Safety
          type: string
          jsonPath: .status.safety
    - name: v1alpha2
      served: true
      storage: false
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: routeros-node-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: routeros-node-controller
rules:
  - apiGroups: [networking.re8ch.com]
    resources: [routerosnodes]
    verbs: [get, list, watch]
  - apiGroups: [networking.re8ch.com]
    resources: [routerosnodes/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: routeros-node-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: routeros-node-controller
subjects:
  - kind: ServiceAccount
    name: routeros-node-controller
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: routeros-node-controller-credentials
  namespace: ops
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mikrotik-routeros-admin]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: routeros-node-controller-credentials
  namespace: ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: routeros-node-controller-credentials
subjects:
  - kind: ServiceAccount
    name: routeros-node-controller
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: routeros-node-controller
  namespace: kube-system
data:
  controller.py: |
    import ipaddress, json, os, ssl, time, urllib.request, urllib.error

    API = "https://kubernetes.default.svc"
    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    KCTX = ssl.create_default_context(cafile=CA)
    ROSCTX = ssl.create_default_context()
    ROSCTX.check_hostname = False
    ROSCTX.verify_mode = ssl.CERT_NONE

    def kreq(path, method="GET", body=None):
      data = None if body is None else json.dumps(body).encode()
      req = urllib.request.Request(API + path, data=data, method=method,
        headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/merge-patch+json"})
      return json.load(urllib.request.urlopen(req, context=KCTX, timeout=15))

    def secret(ns, name):
      import base64
      obj = kreq(f"/api/v1/namespaces/{ns}/secrets/{name}")
      return {k: base64.b64decode(v).decode() for k, v in obj.get("data", {}).items()}

    def ros_get(base, path, auth):
      req = urllib.request.Request(base + "/rest" + path,
        headers={"Authorization": "Basic " + auth})
      return json.load(urllib.request.urlopen(req, context=ROSCTX, timeout=10))

    def reconcile(obj):
      import base64
      name, spec = obj["metadata"]["name"], obj["spec"]
      safety, errors = "Accepted", []
      local = ipaddress.ip_network(spec["localPodCIDR"], strict=True)
      if str(local) != "10.42.6.0/24": errors.append("localPodCIDR must be 10.42.6.0/24")
      seen = set()
      for route in spec["remotePodCIDRs"]:
        net = ipaddress.ip_network(route["cidr"], strict=True)
        hop = ipaddress.ip_address(route["nextHop"])
        if net.prefixlen != 24 or not net.subnet_of(ipaddress.ip_network("10.42.0.0/16")):
          errors.append(f"forbidden remote prefix {net}")
        if net == local: errors.append("local prefix present in remote set")
        if hop not in ipaddress.ip_network("10.181.22.0/24"):
          errors.append(f"next hop outside node underlay: {hop}")
        seen.add(str(net))
      # Hard invariant: the controller has no code path that writes Node InternalIP routes.
      if any(p.startswith("10.181.22.") for p in seen): errors.append("Node InternalIP publication forbidden")
      ready, observed = False, {}
      if not errors:
        ref = spec.get("credentialsSecretRef", {})
        creds = secret(ref["namespace"], ref["name"])
        auth = base64.b64encode((creds["username"] + ":" + creds["password"]).encode()).decode()
        # LAN-scoped RouterOS REST. Production promotion must install a RouterOS
        # certificate and switch this endpoint to www-ssl before Apply is unlocked.
        base = "http://" + spec["routerAddress"]
        observed["routes"] = len(ros_get(base, "/ip/route?.proplist=dst-address,gateway,active,comment", auth))
        observed["bgpConnections"] = len(ros_get(base, "/routing/bgp/connection?.proplist=name,remote.address,remote.as,disabled", auth))
        ready = True
        if spec["mode"] == "Apply":
          errors.append("Apply is safety-locked until the dedicated BGP canary is approved")
          ready = False
      if errors: safety = "Rejected"
      status = {"ready": str(ready).lower(), "safety": safety, "observed": observed,
                "errors": errors, "observedGeneration": obj["metadata"].get("generation", 0),
                "lastObservedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
      kreq(f"/apis/networking.re8ch.com/v1alpha1/routerosnodes/{name}/status", "PATCH", {"status": status})

    while True:
      try:
        for item in kreq("/apis/networking.re8ch.com/v1alpha1/routerosnodes").get("items", []):
          try: reconcile(item)
          except Exception as exc:
            print(item["metadata"]["name"], repr(exc), flush=True)
      except Exception as exc: print("list", repr(exc), flush=True)
      time.sleep(30)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routeros-node-controller
  namespace: kube-system
spec:
  # Superseded by the advanced-fabric 0.8 RouterOS v2 observer. Preserve this
  # object for rollback while ensuring there is only one status writer.
  replicas: 0
  selector:
    matchLabels: {app: routeros-node-controller}
  template:
    metadata:
      labels: {app: routeros-node-controller}
    spec:
      serviceAccountName: routeros-node-controller
      nodeSelector:
        kubernetes.io/hostname: r640
      containers:
        - name: controller
          # Pin this to the mirrored digest after the observe canary is accepted.
          image: python:3.13-alpine
          command: [python, /app/controller.py]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap: {name: routeros-node-controller}
---
apiVersion: networking.re8ch.com/v1alpha2
kind: RouterOSNode
metadata:
  name: r640-boundary
spec:
  nodeRef: r640
  routerAddress: 192.168.88.1
  mode: Observe
  routerASN: 4200064001
  continuity:
    operatorWitness: macmini
    mainDefaultGateway: 223.159.210.221
    mainDefaultInterface: ether4
    requireExternalProbe: true
  credentialsSecretRef:
    namespace: ops
    name: mikrotik-routeros-admin
  apply: {enabled: false, checksum: ""}
  routeDomains:
    - {name: re8ch-service-fast, fib: true, prefixes: [10.42.0.0/16, 10.251.0.0/24], fallbackTable: main}
  protectedPrefixes: [0.0.0.0/0, 10.181.22.0/24, 192.168.1.0/24, 192.168.2.0/24, 192.168.10.0/23, 192.168.88.0/24, 192.168.89.0/24, 192.168.90.0/24, 192.168.96.0/24, 223.159.210.220/30]
  fallbackNextHop: 192.168.88.251
  publicVIPs:
    - {cidr: 10.251.0.4/32, owner: r640, fallbackDistance: 250, healthAuthority: GatewayServiceProbe}
  publicEdge:
    publicIP: 223.159.210.222
    authority: RouterOS
    deliveryMode: EBGPTransitAndDNAT
    gatewayVIP: 10.251.0.4
    gatewayRef: kube-system/re8ch-gateway-canary
    routingAuthority: AdvancedFabric
    fallbackLanBackend: 192.168.88.251
    requiredForwardPorts: [25, 53, 80, 443, 6443, 465, 587, 993, 4190]
  peers:
    # BFD remains disabled until the matching 192.168.88.1 peer is configured
    # and verified in R640 FRR. The 10/30 BGP timers are the active failure gate.
    - {name: re8ch-r640-public-origin-v2, role: r640-public-origin, address: 192.168.88.251/32, remoteASN: 4200000128, localAddress: 192.168.88.1, acceptedPrefixes: [10.42.6.0/24, 10.251.0.4/32], maxPrefixes: 64, routeDomain: re8ch-service-fast, useBFD: false, keepaliveTime: 10s, holdTime: 30s, gracefulRestartSeconds: 30, failurePolicy: WithdrawPeerOnly}
    - {name: re8ch-pod-rs-a1-v2, role: cluster-route-server, address: 10.181.22.147/32, remoteASN: 4200010147, localAddress: 10.181.22.128, acceptedPrefixes: &remotePodCIDRs [10.42.0.0/24, 10.42.7.0/24, 10.42.9.0/24, 10.42.10.0/24, 10.42.11.0/24, 10.42.12.0/24, 10.42.13.0/24, 10.42.14.0/24, 10.42.16.0/24, 10.42.17.0/24, 10.42.19.0/24, 10.42.20.0/24, 10.42.21.0/24], maxPrefixes: 64, routeDomain: re8ch-service-fast, useBFD: false, keepaliveTime: 10s, holdTime: 30s, gracefulRestartSeconds: 30, failurePolicy: WithdrawPeerOnly}
    - {name: re8ch-pod-rs-b1-v2, role: cluster-route-server, address: 10.181.22.125/32, remoteASN: 4200010125, localAddress: 10.181.22.128, acceptedPrefixes: *remotePodCIDRs, maxPrefixes: 64, routeDomain: re8ch-service-fast, useBFD: false, keepaliveTime: 10s, holdTime: 30s, gracefulRestartSeconds: 30, failurePolicy: WithdrawPeerOnly}
