[Unit]
# FRR serves multiple independent fabrics. It must not be bound to one tunnel:
# losing public-mesh must leave A1/B1 access and other healthy peers running.
# Clear the package unit's Before=network.target, which otherwise forms an
# ordering cycle with wg-quick's After=network-online.target.
Before=
Wants=network-online.target wg-quick@wg-pt-a1.service wg-quick@wg-pt-b1.service
After=network-online.target wg-quick@wg-pt-a1.service wg-quick@wg-pt-b1.service
