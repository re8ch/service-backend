apiVersion: v1
kind: Service
metadata:
  name: panel-grafana-gateway-origin
  namespace: qianwen-ops
spec:
  clusterIP: None
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: panel-grafana-gateway-origin
  namespace: qianwen-ops
  labels:
    kubernetes.io/service-name: panel-grafana-gateway-origin
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: [10.251.0.4]
    conditions: {ready: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel-grafana
  namespace: qianwen-ops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel-grafana-gateway-origin
                port:
                  name: http
  tls:
    - hosts: [grafana.re8ch.com]
      secretName: re8ch-wildcard-tls
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-gateway-origin
  namespace: headlamp
spec:
  clusterIP: None
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: headlamp-gateway-origin
  namespace: headlamp
  labels:
    kubernetes.io/service-name: headlamp-gateway-origin
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: [10.251.0.4]
    conditions: {ready: true}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-gateway-http
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-headlamp-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp-gateway-origin
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-gateway-https
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp-gateway-origin
                port:
                  name: http
  tls:
    - hosts: [headlamp.re8ch.com]
      secretName: re8ch-wildcard-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-https-redirect
  namespace: headlamp
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: panel-grafana-gateway-http
  namespace: qianwen-ops
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: qianwen-ops-grafana-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel-grafana-gateway-origin
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-https-redirect
  namespace: qianwen-ops
spec:
  redirectScheme:
    scheme: https
    permanent: true
