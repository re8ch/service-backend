# Apply only after every retained node has a complete FRR replacement RIB.
routingMode: native
ipv4NativeRoutingCIDR: 192.0.2.224/16
autoDirectNodeRoutes: false
directRoutingSkipUnreachable: false
# Every K3s server/agent exposes its health-checked local control-plane load
# balancer here.  Cilium must not bootstrap against the restricted-node-6dc3f140f9 voter directly.
k8sServiceHost: 127.0.0.1
k8sServicePort: 6444
bgpControlPlane: {enabled: true}
operator:
  replicas: 3
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb, restricted-node-6dc3f140f9]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {io.cilium/app: operator, name: cilium-operator}
          topologyKey: kubernetes.io/hostname
