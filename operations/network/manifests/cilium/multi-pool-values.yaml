# Transitional Multi-Pool overlay. Keep the broad native-routing CIDR until
# every workload has moved from the legacy 10.42.0.0/16 allocation.
ipam:
  mode: multi-pool
  multiPoolPreAllocation: tenant-apps=8
extraConfig:
  ipam-default-ip-pool: tenant-apps
k8s:
  requireIPv4PodCIDR: false
ipv4NativeRoutingCIDR: 10.0.0.0/8

# The cluster selects the point-to-point WireGuard devices for native routing.
# BPF masquerade therefore attaches only to those devices and misses Internet
# traffic leaving heterogeneous physical NICs. Netfilter masquerade is the
# portable SNAT authority during the Multi-Pool migration.
bpf:
  masquerade: false
# This Cilium build treats this value as one exact interface name. R640
# overrides it to eno2np1 through its CiliumNodeConfig.
egressMasqueradeInterfaces: eth0

rollOutCiliumPods: true
