apiVersion: delivery.re8ch.com/static-control-plane/v1alpha1
kind: StaticControlPlane
metadata:
  name: github-native-flux-decomposition
spec:
  status: target-not-activated
  runtimeAuthority: kubernetes
  admissionAuthority: github-rulesets
  orchestrationIdentity: github-app-installation
  repositoryProperties:
    purpose: ruleset-selection-and-routing
    authorization: never-sufficient
    fields: [system, domain, service-tier, risk, execution-profile]
    trust: organization-controlled-values-checked-against-reviewed-catalog
  responsibilities:
    - id: source-resolution
      flux: source-controller
      mode: static-derivation
      owner: compiler
      inputs: [repository-id, commit-sha, dependency-locks, source-signature-policy]
      output: immutable-source-manifest
    - id: artifact-storage
      flux: source-controller
      mode: github-service
      owner: packages-and-releases
      inputs: [verified-bundle-digest, provenance]
      output: digest-addressed-artifact
    - id: render
      flux: kustomize-controller-and-helm-controller
      mode: static-derivation
      owner: compiler
      inputs: [immutable-source-manifest, renderer-digests, values, patches, schema-snapshot]
      output: canonical-objects-and-inventory
    - id: dependency-plan
      flux: kustomize-controller-and-helm-controller
      mode: static-derivation
      owner: compiler
      inputs: [release-contracts, canonical-objects-and-inventory]
      output: acyclic-apply-waves-and-health-predicates
    - id: authorization-plan
      flux: controller-service-accounts
      mode: static-derivation
      owner: compiler
      inputs: [reviewed-operation-catalog, canonical-objects-and-inventory]
      output: exact-targets-verbs-and-identity-bindings
    - id: desired-state-admission
      flux: external-git-policy
      mode: github-service
      owner: rulesets
      inputs: [signed-commits, pull-request, required-checks, configured-review-policy]
      output: protected-main-commit
    - id: image-update
      flux: image-reflector-and-image-automation
      mode: app-event
      owner: domain-promoter
      inputs: [producer-release-event, verified-bundle-digest, reviewed-promotion-policy]
      output: digest-only-pull-request
    - id: event-delivery
      flux: notification-controller-receiver
      mode: app-event
      owner: github-app-adapter
      inputs: [verified-webhook, delivery-id, installation-id]
      output: durable-deduplicated-event
    - id: operation-selection
      flux: controller-reconcile-loop
      mode: static-derivation
      owner: pure-policy-evaluator
      inputs: [protected-main-commit, reviewed-operation-catalog, authenticated-evidence-snapshot]
      output: operation-proposal-with-preconditions
    - id: approval-and-dispatch
      flux: controller-work-queue
      mode: app-event
      owner: executor-app
      inputs: [operation-proposal-with-preconditions, exact-digest-approval, current-installation]
      output: expiring-operation-envelope
    - id: admission-and-field-ownership
      flux: kustomize-controller-and-helm-controller
      mode: runtime-effect
      owner: bounded-executor
      inputs: [expiring-operation-envelope, live-api-discovery, live-managed-fields]
      output: server-dry-run-evidence
    - id: apply
      flux: kustomize-controller-and-helm-controller
      mode: runtime-effect
      owner: bounded-executor
      inputs: [server-dry-run-evidence, current-sequence, exact-targets-verbs-and-identity-bindings]
      output: accepted-inventory-and-operation-result
    - id: readiness-and-drift
      flux: controller-health-and-periodic-reconcile
      mode: runtime-observation
      owner: read-only-observer
      inputs: [accepted-inventory, live-object-snapshot, health-predicates]
      output: authenticated-evidence-snapshot
    - id: prune-and-rollback-plan
      flux: kustomize-controller-and-helm-controller
      mode: static-derivation
      owner: compiler
      inputs: [previous-accepted-inventory, proposed-inventory, deletion-policy, rollback-digest]
      output: candidate-delete-set-and-rollback-reference
    - id: prune-and-rollback-execution
      flux: kustomize-controller-and-helm-controller
      mode: runtime-effect
      owner: bounded-executor
      inputs: [candidate-delete-set-and-rollback-reference, live-uids, live-ownership, exact-digest-approval]
      output: bounded-result-with-precondition-failures
    - id: status-and-escalation
      flux: notification-controller-and-status-projections
      mode: app-event
      owner: maintenance-and-executor-apps
      inputs: [bounded-result-with-precondition-failures, authenticated-evidence-snapshot]
      output: checks-deployment-status-and-deduplicated-issues
  activationGates:
    - installed-app-identities-and-effective-permissions-verified
    - organization-property-edit-authority-and-ruleset-coverage-verified
    - required-check-publisher-bound-to-installed-app
    - webhook-signature-deduplication-durability-and-redelivery-proven
    - app-to-executor-workload-identity-proven
    - exact-commit-bundle-target-approval-proven
    - concurrent-sequence-and-stale-evidence-rejection-proven
    - takeover-replay-drift-recovery-and-rollback-proven
    - risk-stability-window-and-zero-old-consumers-proven
