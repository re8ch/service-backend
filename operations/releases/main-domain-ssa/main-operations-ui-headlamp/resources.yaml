kind: ConfigMap
metadata:
  name: headlamp-secretary-v030-d9c9k67m67
  namespace: headlamp
---
apiVersion: v1
kind: Service
metadata:
  name: controlled-cluster-relay
  namespace: headlamp
spec:
  ports:
  - name: artc-api
    port: 16443
    targetPort: artc-api
  - name: qwen-api
    port: 26443
    targetPort: qwen-api
  selector:
    app.kubernetes.io/name: controlled-cluster-relay
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: headlamp-gateway-proxy
    networking.re8ch.com/origin: gateway
  name: headlamp-gateway-backend
  namespace: headlamp
spec:
  internalTrafficPolicy: Cluster
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: headlamp-gateway-proxy
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-oidc-landing
  namespace: headlamp
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: headlamp-gateway-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-oidc-origin
  namespace: headlamp
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: oidc-landing
  selector:
    app.kubernetes.io/name: headlamp
    traffic.re8ch.com/headlamp-active: 'true'
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-origin
  namespace: headlamp
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: headlamp
    traffic.re8ch.com/headlamp-active: 'true'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-active-elector
  namespace: headlamp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controlled-cluster-relay
  namespace: headlamp
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.0.2.145/32
  - ports:
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.0.2.115/32
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: headlamp
    ports:
    - port: 16443
      protocol: TCP
    - port: 26443
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: controlled-cluster-relay
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: headlamp
  namespace: headlamp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-active-elector
  namespace: headlamp
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-active-elector
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-active-elector
subjects:
- kind: ServiceAccount
  name: headlamp-active-elector
  namespace: headlamp
