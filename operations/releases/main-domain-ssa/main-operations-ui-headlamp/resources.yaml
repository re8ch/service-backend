apiVersion: v1
data:
  relay.py: "import socket\nimport threading\n\nRELAYS = ((16443, \"192.0.2.145\"\
    , 6443), (26443, \"192.0.2.115\", 6443))\n\ndef copy(source, target):\n    try:\n\
    \        while data := source.recv(65536):\n            target.sendall(data)\n\
    \    except OSError:\n        pass\n    finally:\n        try:\n            target.shutdown(socket.SHUT_WR)\n\
    \        except OSError:\n            pass\n\ndef handle(client, target_host,\
    \ target_port):\n    try:\n        upstream = socket.create_connection((target_host,\
    \ target_port), timeout=10)\n    except OSError:\n        client.close()\n   \
    \     return\n    threading.Thread(target=copy, args=(client, upstream), daemon=True).start()\n\
    \    copy(upstream, client)\n    client.close()\n    upstream.close()\n\ndef serve(listen_port,\
    \ target_host, target_port):\n    listener = socket.create_server((\"0.0.0.0\"\
    , listen_port), reuse_port=True)\n    while True:\n        client, _ = listener.accept()\n\
    \        threading.Thread(target=handle, args=(client, target_host, target_port),\
    \ daemon=True).start()\n\nfor relay in RELAYS:\n    threading.Thread(target=serve,\
    \ args=relay, daemon=True).start()\nthreading.Event().wait()\n"
kind: ConfigMap
metadata:
  name: controlled-cluster-relay
  namespace: headlamp
---
apiVersion: v1
data:
  elector.py: "import json\nimport os\nimport ssl\nimport time\nimport urllib.parse\n\
    import urllib.request\n\nnamespace = os.environ.get(\"POD_NAMESPACE\", \"headlamp\"\
    )\ntoken_path = \"/var/run/secrets/kubernetes.io/serviceaccount/token\"\nca_path\
    \ = \"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\napi_host = os.environ.get(\"\
    KUBERNETES_SERVICE_HOST\", \"kubernetes.default.svc\")\napi_port = os.environ.get(\"\
    KUBERNETES_SERVICE_PORT_HTTPS\", \"443\")\nbase = f\"https://{api_host}:{api_port}\"\
    \nselector = urllib.parse.quote(\"app.kubernetes.io/name=headlamp\")\ncontext\
    \ = ssl.create_default_context(cafile=ca_path)\n\ndef request(path, method=\"\
    GET\", body=None):\n    with open(token_path, encoding=\"utf-8\") as token_file:\n\
    \        token = token_file.read().strip()\n    data = None if body is None else\
    \ json.dumps(body).encode()\n    req = urllib.request.Request(\n        base +\
    \ path,\n        data=data,\n        method=method,\n        headers={\n     \
    \       \"Authorization\": \"Bearer \" + token,\n            \"Content-Type\"\
    : \"application/merge-patch+json\",\n        },\n    )\n    with urllib.request.urlopen(req,\
    \ context=context, timeout=5) as response:\n        return json.load(response)\n\
    \ndef ready(pod):\n    if pod[\"metadata\"].get(\"deletionTimestamp\"):\n    \
    \    return False\n    if pod.get(\"status\", {}).get(\"phase\") != \"Running\"\
    :\n        return False\n    return any(\n        condition.get(\"type\") == \"\
    Ready\" and condition.get(\"status\") == \"True\"\n        for condition in pod.get(\"\
    status\", {}).get(\"conditions\", [])\n    )\n\ndef set_active(pod, active):\n\
    \    name = pod[\"metadata\"][\"name\"]\n    value = \"true\" if active else \"\
    false\"\n    labels = pod[\"metadata\"].get(\"labels\", {})\n    if labels.get(\"\
    traffic.re8ch.com/headlamp-active\") == value:\n        return\n    request(\n\
    \        f\"/api/v1/namespaces/{namespace}/pods/{name}\",\n        method=\"PATCH\"\
    ,\n        body={\"metadata\": {\"labels\": {\"traffic.re8ch.com/headlamp-active\"\
    : value}}},\n    )\n    print(json.dumps({\"event\": \"headlamp-active-label\"\
    , \"pod\": name, \"active\": active}), flush=True)\n\nwhile True:\n    try:\n\
    \        pods = request(f\"/api/v1/namespaces/{namespace}/pods?labelSelector={selector}\"\
    )[\"items\"]\n        # Prefer the R640-local backend for PublicEdge. Cross-node\
    \ traffic\n        # to domain-ex remains the automatic fallback when restricted-node-6dc3f140f9 is\
    \ absent.\n        healthy = sorted(\n            (pod for pod in pods if ready(pod)),\n\
    \            key=lambda pod: (\n                pod.get(\"spec\", {}).get(\"nodeName\"\
    ) != \"restricted-node-6dc3f140f9\",\n                pod[\"metadata\"][\"name\"],\n            ),\n\
    \        )\n        current = [\n            pod for pod in healthy\n        \
    \    if pod[\"metadata\"].get(\"labels\", {}).get(\"traffic.re8ch.com/headlamp-active\"\
    ) == \"true\"\n        ]\n        preferred = [pod for pod in healthy if pod.get(\"\
    spec\", {}).get(\"nodeName\") == \"restricted-node-6dc3f140f9\"]\n        selected = preferred[0] if\
    \ preferred else (current[0] if current else (healthy[0] if healthy else None))\n\
    \        for pod in pods:\n            set_active(pod, selected is not None and\
    \ pod[\"metadata\"][\"uid\"] == selected[\"metadata\"][\"uid\"])\n    except Exception\
    \ as error:\n        print(json.dumps({\"event\": \"headlamp-active-elector-error\"\
    , \"error\": str(error)}), flush=True)\n    time.sleep(5)\n"
