---
apiVersion: scheduling.re8ch.com/v1alpha1
kind: SchedulerProfile
metadata:
  name: re8ch-dynamic
spec:
  eligibleNodeSelector:
    scheduling.re8ch.com/trimaran-ready: 'true'
  managementMode: Managed
  metricsDependencies:
  - instance:node_cpu_utilisation:rate:sum
  - instance:node_memory_utilisation:ratio
  minimumMetricsCoverage: 1
  plugins:
  - bounds:
      maximum: 10
      minimum: 1
    enabled: true
    name: LoadVariationRiskBalancing
    weight: 5
  - args:
      mode: Most
      resources:
      - name: cpu
        weight: 1
      - name: memory
        weight: 4
    bounds:
      maximum: 10
      minimum: 1
    enabled: true
    name: NodeResourcesAllocatable
    weight: 2
  schedulerName: re8ch-dynamic-scheduler
---
apiVersion: scheduling.re8ch.com/v1alpha1
kind: SchedulerProfile
metadata:
  name: upstream-default
spec:
  managementMode: ReadOnly
  minimumMetricsCoverage: 0
  plugins: []
  schedulerName: default-scheduler
