kind: PlacementClass
metadata:
  name: online-reliable
spec:
  allowControlPlane: false
  distributionPolicy: PreferSpread
  failurePolicy: FailClosed
  maxSkew: 1
  minEligibleNodes: 1
  minFailureDomains: 1
  nodeSelector:
    scheduling.re8ch.com/network-serving: 'true'
    scheduling.re8ch.com/placement-general-reliable: 'true'
  nodeTaintsPolicy: Honor
  requiredCapabilities:
  - network
  resourceFlavorName: placement-online-reliable
  topologyKey: scheduling.re8ch.com/failure-domain
  whenUnsatisfiable: ScheduleAnyway
  workloadMode: PortableService
---
