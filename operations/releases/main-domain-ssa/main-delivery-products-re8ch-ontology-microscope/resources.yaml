    app.kubernetes.io/name: ontology-microscope-neuronpedia
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-neuronpedia-postgres
  namespace: re8ch-ontology-microscope
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app.kubernetes.io/name: ontology-neuronpedia-postgres
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-microscope
  namespace: re8ch-ontology-microscope
spec:
  hostnames:
  - ontology.apps.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: apps-wildcard-https
  rules:
  - backendRefs:
    - name: ontology-microscope-adapter
      port: 4318
    matches:
    - path:
        type: PathPrefix
        value: /api/re8ch/
  - backendRefs:
    - name: ontology-microscope-neuronpedia
      port: 80
