metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-microscope-adapter
  namespace: re8ch-ontology-microscope
spec:
  ports:
  - name: http
    port: 4318
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: ontology-microscope-adapter
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
  name: ontology-microscope-neo4j
  namespace: re8ch-ontology-microscope
spec:
  clusterIP: None
  ports:
  - name: bolt
    port: 7687
    protocol: TCP
    targetPort: bolt
  selector:
    app.kubernetes.io/name: ontology-microscope-neo4j
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: ontology-microscope
    saas.re8ch.com/layer: prototype
    saas.re8ch.com/product: ontology-microscope
    saas.re8ch.com/tenant: re8ch
