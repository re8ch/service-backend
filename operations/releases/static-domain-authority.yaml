apiVersion: delivery.re8ch.com/static-domain-authority/v1alpha1
kind: StaticDomainAuthority
metadata:
  name: re8ch-nine-domain-static-gitops
spec:
  # These execution profiles apply only to the remaining SSA contracts.
  # Native ownership and autonomous controller boundaries live in the existing
  # federation ledger; do not infer an SSA writer from a profile's presence.
  desiredState: signed-git-cloud-ssa
  nativeAuthorityRef: operations/flux-federation/authority.yaml
  runtimeAuthority: kubernetes
  compatibilityMode: frozen-legacy-inventory-during-cloud-adoption
  protectedEnvironmentPolicy:
    requiredReviewers: [Woomou]
    preventSelfReview: false
    administratorsMayBypass: false
    deploymentBranches: [main]
    requiredSecrets: [KUBE_API_CA_PEM]
    notes:
    - Woomou is the only current member of both k8s-admins and gitops-breakglass.
    - Preventing self review would deadlock every protected deployment until another reviewer is enrolled.
  rolloutPolicy:
    productionCutovers: serial
    order:
    - delivery-products
    - operations-ui
    - agent-runtime
    - observability-metering
    - identity-access
    - tenant-runtime
    - commerce-billing
    - data-storage
    - networking
  domains:
    agent-runtime:
      risk: medium
      stabilityHours: 24
      state: shadow
      source:
        organization: 8iops
        repository: 8iops/agent-gitops
        ref: refs/heads/main
        mappingState: verified
      execution:
        repository: 8iops/agent-gitops
        workflow: .github/workflows/static-release.yml
        protectedEnvironment: release-executor-agent-runtime
        audience: https://kube-api.re8ch.com/release-executor-agent-runtime
        kubernetesGroup: re8ch:release-executor:agent-runtime
      shadowEvidence:
        releaseId: agent-runtime-toolhive-operator
        sourceChartDigest: sha256:4881731dd7ceaf0fefcdecdb23b1c87d16b1f60fe8aa5ee75304fd33f4fa4d22
        bundleDigest: sha256:bc8e35a4c7f16c526fc0a65b87e5b2c6ad3e76b647bb68d885ce398815cc0e90
        workflowRun: 40115419539
        verified: true
        runtimeMutation: false
    identity-access:
      risk: high
      stabilityHours: 48
      state: inventory
      source:
        organization: re8ch
        repository: re8ch/identity-gitops
        ref: refs/heads/main
        mappingState: verified
      execution:
        repository: re8ch/identity-gitops
        workflow: .github/workflows/static-release.yml
        protectedEnvironment: release-executor-identity-access
        audience: https://kube-api.re8ch.com/release-executor-identity-access
        kubernetesGroup: re8ch:release-executor:identity-access
    observability-metering:
      risk: medium
      stabilityHours: 24
      state: inventory
      source:
        organization: siren-observer
        repository: siren-observer/observability-gitops
        ref: refs/heads/main
        mappingState: verified
      execution:
        repository: siren-observer/observability-gitops
        workflow: .github/workflows/static-release.yml
        protectedEnvironment: release-executor-observability-metering
        audience: https://kube-api.re8ch.com/release-executor-observability-metering
        kubernetesGroup: re8ch:release-executor:observability-metering
    networking:
      risk: critical
      stabilityHours: 72
      state: inventory
      source:
        organization: pillars-infra
        repository: pillars-infra/network-gitops
        ref: refs/heads/main
        mappingState: verified
      execution:
        repository: pillars-infra/network-gitops
        workflow: .github/workflows/static-release.yml
        protectedEnvironment: release-executor-networking
        audience: https://kube-api.re8ch.com/release-executor-networking
        kubernetesGroup: re8ch:release-executor:networking
    data-storage:
      risk: critical
      stabilityHours: 72
      state: inventory
      source:
        organization: null
        repository: null
        ref: refs/heads/main
        mappingState: pending-enterprise-inventory
      bootstrap:
        repository: re8ch/service-backend
        workflow: .github/workflows/main-domain-release.yml
      execution:
        repository: re8ch/service-backend
        workflow: .github/workflows/main-domain-release.yml
        protectedEnvironment: release-executor-data-storage
        audience: https://kube-api.re8ch.com/release-executor-data-storage
        kubernetesGroup: re8ch:release-executor:data-storage
        replay:
