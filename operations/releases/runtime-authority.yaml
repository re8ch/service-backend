version: 1

# Runtime authority is selected from product behavior, not from where its YAML
# happens to live today.  Externally consumed, frequently changing products use
# an authenticated release or business API.  Cloud SSA also adopts platform guardrails and infrastructure. Legacy inventory
# remains recorded while local Flux is stopped.
selectionPolicy:
  externalAndFastChanging: product-runtime
  platformInfrastructure: cloud-ssa
  businessState: application-api

authorities:
  commerce-billing:
    externalUsers: true
    changeCadence: high
    targetAuthority: product-runtime
    currentAuthority: control-plane-direct
    migrationPhase: flux-detached
    productRepositories: [re8ch/cloud-functions]
    productOwned:
      - commerce API image rollout
      - payment-channel availability and catalog state
      - checkout behavior and provider adapters
    # Legacy platform inventory awaiting or undergoing cloud adoption.
    fluxOwned:
      - namespace and workload security policy
      - Secret references and emergency platform brake
      - shared Gateway attachment and database routing
    cutoverGate: authenticated product release publisher

  identity:
    externalUsers: true
    changeCadence: high
    targetAuthority: product-runtime
    currentAuthority: control-plane-direct
    migrationPhase: flux-detached
    productRepositories: [re8ch/cloud-functions, re8ch/user-hub]
    productOwned:
      - auth gateway and user-facing identity runtime releases
      - provider enablement and user lifecycle business state
      - User Hub release cadence
    # Legacy platform inventory awaiting or undergoing cloud adoption.
    fluxOwned:
      - namespace, quotas, NetworkPolicy and RBAC
      - encrypted Secret material and Secret references
      - shared Gateway, certificate and database authority
    cutoverGate: authenticated product release publisher

  connectool:
    externalUsers: true
    changeCadence: high
    targetAuthority: product-runtime
    currentAuthority: control-plane-direct
    migrationPhase: flux-detached
    productRepositories: [among-clusters/connectool]
    productOwned:
      - signed chart and session-router releases
      - MCP publication, distribution and compatibility contracts
      - product-owned rollout and rollback
    # Legacy platform inventory awaiting or undergoing cloud adoption.
    fluxOwned:
      - namespace, quota, NetworkPolicy and bounded RBAC
      - shared OIDC issuer, Gateway and certificate authority
      - platform emergency brake
    cutoverGate: authenticated product release publisher

cutoverRules:
  - During the authorized construction cutover, freeze local Flux writers after
    preserving their inventories and release history. Missing cloud coverage is
    tracked explicitly and repaired through the cloud API path; do not restart
    Flux merely because a resource has not yet been adopted.
  - A product publisher must use short-lived identity, immutable signed
    artifacts, a namespace/resource allowlist, server-side apply ownership and
    append-only release evidence.
  - Product release authority must not include Secret values, cluster-scoped
    RBAC, Gateway ownership, certificate issuance or database administration.
  - During handoff, exactly one controller may prune a given object.
  - >-
    control-plane-direct is an explicit temporary owner; product runtime
    objects are outside every Flux inventory and are changed only through the
    audited control-plane path until the product publisher replaces it.
