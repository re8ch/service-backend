apiVersion: batch/v1
kind: Job
metadata:
  name: cube-recovery-preflight-20261029
  namespace: cube-trial
  labels:
    app.kubernetes.io/part-of: cube-sandbox
    app.kubernetes.io/component: recovery-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cube-sandbox
        app.kubernetes.io/component: recovery-preflight
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: probe
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, -ec]
          args:
            - |
              kvm=false; vmx=false
              test ! -c /host-dev/kvm || kvm=true
              grep -Eq '(^flags.* (vmx|svm)( |$))' /proc/cpuinfo && vmx=true || true
              printf '{"kvmDevicePresent":%s,"cpuVirtualizationFlag":%s,"hostMutation":false}\n' "$kvm" "$vmx" > /dev/termination-log
          terminationMessagePath: /dev/termination-log
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: dev, mountPath: /host-dev, readOnly: true}
      volumes:
        - name: dev
          hostPath: {path: /dev, type: Directory}
