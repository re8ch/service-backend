apiVersion: collaboration.re8ch.com/v1alpha1
kind: OrganizationTopology
metadata:
  enterprise: re8ch
  enterpriseDisplayName: Reachieve LLC
  observedAt: "2026-09-28"
spec:
  principle: Git for Everything in Collaboration, Kubernetes for Runtime, Flux for Convergence, Headlamp for Inspection
  githubRole: universal-coordination-event-bus
  runtime:
    authority: kubernetes
    distribution: k3s
    reconciliation: flux
    inspection: headlamp
    rawObservability: [prometheus, metrics-backend, logs-backend, traces-backend]
  organizations:
    - login: advanced-fabrics
      displayName: Advanced Fabrics
      state: enrolled-in-enterprise
      repositories:
        - {source: advanced-fabrics/core, target: advanced-fabrics/core, state: already-moved}
        - {source: advanced-fabrics/headlamp-advanced-fabric, target: advanced-fabrics/headlamp-advanced-fabric, state: already-moved}
        - {source: advanced-fabrics/spec, target: advanced-fabrics/spec, state: existing}
        - {source: advanced-fabrics/api, target: advanced-fabrics/api, state: existing}
        - {source: advanced-fabrics/conformance, target: advanced-fabrics/conformance, state: existing}
    - login: among-clusters
      displayName: Among Clusters
      state: created-in-enterprise
      repositories:
        - {source: re8ch/among-clusters, target: among-clusters/among-clusters, state: transferred}
        - {source: re8ch/connectool, target: among-clusters/connectool, state: transferred}
        - {source: "embedded:platform/plugins/headlamp-birfucate-browser", target: among-clusters/headlamp-birfucate, state: extracted-with-history}
    - login: public-edge
      displayName: Public Edge
      state: created-in-enterprise
      repositories:
        - {source: re8ch/public-edge-manager, target: public-edge/public-edge-manager, state: transferred}
        - {source: re8ch/headlamp-public-edge, target: public-edge/headlamp-public-edge, state: pilot-complete}
        - {source: re8ch/mihomos-cluster, target: public-edge/mihomos-cluster, state: transferred}
        - {source: re8ch/headlamp-mihomos-cluster, target: public-edge/headlamp-mihomos-cluster, state: pilot-complete}
    - login: re8ch-image
      displayName: RE8CH Image
      state: created-in-enterprise
      repositories:
        - {source: re8ch/image-website, target: re8ch-image/image-website, state: transferred}
        - {source: re8ch/registry-website, target: re8ch-image/registry-website, state: transferred}
    - login: re8ch-cloud
      displayName: RE8CH Cloud
      state: created-in-enterprise
      repositories:
        - {source: re8ch/cluster-website, target: re8ch-cloud/cluster-website, state: transferred}
        - {source: re8ch/cloud-functions, target: re8ch-cloud/cloud-functions, state: pending-source-access-cutover}
    - login: re8ch-observability
      displayName: RE8CH Observability
      state: created-in-enterprise
      repositories:
        - {source: re8ch/observable-website, target: re8ch-observability/observable-website, state: transferred}
        - {source: re8ch/grafana, target: re8ch-observability/grafana, state: transferred}
    - login: re8ch-ai
      displayName: RE8CH AI
      state: created-in-enterprise
      repositories:
        - {source: re8ch/codex-admin-plugins, target: re8ch-ai/codex-admin-plugins, state: transferred}
        - {source: re8ch/codex-cloud-tenant-plugins, target: re8ch-ai/codex-cloud-tenant-plugins, state: transferred}
        - {source: re8ch/qwen-tenant-marketplace, target: re8ch-ai/qwen-tenant-marketplace, state: transferred}
        - {source: re8ch/tool-distribution, target: re8ch-ai/tool-distribution, state: pending-pages-url-cutover}
    - login: re8ch-business
      displayName: RE8CH Business
      state: created-in-enterprise
      repositories:
        - {source: re8ch/hyperswitch, target: re8ch-business/hyperswitch, state: transferred}
        - {source: re8ch/user-hub, target: re8ch-business/user-hub, state: transferred}
  productRepositoryConvention:
    appliesTo: active-product-organizations
    repositories: [product-prd, product-assets]
    visibility: private
    prdCadence: owner-initiated-reviewed-pr
    scheduledPrdCreation: false
    verifiedPairs: 25
  duplicateOrganizationCandidates:
    - {empty: jjk-live-app, populated: jjklive, action: retain-pending-link-audit}
    - {empty: lizhang-accounting, populated: lizhang-ledger, action: retain-pending-link-audit}
    - {empty: motor-muscle-lab, populated: motor-muscle-sim, action: retain-pending-link-audit}
  retainedAuthorities:
    - {repository: re8ch/service-backend, role: aggregate-gitops-authority}
    - {repository: re8ch/cloud-functions, role: platform-runtime-controller, until: source-access-cutover}
  eventProjection:
    accepts: [alert, drift, deployment-failure, security-event, capacity-anomaly, customer-incident]
    emits: [issue, pull-request, check, deployment, discussion]
    forbidsInGit: [raw-metrics, raw-logs, raw-traces, credentials, unredacted-customer-data]
  identity:
    human: enterprise-sso-scim-team
    automation: github-app-installation-token
    workload: github-actions-oidc
    staticPersonalAccessTokens: forbidden
