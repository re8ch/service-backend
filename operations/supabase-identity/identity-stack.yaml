# Isolated identity stack. No public HTTPRoute is declared here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: supabase-identity
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: supabase-identity-quota
  namespace: supabase-identity
spec:
  hard:
    requests.cpu: 500m
    limits.cpu: 1250m
    requests.memory: 1024Mi
    limits.memory: 4096Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-identity-env
  namespace: supabase-identity
data:
  POSTGRES_HOST: pg-re8ch-primary.pigsty-external.svc.cluster.local
  POSTGRES_PORT: '5432'
  POSTGRES_DB: re8ch_identity
  PGRST_DB_SCHEMAS: api
  PGRST_DB_MAX_ROWS: '1000'
  PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
  SITE_URL: https://auth.re8ch.com
  API_EXTERNAL_URL: https://auth.re8ch.com/auth/v1
  SUPABASE_PUBLIC_URL: https://auth.re8ch.com
  STUDIO_DEFAULT_ORGANIZATION: RE8CH
  STUDIO_DEFAULT_PROJECT: re8ch_identity
  DISABLE_SIGNUP: 'true'
  JWT_EXPIRY: '3600'
  ENABLE_EMAIL_SIGNUP: 'false'
  ENABLE_ANONYMOUS_USERS: 'false'
  ENABLE_EMAIL_AUTOCONFIRM: 'true'
  ENABLE_PHONE_SIGNUP: 'false'
  ENABLE_PHONE_AUTOCONFIRM: 'false'
  SMTP_ADMIN_EMAIL: ops@re8ch.com
  SMTP_HOST: localhost
  SMTP_PORT: '25'
  SMTP_USER: ''
  SMTP_PASS: ''
  SMTP_SENDER_NAME: RE8CH Supabase
  ADDITIONAL_REDIRECT_URLS: ''
  MAILER_URLPATHS_INVITE: /auth/v1/verify
  MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
  MAILER_URLPATHS_RECOVERY: /auth/v1/verify
  MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
  GLOBAL_S3_BUCKET: supabase-identity
  STORAGE_TENANT_ID: pg-re8ch
  REGION: r640-lan
  IMGPROXY_AUTO_WEBP: 'true'
  S3_PROTOCOL_ACCESS_KEY_ID: ''
  S3_PROTOCOL_ACCESS_KEY_SECRET: ''
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-identity-kong-config
  namespace: supabase-identity
data:
  kong-entrypoint.sh: |
    #!/bin/sh
    if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
      export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)"
      export LUA_RT_WS_EXPR="\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
    else
      export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
      export LUA_RT_WS_EXPR="\$(query_params.apikey)"
    fi
    awk '{
      result = ""
      rest = $0
      while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
        varname = substr(rest, RSTART + 1, RLENGTH - 1)
        if (varname in ENVIRON) {
          result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
        } else {
          result = result substr(rest, 1, RSTART + RLENGTH - 1)
        }
        rest = substr(rest, RSTART + RLENGTH)
      }
      print result rest
    }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"
    sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' "$KONG_DECLARATIVE_CONFIG"
    exec /entrypoint.sh kong docker-start
  kong.yml: |
    _format_version: '2.1'
    _transform: true
    consumers:
      - username: DASHBOARD
      - username: anon
        keyauth_credentials:
          - key: $SUPABASE_ANON_KEY
      - username: service_role
        keyauth_credentials:
          - key: $SUPABASE_SERVICE_KEY
    acls:
      - consumer: anon
        group: anon
      - consumer: service_role
        group: admin
    basicauth_credentials:
      - consumer: DASHBOARD
        username: '$DASHBOARD_USERNAME'
        password: '$DASHBOARD_PASSWORD'
    services:
      - name: auth-v1-open
        url: http://supabase-identity-auth:9999/verify
        routes:
          - name: auth-v1-open
            strip_path: true
            paths: [/auth/v1/verify]
        plugins:
          - name: cors
      - name: auth-v1-open-callback
        url: http://supabase-identity-auth:9999/callback
        routes:
          - name: auth-v1-open-callback
            strip_path: true
            paths: [/auth/v1/callback]
        plugins:
          - name: cors
      - name: auth-v1-open-authorize
        url: http://supabase-identity-auth:9999/authorize
        routes:
          - name: auth-v1-open-authorize
            strip_path: true
            paths: [/auth/v1/authorize]
        plugins:
          - name: cors
      - name: auth-v1
        url: http://supabase-identity-auth:9999/
        routes:
          - name: auth-v1-all
            strip_path: true
            paths: [/auth/v1/]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: rest-v1
        url: http://supabase-identity-rest:3000/
        routes:
          - name: rest-v1-all
            strip_path: true
            paths: [/rest/v1/]
        plugins:
          - name: cors
          - name: key-auth
            config:
              hide_credentials: false
          - name: request-transformer
            config:
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]
      - name: meta
        url: http://supabase-identity-meta:8080/
        routes:
          - name: meta-all
            strip_path: true
            paths: [/pg/]
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin]
      - name: dashboard
        url: http://supabase-identity-studio:3000/
        routes:
          - name: dashboard-all
            strip_path: true
            paths: [/]
        plugins:
          - name: cors
          - name: basic-auth
            config:
              hide_credentials: true
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-identity
  namespace: supabase-identity
