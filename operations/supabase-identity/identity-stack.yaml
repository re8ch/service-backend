        command:
        - /bin/sh
        - /home/kong/kong-entrypoint.sh
        envFrom:
        - secretRef:
            name: supabase-identity-secrets
        env:
        - name: KONG_DATABASE
          value: 'off'
        - name: KONG_DECLARATIVE_CONFIG
          value: /usr/local/kong/kong.yml
        - name: KONG_ROUTER_FLAVOR
          value: expressions
        - name: KONG_NGINX_WORKER_PROCESSES
          value: '1'
        - name: KONG_DNS_ORDER
          value: LAST,A,CNAME
        - name: KONG_DNS_NOT_FOUND_TTL
          value: '1'
        - name: KONG_PLUGINS
          value: bundled
        - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
          value: 160k
        - name: KONG_NGINX_PROXY_PROXY_BUFFERS
          value: 64 160k
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout combined
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: ANON_KEY
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: SERVICE_ROLE_KEY
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: kong-config
          mountPath: /home/kong/temp.yml
          subPath: kong.yml
          readOnly: true
        - name: kong-config
          mountPath: /home/kong/kong-entrypoint.sh
          subPath: kong-entrypoint.sh
          readOnly: true
        resources:
          requests:
            cpu: 70m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 512Mi
      volumes:
      - name: kong-config
        configMap:
          name: supabase-identity-kong-config
          defaultMode: 365
