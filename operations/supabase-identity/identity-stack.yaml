  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: studio
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: supabase-identity
        app.kubernetes.io/component: studio
    spec:
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
      - key: dedicated
        operator: Equal
        value: pg-re8ch
        effect: NoSchedule
      containers:
      - name: studio
        image: mjhsdd6xkcym4k.xuanyuan.run/supabase/studio:2026.07.07-sha-a6a04f2
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: supabase-identity-env
        - secretRef:
            name: supabase-identity-secrets
        env:
        - name: HOSTNAME
          value: 0.0.0.0
        - name: STUDIO_PG_META_URL
          value: http://supabase-identity-meta:8080
        - name: SUPABASE_URL
          value: http://supabase-identity-kong:8000
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: ANON_KEY
        - name: SUPABASE_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: SERVICE_ROLE_KEY
        - name: AUTH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: JWT_SECRET
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supabase-identity-secrets
              key: POSTGRES_PASSWORD_URLENCODED
        - name: DEFAULT_ORGANIZATION_NAME
          valueFrom:
            configMapKeyRef:
              name: supabase-identity-env
              key: STUDIO_DEFAULT_ORGANIZATION
        - name: DEFAULT_PROJECT_NAME
          valueFrom:
            configMapKeyRef:
              name: supabase-identity-env
              key: STUDIO_DEFAULT_PROJECT
        - name: ENABLED_FEATURES_LOGS_ALL
          value: 'false'
        - name: SNIPPETS_MANAGEMENT_FOLDER
          value: /tmp/snippets
        - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
          value: /tmp/edge-functions
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 80m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 768Mi
---
apiVersion: apps/v1
