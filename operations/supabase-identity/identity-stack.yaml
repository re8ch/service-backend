    port: 8000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-identity-kong
  namespace: supabase-identity
spec:
  selector:
    app.kubernetes.io/part-of: supabase-identity
    app.kubernetes.io/component: kong
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
