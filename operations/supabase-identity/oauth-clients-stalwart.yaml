apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-oauth-clients-stalwart-v1
  namespace: supabase-identity
data:
  clients.sql: |
    begin;
    insert into auth.oauth_clients (
      id, client_secret_hash, registration_type, client_type,
      token_endpoint_auth_method, redirect_uris, grant_types,
      client_name, client_uri
    ) values (
      '705c1168-43d8-4ec3-980a-0327a59c7fc6', '', 'manual', 'public',
      'none',
      'https://mail.re8ch.com/auth/callback,https://mail.re8ch.com/ar/auth/callback,https://mail.re8ch.com/ca/auth/callback,https://mail.re8ch.com/cs/auth/callback,https://mail.re8ch.com/da/auth/callback,https://mail.re8ch.com/de/auth/callback,https://mail.re8ch.com/en/auth/callback,https://mail.re8ch.com/es/auth/callback,https://mail.re8ch.com/fa/auth/callback,https://mail.re8ch.com/fr/auth/callback,https://mail.re8ch.com/he/auth/callback,https://mail.re8ch.com/hu/auth/callback,https://mail.re8ch.com/it/auth/callback,https://mail.re8ch.com/ja/auth/callback,https://mail.re8ch.com/ko/auth/callback,https://mail.re8ch.com/lv/auth/callback,https://mail.re8ch.com/mn/auth/callback,https://mail.re8ch.com/nb/auth/callback,https://mail.re8ch.com/nl/auth/callback,https://mail.re8ch.com/pl/auth/callback,https://mail.re8ch.com/pt/auth/callback,https://mail.re8ch.com/ro/auth/callback,https://mail.re8ch.com/ru/auth/callback,https://mail.re8ch.com/sk/auth/callback,https://mail.re8ch.com/tr/auth/callback,https://mail.re8ch.com/uk/auth/callback,https://mail.re8ch.com/zh/auth/callback,https://mail.re8ch.com/zh-TW/auth/callback,https://tools.service.re8ch.com/collaboration/oauth/callback',
      'authorization_code,refresh_token', 'RE8CH Mail',
      'https://mail.re8ch.com'
    ) on conflict (id) do update set
      client_secret_hash = excluded.client_secret_hash,
      registration_type = excluded.registration_type,
      client_type = excluded.client_type,
      token_endpoint_auth_method = excluded.token_endpoint_auth_method,
      redirect_uris = excluded.redirect_uris,
      grant_types = excluded.grant_types,
      client_name = excluded.client_name,
      client_uri = excluded.client_uri,
      deleted_at = null,
      updated_at = now();
    commit;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-oauth-clients-stalwart-v1
  namespace: supabase-identity
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: register
          image: postgres:16.9-alpine
          command: [/bin/sh, -ceu]
          args: [psql -X -v ON_ERROR_STOP=1 "$GOTRUE_DB_DATABASE_URL" -f /sql/clients.sql]
          env:
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: GOTRUE_DB_DATABASE_URL}}
          volumeMounts: [{name: sql, mountPath: /sql, readOnly: true}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: sql, configMap: {name: supabase-oauth-clients-stalwart-v1}}
