apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-supabase-auth
  namespace: auth
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: auth-https}
  hostnames: [auth.re8ch.com]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /auth/v1}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: supabase-identity-auth, namespace: supabase-identity, port: 9999}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-auth-route-to-supabase-auth
  namespace: supabase-identity
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: auth}
  to:
    - {group: '', kind: Service, name: supabase-identity-auth}
