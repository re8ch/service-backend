apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-identity-ledger-service-v1
  namespace: supabase-identity
data:
  migration.sql: |
    -- Source: re8ch/cloud-functions@fe166fdec07665eb88a1a2fe2ae474946ff9e7fe
    begin;
    create table if not exists core.service_classes (
      service_class text primary key check (service_class ~ '^[a-z][a-z0-9.-]{2,127}$'),
      display_name text not null check (length(btrim(display_name)) between 1 and 120),
      description text not null default '' check (length(description) <= 2000),
      adapter text not null check (adapter ~ '^[a-z][a-z0-9-]{2,127}$'),
      plans jsonb not null check (jsonb_typeof(plans) = 'array'),
      binding_types jsonb not null check (jsonb_typeof(binding_types) = 'array'),
      lifecycle text not null check (lifecycle in ('published','paused','retired')),
      created_at timestamptz not null default now(),
      updated_at timestamptz not null default now()
    );
    alter table core.service_classes owner to supabase_admin;
    alter table core.service_classes enable row level security;
    revoke all on core.service_classes from public, anon, authenticated;
    do $$ begin
      if exists(select 1 from pg_roles where rolname='service_role') then
        execute 'revoke all on core.service_classes from service_role';
      end if;
    end $$;
    insert into core.service_classes(service_class,display_name,description,adapter,plans,binding_types,lifecycle)
    values('application.ledger.v1','Ledger',
      'Access to the retained RE8CH Ledger runtime without transferring runtime or data ownership.',
      'existing-ledger-access','["managed-access"]','["endpoint:oauth"]','published')
    on conflict(service_class) do update set
      display_name=excluded.display_name,description=excluded.description,adapter=excluded.adapter,
      plans=excluded.plans,binding_types=excluded.binding_types,lifecycle=excluded.lifecycle,updated_at=now();
    create or replace function public.tenant_service_catalog()
    returns jsonb language sql stable security definer set search_path=pg_catalog,pg_temp as $$
      select coalesce(jsonb_agg(jsonb_build_object(
        'serviceClass',service_class,'displayName',display_name,'description',description,
        'adapter',adapter,'plans',plans,'bindingTypes',binding_types)
        order by service_class),'[]'::jsonb)
      from core.service_classes where lifecycle='published'
    $$;
    alter function public.tenant_service_catalog() owner to supabase_admin;
    revoke all on function public.tenant_service_catalog() from public, anon;
    grant execute on function public.tenant_service_catalog() to authenticated;
    do $$ begin
      if exists(select 1 from pg_roles where rolname='service_role') then
        execute 'grant execute on function public.tenant_service_catalog() to service_role';
      end if;
    end $$;
    notify pgrst, 'reload schema';
    commit;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: supabase-identity-ledger-service-v1
  namespace: supabase-identity
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {kubernetes.io/hostname: r640}
      tolerations:
      - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
      - name: migrate
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        command: [/bin/sh, -ceu]
        args: ["psql -X -v ON_ERROR_STOP=1 -f /sql/migration.sql"]
        env:
        - {name: PGHOST, value: pg-re8ch-primary.pigsty-external.svc.cluster.local}
        - {name: PGDATABASE, value: re8ch_identity}
        - name: PGUSER
          valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: POSTGRES_USER_READ_WRITE}}
        - name: PGPASSWORD
          valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: POSTGRES_PASSWORD}}
        volumeMounts: [{name: sql, mountPath: /sql, readOnly: true}]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 250m, memory: 128Mi}
      volumes:
      - name: sql
        configMap: {name: supabase-identity-ledger-service-v1}
