apiVersion: v1
kind: Service
metadata:
  name: supabase-identity-realtime
  namespace: supabase-identity
spec:
  selector:
    app.kubernetes.io/component: realtime
  ports:
    - {name: http, port: 4000, targetPort: 4000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-identity-realtime
  namespace: supabase-identity
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/component: realtime}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: supabase-identity
        app.kubernetes.io/component: realtime
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: realtime
          image: docker.io/supabase/realtime:v2.134.10@sha256:c1d078d929608f3eb4d441e30317bbdccc1bfcc1169efa3d1a26d4252417cc76
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 4000}
          env:
            - {name: PORT, value: '4000'}
            - {name: DB_HOST, value: pg-re8ch-primary.pigsty-external.svc.cluster.local}
            - {name: DB_PORT, value: '5432'}
            - {name: DB_NAME, value: re8ch_identity}
            - {name: DB_USER, value: postgres}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: POSTGRES_PASSWORD}}
            - {name: DB_AFTER_CONNECT_QUERY, value: 'SET search_path TO _realtime'}
            - name: DB_ENC_KEY
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: REALTIME_DB_ENC_KEY}}
            - name: API_JWT_SECRET
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: JWT_SECRET}}
            - name: API_JWT_JWKS
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: JWT_PUBLIC_JWKS}}
            - name: SECRET_KEY_BASE
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: SECRET_KEY_BASE}}
            - {name: ERL_AFLAGS, value: '-proto_dist inet_tcp'}
            - {name: DNS_NODES, value: "''"}
            - {name: APP_NAME, value: realtime}
            - {name: SEED_SELF_HOST, value: 'true'}
            - {name: SELF_HOST_TENANT_NAME, value: supabase-identity-realtime}
            - {name: RUN_JANITOR, value: 'true'}
            - {name: DISABLE_HEALTHCHECK_LOGGING, value: 'true'}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1024Mi}
