apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: re8ch-supabase-auth-db-rw
  namespace: supabase-identity
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: db-rw-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: db-rw-https}
  hostnames: [db-rw.re8ch.com]
  rules:
    # Keep the public GoTrue token URL stable while normalizing non-RFC error
    # responses in tenant-api for OAuth clients that refresh automatically.
    - matches:
        - {path: {type: Exact, value: /auth/v1/oauth/token}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /oauth/token/compat}
      backendRefs:
        - {name: tenant-api, namespace: tenant-infrastructure, port: 80}
    - matches:
        - {path: {type: PathPrefix, value: /auth/v1}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: supabase-identity-auth, port: 9999}
    # RFC 8414 inserts discovery before the issuer path (/auth/v1).
    - matches:
        - {path: {type: Exact, value: /.well-known/oauth-authorization-server/auth/v1}}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /.well-known/oauth-authorization-server}
      backendRefs:
        - {name: supabase-identity-auth, port: 9999}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-db-rw-auth-route-to-tenant-api
  namespace: tenant-infrastructure
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: supabase-identity}
  to:
    - {group: '', kind: Service, name: tenant-api}
