apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supabase-identity-open-oauth
  namespace: supabase-identity
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}
  hostnames: [open.service.re8ch.com]
  rules:
    - matches: [{method: POST, path: {type: Exact, value: /oauth-applications/v1/register}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /rpc/create_oauth_application}}}]
      backendRefs: [{name: supabase-identity-rest, port: 3000}]
    - matches: [{method: POST, path: {type: Exact, value: /oauth-applications/v1/list}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /rpc/my_oauth_applications}}}]
      backendRefs: [{name: supabase-identity-rest, port: 3000}]
    - matches: [{method: POST, path: {type: Exact, value: /oauth-applications/v1/lifecycle}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /rpc/set_oauth_application_lifecycle}}}]
      backendRefs: [{name: supabase-identity-rest, port: 3000}]
    - matches: [{method: POST, path: {type: Exact, value: /oauth-applications/v1/rotate-secret}}]
      filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /rpc/rotate_oauth_application_secret}}}]
      backendRefs: [{name: supabase-identity-rest, port: 3000}]
