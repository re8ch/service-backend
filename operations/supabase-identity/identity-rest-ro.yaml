apiVersion: v1
kind: Service
metadata:
  name: supabase-identity-rest-ro
  namespace: supabase-identity
spec:
  clusterIP: 192.0.2.44
  selector:
    app.kubernetes.io/component: rest-ro
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-identity-rest-ro
  namespace: supabase-identity
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/component: rest-ro}
  template:
    metadata:
      annotations:
        identity.re8ch.com/schema-revision: tenant-runtime-memberships-v1
      labels:
        app.kubernetes.io/part-of: supabase-identity
        app.kubernetes.io/component: rest-ro
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
      containers:
        - name: rest-ro
          image: mjhsdd6xkcym4k.xuanyuan.run/postgrest/postgrest:v14.12
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: PGRST_DB_URI
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: PGRST_RO_DB_URI}}
            - {name: PGRST_DB_SCHEMAS, value: api}
            - {name: PGRST_DB_ANON_ROLE, value: anon}
            - {name: PGRST_DB_MAX_ROWS, value: '1000'}
            - {name: PGRST_DB_EXTRA_SEARCH_PATH, value: public}
            - {name: PGRST_DB_USE_LEGACY_GUCS, value: 'false'}
            - {name: PGRST_DB_CHANNEL_ENABLED, value: 'false'}
            - name: PGRST_JWT_SECRET
              valueFrom: {secretKeyRef: {name: supabase-identity-secrets, key: JWT_VERIFICATION_JWKS}}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 40m, memory: 64Mi}
            limits: {cpu: 100m, memory: 256Mi}
