[project]
name = "re8ch-service-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.scripts]
re8ch-workspace = "workspace:main"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["operations/cloud-platform"]
testpaths = ["tests"]
