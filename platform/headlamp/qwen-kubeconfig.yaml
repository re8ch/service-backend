apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-qwen-kubeconfig-template
  namespace: headlamp
data:
  qwen.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: qwen
        cluster:
          server: https://192.0.2.154:6443
          certificate-authority-data: 
    contexts:
      - name: qwen
        context:
          cluster: qwen
          user: qwen-oidc
    current-context: qwen
    users:
      - name: qwen-oidc
        user:
          auth-provider:
            name: oidc
            config:
              idp-issuer-url: https://dex.re8ch.com
              client-id: headlamp
              scope: openid,profile,email,groups
