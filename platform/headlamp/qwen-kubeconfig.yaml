apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-qwen-kubeconfig-template
  namespace: headlamp
data:
  qwen.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: qwen
        cluster:
          server: https://among-clusters.service.re8ch.com
    contexts:
      - name: qwen
        context:
          cluster: qwen
          user: qwen-managed-access
    current-context: qwen
    users:
      - name: qwen-managed-access
        user:
          token: credential://among-clusters/byoc-pilot/qwen-headlamp-admin
