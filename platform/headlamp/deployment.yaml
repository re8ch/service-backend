apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Two eligible nodes plus required anti-affinity cannot accommodate a surge pod.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: headlamp
              topologyKey: kubernetes.io/hostname
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-penrose-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/advanced-fabric-0.8.0
              lock=/headlamp/plugins/.advanced-fabric-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              # Headlamp currently has one active replica because OAuth state is
              # process-local. Recover the empty mkdir lock left by a terminated
              # installer before taking ownership of it.
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.advanced-fabric-0.8.0.new
              cp /plugin/plugin.tar.gz "$archive"
              echo '01df0d11ea74bea3475b9a4f4cdec28a302c2fc6cab59c7d4278b9c1e63b3d0d  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage"
              mv "$stage/headlamp-advanced-fabric" "$target"
              rm -rf "$stage"
              for old in /headlamp/plugins/advanced-fabric-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: penrose-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-flux-plugin
          image: registry.re8ch.com/functions-shared/headlamp-plugin-flux@sha256:1570eba449f69bbc0d07bfc7fa983abcdc747c1885be4b15ea4792b4d63e5595
          command: [/bin/sh, -c]
          args:
            - cp -R /plugins/flux /headlamp/plugins/flux.new && rm -rf /headlamp/plugins/flux && mv /headlamp/plugins/flux.new /headlamp/plugins/flux
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
        - name: render-qwen-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/qwen.kubeconfig.template > /work/qwen.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: qwen-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: qwen-kubeconfig
              mountPath: /work
        - name: render-artc-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/artc.kubeconfig.template > /work/artc.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: artc-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /work
      containers:
        - name: headlamp
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -in-cluster-context-name=re8ch-k3s
            - -enable-dynamic-clusters
            - -kubeconfig=/etc/headlamp/qwen/qwen.kubeconfig:/etc/headlamp/artc/artc.kubeconfig
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            - -oidc-idp-issuer-url=https://dex.re8ch.com
            - -oidc-callback-url=https://headlamp.re8ch.com/oidc-callback
            - -oidc-scopes=openid,profile,email,groups
            - -oidc-use-cookie
            - -plugins-dir=/headlamp/plugins
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: qwen-kubeconfig
              mountPath: /etc/headlamp/qwen
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /etc/headlamp/artc
              readOnly: true
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: headlamp-plugins-v2
        - name: penrose-plugin
          configMap:
            name: headlamp-penrose-plugin-v080
        - name: qwen-kubeconfig-template
          configMap:
            name: headlamp-qwen-kubeconfig-template
        - name: qwen-kubeconfig
          emptyDir: {}
        - name: artc-kubeconfig-template
          configMap:
            name: headlamp-artc-kubeconfig-template
        - name: artc-kubeconfig
          emptyDir: {}
