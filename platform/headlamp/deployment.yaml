apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Avoid a surge pod while both replicas share the temporary healthy
      # domain-ex placement; keep one serving replica during later rollouts.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      # Keep the OIDC backchannel on the in-cluster Cilium Gateway. The public
      # edge currently redirects explicit :443 requests to itself indefinitely.
      hostAliases:
        - ip: "192.0.2.201"
          hostnames:
            - dex.re8ch.com
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # Plugin bundles are materialized into each pod from
                    # immutable ConfigMaps. Keep the management UI on the
                    # healthy node that already has the pinned Headlamp image;
                    # restricted-node-6dc3f140f9 cannot advance new Pods and zan is currently unable
                    # to complete this image pull.
                    values: [domain-ex]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: headlamp
                topologyKey: kubernetes.io/hostname
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-runtime-anatomy-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/runtime-anatomy-0.2.0
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo '810706935eacb94a354af4336adc93c6222b0592361316fe6e10846397220a20  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: runtime-anatomy-plugin, mountPath: /plugin, readOnly: true}
        - name: install-birfucate-browser
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/birfucate-browser-0.3.1
              lock=/headlamp/plugins/.birfucate-browser-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.birfucate-browser-0.3.1.new
              cp /plugin/plugin.tar.gz "$archive"
              echo 'ce243b5656a9bde209515267bba6b7cfdf80cfacf4f094a443c57f397fa9ae42  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage"
              mv "$stage/headlamp-birfucate-browser" "$target"
              rm -rf "$stage"
              for old in /headlamp/plugins/birfucate-browser-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: birfucate-browser-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-advanced-fabric-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/advanced-fabric-0.22.0
              lock=/headlamp/plugins/.advanced-fabric-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.advanced-fabric-0.22.0.new
              base64 -d /plugin/plugin.tar.gz.b64 > "$archive"
              echo '18444f43657c435a4483043543763992e5a7cf83e6bc99f544c19ce3bd43a74a  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/advanced-fabric-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: advanced-fabric-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-among-clusters-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/among-clusters-0.3.6
              lock=/headlamp/plugins/.among-clusters-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              # Headlamp currently has one active replica because OAuth state is
              # process-local. Recover the empty mkdir lock left by a terminated
              # installer before taking ownership of it.
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.among-clusters-0.3.6.new
              cp /plugin/plugin.tar.gz "$archive"
              echo 'aee9c0fbc3f16d200c866cb8ca41394d5c7070e51b3baa9a27bcb6284dbadcf1  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/among-clusters-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: among-clusters-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-public-edge-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/public-edge-0.2.0
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo '13a0cc09fe0b4ed28cdbbf876c8e13065a7329f7cad2e55c461426f8fcf28326  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: public-edge-plugin, mountPath: /plugin, readOnly: true}
        - name: install-mihomos-cluster-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/mihomos-cluster-0.1.1
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo 'c9cf279206f877433cb3800219c4938f4015cb5402b07f3cf2fa121754cfd75e  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: mihomos-cluster-plugin, mountPath: /plugin, readOnly: true}
        - name: install-flux-plugin
          image: registry.re8ch.com/functions-shared/headlamp-plugin-flux@sha256:1570eba449f69bbc0d07bfc7fa983abcdc747c1885be4b15ea4792b4d63e5595
          command: [/bin/sh, -c]
          args:
            - cp -R /plugins/flux /headlamp/plugins/flux.new && rm -rf /headlamp/plugins/flux && mv /headlamp/plugins/flux.new /headlamp/plugins/flux
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
        - name: render-qwen-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/qwen.kubeconfig.template > /work/qwen.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: qwen-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: qwen-kubeconfig
              mountPath: /work
        - name: render-artc-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/artc.kubeconfig.template > /work/artc.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: artc-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /work
      containers:
        - name: headlamp
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -in-cluster-context-name=re8ch-k3s
            - -enable-dynamic-clusters
            - -kubeconfig=/etc/headlamp/qwen/qwen.kubeconfig:/etc/headlamp/artc/artc.kubeconfig
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            - -oidc-idp-issuer-url=https://dex.re8ch.com
            # Headlamp v0.42 represents an unset in-cluster OIDC CA as a
            # non-nil empty string. Point it at the valid system trust bundle.
            - -oidc-ca-file=/etc/ssl/certs/ca-certificates.crt
            - -oidc-callback-url=https://headlamp.re8ch.com/oidc-callback
            # Headlamp adds openid itself when building the authorization URL.
            - -oidc-scopes=profile,email,groups,offline_access
            - -oidc-use-cookie
            - -plugins-dir=/headlamp/plugins
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: qwen-kubeconfig
              mountPath: /etc/headlamp/qwen
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /etc/headlamp/artc
              readOnly: true
      volumes:
        - name: plugins
          # Plugins are installed deterministically by init containers.
          # Keep the runtime directory pod-local so restricted-node-6dc3f140f9 failover does not
          # depend on a cross-node CephFS NodePublish operation.
          emptyDir: {}
        - name: birfucate-browser-plugin
          configMap:
            name: headlamp-birfucate-browser-v031
        - name: advanced-fabric-plugin
          configMap:
            name: headlamp-advanced-fabric-v0220
        - name: among-clusters-plugin
          configMap:
            name: headlamp-among-clusters-v036
        - name: public-edge-plugin
          configMap:
            name: headlamp-public-edge-v020
        - name: mihomos-cluster-plugin
          configMap:
            name: headlamp-mihomos-cluster-v011
        - name: runtime-anatomy-plugin
          configMap:
            name: headlamp-runtime-anatomy-v020
        - name: qwen-kubeconfig-template
          configMap:
            name: headlamp-qwen-kubeconfig-template
        - name: qwen-kubeconfig
          emptyDir: {}
        - name: artc-kubeconfig-template
          configMap:
            name: headlamp-artc-kubeconfig-template
        - name: artc-kubeconfig
          emptyDir: {}
