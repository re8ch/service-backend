apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Two eligible nodes plus required anti-affinity cannot accommodate a surge pod.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      # Keep the OIDC backchannel on the in-cluster Cilium Gateway. The public
      # edge currently redirects explicit :443 requests to itself indefinitely.
      hostAliases:
        - ip: "192.0.2.201"
          hostnames:
            - dex.re8ch.com
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    # restricted-node-6dc3f140f9 is the durable failover/build node when either WSL
                    # control-plane node is unavailable. The plugins PVC is
                    # CephFS, so the same versioned bundle remains shared.
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb, restricted-node-6dc3f140f9]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: headlamp
              topologyKey: kubernetes.io/hostname
      tolerations:
        - operator: Exists
      initContainers:
        - name: install-birfucate-browser
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/birfucate-browser-0.1.0
              lock=/headlamp/plugins/.birfucate-browser-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.birfucate-browser-0.1.0.new
              cp /plugin/plugin.tar.gz "$archive"
              echo 'f86e875da3870a43d6648406e75e462cfd319c7998de631a2f080336ed9d5b75  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage"
              mv "$stage/headlamp-birfucate-browser" "$target"
              rm -rf "$stage"
              for old in /headlamp/plugins/birfucate-browser-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: birfucate-browser-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-advanced-fabric-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/advanced-fabric-0.12.0
              lock=/headlamp/plugins/.advanced-fabric-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.advanced-fabric-0.12.0.new
              base64 -d /plugin/plugin.tar.gz.b64 > "$archive"
              echo 'da561b967d0a08fe90a5430893643080a0c2f439409f0bf26017efa9ff674d9c  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/advanced-fabric-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: advanced-fabric-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-among-clusters-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/among-clusters-0.2.8
              lock=/headlamp/plugins/.among-clusters-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              # Headlamp currently has one active replica because OAuth state is
              # process-local. Recover the empty mkdir lock left by a terminated
              # installer before taking ownership of it.
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.among-clusters-0.2.8.new
              base64 -d /plugin/plugin.tar.gz.b64 > "$archive"
              echo '6ce80c28f9f74eca3bf3d0be3f24454817c75f05dd871cdf8d125915b7b0afc6  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/among-clusters-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: among-clusters-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-public-edge-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/public-edge-0.1.1
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo 'efd28306361723382cf776c5fcc6c07610d030359ea7ba4222ca36944f1a7b2a  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: public-edge-plugin, mountPath: /plugin, readOnly: true}
        - name: install-mihomos-cluster-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/mihomos-cluster-0.1.1
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo 'c9cf279206f877433cb3800219c4938f4015cb5402b07f3cf2fa121754cfd75e  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: mihomos-cluster-plugin, mountPath: /plugin, readOnly: true}
        - name: install-flux-plugin
          image: registry.re8ch.com/functions-shared/headlamp-plugin-flux@sha256:1570eba449f69bbc0d07bfc7fa983abcdc747c1885be4b15ea4792b4d63e5595
          command: [/bin/sh, -c]
          args:
            - cp -R /plugins/flux /headlamp/plugins/flux.new && rm -rf /headlamp/plugins/flux && mv /headlamp/plugins/flux.new /headlamp/plugins/flux
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
        - name: render-qwen-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/qwen.kubeconfig.template > /work/qwen.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: qwen-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: qwen-kubeconfig
              mountPath: /work
        - name: render-artc-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/artc.kubeconfig.template > /work/artc.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: artc-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /work
      containers:
        - name: headlamp
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -in-cluster-context-name=re8ch-k3s
            - -enable-dynamic-clusters
            - -kubeconfig=/etc/headlamp/qwen/qwen.kubeconfig:/etc/headlamp/artc/artc.kubeconfig
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            - -oidc-idp-issuer-url=https://dex.re8ch.com
            # Headlamp v0.42 represents an unset in-cluster OIDC CA as a
            # non-nil empty string. Point it at the valid system trust bundle.
            - -oidc-ca-file=/etc/ssl/certs/ca-certificates.crt
            - -oidc-callback-url=https://headlamp.re8ch.com/oidc-callback
            # Headlamp adds openid itself when building the authorization URL.
            - -oidc-scopes=profile,email,groups,offline_access
            - -oidc-use-cookie
            - -plugins-dir=/headlamp/plugins
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: qwen-kubeconfig
              mountPath: /etc/headlamp/qwen
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /etc/headlamp/artc
              readOnly: true
      volumes:
        - name: plugins
          # Plugins are installed deterministically by init containers.
          # Keep the runtime directory pod-local so restricted-node-6dc3f140f9 failover does not
          # depend on a cross-node CephFS NodePublish operation.
          emptyDir: {}
        - name: birfucate-browser-plugin
          configMap:
            name: headlamp-birfucate-browser-v010
        - name: advanced-fabric-plugin
          configMap:
            name: headlamp-advanced-fabric-v0120
        - name: among-clusters-plugin
          configMap:
            name: headlamp-among-clusters-v028
        - name: public-edge-plugin
          configMap:
            name: headlamp-public-edge-v011
        - name: mihomos-cluster-plugin
          configMap:
            name: headlamp-mihomos-cluster-v011
        - name: qwen-kubeconfig-template
          configMap:
            name: headlamp-qwen-kubeconfig-template
        - name: qwen-kubeconfig
          emptyDir: {}
        - name: artc-kubeconfig-template
          configMap:
            name: headlamp-artc-kubeconfig-template
        - name: artc-kubeconfig
          emptyDir: {}
