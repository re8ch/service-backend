apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  # Headlamp v0.42 keeps OAuth state in process memory. Keep one active
  # instance and let Kubernetes recreate it on another control-plane node.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      annotations:
        scheduling.re8ch.com/placement-class: control-plane-critical
      labels:
        app.kubernetes.io/name: headlamp
        scheduling.re8ch.com/control-plane-allowed: "true"
    spec:
      serviceAccountName: headlamp
      priorityClassName: system-cluster-critical
      # Keep token and key requests for the configured Dex service issuer on the
      # in-cluster Cilium Gateway, avoiding public-edge hairpin routing.
      hostAliases:
        - ip: "192.0.2.209"
          hostnames:
            - dex.service.re8ch.com
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: headlamp
                topologyKey: kubernetes.io/hostname
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: PreferNoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      # Use the selected control-plane node's local API listener. This removes
      # the single remote node/transit address from Headlamp's watch path.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: install-runtime-anatomy-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/runtime-anatomy-0.2.0
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo '6684c8e3e1fad425931e9fc130363f9eb414b5fddc3a06b6c7ec731297352e99  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: runtime-anatomy-plugin, mountPath: /plugin, readOnly: true}
        - name: install-birfucate-browser
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/birfucate-browser-0.4.5
              lock=/headlamp/plugins/.birfucate-browser-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.birfucate-browser-0.4.5.new
              cp /plugin/plugin.tar.gz "$archive"
              echo '5a42937fa9ae1d8d712b1aa90565f32ce28db7b54d8cb24b865ca38395ff696e  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/birfucate-browser-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: birfucate-browser-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-advanced-fabric-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/advanced-fabric-0.23.1
              lock=/headlamp/plugins/.advanced-fabric-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.advanced-fabric-0.23.1.new
              base64 -d /plugin/plugin.tar.gz.b64 > "$archive"
              echo 'd57bba5f5e4c0988d353e4ec04abfcfdd68d32c0a96418bda22ece3665ab2af5  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/advanced-fabric-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: advanced-fabric-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-among-clusters-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/among-clusters-0.3.24
              lock=/headlamp/plugins/.among-clusters-install.lock
              if [ -f "$target/package.json" ]; then exit 0; fi
              # Headlamp currently has one active replica because OAuth state is
              # process-local. Recover the empty mkdir lock left by a terminated
              # installer before taking ownership of it.
              rmdir "$lock" 2>/dev/null || true
              until mkdir "$lock" 2>/dev/null; do
                if [ -f "$target/package.json" ]; then exit 0; fi
                sleep 2
              done
              trap 'rmdir "$lock" 2>/dev/null || true' EXIT
              archive=/tmp/plugin.tar.gz
              stage=/headlamp/plugins/.among-clusters-0.3.24.new
              cp /plugin/plugin.tar.gz "$archive"
              echo '47d9658c3e8596e99a13dd86c9dd273078917176fe4529d35467d18d6c59ce4f  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$stage"
              mkdir -p "$stage"
              tar -xzf "$archive" -C "$stage" --strip-components=1
              mv "$stage" "$target"
              for old in /headlamp/plugins/among-clusters-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: among-clusters-plugin
              mountPath: /plugin
              readOnly: true
        - name: install-public-edge-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/public-edge-0.2.1
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo 'd0e0d61e977ecb1e714fe5141e19ee5df146e953e53e73fdedb238721796df05  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
              for old in /headlamp/plugins/public-edge-*; do
                [ "$old" = "$target" ] || rm -rf "$old"
              done
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: public-edge-plugin, mountPath: /plugin, readOnly: true}
        - name: install-mihomos-cluster-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/mihomos-cluster-0.1.1
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo 'c9cf279206f877433cb3800219c4938f4015cb5402b07f3cf2fa121754cfd75e  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: mihomos-cluster-plugin, mountPath: /plugin, readOnly: true}
        - name: install-flux-plugin
          image: registry.re8ch.com/functions-shared/headlamp-plugin-flux@sha256:1570eba449f69bbc0d07bfc7fa983abcdc747c1885be4b15ea4792b4d63e5595
          command: [/bin/sh, -c]
          args:
            - cp -R /plugins/flux /headlamp/plugins/flux.new && rm -rf /headlamp/plugins/flux && mv /headlamp/plugins/flux.new /headlamp/plugins/flux
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
        - name: install-secretary-plugin
          image: curlimages/curl@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
          command: [/bin/sh, -ec]
          args:
            - |
              target=/headlamp/plugins/secretary-0.3.0
              archive=/tmp/plugin.tar.gz
              cp /plugin/plugin.tar.gz "$archive"
              echo '1992289825c75e660677b48ab5e046a5dfcf8be84ad8468ea62a60c660dd8516  /tmp/plugin.tar.gz' | sha256sum -c -
              rm -rf "$target.new"
              mkdir -p "$target.new"
              tar -xzf "$archive" -C "$target.new" --strip-components=1
              rm -rf "$target"
              mv "$target.new" "$target"
          volumeMounts:
            - {name: plugins, mountPath: /headlamp/plugins}
            - {name: secretary-plugin, mountPath: /plugin, readOnly: true}
        - name: render-qwen-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/qwen.kubeconfig.template > /work/qwen.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: qwen-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: qwen-kubeconfig
              mountPath: /work
        - name: render-artc-kubeconfig
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              while IFS= read -r line; do
                printf '%s\n' "$line"
                if [ "$line" = "          client-id: headlamp" ]; then
                  printf '          client-%s: "%s"\n' secret "$OIDC_CLIENT_SECRET"
                fi
              done < /template/artc.kubeconfig.template > /work/artc.kubeconfig
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          volumeMounts:
            - name: artc-kubeconfig-template
              mountPath: /template
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /work
      containers:
        - name: headlamp
          image: registry.re8ch.com/functions-shared/headlamp@sha256:5227bf50d917734c1903aa3cefd22569eb477904ea791530b42a5c223519f121
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -in-cluster-context-name=re8ch-k3s
            - -enable-dynamic-clusters
            - -kubeconfig=/etc/headlamp/qwen/qwen.kubeconfig:/etc/headlamp/artc/artc.kubeconfig
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(OIDC_CLIENT_SECRET)
            # The in-cluster context sends the browser's OIDC token directly to
            # kube-apiserver. Keep this on the canonical issuer that every
            # control-plane API already trusts. The service-domain Dex instance
            # is additive and must not become Headlamp's issuer until Headlamp
            # uses the Paralus access proxy instead of the bare Kubernetes API.
            - -oidc-idp-issuer-url=https://dex.re8ch.com
            # Headlamp v0.42 represents an unset in-cluster OIDC CA as a
            # non-nil empty string. Point it at the valid system trust bundle.
            - -oidc-ca-file=/etc/ssl/certs/ca-certificates.crt
            - -oidc-callback-url=https://headlamp.service.re8ch.com/oidc-callback
            # Headlamp adds openid itself when building the authorization URL.
            - -oidc-scopes=profile,email,groups,offline_access
            - -oidc-use-cookie
            - -plugins-dir=/headlamp/plugins
          env:
            # The pod is placed on a control-plane node with host networking;
            # use that node's local API listener. Kubernetes can recreate the
            # pod on another eligible control plane without changing config.
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "6443"
            - name: KUBERNETES_SERVICE_PORT_HTTPS
              value: "6443"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-oidc
                  key: client-secret
          ports:
            - name: http
              containerPort: 4466
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            - name: qwen-kubeconfig
              mountPath: /etc/headlamp/qwen
              readOnly: true
            - name: artc-kubeconfig
              mountPath: /etc/headlamp/artc
              readOnly: true
      volumes:
        - name: plugins
          # Plugins are installed deterministically by init containers.
          # Keep the runtime directory pod-local so restricted-node-6dc3f140f9 failover does not
          # depend on a cross-node CephFS NodePublish operation.
          emptyDir: {}
        - name: birfucate-browser-plugin
          configMap:
            name: headlamp-birfucate-browser-v045
        - name: advanced-fabric-plugin
          configMap:
            name: headlamp-advanced-fabric-v0231
        - name: among-clusters-plugin
          configMap:
            name: headlamp-among-clusters-v0324
        - name: public-edge-plugin
          configMap:
            name: headlamp-public-edge-v021
        - name: mihomos-cluster-plugin
          configMap:
            name: headlamp-mihomos-cluster-v011
        - name: secretary-plugin
          configMap:
            name: headlamp-secretary-v030
        - name: runtime-anatomy-plugin
          configMap:
            name: headlamp-runtime-anatomy-v020
        - name: qwen-kubeconfig-template
          configMap:
            name: headlamp-qwen-kubeconfig-template
        - name: qwen-kubeconfig
          emptyDir: {}
        - name: artc-kubeconfig-template
          configMap:
            name: headlamp-artc-kubeconfig-template
        - name: artc-kubeconfig
          emptyDir: {}
