apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: headlamp
  namespace: headlamp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: headlamp
  namespace: headlamp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: headlamp
  # Headlamp v0.42 stores OAuth state in process memory. A second replica can
  # receive the callback and reject a login started by the first replica.
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
