apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-atlantic-kubeconfig-template
  namespace: headlamp
data:
  atlantic.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: re8ch-atlantic
        cluster:
          server: https://among-clusters.service.re8ch.com
    contexts:
      - name: re8ch-atlantic
        context:
          cluster: re8ch-atlantic
          user: re8ch-atlantic-managed-access
    current-context: re8ch-atlantic
    users:
      - name: re8ch-atlantic-managed-access
        user:
          token: credential://among-clusters/byoc-pilot/re8ch-atlantic-headlamp-admin
