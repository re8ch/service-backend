apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-admin-github-woomou
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: re8ch-platform
    re8ch.com/access-level: cluster-admin
    re8ch.com/principal-type: human-oidc-user
  annotations:
    re8ch.com/identity-source: dex-break-glass-group
    re8ch.com/access-contract: direct-kubernetes-superuser-not-for-product-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  # Direct Kubernetes authorization is reserved for the reviewed break-glass
  # group. Product users are authorized through Paralus projects and groups.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:re8ch:k8s-admins
