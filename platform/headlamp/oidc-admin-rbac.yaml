apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-admin-github-woomou
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: re8ch-platform
    re8ch.com/access-level: cluster-admin
    re8ch.com/principal-type: human-oidc-user
  annotations:
    re8ch.com/identity-source: stalwart-idp
    re8ch.com/equivalent-principal: oidc:admin@re8ch.com
    re8ch.com/identity-evidence: "Live Supabase and RE8CH Auth records identify harry@re8ch.com as the administrator; admin@re8ch.com has no account record"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  # Stalwart currently emits an email claim without groups.
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:harry@re8ch.com
