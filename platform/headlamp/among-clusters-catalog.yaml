apiVersion: v1
kind: ConfigMap
metadata:
  name: among-clusters-catalog
  namespace: headlamp
  labels:
    app.kubernetes.io/name: among-clusters
    access.re8ch.com/relationship: controlled-subcluster
data:
  catalog.json: |
    {
      "observedFrom": "re8ch-k3s",
      "refreshSeconds": 15,
      "clusters": [
        {
          "context": "re8ch-k3s",
          "displayName": "RE8CH Hub",
          "role": "hub",
          "owner": "re8ch",
          "relationship": "coordination-hub",
          "sharedServices": [
            {"name": "Dex OIDC", "kind": "identity-provider", "direction": "consumer-to-owner", "endpoint": "https://dex.re8ch.com", "access": "OIDC discovery and registered Headlamp client", "status": "active"},
            {"name": "Headlamp", "kind": "management-ui", "direction": "bidirectional", "endpoint": "https://headlamp.re8ch.com", "access": "owner-approved Kubernetes RBAC", "status": "active"}
          ]
        },
        {
          "context": "artc",
          "displayName": "artc",
          "role": "controlled-subcluster",
          "owner": "artc",
          "relationship": "api-access-only",
          "sharedServices": [
            {"name": "artc Kubernetes API", "kind": "kubernetes-api", "direction": "owner-to-consumer", "endpoint": "https://192.0.2.125:6443", "access": "Dex OIDC plus owner-controlled RBAC", "status": "active"}
          ]
        },
        {
          "context": "qwen",
          "displayName": "qwen",
          "role": "controlled-subcluster",
          "owner": "qwen",
          "relationship": "api-access-only",
          "sharedServices": [
            {"name": "qwen Kubernetes API", "kind": "kubernetes-api", "direction": "owner-to-consumer", "endpoint": "https://192.0.2.154:6443", "access": "Dex OIDC plus owner-controlled RBAC", "status": "active"}
          ]
        }
      ]
    }
