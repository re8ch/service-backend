apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-artc-kubeconfig-template
  namespace: headlamp
data:
  artc.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: artc
        cluster:
          server: http://among-clusters-credential-broker.credential-broker.svc/k8s/byoc-pilot/artc-headlamp-admin
    contexts:
      - name: artc
        context:
          cluster: artc
          user: artc-managed-access
    current-context: artc
    users:
      - name: artc-managed-access
        user:
          auth-provider:
            name: oidc
            config:
              client-id: headlamp
              idp-issuer-url: https://dex.re8ch.com
              scope: openid,profile,email,groups,offline_access
