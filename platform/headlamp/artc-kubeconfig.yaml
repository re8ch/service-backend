apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-artc-kubeconfig-template
  namespace: headlamp
data:
  artc.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: artc
        cluster:
          server: https://among-clusters.re8ch.com
    contexts:
      - name: artc
        context:
          cluster: artc
          user: artc-managed-access
    current-context: artc
    users:
      - name: artc-managed-access
        user:
          token: credential://among-clusters/byoc-pilot/artc-headlamp-admin
