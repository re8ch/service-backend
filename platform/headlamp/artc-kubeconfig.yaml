apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-artc-kubeconfig-template
  namespace: headlamp
data:
  artc.kubeconfig.template: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: artc
        cluster:
          server: https://controlled-cluster-relay.headlamp.svc:16443
          tls-server-name: artc-1
          certificate-authority-data: 
    contexts:
      - name: artc
        context:
          cluster: artc
          user: artc-oidc
    current-context: artc
    users:
      - name: artc-oidc
        user:
          auth-provider:
            name: oidc
            config:
              idp-issuer-url: https://dex.re8ch.com
              client-id: headlamp
              scope: openid,profile,email,groups,offline_access
