apiVersion: v1
kind: ConfigMap
metadata:
  name: public-edge-catalog
  namespace: kube-system
  annotations:
    networking.re8ch.com/description: Read-only inventory of externally delivered sites shown in Headlamp Public Edge.
data:
  sites.json: |
    {
      "sites": [
        {
          "name": "RE8CH User Hub",
          "hostnames": ["auth.re8ch.com"],
          "provider": "Tencent EdgeOne",
          "delivery": "active",
          "origin": "auth-re8ch-1301339749.cos-website.ap-guangzhou.myqcloud.com",
          "dnsMode": "Cloudflare parent CNAME to EdgeOne",
          "sourceOfTruth": "re8ch/user-hub public/",
          "notes": "Static assets use COS and EdgeOne; dynamic auth paths use the EdgeOne rule and Cloudflare-proxied Cilium origin. The old cluster routes remain for rollback."
        }
      ]
    }
