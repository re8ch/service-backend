apiVersion: v1
kind: Service
metadata:
  name: headlamp-gateway-backend
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    networking.re8ch.com/origin: gateway
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  selector:
    # The Deployment is single-replica while Headlamp keeps OAuth state in
    # process memory. Select the Ready pod directly so a node reschedule does
    # not depend on the legacy active-elector or a node-local backend.
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
