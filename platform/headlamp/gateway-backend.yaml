apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-gateway-proxy
  namespace: headlamp
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8080;
      server_name _;

      location = /proxy-healthz {
        access_log off;
        return 200 "ok\n";
      }

      location = /auth {
        proxy_pass http://headlamp-oidc-origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location / {
        proxy_pass http://headlamp-origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-gateway-proxy
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp-gateway-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-gateway-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp-gateway-proxy
    spec:
      containers:
        - name: proxy
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /proxy-healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /proxy-healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: headlamp-gateway-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-gateway-backend
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp-gateway-proxy
    networking.re8ch.com/origin: gateway
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: headlamp-gateway-proxy
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-origin
  namespace: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-oidc-origin
  namespace: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: oidc-landing
