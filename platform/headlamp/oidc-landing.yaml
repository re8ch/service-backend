apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-oidc-landing
  namespace: headlamp
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location = /auth {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Headlamp login</title></head><body><p>登录成功，正在返回 Headlamp…</p><script>(function(){var target="/c/re8ch-k3s/";try{localStorage.setItem("auth_status","success");if(window.opener&&!window.opener.closed){window.opener.location.replace(target);setTimeout(function(){window.close()},100);return}}catch(e){}window.location.replace(target)})()</script></body></html>';
      }

      location / {
        return 404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-oidc-landing
  namespace: headlamp
spec:
  selector:
    app.kubernetes.io/name: headlamp
    traffic.re8ch.com/headlamp-active: "true"
  ports:
    - name: http
      port: 80
      targetPort: oidc-landing
