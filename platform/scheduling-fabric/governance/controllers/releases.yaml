apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: flux-system
  annotations:
    supply-chain.re8ch.com/chart-sha256: fae31d000e9f98b55300ac7558e36913a858ac0606c002534b665936f38cf525
spec:
  interval: 30m
  releaseName: descheduler
  targetNamespace: scheduling-system
  storageNamespace: scheduling-system
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef: {kind: HelmRepository, name: descheduler-official}
  install: {createNamespace: false, remediation: {retries: 1}}
  upgrade: {timeout: 5m, remediation: {retries: 1, remediateLastFailure: false}}
  values:
    kind: Deployment
    replicas: 1
    deschedulingInterval: 30m
    cmdOptions: {v: 3, dry-run: true}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    service: {enabled: true}
    serviceMonitor: {enabled: false}
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 1
      maxNoOfPodsToEvictPerNamespace: 2
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: control-plane-isolation
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                minReplicas: 2
                podProtections:
                  defaultDisabled: []
                  extraEnabled: [PodsWithPVC]
            - name: RemovePodsViolatingNodeTaints
              args:
                # Observe the staged soft-isolation taint before any eviction
                # is enabled. Restrict matching to the reviewed control-plane
                # key so unrelated PreferNoSchedule taints remain untouched.
                includePreferNoSchedule: true
                includedTaints: [node-role.kubernetes.io/control-plane=true]
                namespaces:
                  exclude: [kube-system, flux-system, rook-ceph, scheduling-system, among-clusters]
          plugins:
            deschedule:
              enabled: [RemovePodsViolatingNodeTaints]
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
  annotations:
    supply-chain.re8ch.com/chart-sha256: 7b7fe31ed204b16d52d52744e9a23442eeb1fa70a5b87e8a7a1ef49a57833f10
spec:
  interval: 30m
  releaseName: kyverno
  targetNamespace: kyverno
  storageNamespace: kyverno
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef: {kind: HelmRepository, name: kyverno-official}
  install: {createNamespace: false, crds: CreateReplace, remediation: {retries: 1}}
  upgrade: {crds: CreateReplace, timeout: 10m, remediation: {retries: 1, remediateLastFailure: false}}
  values:
    admissionController:
      replicas: 3
      podDisruptionBudget: {enabled: true, minAvailable: 2}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/component: admission-controller}}}
    backgroundController:
      replicas: 2
      podDisruptionBudget: {enabled: true, minAvailable: 1}
    cleanupController:
      replicas: 2
      podDisruptionBudget: {enabled: true, minAvailable: 1}
    reportsController:
      replicas: 2
      podDisruptionBudget: {enabled: true, minAvailable: 1}
    features:
      policyReports: {enabled: true}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: kueue, namespace: flux-system}
spec:
  interval: 30m
  releaseName: kueue
  targetNamespace: kueue-system
  storageNamespace: kueue-system
  chart:
    spec:
      chart: platform/scheduling-fabric/vendor/kueue
      # The chart is immutable and versioned in-tree. Rebuild only when its
      # Chart.yaml version changes; ordinary control-plane commits must not
      # restart this admission-critical deployment.
      reconcileStrategy: ChartVersion
      # The reviewed upstream chart is carried by the already verified
      # service-backend source, so production does not depend on a large
      # GitHub clone or registry.k8s.io's Google redirect at reconcile time.
      sourceRef: {kind: GitRepository, name: service-backend}
  install: {createNamespace: false, crds: CreateReplace, remediation: {retries: 1}}
  upgrade: {crds: CreateReplace, timeout: 10m, remediation: {retries: 1, remediateLastFailure: false}}
  values:
    enablePrometheus: false
    enableVisibilityAPF: true
    controllerManager:
      replicas: 2
      # Admission webhooks are on the API-server critical path. Keep their
      # host-network endpoints beside the HA API servers instead of depending
      # on a cross-site worker's Service/API path.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Rook managers reserve 8443 and restricted-node-6dc3f140f9's host SFTPGo service reserves
      # 18443. Use a dedicated free host port so both Kueue replicas can span
      # control planes without entering a bind/restart loop.
      metricsPort: 17443
      strategy:
        rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      podDisruptionBudget: {enabled: true, minAvailable: 1}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {control-plane: controller-manager}}}
      manager:
        priorityClassName: system-cluster-critical
        # Every replica is constrained to a k3s server. Avoid routing its
        # watches through another, possibly degraded control-plane endpoint.
        env:
          - {name: KUBERNETES_SERVICE_HOST, value: "127.0.0.1"}
          - {name: KUBERNETES_SERVICE_PORT, value: "6443"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
    managerConfig:
      controllerManagerConfigYaml: |-
        apiVersion: config.kueue.x-k8s.io/v1beta2
        kind: Configuration
        health:
          healthProbeBindAddress: :8081
        metrics:
          bindAddress: :17443
        webhook:
          port: 9443
        leaderElection:
          leaderElect: true
          resourceName: c1f6bfd2.kueue.x-k8s.io
        controller:
          groupKindConcurrency:
            Job.batch: 5
            Pod: 5
            Workload.kueue.x-k8s.io: 10
            LocalQueue.kueue.x-k8s.io: 5
            ClusterQueue.kueue.x-k8s.io: 5
            ResourceFlavor.kueue.x-k8s.io: 1
        clientConnection:
          qps: 300
          burst: 500
        managedJobsNamespaceSelector:
          matchLabels:
            kueue.x-k8s.io/managed: "true"
        integrations:
          frameworks:
            - batch/job
            - kubeflow.org/mpijob
            - ray.io/rayjob
            - ray.io/rayservice
            - ray.io/raycluster
            - jobset.x-k8s.io/jobset
            - workload.codeflare.dev/appwrapper
            - trainer.kubeflow.org/trainjob
            - pod
            - deployment
            - statefulset
            - leaderworkerset.x-k8s.io/leaderworkerset
