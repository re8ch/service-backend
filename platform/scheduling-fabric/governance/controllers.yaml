apiVersion: v1
kind: Namespace
metadata: {name: kyverno}
---
apiVersion: v1
kind: Namespace
metadata: {name: kueue-system}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler-official
  namespace: flux-system
  annotations:
    supply-chain.re8ch.com/chart-index-sha256: fae31d000e9f98b55300ac7558e36913a858ac0606c002534b665936f38cf525
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno-official
  namespace: flux-system
  annotations:
    supply-chain.re8ch.com/chart-index-sha256: 7b7fe31ed204b16d52d52744e9a23442eeb1fa70a5b87e8a7a1ef49a57833f10
spec:
  interval: 24h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kueue-official
  namespace: flux-system
  annotations:
    supply-chain.re8ch.com/upstream-tag: v0.19.5
spec:
  interval: 24h
  timeout: 60s
  url: https://github.com/kubernetes-sigs/kueue.git
  # The annotated v0.19.5 tag resolves to this immutable commit. Fetching the
  # chart from GitHub avoids registry.k8s.io's Google Artifact Registry
  # redirect, which is not reachable from the production source-controller.
  ref: {commit: 8e60d76a91bb9a45754218e569de1088f862ac75}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: scheduling-governance-controllers, namespace: flux-system}
spec:
  interval: 10m
  path: ./platform/scheduling-fabric/governance/controllers
  prune: false
  wait: true
  timeout: 15m
  dependsOn: [{name: service-backend}]
  sourceRef: {kind: GitRepository, name: service-backend}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: scheduling-governance-policies, namespace: flux-system}
spec:
  interval: 10m
  path: ./platform/scheduling-fabric/governance/policies
  prune: false
  wait: true
  timeout: 5m
  dependsOn: [{name: scheduling-governance-controllers}]
  sourceRef: {kind: GitRepository, name: service-backend}
