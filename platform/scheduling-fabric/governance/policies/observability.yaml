apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: descheduler
  namespace: scheduling-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [scheduling-system]}
  selector: {matchLabels: {app.kubernetes.io/instance: descheduler}}
  endpoints:
    - {port: http-metrics, scheme: https, interval: 30s, tlsConfig: {insecureSkipVerify: true}}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kueue
  namespace: observability-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [kueue-system]}
  selector: {matchLabels: {control-plane: controller-manager}}
  endpoints:
    - {port: https, scheme: https, interval: 30s, tlsConfig: {insecureSkipVerify: true}}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kyverno
  namespace: observability-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [kyverno]}
  selector:
    matchLabels: {app.kubernetes.io/instance: kyverno, app.kubernetes.io/part-of: kyverno}
  endpoints:
    - {port: metrics-port, scheme: http, interval: 30s}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: scheduling-governance
  namespace: observability-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  groups:
    - name: scheduling-governance
      rules:
        - alert: Re8chSchedulerMetricsMissing
          expr: absent(instance:node_cpu_utilisation:rate:sum) or absent(instance:node_memory_utilisation:ratio)
          for: 15m
          labels: {severity: warning}
          annotations: {summary: Dynamic scheduler CPU or memory recording rules are missing}
        - alert: Re8chPendingWorkloadBacklog
          expr: sum(kube_pod_status_phase{phase="Pending"}) > 0
          for: 15m
          labels: {severity: warning}
          annotations: {summary: One or more workloads have remained Pending for fifteen minutes}
        - alert: Re8chKueueManagerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="kueue-system",container="manager"}[15m]) > 0
          for: 2m
          labels: {severity: warning}
          annotations: {summary: A Kueue manager restarted during the last fifteen minutes}
        - alert: Re8chKyvernoMetricsMissing
          expr: absent(kyverno_info)
          for: 15m
          labels: {severity: warning}
          annotations: {summary: Kyverno controller metrics have been missing for fifteen minutes}
        - alert: Re8chSchedulingPolicyAuditViolation
          expr: sum(increase(kyverno_policy_results_total{policy_name=~"(audit-(control-plane-tolerations|workload-resource-bounds|privileged-workloads)|enforce-no-capacity-no-schedule)",rule_result="fail"}[15m])) by (policy_name, resource_namespace) > 0
          for: 2m
          labels: {severity: warning}
          annotations: {summary: A scheduling governance audit policy found a new violation}
        - alert: Re8chVLAgentDroppingLogs
          expr: sum(increase(vlagent_remotewrite_packets_dropped_total[5m])) > 0
          for: 2m
          labels: {severity: critical}
          annotations: {summary: VLAgent is dropping logs rejected by remote storage}
