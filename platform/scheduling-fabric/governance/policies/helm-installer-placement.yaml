apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: place-k3s-helm-installers-on-local-egress.re8ch.com
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: is-k3s-helm-installer
      expression: >-
        object.metadata.namespace == 'kube-system' &&
        has(object.metadata.labels) &&
        'helmcharts.helm.cattle.io/chart' in object.metadata.labels &&
        'batch.kubernetes.io/job-name' in object.metadata.labels &&
        object.metadata.labels['batch.kubernetes.io/job-name'].startsWith('helm-install-')
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          [JSONPatch{
            op: has(object.spec.affinity) ? 'replace' : 'add',
            path: '/spec/affinity',
            value: Object.spec.affinity{
              nodeAffinity: Object.spec.affinity.nodeAffinity{
                requiredDuringSchedulingIgnoredDuringExecution:
                  Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution{
                    nodeSelectorTerms: [
                      Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms{
                        matchExpressions: [
                          Object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.matchExpressions{
                            key: 'kubernetes.io/hostname',
                            operator: 'In',
                            values: ['domain-ex', 'zan']
                          }
                        ]
                      }
                    ]
                }
              }
            }
          }, JSONPatch{
            op: has(object.spec.hostNetwork) ? 'replace' : 'add',
            path: '/spec/hostNetwork',
            value: true
          }, JSONPatch{
            op: has(object.spec.dnsPolicy) ? 'replace' : 'add',
            path: '/spec/dnsPolicy',
            value: 'ClusterFirstWithHostNet'
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: place-k3s-helm-installers-on-local-egress.re8ch.com
spec:
  policyName: place-k3s-helm-installers-on-local-egress.re8ch.com
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
