apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: audit-placement-class-contract}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: placement-class-must-be-reviewed
      match:
        any:
          - resources: {kinds: [Pod]}
      preconditions:
        all:
          - key: "{{ request.object.metadata.annotations.\"scheduling.re8ch.com/placement-class\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: Workloads must select one reviewed PlacementClass.
        pattern:
          metadata:
            annotations:
              scheduling.re8ch.com/placement-class: "control-plane-critical|service-core-local|service-core-ab|service-core-r640|online-reliable|batch-opportunistic|gpu-rocm|stateful-ceph|function-execution|public-edge|egress|node-bootstrap|node-serving-agent"
    - name: placement-class-disallows-unexplained-host-pinning
      match:
        any:
          - resources: {kinds: [Pod]}
      validate:
        message: PlacementClass workloads must not combine portable placement with nodeName or hostname selection; use a reviewed pinned-reason for non-portable locality.
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.annotations.\"scheduling.re8ch.com/placement-class\" || '' }}"
                operator: NotEquals
                value: ""
              - key: "{{ request.object.metadata.annotations.\"scheduling.re8ch.com/pinned-reason\" || '' }}"
                operator: Equals
                value: ""
              - key: "{{ request.object.spec.nodeName || request.object.spec.nodeSelector.\"kubernetes.io/hostname\" || '' }}"
                operator: NotEquals
                value: ""
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: audit-control-plane-tolerations}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: block-unapproved-control-plane-tolerations
      match:
        any:
          - resources: {kinds: [Pod]}
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels: {scheduling.re8ch.com/control-plane-allowed: "true"}
          - resources:
              selector:
                matchLabels: {scheduling.re8ch.com/control-plane-allowed: "true"}
      validate:
        message: Only reviewed system namespaces may tolerate the control-plane taint.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.tolerations[?key == 'node-role.kubernetes.io/control-plane'] | length(@) }}"
                operator: GreaterThan
                value: 0
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: audit-workload-resource-bounds}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-container-requests-and-limits
      match:
        any:
          - resources: {kinds: [Pod]}
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels: {scheduling.re8ch.com/control-plane-allowed: "true"}
      validate:
        message: Tenant containers must declare CPU and memory requests and limits.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - {key: "{{ contains(keys(element.resources.requests || `{}`), 'cpu') }}", operator: Equals, value: false}
                  - {key: "{{ contains(keys(element.resources.requests || `{}`), 'memory') }}", operator: Equals, value: false}
                  - {key: "{{ contains(keys(element.resources.limits || `{}`), 'cpu') }}", operator: Equals, value: false}
                  - {key: "{{ contains(keys(element.resources.limits || `{}`), 'memory') }}", operator: Equals, value: false}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: generate-tenant-resource-boundaries}
spec:
  validationFailureAction: Audit
  background: true
  generateExisting: true
  rules:
    - name: generate-default-resource-quota
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels: {tenancy.re8ch.com/managed: "true"}
      generate:
        apiVersion: v1
        kind: ResourceQuota
        name: tenant-governance-defaults
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            hard:
              pods: "20"
              requests.cpu: "4"
              requests.memory: 8Gi
              # Only the generated data changes: Kyverno forbids changing a
              # generate rule's match/exclude fields after policy creation.
              limits.cpu: "{{ (request.object.metadata.name == 're8ch-ontology-microscope' && '12') || '8' }}"
              limits.memory: 16Gi
              persistentvolumeclaims: "10"
    - name: generate-default-limit-range
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels: {tenancy.re8ch.com/managed: "true"}
      generate:
        apiVersion: v1
        kind: LimitRange
        name: tenant-governance-defaults
        namespace: "{{ request.object.metadata.name }}"
        synchronize: true
        data:
          spec:
            limits:
              - type: Container
                defaultRequest: {cpu: 100m, memory: 128Mi}
                default: {cpu: "1", memory: 1Gi}
                max: {cpu: "4", memory: 8Gi}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: audit-privileged-workloads}
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-privileged-and-hostpath
      match:
        any:
          - resources: {kinds: [Pod]}
      exclude:
        any:
          - resources:
              namespaceSelector:
                matchLabels: {scheduling.re8ch.com/control-plane-allowed: "true"}
      validate:
        message: Tenant workloads may not use privileged containers or hostPath volumes.
        deny:
          conditions:
            any:
              - {key: "{{ request.object.spec.containers[?securityContext.privileged == `true`] | length(@) }}", operator: GreaterThan, value: 0}
              # Most Pods have no volumes field. Coalesce it before filtering
              # so a volume-less Pod produces zero findings instead of a
              # Kyverno JMESPath type error.
              - {key: "{{ (request.object.spec.volumes || `[]`)[?hostPath] | length(@) }}", operator: GreaterThan, value: 0}
