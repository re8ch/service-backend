# Only namespaces without another GitOps owner are declared here. The others
# receive this label from their authoritative Namespace manifest or its Flux
# Kustomization patch; duplicate Namespace reconciliation changed Cilium pod
# identities on every cycle. The prune opt-out preserves namespace lifecycle.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {scheduling.re8ch.com/control-plane-allowed: "true"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {scheduling.re8ch.com/control-plane-allowed: "true"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: opentelemetry-operator
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {scheduling.re8ch.com/control-plane-allowed: "true"}
---
# Existing tenant namespaces predate the controller's managed marker.
apiVersion: v1
kind: Namespace
metadata:
  name: artchais-default
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {tenancy.re8ch.com/managed: "true", kueue.x-k8s.io/managed: "true"}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-qwen-runtime
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {tenancy.re8ch.com/managed: "true", kueue.x-k8s.io/managed: "true"}
