# Flux owns only these governance labels. The prune opt-out is required because
# Namespace lifecycle remains with each namespace's authoritative controller.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations: {kustomize.toolkit.fluxcd.io/prune: disabled}
  labels: {scheduling.re8ch.com/control-plane-allowed: "true"}
---
