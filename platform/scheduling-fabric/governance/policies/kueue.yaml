apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata: {name: re8ch-placement}
spec: {controllerName: scheduling.re8ch.com/placement-admission}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: default}
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-service-core-local}
spec: {nodeLabels: {scheduling.re8ch.com/pool-service-core-local: "true", scheduling.re8ch.com/network-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-service-core-ab}
spec: {nodeLabels: {scheduling.re8ch.com/pool-service-core-ab: "true", scheduling.re8ch.com/network-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-service-core-r640}
spec: {nodeLabels: {scheduling.re8ch.com/pool-service-core-r640: "true", scheduling.re8ch.com/network-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-online-reliable}
spec: {nodeLabels: {scheduling.re8ch.com/placement-general-reliable: "true", scheduling.re8ch.com/network-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-batch-opportunistic}
spec: {nodeLabels: {scheduling.re8ch.com/placement-batch-opportunistic: "true", scheduling.re8ch.com/network-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-gpu-rocm}
spec: {nodeLabels: {scheduling.re8ch.com/capability-gpu: rocm-wsl, scheduling.re8ch.com/gpu-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-stateful-ceph}
spec: {nodeLabels: {scheduling.re8ch.com/placement-general-reliable: "true", scheduling.re8ch.com/ceph-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-function-execution}
spec: {nodeLabels: {scheduling.re8ch.com/function-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-public-edge}
spec: {nodeLabels: {scheduling.re8ch.com/public-edge-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-egress}
spec: {nodeLabels: {scheduling.re8ch.com/egress-serving: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-node-bootstrap}
spec: {nodeLabels: {kubernetes.io/os: linux}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-node-serving-agent}
spec: {nodeLabels: {scheduling.re8ch.com/workload-eligible: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: qwen-batch}
spec:
  namespaceSelector:
    matchLabels: {saas.re8ch.com/tenant: qwen}
  queueingStrategy: BestEffortFIFO
  # v1beta2 stores admission checks by ResourceFlavor strategy.  The default
  # flavor remains the quota accounting flavor; the placement controller adds
  # the stricter PlacementClass selector before Pods are released.
  admissionChecksStrategy:
    admissionChecks:
      - {name: re8ch-placement, onFlavors: [default]}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default
          resources:
            - {name: cpu, nominalQuota: "16"}
            - {name: memory, nominalQuota: 64Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: tenant-batch, namespace: tenant-qwen-runtime}
spec: {clusterQueue: qwen-batch}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: artchais-batch}
spec:
  namespaceSelector:
    matchLabels: {tenancy.re8ch.com/tenant: artchais}
  queueingStrategy: BestEffortFIFO
  admissionChecksStrategy:
    admissionChecks:
      - {name: re8ch-placement, onFlavors: [default]}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default
          resources:
            - {name: cpu, nominalQuota: "20"}
            - {name: memory, nominalQuota: 64Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: tenant-batch, namespace: artchais-default}
spec: {clusterQueue: artchais-batch}
