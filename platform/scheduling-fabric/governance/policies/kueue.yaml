apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata: {name: re8ch-placement}
spec: {controllerName: scheduling.re8ch.com/placement-admission}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: default}
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-general-reliable}
spec: {nodeLabels: {scheduling.re8ch.com/placement-general-reliable: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-batch-opportunistic}
spec: {nodeLabels: {scheduling.re8ch.com/placement-batch-opportunistic: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-gpu-rocm}
spec: {nodeLabels: {scheduling.re8ch.com/capability-gpu: rocm-wsl}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-ceph-client}
spec: {nodeLabels: {scheduling.re8ch.com/capability-storage-ceph-client: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-public-edge}
spec: {nodeLabels: {scheduling.re8ch.com/capability-public-edge: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-egress}
spec: {nodeLabels: {scheduling.re8ch.com/capability-egress: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: placement-service-core}
spec: {nodeLabels: {scheduling.re8ch.com/service-plane-eligible: "true"}}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: qwen-batch}
spec:
  namespaceSelector:
    matchLabels: {saas.re8ch.com/tenant: qwen}
  queueingStrategy: BestEffortFIFO
  # v1beta2 stores admission checks by ResourceFlavor strategy.  The default
  # flavor remains the quota accounting flavor; the placement controller adds
  # the stricter PlacementClass selector before Pods are released.
  admissionChecksStrategy:
    admissionChecks:
      - {name: re8ch-placement, onFlavors: [default]}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default
          resources:
            - {name: cpu, nominalQuota: "16"}
            - {name: memory, nominalQuota: 64Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: tenant-batch, namespace: tenant-qwen-runtime}
spec: {clusterQueue: qwen-batch}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: artchais-batch}
spec:
  namespaceSelector:
    matchLabels: {tenancy.re8ch.com/tenant: artchais}
  queueingStrategy: BestEffortFIFO
  admissionChecksStrategy:
    admissionChecks:
      - {name: re8ch-placement, onFlavors: [default]}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default
          resources:
            - {name: cpu, nominalQuota: "20"}
            - {name: memory, nominalQuota: 64Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: tenant-batch, namespace: artchais-default}
spec: {clusterQueue: artchais-batch}
