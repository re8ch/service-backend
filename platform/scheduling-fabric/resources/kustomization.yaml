apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds.yaml
  - node-profiles.yaml
  - scheduler.yaml
  - controller.yaml
configMapGenerator:
  - name: penrose-controller-source
    namespace: scheduling-system
    files:
      - controller.py
generatorOptions:
  disableNameSuffixHash: true
