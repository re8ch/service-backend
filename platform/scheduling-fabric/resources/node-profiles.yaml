# One object per Kubernetes Node: failure-domain identity must not be shared by a template.
apiVersion: v1
kind: ConfigMap
metadata: {name: node-reservation-profiles, namespace: scheduling-system}
data:
  profiles.yaml: |
    control-large:
      maxPods: 256
      kubeReserved: {cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi, pid: "4096"}
      systemReserved: {cpu: "2", memory: 4Gi, ephemeral-storage: 10Gi, pid: "4096"}
      enforceNodeAllocatable: [pods]
      evictionHard: {memory.available: 4Gi, nodefs.available: 10%, imagefs.available: 15%, pid.available: 10%}
    control-small:
      maxPods: 256
      kubeReserved: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi, pid: "2048"}
      systemReserved: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi, pid: "2048"}
      enforceNodeAllocatable: [pods]
      evictionHard: {memory.available: 10%, nodefs.available: 10%, imagefs.available: 15%, pid.available: 10%}
    worker-small:
      kubeReserved: {cpu: 250m, memory: 256Mi, ephemeral-storage: 1Gi, pid: "1024"}
      systemReserved: {cpu: 250m, memory: 256Mi, ephemeral-storage: 1Gi, pid: "1024"}
      enforceNodeAllocatable: [pods]
      evictionHard: {memory.available: 10%, nodefs.available: 10%, imagefs.available: 15%, pid.available: 10%}
    worker-standard:
      kubeReserved: {cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi, pid: "2048"}
      systemReserved: {cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi, pid: "2048"}
      enforceNodeAllocatable: [pods]
      evictionHard: {memory.available: 10%, nodefs.available: 10%, imagefs.available: 15%, pid.available: 10%}
---
apiVersion: scheduling.re8ch.com/v1alpha1
kind: NodeProfile
metadata: {name: restricted-node-6dc3f140f9}
spec:
  nodeName: restricted-node-6dc3f140f9
  reservationProfile: control-large
  background: {provider: onprem, region: cn-hunan, ownership: owned, environment: datacenter, account: r640-idc, costClass: sunk-capacity, notes: Main server and capacity anchor}
  failureDomains: {site: cn-hunan-r640, power: r640-mains, network: r640-dedicated-line, host: restricted-node-6dc3f140f9}
  reliability: {class: anchor, disruptionRisk: 15}
  capabilities: {cpuClass: server, bandwidthMbps: 200, storage: [ceph-osd, ceph-client, object-client], draDeviceClasses: [re8ch-usb], scheduling: [stable, dynamic]}
  sources: [{kind: InfrastructureTarget, ref: service-backend/inventory/nodes.yaml}, {kind: NodeCostCatalog, ref: re8ch-node-costs}]
---
