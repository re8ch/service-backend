metadata: {name: schedulerprofiles.scheduling.re8ch.com}
spec:
  group: scheduling.re8ch.com
  scope: Cluster
  names: {plural: schedulerprofiles, singular: schedulerprofile, kind: SchedulerProfile, shortNames: [schedprofile]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Scheduler, type: string, jsonPath: .spec.schedulerName}
    - {name: Mode, type: string, jsonPath: .spec.managementMode}
    - {name: Coverage, type: number, jsonPath: .status.metricsCoverage}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [schedulerName, managementMode, plugins]
            properties:
              schedulerName: {type: string, minLength: 1}
              managementMode: {type: string, enum: [ReadOnly, Managed]}
              eligibleNodeSelector: {type: object, additionalProperties: {type: string}}
              minimumMetricsCoverage: {type: number, minimum: 0, maximum: 1, default: 1}
              plugins:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, enabled, weight, bounds]
                  properties:
                    name: {type: string}
                    enabled: {type: boolean}
                    weight: {type: integer, minimum: 0, maximum: 100}
                    bounds:
                      type: object
                      required: [minimum, maximum]
                      properties: {minimum: {type: integer, minimum: 0, maximum: 100}, maximum: {type: integer, minimum: 0, maximum: 100}}
                    args: {type: object, x-kubernetes-preserve-unknown-fields: true}
              metricsDependencies: {type: array, items: {type: string}}
          status: {type: object, x-kubernetes-preserve-unknown-fields: true}
    subresources: {status: {}}
---
