apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: nodeprofiles.scheduling.re8ch.com}
spec:
  group: scheduling.re8ch.com
  scope: Cluster
  names: {plural: nodeprofiles, singular: nodeprofile, kind: NodeProfile, shortNames: [npf]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Node, type: string, jsonPath: .spec.nodeName}
    - {name: Provider, type: string, jsonPath: .spec.background.provider}
    - {name: Reliability, type: string, jsonPath: .spec.reliability.class}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [nodeName, background, failureDomains, reliability, capabilities]
            properties:
              nodeName: {type: string, minLength: 1}
              aliases: {type: array, items: {type: string}}
              background:
                type: object
                required: [provider, ownership, environment]
                properties:
                  provider: {type: string, enum: [tencent, aliyun, overseas, onprem, wsl]}
                  region: {type: string}
                  ownership: {type: string, enum: [owned, rented, local]}
                  environment: {type: string, enum: [cloud, cross-border, datacenter, workstation]}
                  account: {type: string}
                  costClass: {type: string}
                  notes: {type: string}
              failureDomains:
                type: object
                required: [site, power, network, host]
                properties: {site: {type: string}, power: {type: string}, network: {type: string}, host: {type: string}}
              reliability:
                type: object
                required: [class, disruptionRisk]
                properties:
                  class: {type: string, enum: [anchor, stable, variable, opportunistic]}
                  disruptionRisk: {type: integer, minimum: 0, maximum: 100}
                  maintenanceMode: {type: boolean, default: false}
              capabilities: {type: object, x-kubernetes-preserve-unknown-fields: true}
              sources:
                type: array
                items:
                  type: object
                  required: [kind, ref]
                  properties: {kind: {type: string}, ref: {type: string}, observedAt: {type: string, format: date-time}}
          status: {type: object, x-kubernetes-preserve-unknown-fields: true}
    subresources: {status: {}}
---
apiVersion: apiextensions.k8s.io/v1
