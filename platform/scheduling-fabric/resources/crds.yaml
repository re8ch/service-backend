                  resilience: {type: integer, minimum: 0, maximum: 100}
                  efficiency: {type: integer, minimum: 0, maximum: 100}
                  stability: {type: integer, minimum: 0, maximum: 100}
              constraints: {type: object, x-kubernetes-preserve-unknown-fields: true}
              observation:
                type: object
                required: [currentWindow, baselineWindow, minimumCompleteness]
