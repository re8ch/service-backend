apiVersion: v1
kind: Namespace
metadata: {name: scheduler-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: scheduler-plugins, namespace: scheduler-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: scheduler-plugins-as-kube-scheduler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:kube-scheduler}
subjects: [{kind: ServiceAccount, name: scheduler-plugins, namespace: scheduler-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: scheduler-plugins-as-volume-scheduler}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:volume-scheduler}
subjects: [{kind: ServiceAccount, name: scheduler-plugins, namespace: scheduler-system}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: scheduler-plugins-config, namespace: scheduler-system}
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        server: https://kubernetes.default.svc
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
    - name: scheduler
      user: {tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token}
    contexts:
    - name: scheduler
      context: {cluster: in-cluster, user: scheduler}
    current-context: scheduler
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: re8ch-dynamic-scheduler
      resourceNamespace: scheduler-system
    clientConnection:
      kubeconfig: /etc/scheduler/kubeconfig
    profiles:
    - schedulerName: re8ch-dynamic-scheduler
      plugins:
        score:
          enabled:
          - {name: LoadVariationRiskBalancing, weight: 5}
          - {name: NodeResourcesAllocatable, weight: 2}
      pluginConfig:
      - name: LoadVariationRiskBalancing
        args:
          safeVarianceMargin: 1
          safeVarianceSensitivity: 2
          metricProvider: {type: Prometheus, address: 'http://panel-victoria-metrics.qianwen-ops.svc.cluster.local:8428'}
      - name: NodeResourcesAllocatable
        args:
          mode: Most
          resources: [{name: cpu, weight: 1}, {name: memory, weight: 4}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: scheduler-plugins, namespace: scheduler-system}
spec:
  minAvailable: 2
  selector: {matchLabels: {app.kubernetes.io/name: scheduler-plugins}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler-plugins, namespace: scheduler-system}
spec:
  replicas: 3
  strategy: {rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: scheduler-plugins}}
  template:
    metadata: {labels: {app.kubernetes.io/name: scheduler-plugins}}
    spec:
      serviceAccountName: scheduler-plugins
      schedulerName: default-scheduler
      priorityClassName: system-cluster-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app.kubernetes.io/name: scheduler-plugins}}
            topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: scheduling.re8ch.com/failure-domain, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: scheduler-plugins}}}
      containers:
      - name: scheduler
        image: registry.re8ch.com/proxy-k8s/scheduler-plugins/kube-scheduler@sha256:ae94c1224ef5677ae54bc25b4161a602b4365f479610d550f972e829f7c5b1b6
        command: [/bin/kube-scheduler]
        args: [--config=/etc/scheduler/scheduler-config.yaml, --v=3]
        ports: [{containerPort: 10259, name: healthz}]
        readinessProbe: {httpGet: {path: /readyz, port: healthz, scheme: HTTPS}, initialDelaySeconds: 5}
        resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
        volumeMounts: [{name: config, mountPath: /etc/scheduler, readOnly: true}]
      volumes: [{name: config, configMap: {name: scheduler-plugins-config}}]
---
apiVersion: scheduling.re8ch.com/v1alpha1
kind: SchedulerProfile
metadata: {name: upstream-default}
spec:
  schedulerName: default-scheduler
  managementMode: ReadOnly
  minimumMetricsCoverage: 0
  plugins: []
---
apiVersion: scheduling.re8ch.com/v1alpha1
kind: SchedulerProfile
metadata: {name: re8ch-dynamic}
spec:
  schedulerName: re8ch-dynamic-scheduler
  managementMode: Managed
  eligibleNodeSelector: {scheduling.re8ch.com/trimaran-ready: 'true'}
  minimumMetricsCoverage: 1
  metricsDependencies: [instance:node_cpu_utilisation:rate:sum, instance:node_memory_utilisation:ratio]
  plugins:
  - {name: LoadVariationRiskBalancing, enabled: true, weight: 5, bounds: {minimum: 1, maximum: 10}}
  - name: NodeResourcesAllocatable
    enabled: true
    weight: 2
    bounds: {minimum: 1, maximum: 10}
    args: {mode: Most, resources: [{name: cpu, weight: 1}, {name: memory, weight: 4}]}
