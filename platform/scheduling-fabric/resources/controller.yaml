apiVersion: v1
kind: Namespace
metadata: {name: scheduling-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: penrose-controller, namespace: scheduling-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: penrose-controller}
rules:
- apiGroups: [""]
  resources: [nodes, namespaces, services, pods, persistentvolumes, persistentvolumeclaims, events]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [patch]
- apiGroups: [apps]
  resources: [deployments, statefulsets, replicasets]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [patch]
- apiGroups: [metrics.k8s.io]
  resources: [pods, nodes]
  verbs: [get, list]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [storage.k8s.io, resource.k8s.io, gateway.networking.k8s.io]
  resources: ['*']
  verbs: [get, list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, patch, update]
- apiGroups: [scheduling.re8ch.com]
  resources: [nodeprofiles, placementclasses, schedulerprofiles, serviceoutcomepolicies, disturbancewindows, penroseoperations]
  verbs: [get, list, watch, create, patch, update]
- apiGroups: [scheduling.re8ch.com]
  resources: [nodeprofiles/status, placementclasses/status, schedulerprofiles/status, serviceoutcomepolicies/status, disturbancewindows/status, penroseoperations/status]
  verbs: [get, patch, update]
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads, workloads/status, admissionchecks, admissionchecks/status]
  verbs: [get, list, watch, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: penrose-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: penrose-controller}
subjects: [{kind: ServiceAccount, name: penrose-controller, namespace: scheduling-system}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: penrose-controller, namespace: scheduling-system}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: penrose-controller}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: penrose-controller, namespace: scheduling-system}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: penrose-controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: penrose-controller}}
    spec:
      serviceAccountName: penrose-controller
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      topologySpreadConstraints:
      - {maxSkew: 1, topologyKey: scheduling.re8ch.com/failure-domain, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: penrose-controller}}}
      containers:
      - name: controller
        image: python:3.13-alpine
        command: [python3, /opt/penrose/controller.py]
        env:
        - {name: RECONCILE_SECONDS, value: '60'}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - {name: VICTORIA_URL, value: 'http://vmselect-re8ch-metrics.observability-system.svc.cluster.local:8481/select/0/prometheus'}
        resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 250m, memory: 192Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: source, mountPath: /opt/penrose, readOnly: true}]
      volumes: [{name: source, configMap: {name: penrose-controller-source}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: penrose-viewer}
rules:
- apiGroups: [scheduling.re8ch.com]
  resources: ['*']
  verbs: [get, list, watch]
- apiGroups: ['', apps, discovery.k8s.io, resource.k8s.io, storage.k8s.io, gateway.networking.k8s.io]
  resources: [nodes, services, pods, endpointslices, deployments, statefulsets, deviceclasses, resourceslices, resourceclaims, persistentvolumes, persistentvolumeclaims, volumeattachments, gateways, httproutes]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: penrose-operator}
rules:
- apiGroups: [scheduling.re8ch.com]
  resources: [nodeprofiles, schedulerprofiles, serviceoutcomepolicies, disturbancewindows, penroseoperations]
  verbs: [get, list, watch, create, patch, update]
