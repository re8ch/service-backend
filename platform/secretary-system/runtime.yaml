apiVersion: batch/v1
kind: Job
metadata: {name: secretary-register-v0-2-2, namespace: re8ch-secretary}
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: register
          image: registry.re8ch.com/secretary-system/secretary-system@sha256:2a9036f04b7880f734b57ab5ed546728b6a2748f75ce8fb109b4562fb1a2352d
          command: [python, -c]
          args:
            - |
              import json,time,urllib.request
              url='http://restate:9070/deployments'
              body=json.dumps({'uri':'http://secretary-runtime:9080'}).encode()
              for attempt in range(60):
                  try:
                      request=urllib.request.Request(url,data=body,method='POST',headers={'Content-Type':'application/json'})
                      urllib.request.urlopen(request,timeout=5).read(); break
                  except Exception:
                      if attempt == 59: raise
                      time.sleep(2)
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
