apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: secretary-headlamp-read, namespace: re8ch-secretary}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: headlamp-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: headlamp-https}
  hostnames: [headlamp.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /secretary-api/v1/event-stream}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /v1/headlamp/event-stream}}
      backendRefs: [{name: secretary-api, port: 80}]
    - matches: [{path: {type: Exact, value: /secretary-api/v1/delivery-summary}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /v1/headlamp/delivery-summary}}
      backendRefs: [{name: secretary-api, port: 80}]
