spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: secretary-runtime}}
  template:
    metadata: {labels: {app.kubernetes.io/name: secretary-runtime}}
    spec:
      serviceAccountName: secretary
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: migrate
          image: registry.re8ch.com/secretary-system/secretary-system@sha256:2a9036f04b7880f734b57ab5ed546728b6a2748f75ce8fb109b4562fb1a2352d
          command: [python, -c]
          args: ["import os; from secretary.ledger import PostgresLedger; PostgresLedger(os.environ['SECRETARY_DATABASE_URL']).migrate()"]
          env:
            - {name: SECRETARY_DATABASE_URL, valueFrom: {secretKeyRef: {name: secretary-db-credentials, key: DATABASE_URL_MIGRATOR}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: runtime
          image: registry.re8ch.com/secretary-system/secretary-system@sha256:2a9036f04b7880f734b57ab5ed546728b6a2748f75ce8fb109b4562fb1a2352d
          ports: [{name: service, containerPort: 9080}]
          env:
            - {name: LITELLM_URL, value: "http://litellm.llm-gateway.svc.cluster.local:4000"}
            - {name: LITELLM_API_KEY, valueFrom: {secretKeyRef: {name: secretary-runtime, key: litellm-api-key}}}
            - {name: SECRETARY_MODEL, value: gpt-5.6-luna}
          readinessProbe: {tcpSocket: {port: service}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
