apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-oauth-authorization-server-discovery
  namespace: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: re8ch-cloud-platform
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: dex-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: dex-https}
  hostnames: [dex.re8ch.com]
  rules:
    - matches:
        - path: {type: Exact, value: /.well-known/oauth-authorization-server}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /.well-known/openid-configuration
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set: [{name: X-Re8ch-OAuth-Discovery, value: rfc8414-via-oidc}]
      backendRefs: [{name: dex, port: 80}]
