apiVersion: apps/v1
kind: Deployment
metadata: {name: re8ch-cloud-platform, namespace: ai-operations}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: re8ch-cloud-platform}}
  template:
    metadata: {labels: {app: re8ch-cloud-platform}}
    spec:
      serviceAccountName: re8ch-cloud-platform
      securityContext: {fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
      imagePullSecrets: [{name: harbor-registry-pull}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: scheduling.re8ch.com/service-plane, operator: In, values: [core]}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: re8ch-cloud-platform}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: runtime
          image: registry.re8ch.com/functions-shared/re8ch-cloud-platform@sha256:6224b77fc9d59b78e3615e8944ef610f3dd78a955efcdff6f04a83039ed80acb
          ports: [{name: mcp, containerPort: 19443}]
          env:
            - {name: CONFIG_ROOT, value: /etc/re8ch-platform}
            - {name: KUBECONFIG, value: /etc/re8ch-platform/kubeconfig}
            - {name: WORKSPACE_ROOT, value: /srv/service-backend}
            - {name: HYPOTHESIS_STORAGE_DIRECTORY, value: /tmp/hypothesis}
            - {name: OAUTH_AUDIENCE, value: re8ch-cloud-platform-tool}
            # Optional until platform-authorized provisioning completes. Missing
            # origin/token/plans keeps the bounded management adapter closed.
            - name: STALWART_ADMIN_ORIGIN
              valueFrom:
                configMapKeyRef: {name: stalwart-admin-runtime, key: origin, optional: true}
            - {name: STALWART_ADMIN_TOKEN_FILE, value: /etc/stalwart-admin/credential/token}
            - {name: STALWART_APPROVED_PLANS_DIR, value: /etc/stalwart-admin/approved-plans}
            - {name: STALWART_BOOTSTRAP_CONFIG, value: /etc/stalwart-bootstrap/config/config.json}
            - {name: PUBLIC_MCP_URL, value: "https://operate.tools.re8ch.com/cloud/mcp"}
            - {name: SERVICE_API_TOKEN, valueFrom: {secretKeyRef: {name: cluster-infra-service-auth, key: token}}}
          readinessProbe: {httpGet: {path: /readyz, port: mcp}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: mcp}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts:
            - {name: stalwart-bootstrap-config, mountPath: /etc/stalwart-bootstrap/config, readOnly: true}
            - {name: stalwart-bootstrap-credential, mountPath: /etc/stalwart-bootstrap/credential, readOnly: true}
            - {name: stalwart-admin-credential, mountPath: /etc/stalwart-admin/credential, readOnly: true}
            - {name: stalwart-approved-plans, mountPath: /etc/stalwart-admin/approved-plans, readOnly: true}
            - {name: http-acceptance-tmp, mountPath: /tmp}
            - {name: kubeconfig, mountPath: /etc/re8ch-platform/kubeconfig, subPath: kubeconfig, readOnly: true}
            - {name: infrastructure-contracts, mountPath: /etc/re8ch-platform/infrastructure, readOnly: true}
      volumes:
        # Temporary platform-owned provisioning authority, never the runtime key.
        - name: stalwart-bootstrap-config
          configMap:
            name: stalwart-bootstrap-config
            optional: true
            defaultMode: 288
            items: [{key: config.json, path: config.json}]
        - name: stalwart-bootstrap-credential
          secret:
            secretName: stalwart-bootstrap-authority
            optional: true
            defaultMode: 288
            items: [{key: token, path: token}]
        - name: stalwart-admin-credential
          secret:
            secretName: stalwart-self-service-admin
            optional: true
            defaultMode: 288
            items: [{key: token, path: token}]
        - name: stalwart-approved-plans
          configMap:
            name: stalwart-admin-approved-plans
            optional: true
            defaultMode: 288
        - {name: http-acceptance-tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: kubeconfig, secret: {secretName: cloud-platform-runtime, items: [{key: kubeconfig-re8ch.yaml, path: kubeconfig}]}}
        - {name: infrastructure-contracts, secret: {secretName: infrastructure-contracts, items: [{key: compat-nodes.yaml, path: compat-nodes.yaml}]}}
---
apiVersion: v1
kind: Service
metadata: {name: re8ch-cloud-platform, namespace: ai-operations}
spec: {selector: {app: re8ch-cloud-platform}, ports: [{name: mcp, port: 19443, targetPort: mcp}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: re8ch-cloud-platform-admin, namespace: ai-operations}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-wildcard-https}]
  hostnames: [operate.tools.re8ch.com]
  rules:
    - matches: [{path: {type: Exact, value: /cloud/mcp}}]
      filters:
        - type: URLRewrite
          urlRewrite: {path: {type: ReplaceFullPath, replaceFullPath: /mcp}}
      backendRefs: [{name: re8ch-cloud-platform, port: 19443}]
    - matches: [{path: {type: Exact, value: /.well-known/oauth-protected-resource/cloud/mcp}}]
      backendRefs: [{name: re8ch-cloud-platform, port: 19443}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: re8ch-cloud-platform, namespace: ai-operations}
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: re8ch-cloud-platform, namespace: ai-operations}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: re8ch-cloud-platform}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: re8ch-ssh-broker, namespace: ai-operations}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: re8ch-ssh-broker}}
  template:
    metadata: {labels: {app: re8ch-ssh-broker, app.kubernetes.io/component: ssh-control-plane}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
      imagePullSecrets: [{name: harbor-registry-pull}]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: scheduling.re8ch.com/service-plane, operator: In, values: [core]}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: re8ch-ssh-broker}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: broker
          image: registry.re8ch.com/functions-shared/re8ch-cloud-platform@sha256:6224b77fc9d59b78e3615e8944ef610f3dd78a955efcdff6f04a83039ed80acb
          command: [python, /app/ssh_broker_server.py]
          ports: [{name: http, containerPort: 19444}]
          env:
            - {name: SSH_TARGET_REGISTRY, value: /etc/re8ch-platform/infrastructure/compat-nodes.yaml}
            - {name: SSH_CONFIG, value: /etc/re8ch-ai-operations/ssh-config}
            - {name: SSH_USER, value: re8ch-ai}
            - {name: SERVICE_API_TOKEN, valueFrom: {secretKeyRef: {name: cluster-infra-service-auth, key: token}}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          volumeMounts:
            - {name: ssh-projected, mountPath: /etc/re8ch-ai-operations, readOnly: true}
            - {name: ssh-known-hosts, mountPath: /var/lib/re8ch-ai-operations}
            - {name: infrastructure-contracts, mountPath: /etc/re8ch-platform/infrastructure, readOnly: true}
      volumes:
        - {name: ssh-known-hosts, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        - {name: infrastructure-contracts, secret: {secretName: infrastructure-contracts, items: [{key: compat-nodes.yaml, path: compat-nodes.yaml}]}}
        - name: ssh-projected
          projected:
            defaultMode: 288
            sources:
              - secret: {name: ai-operations-ssh-config, items: [{key: ssh-config, path: ssh-config}]}
              - secret: {name: cloud-platform-runtime, items: [{key: id_ed25519, path: id_ed25519}]}
---
apiVersion: v1
kind: Service
metadata: {name: re8ch-ssh-broker, namespace: ai-operations}
spec: {selector: {app: re8ch-ssh-broker}, ports: [{name: http, port: 19444, targetPort: http}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: re8ch-ssh-broker, namespace: ai-operations}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: re8ch-ssh-broker}}
