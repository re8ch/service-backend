apiVersion: v1
kind: ServiceAccount
metadata: {name: access-subscription}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: access-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: access-subscription}
rules:
  - {apiGroups: [""], resources: [configmaps], verbs: [get, update]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: access-controller}
rules:
  - {apiGroups: [""], resources: [configmaps], verbs: [get, update]}
  - {apiGroups: [""], resources: [secrets], verbs: [get, patch]}
  - {apiGroups: [apps], resources: [deployments], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: access-subscription}
subjects: [{kind: ServiceAccount, name: access-subscription}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: access-subscription}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: access-controller}
subjects: [{kind: ServiceAccount, name: access-controller}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: access-controller}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: access-rule-cache
  labels: {storage.re8ch.com/replicated-approved: "true"}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: cephfs-re8ch
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: access-subscription}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: access-subscription}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: access-subscription, app.kubernetes.io/component: portal}
      annotations: {access.re8ch.com/code-revision: "20260905-cn-cloud-direct-1"}
    spec:
      serviceAccountName: access-subscription
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: access-subscription}}}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: portal
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [python, /app/app.py]
          ports: [{name: http, containerPort: 18081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 500m, memory: 192Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: HTTP_PORT, value: "18081"}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: RULES_ROOT, value: /rules}
            - name: IDENTITY_ALIASES_JSON
              value: '{"hliu74@apple.com":"hliu74","admin@re8ch.com":"hliu74","woomou":"hliu74","Cgg2MTY5MDcxORIGZ2l0aHVi":"hliu74"}'
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: hmac, mountPath: /secrets, readOnly: true}
            - {name: rules, mountPath: /rules, readOnly: true}
      volumes:
        - {name: code, configMap: {name: access-subscription-code}}
        - {name: hmac, secret: {secretName: access-subscription-secrets}}
        - {name: rules, persistentVolumeClaim: {claimName: access-rule-cache}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: access-controller}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: access-controller}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: access-controller, app.kubernetes.io/component: authorization}
      annotations: {access.re8ch.com/code-revision: "20260829-credential-recovery-1"}
    spec:
      serviceAccountName: access-controller
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [python, /app/controller.py]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: GITHUB_REPOSITORY, value: re8ch/access-edge-members}
            - {name: GITHUB_APP_ID, valueFrom: {secretKeyRef: {name: access-github-app, key: app-id}}}
            - {name: GITHUB_INSTALLATION_ID, valueFrom: {secretKeyRef: {name: access-github-app, key: installation-id}}}
            - name: IDENTITY_ALIASES_JSON
              value: '{"hliu74@apple.com":"hliu74","admin@re8ch.com":"hliu74","woomou":"hliu74","Cgg2MTY5MDcxORIGZ2l0aHVi":"hliu74"}'
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: hmac, mountPath: /secrets, readOnly: true}
            - {name: github-app, mountPath: /github-app, readOnly: true}
      volumes:
        - {name: code, configMap: {name: access-subscription-code}}
        - {name: hmac, secret: {secretName: access-subscription-secrets}}
        - {name: github-app, secret: {secretName: access-github-app, items: [{key: private-key.pem, path: private-key.pem}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: access-rule-sync}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: access-rule-sync}}
  template:
    metadata: {labels: {app.kubernetes.io/name: access-rule-sync, app.kubernetes.io/component: rules}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: sync
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [/bin/sh, -ec]
          args: ["while true; do python /app/rule_sync.py || true; sleep 86400; done"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 500m, memory: 192Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: rules, mountPath: /rules}
      volumes:
        - {name: code, configMap: {name: access-subscription-code}}
        - {name: rules, persistentVolumeClaim: {claimName: access-rule-cache}}
---
apiVersion: v1
kind: Service
metadata: {name: access-subscription}
spec:
  selector: {app.kubernetes.io/name: access-subscription}
  # Keep the public upstream port stable while targeting the bridge listener.
  # This lets pre-existing Pods serve the updated mounted code during a node
  # runtime incident; replacement Pods start the same listener directly.
  ports: [{name: http, port: 8080, targetPort: 18081}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: access-subscription}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: access-subscription}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oauth2-proxy-access-subscription}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
  template:
    metadata: {labels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0@sha256:37c1570c0427e02fc7c947ef2c04e8995b8347b7abc9fcf1dbb4e376a4b221a7
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://dex.service.re8ch.com
            # Keep browser authorization on the public issuer while avoiding a
            # public Gateway/RouteOS hairpin for the server-side code exchange.
            - --redeem-url=http://dex.dex.svc.cluster.local/token
            - --redirect-url=https://sub.access.re8ch.com/oauth2/callback
            - --upstream=http://access-subscription:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-csrf-per-request=true
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --skip-auth-route=^/s/
            - --skip-auth-route=^/r/
            - --skip-auth-route=^/healthz$
            - --skip-auth-route=^/favicon\.ico$
            - --skip-auth-route=^/apple-touch-icon\.png$
            - --skip-auth-route=^/apple-touch-icon-precomposed\.png$
          envFrom: [{secretRef: {name: oauth2-proxy-access-subscription}}]
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: oauth2-proxy-access-subscription}
spec:
  selector: {app.kubernetes.io/name: oauth2-proxy-access-subscription}
  ports: [{name: http, port: 4180, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: oauth2-proxy-access-subscription}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: access-subscription}
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-sub-https}]
  hostnames: [sub.access.re8ch.com]
  rules: [{backendRefs: [{name: oauth2-proxy-access-subscription, port: 4180}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: access-subscription-gateway}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ports: [{port: "4180", protocol: TCP}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: access-subscription-portal}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: access-subscription}}
  ingress:
    - fromEndpoints: [{matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}]
      toPorts: [{ports: [{port: "8080", protocol: TCP}, {port: "18080", protocol: TCP}, {port: "18081", protocol: TCP}]}]
