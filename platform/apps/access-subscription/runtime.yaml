apiVersion: v1
kind: ServiceAccount
metadata: {name: access-subscription}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: access-subscription}
rules:
  - {apiGroups: [""], resources: [configmaps, secrets], verbs: [get, patch]}
  - {apiGroups: [apps], resources: [deployments], verbs: [get, patch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: access-subscription}
subjects: [{kind: ServiceAccount, name: access-subscription}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: access-subscription}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: access-subscription}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: access-subscription}}
  template:
    metadata: {labels: {app.kubernetes.io/name: access-subscription}}
    spec:
      serviceAccountName: access-subscription
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: portal
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          command: [python, /app/app.py]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env: [{name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}]
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: hmac, mountPath: /secrets, readOnly: true}
      volumes:
        - {name: code, configMap: {name: access-subscription-code}}
        - {name: hmac, secret: {secretName: access-subscription-secrets}}
---
apiVersion: v1
kind: Service
metadata: {name: access-subscription}
spec:
  selector: {app.kubernetes.io/name: access-subscription}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oauth2-proxy-access-subscription}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
  template:
    metadata: {labels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0@sha256:37c1570c0427e02fc7c947ef2c04e8995b8347b7abc9fcf1dbb4e376a4b221a7
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://dex.re8ch.com
            - --redirect-url=https://sub.access.re8ch.com/oauth2/callback
            - --upstream=http://access-subscription:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=12h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --skip-auth-route=^/s/
            - --skip-auth-route=^/healthz$
          envFrom: [{secretRef: {name: oauth2-proxy-access-subscription}}]
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 5}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 300m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: oauth2-proxy-access-subscription}
spec:
  selector: {app.kubernetes.io/name: oauth2-proxy-access-subscription}
  ports: [{name: http, port: 4180, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: access-subscription
  annotations:
    networking.re8ch.com/dns-state: canary-not-published
spec:
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: access-sub-https}]
  hostnames: [sub.access.re8ch.com]
  rules: [{backendRefs: [{name: oauth2-proxy-access-subscription, port: 4180}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: access-subscription-gateway}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy-access-subscription}}
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ports: [{port: "4180", protocol: TCP}]}]
