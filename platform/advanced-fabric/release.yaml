apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: advanced-fabric
  namespace: flux-system
spec:
  # The autonomous network domain owns the active release in
  # flux-network-system. Keep this legacy object only as a suspended rollback
  # declaration so it cannot continuously fail on namespace-local valuesFrom.
  suspend: true
  interval: 3m
  provider: generic
  url: oci://ghcr.io/advanced-fabrics/charts/advanced-fabric
  ref:
    digest: sha256:50f1b59b98081f74e4cf51ad91ea2f7253b26cbd653674c1126907f3cd403819
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/advanced-fabrics/core/\.github/workflows/release-chart\.yaml@refs/tags/v1\.0\.0-rc\.14$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: advanced-fabric
  namespace: flux-system
spec:
  interval: 3m
  releaseName: service-vip-fabric
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: advanced-fabric
  # Confidential NodeContract projection decrypted by Flux in-cluster.
  valuesFrom:
    - kind: Secret
      name: cluster-node-inventory
      valuesKey: advanced-fabric-values.yaml
  install:
    crds: CreateReplace
    # Edge nodes can remain registered while temporarily offline. The
    # observability plane must still install so their absence is measurable.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    preserveValues: false
    remediation:
      # Public API migrations are forward-only. Stop on incompatibility so the
      # producer and consumer contracts cannot silently diverge.
      retries: 0
  test:
    enable: true
    # A DNS datapath failure remains visible through TestSuccess and alerts,
    # but must not mark the successfully upgraded fabric release unready and
    # deadlock dependent public-edge reconciliation.
    ignoreFailures: true
  postRenderers:
    - kustomize:
        patches:
          # Prefer healthy local DNS on control nodes, with a remote fallback
          # for workers/spines that have no local replica. Per-replica probes
          # report local and remote failures independently of Service routing.
          - target:
              version: v1
              kind: Service
              name: advanced-fabric-dns
            patch: |-
              - op: add
                path: /spec/trafficDistribution
                value: PreferSameNode
              - op: add
                path: /spec/internalTrafficPolicy
                value: Cluster
          # The 2 vCPU / 1.6 GiB muaya lightweight node repeatedly entered a
          # memory-reclaim and I/O-wait loop while this six-container agent
          # restarted Hubble every 15 seconds. Keep the lightweight node and
          # container resource exporters there, but run fabric analysis on the
          # nodes with enough system headroom.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: advanced-fabric-agent
            patch: |-
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values: [muaya-lightweight]
              - op: replace
                path: /spec/template/spec/containers/0/env/1/value
                value: "300"
              - op: replace
                path: /spec/template/spec/containers/0/resources
                value:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 128Mi}
              # hostNetwork collectors cannot depend on the broken Kubernetes
              # Service VIP during control-plane recovery. Use the active A1
              # API endpoint until the guarded control-plane VIP is healthy.
              - op: add
                path: /spec/template/spec/containers/2/env/-
                value: {name: KUBERNETES_SERVICE_HOST, value: "10.250.0.147"}
              - op: add
                path: /spec/template/spec/containers/2/env/-
                value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
              - op: add
                path: /spec/template/spec/containers/3/env/-
                value: {name: KUBERNETES_SERVICE_HOST, value: "10.250.0.147"}
              - op: add
                path: /spec/template/spec/containers/3/env/-
                value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
              - op: add
                path: /spec/template/spec/containers/4/env/-
                value: {name: KUBERNETES_SERVICE_HOST, value: "10.250.0.147"}
              - op: add
                path: /spec/template/spec/containers/4/env/-
                value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
          # Both path-evidence controller replicas repeatedly OOM at 256Mi,
          # stopping NetworkPathAssessment refresh and all PublicEdge admission.
          # Allow headroom while tracking memory growth and evidence freshness.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: advanced-fabric-controller
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/resources
                value:
                  requests: {cpu: 50m, memory: 256Mi}
                  limits: {cpu: 500m, memory: 768Mi}
  values:
    # preserveValues keeps the pre-Flux service-vip-fabric settings. Declare
    # newly schema-required optional components explicitly so chart upgrades do
    # not enable them or fail validation when they were absent historically.
    routerOS:
      enabled: false
      namespace: kube-system
      credentialsSecret: {namespace: ops, name: mikrotik-routeros-admin}
      nodeSelector: {}
    headlampPlugin:
      enabled: false
      namespace: headlamp
      pluginsPVC: headlamp-plugins
      installImage: registry.k8s.io/busybox:1.36.1
    advancedFabric:
      enabled: true
      runtimeNamespace: kube-system
      mode: guarded-apply
      applyEnabled: true
      observeDays: 7
      emergencyDisable: false
      timezone: Asia/Shanghai
      nativeRoutingCIDR: 10.42.0.0/16
      acceleratedCIDR: 10.250.0.0/24
      serviceCIDR: 10.251.0.0/24
      controlPlaneApi:
        enabled: true
        vip: 10.250.0.1/32
        port: 6443
        mode: healthy-ecmp
        eligibleNodes: [r640, a1-wsl-zt]
        guardedNodes: [r640, a1-wsl-zt]
        nodeOperations:
          - name: r640
            localAsn: 4200000128
            vipInterface: lo
            frrExportPrefixLists: [POD-FABRIC-SELF]
            frrImportPrefixLists: [SELF]
            frrNeighborPolicies:
              - {neighbor: 172.31.92.50, maximumPrefixes: 8}
            frrPrefixEntries:
              - {list: POD-FABRIC-SELF, sequence: 30, prefix: 172.31.92.50/32}
            frrNetworks: [172.31.92.50/32]
            forwardRules:
              - {inInterface: wg-public-mesh, outInterface: wg-pt-a1, source: 172.31.92.50/32, destination: 10.250.0.1/32, protocol: tcp, port: 6443}
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.128, destination: 10.250.0.0/24, protocol: tcp, port: 2380}
              - {source: 10.250.0.128, destination: 10.250.0.0/24}
            fallbackRoutes:
              - {destination: 10.181.22.147/32, via: 192.168.88.1, dev: eno2np1, src: 10.181.22.128, metric: 500}
              - {destination: 10.181.22.125/32, via: 192.168.88.1, dev: eno2np1, src: 10.181.22.128, metric: 500}
          - name: a1-wsl-zt
            localAsn: 4200010147
            vipInterface: lo
            # Keep Raft and kube-apiserver flows on the deterministic main
            # route before the broader accelerated-CIDR ECMP policy.
            routingPolicyRules:
              - {priority: 11520, destination: 10.250.0.0/24, protocol: tcp, destinationPort: 2379-2380, table: main}
              - {priority: 11521, destination: 10.250.0.0/24, protocol: tcp, destinationPort: "6443", table: main}
            frrExportPrefixLists: [POD-FABRIC-OUT]
            wireguardInterfaces: []
            frrPrefixEntries:
              - {list: POD-FABRIC-OUT, sequence: 500, prefix: 172.31.92.50/32}
            wireguardPeerPolicies:
              - interface: wg-pt-a1
                peer: pEho3VmmtSBsMbUglwD3/NDi8Vw2sFvRVEvToqWypx8=
                allowedPrefixes: [172.31.92.50/32]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            # Preserve 10.42/16 pod sources across the A/B native-routing path
            # so Cilium can enforce the originating workload identity.
            sourceIdentityRules:
              - {source: 10.250.0.147, destination: 10.250.0.0/24, protocol: tcp, port: 2380}
              - {source: 10.250.0.147, destination: 10.250.0.0/24}
          - name: b1-wsl-zt
            localAsn: 4200010125
            vipInterface: lo
            # Symmetric with A1: both large-memory control-plane nodes bypass
            # dynamic ECMP for long-lived membership and API connections.
            routingPolicyRules:
              - {priority: 11520, destination: 10.250.0.0/24, protocol: tcp, destinationPort: 2379-2380, table: main}
              - {priority: 11521, destination: 10.250.0.0/24, protocol: tcp, destinationPort: "6443", table: main}
            frrExportPrefixLists: [POD-FABRIC-OUT]
            frrImportPrefixLists: [POD-FABRIC-OUT]
            frrImportPrefixSequence: 305
            frrPrefixEntries:
              - {list: POD-FABRIC-OUT, sequence: 30, prefix: 10.42.6.0/24}
            wireguardInterfaces: [wg-wsl-lan]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            # Preserve 10.42/16 pod sources across the A/B native-routing path
            # so Cilium can enforce the originating workload identity.
            sourceIdentityRules:
              - {source: 10.250.0.125, destination: 10.250.0.0/24, protocol: tcp, port: 2380}
              - {source: 10.250.0.125, destination: 10.250.0.0/24}
          # Non-origin consumers never announce the API VIP. Their guarded=false
          # transactions only authorize cryptokey routing for the ECMP prefix.
          - name: overseas-la
            wireguardInterfaces: [wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            wireguardPeerPolicies:
              - interface: wg-pt-b1
                peer: ETC/pX4zvVrz+vBXlPuM0DUwHP4E+AdrMl9Xd5tv/XY=
                allowedPrefixes: [172.31.94.125/32, 10.181.22.125/32, 10.42.0.0/16, 10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.104, destination: 10.250.0.0/24}
              # PublicEdge ingress keeps the LA node identity while AdvFab
              # carries traffic to the shared Gateway and final Pod paths.
              - {source: 10.250.0.104, destination: 10.251.0.0/24}
          - name: overseas-kl
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.1/32]
          - name: vm-20-12-ubuntu
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.73, destination: 10.250.0.0/24}
          - name: suxunji
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.77, destination: 10.250.0.0/24}
          - name: muaya-lightweight
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.79, destination: 10.250.0.0/24}
          - name: muaya-ecs
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.95, destination: 10.250.0.0/24}
          - name: zan
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.16, destination: 10.250.0.0/24}
          - name: domain-ex
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.186, destination: 10.250.0.0/24}
          - name: amdwsl-zt
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [10.250.0.0/24, 10.251.0.0/24]
            sourceIdentityRules:
              - {source: 10.250.0.38, destination: 10.250.0.0/24}
        primaryTransport: wireguard
        fallbackTransport: zerotier
        healthCheck:
          address: 127.0.0.1
          path: /readyz
          intervalSeconds: 5
          timeoutSeconds: 2
          successThreshold: 3
          failureThreshold: 3
          withdrawDelaySeconds: 0
      weightedEcmp:
        enabled: true
      controller:
        # The Lease fences status writes while A1 and the R640 API relay provide
        # separate runtime domains for the NetworkPathAssessment freshness clock.
        replicas: 2
        pdbMinAvailable: 1
        # A1 runs kube-apiserver and R640 exposes the guarded HAProxy relay on
        # the same local port, so both replicas retain a node-local API path.
        useNodeLocalAPI: true
        nodeLocalAPIPort: 6443
        tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: NoSchedule}
          - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
          - {key: storage.re8ch.com/coordinator, operator: Equal, value: "true", effect: NoSchedule}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt, r640]}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-controller}
                topologyKey: kubernetes.io/hostname
      virtualIngress:
        enabled: true
        replicas: 2
        pdbMinAvailable: 1
        # Recovery-plane replicas must schedule on the two reviewed control
        # nodes even while ordinary workload admission is closed.
        tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: NoSchedule}
          - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt, b1-wsl-zt]}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-virtual-ingress}
                topologyKey: kubernetes.io/hostname
        className: advanced-fabric
        gateway: {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
        publicAddress: 223.159.210.222
        reconcileIntervalSeconds: 15
        adoption:
          enabled: true
          sourceClassName: traefik
          exclusions: []
      dns:
        enabled: true
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        # DNS is a recovery-plane service, not an ordinary balanced workload.
        # Keep one replica on each control plane. Retain R640's local DNS
        # endpoint for worker traffic while removing its API authority.
        # Hard anti-affinity prevents replica co-location.
        replicas: 3
        pdbMinAvailable: 2
        # Run the blocking Helm test beside the R640 DNS replica. A control-plane
        # Service-path fault must remain observable, but must not leave the
        # already-upgraded fabric release permanently Stalled and block all
        # dependent public-edge reconciliation.
        testNodeSelector: {kubernetes.io/hostname: r640}
        # Bootstrap by IP, outside both cluster DNS and the Service VIP path.
        kubernetesApiEndpoints:
          - https://10.250.0.147:6443
          - https://10.250.0.125:6443
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [a1-wsl-zt, b1-wsl-zt, r640]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}
                topologyKey: kubernetes.io/hostname
        clusterDomain: cluster.local
        ttlSeconds: 30
        upstreams: [223.5.5.5, 119.29.29.29, 1.1.1.1]
        conditionalForwarders:
          ynzs.com: [223.5.5.5, 114.114.114.114]
          zt.re8ch.com: [10.181.22.73, 10.181.22.16, 10.181.22.95]
        service: {name: advanced-fabric-dns, clusterIP: 10.43.65.40}
        doh: {serviceName: advanced-fabric-doh, caSecretName: advanced-fabric-doh-tls}
        migration: {phase: active}
      componentAPI:
        publishAssessments: true
        validitySeconds: 300
      networkQuality:
        enabled: true
        # Keep the critical DNS/network release independent from an optional
        # observability admission webhook. Scrapes are owned by observability.
        victoriaMetricsServiceScrape: false
        enforcementEnabled: false
        intervalSeconds: 30
        timeoutSeconds: 2
        samples: 20
        # Five minutes absorbs short collector/control-plane gaps without
        # masking sustained path loss. PublicEdge still requires reachable
        # Ready/Partial evidence and therefore fails closed after the grace.
        freshnessSeconds: 300
        minimumHistorySamples: 3
        minimumCoverageRatio: 1
        maximumLossRatio: 0
        maximumRegionalP95Ms: 20
        maximumCrossRegionP95Ms: 400
        dns:
          maximumFailureRatio: 0.001
          maximumP95Ms: 50
          requireTcp: true
          shadowEnabled: false
          shadowServiceName: advanced-fabric-dns
        doh:
          enabled: true
          url: https://advanced-fabric-doh.kube-system.svc.cluster.local/dns-query
          caSecretName: advanced-fabric-doh-tls
          maximumFailureRatio: 0.001
          maximumP95Ms: 100
