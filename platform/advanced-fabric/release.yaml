apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: advanced-fabric
  namespace: flux-system
spec:
  interval: 30m
  provider: generic
  url: oci://ghcr.io/advanced-fabrics/charts/advanced-fabric
  ref:
    digest: sha256:c1bbc596cbaced0f499c79324927bf0040b879499b10440a3f656d710bf9a63a
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/advanced-fabrics/core/\.github/workflows/release-chart\.yaml@refs/tags/v1\.0\.0-rc\.5$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: advanced-fabric
  namespace: flux-system
spec:
  interval: 30m
  releaseName: service-vip-fabric
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: advanced-fabric
  install:
    crds: CreateReplace
    # Edge nodes can remain registered while temporarily offline. The
    # observability plane must still install so their absence is measurable.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    preserveValues: false
    remediation:
      # Public API migrations are forward-only. Stop on incompatibility so the
      # producer and consumer contracts cannot silently diverge.
      retries: 0
  test:
    enable: true
    # A DNS datapath failure remains visible through TestSuccess and alerts,
    # but must not mark the successfully upgraded fabric release unready and
    # deadlock dependent public-edge reconciliation.
    ignoreFailures: true
  postRenderers:
    - kustomize:
        patches:
          # DNS is replicated across distant failure domains. Prefer the
          # node-local endpoint so a transient cross-node fabric fault cannot
          # stall workload startup; nodes without a local replica still fall
          # back to another ready endpoint.
          - target:
              version: v1
              kind: Service
              name: advanced-fabric-dns
            patch: |-
              - op: add
                path: /spec/trafficDistribution
                value: PreferSameNode
          # The 2 vCPU / 1.6 GiB muaya lightweight node repeatedly entered a
          # memory-reclaim and I/O-wait loop while this six-container agent
          # restarted Hubble every 15 seconds. Keep the lightweight node and
          # container resource exporters there, but run fabric analysis on the
          # nodes with enough system headroom.
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: advanced-fabric-agent
            patch: |-
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values: [muaya-lightweight]
              - op: replace
                path: /spec/template/spec/containers/0/env/1/value
                value: "300"
  values:
    # preserveValues keeps the pre-Flux service-vip-fabric settings. Declare
    # newly schema-required optional components explicitly so chart upgrades do
    # not enable them or fail validation when they were absent historically.
    routerOS:
      enabled: false
      namespace: kube-system
      credentialsSecret: {namespace: ops, name: mikrotik-routeros-admin}
      nodeSelector: {}
    headlampPlugin:
      enabled: false
      namespace: headlamp
      pluginsPVC: headlamp-plugins
      installImage: registry.k8s.io/busybox:1.36.1
    advancedFabric:
      enabled: true
      runtimeNamespace: kube-system
      mode: guarded-apply
      applyEnabled: true
      observeDays: 7
      emergencyDisable: false
      timezone: Asia/Shanghai
      nativeRoutingCIDR: 192.0.2.57/16
      acceleratedCIDR: 192.0.2.65/24
      serviceCIDR: 192.0.2.121/24
      controlPlaneApi:
        enabled: true
        vip: 192.0.2.116/32
        port: 6443
        mode: healthy-ecmp
        eligibleNodes: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        guardedNodes: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        nodeOperations:
          - name: restricted-node-6dc3f140f9
            localAsn: 4200000128
            vipInterface: lo
            frrExportPrefixLists: [POD-FABRIC-SELF]
            frrImportPrefixLists: [SELF]
            frrNeighborPolicies:
              - {neighbor: 192.0.2.4, maximumPrefixes: 8}
            frrPrefixEntries:
              - {list: POD-FABRIC-SELF, sequence: 30, prefix: 192.0.2.4/32}
            frrNetworks: [192.0.2.4/32]
            forwardRules:
              - {inInterface: wg-public-mesh, outInterface: wg-pt-a1, source: 192.0.2.4/32, destination: 192.0.2.116/32, protocol: tcp, port: 6443}
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.179, destination: 192.0.2.65/24, protocol: tcp, port: 2380}
              - {source: 192.0.2.179, destination: 192.0.2.65/24}
            fallbackRoutes:
              - {destination: 192.0.2.176/32, via: 192.0.2.240, dev: eno2np1, src: 192.0.2.178, metric: 500}
              - {destination: 192.0.2.4/32, via: 192.0.2.240, dev: eno2np1, src: 192.0.2.178, metric: 500}
          - name: restricted-node-1eb0570f74
            localAsn: 4200010147
            vipInterface: lo
            # Keep Raft and kube-apiserver flows on the deterministic main
            # route before the broader accelerated-CIDR ECMP policy.
            routingPolicyRules:
              - {priority: 11520, destination: 192.0.2.65/24, protocol: tcp, destinationPort: 2379-2380, table: main}
              - {priority: 11521, destination: 192.0.2.65/24, protocol: tcp, destinationPort: "6443", table: main}
            frrExportPrefixLists: [POD-FABRIC-OUT]
            wireguardInterfaces: []
            frrPrefixEntries:
              - {list: POD-FABRIC-OUT, sequence: 500, prefix: 192.0.2.4/32}
            wireguardPeerPolicies:
              - interface: wg-pt-a1
                peer: pEho3VmmtSBsMbUglwD3/NDi8Vw2sFvRVEvToqWypx8=
                allowedPrefixes: [192.0.2.4/32]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            # Preserve 10.42/16 pod sources across the A/B native-routing path
            # so Cilium can enforce the originating workload identity.
            sourceIdentityRules:
              - {source: 192.0.2.242, destination: 192.0.2.65/24, protocol: tcp, port: 2380}
              - {source: 192.0.2.242, destination: 192.0.2.65/24}
          - name: restricted-node-296f36f2fb
            localAsn: 4200010125
            vipInterface: lo
            # Symmetric with A1: both large-memory control-plane nodes bypass
            # dynamic ECMP for long-lived membership and API connections.
            routingPolicyRules:
              - {priority: 11520, destination: 192.0.2.65/24, protocol: tcp, destinationPort: 2379-2380, table: main}
              - {priority: 11521, destination: 192.0.2.65/24, protocol: tcp, destinationPort: "6443", table: main}
            frrExportPrefixLists: [POD-FABRIC-OUT]
            frrImportPrefixLists: [POD-FABRIC-OUT]
            frrImportPrefixSequence: 305
            frrPrefixEntries:
              - {list: POD-FABRIC-OUT, sequence: 30, prefix: 192.0.2.140/24}
            wireguardInterfaces: [wg-wsl-lan]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            # Preserve 10.42/16 pod sources across the A/B native-routing path
            # so Cilium can enforce the originating workload identity.
            sourceIdentityRules:
              - {source: 192.0.2.1, destination: 192.0.2.65/24, protocol: tcp, port: 2380}
              - {source: 192.0.2.1, destination: 192.0.2.65/24}
          # Non-origin consumers never announce the API VIP. Their guarded=false
          # transactions only authorize cryptokey routing for the ECMP prefix.
          - name: overseas-la
            wireguardInterfaces: [wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            wireguardPeerPolicies:
              - interface: wg-pt-b1
                peer: ETC/pX4zvVrz+vBXlPuM0DUwHP4E+AdrMl9Xd5tv/XY=
                allowedPrefixes: [192.0.2.101/32, 192.0.2.4/32, 192.0.2.57/16, 192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.147, destination: 192.0.2.65/24}
              # PublicEdge ingress keeps the LA node identity while AdvFab
              # carries traffic to the shared Gateway and final Pod paths.
              - {source: 192.0.2.147, destination: 192.0.2.121/24}
          - name: overseas-kl
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.116/32]
          - name: vm-20-12-ubuntu
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.223, destination: 192.0.2.65/24}
          - name: suxunji
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.246, destination: 192.0.2.65/24}
          - name: muaya-lightweight
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.160, destination: 192.0.2.65/24}
          - name: muaya-ecs
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.32, destination: 192.0.2.65/24}
          - name: zan
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.152, destination: 192.0.2.65/24}
          - name: domain-ex
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.46, destination: 192.0.2.65/24}
          - name: amdwsl-zt
            wireguardInterfaces: [wg-pt-a1, wg-pt-b1]
            wireguardAllowedPrefixes: [192.0.2.65/24, 192.0.2.121/24]
            sourceIdentityRules:
              - {source: 192.0.2.117, destination: 192.0.2.65/24}
        primaryTransport: wireguard
        fallbackTransport: zerotier
        healthCheck:
          address: 127.0.0.1
          path: /readyz
          intervalSeconds: 5
          timeoutSeconds: 2
          successThreshold: 3
          failureThreshold: 3
          withdrawDelaySeconds: 0
      weightedEcmp:
        enabled: true
      controller:
        # This controller owns the freshness clock for NetworkPathAssessment.
        # Keep it on the always-on control node so a workstation outage cannot
        # make every PublicEdge fail closed with expired evidence.
        nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      virtualIngress:
        enabled: true
        replicas: 2
        pdbMinAvailable: 1
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-virtual-ingress}
                topologyKey: kubernetes.io/hostname
        className: advanced-fabric
        gateway: {name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}
        publicAddress: 192.0.2.138
        reconcileIntervalSeconds: 15
        adoption:
          enabled: true
          sourceClassName: traefik
          exclusions: []
      dns:
        enabled: true
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        # DNS is a recovery-plane service, not an ordinary balanced workload.
        # Keep exactly one replica in each reviewed control-plane failure
        # domain so loss of A1 or B1 cannot remove half of the cluster DNS
        # authority. restricted-node-6dc3f140f9 is deliberately admitted as the third independent
        # floor; the hard anti-affinity below prevents replica co-location.
        replicas: 3
        pdbMinAvailable: 2
        # Run the blocking Helm test beside the restricted-node-6dc3f140f9 DNS replica. A control-plane
        # Service-path fault must remain observable, but must not leave the
        # already-upgraded fabric release permanently Stalled and block all
        # dependent public-edge reconciliation.
        testNodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
        # Bootstrap by IP, outside both cluster DNS and the Service VIP path.
        kubernetesApiEndpoints:
          - https://192.0.2.176:6443
          - https://192.0.2.4:6443
          - https://192.0.2.178:6443
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb, restricted-node-6dc3f140f9]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}
                topologyKey: kubernetes.io/hostname
        clusterDomain: cluster.local
        ttlSeconds: 30
        upstreams: [192.0.2.58, 192.0.2.95, 1.1.1.1]
        conditionalForwarders:
          ynzs.com: [192.0.2.58, 192.0.2.216]
          zt.re8ch.com: [192.0.2.192, 192.0.2.138, 192.0.2.74]
        service: {name: advanced-fabric-dns, clusterIP: 192.0.2.149}
        doh: {serviceName: advanced-fabric-doh, caSecretName: advanced-fabric-doh-tls}
        migration: {phase: active}
      networkQuality:
        enabled: true
        # Keep the critical DNS/network release independent from an optional
        # observability admission webhook. Scrapes are owned by observability.
        victoriaMetricsServiceScrape: false
        enforcementEnabled: false
        intervalSeconds: 30
        timeoutSeconds: 2
        samples: 20
        freshnessSeconds: 120
        minimumHistorySamples: 3
        minimumCoverageRatio: 1
        maximumLossRatio: 0
        maximumRegionalP95Ms: 20
        maximumCrossRegionP95Ms: 400
        dns:
          maximumFailureRatio: 0.001
          maximumP95Ms: 50
          requireTcp: true
          shadowEnabled: false
          shadowServiceName: advanced-fabric-dns
        doh:
          enabled: true
          url: https://advanced-fabric-doh.kube-system.svc.cluster.local/dns-query
          caSecretName: advanced-fabric-doh-tls
          maximumFailureRatio: 0.001
          maximumP95Ms: 100
      nodes:
        - {name: restricted-node-6dc3f140f9, role: spine, class: A, region: cn-hunan, failureDomain: r640-idc, provider: onprem, internalIP: 192.0.2.178, podCIDR: 192.0.2.140/24, acceleratedIP: 192.0.2.179, asn: 65001, legacyASN: 4200000128, uplinkMbps: 200, publicAuthority: true, inventoryComplete: true}
        - {name: overseas-la, role: spine, class: A, region: us-ca, failureDomain: overseas-la, provider: overseas, internalIP: 192.0.2.110, podCIDR: 192.0.2.114/24, acceleratedIP: 192.0.2.147, asn: 65002, legacyASN: 4200000104, uplinkMbps: 1000, monthlyTrafficLimitGiB: 1024, publicAuthority: true, inventoryComplete: true}
        - {name: overseas-kl, role: spine, class: A, region: my-kul, failureDomain: overseas-kl, provider: overseas, internalIP: 192.0.2.245, podCIDR: 192.0.2.110/24, acceleratedIP: 192.0.2.149, asn: 65003, legacyASN: 4200000089, uplinkMbps: 1000, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: restricted-node-1eb0570f74, role: spine, class: B, region: cn-hunan, failureDomain: a1, provider: local-wsl, internalIP: 192.0.2.176, podCIDR: 192.0.2.48/24, acceleratedIP: 192.0.2.242, asn: 65101, legacyASN: 4200010147, uplinkMbps: 200, publicAuthority: false, inventoryComplete: true}
        - {name: restricted-node-296f36f2fb, role: spine, class: B, region: cn-hunan, failureDomain: b1, provider: local-wsl, internalIP: 192.0.2.4, podCIDR: 192.0.2.234/24, acceleratedIP: 192.0.2.1, asn: 65102, legacyASN: 4200010125, uplinkMbps: 200, publicAuthority: false, inventoryComplete: true}
        - {name: amdwsl-zt, role: spine, class: B, region: cn-hubei, failureDomain: amdwsl, provider: local-wsl, internalIP: 192.0.2.10, podCIDR: 192.0.2.134/24, acceleratedIP: 192.0.2.117, asn: 65103, legacyASN: 4200010038, uplinkMbps: 100, publicAuthority: false, inventoryComplete: true}
        - {name: vm-20-12-ubuntu, role: leaf, class: C, region: cn-guangzhou, failureDomain: tencent-gz-73, provider: tencent, internalIP: 192.0.2.192, podCIDR: 192.0.2.57/24, acceleratedIP: 192.0.2.223, asn: 4200000073, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: suxunji, role: leaf, class: C, region: cn-shanghai, failureDomain: tencent-sh-77, provider: tencent, internalIP: 192.0.2.182, podCIDR: 192.0.2.79/24, acceleratedIP: 192.0.2.246, asn: 4200000077, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: muaya-lightweight, role: leaf, class: C, region: cn-shanghai, failureDomain: aliyun-sh-79, provider: aliyun, internalIP: 192.0.2.112, podCIDR: 192.0.2.89/24, acceleratedIP: 192.0.2.160, asn: 4200000079, uplinkMbps: 3, publicAuthority: true, inventoryComplete: true}
        - {name: muaya-ecs, role: leaf, class: C, region: cn-hangzhou, failureDomain: aliyun-hz-95, provider: aliyun, internalIP: 192.0.2.74, podCIDR: 192.0.2.237/24, acceleratedIP: 192.0.2.32, asn: 4200000095, uplinkMbps: 3, publicAuthority: true, inventoryComplete: true}
        - {name: zan, role: leaf, class: C, region: cn-guangzhou, failureDomain: tencent-gz-16, provider: tencent, internalIP: 192.0.2.138, podCIDR: 192.0.2.128/24, acceleratedIP: 192.0.2.152, asn: 4200000016, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: domain-ex, role: leaf, class: C, region: cn-shanghai, failureDomain: tencent-sh-186, provider: tencent, internalIP: 192.0.2.89, podCIDR: 192.0.2.94/24, acceleratedIP: 192.0.2.46, asn: 4200000186, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
