apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: re8ch-advanced-fabric
  namespace: flux-system
spec:
  interval: 30m
  provider: generic
  url: oci://ghcr.io/re8ch/charts/re8ch-advanced-fabric
  ref:
    digest: sha256:789308b2faa2c864600aa0817aec12616970ec77fb22f697e6c5fb498f46e9fe
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: re8ch-advanced-fabric
  namespace: flux-system
spec:
  interval: 30m
  releaseName: service-vip-fabric
  targetNamespace: kube-system
  storageNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: re8ch-advanced-fabric
  install:
    crds: CreateReplace
    # Edge nodes can remain registered while temporarily offline. The
    # observability plane must still install so their absence is measurable.
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    disableWait: true
    preserveValues: false
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    cleanupOnFail: true
  test:
    enable: true
    ignoreFailures: false
  values:
    # preserveValues keeps the pre-Flux service-vip-fabric settings. Declare
    # newly schema-required optional components explicitly so chart upgrades do
    # not enable them or fail validation when they were absent historically.
    routerOS:
      enabled: false
      namespace: kube-system
      credentialsSecret: {namespace: ops, name: mikrotik-routeros-admin}
      nodeSelector: {}
    headlampPlugin:
      enabled: false
      namespace: headlamp
      pluginsPVC: headlamp-plugins
      installImage: registry.k8s.io/busybox:1.36.1
    advancedFabric:
      enabled: true
      mode: observe-only
      applyEnabled: false
      observeDays: 7
      emergencyDisable: false
      timezone: Asia/Shanghai
      nativeRoutingCIDR: 192.0.2.224/16
      acceleratedCIDR: 192.0.2.106/24
      serviceCIDR: 192.0.2.215/24
      controller:
        nodeSelector: {}
      dns:
        enabled: true
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        replicas: 3
        pdbMinAvailable: 2
        # Bootstrap by IP, outside both cluster DNS and the lossy Service VIP
        # path. A1/B1 are currently reachable from every authoritative node;
        # restricted-node-6dc3f140f9 remains last-resort until its WG transport IP is in the API cert.
        kubernetesApiEndpoints:
          - https://192.0.2.18:6443
          - https://192.0.2.208:6443
          - https://192.0.2.183:6443
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [restricted-node-6dc3f140f9, zan, vm-20-12-ubuntu]
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: {app.kubernetes.io/name: advanced-fabric-doh}
                topologyKey: kubernetes.io/hostname
        clusterDomain: cluster.local
        ttlSeconds: 30
        upstreams: [192.0.2.131, 192.0.2.148, 1.1.1.1]
        conditionalForwarders:
          ynzs.com: [192.0.2.131, 192.0.2.121]
          zt.re8ch.com: [192.0.2.67, 192.0.2.79, 192.0.2.203]
        service: {name: advanced-fabric-dns, clusterIP: 192.0.2.42}
        doh: {serviceName: advanced-fabric-doh, caSecretName: advanced-fabric-doh-tls}
        migration: {phase: active}
      networkQuality:
        enabled: true
        # Keep the critical DNS/network release independent from an optional
        # observability admission webhook. Scrapes are owned by observability.
        victoriaMetricsServiceScrape: false
        enforcementEnabled: false
        intervalSeconds: 30
        timeoutSeconds: 2
        samples: 20
        freshnessSeconds: 120
        minimumCoverageRatio: 1
        maximumLossRatio: 0
        maximumRegionalP95Ms: 20
        maximumCrossRegionP95Ms: 400
        dns:
          maximumFailureRatio: 0.001
          maximumP95Ms: 50
          requireTcp: true
          shadowEnabled: false
          shadowServiceName: advanced-fabric-dns
        doh:
          enabled: true
          url: https://advanced-fabric-doh.kube-system.svc.cluster.local/dns-query
          caSecretName: advanced-fabric-doh-tls
          maximumFailureRatio: 0.001
          maximumP95Ms: 100
      nodes:
        - {name: restricted-node-6dc3f140f9, role: spine, class: A, region: cn-hunan, failureDomain: r640-idc, provider: onprem, internalIP: 192.0.2.183, podCIDR: 192.0.2.18/24, acceleratedIP: 192.0.2.205, asn: 65001, legacyASN: 4200000128, uplinkMbps: 200, publicAuthority: true, inventoryComplete: true}
        - {name: overseas-la, role: spine, class: A, region: us-ca, failureDomain: overseas-la, provider: overseas, internalIP: 192.0.2.55, podCIDR: 192.0.2.15/24, acceleratedIP: 192.0.2.29, asn: 65002, legacyASN: 4200000104, uplinkMbps: 1000, monthlyTrafficLimitGiB: 1024, publicAuthority: true, inventoryComplete: true}
        - {name: overseas-kl, role: spine, class: A, region: my-kul, failureDomain: overseas-kl, provider: overseas, internalIP: 192.0.2.50, podCIDR: 192.0.2.55/24, acceleratedIP: 192.0.2.42, asn: 65003, legacyASN: 4200000089, uplinkMbps: 1000, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: overseas-edge-50, role: spine, class: A, region: us-ca, failureDomain: overseas-edge-50, provider: overseas, internalIP: 192.0.2.122, podCIDR: 192.0.2.208/24, acceleratedIP: 192.0.2.225, asn: 65004, legacyASN: 4200000050, uplinkMbps: 1000, monthlyTrafficLimitGiB: 1024, publicAuthority: true, inventoryComplete: true}
        - {name: restricted-node-1eb0570f74, role: spine, class: B, region: cn-hunan, failureDomain: a1, provider: local-wsl, internalIP: 192.0.2.18, podCIDR: 192.0.2.109/24, acceleratedIP: 192.0.2.173, asn: 65101, legacyASN: 4200010147, uplinkMbps: 200, publicAuthority: false, inventoryComplete: true}
        - {name: restricted-node-296f36f2fb, role: spine, class: B, region: cn-hunan, failureDomain: b1, provider: local-wsl, internalIP: 192.0.2.208, podCIDR: 192.0.2.26/24, acceleratedIP: 192.0.2.213, asn: 65102, legacyASN: 4200010125, uplinkMbps: 200, publicAuthority: false, inventoryComplete: true}
        - {name: amdwsl-zt, role: spine, class: B, region: cn-hubei, failureDomain: amdwsl, provider: local-wsl, internalIP: 192.0.2.249, podCIDR: 192.0.2.238/24, acceleratedIP: 192.0.2.93, asn: 65103, legacyASN: 4200010038, uplinkMbps: 100, publicAuthority: false, inventoryComplete: true}
        - {name: vm-20-12-ubuntu, role: leaf, class: C, region: cn-guangzhou, failureDomain: tencent-gz-73, provider: tencent, internalIP: 192.0.2.67, podCIDR: 192.0.2.224/24, acceleratedIP: 192.0.2.114, asn: 4200000073, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: suxunji, role: leaf, class: C, region: cn-shanghai, failureDomain: tencent-sh-77, provider: tencent, internalIP: 192.0.2.143, podCIDR: 192.0.2.122/24, acceleratedIP: 192.0.2.145, asn: 4200000077, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: muaya-lightweight, role: leaf, class: C, region: cn-shanghai, failureDomain: aliyun-sh-79, provider: aliyun, internalIP: 192.0.2.141, podCIDR: 192.0.2.172/24, acceleratedIP: 192.0.2.24, asn: 4200000079, uplinkMbps: 3, publicAuthority: true, inventoryComplete: true}
        - {name: muaya-ecs, role: leaf, class: C, region: cn-hangzhou, failureDomain: aliyun-hz-95, provider: aliyun, internalIP: 192.0.2.203, podCIDR: 192.0.2.99/24, acceleratedIP: 192.0.2.46, asn: 4200000095, uplinkMbps: 3, publicAuthority: true, inventoryComplete: true}
        - {name: zan, role: leaf, class: C, region: cn-guangzhou, failureDomain: tencent-gz-16, provider: tencent, internalIP: 192.0.2.79, podCIDR: 192.0.2.186/24, acceleratedIP: 192.0.2.63, asn: 4200000016, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
        - {name: domain-ex, role: leaf, class: C, region: cn-shanghai, failureDomain: tencent-sh-186, provider: tencent, internalIP: 192.0.2.172, podCIDR: 192.0.2.26/24, acceleratedIP: 192.0.2.31, asn: 4200000186, uplinkMbps: 3, monthlyTrafficLimitGiB: 300, publicAuthority: true, inventoryComplete: true}
