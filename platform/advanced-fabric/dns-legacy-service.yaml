apiVersion: v1
kind: Service
metadata:
  name: kube-dns-legacy-ip
  namespace: kube-system
  labels:
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: AdvancedFabricDNSLegacy
spec:
  clusterIP: 192.0.2.170
  clusterIPs: [192.0.2.170]
  selector:
    app.kubernetes.io/name: advanced-fabric-doh
  ports:
    - {name: dns, port: 53, protocol: UDP, targetPort: 53}
    - {name: dns-tcp, port: 53, protocol: TCP, targetPort: 53}
    - {name: metrics, port: 9153, protocol: TCP, targetPort: 9153}
