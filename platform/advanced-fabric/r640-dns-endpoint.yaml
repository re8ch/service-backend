apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-fabric-doh-r640
  namespace: kube-system
  labels:
    app.kubernetes.io/name: advanced-fabric-doh
    app.kubernetes.io/instance: restricted-node-6dc3f140f9
    app.kubernetes.io/part-of: re8ch-advanced-fabric
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: advanced-fabric-doh
      app.kubernetes.io/instance: restricted-node-6dc3f140f9
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advanced-fabric-doh
        app.kubernetes.io/instance: restricted-node-6dc3f140f9
        app.kubernetes.io/part-of: re8ch-advanced-fabric
    spec:
      serviceAccountName: advanced-fabric-doh
      priorityClassName: system-cluster-critical
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      tolerations:
        - {key: dedicated, operator: Equal, value: pg-re8ch, effect: NoSchedule}
        - {key: node-role.kubernetes.io/control-plane, operator: Exists}
        - {key: node-role.kubernetes.io/master, operator: Exists}
      containers:
        - name: coredns
          image: rancher/mirrored-coredns-coredns:1.14.2
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - {name: dns, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
            - {name: doh, containerPort: 8443, protocol: TCP}
            - {name: health, containerPort: 8080, protocol: TCP}
            - {name: ready, containerPort: 8181, protocol: TCP}
            - {name: metrics, containerPort: 9153, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: ready}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
            - {name: k3s-coredns, mountPath: /etc/k3s-coredns, readOnly: true}
            - {name: custom, mountPath: /etc/coredns/custom, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: advanced-fabric-doh}
        - name: k3s-coredns
          configMap: {name: coredns}
        - name: custom
          configMap: {name: coredns-custom, optional: true}
        - name: tls
          secret: {secretName: advanced-fabric-doh-tls}
