apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dns-candidate-nodes.yaml
  - nameserver-election.yaml
  - release.yaml
configMapGenerator:
  - name: public-edge-nameserver-election-script
    namespace: regional-routing
    files:
      - nameserver-election.py
generatorOptions:
  disableNameSuffixHash: true
