apiVersion: v1
kind: ConfigMap
metadata: {name: powerdns-cloud-authorities, namespace: regional-routing}
data:
  pdns.conf: |
    launch=bind
    bind-config=/etc/powerdns/named.conf
    local-address=0.0.0.0
    local-port=53
    secondary=yes
    primary=no
    allow-notify-from=192.0.2.38,192.0.2.111
    setuid=pdns
    setgid=pdns
    version-string=anonymous
  named.conf: |
    zone "api.re8ch.com" { type slave; file "/var/lib/powerdns/api.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
    zone "db-ro.re8ch.com" { type slave; file "/var/lib/powerdns/db-ro.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
    zone "db-rw.re8ch.com" { type slave; file "/var/lib/powerdns/db-rw.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
    zone "service.re8ch.com" { type slave; file "/var/lib/powerdns/service.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
    zone "functions.re8ch.com" { type slave; file "/var/lib/powerdns/functions.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
    zone "test.re8ch.com" { type slave; file "/var/lib/powerdns/test.re8ch.com.zone"; masters { 192.0.2.38; 192.0.2.111; }; };
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: powerdns-cloud-authorities, namespace: regional-routing}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: powerdns-cloud-authorities}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
  template:
    metadata: {labels: {app.kubernetes.io/name: powerdns-cloud-authorities}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [domain-ex, muaya-lightweight, suxunji, zan]
      initContainers:
        - name: data-permissions
          image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
          command: [sh, -c, "chown -R pdns:pdns /var/lib/powerdns"]
          securityContext: {allowPrivilegeEscalation: false, runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /var/lib/powerdns}]
      containers:
        - name: pdns-auth
          image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
          command: [/usr/sbin/pdns_server]
          args: [--daemon=no, --guardian=no, --config-dir=/etc/powerdns]
          ports:
            - {name: dns-udp, containerPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, protocol: TCP}
          readinessProbe: {tcpSocket: {port: 53}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: 53}, periodSeconds: 30}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/powerdns, readOnly: true}
            - {name: data, mountPath: /var/lib/powerdns}
      volumes:
        - name: config
          configMap: {name: powerdns-cloud-authorities}
        - name: data
          hostPath: {path: /var/lib/re8ch/powerdns-authority, type: DirectoryOrCreate}
