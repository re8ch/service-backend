apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: public-edge-manager, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/public-edge/charts/public-edge-manager
  ref: {digest: sha256:8633ef227588f197b5765d89f3f241401de45d3caa07e664a0ba400e86cccd5d}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: public-edge-manager, namespace: flux-system}
spec:
  interval: 10m
  dependsOn:
    - name: advanced-fabric
      namespace: flux-system
  releaseName: public-edge-manager
  targetNamespace: regional-routing
  storageNamespace: regional-routing
  chartRef: {kind: OCIRepository, name: public-edge-manager}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: DaemonSet
              name: public-edge-manager
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_HOST, value: "192.0.2.178"}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_PORT, value: "6443"}
              - op: add
                path: /spec/template/spec/containers/0/env/-
                value: {name: KUBERNETES_SERVICE_PORT_HTTPS, value: "6443"}
  values:
    image:
      repository: ghcr.io/public-edge/public-edge-manager
      tag: "0.5.3"
      digest: sha256:16e833de14393c619206e6eb15d9f0c50679a6dba50876420cbcb98323a9e3cc
      pullPolicy: IfNotPresent
    enabled: true
    api: {group: networking.re8ch.com}
    dns:
      soaRname: hostmaster.re8ch.com.
      zones: [api.re8ch.com., db-ro.re8ch.com., db-rw.re8ch.com.]
    crd: {install: true}
    nameservers: [ns-sh.re8ch.com., ns-gz.re8ch.com., ns-us.re8ch.com.]
    authorityNodes:
      # These VPC addresses receive the providers' public-IP DNAT on port 53.
      domain-ex: {bindAddress: 192.0.2.200, area: CN, region: shanghai}
      suxunji: {bindAddress: 192.0.2.83, area: CN, region: shanghai}
    services:
      api.re8ch.com.: {service: api, class: api, probePath: /__edge/ready}
      db-ro.re8ch.com.: {service: db-ro, class: db-ro, probePath: /auth/}
      db-rw.re8ch.com.: {service: db-rw, class: db-rw, probePath: /auth/}
      registry.re8ch.com.: {service: registry, class: registry, probePath: /v2/}
      headlamp.re8ch.com.: {service: headlamp, class: web, probePath: /}
      grafana.re8ch.com.: {service: grafana, class: web, probePath: /grafana/api/health}
      dex.re8ch.com.: {service: dex, class: web, probePath: /.well-known/openid-configuration, acceptedStatuses: [200]}
      litellm.re8ch.com.: {service: litellm, class: web, probePath: /health/readiness}
      cube.re8ch.com.: {service: cube, class: web, probePath: /}
      dbgui.re8ch.com.: {service: dbgui, class: web, probePath: /}
      browser.re8ch.com.: {service: browser, class: web, probePath: /}
      collab.tools.re8ch.com.: {service: collab, class: web, probePath: /.well-known/jmap, acceptedStatuses: [200, 307]}
      mail.re8ch.com.: {service: mail, class: web, probePath: /api/health, acceptedStatuses: [200]}
      stalwart-admin.tools.re8ch.com.: {service: stalwart-admin, class: web, probePath: /admin, acceptedStatuses: [200, 302]}
      supabase.re8ch.com.: {service: supabase, class: web, probePath: /, acceptedStatuses: [200, 401]}
      hooks.re8ch.com.: {service: hooks, class: web, probePath: /hook/, acceptedStatuses: [400, 404]}
    publicEdges:
      - name: guangzhou-zan
        area: CN
        region: guangzhou
        nodeName: zan
        endpoint: {type: PublicIP, value: 192.0.2.192}
        gatewayVIP: 192.0.2.143
        capacityMbps: 100
        priority: 10
        serviceClasses: [api, db-ro, db-rw, web, registry]
        forwarding: {mode: DirectGateway}
      - name: loudi-r640
        area: CN
        region: loudi
        nodeName: restricted-node-6dc3f140f9
        endpoint: {type: PublicIP, value: 192.0.2.138}
        gatewayVIP: 192.0.2.213
        capacityMbps: 1000
        priority: -30
        serviceClasses: [api, db-ro, db-rw, web, registry]
        forwarding: {mode: DirectGateway}
    readinessGates:
      db-rw:
        configMap: {namespace: kube-system, name: pg-re8ch-role-authority, dataKey: authority.json}
        requiredFields: {authority: patroni}
        addressPath: [leader, address]
        endpointSlice: {namespace: pigsty-external, name: pg-re8ch-primary}
        requireSingleReadyAddress: true
    workload:
      httpPort: 18080
      dnsCandidateLabel: networking.re8ch.com/dns-authority-candidate
      dnsCandidateValue: "true"
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    probe:
      connectTimeoutSeconds: 5
      responseTimeoutSeconds: 12
      intervalSeconds: 3
      maxWorkers: 8
      userAgent: public-edge-manager/0.5.3
    candidateSelection:
      capacityWeight: 10
      localAreaBonus: 100000
      priorityWeight: 1
      latencyDivisorMs: 20
      latencyPenaltyCap: 50
      localNodeBonus: 5
    # Require fresh Advanced Fabric evidence and the same exact Node Ready=True
    # eligibility fact used by its path rankings.
    fabricEvidence:
      mode: Required
      apiGroup: networking.re8ch.com
      apiVersion: v1alpha2
      resource: networkpathassessments
      requireNodeReady: true
      allowedStates: [Ready, Partial]
    publication:
      enabled: true
      publisherNode: suxunji
      refs:
        registry: {namespace: qianwen-ops, name: static-cilium-edge-services-dns}
        headlamp: {namespace: headlamp, name: headlamp-dns-authority}
        grafana: {namespace: observability-system, name: grafana-dns-authority}
        dex: {namespace: dex, name: dex-dns-authority}
        litellm: {namespace: llm-gateway, name: litellm-dns-authority}
        cube: {namespace: cube-trial, name: cube-dns-authority}
        dbgui: {namespace: ops, name: cloudbeaver-dns-authority}
        collab: {namespace: mail-system, name: stalwart-collaboration-public}
        stalwart-admin: {namespace: mail-system, name: stalwart-admin-public}
        supabase: {namespace: supabase-pg-re8ch, name: supabase-pg-re8ch-studio}
        hooks: {namespace: flux-system, name: github-flux-webhook-dns-authority}
    rbac: {mutateIngresses: true}
    service: {type: ClusterIP, annotations: {}, externalTrafficPolicy: ""}
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
