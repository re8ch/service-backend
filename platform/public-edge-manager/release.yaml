apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: public-edge-manager, namespace: flux-system}
spec:
  interval: 1m
  provider: generic
  url: oci://ghcr.io/public-edge/charts/public-edge-manager
  ref: {digest: sha256:2eeb4c54e4f8fb7772444205a4bb00a2785e7ae92d062627da3b4a7b200f0eb7}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: public-edge-manager, namespace: flux-system}
spec:
  interval: 1m
  releaseName: public-edge-manager
  targetNamespace: regional-routing
  storageNamespace: regional-routing
  chartRef: {kind: OCIRepository, name: public-edge-manager}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    image:
      repository: ghcr.io/public-edge/public-edge-manager
      tag: "v0.6.17"
      # Public upstream image is reachable by overseas DNS nodes during cluster DNS failures.
      digest: sha256:593818256b3304d122ba0747b656e8a4116dbab8ab0e031067479b0afc4025cd
      pullPolicy: IfNotPresent
    enabled: true
    api: {group: networking.re8ch.com}
    runtime: {configMapName: public-edge-runtime}
    dns:
      soaRname: hostmaster.re8ch.com.
      nameserversConfigMap: public-edge-nameservers
      # Pre-stage the control-plane child zone on the existing public authorities.
      # Parent NS delegation and application A records are separate gated cutovers.
      zones: [auth.re8ch.com., api.re8ch.com., db-ro.re8ch.com., db-rw.re8ch.com., service.re8ch.com., functions.re8ch.com., test.re8ch.com.]
      # ACME follows this alias into the parent Cloudflare zone. PublicEdge
      # remains authoritative for service records; no per-service parent A is
      # needed. The chart's externalCDN field is its static-record opt-in.
      externalRecords:
        _dnsauth.auth.re8ch.com.:
          - {type: CNAME, value: auth.re8ch.com.eoacme0.com., externalCDN: true, provider: tencent-edgeone}
        aliyun.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hangzhou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-northeast-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-northeast-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-northeast-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-northeast-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-3.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-3.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-3.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-3.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-5.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-5.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-ap-southeast-5.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.ap-southeast-5.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-beijing.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-beijing.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-beijing.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-beijing.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-chengdu.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-chengdu.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-chengdu.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-chengdu.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-hangzhou.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hangzhou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-hangzhou.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hangzhou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-hongkong.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hongkong.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-hongkong.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hongkong.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-huhehaote.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-huhehaote.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-huhehaote.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-huhehaote.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-qingdao.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-qingdao.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-qingdao.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-qingdao.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-shanghai.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-shanghai.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-shanghai.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-shanghai.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-shenzhen.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-shenzhen.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-shenzhen.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-shenzhen.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-zhangjiakou.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-zhangjiakou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-cn-zhangjiakou.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-zhangjiakou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-eu-central-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.eu-central-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-eu-central-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.eu-central-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-eu-west-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.eu-west-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-eu-west-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.eu-west-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.cn-hangzhou.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-us-east-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.us-east-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-us-east-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.us-east-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-us-west-1.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.us-west-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        aliyun-us-west-1.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1184182212873855.us-west-1.fc.aliyuncs.com., externalCDN: true, provider: aliyun-fc}
        tencent.anycam.functions.re8ch.com.:
          - {type: CNAME, value: 1301339749.ap-guangzhou.tencentscf.com., externalCDN: true, provider: tencent-scf}
        tencent.ledger.functions.re8ch.com.:
          - {type: CNAME, value: 1301339749.ap-guangzhou.tencentscf.com., externalCDN: true, provider: tencent-scf}
        _acme-challenge.service.re8ch.com.:
          - {type: CNAME, value: _acme-challenge.re8ch.com., externalCDN: true, provider: cloudflare-dns01}
    crd: {install: true}
    # Used only to create the initial ConfigMap. The controller replaces it
    # with stable hash-based names after public UDP/TCP 53 qualification.
    nameservers: [ns-bootstrap.re8ch.com.]
    discovery:
      enabled: true
      replicas: 2
      intervalSeconds: 15
      probeTimeoutSeconds: 2
      # Unknown uplinks do not meet the public-edge minimum until measured.
      defaultCapacityMbps: 1
      minimumCapacityMbps: 100
      # Shared inventory supplies capacity and region facts where present.
      # Every live Node is considered; unlisted nodes can qualify with measured
      # capacity annotations and the same public IP/path/listener probes.
      clusterInventoryConfigMap: {namespace: flux-system, name: cluster-node-inventory, key: nodes.json}
      # Probe public DNS from independent overseas nodes; healthy candidates join automatically.
      maxNameservers: 3
      probeNodeNames: [overseas-la-2, overseas-flk]
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      gatewayNamespace: kube-system
      gatewaySelector: networking.re8ch.com/public-edge-gateway=true
      authorityLabel: networking.re8ch.com/public-edge-authority-ready
      ingressLabel: networking.re8ch.com/public-edge-ready
      serviceClasses: [api, db-ro, db-rw, web, registry, service-pilot, service-overseas]
      parentZone: re8ch.com
      # Keep auth's authoritative zone for rollback, but stop recreating its
      # parent NS delegation before replacing that delegation with EdgeOne CNAME.
      childZones: [api.re8ch.com, db-ro.re8ch.com, db-rw.re8ch.com, service.re8ch.com, functions.re8ch.com, test.re8ch.com]
      cloudflareSecretRef: {namespace: qianwen-ops, name: cloudflare-pg-dns-controller-secret, key: CF_API_TOKEN}
    services:
      # /__edge/ready has no accepted HTTPRoute and yields Envoy 503 on both edges.
      # /auth/me exercises the real API gateway path and returns 200 without a session.
      api.re8ch.com.: {service: api, class: api, probePath: /auth/me, acceptedStatuses: [200]}
      auth.re8ch.com.: {service: auth, class: web, probePath: /, acceptedStatuses: [200]}
      db-ro.re8ch.com.: {service: db-ro, class: db-ro, probePath: /auth/}
      db-rw.re8ch.com.: {service: db-rw, class: db-rw, probePath: /auth/}
      registry.re8ch.com.: {service: registry, class: registry, probePath: /v2/}
      headlamp.service.re8ch.com.: {service: headlamp-service, class: service-pilot, probePath: /}
      paralus.service.re8ch.com.: {service: paralus-service, class: service-pilot, probePath: /, acceptedStatuses: [200, 302, 307]}
      grafana.service.re8ch.com.: {service: grafana-service, class: service-pilot, probePath: /grafana/api/health}
      browser.service.re8ch.com.: {service: browser-service, class: service-pilot, probePath: /}
      cube.service.re8ch.com.: {service: cube-service, class: service-pilot, probePath: /}
      supabase.service.re8ch.com.: {service: supabase-service, class: service-pilot, probePath: /}
      opensandbox.service.re8ch.com.: {service: opensandbox-service, class: service-pilot, probePath: /}
      storage.service.re8ch.com.: {service: storage-service, class: service-pilot, probePath: /healthz, acceptedStatuses: [200]}
      phonycenter.service.re8ch.com.: {service: phonycenter-service, class: service-pilot, probePath: /}
      neo4j.service.re8ch.com.: {service: neo4j-service, class: service-pilot, probePath: /}
      litellm.service.re8ch.com.: {service: litellm-service, class: service-pilot, probePath: /health/readiness}
      tools.service.re8ch.com.: {service: tools-service, class: service-pilot, probePath: /.well-known/oauth-protected-resource/cloud/mcp, acceptedStatuses: [200]}
      dbgui.service.re8ch.com.: {service: dbgui-service, class: service-pilot, probePath: /}
      marketplace.service.re8ch.com.: {service: marketplace-service, class: service-pilot, probePath: /install, acceptedStatuses: [200, 302, 307, 401, 404]}
      admin.service.re8ch.com.: {service: admin-service, class: service-pilot, probePath: /mcp, acceptedStatuses: [200, 400, 401, 405, 406]}
      agent.service.re8ch.com.: {service: agent-service, class: service-pilot, probePath: /v1/mobile/control, acceptedStatuses: [200, 400, 401, 403, 405]}
      among-clusters.service.re8ch.com.: {service: among-clusters-service, class: service-pilot, probePath: /healthz, acceptedStatuses: [200]}
      auth.service.re8ch.com.: {service: auth-service, class: service-pilot, probePath: /, acceptedStatuses: [200, 302, 307]}
      codex.service.re8ch.com.: {service: codex-service, class: service-pilot, probePath: /ui, acceptedStatuses: [200, 302, 307, 401]}
      decision.service.re8ch.com.: {service: decision-service, class: service-pilot, probePath: /, acceptedStatuses: [200, 401, 403]}
      dex.service.re8ch.com.: {service: dex-service, class: service-pilot, probePath: /.well-known/openid-configuration, acceptedStatuses: [200]}
      hooks.service.re8ch.com.: {service: hooks-service, class: service-pilot, probePath: /hook/, acceptedStatuses: [400, 404]}
      image.service.re8ch.com.: {service: image-service, class: service-pilot, probePath: /image, acceptedStatuses: [200, 400, 401, 403, 404, 405]}
      ledger-decisions.service.re8ch.com.: {service: ledger-decisions-service, class: service-pilot, probePath: /, acceptedStatuses: [200, 302, 307, 401, 403]}
      mail.service.re8ch.com.: {service: mail-service, class: service-pilot, probePath: /, acceptedStatuses: [200, 302, 307]}
      stalwart-admin.service.re8ch.com.: {service: stalwart-admin, class: service-pilot, probePath: /admin, acceptedStatuses: [200, 302]}
      pay.service.re8ch.com.: {service: pay-service, class: service-overseas, probePath: /, acceptedStatuses: [200, 302, 307, 401]}
      pay-api.service.re8ch.com.: {service: pay-api, class: service-overseas, probePath: /health, acceptedStatuses: [200, 401, 404]}
      dex.re8ch.com.: {service: dex, class: web, probePath: /.well-known/openid-configuration, acceptedStatuses: [200]}
      dbgui.re8ch.com.: {service: dbgui, class: web, probePath: /}
      collab.tools.re8ch.com.: {service: collab, class: web, probePath: /.well-known/jmap, acceptedStatuses: [200, 307]}
      mail.re8ch.com.: {service: mail, class: web, probePath: /api/health, acceptedStatuses: [200]}
      id.re8ch.com.: {service: stalwart, class: web, probePath: /.well-known/openid-configuration, acceptedStatuses: [200]}
      hooks.re8ch.com.: {service: hooks, class: web, probePath: /hook/, acceptedStatuses: [400, 404]}
    # PublicEdge status already supplies edge transport readiness. The legacy
    # db-rw gate performs two Kubernetes API reads during each DNS query and
    # can exceed recursive resolver timeouts even while Supabase is healthy.
    workload:
      httpPort: 18080
      tolerations:
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
        - {key: node.cilium.io/agent-not-ready, operator: Exists, effect: NoSchedule}
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    probe:
      connectTimeoutSeconds: 5
      responseTimeoutSeconds: 12
      intervalSeconds: 15
      maxWorkers: 8
      userAgent: public-edge-manager/0.6.9
    candidateSelection:
      capacityWeight: 10
      localAreaBonus: 100000
      priorityWeight: 1
      latencyDivisorMs: 20
      latencyPenaltyCap: 50
      # DNS authorities must converge on the same exit; hosting DNS locally is
      # not evidence that the node has adequate public application bandwidth.
      localNodeBonus: 0
      # Preserve the elected public target through transient probe/state noise.
      # A replacement must be continuously ready before the DNS answer moves.
      failoverGraceSeconds: 300
      minReadySeconds: 120
      minHoldSeconds: 600
      resolverCidrs:
        CN: [192.0.2.52/24, 192.0.2.208/24, 192.0.2.174/24]
        US: [192.0.2.204/24, 192.0.2.89/24]
    # Require fresh measured path evidence independent of kubelet scheduling state.
    fabricEvidence:
      mode: Required
      apiGroup: networking.re8ch.com
      apiVersion: v1alpha2
      resource: networkpathassessments
      requireNodeReady: false
      allowedStates: [Ready, Partial]
    publication: {enabled: false, adapters: {}, refs: {}}
    rbac: {mutateIngresses: false}
    service: {type: ClusterIP, annotations: {}, externalTrafficPolicy: ""}
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
