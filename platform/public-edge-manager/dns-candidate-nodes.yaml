# External UDP and TCP 53 were verified on 2026-09-22 before admission.
# The scheduled PublicEdge authority probe continuously reports later failures.
apiVersion: v1
kind: Node
metadata:
  name: domain-ex
  labels:
    networking.re8ch.com/dns-authority-candidate: "true"
  annotations:
    networking.re8ch.com/dns-nameserver: ns-sh.re8ch.com.
    networking.re8ch.com/dns-region: cn-shanghai
---
