apiVersion: v1
kind: ServiceAccount
metadata: {name: git-workspace-controller, namespace: git-workspaces}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: git-workspace-controller, namespace: git-workspaces}
rules:
  - apiGroups: [governance.re8ch.com]
    resources: [gitaccounts, gitworkspaces, workcontracts, workevidences, ownerapprovals, projectcapabilities]
    verbs: [get, list, watch]
  - apiGroups: [governance.re8ch.com]
    resources: [gitaccounts/status, gitworkspaces/status, workcontracts/status, projectcapabilities/status]
    verbs: [get, patch, update]
  - apiGroups: [governance.re8ch.com]
    resources: [projectcapabilities]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: git-workspace-controller, namespace: git-workspaces}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: git-workspace-controller}
subjects: [{kind: ServiceAccount, name: git-workspace-controller, namespace: git-workspaces}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: git-workspace-controller, namespace: git-workspaces}
data:
  controller.py: |
    import json
    import ssl
    import time
    import urllib.request

    BASE = "https://kubernetes.default.svc"
    NS = "git-workspaces"
    GROUP = "governance.re8ch.com"
    VERSION = "v1alpha1"
    TOKEN = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    CONTEXT = ssl.create_default_context(cafile=CA)

    def request(path, method="GET", body=None, content_type="application/json"):
        with open(TOKEN, encoding="utf-8") as handle:
            token = handle.read().strip()
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(
            BASE + path,
            data=data,
            method=method,
            headers={"Authorization": "Bearer " + token, "Content-Type": content_type},
        )
        with urllib.request.urlopen(req, context=CONTEXT, timeout=10) as response:
            return json.load(response)

    def collection(plural):
        return f"/apis/{GROUP}/{VERSION}/namespaces/{NS}/{plural}"

    def items(plural):
        return request(collection(plural)).get("items", [])

    def patch_status(plural, item, status):
        name = item["metadata"]["name"]
        if item.get("status") == status:
            return
        request(
            f"{collection(plural)}/{name}/status",
            method="PATCH",
            body={"status": status},
            content_type="application/merge-patch+json",
        )

    def reconcile():
        accounts = {item["metadata"]["name"]: item for item in items("gitaccounts")}
        approvals = {}
        for item in items("ownerapprovals"):
            approvals.setdefault(item["spec"]["accountRef"], []).append(item)
        capabilities = {item["spec"]["accountRef"]: item for item in items("projectcapabilities")}
        for name, account in accounts.items():
            mailbox = (account.get("status") or {}).get("mailbox") or {}
            account_approvals = approvals.get(name, [])
            approval = account_approvals[0] if len(account_approvals) == 1 else None
            requested_username = ((account["spec"].get("providerIdentity") or {}).get("username") or "").lstrip("@")
            approved_username = (((approval or {}).get("spec") or {}).get("codeOwner") or {}).get("providerUsername", "").lstrip("@")
            approved = bool(
                approval
                and approval["spec"]["pullRequest"]["merged"]
                and requested_username
                and approved_username == requested_username
            )
            ready = mailbox.get("phase") == "Ready" and approved
            ownership = {
                "phase": "Ready" if ready else "AwaitingOwnerReview" if mailbox.get("phase") == "Ready" else "AwaitingMailbox",
                "identityCommit": approval["spec"]["identityCommit"] if approved else "",
                "approvalRef": approval["metadata"]["name"] if approved else "",
            }
            if (account.get("status") or {}).get("ownership") != ownership:
                request(
                    f"{collection('gitaccounts')}/{name}/status",
                    method="PATCH",
                    body={"status": {"ownership": ownership}},
                    content_type="application/merge-patch+json",
                )
            provider_identity = {"phase": "Pending"}
            if approved:
                provider_identity = {
                    "phase": "Verified",
                    "verifiedUsername": approved_username,
                    "verifiedAt": approval["spec"]["reviewedAt"],
                }
            if (account.get("status") or {}).get("providerIdentity") != provider_identity:
                request(
                    f"{collection('gitaccounts')}/{name}/status",
                    method="PATCH",
                    body={"status": {"providerIdentity": provider_identity}},
                    content_type="application/merge-patch+json",
                )
            capability = capabilities.get(name)
            if ready and capability is None:
                request(collection("projectcapabilities"), method="POST", body={
                    "apiVersion": f"{GROUP}/{VERSION}",
                    "kind": "ProjectCapability",
                    "metadata": {"name": name, "namespace": NS},
                    "spec": {
                        "accountRef": name,
                        "projectRef": account["spec"]["project"],
                        "capabilities": ["project-write", "origin-branch", "collaboration-read-write"],
                    },
                })
            elif not ready and capability is not None:
                request(f"{collection('projectcapabilities')}/{capability['metadata']['name']}", method="DELETE")
        workspaces = items("gitworkspaces")
        by_account = {}
        for workspace in workspaces:
            by_account.setdefault(workspace["spec"]["accountRef"], []).append(workspace)
        for account, group in by_account.items():
            conflict = len(group) != 1
            for workspace in group:
                account_valid = account in accounts and accounts[account]["spec"]["project"] == workspace["spec"]["projectRef"]
                phase = "Conflict" if conflict else ("Active" if account_valid else "Invalid")
                patch_status("gitworkspaces", workspace, {
                    "phase": phase,
                    "accountRef": account,
                    "reason": "OneActiveWorkspacePerAccount" if conflict else ("UniqueAccountWorkspace" if account_valid else "AccountProjectMismatch"),
                    "observedGeneration": workspace["metadata"].get("generation", 1),
                })

        evidence = items("workevidences")
        by_contract = {}
        for item in evidence:
            by_contract.setdefault(item["spec"]["contractRef"], []).append(item["spec"])
        for contract in items("workcontracts"):
            name = contract["metadata"]["name"]
            spec = contract["spec"]
            matching = [
                item for item in by_contract.get(name, [])
                if item["commit"] == spec["commit"] and item["repository"] == spec["repository"]
            ]
            rejected = {item["plane"] for item in matching if item["result"] == "Rejected"}
            verified = {item["plane"] for item in matching if item["result"] == "Verified"} - rejected
            required = set(spec["requiredEvidence"])
            evidence_ready = required <= verified
            pr = spec["pullRequest"]
            if pr["state"] == "closed":
                phase = "Completed" if pr["merged"] and evidence_ready else "EndedWithoutRuntimeVerification"
            elif rejected:
                phase = "Rejected"
            else:
                phase = "Verified" if evidence_ready else "Active"
            patch_status("workcontracts", contract, {
                "phase": phase,
                "verifiedCommit": spec["commit"] if evidence_ready else "",
                "verifiedPlanes": sorted(verified),
                "rejectedPlanes": sorted(rejected),
                "missingPlanes": sorted(required - verified),
                "observedGeneration": contract["metadata"].get("generation", 1),
            })

    while True:
        try:
            reconcile()
        except Exception as error:
            print(json.dumps({"event": "git-workspace-reconcile-error", "error": str(error)}), flush=True)
        time.sleep(15)
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: git-workspace-controller, namespace: git-workspaces}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: git-workspace-controller}}
  template:
    metadata: {labels: {app.kubernetes.io/name: git-workspace-controller}}
    spec:
      serviceAccountName: git-workspace-controller
      nodeSelector: {kubernetes.io/hostname: r640}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
          command: [python3, /runtime/controller.py]
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}]
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts: [{name: runtime, mountPath: /runtime, readOnly: true}]
      volumes: [{name: runtime, configMap: {name: git-workspace-controller}}]
