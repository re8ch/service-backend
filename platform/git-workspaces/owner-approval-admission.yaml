apiVersion: v1
kind: ServiceAccount
metadata: {name: owner-review-verifier, namespace: git-workspaces}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: owner-review-verifier, namespace: git-workspaces}
rules:
  - apiGroups: [governance.re8ch.com]
    resources: [ownerapprovals]
    verbs: [create, get, list, watch]
  - apiGroups: [governance.re8ch.com]
    resources: [gitaccounts, gitaccounts/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: owner-review-verifier, namespace: git-workspaces}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: owner-review-verifier}
subjects: [{kind: ServiceAccount, name: owner-review-verifier, namespace: git-workspaces}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: mailbox-provisioner, namespace: git-workspaces}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: mailbox-provisioner, namespace: git-workspaces}
rules:
  - apiGroups: [governance.re8ch.com]
    resources: [gitaccounts]
    verbs: [get, list, watch]
  - apiGroups: [governance.re8ch.com]
    resources: [gitaccounts/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: mailbox-provisioner, namespace: git-workspaces}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: mailbox-provisioner}
subjects: [{kind: ServiceAccount, name: mailbox-provisioner, namespace: git-workspaces}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: owner-approval-producer}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [governance.re8ch.com]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [ownerapprovals]
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':owner-review-verifier'"
      message: OwnerApproval may only be published by the Git provider review verifier.
    - expression: "object.spec.pullRequest.merged == true"
      message: OwnerApproval requires a merged identity pull request.
    - expression: "object.spec.reviewedBy != object.spec.codeOwner.providerUsername"
      message: The bot identity being added cannot approve itself.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: owner-approval-producer}
spec:
  policyName: owner-approval-producer
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: git-workspaces}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: project-capability-producer}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [governance.re8ch.com]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [projectcapabilities]
  validations:
    - expression: "request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':git-workspace-controller'"
      message: ProjectCapability is controller-owned and cannot be granted manually.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: project-capability-producer}
spec:
  policyName: project-capability-producer
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: git-workspaces}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: git-account-status-writers}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [governance.re8ch.com]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [gitaccounts/status]
  validations:
    - expression: "(has(object.status.mailbox) == has(oldObject.status.mailbox) && (!has(object.status.mailbox) || object.status.mailbox == oldObject.status.mailbox)) || request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':mailbox-provisioner'"
      message: Only mailbox-provisioner may change mailbox readiness.
    - expression: "(has(object.status.ownership) == has(oldObject.status.ownership) && (!has(object.status.ownership) || object.status.ownership == oldObject.status.ownership)) || request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':git-workspace-controller'"
      message: Only git-workspace-controller may reconcile ownership readiness.
    - expression: "(has(object.status.providerIdentity) == has(oldObject.status.providerIdentity) && (!has(object.status.providerIdentity) || object.status.providerIdentity == oldObject.status.providerIdentity)) || request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':git-workspace-controller'"
      message: Only git-workspace-controller may verify provider identity.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: git-account-status-writers}
spec:
  policyName: git-account-status-writers
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: git-workspaces}
