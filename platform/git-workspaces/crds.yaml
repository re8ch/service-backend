apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitaccounts.governance.re8ch.com
spec:
  group: governance.re8ch.com
  scope: Namespaced
  names: {plural: gitaccounts, singular: gitaccount, kind: GitAccount, shortNames: [gacct]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [email, provider, project, mailbox]
              properties:
                email: {type: string, pattern: '^[^@]+@phonaid\.com$'}
                provider: {type: string, enum: [github, gitlab]}
                project: {type: string}
                mailbox: {type: string, enum: [stalwart]}
                googleWorkspace: {type: string, enum: [eligible, requested, disabled]}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
