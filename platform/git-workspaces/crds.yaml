apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workevidences.governance.re8ch.com
spec:
  group: governance.re8ch.com
  scope: Namespaced
  names: {plural: workevidences, singular: workevidence, kind: WorkEvidence, shortNames: [wev]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [contractRef, repository, commit, plane, result, producerServiceAccount, observedAt, observations]
              x-kubernetes-validations:
                - rule: 'self == oldSelf'
                  message: WorkEvidence is immutable; publish a new evidence object.
              properties:
                contractRef: {type: string}
                repository: {type: string}
                commit: {type: string, pattern: '^[0-9a-f]{40}$'}
                plane: {type: string, enum: [monitoring, deploying, planning]}
                result: {type: string, enum: [Verified, Rejected]}
                producerServiceAccount: {type: string, pattern: '^(monitoring|deploying|planning)-evidence$'}
                observedAt: {type: string, format: date-time}
                observations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [apiVersion, kind, namespace, name, condition]
                    properties:
                      apiVersion: {type: string}
                      kind: {type: string}
                      namespace: {type: string}
                      name: {type: string}
                      condition: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workcontracts.governance.re8ch.com
spec:
  group: governance.re8ch.com
  scope: Namespaced
  names: {plural: workcontracts, singular: workcontract, kind: WorkContract, shortNames: [wcontract]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [workspaceRef, repository, commit, branch, pullRequest, requiredEvidence]
              properties:
                workspaceRef: {type: string}
                repository: {type: string}
                commit: {type: string, pattern: '^[0-9a-f]{40}$'}
                branch: {type: string}
                pullRequest:
                  type: object
                  required: [provider, url, number, state, merged]
                  properties:
                    provider: {type: string, enum: [github, gitlab]}
                    url: {type: string}
                    number: {type: integer, minimum: 1}
                    state: {type: string, enum: [open, closed]}
                    merged: {type: boolean}
                requiredEvidence:
                  type: array
                  minItems: 3
                  maxItems: 3
                  x-kubernetes-list-type: set
                  items: {type: string, enum: [monitoring, deploying, planning]}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
