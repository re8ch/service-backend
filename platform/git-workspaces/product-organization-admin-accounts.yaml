# Dedicated mailbox identities for the five RE8CH product organizations.
# These are Stalwart User accounts, not global mail administrators or GitHub grants.
apiVersion: governance.re8ch.com/v1alpha1
kind: GitAccount
metadata: {name: re8ch-image-admin, namespace: git-workspaces}
spec:
  email: re8ch-image-admin@phonaid.com
  displayName: RE8CH Image organization administrator
  provider: github
  project: re8ch-image
  mailbox: stalwart
  googleWorkspace: disabled
---
