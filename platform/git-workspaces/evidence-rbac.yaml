apiVersion: v1
kind: ServiceAccount
metadata: {name: monitoring-evidence, namespace: git-workspaces}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: deploying-evidence, namespace: git-workspaces}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: planning-evidence, namespace: git-workspaces}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: work-evidence-publisher, namespace: git-workspaces}
rules:
  - apiGroups: [governance.re8ch.com]
    resources: [workevidences]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: work-evidence-publishers, namespace: git-workspaces}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: work-evidence-publisher}
subjects:
  - {kind: ServiceAccount, name: monitoring-evidence, namespace: git-workspaces}
  - {kind: ServiceAccount, name: deploying-evidence, namespace: git-workspaces}
  - {kind: ServiceAccount, name: planning-evidence, namespace: git-workspaces}
