apiVersion: v1
kind: Namespace
metadata:
  name: tenant-qwen-runtime
  labels:
    tenancy.re8ch.com/tenant: qwen
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: qwen-runtime, namespace: tenant-qwen-runtime}
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    requests.storage: 2Ti
    persistentvolumeclaims: "32"
    pods: "64"
    services: "32"
---
apiVersion: v1
kind: LimitRange
metadata: {name: qwen-runtime, namespace: tenant-qwen-runtime}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "2", memory: 4Gi}
      max: {cpu: "8", memory: 32Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: tenant-qwen-runtime}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: qwen-tenant-runtime, namespace: toolhive-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: qwen-tenant-runtime, namespace: tenant-qwen-runtime}
rules:
  - {apiGroups: [apps], resources: [deployments, statefulsets], verbs: [get, list, watch, create, patch, update, delete]}
  - {apiGroups: [""], resources: [services, persistentvolumeclaims], verbs: [get, list, watch, create, patch, update, delete]}
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: qwen-tenant-runtime, namespace: tenant-qwen-runtime}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: qwen-tenant-runtime}
subjects: [{kind: ServiceAccount, name: qwen-tenant-runtime, namespace: toolhive-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "re8ch:qwen-tenant-runtime-impersonate"}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [qwen-tenant-runtime]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "re8ch:qwen-tenant-runtime-impersonate"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "re8ch:qwen-tenant-runtime-impersonate"}
subjects: [{kind: ServiceAccount, name: re8ch-plugin-runtime, namespace: toolhive-system}]
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata: {name: qwen-tenant-public, namespace: toolhive-system}
spec: {description: "Qwen-only image and database runtime tools."}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata: {name: qwen-tenant-runtime, namespace: toolhive-system}
spec:
  groupRef: {name: qwen-tenant-public}
  image: registry.re8ch.com/functions-shared/re8ch-plugin-runtime:0.1.2@sha256:0bea8e03f713181d4f497283941d232607c6377f175c7cd1f2ad16613b5d0c54
  replicas: 1
  backendReplicas: 1
  transport: streamable-http
  mcpPort: 8088
  proxyPort: 8080
  serviceAccount: re8ch-plugin-runtime
  env:
    - {name: LISTEN_PORT, value: "8088"}
    - {name: PLUGIN_DEFINITIONS_DIR, value: /etc/re8ch-plugins/definitions}
  audit: {enabled: true}
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts: [{name: definitions, mountPath: /etc/re8ch-plugins/definitions, readOnly: true}]
      volumes: [{name: definitions, configMap: {name: qwen-tenant-plugin-definition}}]
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata: {name: qwen-tenant-issuer, namespace: toolhive-system}
spec: {type: inline, inline: {issuer: https://dex.re8ch.com, clientId: re8ch-qwen-tenant}}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata: {name: qwen-tenant-vmcp, namespace: toolhive-system}
spec:
  groupRef: {name: qwen-tenant-public}
  replicas: 2
  podTemplateSpec:
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: qwen-tenant-issuer
      audience: re8ch-qwen-tenant
      resourceUrl: https://tools.re8ch.com/tenant/mcp
      scopes: [openid, profile, email, groups, offline_access]
    authzConfig:
      type: inline
      groupClaimName: groups
      inline:
        policies:
          - 'permit(principal == Client::"Cgg5OTcwMjE4NBIGZ2l0aHVi", action, resource);'
          - 'permit(principal in THVGroup::"re8ch:k8s-admins", action, resource);'
  outgoingAuth: {default: {type: discovered}}
  config:
    aggregation:
      tools: [{workload: qwen-tenant-runtime}]
    audit: {enabled: true, component: qwen-tenant-vmcp, includeRequestData: false, includeResponseData: false}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: qwen-tenant-mcp, namespace: toolhive-system}
spec:
  hostnames: [tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-https}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /tenant}}]
      backendRefs: [{name: vmcp-qwen-tenant-vmcp, port: 4483}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant}}]
      backendRefs: [{name: vmcp-qwen-tenant-vmcp, port: 4483}]
