apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runtime-anatomy
  namespace: flux-system
spec:
  interval: 1m
  timeout: 10m
  releaseName: runtime-anatomy
  targetNamespace: runtime-anatomy
  storageNamespace: runtime-anatomy
  chart:
    spec:
      chart: ./clusters/re8ch/charts/runtime-anatomy
      interval: 10m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: service-backend
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
  rollback:
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    scope:
      lifecycle: Canary
    provisioning:
      enabled: false
    retention:
      gcMode: DryRun
    canary:
      enabled: true
    observer:
      enabled: true
      nodeSelector:
        anatomy.re8ch.com/observer-allowed: "true"
