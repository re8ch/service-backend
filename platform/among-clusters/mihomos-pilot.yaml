apiVersion: v1
kind: Service
metadata:
  name: mihomos-byoc-egress
  namespace: egress-fabric
  labels:
    app.kubernetes.io/name: mihomos-byoc-egress
    app.kubernetes.io/part-of: mihomos-cluster
    peering.re8ch.com/advertise: "true"
  annotations:
    peering.re8ch.com/protocol: tcp
    peering.re8ch.com/service-class: network.egress.mihomo
    peering.re8ch.com/policy-ref: re8ch-mihomos-egress
    # Expanded by the Hub only to Ready, non-suspended Peers allowed by the
    # referenced matchAllReady policy. It is not an anonymous/public proxy.
    peering.re8ch.com/target-peers: "*"
    peering.re8ch.com/port-name: mixed
    peering.re8ch.com/ttl-seconds: "60"
spec:
  # Stable provider-internal VIP used only between the R640 Gateway and the
  # local Mihomos fabric. It is not an advertised/public endpoint.
  clusterIP: 10.43.252.214
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: mihomos-node-cn
  ports:
    - name: mixed
      port: 17891
      targetPort: mixed
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: among-clusters-gateway-mihomos-egress
  namespace: among-clusters
  annotations:
    re8ch.com/network-authority: public-mesh/inventory.json#r640.publicAuthority
    re8ch.com/r640-dummy-purpose: internal-host-endpoint-only-not-public
  labels:
    app.kubernetes.io/part-of: among-clusters
    app.kubernetes.io/component: mihomos-pilot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress-fabric
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mihomos-node-cn
        # The local Mihomos DaemonSet uses host networking, so Cilium evaluates
        # the R640 endpoint as a host identity. This is an internal ZeroTier
        # service address, never the public Gateway endpoint.
        - ipBlock:
            cidr: 10.181.22.128/32
        # Cilium may enforce egress before kube-proxy translates the Service
        # VIP to the host-network endpoint, so cover the exact stable VIP too.
        - ipBlock:
            cidr: 10.43.252.214/32
      ports:
        - protocol: TCP
          port: 17891
---
# Cilium classifies host-network backends as host/remote-node identities after
# Service translation. The CIDR rules above remain useful before translation;
# this identity-aware rule covers the post-translation datapath without opening
# any other destination port or selecting any other workload.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: among-clusters-gateway-mihomos-host-egress
  namespace: among-clusters
  labels:
    app.kubernetes.io/part-of: among-clusters
    app.kubernetes.io/component: mihomos-pilot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: among-clusters-gateway
  egress:
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "17891", protocol: TCP}
