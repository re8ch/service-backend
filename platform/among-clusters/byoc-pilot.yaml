apiVersion: v1
kind: Namespace
metadata:
  name: byoc-pilot
  labels:
    app.kubernetes.io/part-of: among-clusters
    peering.re8ch.com/tenant: byoc-pilot
---
apiVersion: peering.re8ch.com/v1alpha1
kind: Peer
metadata: {name: re8ch-qwen, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  localIdentityRef: re8ch
  remoteIdentityRef: qwen
  invitationRef: re8ch-qwen-pilot
  transports: [quic-mtls]
  suspended: false
---
apiVersion: peering.re8ch.com/v1alpha1
kind: Peer
metadata: {name: re8ch-artc, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  localIdentityRef: re8ch
  remoteIdentityRef: artc
  invitationRef: re8ch-artc-pilot
  transports: [quic-mtls]
  suspended: false
---
apiVersion: peering.re8ch.com/v1alpha1
kind: AuthenticatedLink
metadata: {name: re8ch-qwen, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerRef: re8ch-qwen
  transport: quic-mtls
  localGateway: quic://192.0.2.138:8443
  sessionIdentity: spiffe://re8ch.internal/cluster/re8ch
---
apiVersion: peering.re8ch.com/v1alpha1
kind: AuthenticatedLink
metadata: {name: re8ch-artc, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerRef: re8ch-artc
  transport: quic-mtls
  localGateway: quic://192.0.2.138:8443
  sessionIdentity: spiffe://re8ch.internal/cluster/re8ch
---
apiVersion: peering.re8ch.com/v1alpha1
kind: PeerPolicy
metadata: {name: qwen-kubernetes-api, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerSelector: {matchNames: [re8ch-qwen]}
  serviceClasses: [kubernetes.control-plane]
  protocols: [kubernetes-api]
  ports: [443]
  directions: [export]
  maxAdvertisements: 1
---
apiVersion: peering.re8ch.com/v1alpha1
kind: PeerPolicy
metadata: {name: artc-kubernetes-api, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerSelector: {matchNames: [re8ch-artc]}
  serviceClasses: [kubernetes.control-plane]
  protocols: [kubernetes-api]
  ports: [443]
  directions: [export]
  maxAdvertisements: 1
---
apiVersion: peering.re8ch.com/v1alpha1
kind: PeerPolicy
metadata: {name: re8ch-mihomos-egress, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  # Service access follows the authenticated Peer lifecycle. This does not
  # admit anonymous clients: the Hub expands only Ready, non-suspended Peers,
  # and the Gateway still requires a certificate from its peer trust bundle.
  peerSelector: {matchAllReady: true}
  serviceClasses: [network.egress.mihomo]
  protocols: [tcp]
  ports: [17891]
  directions: [export]
  maxAdvertisements: 1
---
apiVersion: peering.re8ch.com/v1alpha1
kind: ManagedAccessGrant
metadata: {name: qwen-headlamp-admin, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerRef: re8ch-qwen
  advertisementRef: qwen-default-kubernetes
  expiresAt: "2026-10-02T23:59:59Z"
  scope: Cluster
  rules:
    - {apiGroups: ["*"], resources: ["*"], verbs: ["*"]}
  approved: true
  revoked: false
---
apiVersion: peering.re8ch.com/v1alpha1
kind: ManagedAccessGrant
metadata: {name: artc-headlamp-admin, namespace: byoc-pilot, labels: {app.kubernetes.io/part-of: among-clusters}}
spec:
  peerRef: re8ch-artc
  advertisementRef: artc-default-kubernetes
  expiresAt: "2026-10-02T23:59:59Z"
  scope: Cluster
  rules:
    - {apiGroups: ["*"], resources: ["*"], verbs: ["*"]}
  approved: true
  revoked: false
