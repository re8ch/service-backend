apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: among-clusters-hub, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/re8ch/charts/among-clusters-hub
  ref:
    digest: sha256:43c9c89801afe04bbb97b89933606a086da34d5e9bb6507d1b89ef4653fc541b
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: among-clusters-hub, namespace: flux-system}
spec:
  interval: 10m
  releaseName: among-clusters-hub
  targetNamespace: among-clusters
  storageNamespace: among-clusters
  chartRef: {kind: OCIRepository, name: among-clusters-hub}
  install: {createNamespace: true, crds: CreateReplace, remediation: {retries: 0}}
  upgrade: {crds: CreateReplace, timeout: 15m, remediation: {retries: 0, remediateLastFailure: false}}
  values:
    image:
      repository: ghcr.io/re8ch/among-clusters
      # restricted-node-6dc3f140f9 is amd64. Pin the platform manifest rather than the attestation
      # index so containerd pulls an executable image deterministically.
      digest: sha256:36065d8d2335e0a447d24a0b07562c859b54cee1cfb1e824e536addfe2d6557a
    replicaCount: 1
    nodeSelector:
      kubernetes.io/os: linux
      scheduling.re8ch.com/service-plane: core
    adminTokenSecret: among-clusters-hub-admin
    managedAccess:
      enabled: true
      broker:
        hostname: among-clusters.re8ch.com
        namespace: credential-broker
    migration:
      # The one-time replacement completed with release v18. Keep destructive
      # migration disabled for every subsequent reconciliation.
      replaceCollaborationCRDs: false
    hostname: among-clusters.re8ch.com
    publication:
      bootstrapTarget: 192.0.2.79
      selectedEdge: loudi-r640
    onboarding:
      enabled: true
      publicEndpoint: https://among-clusters.service.re8ch.com
      tenant: byoc-pilot
      providerSPIFFEID: spiffe://re8ch.internal/cluster/re8ch
      providerBundleDigest: sha256:1c033ad2260b1064dd46705361dce35d1c47e8332864a88d239a90b5ffa557e8
      providerBundleSecret: among-clusters-agent-identity
      providerQUICEndpoint: quic://192.0.2.79:8443
      imageDigest: sha256:3a6b90956f55914d595a9e24d8382b1697a8ef0ad51a65e60b77faa76ed7b692
      chartVersion: 0.3.25
    ciliumPolicy: {enabled: true}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: among-clusters-agent, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/re8ch/charts/among-clusters-agent
  ref:
    digest: sha256:e546d8e9056a85b813488524282727a6135a0cc544f39d2dc5a8afe23bb042a3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: among-clusters-agent, namespace: flux-system}
spec:
  interval: 10m
  releaseName: among-clusters-agent
  targetNamespace: among-clusters
  storageNamespace: among-clusters
  chartRef: {kind: OCIRepository, name: among-clusters-agent}
  install: {createNamespace: false, remediation: {retries: 0}}
  upgrade: {timeout: 15m, remediation: {retries: 0, remediateLastFailure: false}}
  values:
    clusterID: re8ch
    tenant: byoc-pilot
    trustDomain: re8ch.internal
    hubEndpoint: https://among-clusters.service.re8ch.com
    # Preserve TLS/SNI and the public hostname contract while avoiding a
    # RouterOS public-IP hairpin from provider-side reconciliation traffic.
    # This is the Gateway Service ClusterIP, not a replacement authority.
    hostAliases:
      - ip: 192.0.2.67
        hostnames: [among-clusters.re8ch.com]
    image:
      repository: ghcr.io/re8ch/among-clusters
      digest: sha256:36065d8d2335e0a447d24a0b07562c859b54cee1cfb1e824e536addfe2d6557a
    nodeSelector: {kubernetes.io/os: linux, scheduling.re8ch.com/service-plane: core}
    apiServer:
      # Cilium may enforce before or after Service DNAT, so allow the stable
      # kubernetes Service IP and every current control-plane endpoint.
      cidrs: [192.0.2.52/32, 192.0.2.208/32, 192.0.2.183/32, 192.0.2.18/32]
      port: 6443
    # The chart's Kubernetes NetworkPolicy already constrains API, DNS, HTTPS
    # and QUIC. Its optional Cilium rule only allows kube-apiserver and causes
    # provider HTTPS to be L7-proxied into a default deny at the Gateway.
    ciliumPolicy: {enabled: false}
    peerConfirmations:
      - {peerRef: re8ch-qwen, bundleDigest: sha256:1ca3850085419fd4cb099a0922452e1c1d2ba044396fe64f920f63fd78123357}
      - {peerRef: re8ch-artc, bundleDigest: sha256:72dbab1a10af9585ff65e652c0a26240275f3a7cda3206d1aead6ebf5bf71a8e}
      - {peerRef: re8ch-sijie, bundleDigest: sha256:5b7c9a2eeb10e11420d73b2000e2e7b859003570a43131c3f2f63b2876e1990f}
    # BYOC peers originate sessions to the provider-owned public authority.
    # Their observations drive link status; restricted-node-6dc3f140f9 never dials customer-private nodes.
    linkObservations: []
    gateway:
      publicAuthority:
        ownership: provider
        sourceRef: operations/network/manifests/network/public-mesh/inventory.json#restricted-node-6dc3f140f9.publicAuthority
        publicIP: 192.0.2.79
        deliveryMode: mikrotik-ebgp-transit-dnat
        edgeType: RouterOS
        gatewayVIP: 192.0.2.209
        gatewayRef: kube-system/re8ch-gateway-canary
        routingAuthority: AdvancedFabric
        fallbackLanBackend: 192.0.2.97
        requiredForwardPorts: [25, 80, 443, 465, 587, 993, 4190]
      peerBundleSecret: among-clusters-peer-bundle
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      listener: {enabled: true, port: 8443, publicEndpoint: "quic://192.0.2.79:8443", hostPort: 8443}
      peerIdentities:
        re8ch-qwen: ["spiffe://qwen.byoc/cluster/qwen"]
        re8ch-artc: ["spiffe://artc.byoc/cluster/artc"]
        re8ch-sijie: ["spiffe://sijie.byoc/cluster/sijie"]
      imports:
        - name: qwen-k8s
          port: 22240
          listen: ":22240"
          serviceIdentity: spiffe://qwen.byoc/ns/default/service/kubernetes
          expectedSPIFFEID: spiffe://qwen.byoc/cluster/qwen
          sessionOnly: true
        - name: artc-k8s
          port: 23768
          listen: ":23768"
          serviceIdentity: spiffe://artc.byoc/ns/default/service/kubernetes
          expectedSPIFFEID: spiffe://artc.byoc/cluster/artc
          sessionOnly: true
    managedAccess: {enabled: false}
  postRenderers:
    - kustomize:
        patches:
          - target: {group: apps, version: v1, kind: Deployment, name: among-clusters-gateway}
            patch: |-
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: NoSchedule}
          - target: {group: networking.k8s.io, version: v1, kind: NetworkPolicy, name: among-clusters-agent}
            patch: |-
              # HTTPS is terminated by the Cilium Gateway. Selecting the
              # provider Agent for egress enforcement makes Envoy default-deny
              # these signed control messages before they reach the Hub.
              - op: remove
                path: /spec/egress
              - op: replace
                path: /spec/policyTypes
                value: [Ingress]
