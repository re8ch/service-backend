apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: among-clusters-hub, namespace: flux-system}
spec:
  interval: 10m
  provider: generic
  url: oci://ghcr.io/re8ch/charts/among-clusters-hub
  ref:
    digest: sha256:5be1a5a486f09a47bf731e22aa18a214c410fde71d403e413ae5de138308293b
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: among-clusters-hub, namespace: flux-system}
spec:
  interval: 10m
  releaseName: among-clusters-hub
  targetNamespace: among-clusters
  storageNamespace: among-clusters
  chartRef: {kind: OCIRepository, name: among-clusters-hub}
  install: {createNamespace: true, crds: CreateReplace, remediation: {retries: 3}}
  upgrade: {crds: CreateReplace, remediation: {retries: 3, strategy: rollback}}
  rollback: {cleanupOnFail: true}
  values:
    image:
      repository: ghcr.io/re8ch/among-clusters
      digest: sha256:62243ece247744fdb3e233caf8eddff7e660be8272836d397dc9cb1f70e79815
    adminTokenSecret: among-clusters-hub-admin
    managedAccess: {enabled: false}
    migration:
      # One reviewed migration only. A follow-up change turns this back off
      # after Flux confirms that the old CRDs were exported and replaced.
      replaceCollaborationCRDs: true
    hostname: among-clusters.re8ch.com
    publication:
      bootstrapTarget: 192.0.2.79
      selectedEdge: loudi-r640
    ciliumPolicy: {enabled: true}
