apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: among-clusters-credential-broker-auth-review
  labels:
    app.kubernetes.io/part-of: among-clusters
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: among-clusters-credential-broker-auth-review
  labels:
    app.kubernetes.io/part-of: among-clusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: among-clusters-credential-broker-auth-review
subjects:
  - kind: ServiceAccount
    name: among-clusters-credential-broker
    namespace: credential-broker
