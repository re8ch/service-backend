apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-bootstrap
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: false
  # Gate production on the installed operators. A transient upstream chart
  # index failure must remain visible on its HelmRepository without making
  # already healthy operators unavailable to dependent Kustomizations.
  healthChecks:
  - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: re8ch-kube-state-metrics, namespace: observability-system}
  - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: re8ch-opentelemetry-operator, namespace: observability-system}
  - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: victoria-metrics-operator, namespace: observability-system}
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-bootstrap
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-opencost-recovery
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-opencost-recovery
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-production
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  path: ./
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
  - name: observability-bootstrap
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-production
  decryption:
    provider: sops
    secretRef:
      name: sops-age
