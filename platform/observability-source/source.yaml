apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-bootstrap
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-opencost-recovery
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-opencost-recovery
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-production
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
  - name: observability-bootstrap
  sourceRef:
    kind: OCIRepository
    name: domain-platform-observability-production
  decryption:
    provider: sops
    secretRef:
      name: sops-age
