apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloud-functions
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/re8ch/cloud-functions.git
  ref:
    branch: master
  verify:
    mode: HEAD
    secretRef:
      name: service-backend-verification-keys
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  path: ./manifests/k3s/observability/bootstrap
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: cloud-functions
---
# Production stays explicitly suspended until Ceph has no unfound objects and
# the operator bootstrap has completed. This is the cutover safety gate.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-production
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./manifests/k3s/observability/production
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
    - name: observability-bootstrap
  sourceRef:
    kind: GitRepository
    name: cloud-functions
