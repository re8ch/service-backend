apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/observability/bootstrap
  prune: false
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: service-backend
---
# Production stays explicitly suspended until Ceph has no unfound objects and
# the operator bootstrap has completed. This is the cutover safety gate.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-production
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  path: ./platform/observability/production
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
    - name: observability-bootstrap
  sourceRef:
    kind: GitRepository
    name: service-backend
