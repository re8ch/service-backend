apiVersion: batch/v1
kind: Job
metadata:
  # Jobs have immutable PodTemplates. Bump the generation whenever the
  # bootstrap contract changes so Flux creates a replacement instead of
  # attempting an impossible in-place patch.
  name: hyperswitch-bootstrap-admin-v12
  namespace: payments
  labels:
    app.kubernetes.io/name: hyperswitch
    app.kubernetes.io/component: bootstrap-admin
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperswitch
        app.kubernetes.io/component: bootstrap-admin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-6dc3f140f9]
      initContainers:
        - name: seed-default-auth-method
          image: docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r18
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [/bin/bash, -ec]
          args:
            - |
              until pg_isready -h pg-re8ch-primary.pigsty-external.svc.cluster.local -p 5432 -U hyperswitch_migrator; do
                sleep 5
              done
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -v ON_ERROR_STOP=1 \
                -h pg-re8ch-primary.pigsty-external.svc.cluster.local -p 5432 \
                -U hyperswitch_migrator -d hyperswitch <<'SQL'
              INSERT INTO user_authentication_methods
                (id, auth_id, owner_id, owner_type, auth_type, private_config,
                 public_config, allow_signup, created_at, last_modified_at, email_domain)
              VALUES
                ('hyperswitch_default', 'hyperswitch', 'hyperswitch', 'tenant',
                 'password', NULL, NULL, TRUE, now(), now(), 'hyperswitch')
              ON CONFLICT (id) DO UPDATE SET
                auth_id = EXCLUDED.auth_id,
                owner_id = EXCLUDED.owner_id,
                owner_type = EXCLUDED.owner_type,
                auth_type = EXCLUDED.auth_type,
                allow_signup = EXCLUDED.allow_signup,
                last_modified_at = now(),
                email_domain = EXCLUDED.email_domain;
              SQL
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-pigsty-credentials
                  key: primaryPassword
      containers:
        - name: create-admin
          image: docker.io/curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -ec]
          args:
            - |
              base_url="http://${HYPERSWITCH_HYPERSWITCH_SERVER_SERVICE_HOST}:${HYPERSWITCH_HYPERSWITCH_SERVER_SERVICE_PORT}"
              until curl --fail --silent --show-error "$base_url/health" >/dev/null; do
                sleep 5
              done
              merchant_payload=$(printf '{"merchant_id":"%s","merchant_name":"%s","return_url":"%s","primary_business_details":[{"country":"US","business":"default"}]}' \
                "$MERCHANT_ID" "$MERCHANT_NAME" "$RETURN_URL")
              merchant_status=$(curl --silent --show-error -o /tmp/merchant-response -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                -H "api-key: $ADMIN_API_KEY" \
                -d "$merchant_payload" "$base_url/accounts")
              case "$merchant_status" in
                2*) ;;
                400)
                  grep -qi 'already exists' /tmp/merchant-response
                  ;;
                *)
                  echo "merchant bootstrap failed with HTTP $merchant_status" >&2
                  exit 1
                  ;;
              esac
              payload=$(printf '{"email":"%s","password":"%s"}' "$ADMIN_EMAIL" "$ADMIN_PASSWORD")
              if curl --fail --silent --show-error \
                -H 'Content-Type: application/json' \
                -H "api-key: $ADMIN_API_KEY" \
                -d "$payload" "$base_url/user/signin" >/dev/null; then
                exit 0
              fi
              create_payload=$(printf '{"name":"RE8CH Administrator","email":"%s","password":"%s"}' "$ADMIN_EMAIL" "$ADMIN_PASSWORD")
              curl --fail --silent --show-error \
                -H 'Content-Type: application/json' \
                -H "api-key: $ADMIN_API_KEY" \
                -d "$create_payload" "$base_url/user/tenant_signup" >/dev/null
              # TOTP is deliberately completed by the administrator in Control
              # Center: its one-time seed and verification code must never be
              # emitted by a Kubernetes Job or stored in GitOps logs.
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-hyperswitch-secrets
                  key: ROUTER__SECRETS__ADMIN_API_KEY
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-bootstrap-admin
                  key: email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hyperswitch-bootstrap-admin
                  key: password
            - name: MERCHANT_ID
              value: re8ch
            - name: MERCHANT_NAME
              value: RE8CH
            - name: RETURN_URL
              value: https://pay.service.re8ch.com
