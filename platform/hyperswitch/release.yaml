apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hyperswitch
  namespace: flux-system
spec:
  interval: 3m
  url: https://juspay.github.io/hyperswitch-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hyperswitch
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  timeout: 10m
  releaseName: hyperswitch
  targetNamespace: payments
  storageNamespace: payments
  chart:
    spec:
      chart: hyperswitch-stack
      version: 0.2.26
      sourceRef:
        kind: HelmRepository
        name: hyperswitch
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    # The parent chart hooks only report install/upgrade telemetry to Scarf and
    # require root to install packages at runtime. Database initialization is
    # handled by the chart workloads and our Restricted-compatible schema Job.
    disableHooks: true
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableHooks: true
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hyperswitch-hyperswitch-server
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hyperswitch-hyperswitch-server
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
                template:
                  spec:
                    imagePullSecrets:
                      - name: harbor-hyperswitch-admin
                    containers:
                      - name: hyperswitch-router
                        image: registry.re8ch.com/hyperswitch/hyperswitch-router@sha256:10a106c6a144633613529959a6a2f5edcd54fd5786e1ca3e722e27d87c958eb6
                        env:
                          - name: ROUTER__ANALYTICS__CLICKHOUSE__PASSWORD
                            $patch: delete
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hyperswitch-superposition
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hyperswitch-superposition
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
                template:
                  spec:
                    containers:
                      - name: superposition
                        env:
                          - name: DB_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: hyperswitch-pigsty-credentials
                                key: DB_PASSWORD
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: hyperswitch-control-center
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hyperswitch-control-center
              spec:
                strategy:
                  type: RollingUpdate
                  rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
          # Inventory the Redis owner without changing its Pod template. This
          # records placement governance now and avoids a needless StatefulSet
          # restart before its durable worker destination is reviewed.
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: hyperswitch-redis-master
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: hyperswitch-redis-master
                labels:
                  scheduling.re8ch.com/placement-managed: "true"
  valuesFrom:
    - kind: Secret
      name: hyperswitch-runtime-values
      valuesKey: values.yaml
  values:
    global:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
    hyperswitch-web:
      enabled: false
      autoBuild: {enable: false, forceBuild: false}
      ingress: {enabled: false}
    hyperswitch-control-center:
      enabled: true
      dependencies:
        router: {host: "https://pay-api.service.re8ch.com"}
        clickhouse: {enabled: false}
      ingress: {enabled: false}
      config:
        default:
          features:
            email: "false"
            totp: "true"
            sample_data: "false"
            test_processors: "true"
            is_live_mode: "false"
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
    hyperswitch-monitoring:
      enabled: false
    hyperswitch-ucs:
      enabled: false
    hyperswitch-app:
      # Required by router releases >= v1.124. The stack chart also installs
      # the schema migration/alias that its otherwise-empty database needs.
      superpositionFallback:
        enabled: true
        source: configMap
        configMap: hyperswitch-superposition-seed
        key: superposition_seed.toml
      superpositionDB:
        enable: true
        aliasService: superposition-db
        migration: {enable: false}
      postgresql:
        enabled: false
      externalPostgresql:
        enabled: true
        primary:
          host: "pg-re8ch-primary.pigsty-external.svc.cluster.local"
          auth:
            username: hyperswitch_migrator
            database: hyperswitch
            password:
              _secretRef:
                name: hyperswitch-pigsty-credentials
                key: primaryPassword
            plainpassword:
              _secretRef:
                name: hyperswitch-pigsty-credentials
                key: primaryPlainPassword
        readOnly:
          # The chart requires a read pool, but this deployment has no separate
          # read replica. Reuse the proven primary endpoint and credential so
          # auth-method discovery cannot strand Router on an unavailable pool.
          enabled: true
          host: "pg-re8ch-primary.pigsty-external.svc.cluster.local"
          auth:
            username: hyperswitch_migrator
            database: hyperswitch
            password:
              _secretRef:
                name: hyperswitch-pigsty-credentials
                key: primaryPassword
      redis:
        master:
          persistence:
            storageClass: rbd-r640
      superposition:
        enabled: true
        replicaCount: 1
        configs:
          # Use the concrete in-namespace Service FQDN. The compatibility
          # ExternalName alias is not resolvable on every cluster DNS path.
          db_host: "pg-re8ch-primary.pigsty-external.svc.cluster.local:5432"
          db_name: hyperswitch
          db_user: hyperswitch_migrator
          rust_log: info
          # This release is explicitly sandbox-only. In PROD, Superposition
          # requires an external KMS and treats DB_PASSWORD as ciphertext;
          # DEV consumes the SOPS-protected database password directly.
          app_env: DEV
          auth_provider: DISABLED
          auth_z_provider: DISABLED
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
      server:
        run_env: sandbox
        ingress: {enabled: false}
        configs:
          # Router v1.126 reads `origins`; the chart's legacy `origin` default
          # is ignored by the binary and causes validation to fail at startup.
          cors:
            wildcard_origin: false
            origins: "https://pay.service.re8ch.com,https://api.re8ch.com"
          analytics:
            source: sqlx
            forex_enabled: false
          connectors:
            # Alipay offers a real developer sandbox; this release remains
            # sandbox-only until the enterprise application is certified.
            alipaycn:
              base_url: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
            # WeChat Pay API v3 has no equivalent general-purpose sandbox.
            # Signed fixtures cover the connector until a merchant smoke test.
            wechatpaycn:
              base_url: "https://api.mch.weixin.qq.com"
          superposition:
            backup_file_path: "/local/config/superposition/superposition_seed.toml"
      services:
        consumer: {enabled: false}
        producer: {enabled: false}
        drainer: {enabled: false}
      hyperswitch-card-vault:
        enabled: false
      hyperswitch-ucs:
        enabled: false
      kafka: {enabled: false}
      clickhouse: {enabled: false}
      mailhog: {enabled: false}
      vector: {enabled: false}
