apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hyperswitch
  namespace: flux-system
spec:
  interval: 30m
  url: https://juspay.github.io/hyperswitch-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hyperswitch
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  timeout: 10m
  releaseName: hyperswitch
  targetNamespace: payments
  storageNamespace: payments
  chart:
    spec:
      chart: hyperswitch-stack
      version: 0.2.26
      sourceRef:
        kind: HelmRepository
        name: hyperswitch
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  # The upstream pre-install Job does not declare a Restricted-compatible
  # security context. Harden it after Helm renders the chart so it can run in
  # the payments namespace without weakening namespace Pod Security.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Job
              name: prestart-hook
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: prestart-hook
              spec:
                template:
                  spec:
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: prestart-hook
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: [ALL]
  valuesFrom:
    - kind: Secret
      name: hyperswitch-runtime-values
      valuesKey: values.yaml
  values:
    global:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-6dc3f140f9]}
    hyperswitch-web:
      enabled: false
      autoBuild: {enable: false, forceBuild: false}
      ingress: {enabled: false}
    hyperswitch-control-center:
      enabled: true
      dependencies:
        router: {host: "https://pay-api.re8ch.com"}
        clickhouse: {enabled: false}
      ingress: {enabled: false}
      config:
        default:
          features:
            email: "false"
            totp: "true"
            sample_data: "false"
            test_processors: "true"
            is_live_mode: "false"
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
    hyperswitch-monitoring:
      enabled: false
    hyperswitch-app:
      # Required by router releases >= v1.124. The stack chart also installs
      # the schema migration/alias that its otherwise-empty database needs.
      superpositionFallback:
        enabled: true
        source: configMap
        configMap: hyperswitch-superposition-seed
        key: superposition_seed.toml
      superpositionDB:
        enable: true
        aliasService: superposition-db
        migration: {enable: false}
      superposition:
        enabled: true
        replicaCount: 1
        configs:
          db_host: "superposition-db:5432"
          db_name: hyperswitch
          db_user: hyperswitch
          rust_log: info
          app_env: PROD
          auth_provider: DISABLED
          auth_z_provider: DISABLED
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
      server:
        run_env: sandbox
        ingress: {enabled: false}
        configs:
          cors: {wildcard_origin: false, origin: "https://api.re8ch.com"}
          analytics: {source: sqlx, forex_enabled: false}
      services:
        consumer: {enabled: false}
        producer: {enabled: false}
        drainer: {enabled: false}
      hyperswitch-card-vault:
        enabled: false
      hyperswitch-ucs:
        enabled: false
      kafka: {enabled: false}
      clickhouse: {enabled: false}
      mailhog: {enabled: false}
      vector: {enabled: false}
