# The retired runtime's 32-byte key remains directly on R640 and backed up
# outside Git. Keep only the Retain PV as the reactivation record; the bound PVC
# is intentionally absent while HyperSwitch is retired.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hyperswitch-superposition-local-key-r640
spec:
  capacity:
    storage: 1Mi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-r640
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [r640]
  hostPath:
    path: /var/lib/re8ch/hyperswitch-local-key
    type: Directory
