apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperswitch-control-center-public
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: pay-ui-https}
  hostnames: [pay.service.re8ch.com]
  rules:
    - backendRefs: [{name: hyperswitch-control-center, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperswitch-router-public
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: pay-api-https}
  hostnames: [pay-api.service.re8ch.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs: [{name: nuclio-payment-registry-api, port: 8080}]
    - backendRefs: [{name: hyperswitch-hyperswitch-server, port: 80}]
