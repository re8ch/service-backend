apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperswitch-control-center-public
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: pay-ui-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: pay-ui-https}
  hostnames: [pay.re8ch.com]
  rules:
    - backendRefs: [{name: hyperswitch-control-center, port: 9000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperswitch-router-public
  namespace: payments
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-loudi, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-guangzhou, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-shanghai, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-hangzhou-nuclio, namespace: kube-system, sectionName: pay-api-https}
    - {name: re8ch-region-shanghai-nuclio, namespace: kube-system, sectionName: pay-api-https}
  hostnames: [pay-api.re8ch.com]
  rules:
    - backendRefs: [{name: hyperswitch-hyperswitch-server, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyperswitch-public-dns-authority
  namespace: payments
  labels:
    networking.re8ch.com/dns-authority: public-edge
  annotations:
    networking.re8ch.com/dns-authority: public-edge
    networking.re8ch.com/selected-public-edge: restricted-node-6dc3f140f9
    external-dns.alpha.kubernetes.io/hostname: pay.re8ch.com,pay-api.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  # DNS authority only. Public TLS terminates on the Cilium Gateways above.
  ingressClassName: external-dns-only
  rules:
    - host: pay.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hyperswitch-control-center, port: {number: 9000}}}
    - host: pay-api.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: hyperswitch-hyperswitch-server, port: {number: 80}}}
