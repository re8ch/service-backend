apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: re8ch-payments
    # The pinned upstream chart does not yet satisfy Restricted for its main
    # workloads. Baseline keeps privileged/host access blocked while allowing
    # the vendor images to start; our bootstrap Jobs remain Restricted-ready.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
