apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: opencost-kube-state-metrics
  namespace: observability-system
  labels: {observability.re8ch.com/opencost-recovery: "true"}
spec:
  namespaceSelector: {matchNames: [observability-system]}
  selector: {matchLabels: {app.kubernetes.io/instance: re8ch-kube-state-metrics}}
  endpoints:
    - {port: http, interval: 30s, scrapeTimeout: 10s}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: opencost-kubelet
  namespace: observability-system
  labels: {observability.re8ch.com/opencost-recovery: "true"}
spec:
  selector: {}
  scheme: https
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  tlsConfig: {insecureSkipVerify: true}
  relabelConfigs:
    - {sourceLabels: [__meta_kubernetes_node_name], targetLabel: node}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cilium-envoy-gateway
  namespace: observability-system
  labels:
    observability.re8ch.com/managed: "true"
    observability.re8ch.com/opencost-recovery: "true"
spec:
  namespaceSelector: {matchNames: [kube-system]}
  selector: {matchLabels: {k8s-app: cilium-envoy}}
  podMetricsEndpoints:
    - targetPort: 9964
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelConfigs:
        - {sourceLabels: [__meta_kubernetes_pod_node_name], targetLabel: node}
        - {targetLabel: service, replacement: cilium-envoy-gateway}
        - {targetLabel: signal_domain, replacement: network}
      metricRelabelConfigs:
        - action: keep
          sourceLabels: [__name__]
          # Cilium Envoy exposes HTTP manager and listener-specific TCP
          # downstream receive counters. Upstream-response and buffered-byte
          # families are intentionally excluded so ingress is not double-counted.
          regex: envoy_(http_downstream_cx_rx_bytes_total|tcp_.+_downstream_cx_rx_bytes_total|listener_downstream_cx_rx_bytes_total)
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: advanced-fabric-node-measurements
  namespace: observability-system
  labels: {observability.re8ch.com/opencost-recovery: "true", observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [kube-system]}
  selector:
    matchLabels:
      app.kubernetes.io/name: advanced-fabric-node-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelConfigs:
        - action: keep
          sourceLabels: [__name__]
          regex: advanced_fabric_(measurement_state|observable|structural_evidence_coverage|tracking_ready)
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: opencost-kubelet-cadvisor
  namespace: observability-system
  labels: {observability.re8ch.com/opencost-recovery: "true"}
spec:
  selector: {}
  scheme: https
  interval: 30s
  scrapeTimeout: 15s
  path: /metrics/cadvisor
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  tlsConfig: {insecureSkipVerify: true}
  relabelConfigs:
    - {sourceLabels: [__meta_kubernetes_node_name], targetLabel: node}
