apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tenant-usage-closure
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
spec:
  groups:
    - name: tenant-usage-closure
      rules:
        - alert: OpenCostUnavailable
          expr: birfucate_dependency_up{dependency="opencost"} == 0
          for: 10m
          labels: {severity: warning, owner: platform-observability}
          annotations:
            summary: OpenCost allocation API is unavailable to Bifurcate
        - alert: BifurcateCollectionDelayed
          expr: time() - birfucate_last_success_unixtime > 600
          for: 10m
          labels: {severity: critical, owner: platform-finops}
          annotations:
            summary: Tenant usage collection is more than ten minutes behind
        - alert: BifurcateAttributionSamplesDropped
          expr: increase(birfucate_dropped_samples_total[15m]) > 0
          for: 5m
          labels: {severity: warning, owner: platform-finops}
          annotations:
            summary: Usage samples were discarded because attribution was incomplete
        - alert: BifurcateUsageSinkFailing
          expr: increase(birfucate_sink_failures_total[15m]) > 0
          for: 5m
          labels: {severity: critical, owner: platform-finops}
          annotations:
            summary: Usage outbox delivery is failing and awaiting replay
