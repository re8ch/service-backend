apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: example-service-routing
  namespace: example
  labels: {observability.re8ch.com/managed: "true"}
  annotations:
    observability.re8ch.com/owner: example-team
    observability.re8ch.com/receiver-metadata: example-service-receiver
spec:
  route:
    receiver: example-service-receiver
    group_by: [service, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 2h
    matchers:
      - service = "example-api"
  receivers:
    - name: example-service-receiver
      webhook_configs:
        - urlSecret:
            name: example-monitoring-receiver
            key: url
          send_resolved: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-service-receiver-metadata
  namespace: example
data:
  receivers.json: |
    {"example-service-receiver":{"owner":"example-team","kind":"webhook","failure_domain":"provider-example","facts":["provider_accepted"]}}
