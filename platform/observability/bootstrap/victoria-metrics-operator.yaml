apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: observability-system
spec:
  interval: 1h
  timeout: 5m
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: observability-system
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.67.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: observability-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      plain: false
      cleanup:
        enabled: false
    operator:
      disable_prometheus_converter: true
    admissionWebhooks:
      enabled: true
    # restricted-node-6dc3f140f9 is the durable admission/control-plane anchor. A second replica on
    # the same machine does not add failure-domain redundancy and previously
    # left every Helm upgrade waiting on an unschedulable Pod.
    replicaCount: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    podDisruptionBudget:
      enabled: false
    # The in-cluster Service VIP is degraded on cross-site paths. Use the
    # health-owned control-plane anycast VIP without placing workloads on A1/B1.
    env:
      - name: KUBERNETES_SERVICE_HOST
        value: "192.0.2.220"
      - name: KUBERNETES_SERVICE_PORT
        value: "6443"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
        effect: NoSchedule
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [restricted-node-6dc3f140f9]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 1, memory: 512Mi}
