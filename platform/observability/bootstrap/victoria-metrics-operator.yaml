apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: observability-system
spec:
  interval: 1h
  timeout: 5m
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: observability-system
spec:
  interval: 30m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: victoria-metrics-operator
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: victoria-metrics-operator
              spec:
                template:
                  spec:
                    containers:
                      - name: operator
                        env:
                          - name: KUBERNETES_SERVICE_HOST
                            valueFrom:
                              fieldRef:
                                fieldPath: status.hostIP
                          - name: KUBERNETES_SERVICE_PORT
                            value: "6443"
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.67.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: observability-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      plain: false
      cleanup:
        enabled: false
    operator:
      disable_prometheus_converter: true
    admissionWebhooks:
      enabled: true
    replicaCount: 2
    # Required pod anti-affinity needs one old replica removed before its
    # replacement can occupy the same two-node control-plane pool.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
        effect: NoSchedule
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: victoria-metrics-operator
            topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  # Admission is a cluster-wide dependency. Keep replicas on
                  # independent control-plane nodes so status.hostIP resolves
                  # to a local Kubernetes API endpoint for each pod.
                  values: [restricted-node-6dc3f140f9, restricted-node-1eb0570f74]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 1, memory: 512Mi}
