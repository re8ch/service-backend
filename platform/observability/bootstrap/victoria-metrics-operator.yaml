apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: observability-system
spec:
  interval: 1h
  timeout: 5m
  url: https://victoriametrics.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: observability-system
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.67.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: observability-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      plain: false
      cleanup:
        enabled: false
    operator:
      disable_prometheus_converter: true
    admissionWebhooks:
      enabled: true
    replicaCount: 2
    # Required pod anti-affinity needs one old replica removed before its
    # replacement can occupy the same two-node control-plane pool.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # The in-cluster Service VIP is degraded on cross-site paths. Use the
    # health-owned control-plane anycast VIP without placing workloads on A1/B1.
    env:
      - name: KUBERNETES_SERVICE_HOST
        value: "192.0.2.220"
      - name: KUBERNETES_SERVICE_PORT
        value: "6443"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Equal
        value: "true"
        effect: NoSchedule
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: victoria-metrics-operator
            topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  # Admission is a cluster-wide dependency. Keep its replicas
                  # on independently scheduled nodes whose pod routes are
                  # verified reachable from the control plane; domain-ex and
                  # suxunji are excluded while their webhook pod routes are
                  # degraded.
                  values: [restricted-node-6dc3f140f9, zan]
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 1, memory: 512Mi}
