apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability-system
spec:
  interval: 1h
  timeout: 5m
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: re8ch-kube-state-metrics
  namespace: observability-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability-system
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3, remediateLastFailure: true}}
  values:
    fullnameOverride: re8ch-kube-state-metrics
    # Bootstrap must remain schedulable while A1/B1 are Cilium-tainted.
    replicas: 1
    # Required anti-affinity from the previous revision otherwise deadlocks a
    # one-replica RollingUpdate on the only currently schedulable node.
    updateStrategy: Recreate
    nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
    customLabels:
      observability.re8ch.com/component: inventory
    collectors:
      - cronjobs
      - daemonsets
      - deployments
      - endpointslices
      - horizontalpodautoscalers
      - ingresses
      - jobs
      - leases
      - namespaces
      - networkpolicies
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - poddisruptionbudgets
      - pods
      - replicasets
      - replicationcontrollers
      - resourcequotas
      - services
      - statefulsets
      - storageclasses
      - volumeattachments
    metricLabelsAllowlist:
      - nodes=[topology.kubernetes.io/region,topology.kubernetes.io/zone,node-role.kubernetes.io/control-plane,pigsty.cc/workload]
      - pods=[app.kubernetes.io/name,app.kubernetes.io/component,app.kubernetes.io/instance,observability.re8ch.com/tier]
      - services=[app.kubernetes.io/name,app.kubernetes.io/component,observability.re8ch.com/tier,observability.re8ch.com/scrape]
      - persistentvolumeclaims=[app.kubernetes.io/name,app.kubernetes.io/component]
    metricAnnotationsAllowList:
      - services=[observability.re8ch.com/owner,observability.re8ch.com/runbook,observability.re8ch.com/metrics-doc,observability.re8ch.com/slo]
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
