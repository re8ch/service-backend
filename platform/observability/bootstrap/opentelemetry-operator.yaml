apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: observability-system
spec:
  interval: 1h
  timeout: 5m
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: re8ch-opentelemetry-operator
  namespace: observability-system
spec:
  interval: 30m
  releaseName: otel-operator
  targetNamespace: opentelemetry-operator
  chart:
    spec:
      chart: opentelemetry-operator
      version: 0.115.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: observability-system
  install: {remediation: {retries: 3}}
  upgrade: {remediation: {retries: 3, remediateLastFailure: true}}
  values:
    replicaCount: 2
    fullnameOverride: otel-operator-opentelemetry-operator
    pdb: {create: true, minAvailable: 1}
    manager:
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
        tag: 0.153.0
      resources:
        requests: {cpu: 25m, memory: 96Mi}
        limits: {cpu: 150m, memory: 192Mi}
      leaderElection: {enabled: true}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb, restricted-node-6dc3f140f9]}
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app.kubernetes.io/name: opentelemetry-operator}}
            topologyKey: kubernetes.io/hostname
