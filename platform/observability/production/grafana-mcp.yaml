apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: observability-system
  labels: {app.kubernetes.io/name: grafana-mcp, app.kubernetes.io/part-of: re8ch-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: grafana-mcp}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana-mcp, app.kubernetes.io/part-of: re8ch-observability}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: mcp
          image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
          args: [-t, streamable-http, --disable-write, --usage-stats=disabled, "--allowed-hosts=grafana-mcp.observability-system.svc.cluster.local:8000,grafana-mcp.observability-system.svc:8000,grafana-mcp:8000"]
          ports: [{name: mcp, containerPort: 8000}]
          env:
            - {name: GRAFANA_URL, value: http://re8ch-grafana.observability-system.svc.cluster.local:3000}
            - {name: GRAFANA_USERNAME, valueFrom: {secretKeyRef: {name: re8ch-grafana-admin, key: user}}}
            - {name: GRAFANA_PASSWORD, valueFrom: {secretKeyRef: {name: re8ch-grafana-admin, key: password}}}
            - {name: DO_NOT_TRACK, value: "1"}
          readinessProbe: {tcpSocket: {port: mcp}, initialDelaySeconds: 3, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {tcpSocket: {port: mcp}, initialDelaySeconds: 10, periodSeconds: 20, timeoutSeconds: 3}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana-mcp, namespace: observability-system}
spec: {selector: {app.kubernetes.io/name: grafana-mcp}, ports: [{name: mcp, port: 8000, targetPort: mcp}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: grafana-mcp, namespace: observability-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana-mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: tenant-infrastructure}}
          podSelector: {matchLabels: {app: tenant-api}}
      ports: [{protocol: TCP, port: 8000}]
