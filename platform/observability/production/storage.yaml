apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: re8ch-metrics
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
spec:
  retentionPeriod: "90d"
  vmstorage:
    replicaCount: 1
    nodeSelector: {kubernetes.io/hostname: r640}
    extraArgs: {dedup.minScrapeInterval: 15s}
    storageDataPath: /vm-data
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rbd-r640
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Gi}}
    resources:
      requests: {cpu: "2", memory: 4Gi}
      limits: {cpu: "2", memory: 4Gi}
  vmselect:
    # Cross-node PodCIDR access to the single R640 VMStorage is currently
    # unavailable. Keep query traffic colocated until the fabric repair is
    # independently verified; the storage PVC and data remain unchanged.
    replicaCount: 1
    nodeSelector: {kubernetes.io/hostname: r640}
    extraArgs: {dedup.minScrapeInterval: 15s}
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 2Gi}
  vminsert:
    replicaCount: 1
    nodeSelector: {kubernetes.io/hostname: r640}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: re8ch-analytics
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
spec:
  retentionPeriod: "180d"
  nodeSelector: {kubernetes.io/hostname: r640}
  storage:
    accessModes: [ReadWriteOnce]
    storageClassName: rbd-r640
    resources: {requests: {storage: 50Gi}}
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "2", memory: 4Gi}
---
apiVersion: operator.victoriametrics.com/v1
kind: VTCluster
metadata:
  name: re8ch-traces
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
spec:
  insert:
    replicaCount: 2
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt, b1-wsl-zt, r640]}
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector: {matchLabels: {app.kubernetes.io/component: vtinsert}}
              topologyKey: kubernetes.io/hostname
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  select:
    replicaCount: 2
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: kubernetes.io/hostname, operator: In, values: [a1-wsl-zt, b1-wsl-zt, r640]}
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector: {matchLabels: {app.kubernetes.io/component: vtselect}}
              topologyKey: kubernetes.io/hostname
    tolerations:
      - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 1Gi}
  storage:
    replicaCount: 1
    retentionPeriod: "30d"
    nodeSelector: {kubernetes.io/hostname: r640}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rbd-r640
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 100Gi}}
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits: {cpu: "2", memory: 4Gi}
