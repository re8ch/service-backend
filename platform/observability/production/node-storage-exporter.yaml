apiVersion: v1
kind: Service
metadata:
  name: re8ch-node-storage-exporter
  namespace: observability-system
  labels: {app.kubernetes.io/name: re8ch-node-storage-exporter}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: re8ch-node-storage-exporter}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: re8ch-node-storage-exporter
  namespace: observability-system
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: re8ch-node-storage-exporter}
  template:
    metadata:
      annotations: {scheduling.re8ch.com/placement-class: node-serving-agent}
      labels: {app.kubernetes.io/name: re8ch-node-storage-exporter}
    spec:
      nodeSelector: {scheduling.re8ch.com/workload-eligible: "true"}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.disable-defaults
            - --collector.filesystem
            - --collector.meminfo
            - --collector.cpu
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|snap|mnt/wslg|var/lib/(containerd|docker|kubelet)/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|ramfs|securityfs|squashfs|sysfs|tmpfs|tracefs)$
          ports: [{name: metrics, containerPort: 9100}]
          resources:
            requests: {cpu: 10m, memory: 12Mi}
            limits: {cpu: 100m, memory: 96Mi}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true}
      volumes:
        - {name: proc, hostPath: {path: /proc, type: Directory}}
        - {name: sys, hostPath: {path: /sys, type: Directory}}
        - {name: root, hostPath: {path: /, type: Directory}}
