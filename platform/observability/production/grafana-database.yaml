apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: re8ch-grafana-postgresql-data-v2
  namespace: observability-system
  labels: {app.kubernetes.io/name: re8ch-grafana-postgresql, app.kubernetes.io/part-of: re8ch-observability}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: re8ch-grafana-postgresql
  namespace: observability-system
  labels: {app.kubernetes.io/name: re8ch-grafana-postgresql, app.kubernetes.io/part-of: re8ch-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: re8ch-grafana-postgresql}}
  template:
    metadata: {labels: {app.kubernetes.io/name: re8ch-grafana-postgresql, app.kubernetes.io/part-of: re8ch-observability}}
    spec:
      nodeSelector: {kubernetes.io/hostname: r640}
      containers:
        - name: postgresql
          image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
          imagePullPolicy: IfNotPresent
          ports: [{name: postgresql, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: re8ch-grafana-database, key: name}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: re8ch-grafana-database, key: user}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: re8ch-grafana-database, key: password}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe: {exec: {command: [sh, -ec, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [sh, -ec, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: re8ch-grafana-postgresql-data-v2}}]
---
apiVersion: v1
kind: Service
metadata: {name: re8ch-grafana-postgresql, namespace: observability-system, labels: {app.kubernetes.io/name: re8ch-grafana-postgresql}}
spec: {selector: {app.kubernetes.io/name: re8ch-grafana-postgresql}, ports: [{name: postgresql, port: 5432, targetPort: postgresql}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: re8ch-grafana-postgresql, namespace: observability-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: re8ch-grafana-postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: re8ch-grafana}}}]
      ports: [{protocol: TCP, port: 5432}]
