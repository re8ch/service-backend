apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pigsty-postgresql
  namespace: observability-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [qianwen-ops]}
  selector: {matchLabels: {app.kubernetes.io/name: pigsty-pg-re8ch-exporters}}
  endpoints:
    - {port: metrics-pg, interval: 60s, scrapeTimeout: 20s}
    - {port: metrics-pgbouncer, interval: 60s, scrapeTimeout: 20s}
    - {port: metrics-patroni, interval: 60s, scrapeTimeout: 20s}
    - {port: metrics-haproxy, interval: 60s, scrapeTimeout: 20s}
    - {port: metrics-pgbackrest, interval: 60s, scrapeTimeout: 20s}
