apiVersion: v1
kind: Secret
metadata:
  name: re8ch-alertmanager-base
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: secretary-warning
      group_by: [cluster, namespace, service, alertname]
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 4h
      routes:
        - receiver: secretary-critical
          matchers: ['severity=~"critical|high"']
          group_wait: 15s
          group_interval: 5m
          repeat_interval: 30m
        - receiver: event-only
          matchers: ['severity="info"']
          repeat_interval: 24h
    receivers:
      - name: secretary-critical
        webhook_configs:
          - url: http://secretary-alertmanager-intake.re8ch-secretary.svc.cluster.local/v1/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
      - name: secretary-warning
        webhook_configs:
          - url: http://secretary-alertmanager-intake.re8ch-secretary.svc.cluster.local/v1/integrations/alertmanager
            send_resolved: true
            max_alerts: 100
      - name: event-only
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: re8ch-alertmanager
  namespace: observability-system
  labels:
    app.kubernetes.io/part-of: re8ch-observability
    observability.re8ch.com/managed: "true"
    usage: re8ch-platform-alerting
spec:
  replicaCount: 3
  configSecret: re8ch-alertmanager-base
  configSelector:
    matchLabels: {observability.re8ch.com/managed: "true"}
  configNamespaceSelector: {}
  selectAllByDefault: false
  extraArgs:
    log.format: json
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb, restricted-node-6dc3f140f9]}
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app.kubernetes.io/name: vmalertmanager}}
          topologyKey: kubernetes.io/hostname
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: alerting-control-plane
  namespace: observability-system
  labels: {observability.re8ch.com/managed: "true"}
spec:
  namespaceSelector: {matchNames: [observability-system]}
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [vmalert, vmalertmanager]}
  endpoints:
    - port: web
      interval: 30s
      scrapeTimeout: 10s
      relabelConfigs:
        - {targetLabel: signal_domain, replacement: observability}
        - {targetLabel: owner, replacement: platform-observability}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: re8ch-notification-receiver-catalog
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability}
data:
  receivers.json: |
    {
      "secretary-critical": {
        "owner": "platform-observability",
        "kind": "secretary_webhook",
        "failure_domain": "re8ch-secretary",
        "facts": ["attempted"],
        "notes": "Receiver invocation is not provider acceptance, device delivery, human attention, or ACK."
      },
      "secretary-warning": {
        "owner": "platform-observability",
        "kind": "secretary_webhook",
        "failure_domain": "re8ch-secretary",
        "facts": ["attempted"],
        "notes": "Secretary manages the delivery state and leaves unavailable evidence unknown."
      },
      "event-only": {
        "owner": "platform-observability",
        "kind": "null",
        "failure_domain": "none",
        "facts": [],
        "notes": "Recorded by vmalert and Alertmanager without an outbound notification."
      }
    }
