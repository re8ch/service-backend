apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - storage.yaml
  - logs.yaml
  - collectors.yaml
  - node-storage-exporter.yaml
  - alertmanager.yaml
  - scrapes.yaml
  - rules.yaml
  - otel.yaml
  - dashboards.yaml
  - grafana-secrets.sops.yaml
  - grafana-database.yaml
  - grafana.yaml
configMapGenerator:
  - name: re8ch-observability-dashboards
    namespace: observability-system
    files:
      - dashboards/re8ch-fleet.json
      - dashboards/re8ch-storage.json
      - dashboards/re8ch-network.json
      - dashboards/re8ch-stateful.json
      - dashboards/re8ch-stateless.json
      - dashboards/re8ch-events.json
      - dashboards/re8ch-costs.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: re8ch-observability
generatorOptions:
  disableNameSuffixHash: true
