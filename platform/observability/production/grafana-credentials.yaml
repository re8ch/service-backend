apiVersion: v1
kind: ServiceAccount
metadata: {name: re8ch-grafana-credential-bootstrap, namespace: observability-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: re8ch-grafana-credential-bootstrap, namespace: observability-system}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: re8ch-grafana-credential-bootstrap, namespace: observability-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: re8ch-grafana-credential-bootstrap}
subjects: [{kind: ServiceAccount, name: re8ch-grafana-credential-bootstrap, namespace: observability-system}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: re8ch-grafana-credential-bootstrap, namespace: observability-system}
data:
  bootstrap.py: |
    import base64
    import json
    import secrets
    import ssl
    import urllib.error
    import urllib.request

    api = "https://kubernetes.default.svc"
    namespace = "observability-system"
    token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
    context = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    def request(path, method="GET", body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(api + path, data=data, method=method, headers={
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json",
        })
        with urllib.request.urlopen(req, context=context, timeout=20) as response:
            return json.load(response)

    def ensure(name, values):
        path = f"/api/v1/namespaces/{namespace}/secrets/{name}"
        try:
            request(path)
            print("preserved", name)
            return
        except urllib.error.HTTPError as exc:
            if exc.code != 404:
                raise
        encoded = {key: base64.b64encode(value.encode()).decode() for key, value in values.items()}
        request(f"/api/v1/namespaces/{namespace}/secrets", "POST", {
            "apiVersion": "v1", "kind": "Secret", "type": "Opaque",
            "metadata": {"name": name, "namespace": namespace,
                         "labels": {"app.kubernetes.io/part-of": "re8ch-observability",
                                    "re8ch.com/credential-owner": "grafana"}},
            "data": encoded,
        })
        print("created", name)

    ensure("re8ch-grafana-admin", {"user": "admin", "password": secrets.token_urlsafe(36)})
    ensure("re8ch-grafana-renderer-auth", {"token": secrets.token_urlsafe(48)})
    ensure("re8ch-grafana-oidc", {"client-id": "re8ch-grafana", "client-secret": ""})
    ensure("re8ch-grafana-database", {
        "host": "re8ch-grafana-postgresql.observability-system.svc.cluster.local:5432",
        "name": "grafana", "user": "grafana", "password": secrets.token_urlsafe(36),
    })
---
apiVersion: batch/v1
kind: Job
metadata:
  name: re8ch-grafana-credential-bootstrap-v1
  namespace: observability-system
  labels: {app.kubernetes.io/part-of: re8ch-observability, app.kubernetes.io/component: credential-bootstrap}
spec:
  backoffLimit: 10
  template:
    metadata: {labels: {app.kubernetes.io/part-of: re8ch-observability, app.kubernetes.io/component: credential-bootstrap}}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: re8ch-grafana-credential-bootstrap
      containers:
        - name: bootstrap
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [python3, /scripts/bootstrap.py]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
          volumeMounts: [{name: scripts, mountPath: /scripts, readOnly: true}]
      volumes: [{name: scripts, configMap: {name: re8ch-grafana-credential-bootstrap, defaultMode: 0444}}]
