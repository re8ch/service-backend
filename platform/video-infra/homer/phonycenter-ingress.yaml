apiVersion: v1
kind: Namespace
metadata:
  name: voice-observability
  labels:
    app.kubernetes.io/part-of: re8ch-voice
---
# HOMER runs in the isolated voice-lab-homer LXD container and is exposed on
# the R640 LAN address by an LXD proxy.  This selectorless Service deliberately
# publishes only the HTTP UI/API; HEP, SIP, RTP and the settings DB stay private.
apiVersion: v1
kind: Service
metadata:
  name: homer-ui
  namespace: voice-observability
  labels:
    app.kubernetes.io/name: homer
    app.kubernetes.io/component: ui
spec:
  ports:
    - name: http
      port: 80
      targetPort: 19080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homer-ui-r640
  namespace: voice-observability
  labels:
    kubernetes.io/service-name: homer-ui
    app.kubernetes.io/name: homer
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 19080
endpoints:
  - addresses:
      - 192.168.88.251
    conditions:
      ready: true
    nodeName: r640
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homer-ui
  namespace: voice-observability
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: phonycenter.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homer-ui
                port:
                  name: http
  tls:
    - hosts:
        - phonycenter.re8ch.com
