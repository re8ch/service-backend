apiVersion: v1
kind: Service
metadata:
  name: ontology-neuronpedia-postgres
  namespace: re8ch-ontology-microscope
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ontology-neuronpedia-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ontology-neuronpedia-postgres
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  serviceName: ontology-neuronpedia-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-neuronpedia-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-neuronpedia-postgres
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: pgvector/pgvector@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: ontology-microscope-db}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          saas.re8ch.com/tenant: re8ch
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rbd-r640
        resources:
          requests: {storage: 20Gi}
