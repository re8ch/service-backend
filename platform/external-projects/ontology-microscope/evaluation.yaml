apiVersion: v1
kind: Service
metadata:
  name: ontology-microscope-neo4j
  namespace: re8ch-ontology-microscope
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ontology-microscope-neo4j
  ports:
    - {name: bolt, port: 7687, targetPort: bolt, protocol: TCP}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ontology-microscope-neo4j
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  serviceName: ontology-microscope-neo4j
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope-neo4j
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      securityContext:
        fsGroup: 7474
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: neo4j
          image: neo4j@sha256:a5cf6a1de3e7d94ee2311d9777118fadf5e2b0f231bbc6d73e4d0d8f2e0e02e2
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef: {name: ontology-microscope-evaluation, key: neo4j-auth}
            - {name: NEO4J_server_memory_heap_initial__size, value: 512m}
            - {name: NEO4J_server_memory_heap_max__size, value: 2g}
            - {name: NEO4J_server_memory_pagecache_size, value: 1g}
            - {name: NEO4J_server_directories_logs, value: /logs}
          ports:
            - {name: bolt, containerPort: 7687, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: bolt}
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: bolt}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 7474
            runAsGroup: 7474
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: logs, emptyDir: {sizeLimit: 1Gi}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          saas.re8ch.com/tenant: re8ch
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: rbd-r640
        resources:
          requests: {storage: 20Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-microscope-evaluation-worker
  namespace: re8ch-ontology-microscope
  labels:
    scheduling.re8ch.com/placement-managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-evaluation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope-evaluation-worker
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/re8ch/ontology-microscope-adapter@sha256:79597e2df5b9553150dc39fca896c09094770135e6e067e0a77ce04256fe00d0
          imagePullPolicy: IfNotPresent
          command: [node, --import, tsx, server/evaluation-worker.ts]
          env:
            - {name: NODE_ENV, value: production}
            - name: ONTOLOGY_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ontology-microscope-db, key: POSTGRES_URL_NON_POOLING}
            - {name: EVALUATION_OPENAI_BASE_URL, value: http://litellm.llm-gateway.svc.cluster.local:4000/v1}
            - {name: EVALUATION_OPENAI_MODEL, value: deepseek-v4-flash}
            - name: EVALUATION_OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: ontology-microscope-analysis, key: api-key}
            - {name: EVALUATION_NEO4J_URI, value: neo4j://ontology-microscope-neo4j:7687}
            - name: EVALUATION_NEO4J_USER
              valueFrom:
                secretKeyRef: {name: ontology-microscope-evaluation, key: neo4j-user}
            - name: EVALUATION_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef: {name: ontology-microscope-evaluation, key: neo4j-password}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ontology-microscope-evaluation-worker
  namespace: re8ch-ontology-microscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-evaluation-worker
  egress:
    - toEntities: [cluster]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ontology-microscope-neo4j
  namespace: re8ch-ontology-microscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neo4j
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ontology-microscope-evaluation-worker
      toPorts:
        - ports:
            - {port: "7687", protocol: TCP}
