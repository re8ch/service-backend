apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-microscope-neuronpedia
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neuronpedia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope-neuronpedia
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: registry.re8ch.com/re8ch/neuronpedia-migrate@sha256:457c7a883b00701480c58204a2bdef767a108f05f380153af51beb060d816a5c
          imagePullPolicy: IfNotPresent
          args: [migrate, deploy]
          envFrom:
            - secretRef: {name: ontology-microscope-db}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: webapp
          image: registry.re8ch.com/re8ch/neuronpedia@sha256:45dd94ae9ce31be71090cc578f5df35214cddfbc067a4a9468e80f7ae8abaced
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: ontology-microscope-db}
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: "3000"}
            - {name: NEXT_PUBLIC_URL, value: https://ontology.re8ch.com}
            - {name: NEXTAUTH_URL, value: https://ontology.re8ch.com}
            - {name: NEURONPEDIA_ENVIRONMENT, value: re8ch}
            - {name: NEXT_PUBLIC_ENABLE_SIGNIN, value: "false"}
            - {name: NEXT_PUBLIC_DEMO_MODE, value: "false"}
          ports:
            - {name: webapp, containerPort: 3000, protocol: TCP}
          readinessProbe:
            httpGet: {path: /, port: webapp}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /icon.ico, port: webapp}
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-microscope-neuronpedia
  namespace: re8ch-ontology-microscope
spec:
  selector:
    app.kubernetes.io/name: ontology-microscope-neuronpedia
  ports:
    - {name: http, port: 80, targetPort: webapp, protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ontology-microscope-neuronpedia-public-ingress
  namespace: re8ch-ontology-microscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neuronpedia
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
  egress:
    - toEntities: [cluster]
