apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-microscope-neuronpedia
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neuronpedia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope-neuronpedia
        saas.re8ch.com/tenant: re8ch
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: registry.re8ch.com/re8ch/neuronpedia-migrate@sha256:37141efee09a7e6b63bc1d4833d2023c5e7cfe837891d9c73c8062f8a973f08c
          imagePullPolicy: IfNotPresent
          args: [migrate, deploy]
          envFrom:
            - secretRef: {name: ontology-microscope-db}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: webapp
          image: registry.re8ch.com/re8ch/neuronpedia@sha256:5b09f5a43e91c9402abd1b6f4c93cd97ee8e6d6c354afa86d1accc7f51bed6e3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: ontology-microscope-db}
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: "3000"}
            - {name: NEXT_PUBLIC_URL, value: https://ontology.re8ch.com}
            - {name: NEXTAUTH_URL, value: https://ontology.re8ch.com}
            - {name: NEURONPEDIA_ENVIRONMENT, value: re8ch}
            - {name: NEXT_PUBLIC_ENABLE_SIGNIN, value: "false"}
            - {name: NEXT_PUBLIC_DEMO_MODE, value: "false"}
          ports:
            - {name: webapp, containerPort: 3000, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/global, port: webapp}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /api/global, port: webapp}
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: auth-proxy
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off;"]
          ports:
            - {name: authenticated, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: authenticated}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: authenticated}
            periodSeconds: 15
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: basic-auth, mountPath: /etc/nginx/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-run, mountPath: /var/run}
      volumes:
        - {name: nginx, configMap: {name: ontology-microscope-neuronpedia-auth-proxy}}
        - {name: basic-auth, secret: {secretName: ontology-microscope-basic-auth, items: [{key: auth, path: auth}]}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: nginx-run, emptyDir: {sizeLimit: 8Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-microscope-neuronpedia
  namespace: re8ch-ontology-microscope
spec:
  selector:
    app.kubernetes.io/name: ontology-microscope-neuronpedia
  ports:
    - {name: http, port: 80, targetPort: authenticated, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ontology-microscope-neuronpedia-auth-proxy
  namespace: re8ch-ontology-microscope
data:
  default.conf: |
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
      listen 8080;
      server_name _;
      location = /healthz {
        access_log off;
        return 200 'ok';
      }
      location / {
        auth_basic "Ontology Microscope";
        auth_basic_user_file /etc/nginx/auth/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3000;
      }
    }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ontology-microscope-neuronpedia-public-ingress
  namespace: re8ch-ontology-microscope
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope-neuronpedia
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
