    delivery.re8ch.com/retention: retained-data
    delivery.re8ch.com/retired-product: ontology-microscope
  annotations:
    delivery.re8ch.com/retired-at: "2026-10-24"
    delivery.re8ch.com/retention-policy: preserve-namespace-secrets-and-pvcs
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantNamespace
metadata:
  name: re8ch-ontology-microscope
  labels:
    tenancy.re8ch.com/tenant: re8ch
