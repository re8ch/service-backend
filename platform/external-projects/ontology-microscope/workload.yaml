apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-microscope
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope
        saas.re8ch.com/tenant: re8ch
        saas.re8ch.com/product: ontology-microscope
        saas.re8ch.com/layer: prototype
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: registry.re8ch.com/re8ch/ontology-microscope@sha256:f806538e9ec90be9cd6813db0e4b99ae5f7dc4427f91345d5afb291c5894eecf
          imagePullPolicy: IfNotPresent
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: "4318"}
            - {name: GRAPH_REPOSITORY, value: memory}
            - {name: REASONING_ADAPTER, value: mock}
          ports:
            - {name: http, containerPort: 4318, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-microscope
  namespace: re8ch-ontology-microscope
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ontology-microscope
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
