apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontology-microscope
  namespace: re8ch-ontology-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontology-microscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-microscope
        saas.re8ch.com/tenant: re8ch
        saas.re8ch.com/product: ontology-microscope
        saas.re8ch.com/layer: prototype
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: registry.re8ch.com/re8ch/ontology-microscope@sha256:f806538e9ec90be9cd6813db0e4b99ae5f7dc4427f91345d5afb291c5894eecf
          imagePullPolicy: IfNotPresent
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: "4318"}
            - {name: GRAPH_REPOSITORY, value: memory}
            - {name: REASONING_ADAPTER, value: mock}
          ports:
            - {name: http, containerPort: 4318, protocol: TCP}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
        - name: auth-proxy
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          command: [nginx, -g, "daemon off; pid /tmp/nginx.pid;"]
          ports:
            - {name: authenticated, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /healthz, port: authenticated}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: authenticated}
            periodSeconds: 15
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: basic-auth, mountPath: /etc/nginx/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - {name: nginx, configMap: {name: ontology-microscope-auth-proxy}}
        - {name: basic-auth, secret: {secretName: ontology-microscope-basic-auth, items: [{key: auth, path: auth}]}}
---
apiVersion: v1
kind: Service
metadata:
  name: ontology-microscope
  namespace: re8ch-ontology-microscope
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ontology-microscope
  ports:
    - {name: http, port: 80, targetPort: authenticated, protocol: TCP}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ontology-microscope-auth-proxy
  namespace: re8ch-ontology-microscope
data:
  default.conf: |
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
      listen 8080;
      server_name _;
      location = /healthz {
        access_log off;
        return 200 'ok';
      }
      location / {
        auth_basic "Ontology Microscope";
        auth_basic_user_file /etc/nginx/auth/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:4318;
      }
    }
