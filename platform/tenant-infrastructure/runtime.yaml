# Production topology. The legacy PVC is intentionally retained, but no runtime mounts it.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-infrastructure
  labels: {saas.re8ch.com/tenant: platform}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tenant-infrastructure-state
  namespace: tenant-infrastructure
  annotations:
    tenancy.re8ch.com/retained-until: "2026-09-13"
    tenancy.re8ch.com/recovery-mode: read-only
  labels: {storage.re8ch.com/replicated-approved: "true"}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rbd-r640
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-admin, namespace: tenant-infrastructure}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-registry, namespace: tenant-infrastructure}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-observability, namespace: tenant-infrastructure}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-byoc, namespace: tenant-infrastructure}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tenant-control-controller}
rules:
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenants, tenantidentitybindings, tenantgrants, tenantserviceinstances]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [tenancy.re8ch.com]
    resources: [tenants/status, tenantidentitybindings/status, tenantgrants/status, tenantserviceinstances/status]
    verbs: [get, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: tenant-control-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-control-controller}
subjects: [{kind: ServiceAccount, name: tenant-control-controller, namespace: tenant-infrastructure}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
  selector: {matchLabels: {app: tenant-control-controller}}
  template:
    metadata: {labels: {app: tenant-control-controller, saas.re8ch.com/tenant: platform}}
    spec:
      serviceAccountName: tenant-control-controller
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      imagePullSecrets: [{name: harbor-registry-pull}]
      containers:
        - name: controller
          image: registry.re8ch.com/image/re8ch-ai-operations@sha256:30bfefb7e126859b32326fa0557be161e2a27e7a426295eeae014468caa80593
          command: [python, /app/tenant_control_controller.py]
          env:
            - {name: LISTEN_PORT, value: "19447"}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          ports: [{name: http, containerPort: 19447}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-control-controller}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: tenant-runtime-image-cache, namespace: tenant-infrastructure}
spec:
  selector: {matchLabels: {app: tenant-runtime-image-cache}}
  template:
    metadata: {labels: {app: tenant-runtime-image-cache}}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      imagePullSecrets: [{name: harbor-registry-pull}]
      automountServiceAccountToken: false
      initContainers:
        - name: pull
          image: registry.re8ch.com/image/re8ch-ai-operations@sha256:30bfefb7e126859b32326fa0557be161e2a27e7a426295eeae014468caa80593
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "true"]
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10.1
          resources: {requests: {cpu: 1m, memory: 2Mi}, limits: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-admin, namespace: tenant-infrastructure}
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: tenant-admin}}
  template:
    metadata: {labels: {app: tenant-admin, tenant-runtime: "true", saas.re8ch.com/tenant: platform}}
    spec:
      serviceAccountName: tenant-admin
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      imagePullSecrets: [{name: harbor-registry-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runtime
          image: registry.re8ch.com/image/re8ch-ai-operations@sha256:30bfefb7e126859b32326fa0557be161e2a27e7a426295eeae014468caa80593
          imagePullPolicy: IfNotPresent
          env:
            - {name: RE8CH_TOOL_PROFILE, value: tenant-admin}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-tenant-admin}
            - {name: PUBLIC_MCP_URL, value: "https://tools.re8ch.com/tenant-admin/mcp"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://tools.re8ch.com/.well-known/oauth-protected-resource/tenant-admin/mcp"}
            - {name: TENANT_CONTROL_URL, value: "http://tenant-control-controller.tenant-infrastructure.svc"}
            - {name: TENANT_SERVICE_DB, value: /tmp/tenant-services.db}
          ports: [{name: http, containerPort: 19443}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: runtime-state, mountPath: /tmp}]
      volumes: [{name: runtime-state, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tenant-registry, namespace: tenant-infrastructure}
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: tenant-registry}}
  template:
    metadata: {labels: {app: tenant-registry, tenant-runtime: "true", saas.re8ch.com/tenant: platform}}
    spec:
      serviceAccountName: tenant-registry
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      imagePullSecrets: [{name: harbor-registry-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runtime
          image: registry.re8ch.com/image/re8ch-ai-operations@sha256:30bfefb7e126859b32326fa0557be161e2a27e7a426295eeae014468caa80593
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: tenant-registry-supply-chain, optional: true}}]
          env:
            - {name: RE8CH_TOOL_PROFILE, value: tenant-registry}
            - {name: RE8CH_TOOL_AUDIENCE, value: re8ch-tenant-registry}
            - {name: ALLOW_AUTHENTICATED_DEX, value: "true"}
            - {name: LISTEN_PORT, value: "19444"}
            - {name: PUBLIC_MCP_URL, value: "https://tools.re8ch.com/tenant/registry/mcp"}
            - {name: PUBLIC_RESOURCE_METADATA_URL, value: "https://tools.re8ch.com/.well-known/oauth-protected-resource/tenant/registry/mcp"}
            - {name: TENANT_CONTROL_URL, value: "http://tenant-control-controller.tenant-infrastructure.svc"}
            - {name: HARBOR_SUPPLY_CHAIN_URL, value: "http://harbor-supply-chain.tenant-infrastructure.svc"}
            - {name: TENANT_SERVICE_DB, value: /tmp/tenant-services.db}
          ports: [{name: http, containerPort: 19444}]
          startupProbe: {httpGet: {path: /livez, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: runtime-state, mountPath: /tmp}]
      volumes: [{name: runtime-state, emptyDir: {sizeLimit: 64Mi}}]
