---
apiVersion: v1
kind: Service
metadata: {name: tenant-admin, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-admin}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: tenant-registry, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-registry}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: tenant-observability, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-observability}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: tenant-byoc, namespace: tenant-infrastructure}
spec: {selector: {app: tenant-byoc}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-control-controller, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-control-controller}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {tenant-runtime: "true"}}}]
      ports: [{protocol: TCP, port: 19447}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: toolhive-system}}
          podSelector: {matchLabels: {tenant-runtime: "true"}}
      ports: [{protocol: TCP, port: 19447}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-admin, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-admin}}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}], ports: [{protocol: TCP, port: 19443}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-registry, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-registry}}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}], ports: [{protocol: TCP, port: 19444}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-observability, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-observability}}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}], ports: [{protocol: TCP, port: 19445}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tenant-byoc, namespace: tenant-infrastructure}
spec:
  podSelector: {matchLabels: {app: tenant-byoc}}
  policyTypes: [Ingress]
  ingress: [{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}], ports: [{protocol: TCP, port: 19446}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: tenant-infrastructure, namespace: tenant-infrastructure}
spec:
  hostnames: [tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-https}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /tenant-admin}}]
      backendRefs: [{name: tenant-admin, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /tenant/registry}}]
      backendRefs: [{name: tenant-registry, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /tenant/observability}}]
      backendRefs: [{name: tenant-observability, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /tenant/byoc}}]
      backendRefs: [{name: tenant-byoc, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant-admin}}]
      backendRefs: [{name: tenant-admin, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant/registry}}]
      backendRefs: [{name: tenant-registry, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant/observability}}]
      backendRefs: [{name: tenant-observability, port: 80}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/tenant/byoc}}]
      backendRefs: [{name: tenant-byoc, port: 80}]
