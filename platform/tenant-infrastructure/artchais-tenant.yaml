apiVersion: tenancy.re8ch.com/v1alpha1
kind: Tenant
metadata:
  name: artchais
  labels: {app.kubernetes.io/part-of: tenant-infrastructure}
spec:
  displayName: Artchais
  lifecycle: Active
  deletionPolicy: Retain
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantIdentityBinding
metadata: {name: artchais-github-admins}
spec:
  tenantRef: artchais
  issuer: https://dex.re8ch.com
  group: Artchais:tenant-admins
  role: admin
  revoked: false
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantIdentityBinding
metadata: {name: artchais-github-operators}
spec:
  tenantRef: artchais
  issuer: https://dex.re8ch.com
  group: Artchais:tenant-operators
  role: operator
  revoked: false
---
apiVersion: tenancy.re8ch.com/v1alpha1
kind: TenantIdentityBinding
metadata: {name: artchais-github-viewers}
spec:
  tenantRef: artchais
  issuer: https://dex.re8ch.com
  group: Artchais:tenant-viewers
  role: viewer
  revoked: false
