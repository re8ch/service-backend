apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-bootstrap-plan
  namespace: mail-system
data:
  plan.ndjson: |
    {"@type":"upsert","object":"DnsServer","matchOn":["description"],"value":{"cloudflare-phonaid":{"@type":"Cloudflare","description":"Cloudflare DNS for phonaid.com","secret":{"@type":"File","filePath":"/var/run/stalwart-secrets/cloudflare/token"},"timeout":30000,"ttl":300000,"pollInterval":15000,"propagationTimeout":300000},"cloudflare-re8ch":{"@type":"Cloudflare","description":"Cloudflare DNS for re8ch.com","secret":{"@type":"File","filePath":"/var/run/stalwart-secrets/cloudflare-re8ch/token"},"timeout":30000,"ttl":300000,"pollInterval":15000,"propagationTimeout":300000}}}
    {"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"phonaid-domain":{"name":"phonaid.com","enable":true,"aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Automatic","dnsServerId":"#cloudflare-phonaid","publishRecords":{"dkim":true,"mtaSts":true,"tlsRpt":true}},"reportAddressUri":"mailto:dmarc@phonaid.com","subAddressing":{"@type":"Enabled"}},"re8ch-domain":{"name":"re8ch.com","enable":true,"aliases":{},"certificateManagement":{"@type":"Manual"},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Automatic","dnsServerId":"#cloudflare-re8ch","publishRecords":{"dkim":true,"mtaSts":true,"tlsRpt":true}},"reportAddressUri":"mailto:postmaster@re8ch.com","subAddressing":{"@type":"Enabled"}}}}
    {"@type":"upsert","object":"Certificate","matchOn":["certificate"],"value":{"mail-re8ch-com":{"certificate":{"@type":"File","filePath":"/var/run/stalwart-tls/tls.crt"},"privateKey":{"@type":"File","filePath":"/var/run/stalwart-tls/tls.key"}}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"mail.re8ch.com","defaultCertificateId":"#mail-re8ch-com","mailExchangers":{"0":{"hostname":"mail.re8ch.com","priority":10}},"services":{"caldav":{"hostname":"mail.re8ch.com","cleartext":false},"carddav":{"hostname":"mail.re8ch.com","cleartext":false},"imap":{"hostname":"mail.re8ch.com","cleartext":false},"jmap":{"hostname":"mail.re8ch.com","cleartext":false},"managesieve":{"hostname":"mail.re8ch.com","cleartext":false},"pop3":{"hostname":"mail.re8ch.com","cleartext":false},"smtp":{"hostname":"mail.re8ch.com","cleartext":false},"webdav":{"hostname":"mail.re8ch.com","cleartext":false}}}}
    {"@type":"upsert","object":"NetworkListener","matchOn":["name"],"value":{"submission":{"name":"submission","protocol":"smtp","bind":{"[::]:587":true},"tlsImplicit":false},"imap":{"name":"imap","protocol":"imap","bind":{"[::]:143":true},"tlsImplicit":false}}}
    {"@type":"update","object":"SenderAuth","value":{"dkimStrict":true,"dkimVerify":{"else":"relaxed"},"spfEhloVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"spfFromVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"dmarcVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"},"arcVerify":{"else":"relaxed"},"reverseIpVerify":{"match":{"0":{"if":"local_port == 25","then":"relaxed"}},"else":"disable"}}}
    {"@type":"update","object":"SpamSettings","value":{"enable":true,"scoreSpam":5.0,"scoreReject":15.0,"scoreDiscard":0.0,"greylistFor":null,"trustContacts":true,"trustReplies":true}}
    {"@type":"update","object":"Security","value":{"authBanRate":{"count":20,"period":300000},"authBanPeriod":900000,"abuseBanRate":{"count":35,"period":86400000},"abuseBanPeriod":43200000,"loiterBanRate":{"count":150,"period":86400000},"loiterBanPeriod":3600000,"scanBanRate":{"count":30,"period":86400000},"scanBanPeriod":3600000}}
    {"@type":"update","object":"MtaSts","value":{"mode":"testing","maxAge":604800000,"mxHosts":{}}}
    {"@type":"update","object":"Metrics","value":{"prometheus":{"@type":"Enabled","authUsername":"metrics","authSecret":{"@type":"File","filePath":"/var/run/stalwart-secrets/metrics/password"}},"metrics":{},"metricsPolicy":"exclude","serviceName":"stalwart","serviceNamespace":"mail-system"}}
    {"@type":"update","object":"Sharing","value":{"allowDirectoryQueries":false,"maxShares":25}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-bootstrap-reconciler-v11
  namespace: mail-system
  labels:
    governance.re8ch.com/change-plane: deploying
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/name: stalwart-bootstrap-reconciler}
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: overseas-flk}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reconcile
          image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          command: [/bin/sh, -ceu]
          args:
            - |
              export STALWART_URL=http://stalwart.mail-system.svc.cluster.local:8080
              export STALWART_USER="${STALWART_RECOVERY_ADMIN%%:*}"
              export STALWART_PASSWORD="${STALWART_RECOVERY_ADMIN#*:}"
              unset STALWART_RECOVERY_ADMIN
              cli=/cli/usr/local/bin/stalwart-cli
              for attempt in $(seq 1 60); do
                if [ -s /var/run/stalwart-secrets/metrics/password ]; then break; fi
                if [ "${attempt}" -eq 60 ]; then exit 1; fi
                sleep 2
              done
              "${cli}" apply --file /plan/plan.ndjson --dry-run
              "${cli}" apply --file /plan/plan.ndjson --json
              "${cli}" create Action/ReloadSettings
              "${cli}" create Action/ReloadTlsCertificates
          envFrom:
            - secretRef: {name: stalwart-recovery-admin}
          env:
            - {name: XDG_CACHE_HOME, value: /cache}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: plan, mountPath: /plan, readOnly: true}
            - {name: cli, mountPath: /cli, readOnly: true}
            - {name: cache, mountPath: /cache}
            - {name: metrics-auth, mountPath: /var/run/stalwart-secrets/metrics, readOnly: true}
      volumes:
        - {name: plan, configMap: {name: stalwart-bootstrap-plan}}
        - name: cli
          image:
            reference: ghcr.io/stalwartlabs/cli@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
            pullPolicy: IfNotPresent
        - {name: cache, emptyDir: {}}
        - name: metrics-auth
          secret: {secretName: stalwart-metrics-auth}
