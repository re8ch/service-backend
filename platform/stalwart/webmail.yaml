apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-webmail
  namespace: mail-system
  labels: {app.kubernetes.io/name: stalwart-webmail, app.kubernetes.io/component: webmail}
spec:
  replicas: 1
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app.kubernetes.io/name: stalwart-webmail}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stalwart-webmail, app.kubernetes.io/component: webmail}
    spec:
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webmail
          image: ghcr.io/bulwarkmail/webmail:1.10.0@sha256:f3b59980ccccb45e710f3e4e93cd5c1a66a6175fbf64493e0c86aa6f7fe6ac6b
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: "3000"}
            - {name: JMAP_SERVER_URL, value: https://collab.tools.re8ch.com}
            - {name: APP_NAME, value: RE8CH Mail}
            - {name: APP_SHORT_NAME, value: Mail}
            - {name: LOGIN_COMPANY_NAME, value: RE8CH}
            - {name: LOGIN_WEBSITE_URL, value: https://re8ch.com}
            - {name: ALLOW_CUSTOM_JMAP_ENDPOINT, value: "false"}
            - {name: SETTINGS_SYNC_ENABLED, value: "false"}
            - {name: ADMIN_CONFIG_READONLY, value: "true"}
            - {name: BULWARK_TELEMETRY, value: "off"}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: stalwart-webmail, namespace: mail-system}
spec:
  selector: {app.kubernetes.io/name: stalwart-webmail}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-webmail-public
  namespace: mail-system
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mail.re8ch.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
    governance.re8ch.com/exposure: authenticated-webmail
spec:
  hostnames: [mail.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: mail-https}]
  rules: [{backendRefs: [{name: stalwart-webmail, port: 80}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: stalwart-webmail-redirect, namespace: mail-system}
spec:
  hostnames: [mail.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 308}
