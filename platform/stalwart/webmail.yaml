apiVersion: v1
kind: ConfigMap
metadata: {name: stalwart-webmail-tls-proxy, namespace: mail-system}
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 8443 ssl;
        server_name mail.re8ch.com;
        ssl_certificate /var/run/stalwart-tls/tls.crt;
        ssl_certificate_key /var/run/stalwart-tls/tls.key;
        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-webmail
  namespace: mail-system
  labels: {app.kubernetes.io/name: stalwart-webmail, app.kubernetes.io/component: webmail}
spec:
  replicas: 1
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app.kubernetes.io/name: stalwart-webmail}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stalwart-webmail, app.kubernetes.io/component: webmail}
    spec:
      nodeSelector: {kubernetes.io/hostname: overseas-flk}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webmail
          image: ghcr.io/bulwarkmail/webmail:1.10.0@sha256:f3b59980ccccb45e710f3e4e93cd5c1a66a6175fbf64493e0c86aa6f7fe6ac6b
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOSTNAME, value: 0.0.0.0}
            - {name: PORT, value: "3000"}
            - {name: JMAP_SERVER_URL, value: https://id.re8ch.com}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: stalwart-webmail-session
                  key: session-secret
            - {name: OAUTH_ENABLED, value: "true"}
            - {name: OAUTH_ONLY, value: "true"}
            - {name: OAUTH_CLIENT_ID, value: 705c1168-43d8-4ec3-980a-0327a59c7fc6}
            - {name: OAUTH_ISSUER_URL, value: https://db-rw.re8ch.com/auth/v1}
            - {name: APP_NAME, value: RE8CH Mail}
            - {name: APP_SHORT_NAME, value: Mail}
            - {name: LOGIN_COMPANY_NAME, value: RE8CH}
            - {name: LOGIN_WEBSITE_URL, value: https://re8ch.com}
            - {name: ALLOW_CUSTOM_JMAP_ENDPOINT, value: "false"}
            - {name: SETTINGS_SYNC_ENABLED, value: "false"}
            - {name: ADMIN_CONFIG_READONLY, value: "true"}
            - {name: BULWARK_TELEMETRY, value: "off"}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
        - name: tls-proxy
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: https}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls-proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: mail-tls, mountPath: /var/run/stalwart-tls, readOnly: true}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - {name: tls-proxy-config, configMap: {name: stalwart-webmail-tls-proxy}}
        - {name: mail-tls, secret: {secretName: stalwart-mail-re8ch-tls}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: stalwart-webmail, namespace: mail-system}
spec:
  selector: {app.kubernetes.io/name: stalwart-webmail}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: https, port: 443, targetPort: https}
---
# DNS authority only. Cilium Gateway remains the Webmail request path; this
# same-name Ingress is the publication object expected by Public Edge Manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-webmail-public
  namespace: mail-system
  labels:
    networking.re8ch.com/dns-authority: public-edge
    public.re8ch.com/external-dns: enabled
  annotations:
    networking.re8ch.com/dns-authority: public-edge
    external-dns.alpha.kubernetes.io/hostname: mail.re8ch.com
    external-dns.alpha.kubernetes.io/target: 2.28.106.230
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: mail.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: stalwart-webmail, port: {number: 80}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-webmail-public
  namespace: mail-system
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mail.re8ch.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
    governance.re8ch.com/exposure: authenticated-webmail
spec:
  hostnames: [mail.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: mail-https}]
  rules: [{backendRefs: [{name: stalwart-webmail, port: 80}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: stalwart-webmail-redirect, namespace: mail-system}
spec:
  hostnames: [mail.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 308}
