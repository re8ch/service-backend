apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-collaboration-public
  namespace: mail-system
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: collab.tools.re8ch.com
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "60"
    governance.re8ch.com/exposure: authenticated-collaboration-only
spec:
  hostnames: [collab.tools.re8ch.com]
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-wildcard-https}
  rules:
    - matches:
        - {path: {type: Exact, value: /}}
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path: {type: ReplaceFullPath, replaceFullPath: /account}
    - matches:
        - {path: {type: PathPrefix, value: /jmap}}
        - {path: {type: PathPrefix, value: /dav}}
        - {path: {type: PathPrefix, value: /.well-known}}
        - {path: {type: PathPrefix, value: /account}}
        - {path: {type: PathPrefix, value: /auth}}
      backendRefs: [{name: stalwart, port: 8080}]
---
# Keep the legacy collaboration alias on the inventory-declared R640 edge
# while existing clients move to the canonical id.re8ch.com JMAP endpoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-collaboration-public-dns
  namespace: mail-system
  labels: {networking.re8ch.com/dns-authority: public-edge}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: collab.tools.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    networking.re8ch.com/provider: public-edge-manager
spec:
  ingressClassName: external-dns-only
  rules:
    - host: collab.tools.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: stalwart, port: {number: 8080}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: stalwart-collaboration-redirect, namespace: mail-system}
spec:
  hostnames: [collab.tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 308}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-admin-public
  namespace: mail-system
  annotations:
    governance.re8ch.com/exposure: stalwart-admin-authentication-required
spec:
  hostnames: [stalwart-admin.service.re8ch.com]
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: service-wildcard-https}
  rules:
    - matches:
        - {path: {type: Exact, value: /}}
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path: {type: ReplaceFullPath, replaceFullPath: /admin}
    - matches:
        - {path: {type: PathPrefix, value: /admin}}
        - {path: {type: PathPrefix, value: /api}}
        - {path: {type: PathPrefix, value: /jmap}}
        - {path: {type: Exact, value: /login}}
        - {path: {type: PathPrefix, value: /auth}}
        - {path: {type: PathPrefix, value: /.well-known}}
      backendRefs: [{name: stalwart, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: stalwart-admin-redirect, namespace: mail-system}
spec:
  hostnames: [stalwart-admin.service.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: http}]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: {scheme: https, statusCode: 308}
