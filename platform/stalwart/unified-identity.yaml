---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-unified-identity-bootstrap-plan-v2
  namespace: mail-system
data:
  plan.ndjson: |
    {"@type":"upsert","object":"Directory","matchOn":["description"],"value":{"re8ch-enterprise-sso":{"@type":"Oidc","description":"RE8CH Enterprise SSO broker","issuerUrl":"https://auth.re8ch.com","requireAudience":"stalwart-webui","requireScopes":{"openid":true,"email":true,"profile":true},"claimUsername":"email","claimName":"name","claimGroups":"groups"}}}
    {"@type":"update","object":"Authentication","value":{"directoryId":"#re8ch-enterprise-sso"}}
    {"@type":"update","object":"Http","value":{"usePermissiveCors":true}}
    {"@type":"update","object":"OidcProvider","value":{"anonymousClientRegistration":true,"requireClientRegistration":true,"signatureAlgorithm":"es256","signatureKey":{"@type":"File","filePath":"/var/run/stalwart-idp/signing-private.pem"},"encryptionKey":{"@type":"File","filePath":"/var/run/stalwart-idp/encryption-key"},"accessTokenExpiry":900000,"idTokenExpiry":900000,"refreshTokenExpiry":28800000,"refreshTokenRenewal":3600000}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"kubectl-pilot":{"clientId":"kubectl-stalwart-pilot","description":"Kubernetes RBAC Stalwart pilot","redirectUris":{"http://127.0.0.1:8000":true,"http://localhost:8000":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"headlamp":{"clientId":"headlamp","description":"Headlamp Kubernetes console","redirectUris":{"https://headlamp.service.re8ch.com/oidc-callback":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"storage-collaborator":{"clientId":"storage-collaborator","description":"Storage Collaborator iOS","redirectUris":{"com.re8ch.storagecollaborator:/oauth/callback":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"connectool-cloud":{"clientId":"re8ch-cloud-platform-tool","description":"ConnecTool cloud platform public PKCE client","redirectUris":{"http://127.0.0.1/callback":true,"http://localhost/callback":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"connectool-admin":{"clientId":"re8ch-platform-admin","description":"ConnecTool platform admin public PKCE client","redirectUris":{"http://127.0.0.1/callback":true,"http://localhost/callback":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"connectool-tenant":{"clientId":"re8ch-tenant","description":"ConnecTool tenant public PKCE client","redirectUris":{"http://127.0.0.1/callback":true,"http://localhost/callback":true}}}}
    {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],"value":{"webmail":{"clientId":"bulwark-webmail","description":"RE8CH Mail web client","redirectUris":{"https://mail.re8ch.com/ar/auth/callback":true,"https://mail.re8ch.com/ca/auth/callback":true,"https://mail.re8ch.com/cs/auth/callback":true,"https://mail.re8ch.com/da/auth/callback":true,"https://mail.re8ch.com/de/auth/callback":true,"https://mail.re8ch.com/en/auth/callback":true,"https://mail.re8ch.com/es/auth/callback":true,"https://mail.re8ch.com/fa/auth/callback":true,"https://mail.re8ch.com/fr/auth/callback":true,"https://mail.re8ch.com/he/auth/callback":true,"https://mail.re8ch.com/hu/auth/callback":true,"https://mail.re8ch.com/it/auth/callback":true,"https://mail.re8ch.com/ja/auth/callback":true,"https://mail.re8ch.com/ko/auth/callback":true,"https://mail.re8ch.com/lv/auth/callback":true,"https://mail.re8ch.com/mn/auth/callback":true,"https://mail.re8ch.com/nb/auth/callback":true,"https://mail.re8ch.com/nl/auth/callback":true,"https://mail.re8ch.com/pl/auth/callback":true,"https://mail.re8ch.com/pt/auth/callback":true,"https://mail.re8ch.com/ro/auth/callback":true,"https://mail.re8ch.com/ru/auth/callback":true,"https://mail.re8ch.com/sk/auth/callback":true,"https://mail.re8ch.com/tr/auth/callback":true,"https://mail.re8ch.com/uk/auth/callback":true,"https://mail.re8ch.com/zh/auth/callback":true,"https://mail.re8ch.com/zh-TW/auth/callback":true}}}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-unified-identity-bootstrap-v2
  namespace: mail-system
  labels:
    governance.re8ch.com/change-plane: deploying
    app.kubernetes.io/name: stalwart-unified-identity-bootstrap
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-unified-identity-bootstrap
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reconcile
        image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
        command:
        - /bin/sh
        - -ceu
        args:
        - |
          export STALWART_URL=http://stalwart.mail-system.svc.cluster.local:8080
          export STALWART_USER="${STALWART_RECOVERY_ADMIN%%:*}"
          export STALWART_PASSWORD="${STALWART_RECOVERY_ADMIN#*:}"
          unset STALWART_RECOVERY_ADMIN
          cli=/cli/usr/local/bin/stalwart-cli
          for attempt in $(seq 1 30); do
            if "${cli}" describe Authentication >/dev/null 2>&1; then break; fi
            if [ "${attempt}" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          "${cli}" apply --file /plan/plan.ndjson --dry-run
          "${cli}" apply --file /plan/plan.ndjson --json
        envFrom:
        - secretRef:
            name: stalwart-recovery-admin
        env:
        - name: XDG_CACHE_HOME
          value: /cache
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: plan
          mountPath: /plan
          readOnly: true
        - name: cli
          mountPath: /cli
          readOnly: true
        - name: cache
          mountPath: /cache
      volumes:
      - name: plan
        configMap:
          name: stalwart-unified-identity-bootstrap-plan-v2
      - name: cache
        emptyDir: {}
      - name: cli
        image:
          reference: ghcr.io/stalwartlabs/cli@sha256:fe199affac1d120a8c200ef39ae629765a2976270e0453575c1caf906ee15b52
          pullPolicy: IfNotPresent
