apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-phonaid-domain-plan
  namespace: mail-system
  labels: {governance.re8ch.com/evidence-plane: planning}
data:
  domains: phonaid.com,re8ch.com
  domainSemantics: independent-mail-domains
  authority: staged
  phonaidCurrentMX: mx1.feishu.cn,mx2.feishu.cn,mx3.feishu.cn
  re8chDnsState: preserve-existing-authority
  dnsMutationAllowed: "false"
  cutoverRequirements: monitoring,deploying,planning,inbound,outbound,dkim,spf,dmarc,mta-sts,rollback
  accountSource: git-workspaces/GitAccount
