apiVersion: v1
kind: ConfigMap
metadata: {name: stalwart-config, namespace: mail-system}
data:
  config.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart"}
---
apiVersion: v1
kind: Service
metadata: {name: stalwart-headless, namespace: mail-system}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector: {app.kubernetes.io/name: stalwart}
  ports: [{name: management, port: 8080, targetPort: management}]
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: mail-system
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/component: mail-server
    observability.re8ch.com/scrape: "true"
    observability.re8ch.com/tier: critical
  annotations:
    governance.re8ch.com/exposure: collaboration-https-public-management-internal
    observability.re8ch.com/owner: identity-access
    observability.re8ch.com/runbook: platform/stalwart/MAIL-SECURITY.md
    observability.re8ch.com/metrics-doc: https://stalw.art/docs/ref/metrics/
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: stalwart}
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
    - {name: smtps, port: 465, targetPort: smtps}
    - {name: submission, port: 587, targetPort: submission}
    - {name: imap, port: 143, targetPort: imap}
    - {name: imaps, port: 993, targetPort: imaps}
    - {name: pop3, port: 110, targetPort: pop3}
    - {name: pop3s, port: 995, targetPort: pop3s}
    - {name: sieve, port: 4190, targetPort: sieve}
    - {name: http, port: 80, targetPort: http}
    - {name: https, port: 443, targetPort: https}
    - {name: management, port: 8080, targetPort: management}
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-direct-mail
  namespace: mail-system
  annotations:
    governance.re8ch.com/exposure: overseas-flk-public-mail-only
spec:
  type: ClusterIP
  # overseas-flk owns this provider address. Keep the management and web
  # ports on the separate cluster-internal Service above.
  externalIPs: [2.28.106.230]
  selector: {app.kubernetes.io/name: stalwart}
  ports:
    - {name: smtp, port: 25, targetPort: smtp}
    - {name: smtps, port: 465, targetPort: smtps}
    - {name: submission, port: 587, targetPort: submission}
    - {name: imaps, port: 993, targetPort: imaps}
    - {name: sieve, port: 4190, targetPort: sieve}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: stalwart-flk, namespace: mail-system}
spec:
  serviceName: stalwart-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  selector: {matchLabels: {app.kubernetes.io/name: stalwart}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stalwart}
      annotations:
        governance.re8ch.com/mail-authority: staged
    spec:
      nodeSelector: {kubernetes.io/hostname: overseas-flk}
      tolerations:
        - {key: dedicated, operator: Equal, value: overseas-edge, effect: NoSchedule}
        - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
      # Keep public mail resolution independent from the shared cluster DNS.
      # Stalwart has no in-cluster hostname dependencies and requires reliable
      # lookups for delivery, DNSBL/Pyzor, Cloudflare DNS management and ACME.
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 1.0.0.1]
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: wait-for-migration
          image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
          command: [/bin/sh, -ceu]
          args:
            - |
              until [ -f /var/lib/stalwart/.r640-migration-v2-complete ]; do sleep 5; done
              test -f /var/lib/stalwart/CURRENT
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/stalwart, readOnly: true}
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stalwart
          image: ghcr.io/stalwartlabs/stalwart:v0.16.18@sha256:9ed1d343243b7aa72969e372a7240b7ddea07730781d4b68a0dc3d8d51c418bb
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/stalwart/config.json]
          envFrom: [{secretRef: {name: stalwart-recovery-admin}}]
          env:
            - {name: STALWART_PUBLIC_URL, value: "https://id.re8ch.com"}
          ports:
            - {name: smtp, containerPort: 25}
            - {name: smtps, containerPort: 465}
            - {name: submission, containerPort: 587}
            - {name: imap, containerPort: 143}
            - {name: imaps, containerPort: 993}
            - {name: pop3, containerPort: 110}
            - {name: pop3s, containerPort: 995}
            - {name: sieve, containerPort: 4190}
            - {name: http, containerPort: 80}
            - {name: https, containerPort: 443}
            - {name: management, containerPort: 8080}
          livenessProbe:
            tcpSocket: {port: management}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket: {port: management}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          startupProbe:
            tcpSocket: {port: management}
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: config, mountPath: /etc/stalwart, readOnly: true}
            - {name: data, mountPath: /var/lib/stalwart}
            - {name: tmp, mountPath: /tmp}
            - {name: mail-tls, mountPath: /var/run/stalwart-tls, readOnly: true}
            - {name: cloudflare-token, mountPath: /var/run/stalwart-secrets/cloudflare, readOnly: true}
            - {name: cloudflare-re8ch-token, mountPath: /var/run/stalwart-secrets/cloudflare-re8ch, readOnly: true}
            - {name: oidc-keys, mountPath: /var/run/stalwart-idp, readOnly: true}
            - {name: metrics-auth, mountPath: /var/run/stalwart-secrets/metrics, readOnly: true}
      volumes:
        - {name: config, configMap: {name: stalwart-config}}
        - {name: tmp, emptyDir: {}}
        - name: data
          persistentVolumeClaim: {claimName: stalwart-flk-local-data}
        - name: mail-tls
          secret:
            secretName: stalwart-mail-re8ch-tls
        - name: cloudflare-token
          secret:
            # Dedicated least-privilege token for the phonaid.com zone.
            # The separately synchronized re8ch.com credential is retained for
            # future domain onboarding and must not be reused here.
            secretName: stalwart-cloudflare-phonaid-token
            optional: true
            items: [{key: CF_API_TOKEN, path: token}]
        - name: cloudflare-re8ch-token
          secret:
            secretName: stalwart-cloudflare-dns-token
            optional: true
            items: [{key: CF_API_TOKEN, path: token}]
        - name: oidc-keys
          secret: {secretName: stalwart-idp-oidc-keys}
        - name: metrics-auth
          secret:
            secretName: stalwart-metrics-auth
            optional: true
