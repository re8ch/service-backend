apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stalwart-mail-re8ch
  namespace: mail-system
spec:
  secretName: stalwart-mail-re8ch-tls
  issuerRef:
    kind: ClusterIssuer
    name: re8ch-cloudflare-dns01
  dnsNames: [mail.re8ch.com]
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-tls-reloader
  namespace: mail-system
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: {app.kubernetes.io/name: stalwart-tls-reloader}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reload
              image: alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
              command: [/bin/sh, -ceu]
              args:
                - |
                  export STALWART_URL=http://stalwart.mail-system.svc.cluster.local:8080
                  export STALWART_USER="${STALWART_RECOVERY_ADMIN%%:*}"
                  export STALWART_PASSWORD="${STALWART_RECOVERY_ADMIN#*:}"
                  unset STALWART_RECOVERY_ADMIN
                  /cli/usr/local/bin/stalwart-cli create Action/ReloadTlsCertificates
              envFrom:
                - secretRef: {name: stalwart-recovery-admin}
              env:
                - {name: XDG_CACHE_HOME, value: /cache}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: cli, mountPath: /cli, readOnly: true}
                - {name: cache, mountPath: /cache}
          volumes:
            - name: cli
              image:
                reference: ghcr.io/stalwartlabs/cli@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1
                pullPolicy: IfNotPresent
            - {name: cache, emptyDir: {}}
