apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-agent-artifacts
  namespace: ai-operations
  labels: {storage.re8ch.com/replicated-approved: "true"}
spec: {accessModes: [ReadWriteMany], storageClassName: cephfs-re8ch, resources: {requests: {storage: 20Gi}}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: workspace-mirror-sync, namespace: ai-operations}
spec:
  schedule: "17 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata: {labels: {app: workspace-mirror-sync}}
        spec:
          restartPolicy: Never
          nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
          serviceAccountName: workspace-controller
          securityContext: {fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
          containers:
            - name: mirror
              image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
              args: [--lock, /config/workspace.lock.yaml, --mirrors, /var/lib/re8ch/workspace-mirrors, --worktrees, /var/lib/re8ch/agent-workspaces, --memory-root, /srv/service-backend/catalogs, sync]
              env: [{name: GIT_SSH_COMMAND, value: "ssh -F /credentials/ssh-config -o BatchMode=yes"}]
              securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: mirrors, mountPath: /var/lib/re8ch/workspace-mirrors}
                - {name: worktrees, mountPath: /var/lib/re8ch/agent-workspaces}
                - {name: credentials, mountPath: /credentials, readOnly: true}
                - {name: artifacts, mountPath: /srv/re8ch/agent-artifacts}
          volumes:
            - {name: mirrors, hostPath: {path: /var/lib/re8ch/workspace-mirrors, type: DirectoryOrCreate}}
            - {name: worktrees, hostPath: {path: /var/lib/re8ch/agent-workspaces, type: DirectoryOrCreate}}
            - {name: credentials, secret: {secretName: workspace-git-credentials, defaultMode: 256}}
            - {name: artifacts, persistentVolumeClaim: {claimName: workspace-agent-artifacts}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: workspace-controller, namespace: ai-operations}
automountServiceAccountToken: false
