apiVersion: batch/v1
kind: Job
metadata:
  name: re8ch-owner-pilot-workspace-v4
  namespace: ai-operations
  labels: {governance.re8ch.com/task-id: re8ch-owner-pilot-20260825}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: re8ch-owner-pilot-workspace}}
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: r640}
      serviceAccountName: workspace-controller
      securityContext: {fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch}
      initContainers:
        - name: prepare-directories
          image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
          command: [sh, -c, "chown 65532:65532 /var/lib/re8ch/workspace-mirrors /var/lib/re8ch/agent-workspaces"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN]}}
          volumeMounts:
            - {name: mirrors, mountPath: /var/lib/re8ch/workspace-mirrors}
            - {name: worktrees, mountPath: /var/lib/re8ch/agent-workspaces}
        - name: remove-invalid-pilot-state
          image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
          command:
            - sh
            - -c
            - >-
              if [ -e /var/lib/re8ch/workspace-mirrors/re8ch-core.git ] &&
              ! git -C /var/lib/re8ch/workspace-mirrors/re8ch-core.git rev-parse --is-bare-repository >/dev/null 2>&1;
              then rm -rf /var/lib/re8ch/workspace-mirrors/re8ch-core.git; fi;
              if [ -e /var/lib/re8ch/agent-workspaces/re8ch-owner-pilot-20260825/re8ch-core ] &&
              ! git -C /var/lib/re8ch/agent-workspaces/re8ch-owner-pilot-20260825/re8ch-core rev-parse --is-inside-work-tree >/dev/null 2>&1;
              then rm -rf /var/lib/re8ch/agent-workspaces/re8ch-owner-pilot-20260825/re8ch-core; fi
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: mirrors, mountPath: /var/lib/re8ch/workspace-mirrors}
            - {name: worktrees, mountPath: /var/lib/re8ch/agent-workspaces}
        - name: sync-lock
          image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
          args: [--lock, /config/workspace.lock.yaml, --mirrors, /var/lib/re8ch/workspace-mirrors, --worktrees, /var/lib/re8ch/agent-workspaces, --memory-root, /srv/service-backend/catalogs, sync, re8ch-core]
          volumeMounts: &workspaceMounts
            - {name: mirrors, mountPath: /var/lib/re8ch/workspace-mirrors}
            - {name: worktrees, mountPath: /var/lib/re8ch/agent-workspaces}
            - {name: artifacts, mountPath: /srv/re8ch/agent-artifacts}
      containers:
        - name: materialize
          image: registry.re8ch.com/functions-shared/re8ch-workspace-controller@sha256:a2e4088bc1d313e5f2680f75499d1337252bb8a13bf9827446a077870c2682d9
          args: [--lock, /config/workspace.lock.yaml, --mirrors, /var/lib/re8ch/workspace-mirrors, --worktrees, /var/lib/re8ch/agent-workspaces, --memory-root, /srv/service-backend/catalogs, create, re8ch-owner-pilot-20260825, re8ch-core]
          volumeMounts: *workspaceMounts
      volumes:
        - {name: mirrors, hostPath: {path: /var/lib/re8ch/workspace-mirrors, type: DirectoryOrCreate}}
        - {name: worktrees, hostPath: {path: /var/lib/re8ch/agent-workspaces, type: DirectoryOrCreate}}
        - {name: artifacts, persistentVolumeClaim: {claimName: workspace-agent-artifacts}}
