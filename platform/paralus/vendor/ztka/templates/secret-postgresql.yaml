{{- if and .Values.deploy.postgresql.enable (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
  labels:
    {{- include "ztka.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
data:
  "password": {{ .Values.postgresql.auth.password | b64enc | quote }}
{{ end }}
