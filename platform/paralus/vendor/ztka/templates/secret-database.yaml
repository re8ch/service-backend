{{- if not .Values.deploy.postgresql.existingSecret }}
{{- $current := lookup "v1" "Secret" .Release.Namespace "paralus-db" -}}
{{- $dbCredential := randAlphaNum 48 -}}
{{- if and $current $current.data (index $current.data "DB_PASSWORD") -}}
{{- $dbCredential = (index $current.data "DB_PASSWORD" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: paralus-db
  labels:
    {{- include "ztka.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
data:
  DB_ADDR: {{ include "ztka.dbAddr" . | b64enc | quote }}
  DB_USER: {{ include "ztka.dbUser" . | b64enc | quote }}
  "DB_PASSWORD": {{ $dbCredential | b64enc | quote }}
  DB_NAME: {{ include "ztka.dbName" . | b64enc | quote }}
  DSN: {{ printf "postgres://%s:%s@%s-postgresql.%s.svc.cluster.local:5432/%s?sslmode=disable" .Values.postgresql.auth.username $dbCredential .Release.Name .Release.Namespace .Values.postgresql.auth.database | b64enc | quote }}
{{- end }}
