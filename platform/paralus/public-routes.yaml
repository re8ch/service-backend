apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paralus-console
  namespace: paralus
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: paralus-console-https}
  hostnames: [console.paralus.re8ch.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /auth}
        - path: {type: PathPrefix, value: /event}
        - path: {type: PathPrefix, value: /infra}
        - path: {type: PathPrefix, value: /v2/sentry}
      backendRefs: [{name: paralus, port: 11000}]
    - matches:
        - path: {type: PathPrefix, value: /v2/debug/prompt}
      backendRefs: [{name: prompt, port: 7009}]
    - matches:
        - path: {type: PathPrefix, value: /self-service}
      backendRefs: [{name: paralus-kratos-public, port: 80}]
    - backendRefs: [{name: dashboard, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: paralus-user, namespace: paralus}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: paralus-user-tls}
  hostnames: ["*.user.paralus.re8ch.com"]
  rules:
    - backendRefs: [{name: relay-server, port: 443}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata: {name: paralus-core-connector, namespace: paralus}
spec:
  parentRefs:
    - {name: re8ch-gateway-canary, namespace: kube-system, sectionName: paralus-connector-tls}
  hostnames: ["*.core-connector.paralus.re8ch.com"]
  rules:
    - backendRefs: [{name: relay-server, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paralus-public-dns-authority
  namespace: paralus
  labels: {public.re8ch.com/external-dns: enabled}
  annotations:
    networking.re8ch.com/dns-authority: public-edge
    networking.re8ch.com/selected-public-edge: restricted-node-6dc3f140f9
    external-dns.alpha.kubernetes.io/hostname: console.paralus.re8ch.com,*.user.paralus.re8ch.com,*.core-connector.paralus.re8ch.com
    external-dns.alpha.kubernetes.io/target: 192.0.2.138
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: external-dns-only
  rules:
    - host: console.paralus.re8ch.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: dashboard, port: {number: 80}}}
