apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paralus
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  releaseName: paralus
  targetNamespace: paralus
  storageNamespace: paralus
  chart:
    spec:
      chart: ./platform/paralus/vendor/ztka
      reconcileStrategy: ChartVersion
      sourceRef: {kind: GitRepository, name: service-backend, namespace: flux-system}
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  # Paralus is a control-plane access service. Keep all chart workloads
  # eligible for the three etcd/control-plane nodes; anti-affinity spreads the
  # stateless replicas while normal scheduler accounting keeps a pressured B1
  # from accepting work beyond its requests.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/control-plane: "true"
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: PreferNoSchedule}
                  - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
          - target: {kind: Deployment, name: paralus-kratos}
            patch: |-
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: 192.0.2.209
                    hostnames: [dex.re8ch.com]
          - target: {kind: StatefulSet}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/control-plane: "true"
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: PreferNoSchedule}
                  - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
          - target: {kind: Job}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeSelector
                value:
                  node-role.kubernetes.io/control-plane: "true"
              - op: add
                path: /spec/template/spec/tolerations
                value:
                  - {key: node-role.kubernetes.io/control-plane, operator: Equal, value: "true", effect: PreferNoSchedule}
                  - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
  values:
    replicaCount: 3
    fqdn:
      domain: paralus.re8ch.com
      hostname: console
      consoleHost: paralus.service.re8ch.com
      userSubdomain: "*.user"
      coreConnectorSubdomain: "*.core-connector"
    paralus:
      automigrate: true
      initialize:
        partner: RE8CH
        partnerDesc: RE8CH tenant access control plane
        partnerHost: paralus.service.re8ch.com
        org: RE8CH
        orgDesc: RE8CH platform tenants
        adminEmail: admin@re8ch.com
        adminFirstName: RE8CH
        adminLastName: Admin
    analytics: {enable: false}
    hooks: {enable: false}
    auditLogs: {storage: database}
    ingress: {enabled: false}
    deploy:
      contour: {enable: false}
      elasticsearch: {enable: false}
      filebeat: {enable: false}
      fluentbit: {enable: false}
      kratos: {enable: true}
      # Evaluation deployment: use the chart-owned database until Paralus is
      # accepted as the tenant access authority, then migrate it to Pigsty.
      postgresql: {enable: true}
    postgresql:
      auth:
        existingSecret: paralus-db
        password: ""
        secretKeys:
          userPasswordKey: DB_PASSWORD
      primary:
        nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        persistence:
          enabled: true
          storageClass: rbd-r640
          size: 20Gi
      readReplicas:
        replicaCount: 0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
    kratos:
      secret:
        nameOverride: paralus-db
      deployment:
        nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 500m, memory: 512Mi}
      statefulSet:
        nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
      job:
        nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/instance: paralus}
