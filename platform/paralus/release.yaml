apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paralus
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  releaseName: paralus
  targetNamespace: paralus
  storageNamespace: paralus
  chart:
    spec:
      chart: ./platform/paralus/vendor/ztka
      reconcileStrategy: ChartVersion
      sourceRef: {kind: GitRepository, name: service-backend, namespace: flux-system}
      interval: 10m
  install:
    createNamespace: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  # The control plane currently does not admit newly scheduled workloads.
  # Bind every workload emitted by this chart directly to restricted-node-6dc3f140f9 so kubelet can
  # take ownership without a scheduler placement decision.
  postRenderers:
    - kustomize:
        patches:
          - target: {kind: Deployment}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeName
                value: restricted-node-6dc3f140f9
          - target: {kind: Deployment, name: paralus-kratos}
            patch: |-
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: 192.0.2.213
                    hostnames: [dex.re8ch.com]
          - target: {kind: StatefulSet}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeName
                value: restricted-node-6dc3f140f9
          - target: {kind: Job}
            patch: |-
              - op: add
                path: /spec/template/spec/nodeName
                value: restricted-node-6dc3f140f9
  values:
    replicaCount: 2
    fqdn:
      domain: paralus.re8ch.com
      hostname: console
      consoleHost: paralus.service.re8ch.com
      userSubdomain: "*.user"
      coreConnectorSubdomain: "*.core-connector"
    paralus:
      automigrate: true
      initialize:
        partner: RE8CH
        partnerDesc: RE8CH tenant access control plane
        partnerHost: paralus.service.re8ch.com
        org: RE8CH
        orgDesc: RE8CH platform tenants
        adminEmail: admin@re8ch.com
        adminFirstName: RE8CH
        adminLastName: Admin
    analytics: {enable: false}
    hooks: {enable: false}
    auditLogs: {storage: database}
    ingress: {enabled: false}
    deploy:
      contour: {enable: false}
      elasticsearch: {enable: false}
      filebeat: {enable: false}
      fluentbit: {enable: false}
      kratos: {enable: true}
      # Evaluation deployment: use the chart-owned database until Paralus is
      # accepted as the tenant access authority, then migrate it to Pigsty.
      postgresql: {enable: true}
    postgresql:
      auth:
        existingSecret: paralus-db
        password: ""
        secretKeys:
          userPasswordKey: DB_PASSWORD
      primary:
        nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        persistence:
          enabled: true
          storageClass: rbd-r640
          size: 20Gi
      readReplicas:
        replicaCount: 0
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 1Gi}
    # Imported and edge nodes do not currently have authority to mint projected
    # ServiceAccount tokens for this namespace. Keep the identity control plane
    # on the authoritative restricted-node-6dc3f140f9 worker until that relationship is declared.
    nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
    kratos:
      secret:
        nameOverride: paralus-db
      deployment:
        nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 500m, memory: 512Mi}
      statefulSet:
        nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 300m, memory: 256Mi}
      job:
        nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app.kubernetes.io/instance: paralus}
