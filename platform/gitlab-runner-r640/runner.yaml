apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: r640-fallback-runner
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: r640-fallback-runner
  namespace: gitlab-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/attach", "pods/exec", "pods/log", "secrets", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: r640-fallback-runner
  namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: r640-fallback-runner
subjects:
  - kind: ServiceAccount
    name: r640-fallback-runner
    namespace: gitlab-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r640-fallback-runner
  namespace: gitlab-runner
  labels:
    app.kubernetes.io/name: gitlab-runner
    app.kubernetes.io/instance: r640-fallback
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-runner
      app.kubernetes.io/instance: r640-fallback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-runner
        app.kubernetes.io/instance: r640-fallback
    spec:
      serviceAccountName: r640-fallback-runner
      nodeSelector:
        kubernetes.io/hostname: restricted-node-6dc3f140f9
      initContainers:
        - name: render-config
          image: alpine:3.22
          command: ["/bin/sh", "-ec"]
          args:
            - |
              install -d -m 0700 /runner-config
              token="$(cat /runner-secret/runner-token)"
              sed "s|__RUNNER_TOKEN__|${token}|" /runner-template/config.toml > /runner-config/config.toml
              chmod 0600 /runner-config/config.toml
          volumeMounts:
            - name: runner-secret
              mountPath: /runner-secret
              readOnly: true
            - name: runner-template
              mountPath: /runner-template
              readOnly: true
            - name: runner-config
              mountPath: /runner-config
      containers:
        - name: runner
          image: gitlab/gitlab-runner:alpine-v19.3.0
          args: ["run", "--working-directory", "/home/gitlab-runner", "--config", "/home/gitlab-runner/.gitlab-runner/config.toml"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runner-config
              mountPath: /home/gitlab-runner/.gitlab-runner
      volumes:
        - name: runner-secret
          secret:
            secretName: r640-fallback-runner
        - name: runner-template
          configMap:
            name: r640-fallback-runner
        - name: runner-config
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: r640-fallback-runner
  namespace: gitlab-runner
data:
  config.toml: |
    concurrent = 2
    check_interval = 3
    shutdown_timeout = 30

    [[runners]]
      name = "r640-service-backend-fallback"
      url = "https://gitlab.com"
      token = "__RUNNER_TOKEN__"
      executor = "kubernetes"
      request_concurrency = 2
      environment = [
        "HTTP_PROXY=http://192.0.2.183:17891",
        "HTTPS_PROXY=http://192.0.2.183:17891",
        "http_proxy=http://192.0.2.183:17891",
        "https_proxy=http://192.0.2.183:17891",
        "NO_PROXY=127.0.0.1,localhost,.svc,.cluster.local,192.0.2.203/8,registry.re8ch.com,gitlab.com,.gitlab.com,.gitlab-static.net,mirrors.aliyun.com",
        "no_proxy=127.0.0.1,localhost,.svc,.cluster.local,192.0.2.203/8,registry.re8ch.com,gitlab.com,.gitlab.com,.gitlab-static.net,mirrors.aliyun.com"
      ]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        service_account = "r640-fallback-runner"
        image = "python:3.12-alpine"
        poll_timeout = 600
        cpu_request = "100m"
        memory_request = "128Mi"
        cpu_limit = "4"
        memory_limit = "8Gi"
        [runners.kubernetes.node_selector]
          "kubernetes.io/hostname" = "restricted-node-6dc3f140f9"
