apiVersion: v1
kind: ServiceAccount
metadata: {name: dex-artchais-reconciler, namespace: dex}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dex-artchais-reconciler, namespace: dex}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dex-config, dex-config-pre-ai-operations-v2]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [dex]
    verbs: [get, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dex-artchais-reconciler, namespace: dex}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dex-artchais-reconciler}
subjects: [{kind: ServiceAccount, name: dex-artchais-reconciler, namespace: dex}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dex-artchais-reconciler-v1, namespace: dex}
data:
  register.sh: |
    #!/usr/bin/env sh
    set -eu
    workdir=$(mktemp -d)
    trap 'rm -rf "$workdir"' EXIT HUP INT TERM
    kubectl -n dex get secret dex-config -o jsonpath='{.data.config\.yaml}' | base64 -d >"$workdir/config.yaml"
    CONFIG_PATH="$workdir/config.yaml" python3 - <<'PY'
    import os
    from pathlib import Path
    import yaml
    path = Path(os.environ["CONFIG_PATH"])
    config = yaml.safe_load(path.read_text())
    desired = {"re8ch-artchais-tenant": "RE8CH Artchais Tenant"}
    clients = config.setdefault("staticClients", [])
    by_id = {item.get("id"): item for item in clients}
    for client_id, name in desired.items():
        client = by_id.get(client_id)
        if client is None:
            client = {"id": client_id}
            clients.append(client)
        client.update({"name": name, "public": True})
        client.pop("secret", None)
        client.pop("redirectURIs", None)
    github = next((item for item in config.get("connectors", []) if item.get("type") == "github"), None)
    if github is None:
        raise SystemExit("existing Dex GitHub connector is required")
    github_config = github.setdefault("config", {})
    github_config["teamNameField"] = "slug"
    orgs = github_config.setdefault("orgs", [])
    artchais = next((item for item in orgs if isinstance(item, dict) and str(item.get("name", "")).lower() == "artchais"), None)
    if artchais is None:
        artchais = {"name": "Artchais", "teams": []}
        orgs.append(artchais)
    teams = artchais.setdefault("teams", [])
    for team in ("tenant-admins", "tenant-operators", "tenant-viewers"):
        if team not in teams:
            teams.append(team)
    path.write_text(yaml.safe_dump(config, sort_keys=False))
    PY
    kubectl -n dex get secret dex-config -o json | jq '
      .metadata={name:"dex-config-pre-ai-operations-v2",namespace:.metadata.namespace} |
      del(.metadata.creationTimestamp,.metadata.resourceVersion,.metadata.uid,.metadata.managedFields,.metadata.ownerReferences)' |
      kubectl apply -f - >/dev/null
    kubectl -n dex create secret generic dex-config --from-file=config.yaml="$workdir/config.yaml" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
    kubectl -n dex rollout restart deployment/dex
    kubectl -n dex rollout status deployment/dex --timeout=180s
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dex-artchais-reconciler-v1
  namespace: dex
  labels: {app.kubernetes.io/part-of: connectool, tenancy.re8ch.com/tenant: artchais}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app: dex-artchais-reconciler}}
    spec:
      serviceAccountName: dex-artchais-reconciler
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      automountServiceAccountToken: true
      containers:
        - name: reconcile
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [/scripts/register.sh]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: dex-artchais-reconciler-v1, defaultMode: 0555}
        - {name: work, emptyDir: {sizeLimit: 16Mi}}
