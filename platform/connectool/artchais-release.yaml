apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: connectool-artchais, namespace: flux-system}
spec:
  interval: 10m
  releaseName: connectool-artchais
  targetNamespace: connectool
  storageNamespace: connectool
  chartRef: {kind: OCIRepository, name: connectool}
  install: {createNamespace: true, remediation: {retries: 3}}
  upgrade: {cleanupOnFail: true, remediation: {retries: 3, strategy: rollback}}
  rollback: {cleanupOnFail: true}
  values:
    global:
      issuer: https://dex.re8ch.com
      scopes: [openid, profile, email, groups, offline_access]
    dex:
      contract: {enabled: true, namespace: dex, configMapName: connectool-artchais-dex-clients}
    toolhive:
      namespace: toolhive-system
      registry: {enabled: false, name: approved, sources: [], release: {enabled: false}}
      sessionStorage:
        provider: redis
        address: toolhive-auth-redis.toolhive-system.svc.cluster.local:6379
        passwordSecretRef: {name: toolhive-auth-redis, key: password}
      publications:
        - name: artchais-tenant-vmcp
          clientId: re8ch-artchais-tenant
          resourceUrl: https://tools.re8ch.com/tenant/artchais/mcp
          group: artchais-tenant-public
          replicas: 2
          session: {database: 4, keyPrefix: "thv:artchais:"}
          workloads: [{name: artchais-tenant-runtime}]
          authorization:
            groupClaim: groups
            policies:
              - 'permit(principal in THVGroup::"Artchais:tenant-admins", action, resource);'
              - 'permit(principal in THVGroup::"Artchais:tenant-operators", action, resource);'
              - 'permit(principal in THVGroup::"Artchais:tenant-viewers", action, resource);'
    codex:
      marketplace: {name: re8ch-cloud-tenant, displayName: RE8CH Cloud Tenant, source: https://github.com/re8ch/codex-cloud-tenant-plugins.git}
      plugins:
        - {name: re8ch-artchais-tenant, publication: artchais-tenant-vmcp, category: Developer Tools, mcpOwner: true, skills: [skills/artchais-tenant/SKILL.md]}
