apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: connectool, namespace: flux-system}
spec:
  interval: 1m
  provider: generic
  url: oci://ghcr.io/among-clusters/charts/connectool
  ref: {tag: "0.6.1"}
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/among-clusters/connectool/\.github/workflows/release\.yaml@refs/tags/v0\.6\.1$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: connectool, namespace: flux-system}
spec:
  interval: 1m
  releaseName: connectool
  targetNamespace: connectool
  storageNamespace: connectool
  chartRef: {kind: OCIRepository, name: connectool}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    global:
      issuer: https://auth.re8ch.com
      scopes: [openid, profile, email, groups, offline_access]
    dex:
      contract: {enabled: false, namespace: dex, configMapName: connectool-dex-clients}
    distribution:
      updated: "2026-09-23"
      channels:
        - {id: openai-private, surfaces: [ChatGPT, ChatGPT Work, Codex], entryClass: self-service, status: package-ready, integration: agent-plugin, publication: re8ch-tools-vmcp, artifact: .agents/plugins/marketplace.json, detail: "Portable Agent Plugin packages are ready; ChatGPT developer mode creates the account-local MCP registration.", documentation: https://developers.openai.com/plugins/build/plugins}
        - {id: openai-public, surfaces: [ChatGPT, Codex], entryClass: official-review, status: review-required, integration: universal-plugin-directory, publication: re8ch-tools-vmcp, detail: "Verified developer identity, reviewer credentials and OpenAI approval are required.", documentation: https://developers.openai.com/plugins/deploy/submission}
        - {id: anthropic-custom-connector, surfaces: [Claude, Claude Desktop, Cowork], entryClass: self-service, status: oauth-registration-required, integration: remote-mcp, publication: re8ch-tools-vmcp, detail: "An owner can add the URL directly; the platform OAuth callback must be registered before sign-in.", documentation: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp}
        - {id: anthropic-private-plugin, surfaces: [Claude, Claude Code, Cowork], entryClass: self-service, status: package-ready, integration: claude-marketplace, publication: re8ch-tools-vmcp, artifact: .claude-plugin/marketplace.json, detail: "Install from the repository or synchronize the private organization marketplace.", documentation: https://code.claude.com/docs/en/plugin-marketplaces}
        - {id: anthropic-public, surfaces: [Claude, Claude Code, Cowork], entryClass: official-review, status: review-required, integration: connector-and-community-directories, publication: re8ch-tools-vmcp, detail: "Connector and community plugin listings require separate Anthropic reviews.", documentation: https://support.anthropic.com/en/articles/11596036-anthropic-mcp-directory-faq}
        - {id: cursor-team, surfaces: [Cursor IDE, Cursor CLI], entryClass: self-service, status: package-ready, integration: team-marketplace, publication: re8ch-tools-vmcp, artifact: .cursor-plugin/marketplace.json, detail: "Team and Enterprise admins can import the private plugin repository.", documentation: https://prod.cursor.com/docs/plugins}
        - {id: cursor-public, surfaces: [Cursor IDE, Cursor CLI], entryClass: official-review, status: blocked-private-source, integration: cursor-marketplace, publication: re8ch-tools-vmcp, detail: "A public open-source repository and Cursor review are required.", documentation: https://prod.cursor.com/docs/reference/plugins}
        - {id: workbuddy, surfaces: [WorkBuddy], entryClass: official-review, status: oauth-registration-required, integration: mcp-connector, publication: re8ch-tools-vmcp, artifact: distribution/workbuddy, detail: "Connector bundles are ready; server-side OAuth and publication require WorkBuddy coordination.", documentation: https://open.workbuddy.cn/docs/connector}
        - {id: coze-custom, surfaces: [Coze web, Coze desktop], entryClass: self-service, status: oauth-registration-required, integration: custom-mcp, publication: re8ch-tools-vmcp, artifact: distribution/coze/mcp.json, detail: "The MCP JSON is importable; Coze OAuth callback registration is still required.", documentation: https://docs.coze.cn/mcp}
        - {id: coze-team-store, surfaces: [Coze team, Coze enterprise], entryClass: self-service, status: admin-review-optional, integration: team-mcp-store, publication: re8ch-tools-vmcp, artifact: distribution/coze/mcp.json, detail: "Creator publication is direct unless the organization enables MCP review.", documentation: https://docs.coze.cn/mcp}
        - {id: doubao, surfaces: [Doubao], entryClass: unavailable, status: new-publication-unavailable, integration: coze-publish-channel, detail: "Coze removed new Doubao publication on 2026-07-01; existing publications are unaffected.", documentation: https://docs.coze.cn/recent-updates}
    toolhive:
      namespace: toolhive-system
      placement:
        nodeSelector:
          scheduling.re8ch.com/pool-service-core-local: "true"
          scheduling.re8ch.com/network-serving: "true"
        affinity: {}
        tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
        topologySpreadConstraints: []
        hostAliases:
          - {ip: "192.0.2.213", hostnames: [id-stalwart.tools.re8ch.com, auth.re8ch.com]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      runtimePolicy:
        # Compatibility layer for operator-generated children in chart 0.5.2.
        # service-core-r640 is the desired-state authority; this hostname is
        # retained until the chart can consume the projected pool selector.
        enabled: true
        nodeNames: [restricted-node-6dc3f140f9]
        trafficDistribution: PreferSameNode
        backendSessionAffinity: None
        proxyResources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        rollout: {maxUnavailable: 1, maxSurge: 0, progressDeadlineSeconds: 180}
      registry:
        enabled: true
        name: approved
        sources:
          - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
          - {name: re8ch-managed, managed: {}}
        release:
          enabled: true
          version: 1.5.0
          sourceNamespace: flux-system
          values:
            # The registry database and available core-node capacity are both
            # single-site. A second replica cannot be scheduled safely here.
            replicaCount: 1
            image:
              registryServerUrl: ghcr.io/stacklok/thv-registry-api:v1.5.0
              pullPolicy: IfNotPresent
            service: {type: ClusterIP, port: 8080, exposeInternalPort: true, internalPort: 8081}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
            rbac: {scope: namespace, allowedNamespaces: [toolhive-system]}
            config:
              sources:
                - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
                - {name: re8ch-managed, managed: {}}
              registries:
                - {name: approved, sources: [managed-workloads, re8ch-managed]}
              database: {host: postgresql.mcp-registry.svc.cluster.local, port: 5432, user: mcpregistry, migrationUser: mcpregistry, database: toolhive-registry, sslMode: disable, maxOpenConns: 10}
              auth: {mode: anonymous}
              audit: {enabled: true}
              telemetry: {enabled: false, serviceName: re8ch-toolhive-registry, insecure: true, tracing: {enabled: false, sampling: 0.1}, metrics: {enabled: false}}
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - {key: scheduling.re8ch.com/pool-service-core-r640, operator: In, values: ["true"]}
                        - {key: scheduling.re8ch.com/network-serving, operator: In, values: ["true"]}
            tolerations:
              - {key: node-role.kubernetes.io/control-plane, operator: Exists}
              - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
            extraEnv:
              - name: THV_REGISTRY_DATABASE_PASSWORD
                valueFrom: {secretKeyRef: {name: toolhive-registry-database, key: migration-password}}
              - name: THV_REGISTRY_DATABASE_MIGRATIONPASSWORD
                valueFrom: {secretKeyRef: {name: toolhive-registry-database, key: migration-password}}
      sessionStorage:
        provider: memory
        sessionAffinity: ClientIP
      sessionRouting:
        enabled: true
        replicas: 2
        image:
          repository: registry.re8ch.com/functions-shared/connectool-session-router
          tag: "0.6.0-amd64"
          digest: "sha256:df1a3def6fcf05916e5fce18d5147e3ff5e1804780060b9da54de7c571e5359a"
          pullPolicy: IfNotPresent
        listenPort: 8080
        servicePort: 4483
        backendPort: 4483
        sessionHeader: Mcp-Session-Id
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      publications:
        - name: re8ch-tools-vmcp
          clientId: re8ch-cloud-platform-tool
          resourceUrl: https://tools.service.re8ch.com/cloud/mcp
          group: platform-tools-public
          createGroup: false
          replicas: 1
          allowSingleReplicaWhenCapacityLimited: true
          workloads:
            - {name: ops-observe-vmcp-internal, toolConfigRef: ops-public-read-tools}
            - {name: ops-operate-vmcp-internal, toolConfigRef: ops-operate-tools}
          outgoingAuth:
            source: inline
            default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-observe-backend-auth}}
            backends:
              ops-observe-vmcp-internal: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-observe-backend-auth}}
              ops-operate-vmcp-internal: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-admin-backend-auth}}
          operational:
            failureHandling:
              partialFailureMode: best_effort
              healthCheckInterval: 30s
              healthCheckTimeout: 10s
              unhealthyThreshold: 3
              circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}
          authorization:
            groupClaim: groups
            policies:
              - 'permit(principal in THVGroup::"re8ch:k8s-admins", action, resource);'
              - 'permit(principal in THVGroup::"re8ch:qwen-operators", action, resource);'
              - 'forbid(principal, action == Action::"call_tool", resource == Tool::"restart_managed_platform_deployment") unless { principal in THVGroup::"re8ch:qwen-operators" || principal in THVGroup::"re8ch:k8s-admins" };'
        - name: re8ch-admin-vmcp
          clientId: re8ch-platform-admin
          resourceUrl: https://admin.re8ch.com:8443/mcp
          group: platform-admin-public
          createGroup: false
          replicas: 1
          allowSingleReplicaWhenCapacityLimited: true
          workloads:
            - {name: ops-admin-vmcp-internal, toolConfigRef: ops-admin-tools}
            - {name: admin-api-backend}
          outgoingAuth:
            source: inline
            default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-admin-backend-auth}}
            backends:
              admin-api-backend: {type: externalAuthConfigRef, externalAuthConfigRef: {name: admin-vmcp-backend-auth}}
          operational:
            failureHandling:
              partialFailureMode: best_effort
              healthCheckInterval: 30s
              healthCheckTimeout: 10s
              unhealthyThreshold: 3
              circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}
          authorization:
            groupClaim: groups
            policies:
              - 'permit(principal in THVGroup::"re8ch:k8s-admins", action, resource);'
        - name: tenant-vmcp
          clientId: re8ch-tenant
          resourceUrl: https://tools.service.re8ch.com/tenant/mcp
          group: tenant-public
          createGroup: true
          replicas: 1
          allowSingleReplicaWhenCapacityLimited: true
          workloads:
            - {name: tenant-api-backend}
          outgoingAuth:
            source: inline
            default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: tenant-vmcp-backend-auth}}
          operational:
            # tenant-api-backend is request/response only and does not service
            # ToolHive's standalone list_changed notification stream. Excluding
            # only this backend keeps session initialization live without
            # removing tool aggregation or tool calls.
            listChanged: {disabledWorkloads: [tenant-api-backend]}
            failureHandling:
              partialFailureMode: best_effort
              healthCheckInterval: 30s
              healthCheckTimeout: 10s
              unhealthyThreshold: 3
              circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}
          authorization:
            groupClaim: groups
            policies:
              # The backend resolves the caller to exactly one tenant and
              # applies TenantGrant authorization before executing any tool.
              - 'permit(principal, action, resource);'
    codex:
      marketplace: {name: re8ch-admin-private, displayName: RE8CH Admin Private, source: https://github.com/re8ch/codex-admin-plugins.git}
      plugins:
        - {name: re8ch-cloud-platform-tool, publication: re8ch-tools-vmcp, category: Productivity, mcpOwner: true, skills: [skills/cloud-platform/SKILL.md]}
        - {name: re8ch-cluster-infra-tool, publication: re8ch-tools-vmcp, category: Productivity, mcpOwner: false, skills: [skills/cluster-infra/SKILL.md]}
        - {name: re8ch-agent-orchestra-collab, publication: re8ch-tools-vmcp, category: Productivity, mcpOwner: false, skills: [skills/agent-orchestra/SKILL.md]}
        - {name: re8ch-platform-admin, publication: re8ch-admin-vmcp, category: Productivity, mcpOwner: true, skills: []}
        - {name: re8ch-tenant-admin, publication: re8ch-admin-vmcp, category: Productivity, mcpOwner: false, skills: [skills/tenant-admin/SKILL.md]}
        - {name: re8ch-tenant, publication: tenant-vmcp, category: Productivity, mcpOwner: true, skills: []}
