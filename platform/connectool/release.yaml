apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: connectool, namespace: flux-system}
spec:
  interval: 1m
  provider: generic
  url: oci://ghcr.io/among-clusters/charts/connectool
  ref: {tag: "0.6.2"}
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/among-clusters/connectool/\.github/workflows/release\.yaml@refs/tags/v0\.6\.2$
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: connectool, namespace: flux-system}
spec:
  interval: 1m
  releaseName: connectool
  targetNamespace: connectool
  storageNamespace: connectool
  chartRef: {kind: OCIRepository, name: connectool}
  install:
    createNamespace: true
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  # The trusted issuer is pinned to the Cilium Gateway VIP inside these pods.
  # ToolHive otherwise rejects OIDC discovery at that private address.
  postRenderers:
    - kustomize:
        patches:
          - target: {group: toolhive.stacklok.dev, version: v1beta1, kind: MCPOIDCConfig, name: re8ch-native-issuer}
            patch: |-
              - op: replace
                path: /spec/inline/issuer
                value: https://db-rw.re8ch.com/auth/v1
              - op: add
                path: /spec/inline/jwksAllowPrivateIP
                value: true
          - target: {group: toolhive.stacklok.dev, version: v1beta1, kind: VirtualMCPServer, name: re8ch-native}
            patch: |-
              - op: replace
                path: /spec/incomingAuth/oidcConfigRef/audience
                value: authenticated
              - op: replace
                path: /spec/incomingAuth/oidcConfigRef/scopes
                value: [openid, profile, email, offline_access]
  values:
    global:
      issuer: https://db-rw.re8ch.com/auth/v1
      scopes: [openid, profile, email, offline_access]
    dex:
      contract: {enabled: false, namespace: dex, configMapName: connectool-dex-clients}
    distribution:
      updated: "2026-09-23"
      channels:
        - {id: openai-private, surfaces: [ChatGPT, ChatGPT Work, Codex], entryClass: self-service, status: package-ready, integration: agent-plugin, publication: re8ch-native, artifact: .agents/plugins/marketplace.json, detail: "Portable Agent Plugin packages are ready; ChatGPT developer mode creates the account-local MCP registration.", documentation: https://developers.openai.com/plugins/build/plugins}
        - {id: openai-public, surfaces: [ChatGPT, Codex], entryClass: official-review, status: review-required, integration: universal-plugin-directory, publication: re8ch-native, detail: "Verified developer identity, reviewer credentials and OpenAI approval are required.", documentation: https://developers.openai.com/plugins/deploy/submission}
        - {id: anthropic-custom-connector, surfaces: [Claude, Claude Desktop, Cowork], entryClass: self-service, status: oauth-registration-required, integration: remote-mcp, publication: re8ch-native, detail: "An owner can add the URL directly; the platform OAuth callback must be registered before sign-in.", documentation: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp}
        - {id: anthropic-private-plugin, surfaces: [Claude, Claude Code, Cowork], entryClass: self-service, status: package-ready, integration: claude-marketplace, publication: re8ch-native, artifact: .claude-plugin/marketplace.json, detail: "Install from the repository or synchronize the private organization marketplace.", documentation: https://code.claude.com/docs/en/plugin-marketplaces}
        - {id: anthropic-public, surfaces: [Claude, Claude Code, Cowork], entryClass: official-review, status: review-required, integration: connector-and-community-directories, publication: re8ch-native, detail: "Connector and community plugin listings require separate Anthropic reviews.", documentation: https://support.anthropic.com/en/articles/11596036-anthropic-mcp-directory-faq}
        - {id: cursor-team, surfaces: [Cursor IDE, Cursor CLI], entryClass: self-service, status: package-ready, integration: team-marketplace, publication: re8ch-native, artifact: .cursor-plugin/marketplace.json, detail: "Team and Enterprise admins can import the private plugin repository.", documentation: https://prod.cursor.com/docs/plugins}
        - {id: cursor-public, surfaces: [Cursor IDE, Cursor CLI], entryClass: official-review, status: blocked-private-source, integration: cursor-marketplace, publication: re8ch-native, detail: "A public open-source repository and Cursor review are required.", documentation: https://prod.cursor.com/docs/reference/plugins}
        - {id: workbuddy, surfaces: [WorkBuddy], entryClass: official-review, status: oauth-registration-required, integration: mcp-connector, publication: re8ch-native, artifact: distribution/workbuddy, detail: "Connector bundles are ready; server-side OAuth and publication require WorkBuddy coordination.", documentation: https://open.workbuddy.cn/docs/connector}
        - {id: coze-custom, surfaces: [Coze web, Coze desktop], entryClass: self-service, status: oauth-registration-required, integration: custom-mcp, publication: re8ch-native, artifact: distribution/coze/mcp.json, detail: "The MCP JSON is importable; Coze OAuth callback registration is still required.", documentation: https://docs.coze.cn/mcp}
        - {id: coze-team-store, surfaces: [Coze team, Coze enterprise], entryClass: self-service, status: admin-review-optional, integration: team-mcp-store, publication: re8ch-native, artifact: distribution/coze/mcp.json, detail: "Creator publication is direct unless the organization enables MCP review.", documentation: https://docs.coze.cn/mcp}
        - {id: doubao, surfaces: [Doubao], entryClass: unavailable, status: new-publication-unavailable, integration: coze-publish-channel, detail: "Coze removed new Doubao publication on 2026-07-01; existing publications are unaffected.", documentation: https://docs.coze.cn/recent-updates}
    toolhive:
      namespace: toolhive-system
      placement:
        nodeSelector:
          scheduling.re8ch.com/pool-service-core-r640: "true"
          scheduling.re8ch.com/network-serving: "true"
        affinity: {}
        tolerations:
          - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
        topologySpreadConstraints: []
        hostAliases:
          - {ip: "10.251.0.4", hostnames: [id.re8ch.com, auth.re8ch.com]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      runtimePolicy:
        # Compatibility layer for operator-generated children in chart 0.5.2.
        # service-core-r640 is the desired-state authority; this hostname is
        # retained until the chart can consume the projected pool selector.
        enabled: true
        nodeNames: [r640]
        trafficDistribution: PreferSameNode
        backendSessionAffinity: None
        proxyResources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        rollout: {maxUnavailable: 1, maxSurge: 0, progressDeadlineSeconds: 180}
      registry:
        enabled: true
        name: approved
        sources:
          - name: re8ch-unified
            file: {path: /etc/re8ch-approved-catalog/registry.json}
            syncPolicy: {interval: 1m}
        release:
          enabled: true
          version: 1.5.0
          sourceNamespace: flux-system
          values:
            # The registry database and available core-node capacity are both
            # single-site. A second replica cannot be scheduled safely here.
            replicaCount: 1
            image:
              registryServerUrl: ghcr.io/stacklok/thv-registry-api:v1.5.0
              pullPolicy: IfNotPresent
            service: {type: ClusterIP, port: 8080, exposeInternalPort: true, internalPort: 8081}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
            rbac: {scope: namespace, allowedNamespaces: [toolhive-system]}
            extraVolumes:
              - name: re8ch-approved-catalog
                configMap: {name: re8ch-approved-tool-catalog}
            extraVolumeMounts:
              - {name: re8ch-approved-catalog, mountPath: /etc/re8ch-approved-catalog, readOnly: true}
            config:
              sources:
                - name: re8ch-unified
                  file: {path: /etc/re8ch-approved-catalog/registry.json}
                  syncPolicy: {interval: 1m}
              registries:
                - {name: approved, sources: [re8ch-unified]}
              # One bounded plugin catalog includes both native inventory and tool schemas.
              database: {host: postgresql.mcp-registry.svc.cluster.local, port: 5432, user: mcpregistry, migrationUser: mcpregistry, database: toolhive-registry, sslMode: disable, maxOpenConns: 10, maxMetaSize: 1048576}
              auth: {mode: anonymous}
              audit: {enabled: true}
              telemetry: {enabled: false, serviceName: re8ch-toolhive-registry, insecure: true, tracing: {enabled: false, sampling: 0.1}, metrics: {enabled: false}}
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - {key: scheduling.re8ch.com/pool-service-core-r640, operator: In, values: ["true"]}
                        - {key: scheduling.re8ch.com/network-serving, operator: In, values: ["true"]}
            tolerations:
              - {key: node-role.kubernetes.io/control-plane, operator: Exists}
              - {key: scheduling.re8ch.com/capacity-window, operator: Equal, value: closed, effect: NoSchedule}
            extraEnv:
              - name: THV_REGISTRY_DATABASE_PASSWORD
                valueFrom: {secretKeyRef: {name: toolhive-registry-database, key: migration-password}}
              - name: THV_REGISTRY_DATABASE_MIGRATIONPASSWORD
                valueFrom: {secretKeyRef: {name: toolhive-registry-database, key: migration-password}}
      sessionStorage:
        provider: memory
        sessionAffinity: ClientIP
      sessionRouting:
        enabled: true
        replicas: 1
        image:
          repository: registry.re8ch.com/functions-shared/connectool-session-router
          tag: "0.6.0-amd64"
          digest: "sha256:df1a3def6fcf05916e5fce18d5147e3ff5e1804780060b9da54de7c571e5359a"
          pullPolicy: IfNotPresent
        listenPort: 8080
        servicePort: 4483
        backendPort: 4483
        sessionHeader: Mcp-Session-Id
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      publications:
        - name: re8ch-native
          clientId: 2981225a-da08-5aaa-9e84-8fd151696113
          resourceUrl: https://tools.service.re8ch.com/tenant-native/mcp
          group: tenant-public
          createGroup: true
          replicas: 1
          allowSingleReplicaWhenCapacityLimited: true
          workloads:
            - {name: tenant-api-backend}
          outgoingAuth:
            source: inline
            default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: tenant-vmcp-backend-auth}}
          operational:
            # tenant-api-backend is request/response only and does not service
            # ToolHive's standalone list_changed notification stream. Excluding
            # only this backend keeps session initialization live without
            # removing tool aggregation or tool calls.
            listChanged: {disabledWorkloads: [tenant-api-backend]}
            failureHandling:
              partialFailureMode: best_effort
              healthCheckInterval: 30s
              healthCheckTimeout: 10s
              unhealthyThreshold: 3
              # This backend exchanges the authenticated caller's token. ToolHive's
              # background health probe has no caller token and can legitimately get
              # invalid_token; it must not open a breaker that blocks valid user calls.
              circuitBreaker: {enabled: false, failureThreshold: 5, timeout: 1m}
          authorization:
            groupClaim: groups
            policies:
              # The backend resolves the caller to exactly one tenant and
              # applies tenant identity and role authorization before executing any tool.
              - 'permit(principal, action, resource);'
    codex:
      marketplace: {name: re8ch-admin-private, displayName: RE8CH Admin Private, source: https://github.com/re8ch-ai/codex-admin-plugins.git}
      plugins:
        - {name: re8ch, publication: re8ch-native, category: Productivity, mcpOwner: true, skills: []}
