apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: toolhive-operator-crds, namespace: flux-system}
spec:
  interval: 1h
  provider: generic
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator-crds
  ref: {tag: "0.41.0"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: toolhive-operator-crds, namespace: flux-system}
spec:
  interval: 30m
  releaseName: toolhive-crds
  targetNamespace: default
  storageNamespace: default
  chartRef: {kind: OCIRepository, name: toolhive-operator-crds}
  install:
    crds: CreateReplace
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 1h
  provider: generic
  url: oci://ghcr.io/stacklok/toolhive/toolhive-operator
  ref: {tag: "0.41.0"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: toolhive-operator, namespace: flux-system}
spec:
  interval: 30m
  releaseName: toolhive-operator
  targetNamespace: toolhive-system
  storageNamespace: toolhive-system
  chartRef: {kind: OCIRepository, name: toolhive-operator}
  dependsOn:
    - {name: toolhive-operator-crds, namespace: flux-system}
  install:
    disableTakeOwnership: false
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    disableTakeOwnership: false
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    operator:
      replicaCount: 2
      features:
        experimental: false
        storageVersionMigrator: false
      image: ghcr.io/stacklok/toolhive/operator:v0.41.0
      toolhiveRunnerImage: ghcr.io/stacklok/toolhive/proxyrunner:v0.41.0
      vmcpImage: ghcr.io/stacklok/toolhive/vmcp:v0.41.0
      env:
        - {name: TOOLHIVE_SKIP_UPDATE_CHECK, value: "true"}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      rbac:
        scope: namespace
        allowedNamespaces: [toolhive-system]
      serviceAccount: {create: true, name: toolhive-operator}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: toolhive-operator}
              topologyKey: kubernetes.io/hostname
