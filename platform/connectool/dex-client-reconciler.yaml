apiVersion: v1
kind: ServiceAccount
metadata: {name: dex-client-reconciler, namespace: dex}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dex-client-reconciler, namespace: dex}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [connectool-dex-clients, dex-identity-reconciler, grafana-dex-client]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dex-config, dex-config-pre-tenant-publication-v1, paralus-oidc-client]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [dex]
    verbs: [get, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dex-client-reconciler, namespace: dex}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dex-client-reconciler}
subjects: [{kind: ServiceAccount, name: dex-client-reconciler, namespace: dex}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dex-identity-reconciler, namespace: dex}
data:
  reconcile.py: |
    import base64
    import copy
    import json
    import logging
    import ssl
    import time
    import urllib.error
    import urllib.request
    import yaml

    logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

    api = "https://kubernetes.default.svc"
    token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
    context = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    def request(path, method="GET", body=None, content_type="application/json"):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(api + path, data=data, method=method, headers={
            "Authorization": "Bearer " + token,
            "Content-Type": content_type,
        })
        with urllib.request.urlopen(req, context=context, timeout=20) as response:
            return json.load(response)

    contract = None
    for attempt in range(60):
        try:
            obj = request("/api/v1/namespaces/dex/configmaps/connectool-dex-clients")
            contract = yaml.safe_load(obj["data"]["clients.yaml"])
            break
        except (urllib.error.HTTPError, urllib.error.URLError, KeyError) as exc:
            logging.warning("waiting for ConnecTool Dex contract (%s/60): %s", attempt + 1, exc)
            time.sleep(5)
    if contract is None:
        raise RuntimeError("ConnecTool Dex contract could not be read")

    secret = request("/api/v1/namespaces/dex/secrets/dex-config")
    config = yaml.safe_load(base64.b64decode(secret["data"]["config.yaml"]))
    original = copy.deepcopy(config)
    desired = {item["id"]: item for item in contract.get("staticClients", [])}
    retired = {
        "re8ch-qwen-tenant", "re8ch-tenant-admin", "re8ch-tenant-registry",
        "re8ch-tenant-observability", "re8ch-tenant-byoc", "re8ch-artchais-tenant",
    }
    clients = [item for item in config.setdefault("staticClients", []) if item.get("id") not in retired]
    by_id = {item.get("id"): item for item in clients}
    for client_id, contract_client in desired.items():
        client = by_id.get(client_id)
        if client is None:
            client = {"id": client_id}
            clients.append(client)
        client.update({"name": contract_client["name"], "public": True})
        client.pop("secret", None)
        client.pop("redirectURIs", None)
    try:
        grafana_obj = request("/api/v1/namespaces/dex/configmaps/grafana-dex-client")
        grafana_client = yaml.safe_load(grafana_obj["data"]["client.yaml"])
        client = by_id.get(grafana_client["id"])
        if client is None:
            client = {"id": grafana_client["id"]}
            clients.append(client)
        client.update(grafana_client)
        client.pop("secret", None)
    except (urllib.error.HTTPError, urllib.error.URLError, KeyError) as exc:
        logging.warning("Grafana Dex client contract is not ready: %s", exc)
    try:
        paralus_obj = request("/api/v1/namespaces/dex/secrets/paralus-oidc-client")
        paralus_secret = base64.b64decode(paralus_obj["data"]["clientSecret"]).decode()
        paralus_client = {
            "id": "paralus-service",
            "name": "Paralus service",
            "secret": paralus_secret,
            "redirectURIs": ["https://paralus.service.re8ch.com/self-service/methods/oidc/callback/re8ch-dex"],
        }
        client = by_id.get(paralus_client["id"])
        if client is None:
            client = {"id": paralus_client["id"]}
            clients.append(client)
        client.update(paralus_client)
    except (urllib.error.HTTPError, urllib.error.URLError, KeyError) as exc:
        logging.warning("Paralus Dex client secret is not ready: %s", exc)
    config["staticClients"] = clients
    github = next((item for item in config.get("connectors", []) if item.get("type") == "github"), None)
    if github is None:
        raise RuntimeError("the canonical GitHub connector is missing")
    github_config = github.setdefault("config", {})
    github_config["teamNameField"] = "slug"
    # Authentication discovers identity; publications and TenantIdentityBinding
    # decide access. orgs/teams filtering suppresses bare organization claims
    # and prevents members without a role team from enrolling as tenants.
    github_config.pop("org", None)
    github_config.pop("orgs", None)
    github_config["loadAllGroups"] = True
    if config == original:
        logging.info("Dex clients and canonical GitHub group claims already match desired state")
        raise SystemExit(0)
    backup = {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "dex-config-pre-tenant-publication-v1", "namespace": "dex"}, "type": secret.get("type", "Opaque"), "data": secret["data"]}
    try:
        request("/api/v1/namespaces/dex/secrets", "POST", backup)
    except urllib.error.HTTPError as exc:
        if exc.code != 409:
            raise
    encoded = base64.b64encode(yaml.safe_dump(config, sort_keys=False).encode()).decode()
    request("/api/v1/namespaces/dex/secrets/dex-config", "PATCH", {"data": {"config.yaml": encoded}}, "application/merge-patch+json")
    restarted_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
    request("/apis/apps/v1/namespaces/dex/deployments/dex", "PATCH", {"spec": {"template": {"metadata": {"annotations": {"kubectl.kubernetes.io/restartedAt": restarted_at}}}}}, "application/merge-patch+json")
    logging.info("Dex clients and canonical GitHub group claims reconciled; deployment restart requested")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-identity-reconciler
  namespace: dex
  labels: {app.kubernetes.io/part-of: connectool}
spec:
  replicas: 1
  selector: {matchLabels: {app: dex-identity-reconciler}}
  template:
    metadata: {labels: {app: dex-identity-reconciler}}
    spec:
      serviceAccountName: dex-client-reconciler
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      automountServiceAccountToken: true
      containers:
        - name: reconcile
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [/bin/sh, -c]
          args:
            - |
              while true; do
                python3 /scripts/reconcile.py
                sleep 60
              done
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: dex-identity-reconciler, defaultMode: 0444}
        - {name: work, emptyDir: {sizeLimit: 16Mi}}
