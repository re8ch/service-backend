apiVersion: v1
kind: ServiceAccount
metadata: {name: dex-client-reconciler, namespace: dex}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: dex-client-reconciler, namespace: dex}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [connectool-dex-clients, dex-client-reconciler-v1]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dex-config, dex-config-pre-tenant-publication-v1]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [dex]
    verbs: [get, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: dex-client-reconciler, namespace: dex}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: dex-client-reconciler}
subjects: [{kind: ServiceAccount, name: dex-client-reconciler, namespace: dex}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: dex-client-reconciler-v1, namespace: dex}
data:
  reconcile.sh: |
    #!/usr/bin/env sh
    set -eu
    workdir=$(mktemp -d)
    trap 'rm -rf "$workdir"' EXIT HUP INT TERM
    for attempt in $(seq 1 60); do
      if kubectl -n dex get configmap connectool-dex-clients -o jsonpath='{.data.clients\.yaml}' >"$workdir/clients.yaml" 2>/dev/null; then
        break
      fi
      if [ "$attempt" -eq 60 ]; then echo "ConnecTool Dex contract was not created" >&2; exit 1; fi
      sleep 5
    done
    kubectl -n dex get secret dex-config -o jsonpath='{.data.config\.yaml}' | base64 -d >"$workdir/config.yaml"
    CONFIG_PATH="$workdir/config.yaml" CLIENTS_PATH="$workdir/clients.yaml" python3 - <<'PY'
    import os
    from pathlib import Path
    import yaml

    config_path = Path(os.environ["CONFIG_PATH"])
    contract_path = Path(os.environ["CLIENTS_PATH"])
    config = yaml.safe_load(config_path.read_text())
    contract = yaml.safe_load(contract_path.read_text())
    desired = {item["id"]: item for item in contract.get("staticClients", [])}
    retired = {
        "re8ch-qwen-tenant", "re8ch-tenant-admin", "re8ch-tenant-registry",
        "re8ch-tenant-observability", "re8ch-tenant-byoc", "re8ch-artchais-tenant",
    }
    clients = [item for item in config.setdefault("staticClients", []) if item.get("id") not in retired]
    by_id = {item.get("id"): item for item in clients}
    for client_id, contract_client in desired.items():
        client = by_id.get(client_id)
        if client is None:
            client = {"id": client_id}
            clients.append(client)
        client.update({"name": contract_client["name"], "public": True})
        client.pop("secret", None)
        client.pop("redirectURIs", None)
    config["staticClients"] = clients
    config_path.write_text(yaml.safe_dump(config, sort_keys=False))
    PY
    kubectl -n dex get secret dex-config -o json | jq '
      .metadata={name:"dex-config-pre-tenant-publication-v1",namespace:.metadata.namespace} |
      del(.metadata.creationTimestamp,.metadata.resourceVersion,.metadata.uid,.metadata.managedFields,.metadata.ownerReferences)' |
      kubectl apply -f - >/dev/null
    kubectl -n dex create secret generic dex-config --from-file=config.yaml="$workdir/config.yaml" --dry-run=client -o yaml |
      kubectl apply -f - >/dev/null
    kubectl -n dex rollout restart deployment/dex
    kubectl -n dex rollout status deployment/dex --timeout=180s
---
apiVersion: batch/v1
kind: Job
metadata: {name: dex-client-reconciler-v1, namespace: dex, labels: {app.kubernetes.io/part-of: connectool}}
spec:
  backoffLimit: 3
  template:
    metadata: {labels: {app: dex-client-reconciler}}
    spec:
      serviceAccountName: dex-client-reconciler
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: restricted-node-6dc3f140f9}
      automountServiceAccountToken: true
      containers:
        - name: reconcile
          image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
          command: [/scripts/reconcile.sh]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: dex-client-reconciler-v1, defaultMode: 0555}
        - {name: work, emptyDir: {sizeLimit: 16Mi}}
