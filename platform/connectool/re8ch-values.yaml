global:
  issuer: https://dex.re8ch.com
  scopes: [openid, profile, email, groups, offline_access]
dex:
  contract: {enabled: true, namespace: dex, configMapName: connectool-dex-clients}
toolhive:
  namespace: toolhive-system
  placement:
    nodeSelector: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: kubernetes.io/hostname, operator: In, values: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]}
    tolerations: []
    topologySpreadConstraints: []
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
  runtimePolicy:
    enabled: true
    nodeNames: [restricted-node-1eb0570f74, restricted-node-296f36f2fb]
    trafficDistribution: PreferSameNode
    backendSessionAffinity: None
    proxyResources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 250m, memory: 256Mi}
    rollout: {maxUnavailable: 1, maxSurge: 0, progressDeadlineSeconds: 180}
  registry:
    enabled: true
    name: approved
    sources:
      - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
      - {name: re8ch-managed, managed: {}}
  sessionStorage:
    provider: memory
    sessionAffinity: ClientIP
  sessionRouting:
    enabled: true
    replicas: 2
    image:
      repository: ghcr.io/among-clusters/connectool-session-router
      tag: "0.5.0"
      digest: "sha256:94323d4285cfe601fabebbb80265da7e289515271d130a90125697081236136d"
      pullPolicy: IfNotPresent
    listenPort: 8080
    servicePort: 4483
    backendPort: 4483
    sessionHeader: Mcp-Session-Id
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
  publications:
    - name: re8ch-tools-vmcp
      clientId: re8ch-cloud-platform-tool
      resourceUrl: https://tools.service.re8ch.com/cloud/mcp
      group: platform-tools-public
      createGroup: false
      replicas: 1
      allowSingleReplicaWhenCapacityLimited: true
      workloads:
        - {name: ops-observe-vmcp-internal, toolConfigRef: ops-public-read-tools}
        - {name: ops-operate-vmcp-internal, toolConfigRef: ops-operate-tools}
      outgoingAuth:
        source: inline
        default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-observe-backend-auth}}
        backends:
          ops-observe-vmcp-internal: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-observe-backend-auth}}
          ops-operate-vmcp-internal: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-admin-backend-auth}}
      operational:
        failureHandling: {partialFailureMode: best_effort, healthCheckInterval: 30s, healthCheckTimeout: 10s, unhealthyThreshold: 3, circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}}
      authorization:
        groupClaim: groups
        policies:
          - 'permit(principal in THVGroup::"re8ch:k8s-admins", action, resource);'
          - 'permit(principal in THVGroup::"re8ch:qwen-operators", action, resource);'
          - 'forbid(principal, action == Action::"call_tool", resource == Tool::"restart_managed_platform_deployment") unless { principal in THVGroup::"re8ch:qwen-operators" || principal in THVGroup::"re8ch:k8s-admins" };'
    - name: re8ch-admin-vmcp
      clientId: re8ch-platform-admin
      resourceUrl: https://admin.re8ch.com:8443/mcp
      group: platform-admin-public
      createGroup: false
      replicas: 2
      workloads:
        - {name: ops-admin-vmcp-internal, toolConfigRef: ops-admin-tools}
        - {name: admin-api-backend}
      outgoingAuth:
        source: inline
        default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: vmcp-admin-backend-auth}}
        backends:
          admin-api-backend: {type: externalAuthConfigRef, externalAuthConfigRef: {name: admin-vmcp-backend-auth}}
      operational:
        failureHandling: {partialFailureMode: best_effort, healthCheckInterval: 30s, healthCheckTimeout: 10s, unhealthyThreshold: 3, circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}}
      authorization:
        groupClaim: groups
        policies:
          - 'permit(principal in THVGroup::"re8ch:k8s-admins", action, resource);'
    - name: tenant-vmcp
      clientId: re8ch-tenant
      resourceUrl: https://tools.service.re8ch.com/tenant/mcp
      group: tenant-public
      createGroup: true
      replicas: 2
      workloads:
        - {name: tenant-api-backend}
      outgoingAuth:
        source: inline
        default: {type: externalAuthConfigRef, externalAuthConfigRef: {name: tenant-vmcp-backend-auth}}
      operational:
        listChanged: {disabledWorkloads: [tenant-api-backend]}
        failureHandling: {partialFailureMode: best_effort, healthCheckInterval: 30s, healthCheckTimeout: 10s, unhealthyThreshold: 3, circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}}
      authorization:
        groupClaim: groups
        policies:
          - 'permit(principal, action, resource);'
codex:
  marketplace:
    name: re8ch-admin-private
    displayName: RE8CH Admin Private
    source: https://github.com/re8ch/codex-admin-plugins.git
  plugins:
    - name: re8ch-cloud-platform-tool
      publication: re8ch-tools-vmcp
      category: Productivity
      mcpOwner: true
      skills: [skills/cloud-platform/SKILL.md]
    - name: re8ch-cluster-infra-tool
      publication: re8ch-tools-vmcp
      category: Productivity
      mcpOwner: false
      skills: [skills/cluster-infra/SKILL.md]
    - name: re8ch-agent-orchestra-collab
      publication: re8ch-tools-vmcp
      category: Productivity
      mcpOwner: false
      skills: [skills/agent-orchestra/SKILL.md]
    - name: re8ch-platform-admin
      publication: re8ch-admin-vmcp
      category: Productivity
      mcpOwner: true
      skills: []
    - name: re8ch-tenant-admin
      publication: re8ch-admin-vmcp
      category: Productivity
      mcpOwner: false
      skills: [skills/tenant-admin/SKILL.md]
    - name: re8ch-tenant
      publication: tenant-vmcp
      category: Productivity
      mcpOwner: true
      skills: []
