apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: connectool-cloud-mcp, namespace: toolhive-system}
spec:
  hostnames: [tools.re8ch.com]
  parentRefs: [{name: re8ch-gateway-canary, namespace: kube-system, sectionName: tools-https}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /cloud}}]
      backendRefs: [{name: vmcp-re8ch-tools-vmcp, port: 4483}]
    - matches: [{path: {type: PathPrefix, value: /.well-known/oauth-protected-resource/cloud}}]
      backendRefs: [{name: vmcp-re8ch-tools-vmcp, port: 4483}]
