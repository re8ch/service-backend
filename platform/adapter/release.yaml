apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: adapter, namespace: flux-system}
spec:
  interval: 3m
  provider: generic
  url: oci://registry.re8ch.com/helm/adapter
  ref: {digest: sha256:feb775e9995f8ba8f6d36b5bd0b095b8598346085b4536e8b8c2130246ec0870}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata: {name: adapter, namespace: flux-system}
spec:
  interval: 1m
  releaseName: adapter
  targetNamespace: adapter
  storageNamespace: adapter
  chartRef: {kind: OCIRepository, name: adapter}
  install:
    createNamespace: true
    remediation: {retries: 3}
  upgrade:
    cleanupOnFail: true
    remediation: {retries: 3, strategy: rollback}
  rollback: {cleanupOnFail: true}
  values:
    fullnameOverride: adapter
    publicEdge: {enabled: false, hostname: "", gatewayName: re8ch-public, gatewayNamespace: kube-system, sectionName: https}
