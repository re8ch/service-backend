apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: birfucate-metering
  namespace: flux-system
spec:
  interval: 10m
  releaseName: birfucate-metering
  targetNamespace: observability-ai
  storageNamespace: observability-ai
  chart:
    spec:
      chart: ./clusters/re8ch/charts/birfucate-metering
      interval: 10m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: service-backend
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    cleanupOnFail: true
  values:
    image:
      repository: python
      tag: 3.13-alpine@sha256:62e80a1ff2a4af41c6fe72a629e5729463a4fd05ae89ecc9c812a6c1457f2cc7
      pullPolicy: IfNotPresent
    tenantPlatform:
      enabled: true
      image: registry.re8ch.com/image/re8ch-ai-operations@sha256:38a110386b1341b93dd0e6a868dcf8ec0de14d0b47ef3bc355e6d4adc4837a7d
      tenantReadinessPath: /readyz
      state:
        storageClassName: rbd-r640
        size: 1Gi
      supplyChain:
        required: false
      tenants:
        - name: admin
          displayName: RE8CH Platform Administration
          lifecycle: Active
          deletionPolicy: Retain
          runtimeNamespaceRef: tenant-infrastructure
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: re8ch
          identityBindings:
            - {name: admin-github-k8s-admins, issuer: https://dex.re8ch.com, group: "re8ch:k8s-admins", role: admin}
            - {name: admin-vmcp-service, issuer: https://dex.re8ch.com, group: "re8ch:tenant-admins", role: admin}
          grants: []
          nativeAccess: false
        - name: artchais
          displayName: Artchais
          lifecycle: Active
          deletionPolicy: Retain
          runtimeNamespaceRef: artchais
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: artchais
          identityBindings:
            - {name: artchais-github-admins, issuer: https://dex.re8ch.com, group: "Artchais:tenant-admins", role: admin}
            - {name: artchais-github-operators, issuer: https://dex.re8ch.com, group: "Artchais:tenant-operators", role: operator}
            - {name: artchais-github-viewers, issuer: https://dex.re8ch.com, group: "Artchais:tenant-viewers", role: viewer}
          grants:
            - {name: artchais-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: artchais-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
        - name: re8ch
          displayName: RE8CH
          lifecycle: Active
          deletionPolicy: Retain
          runtimeNamespaceRef: ledger
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: re8ch
          visibility: Private
          hostingMode: platform-managed
          byocAllowed: false
          businessNamespaces: [ledger, neo4j, anysite, dataspace]
          identityBindings:
            - {name: re8ch-auth-admins, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:admin", role: admin}
            - {name: re8ch-auth-operators, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:member", role: operator}
            - {name: re8ch-auth-billing, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:billing", role: viewer}
          grants:
            - {name: re8ch-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-database, consumableRef: database.postgresql.shared.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-network, consumableRef: network.tenant.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-among-clusters, consumableRef: network.among-clusters.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-observability, consumableRef: observability.grafana.v1, roleRef: viewer, lifecycle: Active}
            - {name: re8ch-registry, consumableRef: registry.harbor.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
    # Keep the first production reconciliation equivalent to the validated
    # canary: no stateful allocation while Ceph is degraded and no downstream
    # delivery until the tenant usage sink is promoted.
    outbox:
      enabled: false
    usageSink:
      enabled: false
    pricing:
      enabled: true
      currency: CNY
      rateCardRef: re8ch-showback-2026-09
    serviceMonitor:
      enabled: false
    vmServiceScrape:
      enabled: false
