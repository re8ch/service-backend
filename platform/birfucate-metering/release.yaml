apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: birfucate-metering
  namespace: flux-system
spec:
  interval: 1m
  timeout: 10m
  releaseName: birfucate-metering
  targetNamespace: observability-ai
  storageNamespace: observability-ai
  chart:
    spec:
      chart: ./clusters/re8ch/charts/birfucate-metering
      interval: 10m
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: service-backend
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    # Tenant identity deletion is intentionally gated by an explicit revoke.
    # Automatic cleanup can otherwise turn a transient timeout into an auth
    # outage by trying to delete newly-created, active bindings.
    cleanupOnFail: false
    remediation:
      retries: 3
      strategy: rollback
  rollback:
    cleanupOnFail: true
  values:
    image:
      repository: python
      tag: 3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
      pullPolicy: IfNotPresent
    nodeSelector:
      kubernetes.io/hostname: restricted-node-6dc3f140f9
    tenantPlatform:
      enabled: true
      # Keep the shared RWO state and both MCP backends on the restricted-node-6dc3f140f9 worker so
      # loss of either WSL control-plane host cannot strand public tool access.
      placement:
        nodeNames: [restricted-node-6dc3f140f9]
      tolerations:
        - {operator: Exists}
      image: registry.re8ch.com/image/re8ch-ai-operations@sha256:d2038c875c8aac6ecf38124ed85bf7d4f58f526930ba232a75c924e38f443634
      tenantAPI:
        # Public ownership proof for the existing OpenAI Re8ch draft (not a credential).
        openAIAppsChallengeToken: "6n3O48vy3O89euYVrri4aHJMeUJ_vkofxLpzxv-6TTE"
        enabled: true
        image: registry.re8ch.com/image/re8ch-tenant-mcp@sha256:b4b77818d634b67d967eba2fca3bb7f8320fd79073918c50d96a07d2d0803eef
        organizationsURL: https://api.re8ch.com/auth/v2/organizations
        usersURL: https://api.re8ch.com/auth/v2/users
        # Ordinary tenant calls verify their GoTrue session directly. Keep the
        # optional platform-admin entitlement hop disabled until its live RPC
        # latency and failure behavior pass the full authenticated tool matrix.
        platformSessionURL: ""
      provider:
        enabled: true
        image: registry.re8ch.com/image/re8ch-ai-operations@sha256:d2038c875c8aac6ecf38124ed85bf7d4f58f526930ba232a75c924e38f443634
        databaseBindings:
          - {tenantRef: re8ch, database: anysite, namespace: re8ch-anysite, secretName: anysite-db-credentials, secretUID: ecb4edf3-eb40-4b0e-ab28-7bf3dab490c4}
          - {tenantRef: re8ch, database: secretary, namespace: re8ch-secretary, secretName: secretary-db-credentials, secretUID: e31d554c-5cf8-4663-adcd-811849a31b3c}
      tenantReadinessPath: /readyz
      state:
        storageClassName: rbd-r640
        size: 1Gi
      supplyChain:
        required: false
      tenants:
        # Runtime policy class for newly registered Personal organizations.
        # The controller derives an owner namespace and provider identity from
        # each verified Supabase Personal organization.
        - name: personal-standard
          displayName: Personal Standard Runtime
          lifecycle: Active
          deletionPolicy: Retain
          namespacePolicy:
            defaultNamespace: personal-standard-default
            allowedPrefixes: [personal-standard-]
            maxNamespaces: 10
            allowCreate: true
            allowDelete: true
            bootstrapNamespaces: [personal-standard-default]
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: re8ch
          visibility: Private
          hostingMode: platform-managed
          byocAllowed: true
          identityBindings: []
          grants:
            - {name: personal-standard-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-standard-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-standard-registry, consumableRef: registry.harbor.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-standard-observability, consumableRef: observability.grafana.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
        # Normal personal organization used for the OpenAI review login.
        # Keep its tenant capabilities aligned with the ordinary tenant baseline.
        - name: personal-6a68c4a3-96e6-44ef-a0fd-c39fadd4ee38
          displayName: Personal
          lifecycle: Active
          deletionPolicy: Retain
          namespacePolicy:
            defaultNamespace: personal-6a68c4a3-96e6-44ef-a0fd-c39fadd4ee38-default
            allowedPrefixes: [personal-6a68c4a3-96e6-44ef-a0fd-c39fadd4ee38-]
            maxNamespaces: 10
            allowCreate: true
            allowDelete: true
            bootstrapNamespaces: [personal-6a68c4a3-96e6-44ef-a0fd-c39fadd4ee38-default]
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: personal-6a68c4a3-96e6-44ef-a0fd-c39fadd4ee38
          visibility: Private
          hostingMode: platform-managed
          byocAllowed: true
          identityBindings: []
          grants:
            - {name: personal-review-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-review-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-review-registry, consumableRef: registry.harbor.v1, roleRef: operator, lifecycle: Active}
            - {name: personal-review-observability, consumableRef: observability.grafana.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
        - name: admin
          displayName: RE8CH Platform Administration
          lifecycle: Active
          deletionPolicy: Retain
          namespacePolicy:
            defaultNamespace: tenant-infrastructure
            allowedPrefixes: [admin-]
            maxNamespaces: 1
            allowCreate: false
            allowDelete: false
            bootstrapNamespaces: []
          runtimeNamespaceRef: tenant-infrastructure
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: re8ch
          identityBindings:
            - {name: admin-github-k8s-admins, issuer: https://dex.service.re8ch.com, group: "re8ch:k8s-admins", role: admin, revoked: true}
            - {name: admin-vmcp-service, issuer: https://dex.service.re8ch.com, group: "re8ch:tenant-admins", role: admin, revoked: true}
            - {name: admin-github-k8s-admins-auth, issuer: https://auth.re8ch.com, group: "re8ch:k8s-admins", role: admin}
            - {name: admin-vmcp-service-auth, issuer: https://auth.re8ch.com, group: "re8ch:tenant-admins", role: admin}
          grants: []
          nativeAccess: false
        - name: artchais
          displayName: Artchais
          lifecycle: Active
          deletionPolicy: Retain
          namespacePolicy:
            defaultNamespace: artchais-default
            allowedPrefixes: [artchais-]
            maxNamespaces: 20
            allowCreate: true
            allowDelete: true
            bootstrapNamespaces: [artchais-default]
          runtimeNamespaceRef: artchais
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: artchais
          identityBindings:
            - {name: artchais-github-members, issuer: https://dex.service.re8ch.com, group: "Artchais", role: viewer}
            - {name: artchais-github-admins, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-admins", role: admin}
            - {name: artchais-github-operators, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-operators", role: operator}
            - {name: artchais-github-viewers, issuer: https://dex.service.re8ch.com, group: "Artchais:tenant-viewers", role: viewer}
            # Exact issuer-scoped binding for the approved external operator.
            # Only the one-way subject hash is retained in Git; raw identity
            # claims and OAuth credentials remain outside desired state.
            - {name: artchais-dex-external-operator-v2, issuer: https://dex.service.re8ch.com, subjectHash: "sha256:92948cd9df63b98d534da47c27e236b4b894808feff18558aa53996f7059c415", role: operator}
          grants:
            - {name: artchais-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: artchais-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            # Long-lived access remains revocable through the tenant identity binding. The
            # controller limits this grant to Artchais' approved artc -> RE8CH
            # Mihomos egress path; it never grants platform administration.
            - {name: artchais-among-clusters-mihomos, consumableRef: network.among-clusters.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
        - name: re8ch
          displayName: RE8CH
          lifecycle: Active
          deletionPolicy: Retain
          namespacePolicy:
            defaultNamespace: re8ch-default
            allowedPrefixes: [re8ch-]
            maxNamespaces: 20
            allowCreate: true
            allowDelete: true
            bootstrapNamespaces: [re8ch-default, re8ch-ledger, re8ch-neo4j, re8ch-anysite, re8ch-dataspace]
          runtimeNamespaceRef: ledger
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: re8ch
          visibility: Private
          hostingMode: platform-managed
          byocAllowed: false
          identityBindings:
            # The same GitHub identity is deliberately projected differently by
            # audience: ordinary re8ch operator here, protected admin above.
            - {name: re8ch-tenant-admins-as-operators, issuer: https://dex.service.re8ch.com, group: "re8ch:tenant-admins", role: operator, revoked: true}
            - {name: re8ch-github-k8s-admins-as-operators, issuer: https://dex.service.re8ch.com, group: "re8ch:k8s-admins", role: operator, revoked: true}
            - {name: re8ch-tenant-admins-as-operators-auth, issuer: https://auth.re8ch.com, group: "re8ch:tenant-admins", role: operator}
            - {name: re8ch-github-k8s-admins-as-operators-auth, issuer: https://auth.re8ch.com, group: "re8ch:k8s-admins", role: operator}
            # Dex wraps the upstream GitHub numeric ID in its connector-scoped
            # stable `sub`. Hash the actual Dex userinfo `sub`, including the
            # issuer prefix used by the tenant authorizer. This remains an
            # ordinary re8ch tenant binding, not admin access.
            - {name: re8ch-dex-woomou-subject-operator, issuer: https://dex.service.re8ch.com, subjectHash: "sha256:f14d4712ab05a8ce0c052e0390ccae30cf4f3768065de4cf292f4923b25456f6", role: operator, revoked: true}
            # ToolHive audit identifies the same operator as re8ch:user:46 under
            # the public auth issuer. Bind only that subject to the existing role.
            - {name: re8ch-auth-woomou-subject-operator, issuer: https://auth.re8ch.com, subjectHash: "sha256:c1f31ccaf6518e235725fdb1e46a6a8b79721e055eaf0b6f1b5bd3549bae7e92", role: operator}
            - {name: re8ch-auth-admins, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:admin", role: admin}
            - {name: re8ch-auth-operators, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:member", role: operator}
            - {name: re8ch-auth-billing, issuer: https://api.re8ch.com/auth, group: "tenant:re8ch:billing", role: viewer}
          grants:
            - {name: re8ch-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-database, consumableRef: database.postgresql.shared.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-network, consumableRef: network.tenant.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-among-clusters, consumableRef: network.among-clusters.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-observability, consumableRef: observability.grafana.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-registry, consumableRef: registry.harbor.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-ai-model-gateway, consumableRef: ai.model-gateway.v1, roleRef: operator, lifecycle: Active}
            - {name: re8ch-sandbox-runtime, consumableRef: sandbox.runtime.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
        - name: tenant-ci
          displayName: Tenant Conformance Canary
          lifecycle: Active
          deletionPolicy: RevokeThenDelete
          namespacePolicy:
            defaultNamespace: tenant-ci-default
            allowedPrefixes: [tenant-ci-]
            maxNamespaces: 10
            allowCreate: true
            allowDelete: true
            bootstrapNamespaces: [tenant-ci-default]
          # Compatibility bridge for clusters whose pre-autonomy Tenant CRD
          # still requires this field while Helm upgrades the CRD in-place.
          runtimeNamespaceRef: tenant-ci-default
          imagePullSecretRef: harbor-functions-shared-pull
          harborProjectRef: tenant-ci
          identityBindings:
            - {name: tenant-ci-github-actions, issuer: https://dex.service.re8ch.com, group: "re8ch:tenant-ci", role: operator}
          grants:
            - {name: tenant-ci-compute, consumableRef: compute.workload.v1, roleRef: operator, lifecycle: Active}
            - {name: tenant-ci-storage, consumableRef: storage.volume.v1, roleRef: operator, lifecycle: Active}
            - {name: tenant-ci-registry, consumableRef: registry.harbor.v1, roleRef: operator, lifecycle: Active}
            - {name: tenant-ci-observability, consumableRef: observability.grafana.v1, roleRef: operator, lifecycle: Active}
          nativeAccess: true
    # Keep downstream provisioning gated while Ceph is degraded. Raw, unpriced
    # usage is delivered only for the re8ch tenant.
    outbox:
      enabled: false
    usageSink:
      enabled: true
      allowedTenants: [re8ch]
    pricing:
      enabled: false
      currency: CNY
      rateCardRef: re8ch-showback-2026-09
    serviceMonitor:
      enabled: false
    vmServiceScrape:
      enabled: false
