version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday, time: "03:00", timezone: Asia/Shanghai}
    open-pull-requests-limit: 5
    labels: ["dependencies", "automation/dependabot"]
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
