name: Release Commerce and payment registry Go images

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed Cloud Functions master commit to build
        required: true
        type: string

permissions: {contents: read, id-token: write}
concurrency: {group: commerce-go-release, cancel-in-progress: false}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, macmini-a1]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Validate revision
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: re8ch/cloud-functions
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          ssh-key: ${{ secrets.CLOUD_FUNCTIONS_RELEASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Require merged source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/master
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go test ./functions/commerce-api ./functions/payment-registry-api ./pkg/wechatpayx
      - name: Prepare isolated registry authentication
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/commerce-go-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          install -d -m 700 "$DOCKER_CONFIG/cli-plugins"
          ln -s "${HOME}/.docker/cli-plugins/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          umask 077
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "BUILDX_CONFIG=${HOME}/.docker/buildx" >> "$GITHUB_ENV"
      - name: Verify runner Buildx
        run: docker buildx version
      - name: Write isolated registry authorization
        env:
          REGISTRY_USERNAME: ${{ secrets.DOMAIN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOMAIN_REGISTRY_PASSWORD }}
        run: |
          umask 077
          auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
          printf '{"auths":{"registry.re8ch.com":{"auth":"%s"}}}\n' "$auth" > "$DOCKER_CONFIG/config.json"
      - id: commerce
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: functions/commerce-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.re8ch.com/hyperswitch/processor-commerce-api:${{ inputs.revision }}
          provenance: mode=max
          sbom: true
      - id: registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: functions/payment-registry-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.re8ch.com/hyperswitch/processor-payment-registry-api:${{ inputs.revision }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign and verify immutable digests
        env:
          COMMERCE_IMAGE: registry.re8ch.com/hyperswitch/processor-commerce-api@${{ steps.commerce.outputs.digest }}
          REGISTRY_IMAGE: registry.re8ch.com/hyperswitch/processor-payment-registry-api@${{ steps.registry.outputs.digest }}
          IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/commerce-go-release.yml@refs/heads/main
        run: |
          for image in "$COMMERCE_IMAGE" "$REGISTRY_IMAGE"; do
            cosign sign --yes "$image"
            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image"
            printf '%s\n' "$image" >> commerce-go.images
            printf '%s\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-go-images-${{ inputs.revision }}
          path: commerce-go.images
          if-no-files-found: error
      - name: Remove temporary registry authorization
        if: always()
        run: |
          rm -f "$DOCKER_CONFIG/config.json"
          rm -f "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          rmdir "$DOCKER_CONFIG/cli-plugins" || true
          rmdir "$DOCKER_CONFIG" || true
