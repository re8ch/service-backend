name: Transaction context

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: transaction-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: transaction-context
    runs-on: ubuntu-24.04
    steps:
      - name: Mint bounded maintenance token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          NODE_USE_ENV_PROXY: '1'
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: re8ch
          repositories: service-backend
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: read
      - name: Check trusted transaction policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate Issue and Project context
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python operations/github-transaction-context/validate.py
          --repository '${{ github.repository }}'
          --pull-request '${{ github.event.pull_request.number }}'
