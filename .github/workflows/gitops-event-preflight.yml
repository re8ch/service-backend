name: GitOps event installation preflight
on: workflow_dispatch
permissions: {contents: read}
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read effective installation grants and event subscriptions
        env:
          APP_ID: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          APP_KEY: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
        run: ruby operations/github-maintenance/event_preflight.rb
