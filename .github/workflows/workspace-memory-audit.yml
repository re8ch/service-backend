name: workspace-memory-audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/workspace-memory-audit.yml
      - catalogs/**
      - indexes/**
      - workspace/**
      - operations/workspace-controller/**
permissions:
  contents: read
concurrency:
  group: workspace-memory-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 "$GITHUB_WORKSPACE/operations/workspace-controller/workspace.py" \
            --root "$GITHUB_WORKSPACE" memory-audit | jq -e ".result.complete == true"
