name: PublicEdge public DNS authority
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  external-dns:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify runner DNS probe
        run: |
          set -euo pipefail
          command -v dig
          dig -v
      - name: Probe delegation and public authorities
        run: |
          set -euo pipefail
          python operations/scripts/check-public-edge-authority.py \
            platform/public-edge-manager/authority-monitor.json \
            | tee public-edge-authority-result.json
      - name: Publish observation
        if: always()
        run: |
          if [ -f public-edge-authority-result.json ]; then
            {
              echo '```json'
              cat public-edge-authority-result.json
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-edge-authority-observation
          path: public-edge-authority-result.json
          if-no-files-found: warn
          retention-days: 30
