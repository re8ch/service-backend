name: conformance-runner-release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed merged service-backend commit
        required: true
        type: string
permissions: {contents: read, id-token: write}
concurrency: {group: conformance-runner-release, cancel-in-progress: false}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require merged source
        env: {SOURCE_REVISION: '${{ inputs.revision }}'}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          git checkout --detach "$SOURCE_REVISION"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          # Registry health is green, but parallel layer uploads stalled beyond
          # 30 minutes. Keep this mitigation local to this release worker.
          buildkitd-config-inline: |
            [system]
              maxRegistryConcurrency = 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: operations/api-conformance
          file: operations/api-conformance/Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: registry.re8ch.com/functions-shared/api-conformance-runner:${{ inputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Verify runner version and scan before signing
        env: {IMAGE: 'registry.re8ch.com/functions-shared/api-conformance-runner@${{ steps.build.outputs.digest }}'}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c 'from importlib.metadata import version; assert version("schemathesis") == "4.29.1"'
          docker run --rm --volume "$HOME/.docker:/root/.docker:ro" \
            ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      - name: Sign and verify immutable digest
        env:
          IMAGE: registry.re8ch.com/functions-shared/api-conformance-runner@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/conformance-runner-release.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf '%s\n' "$IMAGE" > conformance-runner.image
          printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'conformance-runner-${{ inputs.revision }}', path: conformance-runner.image, if-no-files-found: error}
