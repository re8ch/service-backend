name: GitHub policy reviewer
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: github-policy-reviewer
  cancel-in-progress: false
jobs:
  review:
    if: vars.POLICY_REVIEWER_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organization: [public-edge, advanced-fabrics, among-clusters]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: '4973967'
          private-key: ${{ secrets.POLICY_REVIEWER_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
      - name: Review eligible pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWER_ORGANIZATION: ${{ matrix.organization }}
          REVIEWER_DRY_RUN: ${{ vars.POLICY_REVIEWER_DRY_RUN }}
        run: python operations/github-policy-reviewer/review.py
