name: GitHub policy reviewer
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: github-policy-reviewer
  cancel-in-progress: false
jobs:
  review:
    if: vars.POLICY_REVIEWER_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    strategy:
      fail-fast: false
      matrix:
        organization: [public-edge, advanced-fabrics, among-clusters, compocv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          NODE_USE_ENV_PROXY: '1'
        with:
          app-id: '4973967'
          private-key: ${{ secrets.POLICY_REVIEWER_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
      - name: Review eligible pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWER_ORGANIZATION: ${{ matrix.organization }}
          REVIEWER_DRY_RUN: ${{ vars.POLICY_REVIEWER_DRY_RUN }}
        run: python operations/github-policy-reviewer/review.py
