name: control-plane-auth-reconcile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-auth-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}

      - name: Verify reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')" = true
          source='clusters/re8ch/components/ops/dex-dual-issuer-authentication.yaml'
          test -s "$source"
          grep -qx 'apiVersion: apiserver.config.k8s.io/v1' "$source"
          grep -qx 'kind: AuthenticationConfiguration' "$source"

      - name: Reconcile exact authentication configuration
        run: |
          set -euo pipefail
          source='clusters/re8ch/components/ops/dex-dual-issuer-authentication.yaml'
          target='/etc/rancher/k3s/dex-dual-issuer-authentication.yaml'
          expected="$(sha256sum "$source" | awk '{print $1}')"

          reconcile_remote() {
            host="$1"
            # shellcheck disable=SC2002
            cat "$source" | ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "root@$host" \
              'set -euo pipefail; target=/etc/rancher/k3s/dex-dual-issuer-authentication.yaml; tmp="$(mktemp "${target}.XXXXXX")"; trap '\''rm -f "$tmp"'\'' EXIT; cat >"$tmp"; chown root:root "$tmp"; chmod 0600 "$tmp"; mv -f "$tmp" "$target"; trap - EXIT'
            test "$(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "root@$host" "sha256sum '$target'" | awk '{print $1}')" = "$expected"
            curl -kfsS --max-time 10 "https://$host:6443/livez" >/dev/null
          }

          reconcile_remote 10.181.22.125
          reconcile_remote 10.181.22.147
          reconcile_remote 10.181.22.128

          echo "Loaded authentication configuration sha256:$expected on all three control-plane nodes."
