name: k6 functional contracts
on:
  schedule:
    - cron: "2/5 * * * *"
    - cron: "18,48 * * * *"
  workflow_dispatch:
    inputs:
      cadence:
        description: Functional check cadence
        type: choice
        options: [fast, standard, all]
        default: all
permissions: {contents: read}
concurrency:
  group: k6-contracts-${{ github.event.schedule || inputs.cadence || github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROBE_CADENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.cadence || (github.event.schedule == '2/5 * * * *' && 'fast' || 'standard') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate versioned probe contracts
        run: python operations/k6/validate.py
      - name: Probe public functional contracts
        run: |
          mkdir -p "$RUNNER_TEMP/k6"
          docker run --rm --user "$(id -u):$(id -g)" \
            --env PROBE_VANTAGE=external --env PROBE_CADENCE="$PROBE_CADENCE" \
            --volume "$PWD/clusters/re8ch/components/synthetic-monitoring:/work:ro" \
            --volume "$RUNNER_TEMP/k6:/results" \
            --workdir /work \
            grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d \
            run --summary-export /results/summary.json smoke.js
      - name: Publish probe result
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/k6/summary.json" ]]; then
            python operations/k6/summarize.py "$RUNNER_TEMP/k6/summary.json" \
              --cadence "$PROBE_CADENCE" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: k6-contract-summary
          path: "${{ runner.temp }}/k6/summary.json"
          if-no-files-found: warn
          retention-days: 30
