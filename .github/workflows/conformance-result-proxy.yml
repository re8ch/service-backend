name: Conformance result proxy safety
on:
  pull_request:
    paths:
      - operations/api-conformance/result-proxy/**
      - .github/workflows/conformance-result-proxy.yml
  push:
    branches: [main]
    paths:
      - operations/api-conformance/result-proxy/**
      - .github/workflows/conformance-result-proxy.yml
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.9'
          cache: false
      - working-directory: operations/api-conformance/result-proxy
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
