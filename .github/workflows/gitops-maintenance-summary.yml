name: GitOps maintenance summary

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-maintenance-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GITOPS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
      - name: Publish quiet weekly maintenance summary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITOPS_MAINTENANCE_PROJECT: "1"
        run: python operations/github-maintenance/weekly_summary.py
