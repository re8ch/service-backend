name: cloud-platform-release
on:
  pull_request:
    paths:
      - .github/workflows/cloud-platform-release.yml
      - operations/cloud-platform/**
      - clusters/re8ch/charts/runtime-anatomy/files/controller.py
      - operations/plugin-capabilities/**
      - plugins/**
      - tests/test_plugin_capabilities.py
      - tests/test_plugin_http_conformance.py
      - tests/test_mihomos_capabilities.py
      - tests/test_plugin_declaration_audit.py
      - tests/test_cloud_platform*.py
      - tests/test_stalwart_admin.py
      - tests/test_stalwart_bootstrap.py
      - inventory/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/cloud-platform-release.yml
      - operations/cloud-platform/**
      - clusters/re8ch/charts/runtime-anatomy/files/controller.py
      - operations/plugin-capabilities/**
      - plugins/**
      - inventory/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  workflow_dispatch:
    inputs:
      publisher:
        description: Explicit recovery path when the cloud runner cannot push to Harbor
        type: choice
        options: [cloud, r640]
        default: cloud
      reuse_run_id:
        description: Resume signing the immutable artifact from a successful release job
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: cloud-platform-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m pip install 'PyYAML==6.0.2' 'jsonschema==4.23.0' 'pytest>=8.3' 'schemathesis==4.29.1'
      - run: python3 -m pytest -q tests/test_cloud_platform.py tests/test_cloud_platform_manifest.py tests/test_plugin_capabilities.py tests/test_plugin_http_conformance.py tests/test_mihomos_capabilities.py tests/test_cloud_platform_release.py tests/test_plugin_declaration_audit.py tests/test_anatomy_diff_operation.py tests/test_plugin_operation_progress.py tests/test_stalwart_admin.py tests/test_stalwart_bootstrap.py
      - name: Verify generated contracts and native schema enumeration
        run: |
          python3 operations/plugin-capabilities/generate.py
          git diff --exit-code -- operations/cloud-platform/plugin-operation-tools.json operations/cloud-platform/network-planner/operations.json operations/plugin-capabilities/registry.json operations/plugin-capabilities/registry.runtime.json platform/apps/tenant-mcp/platform-modules.json clusters/re8ch/charts/birfucate-metering/files/tenant-platform-modules.json
          python3 operations/plugin-capabilities/verify.py
          python3 operations/plugin-capabilities/audit.py --report operations/plugin-capabilities/declaration-coverage-report.json
          git diff --exit-code -- operations/plugin-capabilities/declaration-coverage-report.json
      - name: Build the actual runtime image
        run: docker build --load -f operations/cloud-platform/Dockerfile -t re8ch-cloud-platform:pr .
      - name: Smoke test packaged tool discovery
        run: |
          docker run --rm --network none --entrypoint python re8ch-cloud-platform:pr -c '
          import server, schemathesis, plugin_http_conformance, plugin_http_transport
          from runtime import Identity
          admin = Identity("build-smoke", (server.ADMIN_GROUP,))
          tools = {tool["name"] for tool in server.tool_list(admin)}
          assert set(server.GENERATED_PLUGIN_TOOLS) <= tools
          assert {"plugin.operations.list", "plugin.operation.read", "plugin.operation.http-check", "mihomos.workloads.list"} <= tools
          assert "anatomy.runtimediff.create" in tools
          assert "anatomy.runtimediff.delete" in tools
          assert set(server.STALWART_ADMIN_BY_NAME) <= tools
          import stalwart_bootstrap
          assert "credentials.stalwart.ensure" in tools
          assert {"cilium.cidrgroup.create", "cilium.cidrgroup.delete"} <= tools
          assert len(server.NETWORK_MUTATIONS) == 72
          assert set(server.NETWORK_MUTATIONS) <= tools
          viewer = {tool["name"] for tool in server.tool_list(Identity("viewer", ()))}
          assert not (server.PRIVILEGED_TOOLS & viewer)
          print("Packaged tool discovery and privilege filtering passed")
          '
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.reuse_run_id == ''
    needs: validate
    runs-on: ${{ inputs.publisher == 'r640' && fromJSON('["self-hosted","Linux","X64","r640","untrusted-build"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated Docker authorization
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/cloud-platform-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx
        if: inputs.publisher != 'r640'
      - if: inputs.publisher != 'r640'
        run: echo "TENANT_IMAGE_BUILDER=${{ steps.buildx.outputs.name }}" >> "$GITHUB_ENV"
      - if: inputs.publisher == 'r640'
        name: Reuse the existing host-proxy builder
        run: |
          export BUILDX_CONFIG="$HOME/.docker/buildx"
          docker buildx inspect r640-mihomos >/dev/null
          echo "BUILDX_CONFIG=$BUILDX_CONFIG" >> "$GITHUB_ENV"
          echo 'TENANT_IMAGE_BUILDER=r640-mihomos' >> "$GITHUB_ENV"
      - run: ./operations/mcp-conformance/release-tenant-infrastructure.sh
        env:
          HARBOR_USERNAME: ${{ secrets.CLOUD_PLATFORM_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.CLOUD_PLATFORM_REGISTRY_PASSWORD }}
          TENANT_IMAGE_INLINE_AUTH: "1"
          TENANT_IMAGE_REPOSITORY: registry.re8ch.com/functions-shared/re8ch-cloud-platform
          TENANT_IMAGE_DOCKERFILE: operations/cloud-platform/Dockerfile
          TENANT_IMAGE_ARTIFACT_NAME: cloud-platform
          TENANT_IMAGE_SKIP_FINALIZE: "1"
          BUILDKIT_NO_CLIENT_TOKEN: "1"
          # Harbor layer publication exceeded 15 minutes in run 41028448350.
          # Give one build/push a bounded 30 minutes instead of rebuilding it
          # after an upload timeout; the release job retains 15 minutes overhead.
          TENANT_IMAGE_PUSH_TIMEOUT_SECONDS: "1800"
          TENANT_IMAGE_PUSH_ATTEMPTS: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-platform-release-${{ github.sha }}
          path: cloud-platform.image
          if-no-files-found: error
      - name: Remove temporary Docker authorization
        if: always()
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -f "$DOCKER_CONFIG/config.json"
            rmdir "$DOCKER_CONFIG" || true
          fi
  finalize:
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.validate.result == 'success' &&
      (needs.release.result == 'success' || (inputs.reuse_run_id != '' && needs.release.result == 'skipped'))
    needs: [validate, release]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - name: Verify source release for artifact reuse
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          source_sha="$GITHUB_SHA"
          build_run="$GITHUB_RUN_ID"
          if [[ -n "$REUSE_RUN_ID" ]]; then
            [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
            source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID")"
            [[ "$(jq -r .name <<<"$source")" == cloud-platform-release ]] || exit 2
            [[ "$(jq -r .head_branch <<<"$source")" == main ]] || exit 2
            source_sha="$(jq -r .head_sha <<<"$source")"
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 2
            git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
            releases="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "release" and .conclusion == "success")] | length')"
            [[ "$releases" -ge 1 ]] || exit 2
            build_run="$REUSE_RUN_ID"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_run=$build_run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-platform-release-${{ steps.source.outputs.sha }}
          run-id: ${{ steps.source.outputs.build_run }}
          github-token: ${{ github.token }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          install-dir: ${{ runner.temp }}/cloud-platform-cosign-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - run: |
          image="$(cat cloud-platform.image)"
          if [[ ! "$image" =~ ^registry\.re8ch\.com/functions-shared/re8ch-cloud-platform@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Cloud Platform image reference" >&2
            exit 1
          fi
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.re8ch.com --username "$HARBOR_USERNAME" --password-stdin >/dev/null
          syft "$image" -o spdx-json > cloud-platform.spdx.json
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/cloud-platform-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" >/dev/null
        env:
          HARBOR_USERNAME: ${{ secrets.CLOUD_PLATFORM_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.CLOUD_PLATFORM_REGISTRY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-platform-finalized-${{ github.sha }}
          path: |
            cloud-platform.image
            cloud-platform.spdx.json
          if-no-files-found: error
