name: cloud-platform-release
on:
  pull_request:
    paths:
      - .github/workflows/cloud-platform-release.yml
      - operations/cloud-platform/**
      - clusters/re8ch/charts/runtime-anatomy/files/controller.py
      - operations/plugin-capabilities/**
      - plugins/**
      - tests/test_plugin_capabilities.py
      - tests/test_plugin_http_conformance.py
      - tests/test_mihomos_capabilities.py
      - tests/test_plugin_declaration_audit.py
      - tests/test_cloud_platform*.py
      - inventory/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/cloud-platform-release.yml
      - operations/cloud-platform/**
      - clusters/re8ch/charts/runtime-anatomy/files/controller.py
      - operations/plugin-capabilities/**
      - plugins/**
      - inventory/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloud-platform-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m pip install 'PyYAML==6.0.2' 'jsonschema==4.23.0' 'pytest>=8.3' 'schemathesis==4.29.1'
      - run: python3 -m pytest -q tests/test_cloud_platform.py tests/test_cloud_platform_manifest.py tests/test_plugin_capabilities.py tests/test_plugin_http_conformance.py tests/test_mihomos_capabilities.py tests/test_cloud_platform_release.py tests/test_plugin_declaration_audit.py tests/test_anatomy_diff_operation.py tests/test_plugin_operation_progress.py
      - name: Verify generated contracts and native schema enumeration
        run: |
          python3 operations/plugin-capabilities/generate.py
          git diff --exit-code -- operations/cloud-platform/plugin-operation-tools.json operations/cloud-platform/network-planner/operations.json operations/plugin-capabilities/registry.json operations/plugin-capabilities/registry.runtime.json platform/apps/tenant-mcp/platform-modules.json clusters/re8ch/charts/birfucate-metering/files/tenant-platform-modules.json
          python3 operations/plugin-capabilities/verify.py
          python3 operations/plugin-capabilities/audit.py --report operations/plugin-capabilities/declaration-coverage-report.json
          git diff --exit-code -- operations/plugin-capabilities/declaration-coverage-report.json
      - name: Build the actual runtime image
        run: docker build --load -f operations/cloud-platform/Dockerfile -t re8ch-cloud-platform:pr .
      - name: Smoke test packaged tool discovery
        run: |
          docker run --rm --network none --entrypoint python re8ch-cloud-platform:pr -c '
          import server, schemathesis, plugin_http_conformance, plugin_http_transport
          from runtime import Identity
          admin = Identity("build-smoke", (server.ADMIN_GROUP,))
          tools = {tool["name"] for tool in server.tool_list(admin)}
          assert set(server.GENERATED_PLUGIN_TOOLS) <= tools
          assert {"plugin.operations.list", "plugin.operation.read", "plugin.operation.http-check", "mihomos.workloads.list"} <= tools
          assert "anatomy.runtimediff.create" in tools
          assert "anatomy.runtimediff.delete" in tools
          assert {"cilium.cidrgroup.create", "cilium.cidrgroup.delete"} <= tools
          assert len(server.NETWORK_MUTATIONS) == 72
          assert set(server.NETWORK_MUTATIONS) <= tools
          viewer = {tool["name"] for tool in server.tool_list(Identity("viewer", ()))}
          assert not (server.PRIVILEGED_TOOLS & viewer)
          print("Packaged tool discovery and privilege filtering passed")
          '
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    # Publish over the trusted runner's local Harbor path; hosted uploads stall
    # on large layers at the public edge.
    runs-on: [self-hosted, macOS, ARM64, macmini-a1]
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated Docker builder
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/cloud-platform-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '[dns]\nnameservers = ["1.1.1.1"]\n' > "$RUNNER_TEMP/cloud-platform-release-buildkitd.toml"
          docker buildx create --name "cloud-platform-release-${GITHUB_RUN_ID}" --driver docker-container \
            --buildkitd-config "$RUNNER_TEMP/cloud-platform-release-buildkitd.toml" --use
          docker buildx inspect --bootstrap "cloud-platform-release-${GITHUB_RUN_ID}" >/dev/null
          builder_container="buildx_buildkit_cloud-platform-release-${GITHUB_RUN_ID}0"
          docker exec "$builder_container" sh -ec 'printf "nameserver 1.1.1.1\n" > /etc/resolv.conf'
          registry_ip="$(docker exec "$builder_container" getent hosts registry.re8ch.com | awk 'NR == 1 {print $1}')"
          case "$registry_ip" in
            ""|198.18.*|198.19.*) echo "Registry DNS did not resolve to a public authority" >&2; exit 1 ;;
          esac
          echo "TENANT_IMAGE_BUILDER=cloud-platform-release-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - run: ./operations/mcp-conformance/release-tenant-infrastructure.sh
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          TENANT_IMAGE_INLINE_AUTH: "1"
          TENANT_IMAGE_REPOSITORY: registry.re8ch.com/functions-shared/re8ch-cloud-platform
          TENANT_IMAGE_DOCKERFILE: operations/cloud-platform/Dockerfile
          TENANT_IMAGE_ARTIFACT_NAME: cloud-platform
          TENANT_IMAGE_SKIP_FINALIZE: "1"
          BUILDKIT_NO_CLIENT_TOKEN: "1"
          TENANT_IMAGE_PUSH_TIMEOUT_SECONDS: "900"
          TENANT_IMAGE_PUSH_ATTEMPTS: "2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-platform-release-${{ github.sha }}
          path: cloud-platform.image
          if-no-files-found: error
      - name: Remove temporary Docker authorization and builder
        if: always()
        run: |
          docker buildx rm "cloud-platform-release-${GITHUB_RUN_ID}" || true
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            rm -f "$DOCKER_CONFIG/config.json"
            rmdir "$DOCKER_CONFIG" || true
          fi
  finalize:
    needs: release
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-platform-release-${{ github.sha }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - run: |
          image="$(cat cloud-platform.image)"
          if [[ ! "$image" =~ ^registry\.re8ch\.com/functions-shared/re8ch-cloud-platform@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Cloud Platform image reference" >&2
            exit 1
          fi
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.re8ch.com --username "$HARBOR_USERNAME" --password-stdin >/dev/null
          syft "$image" -o spdx-json > cloud-platform.spdx.json
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/cloud-platform-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" >/dev/null
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-platform-finalized-${{ github.sha }}
          path: |
            cloud-platform.image
            cloud-platform.spdx.json
          if-no-files-found: error
