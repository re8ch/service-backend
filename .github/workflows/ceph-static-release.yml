name: ceph-static-release
on:
  workflow_dispatch:
    inputs:
      operation_id: {description: Optional legacy ReleaseOperation name; mutually exclusive with direct inputs, required: false, type: string}
      release: {description: Ceph release name for a direct cloud request, required: false, type: string}
      action: {description: Bounded operation, required: true, default: reconcile, type: choice, options: [reconcile, force-reconcile, reset, suspend, resume, rollback]}
      approved_digest: {description: Optional reviewed digest; required for rollback, required: false, type: string}
      reason: {description: Audit reason, required: false, type: string}
      approval_ref: {description: Approval reference; required for rollback, required: false, type: string}
      force_objects: {description: Optional JSON array of exact contract-authorized objects, required: false, type: string}
permissions: {contents: read, id-token: write, packages: read}
concurrency: {group: ceph-runtime-operations, cancel-in-progress: false, queue: max}
jobs:
  infra:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 30
    environment: release-executor-ceph-infra
    outputs:
      release: ${{ steps.operation.outputs.release }}
      action: ${{ steps.operation.outputs.action }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
      with: {version: v1.33.1}
    - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
      with: {version: '2.9.5'}
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
    - name: Acquire exact infra identity
      env:
        KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
        EXECUTOR_AUDIENCE: https://kube-api.re8ch.com/release-executor-ceph-infra
      run: |
        set -euo pipefail
        kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
        export KUBECONFIG="$kubeconfig"
        python operations/releases/refresh_kubeconfig.py --initialize
        echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
        echo "EXECUTOR_AUDIENCE=$EXECUTOR_AUDIENCE" >> "$GITHUB_ENV"
    - id: operation
      env:
        REQUEST_INPUTS: '${{ toJSON(inputs) }}'
      run: |
        set -euo pipefail
        printf '%s' "$REQUEST_INPUTS" > "$RUNNER_TEMP/request-inputs.json"
        python operations/releases/ceph_cloud_request.py --inputs "$RUNNER_TEMP/request-inputs.json" --output-dir "$RUNNER_TEMP/request"
        cp "$RUNNER_TEMP/request/operation-resource.json" "$RUNNER_TEMP/operation-resource.json"
        cp "$RUNNER_TEMP/request/static-release.json" "$RUNNER_TEMP/static-release.json"
        echo "RELEASE=$(jq -r .spec.releaseRef "$RUNNER_TEMP/operation-resource.json")" >> "$GITHUB_ENV"
        echo "ACTION=$(jq -r .spec.action "$RUNNER_TEMP/operation-resource.json")" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: 'ceph-request-${{ github.run_id }}'
        path: '${{ runner.temp }}/request/*.json'
        retention-days: 30
        overwrite: true
        if-no-files-found: error
    - name: Pull approved signed bundle and materialize operation
      run: |
        set -euo pipefail
        repository="$(jq -r .spec.bundleRepository "$RUNNER_TEMP/static-release.json")"
        projected="$(jq -r .spec.bundleDigest "$RUNNER_TEMP/static-release.json")"
        approved="$(jq -r .spec.approvedDigest "$RUNNER_TEMP/operation-resource.json")"
        if [[ "$ACTION" != rollback ]]; then test "$approved" = "$projected"; fi
        mkdir -p "$RUNNER_TEMP/bundle"
        flux pull artifact "${repository}@${approved}" --output "$RUNNER_TEMP/bundle"
        if [[ "$ACTION" == rollback ]]; then
          mkdir -p "$RUNNER_TEMP/current-bundle"
          flux pull artifact "${repository}@${projected}" --output "$RUNNER_TEMP/current-bundle"
        fi
        state_name="ssa-state-${RELEASE}"
        kubectl get configmap "$state_name" -n rook-ceph -o json > "$RUNNER_TEMP/state-configmap.json"
        python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-configmap.json" --state-dir "$RUNNER_TEMP/state" --release-id "$RELEASE"
        python operations/releases/ceph_operation.py --resource "$RUNNER_TEMP/operation-resource.json" --static-release "$RUNNER_TEMP/static-release.json" \
          --contract "contracts/releases/ceph/${RELEASE}.yaml" --metadata "$RUNNER_TEMP/bundle/bundle-metadata.json" \
          --state-dir "$RUNNER_TEMP/state" --output "$RUNNER_TEMP/operation.json"
    - name: Apply schema and RBAC stages
      if: steps.operation.outputs.action == 'reconcile' || steps.operation.outputs.action == 'force-reconcile' || steps.operation.outputs.action == 'rollback'
      run: |
        set -euo pipefail
        args=()
        if [[ "$ACTION" != rollback ]]; then
          for stage in crd-schema cluster-rbac; do
            if jq -e --arg stage "$stage" '.stages[] | select(.name == $stage)' "$RUNNER_TEMP/bundle/bundle-metadata.json" >/dev/null; then
              args+=(--stage "$stage")
            fi
          done
        fi
        if ((${#args[@]})); then
          python operations/releases/ssa_executor.py --contract "contracts/releases/ceph/${RELEASE}.yaml" --operation "$RUNNER_TEMP/operation.json" \
            --bundle "$RUNNER_TEMP/bundle/release.bundle" --state-dir "$RUNNER_TEMP/state" "${args[@]}" --partial > "$RUNNER_TEMP/infra-result.json"
        else
          jq -n --arg operation "$(jq -r .metadata.uid "$RUNNER_TEMP/operation-resource.json")" --arg release "$RELEASE" \
            '{apiVersion:"delivery.re8ch.com/stage-result/v1alpha1",operationId:$operation,releaseId:$release,stages:[],outcome:"healthy",health:{status:"healthy",reason:"bundle has no infra stages, or automatic rollback deliberately skips them"}}' \
            > "$RUNNER_TEMP/infra-result.json"
        fi
        python operations/releases/refresh_kubeconfig.py
        if [[ -n "${{ inputs.operation_id }}" ]]; then
          kubectl patch releaseoperation.delivery.re8ch.com "${{ inputs.operation_id }}" -n flux-system --subresource=status --type=merge \
            -p "$(jq -n --arg now "$(date -u +%FT%TZ)" '{status:{phase:"InfraApplied",infra:{finishedAt:$now,result:"healthy"}}}')"
        fi
    - name: Preserve workflow failure evidence
      if: failure()
      run: |
        python -c 'import datetime as dt,json,os; print(json.dumps({"apiVersion":"delivery.re8ch.com/workflow-failure/v1alpha1","outcome":"failed","finishedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"runId":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"health":{"status":"unknown","reason":"workflow step failed; inspect this run before trusting older accepted state"}}))' > "$RUNNER_TEMP/workflow-failure.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: 'ceph-infra-${{ github.run_id }}'
        path: |
          ${{ runner.temp }}/infra-result.json
          ${{ runner.temp }}/workflow-failure.json
        retention-days: 30
        if-no-files-found: ignore
  runtime:
    needs: infra
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 35
    environment: release-executor-ceph-runtime
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
      with: {version: v1.33.1}
    - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
      with: {version: '2.9.5'}
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
    - name: Acquire runtime-only identity
      env:
        KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
        EXECUTOR_AUDIENCE: https://kube-api.re8ch.com/release-executor-ceph-runtime
      run: |
        set -euo pipefail
        kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
        export KUBECONFIG="$kubeconfig"
        python operations/releases/refresh_kubeconfig.py --initialize
        echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
        echo "EXECUTOR_AUDIENCE=$EXECUTOR_AUDIENCE" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: 'ceph-request-${{ github.run_id }}', path: '${{ runner.temp }}'}
    - name: Rematerialize immutable request and durable state
      env: {RELEASE: '${{ needs.infra.outputs.release }}', ACTION: '${{ needs.infra.outputs.action }}'}
      run: |
        set -euo pipefail
        repository="$(jq -r .spec.bundleRepository "$RUNNER_TEMP/static-release.json")"
        projected="$(jq -r .spec.bundleDigest "$RUNNER_TEMP/static-release.json")"
        approved="$(jq -r .spec.approvedDigest "$RUNNER_TEMP/operation-resource.json")"
        mkdir -p "$RUNNER_TEMP/bundle"
        flux pull artifact "${repository}@${approved}" --output "$RUNNER_TEMP/bundle"
        if [[ "$ACTION" == rollback ]]; then
          mkdir -p "$RUNNER_TEMP/current-bundle"
          flux pull artifact "${repository}@${projected}" --output "$RUNNER_TEMP/current-bundle"
        fi
        kubectl get configmap "ssa-state-${RELEASE}" -n rook-ceph -o json > "$RUNNER_TEMP/state-configmap.json"
        python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-configmap.json" --state-dir "$RUNNER_TEMP/state" --release-id "$RELEASE"
        python operations/releases/ceph_operation.py --resource "$RUNNER_TEMP/operation-resource.json" --static-release "$RUNNER_TEMP/static-release.json" \
          --contract "contracts/releases/ceph/${RELEASE}.yaml" --metadata "$RUNNER_TEMP/bundle/bundle-metadata.json" \
          --state-dir "$RUNNER_TEMP/state" --output "$RUNNER_TEMP/operation.json"
    - name: Apply runtime and Ceph custom-resource stages
      if: needs.infra.outputs.action == 'reconcile' || needs.infra.outputs.action == 'force-reconcile' || needs.infra.outputs.action == 'rollback'
      env: {RELEASE: '${{ needs.infra.outputs.release }}', ACTION: '${{ needs.infra.outputs.action }}'}
      run: |
        set -euo pipefail
        args=()
        stages=(runtime custom-resources)
        if [[ "$ACTION" == rollback ]]; then stages=(runtime); fi
        for stage in "${stages[@]}"; do
          if jq -e --arg stage "$stage" '.stages[] | select(.name == $stage)' "$RUNNER_TEMP/bundle/bundle-metadata.json" >/dev/null; then
            args+=(--stage "$stage")
          fi
        done
        if ((${#args[@]})); then
          executor_args=("${args[@]}" --partial)
          if [[ "$ACTION" == rollback ]]; then
            executor_args+=(--current-bundle "$RUNNER_TEMP/current-bundle/release.bundle" --rollback-stage runtime)
          fi
          python operations/releases/ssa_executor.py --contract "contracts/releases/ceph/${RELEASE}.yaml" --operation "$RUNNER_TEMP/operation.json" \
            --bundle "$RUNNER_TEMP/bundle/release.bundle" --state-dir "$RUNNER_TEMP/state" "${executor_args[@]}" > "$RUNNER_TEMP/result.json"
        else
          jq -n --arg operation "$(jq -r .metadata.uid "$RUNNER_TEMP/operation-resource.json")" --arg release "$RELEASE" \
            '{apiVersion:"delivery.re8ch.com/stage-result/v1alpha1",operationId:$operation,releaseId:$release,stages:[],outcome:"healthy",health:{status:"healthy",reason:"bundle has no runtime stages"}}' \
            > "$RUNNER_TEMP/result.json"
        fi
        python operations/releases/refresh_kubeconfig.py
        python operations/releases/ceph_health.py --release "$RELEASE" > "$RUNNER_TEMP/ceph-health.json"
    - name: Preserve workflow failure evidence
      if: failure()
      run: |
        python -c 'import datetime as dt,json,os; print(json.dumps({"apiVersion":"delivery.re8ch.com/workflow-failure/v1alpha1","outcome":"failed","finishedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"runId":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"health":{"status":"unknown","reason":"workflow step failed; inspect this run before trusting older accepted state"}}))' > "$RUNNER_TEMP/workflow-failure.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: 'ceph-runtime-${{ github.run_id }}'
        path: |
          ${{ runner.temp }}/result.json
          ${{ runner.temp }}/ceph-health.json
          ${{ runner.temp }}/workflow-failure.json
        retention-days: 30
        if-no-files-found: error
  accept:
    needs: [infra, runtime]
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 30
    environment: release-executor-ceph-infra
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
      with: {version: v1.33.1}
    - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
      with: {version: '2.9.5'}
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
    - name: Acquire final infra identity
      env: {KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}', EXECUTOR_AUDIENCE: https://kube-api.re8ch.com/release-executor-ceph-infra}
      run: |
        set -euo pipefail
        kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
        export KUBECONFIG="$kubeconfig"
        python operations/releases/refresh_kubeconfig.py --initialize
        echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
        echo "EXECUTOR_AUDIENCE=$EXECUTOR_AUDIENCE" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with: {name: 'ceph-request-${{ github.run_id }}', path: '${{ runner.temp }}'}
    - name: Verify request again and materialize durable state
      env: {RELEASE: '${{ needs.infra.outputs.release }}', ACTION: '${{ needs.infra.outputs.action }}'}
      run: |
        set -euo pipefail
        repository="$(jq -r .spec.bundleRepository "$RUNNER_TEMP/static-release.json")"
        projected="$(jq -r .spec.bundleDigest "$RUNNER_TEMP/static-release.json")"
        approved="$(jq -r .spec.approvedDigest "$RUNNER_TEMP/operation-resource.json")"
        mkdir -p "$RUNNER_TEMP/bundle"
        flux pull artifact "${repository}@${approved}" --output "$RUNNER_TEMP/bundle"
        if [[ "$ACTION" == rollback ]]; then
          mkdir -p "$RUNNER_TEMP/current-bundle"
          flux pull artifact "${repository}@${projected}" --output "$RUNNER_TEMP/current-bundle"
        fi
        kubectl get configmap "ssa-state-${RELEASE}" -n rook-ceph -o json > "$RUNNER_TEMP/state-configmap.json"
        python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-configmap.json" --state-dir "$RUNNER_TEMP/state" --release-id "$RELEASE"
        python operations/releases/ceph_operation.py --resource "$RUNNER_TEMP/operation-resource.json" --static-release "$RUNNER_TEMP/static-release.json" \
          --contract "contracts/releases/ceph/${RELEASE}.yaml" --metadata "$RUNNER_TEMP/bundle/bundle-metadata.json" --state-dir "$RUNNER_TEMP/state" --output "$RUNNER_TEMP/operation.json"
        args=()
        if [[ "$ACTION" == rollback ]]; then
          args+=(--no-stage-apply --current-bundle "$RUNNER_TEMP/current-bundle/release.bundle" --rollback-stage runtime)
        elif [[ "$ACTION" == reconcile || "$ACTION" == force-reconcile ]]; then
          for stage in storage-class health-acceptance; do
            if jq -e --arg stage "$stage" '.stages[] | select(.name == $stage)' "$RUNNER_TEMP/bundle/bundle-metadata.json" >/dev/null; then
              args+=(--stage "$stage")
            fi
          done
          if ((${#args[@]} == 0)); then args+=(--no-stage-apply); fi
        fi
        python operations/releases/ssa_executor.py --contract "contracts/releases/ceph/${RELEASE}.yaml" --operation "$RUNNER_TEMP/operation.json" \
          --bundle "$RUNNER_TEMP/bundle/release.bundle" --state-dir "$RUNNER_TEMP/state" "${args[@]}" > "$RUNNER_TEMP/result.json"
        python operations/releases/refresh_kubeconfig.py
        python operations/releases/operation_materialize.py persist --state-dir "$RUNNER_TEMP/state" --release-id "$RELEASE" --result "$RUNNER_TEMP/result.json" --output "$RUNNER_TEMP/state-configmap-apply.json"
        kubectl apply --server-side --field-manager="re8ch-release-state/${RELEASE}" -f "$RUNNER_TEMP/state-configmap-apply.json"
        result="$(jq -c . "$RUNNER_TEMP/result.json")"; state="$(cat "$RUNNER_TEMP/state/state/${RELEASE}.json")"
        if [[ -n "${{ inputs.operation_id }}" ]]; then
          kubectl patch releaseoperation.delivery.re8ch.com "${{ inputs.operation_id }}" -n flux-system --subresource=status --type=merge -p "$(jq -n --argjson result "$result" '{status:{phase:"Succeeded",terminalResult:$result}}')"
        fi
        if [[ -n "${{ inputs.operation_id }}" ]]; then
          kubectl patch staticrelease.delivery.re8ch.com "$RELEASE" -n flux-system --subresource=status --type=merge -p "$(jq -n --argjson state "$state" '{status:{acceptedDigest:$state.appliedDigest,appliedDigest:$state.appliedDigest,healthyDigest:$state.healthyDigest,inventoryDigest:$state.inventoryDigest,currentOperation:$state.lastOperationId,suspended:($state.suspended // false),conditions:[{type:"Accepted",status:"True",reason:"SignatureVerified"},{type:"Applied",status:"True",reason:"SSAComplete"},{type:"Healthy",status:"True",reason:"HealthAcceptancePassed"}],history:[{chartName:$state.releaseId,digest:$state.appliedDigest,status:"deployed",version:$state.sequence}]}}')"
        fi
    - name: Preserve workflow failure evidence
      if: failure()
      run: |
        python -c 'import datetime as dt,json,os; print(json.dumps({"apiVersion":"delivery.re8ch.com/workflow-failure/v1alpha1","outcome":"failed","finishedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"runId":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"health":{"status":"unknown","reason":"workflow step failed; inspect this run before trusting older accepted state"}}))' > "$RUNNER_TEMP/workflow-failure.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: 'ceph-accept-${{ github.run_id }}'
        path: |
          ${{ runner.temp }}/result.json
          ${{ runner.temp }}/workflow-failure.json
        retention-days: 30
        if-no-files-found: ignore
