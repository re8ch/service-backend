name: Root Flux RBAC recovery

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Signed merged service-backend commit to restore
        required: true
        type: string

permissions: {contents: read}
concurrency: {group: root-flux-rbac-recovery, cancel-in-progress: false}

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: root-flux-recovery
    permissions: {contents: read, id-token: write}
    env:
      EXECUTOR_AUDIENCE: https://kube-api.re8ch.com/root-flux-recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
        with: {version: v1.33.1}
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2'
      - name: Require the exact signed merged source
        env: {GH_TOKEN: '${{ github.token }}', SOURCE_REVISION: '${{ inputs.revision }}'}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION" --jq '.commit.verification.verified')" = true
          git checkout --detach "$SOURCE_REVISION"
      - name: Acquire bounded root recovery identity
        run: |
          set -euo pipefail
          curl -fsS --get -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$EXECUTOR_AUDIENCE" "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$RUNNER_TEMP/oidc.json"
          token="$(jq -r .value "$RUNNER_TEMP/oidc.json")"; echo "::add-mask::$token"
          kubeconfig="$RUNNER_TEMP/root-recovery.kubeconfig"
          kubectl config --kubeconfig "$kubeconfig" set-cluster re8ch-main --server=https://kube-api.service.re8ch.com
          kubectl config --kubeconfig "$kubeconfig" set-credentials root-recovery --token="$token"
          kubectl config --kubeconfig "$kubeconfig" set-context root-recovery --cluster=re8ch-main --user=root-recovery
          kubectl config --kubeconfig "$kubeconfig" use-context root-recovery
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
      - name: Verify bounded OIDC claims
        run: |
          set -euo pipefail
          jq -r '.value | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") |
            . + ("=" * ((4 - (length % 4)) % 4)) | @base64d | fromjson |
            {aud, repository_id, repository_owner_id, repository, repository_visibility,
             ref, runner_environment, workflow_ref, event_name, environment} | to_entries[] |
            "\(.key)=\(.value)"' "$RUNNER_TEMP/oidc.json"
          payload="$(jq -r '.value | split(".")[1] | gsub("-"; "+") | gsub("_"; "/") |
            . + ("=" * ((4 - (length % 4)) % 4)) | @base64d' "$RUNNER_TEMP/oidc.json")"
          test "$(jq -r .aud <<<"$payload")" = "$EXECUTOR_AUDIENCE"
          test "$(jq -r .repository_id <<<"$payload")" = 1367237854
          test "$(jq -r .repository_owner_id <<<"$payload")" = 283958313
          test "$(jq -r .repository <<<"$payload")" = re8ch/service-backend
          test "$(jq -r .repository_visibility <<<"$payload")" = public
          test "$(jq -r .ref <<<"$payload")" = refs/heads/main
          test "$(jq -r .runner_environment <<<"$payload")" = github-hosted
          test "$(jq -r .workflow_ref <<<"$payload")" = re8ch/service-backend/.github/workflows/root-flux-rbac-recovery.yml@refs/heads/main
          test "$(jq -r .event_name <<<"$payload")" = workflow_dispatch
          test "$(jq -r .environment <<<"$payload")" = root-flux-recovery
      - name: Prove bounded recovery permissions
        run: |
          set -euo pipefail
          test "$(kubectl auth can-i get role/identity-access-domain-supabase-identity -n supabase-identity)" = yes
          test "$(kubectl auth can-i patch role/identity-access-domain-supabase-identity -n supabase-identity)" = yes
          test "$(kubectl auth can-i escalate role/identity-access-domain-supabase-identity -n supabase-identity)" = yes
          test "$(kubectl auth can-i patch gitrepositories.source.toolkit.fluxcd.io/service-backend -n flux-system)" = yes
          test "$(kubectl auth can-i patch kustomizations.kustomize.toolkit.fluxcd.io/service-backend -n flux-system)" = yes
          test "$(kubectl auth can-i create secrets -n flux-system)" = yes
          test "$(kubectl auth can-i get secret/service-backend-github-socks -n flux-system)" = yes
          test "$(kubectl auth can-i patch secret/service-backend-github-socks -n flux-system)" = yes
          for denied in "get secrets -A" "get secret/service-backend-github-ssh -n flux-system" \
            "delete secret/service-backend-github-socks -n flux-system" "create clusterroles.rbac.authorization.k8s.io" \
            "patch deployments -A" "impersonate users"; do
            read -r -a request <<<"$denied"; test "$(kubectl auth can-i "${request[@]}")" = no
          done
      - name: Restore exact root source dependencies and request reconciliation
        env: {SOURCE_REVISION: '${{ inputs.revision }}'}
        run: |
          # shellcheck disable=SC2016,SC2153
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/identity-executor-role.yaml"
          import yaml
          path = "clusters/re8ch/components/ops/github-actions-cloud-domains-executor-rbac.yaml"
          matches = [item for item in yaml.safe_load_all(open(path)) if item and
                     item.get("kind") == "Role" and
                     item.get("metadata", {}).get("namespace") == "supabase-identity" and
                     item.get("metadata", {}).get("name") == "identity-access-domain-supabase-identity"]
          if len(matches) != 1:
              raise SystemExit(f"expected one identity executor Role, got {len(matches)}")
          print(yaml.safe_dump(matches[0], sort_keys=False))
          PY
          kubectl apply --server-side --dry-run=server --force-conflicts --field-manager=kustomize-controller \
            -f "$RUNNER_TEMP/identity-executor-role.yaml" -o name
          kubectl apply --server-side --force-conflicts --field-manager=kustomize-controller \
            -f "$RUNNER_TEMP/identity-executor-role.yaml" -o name
          python - <<'PY' > "$RUNNER_TEMP/service-backend-github-socks.yaml"
          import yaml

          path = "clusters/re8ch/flux-system/service-backend-github-socks.yaml"
          secret = yaml.safe_load(open(path))
          metadata = secret.get("metadata", {}) if isinstance(secret, dict) else {}
          string_data = secret.get("stringData", {}) if isinstance(secret, dict) else {}
          expected_address = "http://identity-egress-gitops.egress-fabric.svc.cluster.local:17893"
          if (
              not isinstance(secret, dict)
              or secret.get("apiVersion") != "v1"
              or secret.get("kind") != "Secret"
              or metadata.get("name") != "service-backend-github-socks"
              or metadata.get("namespace") != "flux-system"
              or secret.get("type") != "Opaque"
              or string_data != {"address": expected_address}
          ):
              raise SystemExit("reviewed root proxy Secret differs from the bounded recovery contract")
          print(yaml.safe_dump(secret, sort_keys=False))
          PY
          kubectl apply --server-side --dry-run=server --force-conflicts --field-manager=kustomize-controller \
            -f "$RUNNER_TEMP/service-backend-github-socks.yaml" -o name
          kubectl apply --server-side --force-conflicts --field-manager=kustomize-controller \
            -f "$RUNNER_TEMP/service-backend-github-socks.yaml" -o name
          kubectl patch gitrepository.source.toolkit.fluxcd.io/service-backend -n flux-system \
            --type=merge --patch='{"spec":{"suspend":false}}' --dry-run=server -o name
          kubectl patch gitrepository.source.toolkit.fluxcd.io/service-backend -n flux-system \
            --type=merge --patch='{"spec":{"suspend":false}}' -o name
          kubectl patch kustomization.kustomize.toolkit.fluxcd.io/service-backend -n flux-system \
            --type=merge --patch='{"spec":{"suspend":false}}' --dry-run=server -o name
          kubectl patch kustomization.kustomize.toolkit.fluxcd.io/service-backend -n flux-system \
            --type=merge --patch='{"spec":{"suspend":false}}' -o name
          request_id="github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for target in gitrepository.source.toolkit.fluxcd.io/service-backend \
            kustomization.kustomize.toolkit.fluxcd.io/service-backend; do
            kubectl annotate "$target" -n flux-system \
              "reconcile.fluxcd.io/requestedAt=$request_id" --overwrite --dry-run=server -o name
            kubectl annotate "$target" -n flux-system \
              "reconcile.fluxcd.io/requestedAt=$request_id" --overwrite -o name
          done
          printf '### Root Flux bounded recovery\n\n- restored revision: `%s`\n- restored objects: `Role/supabase-identity/identity-access-domain-supabase-identity`, `Secret/flux-system/service-backend-github-socks`\n- reconciliation request: `%s`\n- prune: disabled\n' \
            "$SOURCE_REVISION" "$request_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Observe root revision and controller availability
        env: {SOURCE_REVISION: '${{ inputs.revision }}'}
        run: |
          set -euo pipefail
          for controller in source-controller kustomize-controller notification-controller; do
            available="$(kubectl get deployment "$controller" -n flux-system -o 'jsonpath={.status.availableReplicas}')"
            printf '%s availableReplicas=%s\n' "$controller" "${available:-0}" >> "$GITHUB_STEP_SUMMARY"
          done
          for _ in $(seq 1 36); do
            source_revision="$(kubectl get gitrepository service-backend -n flux-system -o 'jsonpath={.status.artifact.revision}' 2>/dev/null || true)"
            applied_revision="$(kubectl get kustomization service-backend -n flux-system -o 'jsonpath={.status.lastAppliedRevision}' 2>/dev/null || true)"
            if [[ "$source_revision" == *"$SOURCE_REVISION"* && "$applied_revision" == *"$SOURCE_REVISION"* ]]; then
              printf '\nRoot source and kustomization reached `%s`.\n' "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          {
            echo
            echo 'The bounded repair succeeded, but root Flux did not report the requested revision in time.'
            printf '\n- observed source revision: `%s`\n' "${source_revision:-<none>}"
            printf -- '- observed applied revision: `%s`\n' "${applied_revision:-<none>}"
            echo
            echo '#### GitRepository conditions'
            kubectl get gitrepository service-backend -n flux-system \
              -o 'jsonpath={range .status.conditions[*]}- {.type}: {.status} ({.reason}) {.message}{"\n"}{end}' || true
            echo
            echo '#### Kustomization conditions'
            kubectl get kustomization service-backend -n flux-system \
              -o 'jsonpath={range .status.conditions[*]}- {.type}: {.status} ({.reason}) {.message}{"\n"}{end}' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
