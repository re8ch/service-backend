name: Root Flux RBAC recovery

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Signed merged service-backend commit to restore
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: root-flux-rbac-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 8
    environment: release-executor-agent-runtime
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact signed merged source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION" --jq '.commit.verification.verified')" = true
          git checkout --detach "$SOURCE_REVISION"
      - name: Restore exact agent executor RBAC and request root reconciliation
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          kubectl=(sudo -n k3s kubectl)
          manifest=clusters/re8ch/components/ops/github-actions-agent-runtime-executor-rbac.yaml
          test -f "$manifest"

          "${kubectl[@]}" apply --server-side --dry-run=server \
            --field-manager=kustomize-controller -f "$manifest" -o name
          "${kubectl[@]}" apply --server-side \
            --field-manager=kustomize-controller -f "$manifest" -o name

          executor='github-actions:release-executor-agent-runtime:recovery-probe'
          group='re8ch:release-executor:agent-runtime'
          test "$("${kubectl[@]}" auth can-i --as="$executor" --as-group="$group" \
            get configmap/ssa-state-agent-runtime-domain-tenant-infrastructure -n tenant-infrastructure)" = yes
          test "$("${kubectl[@]}" auth can-i --as="$executor" --as-group="$group" \
            patch httproute.gateway.networking.k8s.io/tenant-mcp -n toolhive-system)" = yes

          request_id="github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for target in \
            gitrepository.source.toolkit.fluxcd.io/service-backend \
            kustomization.kustomize.toolkit.fluxcd.io/service-backend; do
            "${kubectl[@]}" annotate "$target" -n flux-system \
              "reconcile.fluxcd.io/requestedAt=$request_id" --overwrite --dry-run=server -o name
            "${kubectl[@]}" annotate "$target" -n flux-system \
              "reconcile.fluxcd.io/requestedAt=$request_id" --overwrite -o name
          done

          {
            echo '### Root Flux bounded recovery'
            echo
            echo "- restored revision: \`$SOURCE_REVISION\`"
            echo "- applied object set: \`$manifest\`"
            echo "- reconciliation request: \`$request_id\`"
            echo '- prune: disabled'
            echo '- controller restarts: none'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Observe root revision and controller availability
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          : "${SOURCE_REVISION:?}"
          kubectl=(sudo -n k3s kubectl)
          for controller in source-controller kustomize-controller notification-controller; do
            available="$("${kubectl[@]}" get deployment "$controller" -n flux-system -o "jsonpath={.status.availableReplicas}")"
            printf '%s availableReplicas=%s\n' "$controller" "${available:-0}" >> "$GITHUB_STEP_SUMMARY"
          done
          for _ in $(seq 1 36); do
            source_revision="$("${kubectl[@]}" get gitrepository service-backend -n flux-system -o "jsonpath={.status.artifact.revision}" 2>/dev/null || true)"
            applied_revision="$("${kubectl[@]}" get kustomization service-backend -n flux-system -o "jsonpath={.status.lastAppliedRevision}" 2>/dev/null || true)"
            if [[ "$source_revision" == *"$SOURCE_REVISION"* && "$applied_revision" == *"$SOURCE_REVISION"* ]]; then
              printf '\nRoot source and kustomization reached %s.\n' "\`$SOURCE_REVISION\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'RBAC restoration succeeded, but root Flux did not report the requested revision inside the bounded observation window.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
