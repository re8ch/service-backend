name: GitOps observation evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {}
concurrency:
  group: gitops-maintenance-recording
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {owner: re8ch, repo: service-backend, workflow: main-domain-reconcile.yml}
          - {owner: strata-silica, repo: storage-gitops, workflow: storage-reconcile.yml}
          - {owner: pillars-infra, repo: network-gitops, workflow: networking-reconcile.yml}
          - {owner: 8iops, repo: agent-gitops, workflow: agent-runtime-reconcile.yml}
          - {owner: siren-observer, repo: observability-gitops, workflow: observability-metering-reconcile.yml}
          - {owner: re8ch, repo: identity-gitops, workflow: identity-access-reconcile.yml}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-actions: read
          permission-contents: write
      - id: record
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: re8ch
          repositories: service-backend
          permission-contents: write
          permission-issues: write
          permission-organization-projects: write
      - env:
          GH_TOKEN: ${{ steps.record.outputs.token }}
          WIKI_GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          WORKFLOW: ${{ matrix.workflow }}
        run: bash operations/github-maintenance/record-observation.sh
