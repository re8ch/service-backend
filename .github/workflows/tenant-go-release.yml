name: tenant-go-release
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/tenant-go-release.yml
      - platform/apps/tenant-mcp/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tenant-go-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tenant-go-validate:
    name: tenant-go-validate
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 2}
      - id: select
        name: Select tenant Go validation
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -Eq '^(\.github/workflows/tenant-go-release\.yml|platform/apps/tenant-mcp/|clusters/re8ch/charts/birfucate-metering/|clusters/re8ch/components/ai-operations/ai_operations_mcp\.py$|operations/mcp-conformance/release-tenant-infrastructure\.sh$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: platform/apps/tenant-mcp/go.mod
          cache: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: steps.select.outputs.run == 'true'
        with: {version: v4.2.3}
      - if: steps.select.outputs.run == 'true'
        run: go test -race ./... && go vet ./...
        working-directory: platform/apps/tenant-mcp
      - if: steps.select.outputs.run == 'true'
        run: python3 -m pip install 'PyYAML>=6.0.2' 'pytest>=8.3'
      - if: steps.select.outputs.run == 'true'
        run: python3 -m pytest tests/test_tenant_infrastructure_gitops.py tests/test_tenant_image_delivery.py -q
      - if: steps.select.outputs.run == 'true'
        run: python3 platform/apps/tenant-mcp/differential_test.py
      - if: steps.select.outputs.run == 'true' && github.event_name == 'pull_request'
        run: docker build -f platform/apps/tenant-mcp/Dockerfile -t re8ch-tenant-mcp:pr .
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: tenant-go-validate
    # Build and publish on restricted-node-6dc3f140f9 through its region-pinned Mihomos BuildKit.
    # Macmini is intentionally excluded from the tenant MCP release path.
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated restricted-node-6dc3f140f9 release authentication
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/tenant-go-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          # Keep the governed builder index separate from the disposable
          # registry authentication config.
          export BUILDX_CONFIG="${HOME}/.docker/buildx"
          echo "BUILDX_CONFIG=$BUILDX_CONFIG" >> "$GITHUB_ENV"
          docker buildx inspect --bootstrap r640-mihomos >/dev/null
          echo "TENANT_IMAGE_BUILDER=r640-mihomos" >> "$GITHUB_ENV"
      - run: ./operations/mcp-conformance/release-tenant-infrastructure.sh
        env:
          HARBOR_USERNAME: ${{ secrets.TENANT_MCP_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.TENANT_MCP_REGISTRY_PASSWORD }}
          TENANT_IMAGE_REPOSITORY: registry.re8ch.com/image/re8ch-tenant-mcp
          TENANT_IMAGE_DOCKERFILE: platform/apps/tenant-mcp/Dockerfile
          TENANT_IMAGE_ARTIFACT_NAME: tenant-mcp
          TENANT_IMAGE_INLINE_AUTH: "1"
          TENANT_IMAGE_SKIP_FINALIZE: "1"
          # Cold base-image and module pulls on the restricted-node-6dc3f140f9 builder can exceed
          # the generic five-minute publisher default.
          TENANT_IMAGE_PUSH_TIMEOUT_SECONDS: "900"
          # Keep Harbor OAuth token requests in the region-pinned BuildKit.
          BUILDKIT_NO_CLIENT_TOKEN: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenant-go-release-${{ github.sha }}
          path: tenant-mcp.image
          if-no-files-found: error
      - name: Remove temporary registry authorization
        if: always()
        run: |
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" || true
  finalize:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    environment: production
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tenant-go-release-${{ github.sha }}
      - name: Sign and verify immutable Harbor image with pinned Cosign
        timeout-minutes: 6
        run: |
          image="$(cat tenant-mcp.image)"
          if [[ ! "$image" =~ ^registry\.re8ch\.com/image/re8ch-tenant-mcp@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid tenant MCP image reference" >&2
            exit 1
          fi

          export DOCKER_CONFIG="${RUNNER_TEMP}/tenant-go-finalize-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.re8ch.com --username "$HARBOR_USERNAME" --password-stdin >/dev/null

          pull_cosign() {
            local attempt
            for attempt in 1 2; do
              if timeout --signal=TERM --kill-after=15s 75s docker pull "$COSIGN_IMAGE"; then
                return 0
              fi
              echo "Pinned Cosign image pull attempt ${attempt}/2 failed" >&2
              sleep 5
            done
            return 1
          }

          run_cosign() {
            timeout --signal=TERM --kill-after=15s 90s docker run --rm --pull never --network host \
              --env ACTIONS_ID_TOKEN_REQUEST_URL \
              --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              --env DOCKER_CONFIG=/auth \
              --volume "$DOCKER_CONFIG:/auth:ro" \
              --entrypoint /ko-app/cosign \
              "$COSIGN_IMAGE" "$@"
          }

          # BuildKit already publishes SBOM and provenance attestations in the OCI index.
          pull_cosign
          run_cosign sign --yes "$image"
          run_cosign verify \
            --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/tenant-go-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" >/dev/null
          echo "TENANT_MCP_IMAGE=$image" >> "$GITHUB_ENV"
        env:
          # Linux/amd64 manifest for cosign v2.6.0. Avoid the installer bootstrap
          # and do not rely on the oversized internal mirror being warm.
          COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign@sha256:faa13f289a3e2fca3b82cd0632402d33a2b06577a6a5a2e0eb3ddbb131828e32
          HARBOR_USERNAME: ${{ secrets.TENANT_MCP_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.TENANT_MCP_REGISTRY_PASSWORD }}
      - name: Remove temporary registry authorization
        if: always()
        run: |
          finalize_config="${RUNNER_TEMP}/tenant-go-finalize-docker"
          rm -f "$finalize_config/config.json"
          rmdir "$finalize_config" || true
      - name: Create scoped promotion token
        id: promoter
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOMAIN_PROMOTER_APP_ID }}
          private-key: ${{ secrets.DOMAIN_PROMOTER_PRIVATE_KEY }}
          owner: re8ch
          repositories: service-backend
          permission-contents: write
          permission-pull-requests: write
      - name: Check out current desired state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          path: desired-state
      - name: Update the single image reference
        id: image
        working-directory: desired-state
        run: |
          # Do not let an old rerun roll back a newer source or build definition.
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- platform/apps/tenant-mcp .github/workflows/tenant-go-release.yml operations/mcp-conformance/release-tenant-infrastructure.sh; then
            echo 'Source changed since this build; leave desired state unchanged.'
            exit 0
          fi
          sed -i "s|^  image: .*|  image: $TENANT_MCP_IMAGE|" clusters/re8ch/tenant-mcp-image/image.yaml
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - name: Open one GitHub-signed image PR
        if: steps.image.outputs.current == 'true'
        id: image-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.promoter.outputs.token }}
          path: desired-state
          base: main
          branch: codex/tenant-mcp-image
          sign-commits: true
          add-paths: clusters/re8ch/tenant-mcp-image/image.yaml
          commit-message: 'chore(tenant-mcp): advance verified image reference'
          title: 'chore(tenant-mcp): advance verified image reference'
          body: |
            Image: `${{ env.TENANT_MCP_IMAGE }}`
            Source: ${{ github.sha }}
            Build and signature verification: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Flux syncs this reference to the active observability HelmRelease. No domain bundle is published.
      - name: Request merge through repository rules
        if: steps.image-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.promoter.outputs.token }}
          PR: ${{ steps.image-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenant-go-finalized-${{ github.sha }}
          path: tenant-mcp.image
          if-no-files-found: error
