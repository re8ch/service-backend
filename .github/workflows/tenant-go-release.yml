name: tenant-go-release
on:
  pull_request:
    paths:
      - .github/workflows/tenant-go-release.yml
      - platform/apps/tenant-mcp/**
      - clusters/re8ch/charts/birfucate-metering/**
      - clusters/re8ch/components/ai-operations/ai_operations_mcp.py
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/tenant-go-release.yml
      - platform/apps/tenant-mcp/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tenant-go-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: platform/apps/tenant-mcp/go.mod
          cache-dependency-path: platform/apps/tenant-mcp/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: platform/apps/tenant-mcp
      - run: python3 -m pip install 'PyYAML>=6.0.2' 'pytest>=8.3'
      - run: python3 -m pytest tests/test_tenant_infrastructure_gitops.py -q
      - run: python3 platform/apps/tenant-mcp/differential_test.py
      - run: docker build -f platform/apps/tenant-mcp/Dockerfile -t re8ch-tenant-mcp:pr .
  release:
    if: github.event_name != 'pull_request'
    needs: validate
    # Harbor layer uploads from hosted runners stall at the public edge.
    # Use the trusted Macmini runner's direct registry path, as tenant-release does.
    runs-on: [self-hosted, macOS, ARM64, macmini-a1]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/tenant-go-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          # Docker Desktop's inherited resolver returns a 198.18/15 fake IP for
          # registry.re8ch.com. Use public DNS only inside this disposable builder.
          printf '[dns]\nnameservers = ["1.1.1.1"]\n' > "$RUNNER_TEMP/tenant-go-buildkitd.toml"
          docker buildx create --name "tenant-go-release-${GITHUB_RUN_ID}" --driver docker-container \
            --buildkitd-config "$RUNNER_TEMP/tenant-go-buildkitd.toml" --use
          docker buildx inspect --bootstrap "tenant-go-release-${GITHUB_RUN_ID}" >/dev/null
          builder_container="buildx_buildkit_tenant-go-release-${GITHUB_RUN_ID}0"
          docker exec "$builder_container" sh -ec 'printf "nameserver 1.1.1.1\n" > /etc/resolv.conf'
          registry_ip="$(docker exec "$builder_container" getent hosts registry.re8ch.com | awk 'NR == 1 {print $1}')"
          case "$registry_ip" in
            ""|198.18.*|198.19.*) echo "Registry DNS did not resolve to a public authority" >&2; exit 1 ;;
          esac
          echo "Builder resolves registry.re8ch.com to $registry_ip"
          echo "TENANT_IMAGE_BUILDER=tenant-go-release-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - run: ./operations/mcp-conformance/release-tenant-infrastructure.sh
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          TENANT_IMAGE_REPOSITORY: registry.re8ch.com/image/re8ch-tenant-mcp
          TENANT_IMAGE_DOCKERFILE: platform/apps/tenant-mcp/Dockerfile
          TENANT_IMAGE_ARTIFACT_NAME: tenant-mcp
          TENANT_IMAGE_INLINE_AUTH: "1"
          # Keep Harbor OAuth token requests in BuildKit, whose disposable DNS
          # config resolves the public registry authority instead of fake IPs.
          BUILDKIT_NO_CLIENT_TOKEN: "1"
          SIGSTORE_CERTIFICATE_IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/tenant-go-release.yml@${{ github.ref }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenant-go-release-${{ github.sha }}
          path: |
            tenant-mcp.image
            tenant-mcp.spdx.json
          if-no-files-found: error
      - if: always()
        run: docker buildx rm "tenant-go-release-${GITHUB_RUN_ID}" || true
