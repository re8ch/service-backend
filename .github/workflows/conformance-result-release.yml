name: conformance-result-release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed merged service-backend commit
        required: true
        type: string
permissions: {contents: read, id-token: write}
concurrency: {group: conformance-result-release, cancel-in-progress: false}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Require merged source
        env: {SOURCE_REVISION: '${{ inputs.revision }}'}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          git checkout --detach "$SOURCE_REVISION"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.9', cache: false}
      - working-directory: operations/api-conformance/result-proxy
        run: go test -race ./... && go vet ./...
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: operations/api-conformance/result-proxy
          platforms: linux/amd64
          push: true
          tags: registry.re8ch.com/auth/api-conformance-result-proxy:${{ inputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Scan immutable image before signing
        env: {IMAGE: 'registry.re8ch.com/auth/api-conformance-result-proxy@${{ steps.build.outputs.digest }}'}
        run: |
          docker run --rm --volume "$HOME/.docker:/root/.docker:ro" \
            ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
        with:
          install-dir: ${{ runner.temp }}/cosign-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Sign and verify immutable digest
        env:
          IMAGE: registry.re8ch.com/auth/api-conformance-result-proxy@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/conformance-result-release.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf '%s\n' "$IMAGE" > conformance-result.image
          printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'conformance-result-${{ inputs.revision }}', path: conformance-result.image, if-no-files-found: error}
