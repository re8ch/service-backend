name: auth-gateway-release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed Cloud Functions master commit to build
        required: true
        type: string
permissions: {contents: read, id-token: write}
concurrency: {group: auth-gateway-release, cancel-in-progress: false}
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate revision
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: '[[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: re8ch/cloud-functions
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          ssh-key: ${{ secrets.CLOUD_FUNCTIONS_RELEASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Require merged source
        env:
          SOURCE_REVISION: ${{ inputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/master
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: go.mod}
      - run: go test -race ./functions/re8ch-auth-gateway && go vet ./functions/re8ch-auth-gateway
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: functions/re8ch-auth-gateway/Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: registry.re8ch.com/auth/re8ch-auth-gateway:${{ inputs.revision }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign and verify immutable digest
        env:
          IMAGE: registry.re8ch.com/auth/re8ch-auth-gateway@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/auth-gateway-release.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf '%s\n' "$IMAGE" > auth-gateway.image
          printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-gateway-release-${{ inputs.revision }}
          path: auth-gateway.image
          if-no-files-found: error
