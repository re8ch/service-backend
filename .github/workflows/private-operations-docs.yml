name: Private operations documentation verification

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gitops-merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GITOPS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
          permission-contents: read
          permission-organization-projects: read
      - name: Verify private documents without publishing their contents
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python operations/github-maintenance/verify_private_docs.py
