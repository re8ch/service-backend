name: adapter-release
on:
  push:
    tags: ['adapter-v*.*.*']
permissions:
  contents: read
concurrency:
  group: adapter-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          printf '%s' "$ADAPTER_REGISTRY_PASSWORD" | helm registry login registry.re8ch.com \
            --username "$ADAPTER_REGISTRY_USERNAME" --password-stdin
          ./operations/adapter/release-oci.sh
        env:
          ADAPTER_REGISTRY_USERNAME: ${{ secrets.ADAPTER_REGISTRY_USERNAME }}
          ADAPTER_REGISTRY_PASSWORD: ${{ secrets.ADAPTER_REGISTRY_PASSWORD }}
