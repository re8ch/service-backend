name: Inspect immutable conformance runner scan
on:
  workflow_dispatch:
    inputs:
      digest: {description: Existing runner SHA256 digest (never deploys or signs), required: true, type: string}
permissions: {contents: read}
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Scan only the fixed runner repository
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/conformance-scan"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            --volume "$RUNNER_TEMP/conformance-scan:/out" \
            ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --image-src remote --scanners vuln --severity HIGH,CRITICAL --format json \
            --output /out/runner.json "registry.re8ch.com/functions-shared/api-conformance-runner@$IMAGE_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: conformance-runner-scan
          path: ${{ runner.temp }}/conformance-scan/runner.json
          retention-days: 30
          if-no-files-found: error
