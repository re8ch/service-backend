name: Cloud release view
on:
  pull_request:
    paths: ['operations/releases/cloud-view/**', '.github/workflows/cloud-release-pages.yml']
  push:
    branches: [main]
    paths: ['operations/releases/cloud-view/**', '.github/workflows/cloud-release-pages.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloud-release-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: node --test operations/releases/cloud-view/*.test.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Select static files without rebuilding or publishing repository contents
        run: |
          mkdir _site
          cp operations/releases/cloud-view/index.html _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
