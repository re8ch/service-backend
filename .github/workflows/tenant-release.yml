name: tenant-release
on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Rebuild even when release inputs did not change
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/tenant-release.yml
      - clusters/re8ch/components/ai-operations/**
      - operations/mcp-conformance/release-tenant-infrastructure.sh
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: tenant-release-production
  cancel-in-progress: false
jobs:
  release:
    # Harbor layer uploads from hosted runners stall at the public edge; this
    # trusted runner reaches Harbor directly while GitHub still owns the run.
    runs-on: [self-hosted, macOS, ARM64, macmini-a1]
    environment: production
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          # The runner's personal Docker config uses a locked macOS Keychain.
          export DOCKER_CONFIG="${RUNNER_TEMP}/tenant-release-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{"cliPluginsExtraDirs":["/Applications/Docker.app/Contents/Resources/cli-plugins"]}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '[dns]\nnameservers = ["1.1.1.1"]\n' > "$RUNNER_TEMP/tenant-release-buildkitd.toml"
          docker buildx create --name "tenant-release-${GITHUB_RUN_ID}" --driver docker-container \
            --buildkitd-config "$RUNNER_TEMP/tenant-release-buildkitd.toml" --use
          docker buildx inspect --bootstrap "tenant-release-${GITHUB_RUN_ID}" >/dev/null
          builder_container="buildx_buildkit_tenant-release-${GITHUB_RUN_ID}0"
          docker exec "$builder_container" sh -ec 'printf "nameserver 1.1.1.1\n" > /etc/resolv.conf'
          registry_ip="$(docker exec "$builder_container" getent hosts registry.re8ch.com | awk 'NR == 1 {print $1}')"
          case "$registry_ip" in
            ""|198.18.*|198.19.*) echo "Registry DNS did not resolve to a public authority" >&2; exit 1 ;;
          esac
          echo "Builder resolves registry.re8ch.com to $registry_ip"
          echo "TENANT_IMAGE_BUILDER=tenant-release-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - id: publish
        run: |
          ./operations/mcp-conformance/release-tenant-infrastructure.sh
          echo "image=$(cat tenant-infrastructure.image)" >> "$GITHUB_OUTPUT"
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          TENANT_IMAGE_INLINE_AUTH: "1"
          TENANT_IMAGE_SKIP_FINALIZE: "1"
          BUILDKIT_NO_CLIENT_TOKEN: "1"
      - if: always()
        run: docker buildx rm "tenant-release-${GITHUB_RUN_ID}" || true
  finalize:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: printf '%s\n' "$TENANT_IMAGE" > tenant-infrastructure.image
        env:
          TENANT_IMAGE: ${{ needs.release.outputs.image }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - run: |
          image="$(cat tenant-infrastructure.image)"
          if [[ ! "$image" =~ ^registry\.re8ch\.com/image/re8ch-ai-operations@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid tenant infrastructure image reference" >&2
            exit 1
          fi
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.re8ch.com --username "$HARBOR_USERNAME" --password-stdin >/dev/null
          syft "$image" -o spdx-json > tenant-infrastructure.spdx.json
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/tenant-release.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$image" >/dev/null
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenant-release-finalized-${{ github.sha }}
          path: |
            tenant-infrastructure.image
            tenant-infrastructure.spdx.json
          if-no-files-found: error
  canary:
    needs: finalize
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - run: ./operations/mcp-conformance/tenant-canary.sh
        env:
          TENANT_CANARY_REFRESH_TOKEN: ${{ secrets.TENANT_CANARY_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenant-canary-${{ github.sha }}
          path: |
            tenant-canary.evidence.json
            tenant-canary.evidence.json.bundle
          if-no-files-found: error
