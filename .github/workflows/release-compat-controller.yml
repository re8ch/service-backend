name: release-compat-controller
on:
  workflow_dispatch:
    inputs:
      revision: {description: Reviewed merged service-backend commit, required: true, type: string}
permissions: {contents: read, id-token: write, packages: write}
concurrency: {group: release-compat-controller, cancel-in-progress: false}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-ceph-compiler
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {fetch-depth: 0, persist-credentials: false}
    - name: Require merged source
      env: {SOURCE_REVISION: '${{ inputs.revision }}'}
      run: |
        [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
        git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
        git checkout --detach "$SOURCE_REVISION"
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with: {go-version: '1.26.10', cache: false}
    - working-directory: operations/releases/release-compat-controller
      run: go test -race ./... && go vet ./...
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: registry.re8ch.com
        username: '${{ secrets.HARBOR_RELEASE_PUBLISHER_USERNAME }}'
        password: '${{ secrets.HARBOR_RELEASE_PUBLISHER_PASSWORD }}'
    - id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: operations/releases/release-compat-controller
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/re8ch/release-compat-controller:${{ inputs.revision }}
          registry.re8ch.com/functions-shared/release-compat-controller:${{ inputs.revision }}
        provenance: mode=max
        sbom: true
    - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
    - name: Sign immutable image
      env:
        GHCR_IMAGE: 'ghcr.io/re8ch/release-compat-controller@${{ steps.build.outputs.digest }}'
        HARBOR_IMAGE: 'registry.re8ch.com/functions-shared/release-compat-controller@${{ steps.build.outputs.digest }}'
      run: |
        for image in "$GHCR_IMAGE" "$HARBOR_IMAGE"; do
          cosign sign --yes "$image"
          cosign verify --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/release-compat-controller.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$image"
        done
        printf '%s\n' "$HARBOR_IMAGE" > release-compat-controller.image
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with: {name: release-compat-controller-image, path: release-compat-controller.image, if-no-files-found: error}
    - id: promoter
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ vars.DOMAIN_PROMOTER_APP_ID }}
        private-key: ${{ secrets.DOMAIN_PROMOTER_PRIVATE_KEY }}
        owner: re8ch
        repositories: service-backend
        permission-contents: write
        permission-pull-requests: write
    - name: Open signed activation PR
      env: {GH_TOKEN: '${{ steps.promoter.outputs.token }}', IMAGE: 'registry.re8ch.com/functions-shared/release-compat-controller@${{ steps.build.outputs.digest }}'}
      run: python operations/releases/promote_release_compat.py --image "$IMAGE"
