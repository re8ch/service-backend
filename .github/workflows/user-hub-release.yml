name: user-hub-release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: User Hub commit already pinned by the service-backend gitlink
        required: true
        type: string

permissions: {contents: read}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned User Hub source
        env:
          USER_HUB_DEPLOY_KEY_B64: ${{ secrets.USER_HUB_DEPLOY_KEY_B64 }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$USER_HUB_DEPLOY_KEY_B64" | base64 --decode > "$HOME/.ssh/user-hub-release"
          chmod 600 "$HOME/.ssh/user-hub-release"
          git config --global url."git@github.com:".insteadOf https://github.com/
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/user-hub-release -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init -- catalogs/platform/modules/user-hub/source
          test "$(git -C catalogs/platform/modules/user-hub/source rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and publish immutable User Hub image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: catalogs/platform/modules/user-hub/source
          push: true
          tags: registry.re8ch.com/auth/user-hub:ui-${{ inputs.revision }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
      - name: Publish digest
        run: echo "registry.re8ch.com/auth/user-hub:ui-${{ inputs.revision }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
