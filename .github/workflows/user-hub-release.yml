name: user-hub-release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: User Hub commit already pinned by the service-backend gitlink
        required: true
        type: string

permissions: {contents: read, id-token: write}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize pinned User Hub source
        env:
          USER_HUB_DEPLOY_KEY_B64: ${{ secrets.USER_HUB_DEPLOY_KEY_B64 }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$USER_HUB_DEPLOY_KEY_B64" | base64 --decode > "$HOME/.ssh/user-hub-release"
          chmod 600 "$HOME/.ssh/user-hub-release"
          git config --global url."git@github.com:".insteadOf https://github.com/
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/user-hub-release -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init -- catalogs/platform/modules/user-hub/source
          test "$(git -C catalogs/platform/modules/user-hub/source rev-parse HEAD)" = "${{ inputs.revision }}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build and publish immutable User Hub image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: catalogs/platform/modules/user-hub/source
          push: true
          tags: registry.re8ch.com/auth/user-hub:ui-${{ inputs.revision }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign and verify immutable User Hub digest
        env:
          IMAGE: registry.re8ch.com/auth/user-hub@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/re8ch/service-backend/.github/workflows/user-hub-release.yml@refs/heads/main
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE"
          printf '%s\n' "$IMAGE" > user-hub.image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-hub-release-${{ inputs.revision }}
          path: user-hub.image
          if-no-files-found: error
      - name: Publish digest
        run: echo "registry.re8ch.com/auth/user-hub:ui-${{ inputs.revision }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
