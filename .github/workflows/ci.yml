name: control-plane-ci
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full: {description: Run every domain, type: boolean, default: false}
permissions: {contents: read}
concurrency:
  group: control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      domains: ${{ steps.plan.outputs.domains }}
      tests: ${{ steps.plan.outputs.tests }}
      roots: ${{ steps.plan.outputs.roots }}
      submodules: ${{ steps.plan.outputs.submodules }}
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
      jobs: ${{ steps.plan.outputs.jobs }}
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: "${{ github.event_name == 'pull_request' && 2 || 0 }}"}
      - name: Prepare exact PR comparison history
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.sha }}
        run: bash operations/ci/prepare_event_diff.sh "$EVENT_BASE" "$EVENT_HEAD"
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2'
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          FORCE_FULL: ${{ inputs.full || 'false' }}
        run: |
          args=(--base "$BASE" --head "${{ github.sha }}")
          if [[ "$FORCE_FULL" == "true" ]]; then args+=(--full); fi
          python operations/ci/impact.py "${args[@]}" --plan-file "$RUNNER_TEMP/impact-plan/plan.json"
      - name: Upload complete impact plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impact-plan
          path: ${{ runner.temp }}/impact-plan/plan.json
          if-no-files-found: error
          retention-days: 14
      - run: |
          echo 'Complete impact plan: impact-plan artifact.' >> "$GITHUB_STEP_SUMMARY"
          python operations/ci/unit_catalog.py --plan-file "$RUNNER_TEMP/impact-plan/plan.json" --output "$RUNNER_TEMP/unit-selection/selection.json"
      - name: Upload unit selection observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-selection
          path: ${{ runner.temp }}/unit-selection/selection.json
          if-no-files-found: error
          retention-days: 14

  contract:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['contract']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: "${{ github.event_name == 'pull_request' && 2 || 0 }}"}
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2'
      - if: fromJSON(needs.impact.outputs.checks).workspace
        run: python operations/workspace-controller/workspace.py doctor
      - if: fromJSON(needs.impact.outputs.checks).helm_inventory
        run: python operations/releases/helmrelease_inventory.py --check
      - if: fromJSON(needs.impact.outputs.checks).commerce
        run: python operations/commerce/test_check_image_vulnerabilities.py

  # Production health is reported by k6-contracts.yml. A production outage
  # must not prevent merging the change that repairs it.
  k6-contracts:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['k6-contracts']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'pytest>=8.3'
      - name: Validate and test probe contracts offline
        run: |
          python operations/k6/validate.py
          python -m pytest -q tests/test_k6_contracts.py tests/test_k6_summary.py
      - name: Load k6 script without executing production probes
        run: |
          docker run --rm --network none \
            --env PROBE_VANTAGE=external --env PROBE_CADENCE=all \
            --volume "$PWD/clusters/re8ch/components/synthetic-monitoring:/work:ro" \
            --workdir /work \
            grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d \
            inspect smoke.js

  schema:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['schema']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - if: fromJSON(needs.impact.outputs.checks).fabric
        run: python operations/network/fabric/fabric_model.py check
      - if: fromJSON(needs.impact.outputs.checks).encrypted
        run: python operations/infrastructure-contract/compiler.py verify-encrypted
      - if: fromJSON(needs.impact.outputs.checks).schemas
        run: python tests/validate_schemas.py
      - if: fromJSON(needs.impact.outputs.checks).public_authority
        run: python operations/scripts/validate-r640-public-authority.py

  unit:
    permissions: {contents: read, actions: read}
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['unit']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v4.2.3}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24'}
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with: {kustomize-version: '5.7.1'}
      - name: Initialize selected product gitlinks
        env: {SUBMODULES: "${{ needs.impact.outputs.submodules }}"}
        run: |
          python - <<'PY' | xargs -r git submodule update --init --
          import json, os
          print(*json.loads(os.environ["SUBMODULES"]), sep="\n")
          PY
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8.3' 'schemathesis==4.29.1' 'cryptography==50.0.2'
      - name: Validate authenticated API acceptance runner
        run: node --test operations/plugin-capabilities/api-acceptance/runner.test.cjs
      - name: Download complete impact plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impact-plan
          path: ${{ runner.temp }}/impact-plan
      - name: Validate selected units using trusted main evidence
        env:
          UNIT_PLAN_FILE: ${{ runner.temp }}/impact-plan/plan.json
          GH_TOKEN: ${{ github.token }}
        run: python -m operations.ci.unit_pr --output "$RUNNER_TEMP/unit-observation"
      - name: Upload unit execution observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-observation
          path: ${{ runner.temp }}/unit-observation/
          if-no-files-found: warn
          retention-days: 14

  render:
    permissions: {contents: read, actions: read}
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['render']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2'
      - name: Locate successful main regression evidence
        id: baseline
        if: needs.impact.outputs.full != 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python operations/ci/render_evidence.py --find-baseline
      - name: Download trusted baseline
        if: steps.baseline.outputs.run_id != ''
        continue-on-error: true # Expiry or unavailable artifacts cause a fresh render.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-render-evidence
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/module-render-baseline-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify compiled domain bundles
        if: fromJSON(needs.impact.outputs.checks).domain_bundles
        run: python operations/releases/compile_domain_bundles.py --check
      - name: Verify federation ownership
        if: fromJSON(needs.impact.outputs.checks).federation
        run: python operations/flux-federation/validate.py
      - name: Render only affected deployable roots
        env: {ROOTS: "${{ needs.impact.outputs.roots }}"}
        run: |
          echo "$ROOTS" > "$RUNNER_TEMP/render-roots.json"
          python operations/ci/render_evidence.py --roots "$RUNNER_TEMP/render-roots.json" \
            --baseline "$RUNNER_TEMP/module-render-baseline-${{ github.run_id }}-${{ github.run_attempt }}/evidence.json" \
            --output "$RUNNER_TEMP/module-render-result/evidence.json"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python tests/check_no_plaintext_secrets.py

  dependency-review:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['dependency-review']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan dependencies for shared CI changes
        run: |
          install -d "$HOME/.cache/trivy"
          docker run --rm --volume "$PWD:/work:ro" --volume "$RUNNER_TEMP:/out" --volume "$HOME/.cache/trivy:/root/.cache/trivy" --workdir /work ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 fs --timeout 20m --scanners vuln --format json --output /out/trivy-dependencies.json .
          python operations/ci/check_dependency_vulnerabilities.py --report "$RUNNER_TEMP/trivy-dependencies.json" --baseline operations/ci/dependency-vulnerability-baseline.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: dependency-vulnerability-report, path: "${{ runner.temp }}/trivy-dependencies.json", if-no-files-found: error, retention-days: 14}

  supply-chain:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['supply-chain']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git submodule update --init catalogs/platform/modules/connectool/source
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'pytest>=8.3'
      - run: python -m pytest -q tests/test_connectool_delivery.py tests/test_tenant_release_signing.py

  policy:
    needs: impact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2'
      - name: Validate reviewed runner placement
        run: python tests/check_no_github_hosted_runners.py
      - if: contains(needs.impact.outputs.domains, 'control-plane') || needs.impact.outputs.full == 'true'
        run: |
          python operations/workspace-controller/workspace.py index --write
          git diff --exit-code -- indexes catalogs/platform/modules/service-backend/MEMORY.md

  tenant-select:
    needs: impact
    if: fromJSON(needs.impact.outputs.jobs)['tenant-select']
    runs-on: ubuntu-24.04
    outputs: {matrix: "${{ steps.select.outputs.matrix }}"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: "${{ github.event_name == 'pull_request' && 2 || 0 }}"}
      - name: Prepare exact PR comparison history
        if: github.event_name == 'pull_request'
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.sha }}
        run: bash operations/ci/prepare_event_diff.sh "$EVENT_BASE" "$EVENT_HEAD"
      - id: select
        env: {BASE: "${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}"}
        run: python operations/tenant-conformance/select.py --base "$BASE" --head "${{ github.sha }}"

  tenant-contract:
    needs: [impact, tenant-select]
    if: needs.tenant-select.result == 'success' && needs.tenant-select.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tenant-select.outputs.matrix) }}
    name: tenant / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v4.2.3}
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8.3'
      - run: python -m pytest -q ${{ matrix.tests }}

  control-plane-validate:
    name: control-plane-validate
    if: always()
    needs: [impact, contract, k6-contracts, schema, unit, render, secret-scan, dependency-review, supply-chain, policy, tenant-select, tenant-contract]
    runs-on: ubuntu-24.04
    steps:
      - env: {RESULTS: "${{ toJSON(needs) }}"}
        run: |
          python - <<'PY'
          import json, os
          failed = {k: v["result"] for k, v in json.loads(os.environ["RESULTS"]).items() if v["result"] not in {"success", "skipped"}}
          if failed: raise SystemExit(f"required jobs did not pass: {failed}")
          PY
