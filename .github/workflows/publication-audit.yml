name: Publication credential audit
on:
  workflow_dispatch: {}
permissions: {contents: read}
concurrency: {group: publication-audit, cancel-in-progress: false}
jobs:
  audit:
    if: github.ref == 'refs/heads/main' && github.actor == 'Woomou'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2, 3]}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: observer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        env: {NODE_USE_ENV_PROXY: '1'}
        with:
          app-id: ${{ vars.GITOPS_OBSERVER_APP_ID }}
          private-key: ${{ secrets.GITOPS_OBSERVER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
          permission-actions: read
      - name: Scan retained Actions records without printing credential material
        env:
          GH_TOKEN: ${{ steps.observer.outputs.token }}
          AUDIT_SHARD: ${{ matrix.shard }}
          AUDIT_SHARDS: 4
        run: bash operations/releases/cloud-view/audit-actions.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-audit-redacted-${{ matrix.shard }}
          path: ${{ runner.temp }}/publication-audit/reports
          retention-days: 7
          if-no-files-found: error
