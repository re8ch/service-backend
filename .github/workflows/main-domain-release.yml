name: main-domain-release
on:
  workflow_dispatch:
    inputs:
      contract: {description: Reviewed main-domain ReleaseContract path, type: string, required: true}
      reuse_digest: {description: Reuse an existing signed digest without rebuilding, type: string, default: ''}
      reuse_source_commit: {description: Exact certified build commit with identical contract and flat source, type: string, default: ''}
      reviewed_takeover: {description: Force only the reviewed deployment adoption in this signed contract, type: boolean, default: false}
      execute: {description: Execute through the bounded SSA executor, type: boolean, default: false}
      mode:
        description: Publish, reconcile accepted state, or clear a block using a certified existing bundle
        type: choice
        options: [publish, reconcile, reset]
        default: publish
concurrency:
  group: main-domain-release-${{ inputs.contract }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      domain: ${{ steps.profile.outputs.domain }}
      environment: ${{ steps.profile.outputs.environment }}
      audience: ${{ steps.profile.outputs.audience }}
      signer: ${{ steps.profile.outputs.signer }}
      release-id: ${{ steps.profile.outputs.release-id }}
      namespace: ${{ steps.profile.outputs.namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2'
      - name: Validate artifact reuse selection
        env: {MODE: '${{ inputs.mode }}', REUSE_DIGEST: '${{ inputs.reuse_digest }}', REUSE_SOURCE_COMMIT: '${{ inputs.reuse_source_commit }}'}
        run: |
          if [[ "$MODE" == reset ]]; then
            [[ -n "$REUSE_DIGEST" && -n "$REUSE_SOURCE_COMMIT" ]] || exit 1
          fi
          if [[ -n "$REUSE_DIGEST" || -n "$REUSE_SOURCE_COMMIT" ]]; then
            [[ ( "$MODE" == publish || "$MODE" == reset ) && "$REUSE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$REUSE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
      - id: profile
        env: {CONTRACT: '${{ inputs.contract }}'}
        run: python operations/releases/main_domain_profile.py --contract "$CONTRACT" --github-output "$GITHUB_OUTPUT"
  compile-sign:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'reconcile'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.validate.outputs.environment }}
    permissions: {contents: read, id-token: write, packages: write}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      reference: ${{ steps.publish.outputs.reference }}
      release-id: ${{ steps.publish.outputs.release-id }}
      namespace: ${{ steps.publish.outputs.namespace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          install-dir: ${{ runner.temp }}/cosign-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - id: publish
        env: {CONTRACT: '${{ inputs.contract }}', REUSE_DIGEST: '${{ inputs.reuse_digest }}', REUSE_SOURCE_COMMIT: '${{ inputs.reuse_source_commit }}'}
        run: |
          set -euo pipefail
          case "$CONTRACT" in contracts/releases/main-domain/*.yaml) ;; *) exit 1;; esac
          readarray -t fields < <(python - "$CONTRACT" <<'PY'
          import sys,yaml
          c=yaml.safe_load(open(sys.argv[1])); s=c["spec"]
          for value in (s["source"]["renderer"],s["source"]["path"],c["metadata"]["name"],s["target"]["namespace"],s["provenance"]["audience"],s["provenance"]["environment"],s["provenance"]["workflow"],s["authorityDomain"],s["provenance"]["signer"]): print(value)
          PY
          )
          [[ "${fields[0]}" == kustomize && "${fields[1]}" != /* && "${fields[1]}" != *..* ]]
          [[ "${fields[4]}" == '${{ needs.validate.outputs.audience }}' ]]
          [[ "${fields[5]}" == '${{ needs.validate.outputs.environment }}' ]]
          [[ "${fields[6]}" == .github/workflows/main-domain-release.yml ]]
          [[ "${fields[7]}" == '${{ needs.validate.outputs.domain }}' ]]
          [[ "${fields[8]}" == '${{ needs.validate.outputs.signer }}' ]]
          reference="oci://ghcr.io/re8ch/service-backend-release/${fields[2]}"
          verify_args=()
          if [[ -n "$REUSE_DIGEST" ]]; then
            [[ "$REUSE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            python operations/releases/verify_reuse_source.py --commit "$REUSE_SOURCE_COMMIT" --contract "$CONTRACT"
            verify_args+=(--certificate-github-workflow-sha "$REUSE_SOURCE_COMMIT")
            oci_digest="$REUSE_DIGEST"
          else
            kubectl kustomize "${fields[1]}" > "$RUNNER_TEMP/rendered.yaml"
            python operations/releases/unified_bundle.py --contract "$CONTRACT" --rendered "$RUNNER_TEMP/rendered.yaml" \
              --output "$RUNNER_TEMP/release.bundle" > "$RUNNER_TEMP/bundle-metadata.json"
            install -d "$RUNNER_TEMP/oci"; cp "$RUNNER_TEMP/release.bundle" "$RUNNER_TEMP/bundle-metadata.json" "$RUNNER_TEMP/oci/"
            flux push artifact "${reference}:run-${GITHUB_RUN_ID}" --path "$RUNNER_TEMP/oci" --reproducible \
              --source "https://github.com/${GITHUB_REPOSITORY}" --revision "main@sha1:${GITHUB_SHA}" \
              --annotations "delivery.re8ch.com/release-id=${fields[2]}" --output json > "$RUNNER_TEMP/oci-result.json"
            oci_digest="$(jq -r .digest "$RUNNER_TEMP/oci-result.json")"; immutable="${reference#oci://}@${oci_digest}"
            cosign sign --yes "$immutable"
          fi
          immutable="${reference#oci://}@${oci_digest}"
          cosign verify --certificate-identity '${{ needs.validate.outputs.signer }}' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${verify_args[@]}" "$immutable" >/dev/null
          {
            echo "digest=$oci_digest"
            echo "reference=$reference"
            echo "release-id=${fields[2]}"
            echo "namespace=${fields[3]}"
          } >> "$GITHUB_OUTPUT"
          jq -n --arg reference "$reference" --arg digest "$oci_digest" --arg releaseId "${fields[2]}" --arg namespace "${fields[3]}" \
            '{reference:$reference,digest:$digest,releaseId:$releaseId,namespace:$namespace,verified:true}' > main-domain-release-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'main-domain-release-${{ github.run_id }}', path: main-domain-release-evidence.json, retention-days: 30, if-no-files-found: error}
  execute:
    if: >-
      always() && !cancelled() && inputs.execute && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      ((inputs.mode == 'reconcile' && needs.compile-sign.result == 'skipped') ||
      (inputs.mode != 'reconcile' && needs.compile-sign.result == 'success'))
    needs: [validate, compile-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.validate.outputs.environment }}
    permissions: {contents: read, id-token: write, packages: read}
    env:
      # The executor refreshes OIDC tokens during SSA, after the login step.
      EXECUTOR_AUDIENCE: '${{ needs.validate.outputs.audience }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          install-dir: ${{ runner.temp }}/cosign-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Acquire exact OIDC identity and prove denials
        env:
          KUBE_API_CA: '${{ secrets.KUBE_API_CA_PEM }}'
          RELEASE_ID: '${{ needs.validate.outputs.release-id }}'
          TARGET_NAMESPACE: '${{ needs.validate.outputs.namespace }}'
        run: |
          set -euo pipefail
          printf '%s' "$KUBE_API_CA" > "$RUNNER_TEMP/re8ch-ca.crt"
          curl -fsS --get -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" --data-urlencode "audience=$EXECUTOR_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" > "$RUNNER_TEMP/oidc.json"
          token="$(jq -r .value "$RUNNER_TEMP/oidc.json")"; echo "::add-mask::$token"
          kubeconfig="$RUNNER_TEMP/executor.kubeconfig"
          kubectl config --kubeconfig "$kubeconfig" set-cluster re8ch-main --server=https://kube-api.re8ch.com:6443 \
            --certificate-authority="$RUNNER_TEMP/re8ch-ca.crt" --embed-certs=true
          kubectl config --kubeconfig "$kubeconfig" set-credentials release-executor --token="$token"
          kubectl config --kubeconfig "$kubeconfig" set-context release-executor --cluster=re8ch-main --user=release-executor
          kubectl config --kubeconfig "$kubeconfig" use-context release-executor
          export KUBECONFIG="$kubeconfig"
          state_name="$(python operations/releases/operation_materialize.py state-name --release-id "$RELEASE_ID")"
          test "$(kubectl auth can-i patch "configmap/$state_name" -n "$TARGET_NAMESPACE")" = yes
          for denied in "create configmaps -n $TARGET_NAMESPACE" "get secrets -n $TARGET_NAMESPACE" \
            'patch kustomizations.kustomize.toolkit.fluxcd.io -n flux-system' "get pods/log -n $TARGET_NAMESPACE" \
            "create serviceaccounts/token -n $TARGET_NAMESPACE" 'impersonate users'; do
            read -r -a request <<<"$denied"; test "$(kubectl auth can-i "${request[@]}")" = no
          done
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
      - name: Pull signed digest, resume durable state and reconcile
        env:
          CONTRACT: '${{ inputs.contract }}'
          OCI_REFERENCE: '${{ needs.compile-sign.outputs.reference }}'
          OCI_DIGEST: '${{ needs.compile-sign.outputs.digest }}'
          RELEASE_ID: '${{ needs.validate.outputs.release-id }}'
          TARGET_NAMESPACE: '${{ needs.validate.outputs.namespace }}'
          RELEASE_MODE: '${{ inputs.mode }}'
          REVIEWED_TAKEOVER: '${{ inputs.reviewed_takeover }}'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/executor-state"; install -d "$RUNNER_TEMP/pulled" "$root/state" "$root/results/$RELEASE_ID"
          state_name="$(python operations/releases/operation_materialize.py state-name --release-id "$RELEASE_ID")"
          kubectl get configmap "$state_name" -n "$TARGET_NAMESPACE" -o json > "$RUNNER_TEMP/state-cm.json"
          python operations/releases/operation_materialize.py hydrate --configmap "$RUNNER_TEMP/state-cm.json" --state-dir "$root" --release-id "$RELEASE_ID"
          if [[ "$RELEASE_MODE" == reconcile ]]; then
            python operations/releases/operation_materialize.py accepted-bundle --configmap "$RUNNER_TEMP/state-cm.json" \
              --contract "$CONTRACT" > "$RUNNER_TEMP/accepted-bundle.json"
            OCI_REFERENCE="$(jq -r .reference "$RUNNER_TEMP/accepted-bundle.json")"
            OCI_DIGEST="$(jq -r .digest "$RUNNER_TEMP/accepted-bundle.json")"
          fi
          immutable="${OCI_REFERENCE#oci://}@${OCI_DIGEST}"
          cosign verify --certificate-identity '${{ needs.validate.outputs.signer }}' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$immutable" >/dev/null
          flux pull artifact "${OCI_REFERENCE}@${OCI_DIGEST}" --output "$RUNNER_TEMP/pulled"
          takeover_args=(--action reconcile)
          if [[ "$RELEASE_MODE" == reset ]]; then takeover_args=(--action reset); fi
          if [[ "$REVIEWED_TAKEOVER" == true ]]; then
            if [[ "$RELEASE_MODE" != publish ]]; then exit 1; fi
            case "$RELEASE_ID" in
              main-data-storage-ops) takeover_object=apps/Deployment/ops/cloudbeaver ;;
              main-tenant-runtime-ai-operations) takeover_object=apps/Deployment/ai-operations/re8ch-cloud-platform ;;
              main-tenant-runtime-scheduling-system) takeover_object=apps/Deployment/scheduling-system/penrose-controller ;;
              *) echo 'No reviewed deployment takeover for this release' >&2; exit 1 ;;
            esac
            takeover_args=(--action force-reconcile --force-object "$takeover_object")
          fi
          python operations/releases/operation_materialize.py request --contract "$CONTRACT" --metadata "$RUNNER_TEMP/pulled/bundle-metadata.json" \
            --state-dir "$root" --reference "$OCI_REFERENCE" --digest "$OCI_DIGEST" --output "$RUNNER_TEMP/operation.json" "${takeover_args[@]}"
          executor_status=0
          python operations/releases/ssa_executor.py --contract "$CONTRACT" --operation "$RUNNER_TEMP/operation.json" \
            --bundle "$RUNNER_TEMP/pulled/release.bundle" --state-dir "$root" > "$RUNNER_TEMP/result.json" || executor_status=$?
          python operations/releases/operation_materialize.py state-patch --configmap "$RUNNER_TEMP/state-cm.json" \
            --state-dir "$root" --release-id "$RELEASE_ID" --result "$RUNNER_TEMP/result.json" --output "$RUNNER_TEMP/state-patch.json"
          if [[ -s "$RUNNER_TEMP/state-patch.json" ]]; then
            # The executor refreshes its own token; this outer kubectl still has the initial credential.
            python operations/releases/refresh_kubeconfig.py
            kubectl patch configmap "$state_name" -n "$TARGET_NAMESPACE" --type merge --patch-file "$RUNNER_TEMP/state-patch.json"
          fi
          if (( executor_status != 0 )); then exit "$executor_status"; fi
          jq -e '.outcome == "healthy" and .health.status == "healthy"' "$RUNNER_TEMP/result.json" >/dev/null
      - name: Preserve workflow failure evidence
        if: failure()
        run: |
          python -c 'import datetime as dt,json,os; print(json.dumps({"apiVersion":"delivery.re8ch.com/workflow-failure/v1alpha1","outcome":"failed","finishedAt":dt.datetime.now(dt.timezone.utc).isoformat(),"runId":os.environ.get("GITHUB_RUN_ID"),"job":os.environ.get("GITHUB_JOB"),"health":{"status":"unknown","reason":"workflow step failed; inspect this run before trusting older accepted state"}}))' > "$RUNNER_TEMP/workflow-failure.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: 'main-domain-release-result-${{ github.run_id }}', path: "${{ runner.temp }}/result.json\n${{ runner.temp }}/workflow-failure.json", retention-days: 30, if-no-files-found: warn}
