name: Scan pinned Commerce Go images

on:
  workflow_dispatch:
    inputs:
      commerce_digest:
        description: Immutable Commerce API image digest
        required: true
        type: string
      registry_digest:
        description: Immutable payment-registry image digest
        required: true
        type: string

permissions: {contents: read}

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python operations/commerce/test_check_image_vulnerabilities.py
      - name: Scan the two fixed Harbor repositories
        id: harbor
        continue-on-error: true
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          COMMERCE_DIGEST: ${{ inputs.commerce_digest }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
        run: |
          python operations/commerce/scan_harbor_images.py \
            "$COMMERCE_DIGEST" "$REGISTRY_DIGEST" scan-reports
      - name: Verify complete Harbor reports and vulnerability policy
        if: steps.harbor.outcome == 'success'
        run: |
          python operations/commerce/check_image_vulnerabilities.py harbor \
            scan-reports/processor-commerce-api.json \
            scan-reports/processor-payment-registry-api.json
      - name: Fallback to pinned Trivy when Harbor scanner is unavailable
        if: steps.harbor.outcome == 'failure'
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          COMMERCE_DIGEST: ${{ inputs.commerce_digest }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
        run: |
          mkdir -p scan-reports
          docker run --rm --env TRIVY_USERNAME --env TRIVY_PASSWORD \
            --volume "$PWD/scan-reports:/out" \
            ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --scanners vuln --format json --output /out/processor-commerce-api-trivy.json \
            "registry.re8ch.com/hyperswitch/processor-commerce-api@$COMMERCE_DIGEST"
          docker run --rm --env TRIVY_USERNAME --env TRIVY_PASSWORD \
            --volume "$PWD/scan-reports:/out" \
            ghcr.io/aquasecurity/trivy@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            image --scanners vuln --format json --output /out/processor-payment-registry-api-trivy.json \
            "registry.re8ch.com/hyperswitch/processor-payment-registry-api@$REGISTRY_DIGEST"
          python operations/commerce/check_image_vulnerabilities.py trivy \
            scan-reports/processor-commerce-api-trivy.json \
            scan-reports/processor-payment-registry-api-trivy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: commerce-go-harbor-scans
          path: scan-reports/*.json
          if-no-files-found: warn
