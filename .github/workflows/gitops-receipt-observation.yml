name: Observe accepted GitOps webhook receipts
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions: {contents: read}
concurrency:
  group: gitops-receipt-observation
  cancel-in-progress: false
jobs:
  receipts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      available: ${{ steps.scan.outputs.available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: scan
        env:
          APP_ID: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          APP_KEY: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
        run: ruby operations/github-maintenance/receipt_matrix.rb
  observe:
    needs: receipts
    if: needs.receipts.outputs.available == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.receipts.outputs.matrix) }}
    name: Observe ${{ matrix.owner }}/${{ matrix.repo }} · ${{ matrix.delivery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-actions: read
          permission-organization-projects: write
      - id: dispatch
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repo }}
          permission-actions: write
          permission-contents: read
      - id: executor
        env:
          GH_TOKEN: ${{ steps.dispatch.outputs.token }}
          DELIVERY: ${{ matrix.delivery }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          repo="$OWNER/$REPO"
          selection=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(ARGV.first).dig("jobs","record","strategy","matrix","include"))' .github/workflows/gitops-observation.yml)
          workflow=$(jq -er --arg repo "$REPO" '.[]|select(.repo==$repo)|.workflow' <<<"$selection")
          name="${workflow%.yml} $DELIVERY"
          args=(-f "inputs[delivery_id]=$DELIVERY")
          if [[ "$repo" == strata-silica/storage-gitops ]]; then
            name="Storage accepted reconcile $DELIVERY"
            args+=(-f 'inputs[release_id]=main-data-storage-toolhive-system')
          fi
          revision=$(gh api "repos/$repo/commits/main" --jq .sha)
          find_run() {
            gh api --paginate --slurp "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=100" |
              jq -r --arg name "$name" --arg revision "$revision" '[.[].workflow_runs[] |
                select(.display_title==$name and .actor.login=="re8ch-enterprise-maintenance[bot]") |
                select(.head_sha==$revision or .conclusion=="success" or .status!="completed")] | first.id // empty'
          }
          id=$(find_run)
          if [[ -z "$id" ]]; then
            gh api -X POST "repos/$repo/actions/workflows/$workflow/dispatches" -f ref=main -F return_run_details=false "${args[@]}"
            for retry in {1..12}; do
              id=$(find_run)
              [[ -z "$id" ]] || break
              sleep 5
            done
            test -n "$id"
          fi
          gh run watch "$id" --repo "$repo" --interval 10 || true
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ matrix.owner }}
          REPO: ${{ matrix.repo }}
          RECEIPT_EXECUTOR_ID: ${{ steps.executor.outputs.id }}
          DELIVERY: ${{ matrix.delivery }}
          RELEASE_ID: ${{ matrix.release }}
        run: |
          set -euo pipefail
          selection=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file(ARGV.first).dig("jobs","record","strategy","matrix","include"))' .github/workflows/gitops-observation.yml)
          export BOARD=$(jq -er --arg repo "$REPO" '.[]|select(.repo==$repo)|.project' <<<"$selection")
          export WORKFLOW=$(jq -er --arg repo "$REPO" '.[]|select(.repo==$repo)|.workflow' <<<"$selection")
          bash operations/github-maintenance/record-observation.sh
