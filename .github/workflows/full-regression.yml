name: full-regression
on:
  release:
    types: [published]
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: full-regression, cancel-in-progress: false}
jobs:
  regression:
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: git submodule update --init catalogs/platform/modules/connectool/source
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8.3' 'schemathesis==4.29.1'
      - run: |
          python operations/releases/compile_domain_bundles.py --check
          python operations/workspace-controller/workspace.py doctor
          python tests/validate_schemas.py
          python operations/scripts/validate-r640-public-authority.py
          python tests/check_no_plaintext_secrets.py
          python -m pytest -q
      - name: Render every owned Kustomize root
        run: |
          python operations/ci/impact.py --full --path README.md > "$RUNNER_TEMP/plan.json"
          python - <<'PY' > "$RUNNER_TEMP/render-roots.json"
          import json, os
          print(json.dumps(json.load(open(os.environ["RUNNER_TEMP"] + "/plan.json"))["roots"]))
          PY
          python operations/ci/render_evidence.py --roots "$RUNNER_TEMP/render-roots.json" \
            --output "$RUNNER_TEMP/module-render-result/evidence.json"
      - name: Publish successful main render evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-render-evidence
          path: ${{ runner.temp }}/module-render-result/evidence.json
          if-no-files-found: error
          retention-days: 14
