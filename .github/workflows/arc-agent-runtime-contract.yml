name: ARC agent runtime contract

on:
  pull_request:
    paths:
    - .github/workflows/arc-agent-runtime-contract.yml
    - clusters/re8ch/components/arc-agent-runtime/**
    - clusters/re8ch/domains/agent-runtime/**
    - operations/agent-runtime/**
  workflow_dispatch: {}

permissions: {contents: read, packages: read}

concurrency:
  group: arc-agent-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with: {persist-credentials: false}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with: {python-version: "3.13"}
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with: {version: v3.18.6}
    - name: Authenticate immutable ARC chart pulls
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username '${{ github.actor }}' --password-stdin
    - run: python -m pip install --require-hashes -r operations/agent-runtime/requirements.txt
    - run: operations/agent-runtime/render_arc_manifests.sh
    - run: git diff --exit-code -- clusters/re8ch/components/arc-agent-runtime/controller-rendered.yaml clusters/re8ch/components/arc-agent-runtime/runner-rendered.yaml
    - run: python operations/agent-runtime/verify_arc_agent_runtime.py
    - run: python operations/agent-runtime/test_verify_arc_agent_runtime.py
    - run: python operations/releases/compile_domain_bundles.py --check

