name: Transaction context intake

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: transaction-context-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.repository.full_name == 're8ch/service-backend'
    runs-on: ubuntu-24.04
    steps:
      - name: Mint bounded maintenance token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          NODE_USE_ENV_PROXY: '1'
        with:
          app-id: ${{ vars.GITOPS_ENTERPRISE_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_ENTERPRISE_MAINTENANCE_PRIVATE_KEY }}
          owner: re8ch
          repositories: service-backend
          permission-contents: read
          permission-issues: write
          permission-organization-projects: write
      - name: Check out trusted intake policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Apply transaction defaults
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: >-
          python operations/github-transaction-context/intake.py
          --repository '${{ github.repository }}'
          --issue '${{ github.event.issue.number }}'
