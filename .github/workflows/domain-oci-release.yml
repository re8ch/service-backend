name: domain-oci-release
on:
  workflow_dispatch:
    inputs:
      bootstrap: {description: Publish initial bundles and encrypted read-only registry credential, type: boolean, default: false}
      module: {description: Comma-separated activated module roots to explicitly republish, type: string, default: ''}
      revoke_orphan_run: {description: Revoke unused bootstrap robot from this exact failed run, type: string, default: ''}
  push:
    branches: [main]
    paths: ['platform/**', 'clusters/re8ch/components/**', 'clusters/re8ch/charts/**']
permissions: {contents: read, id-token: write}
concurrency: {group: domain-oci-production, cancel-in-progress: false}
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - uses: fluxcd/flux2/action@dede56a8fdcd1e0edca28630a979a51415bb56f8
        with: {version: '2.9.5'}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Install pinned SOPS
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o "$RUNNER_TEMP/sops"
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  $RUNNER_TEMP/sops" | sha256sum --check
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Publish private signed domain bundles
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
          BASE: ${{ github.event.before || 'HEAD' }}
          MODULE: ${{ inputs.module || '' }}
          ORPHAN_RUN: ${{ inputs.revoke_orphan_run || '' }}
        run: |
          args=(--output "$RUNNER_TEMP/domain-release" --base "$BASE")
          if [[ "$BOOTSTRAP" == true ]]; then args+=(--bootstrap); fi
          if [[ -n "$MODULE" ]]; then args+=(--module "$MODULE"); fi
          if [[ -n "$ORPHAN_RUN" ]]; then args+=(--revoke-orphan-run "$ORPHAN_RUN"); fi
          python operations/releases/domain_publish.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: signed-domain-release
          path: ${{ runner.temp }}/domain-release
          retention-days: 7
          if-no-files-found: error
      - name: Create scoped promotion token
        if: inputs.bootstrap != true
        id: promoter
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOMAIN_PROMOTER_APP_ID }}
          private-key: ${{ secrets.DOMAIN_PROMOTER_PRIVATE_KEY }}
          owner: re8ch
          repositories: service-backend
          permission-contents: write
          permission-pull-requests: write
      - name: Open signed digest-only PR and enable protected auto-merge
        if: inputs.bootstrap != true
        env: {GH_TOKEN: '${{ steps.promoter.outputs.token }}'}
        run: python operations/releases/promote.py "$RUNNER_TEMP/domain-release"
