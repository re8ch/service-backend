name: NodeContract observer

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [nodes, flux, config]
        default: nodes

concurrency:
  group: node-contract-observer-${{ inputs.scope || github.event.schedule }}
  cancel-in-progress: false

jobs:
  config:
    name: Restricted configuration validation
    env:
      NODE_USE_ENV_PROXY: '1'
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.scope == 'config'
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 5
    environment: cluster-observation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23'
      - name: Validate exact restricted version without exporting values
        env:
          CONTRACT_BUNDLE: ${{ secrets.INFRASTRUCTURE_CONTRACT_BUNDLE_GZ_B64 }}
        run: |
          set -euo pipefail
          private_dir="$(mktemp -d "$RUNNER_TEMP/config-debug.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          python operations/infrastructure-contract/bundle.py --output "$private_dir/contracts"
      - id: reporter
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_EXECUTOR_APP_ID }}
          private-key: ${{ secrets.GITOPS_EXECUTOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
          permission-contents: read
          permission-checks: write
      - name: Verify App access to signed template and publish bounded validation
        env:
          GH_TOKEN: ${{ steps.reporter.outputs.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')" = true
          python - <<'PY' | gh api "repos/$GITHUB_REPOSITORY/check-runs" --method POST --input - --silent
          import json, os
          print(json.dumps({"name":"restricted-config-validation", "head_sha":os.environ["GITHUB_SHA"], "status":"completed", "conclusion":"success", "output":{"title":"Restricted configuration validated", "summary":"Protected Environment source matches the signed template source digest and passes compiler validation. No configuration values are published. This check does not assert live cluster health."}}))
          PY

  observe:
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'nodes'))
    name: NodeContract live parity
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 10
    environment: cluster-observation
    permissions:
      contents: read
      id-token: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'cryptography==50.0.2'
      - name: Materialize confidential contracts in runner temporary storage
        env:
          CONTRACT_BUNDLE: ${{ secrets.INFRASTRUCTURE_CONTRACT_BUNDLE_GZ_B64 }}
          KUBE_API_CA: ${{ secrets.KUBE_API_CA_PEM }}
        run: |
          set -euo pipefail
          python operations/infrastructure-contract/bundle.py --output "$RUNNER_TEMP/infrastructure-contracts"
          python - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "re8ch-ca.crt"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w') as stream:
              stream.write(os.environ["KUBE_API_CA"])
          PY
      - name: Exchange GitHub OIDC token and observe Nodes
        id: parity
        run: |
          set -euo pipefail
          umask 077
          token_json="$RUNNER_TEMP/oidc.json"
          kubeconfig="$RUNNER_TEMP/node-observer.kubeconfig"
          observed="$RUNNER_TEMP/nodes.json"
          evidence="$RUNNER_TEMP/node-contract-evidence.json"
          cleanup() { rm -f "$token_json" "$kubeconfig" "$observed" "$RUNNER_TEMP/re8ch-ca.crt"; rm -rf "$RUNNER_TEMP/infrastructure-contracts"; }
          trap cleanup EXIT
          api_server="$(python -c 'import os,pathlib,yaml; c=yaml.safe_load((pathlib.Path(os.environ["RUNNER_TEMP"])/"infrastructure-contracts/cluster.yaml").read_text()); a=c["spec"]["api"]; print("https://{}:{}".format(a["publicFQDN"],a["publicPort"]))')"
          unauthenticated_status="$(curl --fail-with-body --silent --show-error \
            --cacert "$RUNNER_TEMP/re8ch-ca.crt" \
            --output /dev/null --write-out '%{http_code}' \
            "$api_server/api" 2>/dev/null || true)"
          if [[ "$unauthenticated_status" != "401" && "$unauthenticated_status" != "403" ]]; then
            echo "Public Kubernetes API did not fail closed (status: ${unauthenticated_status:-unreachable})" >&2
            exit 1
          fi
          python - <<'PY'
          import base64, json, os, pathlib, urllib.parse, urllib.request, yaml
          try:
              root = pathlib.Path(os.environ['RUNNER_TEMP'])
              api = yaml.safe_load((root / 'infrastructure-contracts/cluster.yaml').read_text())['spec']['api']
              parts = urllib.parse.urlsplit(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'])
              query = dict(urllib.parse.parse_qsl(parts.query))
              query['audience'] = 'https://' + api['publicFQDN'] + '/observer'
              url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.load(response)['value']
              config = {'apiVersion':'v1','kind':'Config','clusters':[{'name':'cluster','cluster':{'server':'https://{}:{}'.format(api['publicFQDN'], api['publicPort']),'certificate-authority-data':base64.b64encode((root/'re8ch-ca.crt').read_bytes()).decode()}}],'users':[{'name':'observer','user':{'token':token}}],'contexts':[{'name':'observer','context':{'cluster':'cluster','user':'observer'}}],'current-context':'observer'}
              descriptor = os.open(root/'node-observer.kubeconfig', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
              with os.fdopen(descriptor,'w') as stream:
                  json.dump(config,stream)
          except Exception:
              raise SystemExit('Restricted observation identity setup failed') from None
          PY
          if ! kubectl --kubeconfig "$kubeconfig" get nodes -o json > "$observed" 2>/dev/null; then
            echo 'Authenticated node observation failed; inspect through the protected platform interface' >&2
            exit 1
          fi
          python - "$observed" <<'PY'
          import json, os, pathlib, sys, yaml
          count = len(json.load(open(sys.argv[1], encoding="utf-8"))["items"])
          contract = yaml.safe_load((pathlib.Path(os.environ["RUNNER_TEMP"]) / "infrastructure-contracts/cluster.yaml").read_text())
          if count != contract["spec"]["expectedNodeCount"]:
              raise SystemExit("Observed node count differs from the pinned restricted configuration")
          PY

          expect_forbidden() {
            local label="$1"
            shift
            local stdout_file="$RUNNER_TEMP/${label}.stdout"
            local stderr_file="$RUNNER_TEMP/${label}.stderr"
            if "$@" >"$stdout_file" 2>"$stderr_file"; then
              echo "Observer unexpectedly passed denied operation: $label" >&2
              exit 1
            fi
            if ! grep -Eqi 'forbidden|cannot' "$stderr_file"; then
              echo "Observer denial probe returned an unexpected failure: $label" >&2
              exit 1
            fi
            rm -f "$stdout_file" "$stderr_file"
          }
          expect_forbidden secret-list kubectl --kubeconfig "$kubeconfig" get secrets --all-namespaces
          expect_forbidden pod-log kubectl --kubeconfig "$kubeconfig" logs -n default observer-deny-probe
          expect_forbidden pod-exec kubectl --kubeconfig "$kubeconfig" exec -n default observer-deny-probe -- true
          expect_forbidden token-request kubectl --kubeconfig "$kubeconfig" create token default -n default --duration=10m
          for denied in \
            'create deployments.apps -n default' \
            'patch nodes' \
            'delete nodes' \
            'impersonate users'; do
            read -r -a denial_request <<<"$denied"
            if [[ "$(kubectl --kubeconfig "$kubeconfig" auth can-i "${denial_request[@]}")" != "no" ]]; then
              echo "Observer unexpectedly authorized: $denied" >&2
              exit 1
            fi
          done
          set +e
          INFRASTRUCTURE_CONTRACT_DIR="$RUNNER_TEMP/infrastructure-contracts" \
            python operations/infrastructure-contract/compiler.py observe-diff "$observed" > "$evidence"
          parity_status=$?
          set -e
          echo "status=$parity_status" >> "$GITHUB_OUTPUT"
      - name: Encrypt evidence before crossing the public artifact boundary
        env:
          NODE_EVIDENCE_KEY: ${{ secrets.NODE_OBSERVATION_EVIDENCE_KEY }}
        run: |
          python operations/github-maintenance/node_contract_governance.py "$RUNNER_TEMP/node-contract-evidence.json" --seal "$RUNNER_TEMP/node-contract-evidence.fernet"
      - name: Upload encrypted evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-contract-evidence-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/node-contract-evidence.fernet
          if-no-files-found: error
          retention-days: 30
      - name: Enforce parity
        if: always()
        env: {PARITY_STATUS: "${{ steps.parity.outputs.status }}"}
        run: |
          if [[ -z "$PARITY_STATUS" ]]; then
            echo "Observation failed before sanitized evidence was produced" >&2
            exit 1
          fi
          exit "$PARITY_STATUS"
      - name: Remove private observation inputs after any outcome
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          shutil.rmtree(root / 'infrastructure-contracts', ignore_errors=True)
          for name in ('re8ch-ca.crt', 'node-observer.kubeconfig', 'oidc.json', 'nodes.json', 'node-contract-evidence.json', 'node-contract-evidence.fernet', 'secret-list.stdout', 'secret-list.stderr', 'pod-log.stdout', 'pod-log.stderr', 'pod-exec.stdout', 'pod-exec.stderr', 'token-request.stdout', 'token-request.stderr'):
              (root / name).unlink(missing_ok=True)
          PY

  governance:
    name: NodeContract governance
    env:
      NODE_USE_ENV_PROXY: '1'
    if: always() && needs.observe.result != 'cancelled' && needs.observe.result != 'skipped'
    needs: observe
    environment: cluster-observation
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: python -m pip install 'cryptography==50.0.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-contract-evidence-sealed-${{ github.run_id }}
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.GITOPS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.GITOPS_MAINTENANCE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
      - name: Reconcile deduplicated Issue and Project state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_EVIDENCE_KEY: ${{ secrets.NODE_OBSERVATION_EVIDENCE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITOPS_MAINTENANCE_PROJECT: "1"
        run: python operations/github-maintenance/node_contract_governance.py node-contract-evidence.fernet

  flux:
    name: Flux runtime evidence
    env:
      NODE_USE_ENV_PROXY: '1'
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '2-57/5 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'flux'))
    runs-on: [self-hosted, Linux, X64, restricted-node-6dc3f140f9, untrusted-build]
    timeout-minutes: 8
    environment: cluster-observation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - id: reporter
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.GITOPS_EXECUTOR_APP_ID }}
          private-key: ${{ secrets.GITOPS_EXECUTOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: service-backend
          permission-checks: write
      - name: Withdraw public resource inventory
        env:
          GH_TOKEN: ${{ steps.reporter.outputs.token }}
        run: node operations/releases/cloud-view/observe.mjs
