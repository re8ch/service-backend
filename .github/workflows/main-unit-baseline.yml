name: main-unit-baseline
on:
  push:
    branches: [main]
permissions: {contents: read, actions: read}
jobs:
  unit:
    runs-on: [self-hosted, Linux, X64, r640, untrusted-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: git submodule update --init catalogs/platform/modules/connectool/source
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with: {version: v1.33.1}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v4.2.3}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24'}
      - uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0
        with: {kustomize-version: '5.7.1'}
      - uses: ./.github/actions/setup-native-yaml
      - run: python -m pip install 'PyYAML>=6.0.2' 'jsonschema>=4.23' 'pytest>=8.3' 'schemathesis==4.29.1' 'cryptography==50.0.2'
      - name: Select changed units and validate latest main evidence
        env:
          BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python operations/ci/impact.py --base "$BASE" --head "$GITHUB_SHA" > "$RUNNER_TEMP/unit-plan.json"
          python -m operations.ci.unit_baseline --plan "$RUNNER_TEMP/unit-plan.json" --output "$RUNNER_TEMP/unit-baseline"
      - name: Upload actual execution and reuse decisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-observation
          path: ${{ runner.temp }}/unit-baseline/
          retention-days: 14
      - name: Publish unit success evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-success-evidence
          path: ${{ runner.temp }}/unit-baseline/evidence.json
          if-no-files-found: error
          retention-days: 14
