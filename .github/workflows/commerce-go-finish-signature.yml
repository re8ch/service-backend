name: Finish a built Commerce payment image signature

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed Cloud Functions master revision used by the existing image build
        required: true
        type: string
      commerce_digest:
        description: Already signed Commerce image digest from the same build
        required: true
        type: string
      registry_digest:
        description: Payment registry image digest whose signing failed after build
        required: true
        type: string

permissions: {contents: read, id-token: write}
concurrency: {group: commerce-go-release, cancel-in-progress: false}

jobs:
  finish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate immutable inputs
        env:
          REVISION: ${{ inputs.revision }}
          COMMERCE_DIGEST: ${{ inputs.commerce_digest }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
        run: |
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$COMMERCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$REGISTRY_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
      - name: Prepare isolated registry authentication
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/commerce-go-finish-docker"
          install -d -m 700 "$DOCKER_CONFIG"
          umask 077
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.re8ch.com
          username: ${{ secrets.HYPERSWITCH_REGISTRY_USERNAME }}
          password: ${{ secrets.HYPERSWITCH_REGISTRY_PASSWORD }}
      - name: Confirm source tags still resolve to built digests
        env:
          REVISION: ${{ inputs.revision }}
          COMMERCE_DIGEST: ${{ inputs.commerce_digest }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
        run: |
          commerce="$(docker buildx imagetools inspect "registry.re8ch.com/hyperswitch/processor-commerce-api:$REVISION" --format '{{json .Manifest}}' | jq -r .digest)"
          registry="$(docker buildx imagetools inspect "registry.re8ch.com/hyperswitch/processor-payment-registry-api:$REVISION" --format '{{json .Manifest}}' | jq -r .digest)"
          test "$commerce" = "$COMMERCE_DIGEST"
          test "$registry" = "$REGISTRY_DIGEST"
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          install-dir: ${{ runner.temp }}/cosign-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - name: Finish and verify only the missing signature
        env:
          COMMERCE_DIGEST: ${{ inputs.commerce_digest }}
          REGISTRY_DIGEST: ${{ inputs.registry_digest }}
        run: |
          commerce="registry.re8ch.com/hyperswitch/processor-commerce-api@$COMMERCE_DIGEST"
          registry="registry.re8ch.com/hyperswitch/processor-payment-registry-api@$REGISTRY_DIGEST"
          cosign verify --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/commerce-go-release.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$commerce" >/dev/null
          cosign sign --yes "$registry"
          cosign verify --certificate-identity 'https://github.com/re8ch/service-backend/.github/workflows/commerce-go-finish-signature.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$registry" >/dev/null
          printf '%s\n%s\n' "$commerce" "$registry" > commerce-go.images
          cat commerce-go.images >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-go-finished-${{ inputs.revision }}
          path: commerce-go.images
          if-no-files-found: error
      - name: Remove temporary registry authorization
        if: always()
        run: |
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" || true
