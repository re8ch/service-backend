apiVersion: workspace.re8ch.com/v1alpha2
kind: WorkspacePolicies
spec:
  branches: {agentPrefix: codex/}
  discovery: {requireGitHistory: true, autoPublish: false, ignoreDirty: false}
  lock: {updateMode: merge-request, trackDefaultBranch: true}
  checkout: {source: catalog-submodule, taskWorktrees: true, cleanupOnCompletion: true}
  writes:
    owned: github-pr
    collaboration: authorized-upstream-pr
    external: read-only
    archive: read-only
  credentials: {brokerRequired: true, exposeMaterial: false}
